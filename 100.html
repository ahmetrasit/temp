cinde gizli beslenme)", "Hans Wehr: evra = yakmak, tututurmak (ates); vera' = arka, ote, obur taraf; tevarra = gizlenmek, saklanmak", "Modern uzanti: atesleme, etkinlestirme, tetikleme — elektriksel atesleme, motor kivilcimi, dijital sinyal ateslemesi", "Gelecege donuk: elektriksel darbeler atesleven islemciler, atesleme sistemleri, gizli enerjiyi aktif desarjaardonusturen her mekanizma", "Anlamsal gerilim: kok ayni anda \"yakmak/aciga cikarmak (ates)\" VE \"gizlemek/arkasina saklanmak\" anlamina gelir — ates gizlilikTEN cikar, isik uretme eylemi sakliliga koklenmistir", "Kok kavram: gizli veya potansiyel bir durumdan aktif nedensellik yoluyla ates/isik/enerjinin ortaya cikmasi"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle feminine plural (muriyat) — fire-strikers", "count": "~1 ayah", "examples": [{"ref": "100:2", "arabic": "— this verse —", "english": "The sole occurrence of the active participle form muriyat in the entire Quran, making this a hapax legomenon for this specific morphological form. The IV form causative participle appears nowhere else in feminine plural.", "turkish": "Butun Kur'an'da ism-i fail bicimi muriyat'in tek gecisi, bu ozel morfolojik bicim icin hapax legomenon. IV. bab ettirgen ortaci baska hicbir yerde disil cogul olarak gecmez."}]}, {"label": "B. Form IV verb (awra) — causative fire-kindling", "count": "~4 ayahs", "examples": [{"ref": "36:80", "arabic": "ٱلَّذِى جَعَلَ لَكُم مِّنَ ٱلشَّجَرِ ٱلْأَخْضَرِ نَارًۭا فَإِذَآ أَنتُم مِّنْهُ تُوقِدُونَ", "english": "The One who made for you from the green tree fire, and then you kindle from it.", "turkish": "Sizin icin yesil agactan ates cikaran — sonra siz ondan yakyorsunuz."}]}, {"label": "C. Noun abstract (tawrat) and proper noun forms", "count": "~30 ayahs", "examples": [{"ref": "3:3", "arabic": "نَزَّلَ عَلَيْكَ ٱلْكِتَٰبَ بِٱلْحَقِّ مُصَدِّقًۭا لِّمَا بَيْنَ يَدَيْهِ وَأَنزَلَ ٱلتَّوْرَىٰةَ وَٱلْإِنجِيلَ", "english": "He sent down upon you the Book in truth, confirming what is before it, and He sent down the Torah (al-tawrat) and the Gospel.", "turkish": "Sana Kitab'i hakk ile indirdi, oncekini dogrulayarak, ve Tevrat'i ve Incil'i indirdi."}, {"ref": "5:44", "arabic": "إِنَّآ أَنزَلْنَا ٱلتَّوْرَىٰةَ فِيهَا هُدًۭى وَنُورٌۭ", "english": "Indeed, We sent down the Torah, in it guidance and light.", "turkish": "Biz Tevrat'i indirdik, onda hidayet ve nur vardir."}]}]}, "qiraat": [{"arabic": "المُورِيَاتِ", "translit": "al-mūriyyāti", "status": "Gramm", "type": "Vr", "note": "Some grammarians read with tashdid on the ya (murriyyat), intensifying the fire-production meaning", "noteTr": "Bazi gramerciler ya'yi seddeli okur (murriyyat), ates uretme anlamini yogunlastirir", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "q-d-h", "coRootAr": "ق د ح", "count": "1", "refs": "100:2", "note": "w-r-y (fire-kindling) paired with q-d-h (striking) — the cognate accusative relationship: the muriyat perform qadh. Fire-production and its percussive method in the same clause. IN THIS AYAH", "noteTr": "w-r-y (ates yakma) ile q-d-h (cakma) eslesmesi — mutlak meful iliskisi: muriyat qadh eylemini gerceklestirir. Ates uretimi ve onun darbe yontemi ayni cumlede. BU AYETTE"}], "critical": "al-muriyat is a hapax legomenon in its specific morphological form (Form IV active participle, feminine plural). The root w-r-y carries a fundamental semantic tension: concealment (wara'a = behind, to hide) AND fire-production (awra = to kindle). Classical lexicons (Lane, Lisan al-Arab) document both senses extensively — the fire-stick conceals fire within itself until struck, marrow is concealed within bone, fatness is concealed under skin. This CONCEALMENT → REVELATION duality is enacted in the oath: what was hidden (latent fire in hooves/flint) becomes manifest through striking. The Form IV causative (af'ala) emphasizes agency — these are not passive fire-bearers but active fire-producers. The feminine plural -at suffix is significant: it marks either the horses (feminine plural of non-human nouns) or abstract agents of fire-production. The definite article al- marks these as known/specific entities, not generic. Phonetically, mūriyāt contains the long vowels ū-ī-ā creating a sustained, rising sound that mimics the building of friction before the percussive qadhan. Classical lexicons also note wariya l-'azm (the bone became full of marrow) — concealed nourishment — extending the root's semantic field beyond fire to any hidden substance that fills or sustains. The Tawrat (Torah) connection through this root is notable: al-tawrat shares root w-r-y, potentially linking scripture to \"that which kindles light/guidance from concealment.\"", "criticalTr": "al-muriyat ozel morfolojik biciminde (IV. bab ism-i fail, disil cogul) hapax legomenon'dur. Kok w-r-y temel bir anlamsal gerilim tasir: gizleme (vera'e = arka, saklanmak) VE ates uretimi (evra = yakmak). Klasik sozlukler (Lane, Lisanu'l-Arab) her iki anlami ayrintili belgeler — cakmak tasi vurulana kadar icinde atesi gizler, ilik kemigin icinde gizlidir, semizlik derinin altinda gizlidir. Bu GIZLENME → ACIGA CIKMA ikiligi kasemde sahnelenir: gizli olan (toynakta/cakmak tasinda gizil ates) darbe yoluyla asikara cikar. IV. bab ettirgen (ef'ale) failligirvurgular — bunlar edilgen ates tasiyicilar degil aktif ates ureticileridir. Disil cogul -at eki anlamlidir: ya atlari (insan disi isimlerin disil cogulu) ya da soyut ates uretim faillerini isaretler. Marife el- takisi bunlarin bilinen/belirli varliklar oldugunu gosterir, genel degil. Fonetik olarak muriyat, u-i-a uzun unluleriyle qadhan'in darbesi oncesinde surtunmenin birikiminii taklit eden sureklibir yukselis sesi icerir. Klasik sozlukler ayrica veriye'l-azm'i (kemik ilikle doldu — gizli beslenme) kaydeder ve kokun anlam alanini atesin otesine dolduran veya besleyen her turlu gizli maddeye genisletir. Bu kok uzerinden Tevrat (al-tawrat) baglantisi dikkat cekicidir: al-tawrat w-r-y kokunu paylasir, potansiyel olarak kutsal yazilari \"gizlilikten isik/hidayet tututuran\" ile iliskilendirir.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "قَدْحًۭا", "translit": "qadḥan", "gloss": "striking (fire) / sparking / gouging", "glossTr": "cakma / kivilcim cikartma / oyma", "userNotes": "", "root": "ق د ح (q-d-h)", "grammar": "Gerund (masdar), indefinite accusative, functioning as maf'ul mutlaq (cognate accusative) — intensifying the action described by al-muriyat. The accusative case marks it as an adverbial modifier of manner.", "grammarTr": "Masdar, belirsiz mansub, mutlak meful islevi gorur — al-muriyat'in betimledigigeylemi pekistirir. Mansub hal, tarz zarfi olarak isaretler.", "semantics": ["فَعَلَ (fa'ala, I) qadaha: to strike fire (with a fire-stick), to produce sparks by percussion; qadaha l-zanda = he struck fire with the fire-stick", "Classical lexicon (Lane): qadaha = to strike fire; also to gouge out (an eye), to scoop/hollow out; al-qadh = a wooden bowl/cup (scooped/gouged from wood); al-qidh = the shaft of an arrow (stripped/gouged rod); also to draw lots (by shaking arrows in a cup)", "Classical lexicon (Lisan al-Arab): qadaha fi nasibihi = he diminished his share (gouging away); qadaha fi 'irdihi = he defamed/disparaged him (gouging at reputation); al-qadih = a defect/blemish in a date-stone or tooth; also al-qadh = thinness, emaciation (being \"hollowed out\")", "Hans Wehr: qadaha = to strike (fire), to spark; qadh = cup, goblet; also: to criticize sharply, to censure", "Semantic range: The root clusters around PERCUSSIVE REMOVAL — striking to produce (fire), gouging to hollow (cups, eyes), stripping to shape (arrows). All involve forceful extraction of material or energy.", "Modern: to spark, to ignite (engine), to trigger (electrical discharge); also sharp criticism (qadh fi = to criticize)", "Futuristic: any percussive energy-extraction process — from flint-sparking to piezoelectric ignition to data-triggering; the act of producing output through impact", "Core concept: forceful percussive action that extracts, produces, or hollows — striking fire from stone, gouging wood into cups, stripping branches into arrows"], "semanticsTr": ["فَعَلَ (fe'ale, I. bab) kadaha: ates cakmak (cakmak tasiyla), darbe ile kivilcim uretmek; kadaha'z-zende = cakmak tasiyla ates cakti", "Klasik sozluk (Lane): kadaha = ates cakmak; ayrica (goz) oymak, kasikmak/icini boaltmak; el-kadh = tahta kase/bardak (agactan oyulmus); el-kidh = ok safi (soyulmus/oyulmus cubuk); ayrica kura cekmek (oklari bardakta sallayarak)", "Klasik sozluk (Lisanu'l-Arab): kadaha fi nasibihi = payini azaltti (oyarak); kadaha fi irdihi = serefini lekeleadi/kucumsedi (itibari oyarak); el-kadih = hurma cekirdeginde veya diste kusur/leke; ayrica el-kadh = zayiflik, celimsizlik (\"icinin bosaltilmasi\")", "Hans Wehr: kadaha = (ates) cakmak, kivilcim cikarmak; kadh = kase, kadeh; ayrica: sert elestirmek, kinaamak", "Anlam alani: Kok DARBELI CIKARMA etrafinda kumelenir — uretmek icin vurmak (ates), icini boaltmak icin oymak (kase, goz), seklllendirmek icin soymak (ok). Tumunde malzeme veya enerjinin guclu cikarilmasi vardir.", "Modern: kivilcim cakmak, (motor) atesleme, (elektrik desarji) tetikleme; ayrica sert elestiri (kadh fi = elestirmek)", "Gelecege donuk: her turlu darbeli enerji cikarim sureci — cakmak tasi kivilcimindan piezoelektrik ateslemelye, veri tetiklemesine; darbe yoluyla cikti uretme eylemi", "Kok kavram: cikaran, ureten veya oyan guclu darbe eylemi — tastan ates cakma, agaci oyarak kase yapma, dallari soyarak ok yapma"], "occurrences": {"type": "all", "items": [{"ref": "100:2", "arabic": "— this verse —", "english": "The sole occurrence of q-d-h in the entire Quran, in any form. This is an absolute hapax legomenon — the root appears nowhere else. Its semantic field (striking fire, gouging, hollowing, lot-drawing) is attested only through classical lexicons, not through intra-Quranic cross-reference.", "turkish": "Butun Kur'an'da q-d-h kokununbher bicimde tek gecisi. Bu mutlak bir hapax legomenon — kok baska hicbir yerde gecmez. Anlam alani (ates cakma, oyma, boaultma, kura cekme) Kur'an ici capraz referansla degil yalnizca klasik sozluklerle dogrulanir."}]}, "qiraat": [], "cooccurrence": [{"coRoot": "w-r-y", "coRootAr": "و ر ي", "count": "1", "refs": "100:2", "note": "q-d-h (percussive striking) paired with w-r-y (fire-kindling/concealment) — the method and its result: striking produces the spark from what was concealed. IN THIS AYAH", "noteTr": "q-d-h (darbeli vurus) ile w-r-y (ates yakma/gizleme) eslesmesi — yontem ve sonucu: vurus gizlenmis olandan kivilcimi uretir. BU AYETTE"}], "critical": "qadhan is an ABSOLUTE hapax legomenon — the root q-d-h appears NOWHERE else in the Quran in any form. This makes classical lexicon consultation essential for understanding its full range. Lane's Lexicon documents an extraordinary semantic cluster: (1) striking fire from flint/fire-stick, (2) gouging out eyes, (3) scooping/hollowing wood into cups (qadh = wooden cup), (4) stripping branches into arrow shafts (qidh = arrow shaft), (5) drawing lots by shaking arrows in a cup, (6) defaming/disparaging someone (gouging at reputation), (7) a defect/blemish in a date-stone. ALL these senses share the concept of PERCUSSIVE EXTRACTION — applying force to remove, hollow, or produce. The cognate accusative construction (al-muriyat qadhan) is a maf'ul mutlaq that intensifies: \"striking with real striking\" / \"sparking with true sparking.\" The nunation (tanwin) on qadhan marks indefiniteness, which in Arabic can signal magnification (tankir li-l-ta'zim) — \"a GREAT striking.\" Phonetically, qadhan is percussive itself: the voiceless uvular stop q, followed by the dental d, followed by the pharyngeal h — three successive stops/fricatives that mimic the sharp impact of flint on stone. The root's absence from the rest of the Quran means its entire semantic weight falls on this single usage, concentrating all classical meanings into one oath-word. The connection to lot-drawing (qidh = arrow used in lots, qadaha = to draw lots) introduces an element of fate/destiny into the oath sequence — the sparks struck may also be lots cast.", "criticalTr": "qadhan MUTLAK bir hapax legomenon'dur — q-d-h koku Kur'an'da baska HICBIR yerde hicbir bicimde gecmez. Bu, tam anlam alani icin klasik sozluk danismasini zorunlu kilar. Lane's Lexicon olaganustu bir anlam kumesini belgeler: (1) cakmak tasi/ates cubugundan ates cakma, (2) goz oyma, (3) agaci oyarak kase yapma (kadh = tahta kase), (4) dallari soyarak ok safi yapma (kidh = ok safi), (5) oklari kasede sallayarak kura cekme, (6) birini yerme/kucumseme (itibari oyma), (7) hurma cekirdeginde kusur/leke. TUM bu anlamlar DARBELI CIKARIM kavramini paydasir — cikaarmak, boaltmak veya uretmek icin guc uygulamak. Mutlak meful yapisi (al-muriyat qadhan) pekistiricidir: \"gercek bir cakisla cakmak.\" qadhan'daki tenvin (tanwin) belirsizlik isaretler ki Arapca'da buyukluk ifade edebilir (tenkir li't-ta'zim) — \"BUYUK bir cakis.\" Fonetik olarak qadhan'in kendisi darbeldir: tonsuz kucuk dil duragi q, ardindan dis duragi d, ardindan faringal h — cakmak tasinin tasa carpismasinin keskin darbesini taklit eden uc ardisik durk/sizici. Kokun Kur'an'in geri kalanindan yoklugun tum anlamsal agirliginin bu tek kullanimda yogunlastigini gosterir, tum klasik anlamlari tek bir kasem kelimesinde yogunlastirir. Kura cekme baglantisi (kidh = kura'da kullanilan ok, kadaha = kura cekmek) kasem dizisine bir kader/mukadderat ogesi sokar — cakilan kivilcimlar ayni zamanda atilan kuralar da olabilir.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran use the hapax root q-d-h here rather than a more common fire-striking term? Does the root's associations with gouging, hollowing, and lot-drawing add layers to the oath?", "The root w-r-y means both \"to conceal\" and \"to kindle fire\" — does the oath invoke this paradox deliberately, suggesting that revelation (fire/light) emerges from concealment?", "The feminine plural muriyat is unique — are these specifically horses, or could they be abstract fire-producing agents (natural forces, celestial bodies, electrical phenomena)?", "Does the connection between w-r-y and al-tawrat (Torah) suggest a link between fire-kindling and scripture — both bringing light from hiddenness?", "The classical meaning of qadh as \"lot-drawing\" (shaking arrows in a cup) — does this introduce an element of fate/destiny into the oath sequence, alongside the physical sparking?", "Does qadhan's phonetic percussiveness (q-d-h: three successive stops) function as sound symbolism, the word itself performing the impact it describes?", "The root q-d-h also means \"defaming/disparaging\" (gouging at reputation) — could this create a dark undertone to the oath, connecting physical striking to verbal violence?", "In a modern/futuristic reading, could al-muriyat qadhan describe electrical discharge, piezoelectric ignition, or data processing — any system where latent energy is released through percussive triggering?", "The five-oath sequence (100:1-5) builds kinetically: running, sparking, raiding, dust-raising, penetrating. Is this escalation purely martial, or does it describe any process of forceful entry and transformation?", "Lane documents wariya l-'azm (bone filled with marrow) under w-r-y — does this \"concealed nourishment\" meaning add depth to the oath, suggesting that what produces fire also sustains life?"], "questionsTr": ["Kur'an neden burada daha yaygin bir ates cakma terimi yerine hapax kok q-d-h kullanir? Kokun oyma, boaultma ve kura cekme cagrisimlarikaseme katman ekler mi?", "Kok w-r-y hem \"gizlemek\" hem \"ates yakmak\" anlamina gelir — kasem bu paradoksu bilerek mi candirir, vahyin (ates/isik) gizlilikten ciktigini ima ederek?", "Disil cogul muriyat benzersizdir — bunlar ozellikle atlar mi, yoksa soyut ates ureticilerifailler mi olabilir (dogal gucler, gok cisimleri, elektriksel olaylar)?", "w-r-y ile et-Tevrat (Tora) arasindaki baglanti ates yakma ile kutsal yazi arasinda bir iliskiyi gosterir mi — ikisi de gizlilikten isik getiren?", "kadh'in klasik anlami \"kura cekme\" (oklari kasede sallama) — bu kasem dizisine fiziksel kivilcimin yaninda bir kader/mukadderat ogesi sokar mi?", "qadhan'in fonetik darbeliligi (q-d-h: uc ardisik durak) bir ses sembolizmi olarak mi isler, kelimenin kendisi betimledigi darbeyi gerceklestirerek?", "Kok q-d-h ayrica \"yerme/kucumseme\" (itibari oyma) anlamina da gelir — bu kaseme karanlik bir alt ton katabilir mi, fiziksel darbe ile sozlu siddeti birlestirerek?", "Modern/gelecege donuk okumada el-muriyat qadhan elektrik desarjini, piezoelektrik ateslemeyi veya veri islemeyi betimleyebilir mi — gizil enerjinin darbeli tetikleme ile salindigi her sistem?", "Bes kasem dizisi (100:1-5) kinetik olarak yukselir: kosu, kivilcim, baskin, toz kaldirma, dalma. Bu tirmanis salt askeri mi yoksa guclu giris ve donusumun her surecini mi betimler?", "Lane, w-r-y altinda veriye'l-azm'i (kemik ilikle doldu) belgeler — bu \"gizli beslenme\" anlami kaseme derinlik katar mi, ates uretenin ayni zamanda yasami besledigini ima ederek?"], "key": "100:2"}, "100:3": {"surah": 100, "ayah": 3, "arabic": "فَٱلْمُغِيرَٰتِ صُبْحًۭا", "transliteration": "fa-l-mughīrāti ṣubḥan", "readings": [{"text": "By the dawn-raiders — those that descend suddenly at morning: horses, warriors, or natural forces that strike at the threshold between darkness and light", "textTr": "Sabah baskıncılarına andolsun — karanlık ile aydınlık arasındaki eşikte aniden inen varlıklar: atlar, savaşçılar veya şafakta vuran doğal güçler", "rationale": "The fa- continues the oath sequence from 100:1-2. al-mughīrāt as Form IV active participle of gh-w-r (to descend/raid) denotes agents that descend upon a target suddenly. ṣubḥan as temporal adverb specifies dawn — the classical time for raids. The feminine plural -āt can refer to horses (khayl, feminine in Arabic) or any plural entity.", "rationaleTr": "fa- 100:1-2'den gelen yemin dizisini sürdürür. al-mughīrāt, gh-w-r (inmek/baskın yapmak) kökünün IV. bab ism-i fâili olarak hedefe aniden inen fâilleri ifade eder. ṣubḥan zaman zarfı olarak sabahı belirtir — baskınların klasik zamanı. Dişil çoğul -āt eki atlara (hayl, Arapçada dişil) veya herhangi bir çoğul varlığa işaret edebilir."}, {"text": "By those that alter/transform at dawn — entities that change their state or the state of others when morning breaks", "textTr": "Sabahleyin değiştiren/dönüştürenlere andolsun — sabah olduğunda hallerini veya başkalarının halini değiştiren varlıklar", "rationale": "Reading al-mughīrāt from root gh-y-r (to change/alter) in Form IV (aghāra = to cause change). This yields \"those that cause transformation at dawn\" — dawn itself being the moment of cosmic transformation from night to day. The entities that \"change\" at dawn can be celestial bodies, atmospheric conditions, or metaphorical agents of transformation.", "rationaleTr": "al-mughīrāt'ı gh-y-r (değiştirmek) kökünün IV. babından (aghāra = değişime sebep olmak) okuma. Bu \"sabah vakti dönüşüme sebep olanlar\" anlamını verir — şafağın kendisi geceden gündüze kozmik dönüşüm anıdır. Şafakta \"değiştiren\" varlıklar gök cisimleri, atmosferik koşullar veya mecazi dönüşüm fâilleri olabilir."}, {"text": "By the data-streams that surge at morning — information flows that descend/raid processing systems at dawn, the moment of system activation", "textTr": "Sabah akan veri akışlarına andolsun — şafakta, sistem etkinleşme anında işlem sistemlerine inen/baskın yapan bilgi akışları", "rationale": "Futuristic reading: mughīrāt as entities that \"descend upon\" a target (from gh-w-r) can include data raids, information surges, system queries that flood servers at activation time. ṣubḥan as the moment systems \"wake\" — startup, initialization. The oath sequence (running, sparking, raiding) maps onto boot sequences: processors activating, circuits firing, data loading.", "rationaleTr": "Gelecek okuması: mughīrāt bir hedefe \"inen\" varlıklar (gh-w-r'den) veri baskınlarını, bilgi dalgalarını, etkinleştirme anında sunuculara akan sistem sorgularını kapsayabilir. ṣubḥan sistemlerin \"uyandığı\" an — başlatma, ilklendirme. Yemin dizisi (koşma, kıvılcım çıkarma, baskın yapma) önyükleme dizilerine karşılık gelir: işlemciler etkinleşir, devreler ateşlenir, veri yüklenir."}, {"text": "By the things that enter depths at dawn — reading ghāra as \"to enter deeply, to penetrate\" rather than \"to raid\"; entities that plunge into something at morning", "textTr": "Şafakta derinlere girenlere andolsun — ghāra'yı \"baskın yapmak\" yerine \"derinlere girmek, nüfuz etmek\" olarak okuma; sabah vakti bir şeye dalanlara", "rationale": "Classical lexicons attest ghāra fī as \"to enter deeply into, to penetrate\" (Lane's: ghāra fī l-arḍ = sank/went deep into the ground; ghāra fī l-wādī = entered/descended into the valley). al-mughīrāt can thus denote entities that plunge deep — horses charging into enemy ranks, or dawn light penetrating darkness. ṣubḥan marks the moment of penetration.", "rationaleTr": "Klasik sözlükler ghāra fī'yi \"derinlere girmek, nüfuz etmek\" olarak kaydeder (Lane's: ghāra fī l-arḍ = yere battı/derine gitti; ghāra fī l-wādī = vadiye girdi/indi). al-mughīrāt bu durumda derinlere dalan varlıkları ifade edebilir — düşman saflarına dalan atlar veya karanlığa nüfuz eden şafak ışığı. ṣubḥan nüfuz etme anını belirtir."}, {"text": "By the jealous/possessive ones at morning — reading from gh-y-r as \"jealousy, protective zeal\" (ghayra/ghīra); entities driven by fierce protective instinct at dawn", "textTr": "Sabahleyin kıskanç/koruyucu olanlara andolsun — gh-y-r'den \"kıskançlık, koruyucu gayret\" (ghayra/ghīra) olarak okuma; şafakta şiddetli koruma içgüdüsüyle hareket edenlere", "rationale": "Lane's Lexicon attests ghīra/ghayra as \"jealousy, vehement protective zeal, sense of honor that drives to protect what is one's own.\" Form IV aghāra can mean \"to act with protective jealousy.\" al-mughīrāt as \"those that act with fierce protectiveness at dawn\" — mothers defending young, warriors defending territory, any entity that guards fiercely at the vulnerable dawn hour.", "rationaleTr": "Lane's Lexicon ghīra/ghayra'yı \"kıskançlık, şiddetli koruyucu gayret, kişinin kendine ait olanı korumaya iten namus duygusu\" olarak kaydeder. IV. bab aghāra \"koruyucu kıskançlıkla hareket etmek\" anlamına gelebilir. al-mughīrāt \"şafakta şiddetli koruyuculukla hareket edenler\" — yavrularını koruyan anneler, topraklarını savunan savaşçılar, savunmasız şafak saatinde şiddetle koruyan herhangi bir varlık."}], "structure": {"beats": [{"label": "Oath continuation: the dawn-raiders", "labelTr": "Yemin devamı: sabah baskıncıları", "lines": [{"arabic": "فَٱلْمُغِيرَٰتِ", "translit": "fa-l-mughīrāti", "english": "By the dawn-raiders", "turkish": "Sabah baskıncılarına andolsun"}, {"arabic": "صُبْحًۭا", "translit": "ṣubḥan", "english": "at dawn", "turkish": "sabahleyin"}]}], "summary": "This ayah is the third oath in a five-oath sequence (100:1-5). The fa- conjunction chains it to the preceding oaths: wa-l-'ādiyāti ḍabḥan (100:1, the panting runners), fa-l-mūriyāti qadḥan (100:2, the spark-strikers), fa-l-mughīrāti ṣubḥan (100:3, the dawn-raiders). The structure is uniform: definite feminine plural active participle + accusative temporal/manner adverb. The fa- indicates immediate sequence (ta'qīb) — each action follows directly from the previous: running leads to spark-striking leads to raiding at dawn. The temporal marker ṣubḥan (\"at dawn\") is the first explicit time reference in the sequence, grounding the previously abstract actions (running, sparking) in a concrete moment. The genitive case on al-mughīrāti continues the oath governance of the initial wa- from 100:1.", "summaryTr": "Bu ayet beş yeminlik dizinin üçüncüsüdür (100:1-5). fa- bağlacı onu önceki yeminlere zincirler: wa-l-'ādiyāti ḍabḥan (100:1, nefes nefese koşanlar), fa-l-mūriyāti qadḥan (100:2, kıvılcım çıkaranlar), fa-l-mughīrāti ṣubḥan (100:3, sabah baskıncıları). Yapı tek biçimlidir: belirli dişil çoğul ism-i fâil + mansub zaman/durum zarfı. fa- dolaysız ardışıklık (ta'kīb) bildirir — her eylem doğrudan öncekinden doğar: koşma kıvılcım çıkarmaya, kıvılcım çıkarma şafak baskınına götürür. ṣubḥan (\"şafakta\") zaman zarfı dizideki ilk açık zaman göndermesidir ve önceki soyut eylemleri (koşma, kıvılcım) somut bir ana yerleştirir. al-mughīrāti'deki mecrur hal 100:1'deki baştaki wa-'nın yemin yönetimini sürdürür."}, "words": [{"id": 1, "arabic": "فَ", "translit": "fa", "gloss": "then, and so, thereupon", "glossTr": "ve böylece, ardından, bunun üzerine", "userNotes": "", "root": "— (particle)", "grammar": "Conjunction (ḥarf 'aṭf) functioning as ta'qīb (immediate sequence) — chains this oath to the previous oath in 100:2. The fa- indicates that the action of this oath follows directly and immediately from the preceding action. In oath sequences, fa- creates a narrative progression rather than mere listing.", "grammarTr": "Bağlaç (harf-i atıf) ta'kīb (dolaysız ardışıklık) işleviyle — bu yemini 100:2'deki önceki yemine zincirler. fa- bu yeminin eyleminin doğrudan ve derhal önceki eylemden doğduğunu bildirir. Yemin dizilerinde fa- salt sıralama yerine anlatısal ilerleme yaratır.", "semantics": ["تعقيب (ta'qīb): immediate sequence — \"then, thereupon, and so\" — the next event follows directly from the previous", "سببية (sababiyya): causation — \"therefore, thus\" — the preceding event causes the next", "In oath sequences, fa- creates escalation: each sworn entity builds on the previous, forming a narrative arc rather than a flat list", "Core concept: immediate consequential connection between events"], "semanticsTr": ["تعقيب (ta'kīb): dolaysız ardışıklık — \"ardından, bunun üzerine, ve böylece\" — sonraki olay doğrudan öncekinden doğar", "سببية (sebebiyye): nedensellik — \"bu yüzden, dolayısıyla\" — önceki olay sonrakine sebep olur", "Yemin dizilerinde fa- tırmandırma yaratır: yemin edilen her varlık öncekinin üzerine kurularak düz bir liste yerine anlatısal bir yay oluşturur", "Kök kavram: olaylar arasında dolaysız sonuçsal bağlantı"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The fa- here is the third in a chain (100:1 wa-, 100:2 fa-, 100:3 fa-). The initial wa- establishes the oath; the subsequent fa- particles create a temporal-causal progression: running → spark-striking → dawn-raiding. This is not coordination ('aṭf in the sense of equal listing) but narrative escalation. Each fa- marks a new phase in a single continuous action sequence. The phonetic shift from the heavy wa- opening to the light fa- continuations mirrors the acceleration of the action — from initial heavy galloping to rapid sequential movements.", "criticalTr": "Buradaki fa- bir zincirin üçüncüsüdür (100:1 wa-, 100:2 fa-, 100:3 fa-). Baştaki wa- yemini kurar; ardından gelen fa- edatları zamansal-nedensel bir ilerleme yaratır: koşma → kıvılcım çıkarma → şafak baskını. Bu eşit sıralama anlamında atıf değil, anlatısal tırmandırmadır. Her fa- tek bir sürekli eylem dizisinde yeni bir evre işaretler. Ağır wa- açılışından hafif fa- devamlarına fonetik geçiş eylemin ivmelenmesini yansıtır — başlangıçtaki ağır dörtnaldan hızlı ardışık hareketlere."}, {"id": 2, "arabic": "ٱلْمُغِيرَٰتِ", "translit": "al-mughīrāti", "gloss": "the dawn-raiders, the ones that descend suddenly, the ones that charge/attack", "glossTr": "sabah baskıncıları, aniden inenler, hücum edenler", "userNotes": "", "root": "غ و ر / غ ي ر (gh-w-r / gh-y-r) [DISPUTED]", "grammar": "Definite feminine plural active participle (ism fā'il, mu-pattern indicating Form IV), genitive case (majrūr) governed by the oath particle wa- from 100:1. Form IV of gh-w-r: aghāra / yughīru = to raid, to descend suddenly upon. The feminine plural -āt suffix can refer to horses (khayl, grammatically feminine), mares specifically, or any feminine plural entities. MASAQ maps this to gh-y-r (to change), but classical grammarians unanimously derive مُغِيرَات from gh-w-r (to raid/descend). The Form IV active participle mu-pattern (مُفْعِل) from gh-w-r yields mughīr; from gh-y-r it would yield mughīr as well (since both have identical Form IV conjugation), but the semantic fields diverge completely.", "grammarTr": "Belirli dişil çoğul ism-i fâil (mu- kalıbı IV. babı gösterir), mecrur halde 100:1'deki wa- yemin edatının yönetiminde. gh-w-r kökünün IV. babı: aghāra / yughīru = baskın yapmak, aniden üzerine inmek. Dişil çoğul -āt eki atlara (hayl, dilbilgisel olarak dişil), özellikle kısraklara veya herhangi bir dişil çoğul varlığa gönderebilir. MASAQ bunu gh-y-r (değiştirmek) köküne eşler, ancak klasik dilciler مُغِيرَات'ı oybirliğiyle gh-w-r (baskın yapmak/inmek) kökünden türetir. IV. bab ism-i fâil mu- kalıbı (مُفْعِل) gh-w-r'den mughīr verir; gh-y-r'den de mughīr verir (her ikisinin IV. bab çekimi aynı olduğundan), ancak anlam alanları tamamen ayrışır.", "semantics": ["ROOT 1 — غ و ر (gh-w-r): to descend, to sink, to go deep; to raid/attack suddenly", "أَغَارَ (aghāra, IV): to make a raid, to descend suddenly upon an enemy; to launch a surprise attack — the primary classical meaning for this ayah", "غَارَ (ghāra, I): to sink into the ground (of water); to go deep into; to enter a cave (ghār); to be jealous (ghāra 'alā = was jealous/protective of)", "غَوْر (ghawr): depth, bottom, low-lying land; sunken water; the act of sinking or going deep — Lane's: \"the lowest part of anything\"", "غَار (ghār): cave, cavern, hollow — a place of descent/depth (9:40, the cave of Thawr)", "مَغَارَة (maghāra): cave, grotto, underground refuge — a place one descends into (9:57)", "Classical (Lane's): ghāra also means \"he watered\" (ghāra ahl-ahu = he provided water for his family); and ghāra = \"he acted with jealousy/protective zeal\" (ghīra/ghayra)", "Classical (Lisan al-Arab): al-ighāra = the sudden descent, the raid; also: the act of driving camels or horses to water at speed; the rush, the charge", "Classical (Hans Wehr): ghāra = to sink, subside; aghāra = to attack, raid, make an incursion; ghāra fī = to penetrate, delve into", "ROOT 2 — غ ي ر (gh-y-r): to change, alter, transform; other than, different from", "غَيَّرَ (ghayyara, II): to change, alter, modify — \"God does not change (yughayyiru) a condition of a people until they change (yughayyirū) what is in themselves\" (8:53, 13:11)", "أَغَارَ (aghāra, IV from gh-y-r): to cause change/alteration — if this root applies, al-mughīrāt = \"those that cause transformation\"", "غَيْرَة / غِيرَة (ghayra/ghīra): jealousy, protective zeal, sense of honor — Lane's: \"vehemence of feeling when one's sanctity is violated\"", "Classical (Lane's): ghayr = other than, different from, not; also: change, exchange; also used as an exceptive particle", "Modern: cyber-raid, data incursion, system penetration — mughīr as any entity that descends suddenly on a target system", "Futuristic: algorithmic descent — AI agents that \"raid\" data environments, extract information at activation time; descending into data depths as horses descend into valleys", "Core concept: sudden descent upon a target — whether as military raid, water sinking into earth, or entry into a depth/cave; the violence and speed of downward motion toward a vulnerable point"], "semanticsTr": ["KOK 1 — غ و ر (gh-w-r): inmek, batmak, derine gitmek; aniden baskın yapmak", "أَغَارَ (aghāra, IV. bab): baskın yapmak, düşmanın üzerine aniden inmek; ani saldırı başlatmak — bu ayet için temel klasik anlam", "غَارَ (ghāra, I. bab): yere batmak (su hakkında); derine gitmek; mağaraya girmek (ghār); kıskanmak (ghāra 'alā = kıskandı/koruyucu davrandı)", "غَوْر (ghawr): derinlik, dip, çukur arazi; batmış su; batma veya derine gitme eylemi — Lane's: \"herhangi bir şeyin en alt kısmı\"", "غَار (ghār): mağara, kovuk, oyuk — inme/derinlik yeri (9:40, Sevr mağarası)", "مَغَارَة (maghāra): mağara, yeraltı sığınağı — içine inilen yer (9:57)", "Klasik (Lane's): ghāra ayrıca \"su vermek\" anlamına gelir (ghāra ahl-ahu = ailesine su sağladı); ve ghāra = \"kıskançlık/koruyucu gayretle hareket etti\" (ghīra/ghayra)", "Klasik (Lisanü'l-Arab): al-ighāra = ani iniş, baskın; ayrıca: develeri veya atları hızla suya sürme eylemi; hamle, hücum", "Klasik (Hans Wehr): ghāra = batmak, çökmek; aghāra = saldırmak, baskın yapmak, akın düzenlemek; ghāra fī = nüfuz etmek, derinlere dalmak", "KOK 2 — غ ي ر (gh-y-r): değiştirmek, dönüştürmek; -den başka, farklı", "غَيَّرَ (ghayyara, II. bab): değiştirmek, dönüştürmek — \"Allah bir kavmin durumunu onlar kendilerinde olanı değiştirmedikçe (yughayyirū) değiştirmez (yughayyiru)\" (8:53, 13:11)", "أَغَارَ (aghāra, IV. bab, gh-y-r'den): değişime sebep olmak — bu kök geçerliyse, al-mughīrāt = \"dönüşüme sebep olanlar\"", "غَيْرَة / غِيرَة (ghayra/ghīra): kıskançlık, koruyucu gayret, namus duygusu — Lane's: \"kutsallık ihlal edildiğinde duyulan şiddetli his\"", "Klasik (Lane's): ghayr = -den başka, farklı, değil; ayrıca: değişim, değiş tokuş; istisna edatı olarak da kullanılır", "Modern: siber baskın, veri sızması, sistem penetrasyonu — mughīr bir hedef sisteme aniden inen herhangi bir varlık olarak", "Gelecek: algoritmik iniş — etkinleştirme zamanında veri ortamlarına \"baskın yapan\", bilgi çıkaran yapay zeka ajanları; atların vadilere inişi gibi veri derinliklerine iniş", "Kök kavram: hedefe ani iniş — askeri baskın, yere batan su veya derinliğe/mağaraya giriş olarak; savunmasız bir noktaya doğru aşağı yönlü hareketin şiddeti ve hızı"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Sinking/sunken water (ADJ_QUALIT from gh-w-r) — water disappearing into the ground", "count": "~2 ayahs", "examples": [{"ref": "18:41", "arabic": "أَوْ يُصْبِحَ مَآؤُهَا غَوْرًۭا فَلَن تَسْتَطِيعَ لَهُۥ طَلَبًۭا", "english": "Or its water becomes ghawran (sunken/unreachable), and you will never be able to seek it out", "turkish": "Yahut suyu ghawran (batmış/ulaşılmaz) olur da onu asla arayamazsın"}, {"ref": "67:30", "arabic": "قُلْ أَرَءَيْتُمْ إِنْ أَصْبَحَ مَآؤُكُمْ غَوْرًۭا فَمَن يَأْتِيكُم بِمَآءٍۢ مَّعِينٍۭ", "english": "Say: Have you considered — if your water becomes ghawran (sunken), who then will bring you flowing water?", "turkish": "De ki: Görüşünüz nedir — suyunuz ghawran (batmış) olsa, size akan suyu kim getirebilir?"}]}, {"label": "B. Cave/refuge (NOUN_CONCRETE from gh-w-r) — places of descent and shelter", "count": "~2 ayahs", "examples": [{"ref": "9:40", "arabic": "إِذْ هُمَا فِى ٱلْغَارِ", "english": "When the two of them were in al-ghār (the cave)", "turkish": "İkisi al-ghār'da (mağarada) iken"}, {"ref": "9:57", "arabic": "لَوْ يَجِدُونَ مَلْجَـًٔا أَوْ مَغَٰرَٰتٍ أَوْ مُدَّخَلًۭا", "english": "If they could find a refuge, or maghārāt (caves), or an entrance", "turkish": "Bir sığınak, yahut maghārāt (mağaralar), yahut bir girinti bulsalar"}]}, {"label": "C. Changer/alterer (NOUN_ACTIVE_PART from gh-y-r) — one who changes conditions", "count": "~2 ayahs", "examples": [{"ref": "8:53", "arabic": "ذَٰلِكَ بِأَنَّ ٱللَّهَ لَمْ يَكُ مُغَيِّرًۭا نِّعْمَةً أَنْعَمَهَا عَلَىٰ قَوْمٍ حَتَّىٰ يُغَيِّرُوا۟ مَا بِأَنفُسِهِمْ", "english": "That is because God would not be mughayyiran (one who changes) a blessing He bestowed upon a people until they change what is in themselves", "turkish": "Bu, Allah'ın bir kavme verdiği nimeti onlar kendilerinde olanı değiştirmedikçe mughayyiran (değiştirici) olmayacağındandır"}]}, {"label": "D. \"Other than\" / exclusion (NOUN_ABSTRACT from gh-y-r) — marking exception or difference", "count": "~112 ayahs", "examples": [{"ref": "1:7", "arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ", "english": "The path of those You have blessed — ghayri (other than / not) those upon whom is wrath, nor those who are astray", "turkish": "Nimet verdiklerinin yolunu — ghayri (değil/dışında) gazaba uğrayanların ve sapıtanların değil"}, {"ref": "2:61", "arabic": "وَيَقْتُلُونَ ٱلنَّبِيِّۦنَ بِغَيْرِ ٱلْحَقِّ", "english": "And they killed the prophets bi-ghayri l-ḥaqqi (without right / other than what is right)", "turkish": "Ve peygamberleri bi-ghayri l-haqq (haksız yere / hak dışında) öldürüyorlardı"}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "s-b-h", "coRootAr": "ص ب ح", "count": "2", "refs": "6:100;52:43", "note": "gh-y-r (change/other) co-occurs with s-b-h (morning) in 6:100 and 52:43 — both involve declaring God's transcendence (subḥānahu) combined with \"other than\" (ghayr). In this ayah, the \"raider\" and \"dawn\" appear together directly ← IN THIS AYAH", "noteTr": "gh-y-r (değişim/başka) kökü s-b-h (sabah) ile 6:100 ve 52:43'te birlikte geçer — her ikisinde Allah'ın aşkınlığının tenzih edilmesi (subḥānahu) \"başka\" (ghayr) ile birleşir. Bu ayette \"baskıncı\" ve \"sabah\" doğrudan bir arada görünür ← BU AYETTE"}, {"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "12", "refs": "1:7;1:7;4:119;5:77;6:119;6:140;6:144;7:53;16:25;28:50", "note": "gh-y-r (other than) frequently co-occurs with d-l-l (going astray) — the \"other than the right path\" construction; semantic link between deviation and otherness", "noteTr": "gh-y-r (başka) kökü d-l-l (sapma) ile sıkça birlikte geçer — \"doğru yoldan başka\" yapısı; sapma ve ötekiliğin anlamsal bağlantısı"}, {"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "8", "refs": "1:7;1:7;4:119;5:1;5:3;8:53;31:20;35:3", "note": "gh-y-r co-occurs with n-'-m (blessing/favor) — especially in 8:53 where God does not change a blessing until they change themselves; blessing and alteration are semantically paired", "noteTr": "gh-y-r kökü n-'-m (nimet) ile birlikte geçer — özellikle 8:53'te Allah bir nimeti onlar kendilerini değiştirmedikçe değiştirmez; nimet ve değişim anlamsal olarak eşleşir"}], "critical": "ROOT DISPUTE: MASAQ assigns this word to غ ي ر (gh-y-r, \"to change, other than\") with 154 occurrences, but classical Arabic grammarians (Sībawayh, al-Zamakhsharī, Ibn Kathīr the grammarian) unanimously derive al-mughīrāt from غ و ر (gh-w-r, \"to descend, to raid\") in Form IV. The Form IV active participle مُغِير (mughīr) is morphologically identical from both roots, since the middle radical (wāw or yā') is absorbed into the vowel pattern. This homophony makes the dispute linguistically genuine. However, the semantic context of Surah 100 — running horses (100:1), striking sparks with hooves (100:2), raiding at dawn (100:3) — overwhelmingly supports gh-w-r (\"to raid\") rather than gh-y-r (\"to change\"). The root cache for gh-w-r shows only 4 Quranic occurrences (ghawran = sunken water in 18:41 and 67:30; ghār = cave in 9:40; maghārāt = caves in 9:57), none in Form IV, making 100:3 the ONLY Quranic instance of Form IV aghāra. This hapax legomenon status for the Form IV is itself noteworthy — the Quran uses the Form IV \"to raid\" exactly once. Classical lexicons (Lane's, Lisan al-Arab) extensively document aghāra 'alā as \"to make a sudden raid upon\" — a well-attested classical usage even if the Quran employs it only here. The phonetic-semantic texture is significant: the غ (ghayn, deep fricative) followed by ī (long high vowel) followed by rāt (rolling r + feminine plural) produces a sound of rushing descent — the heavy ghayn plunging into the high ī and cascading through the rāt, mirroring the physical action of a dawn raid.", "criticalTr": "KOK TARTIŞMASI: MASAQ bu kelimeyi غ ي ر (gh-y-r, \"değiştirmek, -den başka\") köküne 154 geçişle eşler, ancak klasik Arap dilcileri (Sîbeveyhi, Zemahşerî, dilci İbn Kesîr) al-mughīrāt'ı oybirliğiyle غ و ر (gh-w-r, \"inmek, baskın yapmak\") kökünün IV. babından türetir. IV. bab ism-i fâil مُغِير (mughīr) her iki kökten morfolojik olarak aynıdır, çünkü ortadaki harf (vâv veya yâ) ünlü kalıbına emilir. Bu eşseslilik tartışmayı dilbilimsel olarak gerçek kılar. Ancak Surah 100'ün anlamsal bağlamı — koşan atlar (100:1), tırnaklarla kıvılcım çıkarma (100:2), şafakta baskın (100:3) — ezici şekilde gh-w-r'yi (\"baskın yapmak\") gh-y-r (\"değiştirmek\") yerine destekler. gh-w-r kök önbelleği yalnızca 4 Kur'ani geçiş gösterir (ghawran = batmış su 18:41 ve 67:30; ghār = mağara 9:40; maghārāt = mağaralar 9:57), hiçbiri IV. babda, bu da 100:3'ü IV. bab aghāra'nın TEK Kur'ani örneği yapar. Form IV'ün bu hapax legomenon durumu başlı başına dikkat çekicidir — Kur'an IV. bab \"baskın yapmak\"ı tam bir kez kullanır. Klasik sözlükler (Lane's, Lisanü'l-Arab) aghāra 'alā'yı \"aniden baskın yapmak\" olarak kapsamlı şekilde belgeler — Kur'an yalnızca burada kullansa da iyi kanıtlanmış klasik bir kullanımdır. Fonetik-anlamsal doku önemlidir: غ (gayn, derin sürtünmeli) ardından ī (uzun yüksek ünlü) ardından rāt (titreşimli r + dişil çoğul) acele inişin sesini üretir — ağır gayn yüksek ī'ye dalarak rāt'tan şelale gibi akar, şafak baskınının fiziksel eylemini yansıtır.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "صُبْحًۭا", "translit": "ṣubḥan", "gloss": "at dawn, in the morning, at daybreak", "glossTr": "sabahleyin, şafakta, tan ağarırken", "userNotes": "", "root": "ص ب ح (ṣ-b-ḥ)", "grammar": "Accusative noun (manṣūb) functioning as adverb of time (ẓarf zamān) or ḥāl (circumstantial accusative) — \"raiding at dawn\" or \"while it was dawn.\" The tanwīn (nunation) marks it as indefinite, suggesting \"a dawn\" (any dawn) rather than \"the dawn\" (a specific one). The accusative case governs its adverbial function. Morphologically, ṣubḥ is a maṣdar (verbal noun) from Form I ṣabaḥa, used here as a temporal specifier.", "grammarTr": "Mansub isim (mansūb) zaman zarfı (zarf-ı zaman) veya hâl (durum mansūbu) işleviyle — \"şafakta baskın yaparak\" veya \"sabah iken.\" Tenvin belirsizlik bildirir, \"bir sabah\" (herhangi bir sabah) anlamını verir, \"o sabah\" (belirli bir sabah) değil. Mansub hal zarfsal işlevini yönetir. Morfolojik olarak ṣubḥ, I. bab ṣabaḥa'dan mastar olup burada zaman belirleyicisi olarak kullanılır.", "semantics": ["صَبَحَ (ṣabaḥa, I): to come upon in the morning; to give a morning drink (ṣabūḥ); to enter the morning state", "أَصْبَحَ (aṣbaḥa, IV): to become, to enter the morning, to begin the day; widely used as \"to become/to come to be\"", "صُبْح (ṣubḥ): dawn, daybreak, morning — the moment when light first breaks over the horizon; the transition from darkness to visibility", "صَبَاح (ṣabāḥ): morning; also: beauty, radiance of face (Lane's: \"the beauty of the face, its brightness and fairness\" — aṣbaḥa al-qawm = the people's faces became bright/beautiful)", "مِصْبَاح (miṣbāḥ): lamp, light source — the instrument that produces \"morning-like\" illumination (24:35, the Light Verse; 41:12, lamps as stars)", "صَبُوح (ṣabūḥ): morning drink — specifically the drink given to camels or guests at dawn; also: wine drunk in the morning (classical poetry)", "Classical (Lane's): ṣabaḥa l-qawm = he came upon the people in the morning; ṣabaḥa-hum sharran = he brought them evil in the morning (a morning attack); this directly parallels mughīrāt ṣubḥan — the dawn raid", "Classical (Lisan al-Arab): aṣ-ṣubḥ = the whiteness that appears at the horizon before sunrise; also called al-fajr; the moment of maximum vulnerability and maximum revelation — what was hidden in darkness becomes visible", "Classical (Hans Wehr): ṣubḥ = morning, dawn; ṣabāḥ = morning; ṣabāḥan = in the morning; aṣbaḥa = to wake up, to become; miṣbāḥ = lamp, light", "Modern: dawn as system-activation time, the moment of \"waking\" for networks, institutions, markets; the daily moment when systems transition from dormancy to activity", "Futuristic: initialization/boot time — the moment a system \"dawns\" into operational state; ṣubḥ as any transition from dormancy to activity, darkness to illumination, offline to online", "Core concept: the threshold moment when darkness yields to light — the instant of maximum transition, maximum vulnerability, and maximum revelation; what was concealed becomes exposed"], "semanticsTr": ["صَبَحَ (ṣabaḥa, I. bab): sabahleyin birine varmak; sabah içeceği vermek (ṣabūḥ); sabah haline girmek", "أَصْبَحَ (aṣbaḥa, IV. bab): olmak, sabaha girmek, güne başlamak; yaygın olarak \"olmak/hale gelmek\" anlamında kullanılır", "صُبْح (ṣubḥ): şafak, tan yeri, sabah — ışığın ufukta ilk belirdiği an; karanlıktan görünürlüğe geçiş", "صَبَاح (ṣabāḥ): sabah; ayrıca: güzellik, yüz parlaklığı (Lane's: \"yüzün güzelliği, parlaklığı ve aydınlığı\" — aṣbaḥa al-qawm = kavmin yüzleri parlak/güzel oldu)", "مِصْبَاح (miṣbāḥ): lamba, ışık kaynağı — \"sabah-benzeri\" aydınlatma üreten alet (24:35, Nur ayeti; 41:12, yıldızlar olarak kandiller)", "صَبُوح (ṣabūḥ): sabah içeceği — özellikle develere veya misafirlere şafakta verilen içecek; ayrıca: sabah içilen şarap (klasik şiir)", "Klasik (Lane's): ṣabaḥa l-qawm = kavme sabahleyin vardı; ṣabaḥa-hum sharran = onlara sabahleyin kötülük getirdi (sabah saldırısı); bu doğrudan mughīrāt ṣubḥan'a — şafak baskınına — paralel düşer", "Klasik (Lisanü'l-Arab): aṣ-ṣubḥ = güneş doğmadan önce ufukta beliren beyazlık; al-fajr olarak da adlandırılır; maksimum savunmasızlık ve maksimum aşikârlık anı — karanlıkta gizlenen görünür olur", "Klasik (Hans Wehr): ṣubḥ = sabah, şafak; ṣabāḥ = sabah; ṣabāḥan = sabahleyin; aṣbaḥa = uyanmak, olmak; miṣbāḥ = lamba, ışık", "Modern: şafak sistem-etkinleştirme zamanı olarak, ağların, kurumların, piyasaların \"uyandığı\" an; sistemlerin uyku halinden faaliyete geçtiği günlük an", "Gelecek: ilklendirme/başlatma zamanı — bir sistemin çalışır duruma \"şafak açtığı\" an; ṣubḥ uyku halinden faaliyete, karanlıktan aydınlığa, çevrimdışından çevrimiçine her geçiş olarak", "Kök kavram: karanlığın ışığa teslim olduğu eşik anı — azami geçiş, azami savunmasızlık ve azami aşikârlık anı; gizli olan açığa çıkar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Past tense verbal forms — aṣbaḥa (became/entered morning) and ṣabaḥa-hum (came upon them in morning)", "count": "~22 ayahs", "examples": [{"ref": "3:103", "arabic": "فَأَصْبَحْتُم بِنِعْمَتِهِۦٓ إِخْوَٰنًۭا", "english": "And you fa-aṣbaḥtum (became, by morning/by His grace) brothers", "turkish": "Ve fa-aṣbaḥtum (oldunuz, sabaha/O'nun nimetiyle) kardeşler"}, {"ref": "61:14", "arabic": "فَأَيَّدْنَا ٱلَّذِينَ ءَامَنُوا۟ عَلَىٰ عَدُوِّهِمْ فَأَصْبَحُوا۟ ظَٰهِرِينَ", "english": "So We supported those who believed against their enemy, fa-aṣbaḥū (and they became) dominant", "turkish": "Biz iman edenleri düşmanlarına karşı destekledik, fa-aṣbaḥū (ve oldular) galip"}]}, {"label": "B. Miṣbāḥ (lamp/light instrument) — the tool that creates dawn-like illumination", "count": "~4 ayahs", "examples": [{"ref": "24:35", "arabic": "ٱللَّهُ نُورُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۚ مَثَلُ نُورِهِۦ كَمِشْكَوٰةٍۢ فِيهَا مِصْبَاحٌ", "english": "God is the light of the heavens and the earth; the likeness of His light is as a niche in which is a miṣbāḥ (lamp)", "turkish": "Allah göklerin ve yerin nurudur; O'nun nurunun misali, içinde miṣbāḥ (kandil) bulunan bir hücre gibidir"}]}, {"label": "C. ṣubḥ/ṣabāḥ (dawn/morning) — the time noun and its uses", "count": "~5 ayahs", "examples": [{"ref": "81:18", "arabic": "وَٱلصُّبْحِ إِذَا تَنَفَّسَ", "english": "By the ṣubḥ (dawn) when it breathes", "turkish": "Ve aṣ-ṣubḥ (şafak) nefes aldığında"}]}, {"label": "D. Form IV aṣbaḥa and its imperfect — \"to become\" as auxiliary verb", "count": "~7 ayahs", "examples": [{"ref": "18:41", "arabic": "أَوْ يُصْبِحَ مَآؤُهَا غَوْرًۭا", "english": "Or its water yuṣbiḥa (becomes) sunken", "turkish": "Yahut suyu yuṣbiḥa (olur) batmış"}, {"ref": "67:30", "arabic": "قُلْ أَرَءَيْتُمْ إِنْ أَصْبَحَ مَآؤُكُمْ غَوْرًۭا", "english": "Say: Have you considered if your water aṣbaḥa (became) sunken?", "turkish": "De ki: Görüşünüz nedir suyunuz aṣbaḥa (olsa) batmış?"}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "2", "refs": "6:100;52:43", "note": "s-b-h (dawn/morning) co-occurs with gh-y-r (other/change) in 6:100 and 52:43 — both involve declarations of divine transcendence (subḥāna-hu) paired with \"other than God\" (ghayr Allāh). In this ayah the two roots appear together as \"dawn-raiding\" ← IN THIS AYAH", "noteTr": "s-b-h (sabah) kökü gh-y-r (başka/değişim) ile 6:100 ve 52:43'te birlikte geçer — her ikisinde ilahi aşkınlık tenzih edilmesi (subḥāna-hu) \"Allah'tan başka\" (ghayr Allāh) ile eşleşir. Bu ayette iki kök \"şafak baskını\" olarak bir arada görünür ← BU AYETTE"}, {"coRoot": "'-d-w", "coRootAr": "ع د و", "count": "3", "refs": "3:103;61:14;100:1", "note": "s-b-h co-occurs with '-d-w (running/hostility/enemy) — in 3:103 enemies become brothers by morning (aṣbaḥtum); in 61:14 believers dominate enemies by morning (aṣbaḥū); in 100:1 the \"runners\" (al-'ādiyāt) and \"dawn\" (ṣubḥ) appear in the same oath sequence", "noteTr": "s-b-h kökü '-d-w (koşma/düşmanlık/düşman) ile birlikte geçer — 3:103'te düşmanlar sabaha kardeş olur (aṣbaḥtum); 61:14'te müminler düşmanlara sabaha galip gelir (aṣbaḥū); 100:1'de \"koşanlar\" (al-'ādiyāt) ve \"sabah\" (ṣubḥ) aynı yemin dizisinde görünür"}, {"coRoot": "d-b-h", "coRootAr": "ض ب ح", "count": "1", "refs": "100:1", "note": "s-b-h co-occurs with d-b-h (panting) only in Surah 100 — the \"panting runners\" (100:1) and \"dawn\" (100:3) are linked by the oath structure; panting and dawn both mark states of exertion and transition", "noteTr": "s-b-h kökü d-b-h (soluma) ile yalnızca Sure 100'de birlikte geçer — \"soluyan koşanlar\" (100:1) ve \"sabah\" (100:3) yemin yapısıyla bağlantılıdır; soluma ve şafak ikisi de efor ve geçiş hallerini işaretler"}], "critical": "The temporal adverb ṣubḥan is the FIRST explicit time marker in the oath sequence (100:1-5). The previous two oaths describe MANNER (panting, spark-striking) but not TIME. The introduction of ṣubḥan (dawn) at the third position anchors the abstract kinetic imagery in a concrete temporal moment. This creates a structural pivot: the sequence moves from how (ḍabḥan, qadḥan) to when (ṣubḥan). Phonetically, ṣubḥan shares its emphatic ṣ with ṣad-family words that carry connotations of hardness, striking, and truth (ṣadaqa, ṣarama, ṣadda). The ṣ-b-ḥ root spans an extraordinary semantic range in classical lexicons: from the physical phenomenon of dawn to facial beauty (ṣabāḥa = beauty) to the morning drink (ṣabūḥ) to the instrument of light (miṣbāḥ). The connection between \"dawn\" and \"beauty/brightness\" in this root suggests that ṣubḥan carries not just temporal but qualitative meaning — the raid happens not merely AT dawn but IN the quality of dawn: sudden, bright, revelatory. Lane's records ṣabaḥa-hum sharran (\"he brought them evil in the morning\"), which is precisely what al-mughīrāt ṣubḥan describes — the bringing of destruction at the moment of light. This ayah also uniquely combines two roots (gh-w-r and ṣ-b-ḥ) that both appear in the \"sunken water\" ayahs (18:41, 67:30): \"or its water yuṣbiḥa (becomes in the morning) ghawran (sunken)\" — creating an intertextual echo between dawn-raiding and water-sinking, descent in time and descent in space.", "criticalTr": "ṣubḥan zaman zarfı yemin dizisindeki (100:1-5) İLK açık zaman işaretleyicisidir. Önceki iki yemin TARZI (soluma, kıvılcım çıkarma) belirtir ama ZAMANI değil. ṣubḥan'ın (şafak) üçüncü konumda girmesi soyut kinetik imgeyi somut bir zamansal ana yerleştirir. Bu yapısal bir dönüm noktası yaratır: dizi nasıl'dan (ḍabḥan, qadḥan) ne zaman'a (ṣubḥan) geçer. Fonetik olarak ṣubḥan emfatik ṣ'yi sertlik, vurma ve hakikat çağrışımları taşıyan ṣad-ailesi kelimelerle paylaşır (ṣadaqa, ṣarama, ṣadda). ṣ-b-ḥ kökü klasik sözlüklerde olağanüstü geniş bir anlam alanı kaplar: şafağın fiziksel olgusundan yüz güzelliğine (ṣabāḥa = güzellik), sabah içeceğine (ṣabūḥ), ışık aletine (miṣbāḥ). Bu kökte \"şafak\" ile \"güzellik/parlaklık\" arasındaki bağlantı ṣubḥan'ın yalnızca zamansal değil niteliksel anlam taşıdığını düşündürür — baskın sadece şafakTA değil, şafağın NİTELİĞİNDE gerçekleşir: ani, parlak, ifşa edici. Lane's ṣabaḥa-hum sharran'ı (\"onlara sabah kötülük getirdi\") kaydeder ki bu tam olarak al-mughīrāt ṣubḥan'ın betimlediğidir — ışık anında yıkım getirme. Bu ayet ayrıca \"batan su\" ayetlerinde (18:41, 67:30) görünen iki kökü (gh-w-r ve ṣ-b-ḥ) benzersiz biçimde birleştirir: \"yahut suyu yuṣbiḥa (sabah olur) ghawran (batmış)\" — şafak baskını ile suyun batması, zamanda iniş ile mekânda iniş arasında metinlerarası bir yankı yaratır.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the oath sequence introduce explicit time (ṣubḥan) only at the third position? Is the delay from manner to time structurally significant — building suspense before grounding the action?", "Is the root of al-mughīrāt genuinely ambiguous between gh-w-r (to raid/descend) and gh-y-r (to change)? Could the Quran be exploiting this homophony deliberately — raiders that also transform?", "The feminine plural -āt: if not horses, what other entities could be \"dawn-raiders\"? Winds? Stars? Celestial bodies that \"descend\" at dawn (setting stars)?", "Both gh-w-r and ṣ-b-ḥ appear together in the \"sunken water\" ayahs (18:41, 67:30) — is the intertextual echo between \"raiding at dawn\" and \"water becoming sunken by morning\" meaningful?", "Lane's attests ṣabāḥa (beauty, facial radiance) from the same root as ṣubḥ (dawn). Does the Quran's use of ṣubḥan carry this aesthetic dimension — the raid happening in/with the quality of beauty/brightness?", "The oath sequence escalates from individual action (running) to contact (sparking) to collective assault (raiding). Does this mirror a larger Quranic pattern of escalating divine signs?", "If al-mughīrāt is read from gh-y-r (to change), does \"the changers at dawn\" describe cosmic transformation — the daily creation/renewal that occurs at the boundary of night and day?", "Classical Arabic ṣabaḥa-hum sharran (\"he brought them evil in the morning\") directly parallels al-mughīrāt ṣubḥan. Does this intertextual echo in the lexical tradition suggest the oath is about bringing destruction at the moment of revelation?", "The hapax status of Form IV aghāra in the Quran (if from gh-w-r) — does the singularity of this form contribute to the oath's rhetorical force?", "Can ṣubḥan function as ḥāl (circumstantial) rather than ẓarf (temporal)? \"Raiding while being dawn-like\" rather than \"raiding at dawn\" — would this change the interpretation?"], "questionsTr": ["Yemin dizisi neden açık zamanı (ṣubḥan) yalnızca üçüncü konumda sunar? Tarzdan zamana gecikme yapısal olarak anlamlı mıdır — eylemi temellendirmeden önce gerilim mi kurar?", "al-mughīrāt'ın kökü gh-w-r (baskın yapmak/inmek) ile gh-y-r (değiştirmek) arasında gerçekten belirsiz midir? Kur'an bu eşsesliliği kasıtlı olarak kullanıyor olabilir mi — aynı zamanda dönüştüren baskıncılar?", "Dişil çoğul -āt: atlar değilse, hangi varlıklar \"şafak baskıncıları\" olabilir? Rüzgarlar? Yıldızlar? Şafakta \"inen\" (batan) gök cisimleri?", "Hem gh-w-r hem ṣ-b-ḥ \"batan su\" ayetlerinde (18:41, 67:30) birlikte görünür — \"şafakta baskın\" ile \"suyun sabaha batması\" arasındaki metinlerarası yankı anlamlı mıdır?", "Lane's ṣubḥ (şafak) ile aynı kökten ṣabāḥa'yı (güzellik, yüz parlaklığı) kaydeder. Kur'an'ın ṣubḥan kullanımı bu estetik boyutu taşır mı — baskın güzellik/parlaklık niteliğinde/ile mi gerçekleşir?", "Yemin dizisi bireysel eylemden (koşma) temasa (kıvılcım) toplu saldırıya (baskın) tırmanır. Bu daha büyük bir Kur'ani tırmandırıcı ilahi işaretler örüntüsünü mı yansıtır?", "al-mughīrāt gh-y-r'den (değiştirmek) okunursa, \"sabahleyin değiştirenler\" kozmik dönüşümü mü betimler — gece ile gündüz sınırında gerçekleşen günlük yaratma/yenileme?", "Klasik Arapça ṣabaḥa-hum sharran (\"onlara sabah kötülük getirdi\") doğrudan al-mughīrāt ṣubḥan'a paralel düşer. Sözcüksel gelenekteki bu metinlerarası yankı yeminin ifşa anında yıkım getirme hakkında olduğunu mu düşündürür?", "IV. bab aghāra'nın Kur'an'daki hapax durumu (gh-w-r'den ise) — bu kalıbın tekilliği yeminin retorik gücüne katkıda bulunur mu?", "ṣubḥan zarf (zamansal) yerine hâl (durum) işleviyle kullanılabilir mi? \"Şafakta baskın yaparken\" yerine \"şafak-gibi olarak baskın yapan\" — bu yorumu değiştirir mi?"], "key": "100:3"}, "100:4": {"surah": 100, "ayah": 4, "arabic": "فَأَثَرْنَ بِهِۦ نَقْعًۭا", "transliteration": "fa-atharna bihi naq'an", "readings": [{"text": "Then they stirred up thereby a cloud of dust — the charging ones raised dust by their running, enveloping the scene in obscurity.", "textTr": "O sirada onunla bir toz bulutu kaldirdilar — kosanlarin kosmalariyla toz kaldirip mekanin gorunurlugunu orttuler.", "rationale": "The fa is ta'qib (immediate sequence) continuing from 100:3 (the dawn-raiders). atharna from '-th-r in Form I past tense with feminine plural subject (the 'adiyat/charging ones). bihi refers back to the dawn/place (subhan from 100:3) or to the running itself. naq'an as dust cloud raised by hooves.", "rationaleTr": "Fa ta'kib (hemen ardisiklik) olarak 100:3'ten (subh baskincilari) devam eder. atharna, '-th-r kokunden I. bab gecmis zaman disil cogul ozne (adiyat/kosanlar) ile. bihi zamiri subha (100:3) veya kosma eylemine geri gonder. naq'an toynaklarin kaldirdigi toz bulutu."}, {"text": "Then they raised by it a clamor/outcry — the chargers produced loud sound rather than (or alongside) physical dust.", "textTr": "O sirada onunla bir gultu/haykiri kaldirdilar — kosanlar fiziksel toz yerine (veya yaninda) yuksek ses cikardilar.", "rationale": "naq' from n-q-' carries the classical meaning of \"loud cry, clamor, shouting\" (Lane's Lexicon: naq'a = he cried out, raised his voice). atharna bihi naq'an can mean \"they raised a clamor thereby\" — the sound of battle. This reading preserves the auditory-visual escalation from dabhan (panting sound, 100:1) to qadhan (striking sparks, 100:2) to subhan (dawn, 100:3) to naq'an (battle cry, 100:4).", "rationaleTr": "n-q-' koku klasik anlam olarak \"yuksek ses, guldurtu, bagirma\" tasir (Lane: naq'a = bagirvermek, sesini yukseltmek). atharna bihi naq'an \"onunla bir gultu koparilar\" anlamina gelebilir — savas sesi. Bu okuma dabhan'dan (soluma sesi, 100:1) qadhan'a (kivilcim cikarma, 100:2) subhan'a (sabah, 100:3) naq'an'a (savas naracsi, 100:4) isitsel-gorsel tirmanmayi korur."}, {"text": "Then they left thereby a trace/mark — reading atharna from '-th-r in its core meaning of \"leaving a trace, imprinting.\"", "textTr": "O sirada onunla bir iz/isaret biraktilar — atharna'yi '-th-r kokunden \"iz birakmak, damgalamak\" temel anlamiyla okuyarak.", "rationale": "atharna can mean \"they left a mark/trace\" rather than \"they raised.\" The root '-th-r's primary classical meaning is \"trace, mark, imprint, vestige.\" bihi naq'an then means \"an imprint of soaking/saturation\" (n-q-' also means \"to soak, to macerate in water\"). The chargers leave an indelible mark — a trace soaked into the ground, stained.", "rationaleTr": "atharna \"kaldirdilar\" yerine \"bir iz biraktilar\" anlamina gelebilir. '-th-r kokunun birincil klasik anlami \"iz, isaret, basksi, kalinti\"dir. bihi naq'an o zaman \"islanma/doygunluk izi\" anlamina gelir (n-q-' ayrica \"islatmak, suda yumurtamak\" demektir). Kosanlar silinmez bir iz birakir — yere isledilmis, lekelenmis bir iz."}, {"text": "Then they produced by it a data-residue — any entity that moves through a medium leaves a detectable trace, an information imprint.", "textTr": "O sirada onunla bir veri-kalintisi olusturdilar — bir ortamdan gecen her varlik algilanabilir bir iz, bir bilgi basikisi birakir.", "rationale": "In a futuristic/modern reading, atharna (to leave a trace) + naq'an (soaking, embedding) describes any passage that embeds information into a substrate. Horses leave hoofprints; vehicles leave tire tracks; digital processes leave logs; particles leave traces in cloud chambers. The text describes a universal principle: passage produces record.", "rationaleTr": "Gelecekci/modern bir okumada, atharna (iz birakmak) + naq'an (islatma, yerlestirme) bir alt tabakaya bilgi gomulu herhangi bir gecisi tanimlar. Atlar toynak izleri, tasitlar lastik izleri, dijital surecler gunlukler, parcaciklar bulut odalarinda izler birakir. Metin evrensel bir ilkeyi tanimlar: gecis, kayit uretir."}, {"text": "Then they stirred up by it a soaking/saturation — reading naq' in its primary lexical sense of \"soaking in liquid,\" the chargers drench the ground (with blood, sweat, or water).", "textTr": "O sirada onunla bir islatma/doygunluk cikarilar — naq' kelimesini \"sivida islatma\" birincil sozluk anlamiyla okuyarak, kosanlar yeri (kan, ter veya suyla) islatirlar.", "rationale": "Lane's Lexicon gives naq' primarily as \"soaking, steeping, macerating in water.\" The dust meaning is secondary/derivative. If n-q-' means soaking, the ayah describes the chargers saturating the ground — perhaps with blood in battle, or with sweat from exertion. This creates a visceral, bodily reading that complements the panting (dabhan) of 100:1.", "rationaleTr": "Lane's Lexicon n-q-' icin birincil anlam olarak \"islatma, sivida biraktirma, suda yumutma\" verir. Toz anlami ikincil/turevdir. n-q-' islatma demekse, ayet kosanlarin yeri doyurmalarini tanimlar — belki savasta kanla, belki de cabadan terle. Bu 100:1'deki soluma (dabhan) ile tamamlanan bedensel, visceral bir okuma olusturur."}], "structure": {"beats": [{"label": "Consequence of the charge", "labelTr": "Hamlenin sonucu", "lines": [{"arabic": "فَأَثَرْنَ بِهِۦ نَقْعًۭا", "translit": "fa-atharna bihi naq'an", "english": "Then they stirred up thereby a dust-cloud / clamor / soaking", "turkish": "O sirada onunla toz bulutu / gultu / islatma cikardilar"}]}], "summary": "This ayah is the fourth link in a five-part oath chain (100:1-5) built with fa-sequencing. The structure escalates from description of agents (al-'adiyat, al-muriyat, al-mughirat in 100:1-3) to consequences of their action (100:4-5). The shift from participle-noun pairs (active participle + accusative verbal noun: 'adiyati dabhan, muriyati qadhan, mughirati subhan) to past tense verb + accusative object (atharna... naq'an, wasatna... jam'an) marks a grammatical pivot: the oath subjects transition from description to narration. The feminine plural -na suffix on atharna matches the feminine plural of the participles, confirming the chargers as subject. The pronoun bihi is syntactically ambiguous — its referent could be the time (subh/dawn), the place (the battlefield), or the act of charging itself.", "summaryTr": "Bu ayet bes parcali kasem zincirinin (100:1-5) fa-ardisikligiyla kurulan dorduncu halkassidir. Yapi eylemlerin faillerinden (el-adiyat, el-muriyat, el-mugirat, 100:1-3) eylemlerinin sonuclarina (100:4-5) tirmanir. Ism-i fail + mansub masdar ciftlerinden (adiyati dabhan, muriyati qadhan, mughirati subhan) gecmis zaman fiil + mansub nesneye (atharna... naq'an, wasatna... jam'an) gecis dilbilgisel bir donumu isaretler: kasem ozneleri betimlemeden anlatime gecer. atharna uzerindeki disil cogul -na eki ism-i faillerin disil cogulunu karsilar, kosanlarin ozne oldugunu dogrular. bihi zamiri sozdizimsel olarak belirsizdir — gondermesi zaman (subh/sabah), mekan (savas alani) veya hamle eyleminin kendisi olabilir."}, "words": [{"id": 1, "arabic": "فَ", "translit": "fa", "gloss": "then / so", "glossTr": "sonra / boylece", "userNotes": "", "root": "— (—)", "grammar": "Conjunction of immediate sequence (ta'qib), fourth in the oath chain fa-l-muriyat... fa-l-mughirat... fa-atharna. Marks the consequence following directly from the dawn-raid.", "grammarTr": "Hemen ardisiklik baglaci (ta'kib), kasem zincirinin dorduncu halkasi fa-l-muriyat... fa-l-mughirat... fa-atharna. Sabah baskininin hemen ardindan gelen sonucu isaretler.", "semantics": ["ta'qib (immediate sequence): then, and then — marks action following immediately, \"so/then\"", "sababiyya (causation): therefore, thus — marks result or consequence", "istinaf (resumptive): opens new clause"], "semanticsTr": ["Ta'kib (hemen ardisiklik): sonra, ardinda — hemen ardindaki eylemi isaretler", "Sebebiyye (nedensellik): dolayisiyla, boylece — sonuc veya neticey isaretler", "Istinaf (yeniden baslama): yeni cumle acar"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The fa here functions as ta'qib (immediate sequence), the fourth in a chain of fa-linked clauses: fa-l-muriyati (100:2) → fa-l-mughirati (100:3) → fa-atharna (100:4) → fa-wasatna (100:5). This fa-chain creates a cinematographic sequence: each fa advances the narrative by one beat. The shift from fa + definite article + participle (100:2-3) to fa + past tense verb (100:4-5) marks the pivot from descriptive oath to narrative consequence. The ta'qib function ensures no temporal gap between the dawn-raid and the dust-raising — they are simultaneous or immediately sequential.", "criticalTr": "Buradaki fa ta'kib (hemen ardisiklik) islevindedir, fa-baglantili cumleler zincirinin dorduncu halkasi: fa-l-muriyati (100:2) → fa-l-mughirati (100:3) → fa-atharna (100:4) → fa-wasatna (100:5). Bu fa-zinciri sinematografik bir dizi olusturur: her fa anlatiyi bir vurusluk ilerletir. fa + marife + ism-i failden (100:2-3) fa + gecmis zaman fiilere (100:4-5) gecis, betimleyici kasemden anlatisal sonuca donusumu isaretler. Ta'kib islevi sabah baskini ile toz kaldirma arasinda zamansal boslluk olmamasini saglar — es zamanli veya hemen ardisiktir."}, {"id": 2, "arabic": "أَثَرْنَ", "translit": "atharna", "gloss": "they stirred up / they raised / they left traces", "glossTr": "kaldirdilar / uyardilar / iz biraktilar", "userNotes": "", "root": "أ ث ر ('-th-r)", "grammar": "Perfect verb, Form I, 3rd person feminine plural. The -na suffix marks feminine plural subject, referring back to the feminine plural participles al-'adiyat/al-muriyat/al-mughirat. Transitive: takes naq'an as direct object.", "grammarTr": "Gecmis zaman fiil, I. bab, ucuncu sahis disil cogul. -na eki disil cogul ozneyi isaretler, disil cogul ism-i faillere (el-adiyat/el-muriyat/el-mugirat) geri gonderir. Gecisli: naq'an'i dogrudan nesne olarak alir.", "semantics": ["fa'ala (I): to stir up, to raise, to agitate (dust, earth) — Lane's: athara t-turaba = he stirred up the dust", "fa'ala (I): to leave a trace, to imprint, to mark — the primary classical meaning of the root", "fa'ala (I): to prefer, to choose over (athara 'alayhi = he preferred him/it over) — attested in Quran: 12:91, 79:38, 87:16", "af'ala (IV): to transmit (a report), to hand down (a tradition) — yu'tharu = transmitted, narrated (74:24: sihr yu'tharu \"transmitted sorcery\")", "Classical lexicon (Lane): athar = trace, mark, vestige, sign, relic, imprint; athara = he stirred up, excited, roused; also \"he plowed\" (athara l-arda = he turned the soil); ithar = preference, altruism", "Classical lexicon (Lisan al-Arab): '-th-r encompasses trace/sign (athar), stirring/agitation (ithara), preference (ithar), plowing/cultivation (itharat al-ard), and transmission of reports (i'thar)", "Modern: to affect, to impact, to influence (ta'thir = effect, influence); to trigger (ithara = provocation, stimulation)", "Futuristic: to leave a data trace, to generate a log entry, to produce a detectable signal — any passage through a medium that leaves retrievable information", "Core concept: the production of a detectable mark or disturbance through contact or passage — whether physical (dust, imprint), acoustic (stirring up sound), agricultural (plowing), or preferential (choosing one over another)"], "semanticsTr": ["fe'ale (I. bab): uyandirmak, kaldirmak, karistirmak (toz, toprak) — Lane: ethare't-turabe = tozu kaldirdi", "fe'ale (I. bab): iz birakmak, baskmak, isaretlemek — kokun birincil klasik anlami", "fe'ale (I. bab): tercih etmek, ustun tutmak (ethare aleyhi = onu ustun tuttu) — Kur'an'da: 12:91, 79:38, 87:16", "if'al (IV. bab): nakletmek (haberi), aktarmak (rivayeti) — yu'seru = nakledilen (74:24: sihr yu'seru \"aktarilan sihir\")", "Klasik sozluk (Lane): eser = iz, isaret, kalinti, belge, baski; esare = kaldirdi, tahrik etti, uyardi; ayrica \"surdu\" (esare'l-arda = topragi isledi); isar = tercih, diger-gayrlik", "Klasik sozluk (Lisanu'l-Arab): '-th-r koku iz/isaret (eser), karristirma/tahrik (isare), tercih (isar), surme/ziraat (isaretu'l-ard), ve haber aktarimi (i'sar) kapsar", "Modern: etkilemek, tesir etmek (te'sir = etki); tetiklemek (isare = tahrik, uyarma)", "Gelecekci: veri izi birakmak, gunluk kaydi olusturmak, algilanabilir sinyal uretmek — bir ortamdan gecis sirasinda elde edilebilir bilgi birakan her sey", "Kok kavram: temas veya gecis yoluyla algilanabilir bir iz veya bozulma uretimi — fiziksel (toz, baski), isitsel (ses kaldirma), zirai (surme) veya tercihsel (birini digerine secme) olsun"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Perfect verb: stirring up / preferring (Form I and related)", "count": "~3 ayahs", "examples": [{"ref": "12:91", "arabic": "قَالُوا۟ تَٱللَّهِ لَقَدْ ءَاثَرَكَ ٱللَّهُ عَلَيْنَا وَإِن كُنَّا لَخَٰطِـِٔينَ", "english": "They said: \"By God, God has preferred you (atharaka) over us, and we were indeed wrongdoers.\"", "turkish": "Dediler: \"Tallahi, Allah seni bize ustun tuttu (esereke) ve biz gercekten hata edenlerdeniz.\""}, {"ref": "79:38", "arabic": "وَءَاثَرَ ٱلْحَيَوٰةَ ٱلدُّنْيَا", "english": "And preferred (athara) the life of this world.", "turkish": "Ve dunya hayatini tercih etti (esere)."}]}, {"label": "B. Form IV: to prefer, to transmit", "count": "~4 ayahs", "examples": [{"ref": "59:9", "arabic": "وَٱلَّذِينَ تَبَوَّءُو ٱلدَّارَ وَٱلْإِيمَٰنَ مِن قَبْلِهِمْ يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ وَلَا يَجِدُونَ فِى صُدُورِهِمْ حَاجَةًۭ مِّمَّآ أُوتُوا۟ وَيُؤْثِرُونَ عَلَىٰٓ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌۭ", "english": "Those who settled the homeland and faith before them love those who emigrated to them and find no need in their chests for what they were given, and they prefer (yu'thiruna) others over themselves even though they are in privation.", "turkish": "Onlardan once yurda ve imana yerlesmis olanlar, kendilerine hicret edenleri severler, onlara verilenden dolayi goguslerinde bir ihtiyac bulmazlar ve kendileri ihtiyac icinde olsalar bile baskalarini kendilerine tercih ederler (yu'sirune)."}, {"ref": "87:16", "arabic": "بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا", "english": "Rather, you prefer (tu'thiruna) the life of this world.", "turkish": "Bilakis, siz dunya hayatini tercih ediyorsunuz (tu'sirune)."}]}, {"label": "C. Noun: traces, vestiges, marks (athar/athar)", "count": "~14 ayahs", "examples": [{"ref": "48:29", "arabic": "مُّحَمَّدٌۭ رَّسُولُ ٱللَّهِ ۚ وَٱلَّذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى ٱلْكُفَّارِ رُحَمَآءُ بَيْنَهُمْ ۖ تَرَىٰهُمْ رُكَّعًۭا سُجَّدًۭا يَبْتَغُونَ فَضْلًۭا مِّنَ ٱللَّهِ وَرِضْوَٰنًۭا ۖ سِيمَاهُمْ فِى وُجُوهِهِم مِّنْ أَثَرِ ٱلسُّجُودِ", "english": "Muhammad is the messenger of God. Those with him are stern against the deniers, merciful among themselves. You see them bowing, prostrating, seeking bounty from God and pleasure. Their mark is in their faces from the trace (athar) of prostration.", "turkish": "Muhammed Allah'in resuludur. Onunla birlikte olanlar kafirlere karsi sert, kendi aralarinda merhametlidir. Onlari ruku ve secde ederken, Allah'tan lutuf ve rizasini isterken gorusun. Yuzlerinde secde izinden (eser) isaretleri vardir."}, {"ref": "36:12", "arabic": "إِنَّا نَحْنُ نُحْىِ ٱلْمَوْتَىٰ وَنَكْتُبُ مَا قَدَّمُوا۟ وَءَاثَٰرَهُمْ", "english": "We give life to the dead and We record what they have sent ahead and their traces (atharahum).", "turkish": "Biz oluleri diriltiriz, onlarin ondden gonderdiklerini ve izlerini (asarihim) yazariz."}]}]}, "qiraat": [{"arabic": "فَأَثَّرْنَ", "translit": "fa-aththarna", "status": "Irreg", "type": "Vr", "note": "Irregular variant with shadda (gemination) on the tha': fa-aththarna (II form) means \"they left deep marks/impressions.\" Form II intensification: the doubling implies deeper, more permanent traces rather than surface stirring. Changes the action from \"raising dust\" to \"deeply imprinting/carving.\"", "noteTr": "Tha uzerinde sedde (geminasyon) ile duzensiz varyant: fa-eththerne (II. bab) \"derin izler/basknilar biraktilar\" anlamina gelir. II. bab yogunlastirma: ikizleme yuzeysel kaldirma yerine daha derin, daha kalici izleri ima eder. Eylemi \"toz kaldirma\"dan \"derinden baski/oyma\"ya degistirir.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "h-y-y", "coRootAr": "ح ي ي", "count": "5", "refs": "20:72;30:50;36:12;79:38;87:16", "note": "The root '-th-r co-occurs with h-y-y (life/living) in contexts of preferring worldly life (79:38, 87:16) and traces of divine revivification (30:50, 36:12). Pattern: traces/preference linked to life.", "noteTr": "'-th-r koku h-y-y (hayat/yasama) ile dunya hayatini tercih etme (79:38, 87:16) ve ilahi diriltmenin izleri (30:50, 36:12) baglamlarinda birlikte gecer. Desen: izler/tercih hayatla baglantili."}, {"coRoot": "q-w-l", "coRootAr": "ق و ل", "count": "9", "refs": "12:91;18:21;18:64;20:72;20:84;20:96;43:22;43:23;74:24", "note": "Speaking (q-w-l) paired with trace/preference — what is said about traces, or preferring through declaration.", "noteTr": "Soyleme (q-w-l) ile iz/tercih eslesmesi — izler hakkinda soylenilen veya beyan yoluyla tercih etme."}], "critical": "atharna is morphologically perfect (fa'alna) with feminine plural -na, confirming the grammatical link to the feminine plural participles in 100:1-3 (al-'adiyat, al-muriyat, al-mughirat). The root '-th-r carries a fundamental tension between \"stirring up/disturbing\" and \"leaving a trace/mark\" — both involve contact producing a result, but one is transient (dust dissipates) while the other is permanent (traces endure). Classical lexicons (Lane, Lisan al-Arab) also attest \"to plow, to turn earth\" (athara l-arda), which combines both senses: plowing disturbs the surface AND leaves furrows. This agricultural sense is highly relevant to the surah's theme — the same root that describes horses churning dust also describes oxen turning soil. The Quran uses '-th-r elsewhere only for \"preferring\" (12:91, 59:9, 79:38, 87:16) and \"traces/vestiges\" (5:46, 18:6, 36:12, 48:29). This ayah is the ONLY Quranic instance of the root meaning \"to stir up/raise\" — making it semantically unique. The irregular qiraat fa-aththarna (Form II with shadda) intensifies the action, suggesting deep marking rather than surface disturbance. Phonetically, atharna contains the emphatic 'ayn-tha sequence followed by the hard ra, mimicking the heavy thudding of hooves on earth.", "criticalTr": "atharna morfolojik olarak gecmis zaman (fe'alna) disil cogul -na ile, 100:1-3'teki disil cogul ism-i faillere (el-adiyat, el-muriyat, el-mugirat) dilbilgisel baglantyi dogrular. '-th-r koku \"kaldirma/bozma\" ile \"iz birakmam/isaretleme\" arasinda temel bir gerilim tasir — ikisi de temas sonucu sonuc uretir, ama biri gecicidir (toz dagilir) digeri kalicidir (izler surer). Klasik sozlukler (Lane, Lisanu'l-Arab) ayrica \"surmek, toprak islemek\" (esare'l-arda) anlamini da dogrular — bu iki anlami birlestirir: surme yuzeyi bozar VE cizgiler birakir. Bu zirai anlam surenin temasina son derece uygundur — atlarin tozu karristirmasini tanimlayan ayni kok okuzlerin topragi islemesini de tanimlar. Kur'an '-th-r kokunu baska yerlerde yalnizca \"tercih etme\" (12:91, 59:9, 79:38, 87:16) ve \"izler/kalintilar\" (5:46, 18:6, 36:12, 48:29) icin kullanir. Bu ayet kokun \"kaldirma/uyandirma\" anlamindaki TEK Kur'an ornekdir — anlamsal olarak benzersiz kilar. Duzensiz kiraat fa-eththerne (sedde ile II. bab) eylemi yogunlastirir, yuzeysel bozma yerine derin isaretleme onerir. Fonetik olarak atharna, ayin-tha dizisini ve sert ra'yi icererek toynaklarin yere agir carpmasini taklit eder.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "بِ", "translit": "bi", "gloss": "by / with / thereby", "glossTr": "ile / vasitasiyla / onunla", "userNotes": "", "root": "— (—)", "grammar": "Preposition governing the genitive case. Here combined with the pronoun -hi to form bihi. The bi marks instrument/means or cause.", "grammarTr": "Mecrur hali yoneten edat. Burada -hi zamiriyle birlesi bihi olarak. Bi alet/vasita veya sebep isaretler.", "semantics": ["Instrument/means: by, with, through — marks the tool or method of action", "Cause/reason: because of, on account of — marks the reason for action", "Accompaniment: along with, together with", "Classical lexicon (Lane): bi = by means of, with the help of, through, in, at"], "semanticsTr": ["Alet/vasita: ile, vasitasiyla — eylem araci veya yontemini isaretler", "Sebep/neden: sebebiyle, dolayi — eylemin nedenini isaretler", "Beraberlik: birlikte, ile beraber", "Klasik sozluk (Lane): bi = vasitasiyla, yardimiyla, aracilligiyla, icinde"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The preposition bi here governs the pronoun -hi and functions as an instrument/means marker: \"by means of it/thereby.\" The crucial question is the referent of -hi: (1) the subh/dawn from 100:3 — \"by the dawn they raised dust\"; (2) the place/battlefield — \"thereby [in that place] they raised dust\"; (3) the act of running/charging itself — \"by that [running] they raised dust\"; (4) the collective action of the horses — the pronoun encompasses the entire sequence of panting-sparking-raiding. The ambiguity is likely deliberate: bi-hi wraps all preceding action into a single instrumental cause. Note bi-hi recurs identically in 100:5 (fa-wasatna bihi jam'an), creating a structural echo that binds 100:4 and 100:5 as a paired consequence.", "criticalTr": "bi edati burada -hi zamirini yonetir ve alet/vasita isaretcisi olarak isev gorur: \"onunla/onun vasitasiyla.\" Kilit soru -hi'nin gondermesidir: (1) 100:3'ten subh/sabah — \"sabahla toz kaldirdilar\"; (2) mekan/savas alani — \"orada toz kaldirdilar\"; (3) kosma/hamle eyleminin kendisi — \"o [kosma] ile toz kaldirdilar\"; (4) atlarin toplu eylemi — zamir soluma-kivilcim-baskin tumunu kapsar. Belirsizlik muhtemelen kasitlidir: bi-hi tum onceki eylemi tek bir aracsal nedene sarar. bi-hi'nin 100:5'te de aynen tekrarlandigi (fa-wasatna bihi jam'an) dikkat cekicidir — 100:4 ve 100:5'i eslestirilmis sonuc olarak birbirine baglayan yapisal bir yanki yaratir."}, {"id": 4, "arabic": "هِ", "translit": "hi", "gloss": "it / him / that", "glossTr": "o / onu / bunu", "userNotes": "", "root": "— (—)", "grammar": "3rd person masculine singular pronoun suffix, attached to bi. Referent is ambiguous: the dawn (subh, 100:3), the place, or the entire preceding action sequence.", "grammarTr": "Ucuncu sahis tekil eril zamir eki, bi'ye eklenmis. Gonderme belirsiz: sabah (subh, 100:3), mekan veya tum onceki eylem dizisi.", "semantics": [], "semanticsTr": [], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The pronoun -hi is masculine singular, which cannot refer directly to the feminine plural 'adiyat. Possible referents: (1) subh (dawn, masculine) from 100:3 — \"by the dawn\"; (2) an implicit noun like makan (place) or ghazw (raid) — \"by that [event/place]\"; (3) the entire oath scenario as a conceptual unit (masculine by default). The ambiguity is structurally identical to 100:5 where bihi recurs, suggesting the pronoun was deliberately left open. The masculine singular amid feminine plural subjects creates a grammatical tension — the actors are feminine, but their instrument/context is masculine. This may signal that the \"it\" transcends the specific horses, pointing to the larger phenomenon they enact.", "criticalTr": "-hi zamiri tekil erildir, disil cogul adiyat'a dogrudan gonderemez. Olasi gondermeler: (1) 100:3'ten subh (sabah, eril) — \"sabahla\"; (2) ontuk bir isim mesela mekan (yer) veya ghazv (baskin) — \"o [olay/yer] ile\"; (3) tum kasem sahnesinin kavramsal birim olarak (varsayilan olarak eril). Belirsizlik 100:5'te bihi'nin tekrarlandigi yapisal olarak aynidir, zamir kasitli olarak acik birakilmis. Disil cogul ozneler arasinda tekil
