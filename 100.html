eril dilbilgisel gerilim yaratir — eyleyenler disildir ama arac/baglam erildir. Bu \"o\"nun belirli atlari astini, gerceklestirdikleri daha buyuk olguyu isaret ettigini sinyal verebilir."}, {"id": 5, "arabic": "نَقْعًا", "translit": "naq'an", "gloss": "dust / clamor / soaking", "glossTr": "toz / gultu / islatma", "userNotes": "", "root": "ن ق ع (n-q-')", "grammar": "Indefinite accusative noun (masdar/concrete noun). Direct object of atharna. Hapax legomenon — this is the ONLY occurrence of this root in the entire Quran.", "grammarTr": "Belirsiz mansub isim (masdar/somut isim). atharna'nin dogrudan nesnesi. Hapax legomenon — bu kokun tum Kur'an'daki TEK gecisidir.", "semantics": ["Primary classical meaning (Lane's Lexicon): naq' = soaking, steeping, macerating — naq'a th-thawba = he soaked the garment; naq'a d-dawa'a fi l-ma' = he soaked the medicine in water; naq'i' = a thing soaked/steeped", "Derived meaning: naq' = dust raised by hooves — because dust \"soaks\" the air, fills and permeates it like liquid soaks cloth; Lane: \"dust that rises and spreads\"", "Derived meaning: naq' = loud cry, clamor, battle-cry — naq'a = he cried out, shouted loudly; naq' = the sound of a trumpet or battle drum; Lane: \"a crying out, a clamoring\"", "Derived meaning: naq' = pool of collected water, a watering place — naq'i = standing water; related to the soaking sense", "Classical lexicon (Lisan al-Arab): n-q-' encompasses soaking/saturation, dust-raising, loud sound/clamor, and collected water. The semantic thread is \"filling/permeation\" — whether filling air with dust, filling ears with sound, or filling a vessel with water", "Hans Wehr: naqa'a = to soak, to steep, to macerate; naq' = infusion, decoction, soaking; also dust", "Modern/futuristic: any pervasive medium that fills space — dust, noise, electromagnetic signal, data flood; naq' as \"saturation of a medium\"", "Core concept: filling and permeating a space or substance — whether dust filling air, sound filling ears, water filling cloth, or information flooding a channel"], "semanticsTr": ["Birincil klasik anlam (Lane's Lexicon): naq' = islatma, sivida biraktirma — neqa'e's-sevbe = elbiseyi islatti; neqa'e'd-deva'e fi'l-ma' = ilaci suda islatti; naqi' = islatilmis/batrilmis sey", "Turetilmis anlam: naq' = toynaklarin kaldirdigi toz — cunku toz havayi \"islatir\", sivi kummasi islatir gibi doldurur ve nufuz eder; Lane: \"yukselen ve yayilan toz\"", "Turetilmis anlam: naq' = yuksek ses, gultu, savas naracsi — neqa'a = bagirvermek; naq' = boru veya savas davulu sesi; Lane: \"haykiran, gultu yapan\"", "Turetilmis anlam: naq' = biriken su havuzu, sulama yeri — naqi' = durgun su; islatma anlamiyla iliskili", "Klasik sozluk (Lisanu'l-Arab): n-q-' koku islatma/doygunluk, toz kaldirma, yuksek ses/gultu ve biriken suyu kapsar. Anlamsal iplik \"doldurma/nufuz etme\"dir — havayi tozla, kulaklari sesle, bir kabi suyla doldurma", "Hans Wehr: neqa'a = islatmak, batirmak; naq' = demleme, kaynatma, islatma; ayrica toz", "Modern/gelecekci: bir mekani dolduran herhangi bir yaygin ortam — toz, gurultu, elektromanyetik sinyal, veri selleri; naq' \"bir ortamin doygunlugu\" olarak", "Kok kavram: bir mekan veya maddeyi doldurma ve nufuz etme — havayi tozla, kulaklari sesle, kumasi suyla veya bir kanali bilgiyle doldurma"], "occurrences": {"type": "all", "items": [{"ref": "100:4", "arabic": "— this verse —", "english": "The ONLY Quranic occurrence of n-q-'. As a hapax legomenon, its meaning must be determined entirely from classical lexicography and context. The indefinite accusative (naq'an) functions as direct object of atharna, describing what the chargers produced.", "turkish": "n-q-' kokkunun TEK Kur'an gecisi. Hapax legomenon olarak anlami tamamen klasik sozlukbilim ve baglamdan belirlenmeli. Belirsiz mansub (naq'an) atharna'nin dogrudan nesnesi olarak kosanlarin ne urettigini tanimlar."}]}, "qiraat": [], "cooccurrence": [], "critical": "naq'an is a HAPAX LEGOMENON — the sole occurrence of root n-q-' in the entire Quran. This makes it one of the rarest words in the Quranic vocabulary. The word's meaning cannot be triangulated from other Quranic usage and depends entirely on classical Arabic lexicography. Lane's Lexicon gives the PRIMARY meaning as \"soaking/steeping/macerating\" (not dust), with \"dust\" as a derived extension (dust \"soaks\" the air). The third meaning, \"loud cry/clamor,\" connects to battle sounds. Lisan al-Arab preserves all three: islatma/toz/ses. The semantic unity is \"filling/permeation of a medium.\" The indefinite accusative (tanwin) naq'an creates an open-ended quality — \"a naq'\" rather than \"the naq'\" — leaving the nature of the dust/sound/soaking deliberately unspecified. The word's placement as the final stressed syllable of the ayah (-'an) creates rhythmic cohesion with the surah's overall pattern: dabh-an, qadh-an, subh-an, naq'-an, jam'-an — all indefinite accusative verbal nouns/concrete nouns ending in -an. Phonetically, naq'an begins with the nasal n, moves to the deep velar q, and ends with the pharyngeal 'ayn — a sound trajectory from the front of the mouth to the deep throat, mimicking something rising from the ground into the air.", "criticalTr": "naq'an bir HAPAX LEGOMENON'dur — n-q-' kokunun tum Kur'an'daki tek gecisi. Bu onu Kur'an sozvarlilginin en nadir sozcuklerinden biri yapar. Kelimenin anlami diger Kur'an kullanimlarindan ucgenlenemez ve tamamen klasik Arapca sozlukbilidime baglidir. Lane's Lexicon BIRINCIL anlam olarak \"islatma/biraktirma\" (toz degil) verir, \"toz\" turetilmis uzanti olarak (toz havayi \"islatir\"). Ucuncu anlam \"yuksek ses/gultu\" savas seslerine baglanir. Lisanu'l-Arab ucunu de korur: islatma/toz/ses. Anlamsal birlik \"bir ortami doldurma/nufuz etme\"dir. Belirsiz mansub (tenvin) naq'an acik uclu bir nitelik yaratir — \"bir naq'\" \"o naq'\" degil — toz/ses/islatmanin dogasini kasitli olarak belirsiz birakir. Kelimenin ayetin son vurgulu hecesi (-'an) olarak yerlesimi surenin genel deseniyle ritimsel uyum yaratir: dabh-an, qadh-an, subh-an, naq'-an, jam'-an — tumuu belirsiz mansub masdarlar/somut isimler -an ile biter. Fonetik olarak naq'an burunsal n ile baslar, derin girtlaksal q'ya gecer ve faringal ayin ile biter — agizin onunden derin bogaza bir ses yolculugu, yerden havaya yukselen bir seyi taklit eder.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran use the hapax legomenon naq' (n-q-') here rather than a more common word for dust like ghubar or turab? Does the rarity of the word signal a deliberate semantic multiplicity?", "Does naq'an carry all three classical meanings simultaneously — dust, clamor, and soaking — or does context force a choice? Can the ayah sustain a triple reading?", "The pronoun -hi in bihi is masculine singular amid feminine plural subjects. Is this a standard Arabic referential pattern, or does it signal something beyond the horses themselves?", "The irregular qiraat fa-aththarna (Form II) shifts from \"stirring up\" to \"deeply imprinting.\" Does this variant preserve an older reading tradition where the emphasis was on permanent marks rather than transient dust?", "The root '-th-r means both \"to stir up\" and \"to leave a trace\" — can both meanings operate simultaneously? The chargers both disturb the air AND leave marks on the ground?", "The n-q-' root's primary meaning is \"soaking/steeping.\" If the ayah means \"they soaked/saturated [the ground] thereby,\" does this describe blood-soaking of a battlefield rather than dust-raising?", "The fa-chain in 100:1-5 creates a cinematographic sequence. Does the shift from participle-noun (100:1-3) to past-tense-verb (100:4-5) signal a temporal or ontological shift — from description to event, from attribute to act?", "Lane's Lexicon attests naq' as \"the sound of a trumpet.\" In a futuristic reading, could naq'an describe any signal that fills and saturates space — electromagnetic waves, broadcast transmissions, alarm signals?", "The surah's oath sequence (100:1-5) shares structural parallels with 51:1-6 (wa-dh-dhariyati dharwan). Both describe forces of motion with accusative verbal nouns. Are these oath-sequences describing the same phenomenon with different vocabulary?", "Does the agricultural meaning of atharna (plowing/turning soil) create a deliberate ambiguity — the chargers are simultaneously warriors and cultivators, destroyers and producers?"], "questionsTr": ["Kur'an neden burada toz icin gubar veya turab gibi daha yaygin bir sozcuk yerine hapax legomenon olan naq' (n-q-') kokunu kulllanir? Kelimenin nadirliigi kasitli bir anlamsal cogullugu mu isaret eder?", "naq'an uc klasik anlamini da ayni anda mi tasir — toz, gultu ve islatma — yoksa baglam bir secim mi zorlar? Ayet uclu bir okumayi surdurebilir mi?", "bihi'deki -hi zamiri disil cogul ozneler arasinda tekil erildir. Bu standart bir Arapca gonderme deseni mi, yoksa atlarin otesinde bir seyi mi isaret eder?", "Duzensiz kiraat fa-eththerne (II. bab) \"kaldirma\"dan \"derinden isaretleme\"ye kaydirir. Bu varyant vurgunun gecici tozdan ziyade kalici izler uzerinde oldugu daha eski bir okuma gelenegini mi korur?", "'-th-r koku hem \"kaldirmak\" hem \"iz birakmak\" anlamina gelir — iki anlam ayni anda isleyebilir mi? Kosanlar hem havayi bozar HEM de yerde iz birakir?", "n-q-' kokunun birincil anlami \"islatma/biraktirma\"dir. Ayet \"onunla [yeri] islattilar/doyurduIar\" anlamina gelirse, bu toz kaldirmadan ziyade bir savas alaninin kanla islanmasini mi tanimlar?", "100:1-5'teki fa-zinciri sinematografik bir dizi olusturur. Ism-i fail + isimden (100:1-3) gecmis zaman fiiline (100:4-5) gecis zamansal veya ontolojik bir kaymaayi mi isaret eder — betimlemeden olaya, nitelikten eyleme?", "Lane's Lexicon naq' icin \"boru sesi\" anlamini dogrualar. Gelecekci bir okumada naq'an mekani dolduran ve doyuran herhangi bir sinyali tanimlayabilir mi — elektromanyetik dalgalar, yayin iletimleri, alarm sinyalleri?", "Surenin kasem dizisi (100:1-5) 51:1-6 (ve'z-zariyati zerven) ile yapisal paraleller paylasir. Ikisi de hareket guclerini mansub masdarlarla tanimlar. Bu kasem dizileri farkli kelime dagarcigiyla ayni olguyu mu tanimlar?", "atharna'nin zirai anlami (surme/toprak isleme) kasitli bir belirsizlik yaratir mi — kosanlar ayni anda hem savaasci hem ciftci, hem yikici hem ureticidirler?"], "key": "100:4"}, "100:5": {"surah": 100, "ayah": 5, "arabic": "فَوَسَطْنَ بِهِۦ جَمْعًا", "transliteration": "fa-wasaṭna bihi jam'an", "readings": [{"text": "Then they penetrated thereby into the midst of a gathering — the charging horses burst into the center of an assembled host by means of that dawn raid.", "textTr": "Boylece o sayede bir toplulugu yardilar — hucum eden atlar safak baskiniyla bir ordunun ortasina daldilar.", "rationale": "The fa is ta'qib (immediate sequence), connecting to the preceding oath sequence (100:1-4). wasatna is Form I past tense with feminine plural subject (the horses, al-'adiyat). bihi refers back to the entire preceding scenario (the dawn raid with sparks and dust). jam'an is accusative as direct object, meaning \"a gathered host/assembly.\"", "rationaleTr": "Fa ta'kib (hemen ardindanlik) islevindedir, onceki kasem dizisine (100:1-4) baglanir. wasatna I. bab gecmis zaman, disil cogul ozne (atlar, el-adiyat). bihi onceki tum senaryoya (kivilcimli ve tozlu safak baskini) donuk zamir. jam'an mansub dogrudan nesne, \"toplanmis bir topluluk\" anlaminda."}, {"text": "Then they split apart thereby a collective body — the mares divided a unified group into fragments by their charge.", "textTr": "Boylece o sekilde bir butunu parcaladilar — kisraklar hucumlariyla birlesik bir grubu bozdular.", "rationale": "wasatna read with emphasis on the splitting/dividing sense of w-s-t — to enter the middle is to bisect. jam'an as an abstract collective unity rather than a specific army, emphasizing the act of disruption.", "rationaleTr": "wasatna, w-s-t kokununun bolme/ayirma anlamina vurguyla okunur — ortasina girmek ikiye bolmektir. jam'an belirli bir ordu degil soyut bir kolektif birlik, bozma eylemini vurgular."}, {"text": "Then they centered themselves thereby in a mass — the horses positioned themselves at the heart of a formation, not charging through but occupying the center.", "textTr": "Boylece o vasitayla bir kutlenin merkezine yerlestilar — atlar bir formasyonun kalbine yerlesip orayi tuttular.", "rationale": "wasatna from w-s-t in its positional sense: \"to be in the middle, to center oneself.\" Not violent penetration but strategic positioning. jam'an as the mass/formation they occupy the center of, not necessarily enemies.", "rationaleTr": "wasatna, w-s-t kokunden konumsal anlamda: \"ortada olmak, merkeze yerleismek.\" Siddetli bir yarilma degil stratejik konumlanma. jam'an merkeze yerlestikleri kutle/formasyon, zorunlu olarak dusman degil."}, {"text": "Then they mediated thereby a collective matter — the agents (not necessarily horses) brought balance to a communal dispute or collective situation by intervening at its center.", "textTr": "Boylece o vasitayla kolektif bir meseleyi arabalik ettilar — failler (zorunlu olarak atlar degil) bir topluluk meselesine merkezinden mudahale ederek denge getirdiler.", "rationale": "wasatna from w-s-t in its ethical/mediatory sense (cf. 2:143 ummatan wasatan \"a middle/balanced community\"). jam'an as a collective situation requiring mediation. The feminine plural subject could be abstract agents or forces, not only horses.", "rationaleTr": "wasatna, w-s-t kokunden etik/arabuluculuk anlaminda (kr. 2:143 ummeten veseten \"dengeli/orta topluluk\"). jam'an arabuluculuk gerektiren kolektif bir durum. Disil cogul ozne soyut failler veya kuvvetler olabilir, sadece atlar degil."}, {"text": "Then they data-mined thereby a dataset — processing agents penetrated into the core of an aggregated collection, extracting central patterns from assembled information.", "textTr": "Boylece o yolla bir veri kumesini analiz ettiler — islem ajanlari toplanmis bilginin cekirdegine nufuz ederek merkezi oruntuleri cikardilar.", "rationale": "Futuristic reading: wasatna as penetrating to the center/core of a jam' (aggregation, collection) — data mining, core extraction from large datasets. bihi as instrumental (by means of a tool/algorithm). The charging-into-the-center imagery maps onto computational penetration of data clusters.", "rationaleTr": "Futuristik okuma: wasatna bir jam' (toplama, koleksiyon) merkezine/cekirdegine nufuz etme — veri madenciligi, buyuk veri kumelerinden cekirdek cikarimi. bihi aracsal (bir arac/algoritma vasitasiyla). Merkezine dalma imgelemi veri kumelerine hesapsal nufuzla otusmaktadir."}], "structure": {"beats": [{"label": "Climactic penetration", "labelTr": "Doruk noktasi: nufuz", "lines": [{"arabic": "فَوَسَطْنَ بِهِۦ جَمْعًا", "translit": "fa-wasaṭna bihi jam'an", "english": "Then they penetrated thereby into the midst of a gathering", "turkish": "Boylece o sayede bir toplulugu yardilar"}]}], "summary": "This ayah is a single compact clause that serves as the climax of the oath sequence beginning at 100:1. The five preceding ayahs build a kinetic sequence (charging, striking sparks, raiding at dawn, raising dust) and this ayah delivers the result with fa (consequential \"then\"). The verb wasatna carries the feminine plural subject from al-'adiyat (100:1), maintaining grammatical continuity across the oath. The instrumental bihi points back to the entire preceding scenario, and jam'an (indefinite accusative) as the direct object leaves the identity of the \"gathering\" deliberately open. The verse is remarkably compressed: three words (excluding the conjunction) accomplish subject, instrument, action, and object.", "summaryTr": "Bu ayet, 100:1'de baslayan kasem dizisinin doruk noktasi olan tek bir yogun cumlelciktir. Onceki bes ayet kinetik bir dizi olusturur (hucum, kivilcim, safak baskini, toz kaldirma) ve bu ayet fa (sonuc bildiren \"boylece\") ile sonucu verir. wasatna fiili disil cogul ozneyi el-adiyat'tan (100:1) tasir, kasem boyunca dilbilgisel surekliligi korur. Aracsal bihi tum onceki senaryoya isaret eder ve jam'an (belirsiz mansub) dogrudan nesne olarak \"topluluk\" kimligini kasitli olarak acik birakir. Ayet olagan ustu derecede sikistirilmistir: uc kelime (baglac haric) ozne, arac, eylem ve nesneyi basarir."}, "words": [{"id": 1, "arabic": "فَ", "translit": "fa", "gloss": "then / so / consequently", "glossTr": "boylece / sonra / bunun uzerine", "userNotes": "", "root": "— (—)", "grammar": "Conjunction functioning as ta'qib (immediate sequence), linking this clause as the result/climax of the oath sequence in 100:1-4. Governs the subsequent verb.", "grammarTr": "Ta'kib (hemen ardindanlik) islevi goren baglac, bu cumleyi 100:1-4'teki kasem dizisinin sonucu/doruk noktasi olarak baglar. Sonraki fiili yonetir.", "semantics": ["ta'qib (immediate sequence): \"then/so\" — action follows immediately, no gap", "sababiyya (causation): \"therefore/thus\" — marks result or consequence", "istinaf (resumptive): starts a new clause", "Classical lexicon (Lane): fa as a conjunction of immediate subsequence; also introduces the apodosis (jawab) of an oath or condition"], "semanticsTr": ["Ta'kib (hemen ardindanlik): \"sonra/boylece\" — eylem hemen takip eder, ara yok", "Sebebiyye (nedensellik): \"bundan dolayi/dolayisiyla\" — sonuc veya netice bildirir", "Istinaf (yeniden baslama): yeni cumlecik baslatir", "Klasik sozluk (Lane): fa hemen ardindanlik baglacidir; ayrica kasem veya sartin cevabini (jawab) getirir"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The fa here is structurally pivotal: it marks the transition from the oath series (100:1-4, all describing the horses' actions) to the oath's culminating act. In Arabic oath structures, the fa often introduces the jawab al-qasam (the response/content of the oath). However, the actual jawab al-qasam comes later (100:6, inna l-insana li-rabbihi la-kanud). This fa is therefore an intermediate connector — it completes the horse imagery before the oath's real content. This creates a double-layered structure: fa connects the action sequence, while the theological statement is still pending. The fa thus functions simultaneously as ta'qib (sequential) within the horse narrative and as a bridge to the oath's theological payload.", "criticalTr": "Buradaki fa yapisal olarak kilit oneme sahiptir: kasem dizisinden (100:1-4, hepsi atlarin eylemlerini tanimlar) kasemin doruk eylemine gecisi isaretler. Arapca kasem yapilarinda fa genellikle jawab al-qasam'i (kasemin cevabi/icerigi) getirir. Ancak gercek jawab al-qasam sonra gelir (100:6, inne'l-insane li-rabbihi le-kenud). Bu fa dolayisiyla bir ara baglayicidir — at imgelerini kasemin gercek iceriginden once tamamlar. Bu cift katmanli bir yapi olusturur: fa eylem dizisini baglarken, teolojik ifade hala beklemededir. Fa boylece at anlatisi icinde ta'kib (ardisiklik) ve kasemin teolojik yukune kopru olarak es zamanli isler."}, {"id": 2, "arabic": "وَسَطْنَ", "translit": "wasaṭna", "gloss": "they penetrated the middle / they entered the center / they split through the midst", "glossTr": "ortasina daldilar / merkezine girdilar / ortasindan yardilar", "userNotes": "", "root": "و س ط (w-s-ṭ)", "grammar": "Perfect verb, Form I, 3rd person feminine plural. Subject is the mares (al-'adiyat) from 100:1, carried across the oath. Transitive — takes jam'an as direct object.", "grammarTr": "Gecmis zaman fiil, I. bab, ucuncu sahis disil cogul. Ozne 100:1'den kasem boyunca tasinan kisraklar (el-adiyat). Gecisli — jam'an'i dogrudan nesne olarak alir.", "semantics": ["fa'ala (I): to be in the middle, to occupy the center; wasaṭa l-qawm = he entered/penetrated the middle of the people", "Classical lexicon (Lane): wasaṭa, yasiṭu — to be in the middle of, to penetrate to the center of; wasaṭa l-qawm = he came among the people, he entered their midst; also: he divided them by entering their center", "Classical lexicon (Lane): al-wasaṭ = the middle, the center, the best part; wasaṭ al-shay' = the best of the thing (middle = best in Arabic value system)", "Classical lexicon (Lisan al-Arab): wasaṭa fi qaumi-hi = he was of noble/middle lineage among his people; wasaṭ = noble, select, of the best quality", "Classical lexicon (Hans Wehr): to be in the middle; to mediate, to intercede; tawassaṭa = to mediate, to intervene; wasīṭ = mediator, intermediary", "Quranic adjectival usage (2:143): ummatan wasaṭan = a balanced/middle/just community — wasaṭ as ethical moderation", "Modern: to mediate (legal/diplomatic), to center, to moderate; wasīṭ = broker, agent; tawassuṭ = mediation", "Futuristic: to penetrate the core of a system, to center-access, to reach the kernel (computational, data-core penetration)", "Core concept: occupying or penetrating the center — physically (entering the midst), ethically (balance/moderation), or socially (noble lineage as \"central\" to a people)"], "semanticsTr": ["fe'ale (I. bab): ortada olmak, merkezi isgal etmek; wasata'l-qavm = halkinin ortasina girdi/daldi", "Klasik sozluk (Lane): wasata, yasitu — bir seyin ortasinda olmak, merkezine nufuz etmek; wasata'l-qavm = halkinin arasina girdi; ayrica: merkezine girerek onlari boldu", "Klasik sozluk (Lane): el-vasat = orta, merkez, en iyi kisim; vasat'us-sey = seyin en iyisi (Arap deger sisteminde orta = en iyi)", "Klasik sozluk (Lisanu'l-Arab): vasata fi kavmihi = kavmi arasinda soylu/orta soyluydu; vasat = soylu, seckin, en iyi nitelikte", "Klasik sozluk (Hans Wehr): ortada olmak; arabuluculuk etmek; tevessut = arabuluculuk; vasit = araci", "Kur'an'da sifat kullanimi (2:143): ummeten vasaten = dengeli/orta/adil topluluk — vasat etik olcululuk olarak", "Modern: arabuluculuk etmek (hukuki/diplomatik), merkezlemek; vasit = komisyoncu, araci; tevassut = arabuluculuk", "Futuristik: bir sistemin cekirdegine nufuz etmek, merkez erisimi, cekirdege ulasmak (hesapsal, veri cekirdegi penetrasyonu)", "Kok kavram: merkezi isgal etmek veya merkezine nufuz etmek — fiziksel (ortasina girmek), etik (denge/olcululuk) veya sosyal (bir halkin \"merkezi\" olarak soylu soy)"], "occurrences": {"type": "all", "items": [{"ref": "100:5", "arabic": "— this verse —", "english": "The ONLY occurrence of w-s-t as a perfect verb in the entire Quran. All other w-s-t occurrences are adjectival (wasatan 2:143, al-wusta 2:238, awsat 5:89, 68:28). This verbal usage is unique — the Quran deploys the root as a verb only here, making it a hapax legomenon for the verbal form.", "turkish": "w-s-t kokunden gecmis zaman fiil olarak tum Kur'an'da TEK kullanim. Diger tum w-s-t kullanislari sifat bicimindedir (vasaten 2:143, el-vusta 2:238, evsat 5:89, 68:28). Bu fiil kullanimi benzersizdir — Kur'an bu koku fiil olarak yalnizca burada kullankarak bu fiil bicimine bir hapax legomenon olusturur."}, {"ref": "2:143", "arabic": "وَكَذَٰلِكَ جَعَلْنَٰكُمْ أُمَّةًۭ وَسَطًۭا لِّتَكُونُوا۟ شُهَدَآءَ عَلَى ٱلنَّاسِ وَيَكُونَ ٱلرَّسُولُ عَلَيْكُمْ شَهِيدًۭا", "english": "And thus We made you a middle/balanced community (ummatan wasaṭan) so that you be witnesses over the people and the Messenger be a witness over you.", "turkish": "Ve boylece sizi dengeli/orta bir topluluk (ummeten vasaten) kildik ki insanlara sahitler olasiniz ve Resul de size sahit olsun."}, {"ref": "2:238", "arabic": "حَٰفِظُوا۟ عَلَى ٱلصَّلَوَٰتِ وَٱلصَّلَوٰةِ ٱلْوُسْطَىٰ وَقُومُوا۟ لِلَّهِ قَٰنِتِينَ", "english": "Guard the prayers and the middle prayer (al-salat al-wusta) and stand for God in devout obedience.", "turkish": "Namazlari ve orta namazi (es-salatu'l-vusta) koruyun ve Allah icin husu ile ayaga kalkin."}, {"ref": "5:89", "arabic": "لَا يُؤَاخِذُكُمُ ٱللَّهُ بِٱللَّغْوِ فِىٓ أَيْمَٰنِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا عَقَّدتُّمُ ٱلْأَيْمَٰنَ ۖ فَكَفَّٰرَتُهُۥٓ إِطْعَامُ عَشَرَةِ مَسَٰكِينَ مِنْ أَوْسَطِ مَا تُطْعِمُونَ أَهْلِيكُمْ", "english": "God will not hold you accountable for thoughtless oaths, but He will hold you for oaths you have bound. Its expiation is feeding ten needy persons from the average/middle (awsaṭ) of what you feed your families.", "turkish": "Allah sizi yeminlerinizdeki bos sozle sorumlu tutmaz, fakat baglayici yeminlerden tutar. Kefareti on yoksulu ailelerinize yedirdiginizin ortalamasindan (evsat) yedirmektir."}, {"ref": "68:28", "arabic": "قَالَ أَوْسَطُهُمْ أَلَمْ أَقُل لَّكُمْ لَوْلَا تُسَبِّحُونَ", "english": "The most moderate/best (awsaṭuhum) among them said: Did I not tell you — why do you not glorify?", "turkish": "Ortancalari/en makulleri (evsatuhum) dedi: Size demedim mi — neden tesbih etmiyorsunuz?"}]}, "qiraat": [{"arabic": "فَوَسَّطْنَ", "translit": "fa-wassaṭna", "status": "Irreg", "type": "Vr", "note": "Irregular variant with tashdid on the sin, making it Form II (intensive/causative): \"then they thoroughly penetrated / they caused penetration into the center\" — the doubling intensifies the action, suggesting more violent or deliberate penetration. Form II wassat.a implies repeated or emphatic centering.", "noteTr": "Sin uzerinde tesditli duzensiz varyant, II. bab (yogunlastirici/ettirgen) yapar: \"sonra iyice daldilar / merkezine sokulmaya sebep oldilar\" — ikilesme eylemi yogunlastirir, daha siddetli veya kasitli nufuz ima eder. II. bab vassata tekrarlanan veya vurgulu merkezlemeyi ifade eder.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "j-m-'", "coRootAr": "ج م ع", "count": "1", "refs": "100:5", "note": "w-s-t paired with j-m-' only in this ayah — penetrating the center of a gathering. The verbal form of \"centering\" meets the nominal form of \"gathering,\" creating a unique semantic event: the act of reaching the core of a collective. <- IN THIS AYAH", "noteTr": "w-s-t ile j-m-' yalnizca bu ayette eslesir — bir toplulugu merkezinden yarmak. \"Merkezleme\" fiil bicimiyle \"toplama\" isim bicimi bulusarak benzersiz bir anlamsal olay olusturur: bir kolektifin cekirdegine ulasma eylemi. <- BU AYETTE"}, {"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "3", "refs": "2:143;2:238;5:89", "note": "w-s-t co-occurs with '-l-h (God) in all three adjectival instances — middle community, middle prayer, feeding from the middle. The concept of \"middle/center\" consistently appears in divine instruction contexts.", "noteTr": "w-s-t, '-l-h (Allah) ile uc sifat kullaniminin hepsinde birlikte gecer — orta ummet, orta namaz, ortalamasindan yedirmek. \"Orta/merkez\" kavrami tutarli olarak ilahi talimat baglamlarinda ortaya cikar."}], "critical": "wasatna is a hapax legomenon as a verbal form in the Quran — the root w-s-t appears 5 times total, but only here as a perfect verb. All other instances are adjectival (wasatan, al-wusta, awsat). This verbal activation of an otherwise purely adjectival root is grammatically remarkable: the Quran \"verbalizes\" the concept of center/middle exclusively in this violent/dynamic context, transforming a static quality (being in the middle) into a kinetic action (penetrating into the middle). The Form II variant (fa-wassatna, Irreg) would intensify this further, suggesting repeated or thorough penetration. The tension between the root's ethical/moderate associations (2:143 ummatan wasatan) and its kinetic/violent deployment here creates a profound semantic polarity within the same root. The phonetic texture — the emphatic t (ta) combined with the sibilant s (sin) — produces a sharp, cutting sound that mirrors the splitting action.", "criticalTr": "wasatna, Kur'an'da fiil bicimi olarak bir hapax legomenon'dur — w-s-t koku toplam 5 kez gecer, ama sadece burada gecmis zaman fiil olarak. Diger tum ornekler sifat bicimindedir (vasaten, el-vusta, evsat). Aksi halde tamamen sifatsal bir kokun bu fiilsel aktivasyonu dilbilgisel olarak dikkat cekicidir: Kur'an \"merkez/orta\" kavramini yalnizca bu siddetli/dinamik baglamda fiillestirmisstir, statik bir niteligi (ortada olmak) kinetik bir eyleme (ortasina nufuz etmek) donusturur. II. bab varyanti (fa-vassatna, duzensiz) bunu daha da yogunlastirir, tekrarlanan veya kapsamli nufuz ima eder. Kokun etik/olculu cagrisimlari (2:143 ummeten vasaten) ile buradaki kinetik/siddetli kullanimi arasindaki gerilim, ayni kok icinde derin bir anlamsal kutupluluk olusturur. Fonetik doku — vurgulu t (ta) ile tislayan s (sin) birlesimi — yarilma eylemini yansiyan keskin, kesen bir ses uretir.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "بِ", "translit": "bi", "gloss": "by / by means of / thereby", "glossTr": "ile / vasitasiyla / o sayede", "userNotes": "", "root": "— (—)", "grammar": "Preposition governing the genitive. Attached to the pronoun hi (him/it). Here functions as instrumental (ba' al-isti'ana) — \"by means of it.\"", "grammarTr": "Mecrur hali yoneten edat. hi (o/onu) zamirine baglidir. Burada aracsal (ba'u'l-isti'ane) islevindedir — \"onun vasitasiyla.\"", "semantics": ["Instrument/means (ba' al-isti'ana): by, by means of, with, through", "Accompaniment (ba' al-musahaba): with, together with, accompanied by", "Causation (ba' al-sababiyya): because of, due to, on account of", "Classical lexicon (Lane): bi as particle of swearing, accompaniment, instrument, cause, seeking help, transition, encompassing"], "semanticsTr": ["Arac/vasita (ba'u'l-isti'ane): ile, vasitasiyla, araciligiyla", "Beraberlik (ba'u'l-musahabe): ile, birlikte, esliginde", "Nedensellik (ba'u's-sebebiyye): nedeniyle, yuzunden, dolayi", "Klasik sozluk (Lane): bi yemin, beraberlik, arac, sebep, yardim isteme, gecis, kusatma edati olarak"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The bi here is ambiguous between instrumental and causal readings. As instrumental (ba' al-isti'ana): \"by means of it/that\" — the horses penetrated the gathering by means of the dawn-raid scenario described in 100:1-4. As causal (ba' al-sababiyya): \"because of it/him\" — they penetrated because of what preceded. The pronoun hi in bihi can refer to: (1) the subh (dawn) from 100:3, (2) the naq' (dust) from 100:4, (3) the entire scenario of 100:1-4 collectively, or (4) their rider/commander. This referential ambiguity is likely deliberate — the preposition and pronoun create a semantic funnel that draws the entire preceding oath sequence into the climactic action.", "criticalTr": "Buradaki bi aracsal ve nedensel okumalar arasinda belirsizdir. Aracsal (ba'u'l-isti'ane) olarak: \"onun vasitasiyla\" — atlar 100:1-4'teki safak baskini senaryosu vasitasiyla toplulugun ortasina daldilar. Nedensel (ba'u's-sebebiyye) olarak: \"ondan dolayi\" — oncekinden dolayi daldilar. bihi'deki hi zamiri sunlara donebilir: (1) 100:3'teki subh (safak), (2) 100:4'teki nak' (toz), (3) 100:1-4'un tumune toplu olarak, veya (4) binicilerine/komutanlarina. Bu gonderim belirsizligi muhtemelen kasitlidir — edat ve zamir, tum onceki kasem dizisini doruk eyleme ceken anlamsal bir huni olusturur."}, {"id": 4, "arabic": "هِ", "translit": "hi", "gloss": "it / him", "glossTr": "o / onu", "userNotes": "", "root": "— (—)", "grammar": "3rd person masculine singular pronoun suffix, attached to the preposition bi. Referent is ambiguous — can point to the dawn (subh, 100:3), the dust (naq', 100:4), the entire preceding scenario, or the rider.", "grammarTr": "Ucuncu sahis tekil eril zamir eki, bi edatina baglidir. Gonderimi belirsiz — safak (subh, 100:3), toz (nak', 100:4), tum onceki senaryo veya biniciye isaret edebilir.", "semantics": ["3rd person masculine singular clitic pronoun: him, it, his", "Classical lexicon (Lane): hu/hi — bound pronoun for absent masculine singular referent; in context attaches to prepositions, verbs, and nouns"], "semanticsTr": ["Ucuncu sahis tekil eril bitisik zamir: o, onu, onun", "Klasik sozluk: hu/hi — gaibin tekil eril zamir; baglamda edat, fiil ve isimlere eklenir"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The pronoun hi creates one of the key interpretive cruxes of this ayah. Its masculine singular form must refer to a masculine singular antecedent. Candidates: (1) al-subh (dawn, 100:3) — masculine, \"by means of the dawn [raid]\"; (2) al-naq' (dust, 100:4) — masculine, \"by means of the dust [cloud as cover]\"; (3) al-igharah (the raid/charge) — feminine, so grammatically less likely unless understood as a conceptual referent; (4) the implied rider or commander — masculine, \"by his [command]\"; (5) the entire preceding verbal scenario taken as a masculine abstract — \"by means of all that.\" The grammatical constraint (masculine singular) narrows the field but does not eliminate ambiguity, since Arabic allows pronouns to refer to conceptual antecedents not explicitly stated.", "criticalTr": "hi zamiri bu ayetin kilit yorumsal dugumlerlnden birini olusturur. Tekil eril bicimi tekil eril bir oncule donuk olmalidir. Adaylar: (1) es-subh (safak, 100:3) — eril, \"safak [baskini] vasitasiyla\"; (2) en-nak' (toz, 100:4) — eril, \"toz [bulutu ortu olarak] vasitasiyla\"; (3) el-igarah (baskin/hucum) — disil, dilbilgisel olarak daha az olasi; (4) ima edilen binici veya komutan — eril, \"onun [emriyle]\"; (5) onceki tum fiilsi senaryonun eril soyut olarak alinmasi — \"tum bunun vasitasiyla.\" Dilbilgisel kisitlama (tekil eril) alaui daraltir ama belirsizligi ortadan kaldirmaz, cunku Arapcada zamirlerin acikca belirtilmemis kavramsal onculere gondermesine izin verilir."}, {"id": 5, "arabic": "جَمْعًا", "translit": "jam'an", "gloss": "a gathering / a collected host / an assembly / collectively", "glossTr": "bir topluluk / toplanmis bir kutle / bir meclis / topluca", "userNotes": "", "root": "ج م ع (j-m-')", "grammar": "Verbal noun (masdar/gerund) in the indefinite accusative. Functions as the direct object of wasatna. The tanwin (-an) marks indefiniteness, suggesting an unspecified gathering.", "grammarTr": "Belirsiz mansub mastar/isim-fiil. wasatna'nin dogrudan nesnesi olarak isler. Tenvin (-an) belirsizligi isaretler, belirtilmemis bir toplulugu ima eder.", "semantics": ["fa'ala (I): to gather, to collect, to assemble, to bring together, to unite", "Classical lexicon (Lane): jam'a — to collect, to congregate, to amass; jam' = a collection, an assembly, a body of people, a troop; also: copulation, sexual union; al-jam' = the act of gathering; jami' = comprehensive, inclusive", "Classical lexicon (Lisan al-Arab): jam' = an army, a host assembled for battle; also: jam' as Muzdalifah (the gathering place during Hajj); jam' al-qur'an = collecting/compiling the Quran", "Classical lexicon (Hans Wehr): to gather, collect, unite, combine; jam' = gathering, collection, accumulation; also: plural (grammatical); jam'iyya = association, society", "Quranic gerund usage: jam'an as accusative of state (hal) = \"collectively, all together\" OR as direct object = \"a gathering/host\"", "Modern: to aggregate data, to compile, to pool resources; jam' = aggregation, dataset, collection", "Futuristic: data aggregation, clustered information, assembled dataset — jam' as any organized collection of units", "Core concept: the act or result of bringing discrete units into one body — physical assembly, military host, data collection, or conceptual unification"], "semanticsTr": ["fe'ale (I. bab): toplamak, bir araya getirmek, biriktirmek, birlestirmek", "Klasik sozluk (Lane): cem'a — toplamak, toplantiya cagirmak, yigmak; cem' = topluluk, meclis, bir grup insan, birlik; ayrica: cinsel birlesme; el-cem' = toplama eylemi; cami' = kapsamli, kapsayici", "Klasik sozluk (Lisanu'l-Arab): cem' = savas icin toplanmis ordu; ayrica: Muzdelife (Hac'da toplanti yeri); cem'u'l-Kur'an = Kur'an'in derlenmesi", "Klasik sozluk (Hans Wehr): toplamak, derlemek, birlestirmek; cem' = toplanti, koleksiyon, birikim; ayrica: cogul (dilbilgisel); cem'iyyet = dernek, topluluk", "Kur'an'da mastar kullanimi: cem'en hal mansubi (durum zarfi) = \"topluca, hep birlikte\" VEYA dogrudan nesne = \"bir topluluk/ordu\"", "Modern: veri toplama, derleme, kaynak havuzlama; cem' = kumeleme, veri kumesi, koleksiyon", "Futuristik: veri kumelenmesi, kumelenmis bilgi, derlenlis veri kumesi — cem' herhangi bir organize birim toplulugu", "Kok kavram: ayri birimleri bir butun icinde birlestirme eylemi veya sonucu — fiziksel toplanma, askeri birlik, veri toplama veya kavramsal birlestirme"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Gerund/masdar forms — the act of gathering or a gathered body", "count": "~5 ayahs", "examples": [{"ref": "28:78", "arabic": "قَالَ إِنَّمَآ أُوتِيتُهُۥ عَلَىٰ عِلْمٍ عِندِىٓ ۚ أَوَلَمْ يَعْلَمْ أَنَّ ٱللَّهَ قَدْ أَهْلَكَ مِن قَبْلِهِۦ مِنَ ٱلْقُرُونِ مَنْ هُوَ أَشَدُّ مِنْهُ قُوَّةًۭ وَأَكْثَرُ جَمْعًۭا", "english": "He said: I was given it only because of knowledge I possess. Did he not know that God had destroyed before him from the generations those who were mightier than him in power and greater in gathering/accumulation (jam'an)?", "turkish": "Dedi: Bu bana yalnizca sahip oldugum bilgi sayesinde verildi. Bilmedi mi ki Allah ondan once nesillerden guc bakimindan daha siddetli ve biriktirme (cem'an) bakimindan daha cok olanlari helak etti?"}, {"ref": "18:99", "arabic": "۞ وَتَرَكْنَا بَعْضَهُمْ يَوْمَئِذٍۢ يَمُوجُ فِى بَعْضٍۢ ۖ وَنُفِخَ فِى ٱلصُّورِ فَجَمَعْنَٰهُمْ جَمْعًۭا", "english": "And We left some of them that day surging into others, and the trumpet was blown, and We gathered them in a gathering (jam'an) — a comprehensive assembly.", "turkish": "Ve o gun onlari birbirinin icine dalga dalga biraktik, Sur'a uflendi ve onlari bir toplama (cem'an) ile topladik — kapsamli bir toplanma."}, {"ref": "42:29", "arabic": "وَمِنْ ءَايَٰتِهِۦ خَلْقُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ وَمَا بَثَّ فِيهِمَا مِن دَآبَّةٍۢ ۚ وَهُوَ عَلَىٰ جَمْعِهِمْ إِذَا يَشَآءُ قَدِيرٌۭ", "english": "And among His signs is the creation of the heavens and the earth and what He scattered in them of creatures. And He is capable of gathering them (jam'ihim) when He wills.", "turkish": "O'nun ayetlerinden biri goklerin ve yerin yaratilmasi ve ikisine yaydigi canlilarddir. Ve O dilediginde onlari toplamaya (cem'ihim) kadirdir."}]}, {"label": "B. Abstract noun forms — gathering/assembly as concept", "count": "~79 ayahs", "examples": [{"ref": "3:173", "arabic": "ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدْ جَمَعُوا۟ لَكُمْ فَٱخْشَوْهُمْ فَزَادَهُمْ إِيمَٰنًۭا وَقَالُوا۟ حَسْبُنَا ٱللَّهُ وَنِعْمَ ٱلْوَكِيلُ", "english": "Those to whom the people said: The people have gathered (jama'u) against you, so fear them — but it increased them in faith and they said: God is sufficient for us and the best disposer of affairs.", "turkish": "Kendilerine insanlarin \"insanlar size karsi toplandi (ceme'u), onlardan korkun\" dedikleri kimseler — bu onlarin imanini artirdi ve \"Allah bize yeter, O ne guzel vekildir\" dediler."}, {"ref": "64:9", "arabic": "يَوْمَ يَجْمَعُكُمْ لِيَوْمِ ٱلْجَمْعِ ۖ ذَٰلِكَ يَوْمُ ٱلتَّغَابُنِ", "english": "The day He gathers you for the Day of Gathering (yawm al-jam') — that is the Day of Mutual Dispossession.", "turkish": "Sizi Toplanma Gunu (yevmu'l-cem') icin toplayacagi gun — iste o Aldanma/Kisimsizlik Gunu'dur."}]}, {"label": "C. Active participle and concrete noun forms", "count": "~6 ayahs", "examples": [{"ref": "26:39", "arabic": "وَقِيلَ لِلنَّاسِ هَلْ أَنتُم مُّجْتَمِعُونَ", "english": "And it was said to the people: Will you be gathered (mujtami'un)?", "turkish": "Ve insanlara denildi ki: Toplanacak misiniz (muctemiunz)?"}, {"ref": "54:45", "arabic": "سَيُهْزَمُ ٱلْجَمْعُ وَيُوَلُّونَ ٱلدُّبُرَ", "english": "The assembly/host (al-jam') will be defeated and they will turn their backs.", "turkish": "Topluluk/ordu (el-cem') bozguna ugrayacak ve arkalarini donecekler."}]}]}, "qiraat": [], "cooccurrence": [], "critical": "jam'an is syntactically ambiguous between two parsings: (1) Direct object of wasatna: \"they penetrated a gathering\" — jam' as a concrete body of assembled people/enemies; (2) Accusative of state (hal): \"they penetrated [something] collectively/all together\" — describing how the horses acted, not what they penetrated. Both parsings are grammatically valid. Reading (1) makes jam'an the target; reading (2) makes it a manner adverb modifying the subject. Classical grammarians note both possibilities. The indefiniteness (tanwin) is significant: it is not \"the gathering\" (al-jam') but \"a gathering\" — leaving the identity, size, and nature of the assembled body deliberately unspecified. This indefiniteness creates universality: the image applies to any gathering, any era, any context. The root j-m-' appears 129 times in the Quran across diverse forms — from divine assembly (yawm al-jam') to enemy hosts (54:45 sa-yuhzamu l-jam') to Qarun's accumulation (28:78). Here the gathered body is the recipient of violent penetration, contrasting with the divine gathering contexts where jam' is purposeful and ordered.", "criticalTr": "jam'an iki farkli cozumleme arasinda sozdizimsel olarak belirsizdir: (1) wasatna'nin dogrudan nesnesi: \"bir topluluga daldilar\" — cem' somut bir toplanmis insan/dusman kutlesi; (2) Hal mansubi: \"topluca [bir seyi] yardilar\" — atlarin nasil hareket ettigini tanimlar, neyi deldiklerini degil. Her iki cozumleme dilbilgisel olarak gecerlidir. Okuma (1) cem'an'i hedef yapar; okuma (2) ozneyi niteleyen bir hal zarfi yapar. Klasik gramerciler her iki olasiligi kaydeder. Belirsizlik (tenvin) anlamlidir: \"o topluluk\" (el-cem') degil \"bir topluluk\" — toplanmis kutlenin kimligini, boyutunu ve dogasini kasitli olarak belirlemeden birakir. Bu belirsizlik evrensellik yaratir: imge herhangi bir topluluga, herhangi bir caga, herhangi bir baglama uygulanir. j-m-' koku Kur'an'da cesitli bicimlerde 129 kez gecer — ilahi toplanmadan (yevmu'l-cem') dusman birliklerine (54:45 se-yuhzemu'l-cem') Karun'un biriktirmesine (28:78). Burada toplanmis kutle siddetli nufuzun alicisidir, cem'in amacli ve duzenli oldugu ilahi toplanma baglamlariyla zitlik olusturur.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran activate the root w-s-t as a verb ONLY in this violent/kinetic context, when all other Quranic uses are peaceful/ethical adjectives (wasatan, wusta, awsat)?", "Does the semantic polarity within w-s-t (ethical moderation in 2:143 vs violent penetration in 100:5) constitute a deliberate root-level tension, and does it suggest that \"centering\" inherently involves both balance and disruption?", "What is the referent of the pronoun hi in bihi — dawn (subh), dust (naq'), the entire raid scenario, or an unstated masculine agent? Does the ambiguity serve a rhetorical purpose?", "Is jam'an a direct object (a gathering penetrated) or an accusative of state (collectively) — and does the double reading create a deliberate polysemy where the horses both act collectively AND penetrate a collective?", "The oath sequence (100:1-5) is entirely kinetic and physical. How does this physical imagery prepare for the theological declaration in 100:6 (inna l-insana li-rabbihi la-kanud)?", "Could the Form II variant fa-wassatna (with tashdid) reflect an older reading where the horses' action is understood as more deliberately splitting/dividing rather than merely entering?", "The word jam'an appears as both \"gathering of people\" (military host) and \"act of accumulating\" (28:78). In 100:5, does it carry a double charge — the gathered enemy AND the concept of accumulation that the surah will critique in 100:8?", "How does the compressed three-word clause (wasatna bihi jam'an) achieve narrative climax? Is the compression itself a grammatical enactment of the piercing, sudden action?", "In a futuristic reading, can \"penetrating the center of a collection\" describe analytical processes — data mining, core extraction, or pattern recognition within aggregated information?", "The root w-s-t carries \"nobility\" in classical Arabic (wasit al-nasab = of noble lineage). Does the verb wasatna carry any vestige of this — the horses' action being \"noble\" or \"of central importance\"?"], "questionsTr": ["Kur'an neden w-s-t kokunu yalnizca bu siddetli/kinetik baglamda fiil olarak kullankyor, diger tum Kur'ani kullanimlar baris/etik sifatlarken (vasaten, vusta, evsat)?", "w-s-t icindeki anlamsal kutupluluk (2:143'te etik olculukuk vs 100:5'te siddetli nufuz) kasitli bir kok-duzeyi gerilimi mi olusturur ve \"merkezleme\"nin dogasi geregi hem denge hem bozulma icerdigini mi ima eder?", "bihi'deki hi zamirinin gonderimi nedir — safak (subh), toz (nak'), tum baskin senaryosu mu yoksa belirtilmemis eril bir fail mi? Belirsizlik retorik bir amaca mi hizmet eder?", "jam'an dogrudan nesne mi (dalilan bir topluluk) yoksa hal mansubi mi (topluca) — ve cift okuma atlarin hem topluca hareket ettigini HEM DE bir toplulugu deldigi kasitli bir cok anlamlilkk mi yaratir?", "Kasem dizisi (100:1-5) tamamen kinetik ve fizikseldir. Bu fiziksel imgeleme 100:6'daki teolojik bildiriyi (inne'l-insane li-rabbihi le-kenud) nasil hazirlar?", "II. bab varyanti fa-vassatna (tesdidli) atlarin eyleminin sadece girmekten ziyade daha kasitli bir bolme/ayirma olarak anlasilddigi daha eski bir okumayi mi yansitir?", "jam'an hem \"insan toplulugu\" (askeri birlik) hem \"biriktirme eylemi\" (28:78) olarak gecer. 100:5'te cift yuk mu tasir — toplanmis dusman VE surenin 100:8'de elestircegi biriktirme kavrami?", "Sikistirilmis uc kelimelik cumlecik (vasatna bihi cem'en) anlatissal dorugu nasil basarir? Sikistirmanin kendisi delici, ani eylemin dilbilgisel icrasi mi?", "Futuristik bir okumada \"bir koleksiyonun merkezine nufuz etmek\" analitik surecleri tanimlayabilir mi — veri madenciligi, cekirdek cikarimi veya kumelenmis bilgi icinde oruntu tanima?", "w-s-t koku klasik Arapcada \"soyluluk\" tasir (vasitu'n-neseb = soylu soydan). wasatna fiili bunun bir izini tasir mi — atlarin eyleminin \"soylu\" veya \"merkezi oneme sahip\" olmasi?"], "key": "100:5"}, "100:6": {"surah": 100, "ayah": 6, "arabic": "إِنَّ ٱلْإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٌۭ", "transliteration": "inna l-insāna li-rabbihi la-kanūdun", "readings": [{"text": "Indeed the human being is, to his nurturer, surely ungrateful", "textTr": "Gerçekten insan, Rabbine karsi nankor bir varliktir", "rationale": "Standard reading: inna opens an emphatic nominal sentence with al-insān as its subject (ism of inna, accusative). li-rabbihi is a prepositional phrase (jārr wa-majrūr) functioning as a fronted predicate element or adverbial qualifier. la-kanūdun is the predicate (khabar of inna), doubly emphasized by the prefixed lām of emphasis (lām al-tawkīd). kanūd as an intensive adjective (fa'ūl pattern) from k-n-d denotes deep-seated, persistent ingratitude.", "rationaleTr": "Standart okuma: inne vurgulu isim cumlesi acar, el-insan ism-i inne olarak mansub haldedir. li-rabbihi harf-i cer + isim olarak okunur, habere takdim edilmis zarfi niteliginde veya haber unsuru olarak gorev yapar. le-kenudun inne'nin haberidir, basindaki lam-i te'kid ile cift vurgu tasir. Kenud fu'ul kalibinda mubalaga sifati olarak k-n-d kokuunden derin, surekli nankorluk ifade eder."}, {"text": "Indeed the human being is, in relation to his sustainer, surely cutting off (ties)", "textTr": "Suphesiz insan, onu yetistirenle baglantisini kesen bir varliktir", "rationale": "Reading kanūd from k-n-d in its sense of \"cutting off, severing\" (Lane's: kanada = he cut) rather than mere ingratitude. This reframes the human failing as active severance of a relational bond rather than passive failure to acknowledge. li-rabbihi then marks the relationship being severed: the human cuts ties with the very one who nurtures them.", "rationaleTr": "Kenud kelimesi k-n-d kokuunden \"kesmek, koparmak\" (Lane: kenede = kesti) anlamindan okunur, salt nankorluk yerine. Bu, insanin kusurunu pasif bir taniyamama yerine etkin bir iliskisel bag koparma olarak yeniden cerceveler. li-rabbihi o zaman koparilan iliskiyi isaretler: insan kendisini yetistiren varlika baglantisini keser."}, {"text": "Indeed the human being is, toward the one who cultivates them, surely resistant soil", "textTr": "Gercekten insan, kendisini yetistirene karsi, corak bir toprak gibidir", "rationale": "Reading kanūd through its agricultural semantic field: \"barren land that yields nothing despite rain\" (Lane's, Lisan al-Arab). The rabb (cultivator/nurturer) provides sustenance, but the insān is like dry, unyielding ground — receiving everything, producing nothing in return. li-rabbihi marks the direction of the relational failure. The agricultural metaphor resonates with the surah's equine imagery (the charging horses).", "rationaleTr": "Kenud tarima dayali anlam alaniyla okunur: \"yagmura ragmen hicbir sey vermeyen corak toprak\" (Lane, Lisanu'l-Arab). Rabb (yetistirici/terbiye edici) rizik saglar ama insan kuru, verimsiz toprak gibidir — her seyi alir, karsiliginda hicbir sey uretmez. li-rabbihi iliskisel basarisizligin yonunu belirler. Tarimsal metafor surenin at tasvirlerine (kosturulan atlar) yanki yapar."}, {"text": "Indeed the human being is, regarding what nurtures them, a denier of sources", "textTr": "Suphesiz insan, onu besleyen seye karsi, kaynaklarini inkar eden bir varliktir", "rationale": "Modern/futuristic reading: rabb not as a personal deity but as \"that which nurtures/sustains\" — any source of growth and provision. kanūd as one who denies the source of what sustains them. In modern context: denying the systems, ecosystems, relationships, and infrastructures that enable one's existence. Applicable to ecological denial, systemic ignorance, or any refusal to acknowledge dependency on sustaining networks.", "rationaleTr": "Modern/geleceksel okuma: rabb kisisel bir tanri olarak degil \"yetistiren/besleyen sey\" olarak — buyume ve rizik saglayan herhangi bir kaynak. Kenud kaynaklarini inkar eden kisi. Modern baglamda: varolusunu mumkun kilan sistemleri, ekosistemleri, iliskileri ve altyapilari inkar etmek. Ekolojik inkar, sistemik cehalete veya besleyen aglara bagimlilik kabul etmeme durumuna uygulanabilir."}, {"text": "Indeed the human being is, to his lord, assuredly a witness against himself", "textTr": "Gercekten insan, Rabbine karsi, kesinlikle kendi aleyhine bir sahittir", "rationale": "Alternative grammatical reading: kanūd as cognate to shahīd (witness pattern, fu'ūl), with the k-n-d root's sense of \"making manifest/evident\" — the human's ingratitude is self-evident, self-testifying. This connects to 100:7 (wa-innahu 'alā dhālika la-shahīdun) where the human IS a witness to this, creating a semantic echo between kanūd and shahīd in consecutive ayahs. The double-lām emphasis (la-kanūdun... la-shahīdun) creates a phonetic-semantic arc.", "rationaleTr": "Alternatif dilbilgisel okuma: kenud, sahid (tanik kalıbı, fu'ul) ile akraba olarak, k-n-d kokuunun \"aciga cikarma/belirgin kilma\" anlamiyla — insanin nankorluğu apaçik, kendi kendine taniklik eden bir seydir. Bu 100:7 (ve-innehu ala zalike le-sehidun) ile baglanir, burada insan buna TANIK'tir ve ardisik ayetlerde kenud ile sehid arasinda anlamsal yanki olusturur. Cift lam vurgusu (le-kenudun... le-sehidun) fonetik-anlamsal bir yay olusturur."}], "structure": {"beats": [{"label": "Emphatic declaration", "labelTr": "Vurgulu beyan", "lines": [{"arabic": "إِنَّ", "translit": "inna", "english": "Indeed / Surely", "turkish": "Gerçekten / Şüphesiz"}]}, {"label": "Subject: the human being", "labelTr": "Özne: insan", "lines": [{"arabic": "ٱلْإِنسَٰنَ", "translit": "al-insāna", "english": "the human being", "turkish": "insanı"}]}, {"label": "Relational qualifier", "labelTr": "İlişkisel niteleme", "lines": [{"arabic": "لِرَبِّهِۦ", "translit": "li-rabbihi", "english": "to his nurturer", "turkish": "Rabbine karşı"}]}, {"label": "Emphatic predicate", "labelTr": "Vurgulu yüklem", "lines": [{"arabic": "لَكَنُودٌۭ", "translit": "la-kanūdun", "english": "surely ungrateful / resistant", "turkish": "kesinlikle nankör / dirençli"}]}], "summary": "The ayah is an emphatic nominal sentence (jumla ismiyya mu'akkada) with three layers of emphasis: (1) inna as an emphatic particle introducing the clause, (2) the lām al-tawkīd prefix on kanūd, and (3) the fa'ūl intensive pattern of kanūd itself. The structure is: inna + ism (al-insāna, accusative) + jārr wa-majrūr (li-rabbihi, fronted) + khabar (la-kanūdun, nominative). The fronting of li-rabbihi before the predicate is significant — it places the RELATIONSHIP (to his rabb) before the JUDGMENT (ungrateful), foregrounding that the ingratitude is specifically relational, not abstract. The ayah functions as the thesis statement of Surah al-'Adiyat: after the oath sequence (100:1-5), this is the muqsam 'alayhi (the content sworn upon). The triple emphasis signals that this is a difficult truth requiring rhetorical force to establish.", "summaryTr": "Ayet uc katmanli vurguya sahip bir vurgulu isim cumlesidir (cumle-i ismiyye muekkede): (1) inne vurgu edati olarak, (2) kenud'un basindaki lam-i te'kid, (3) kenud'un kendi fu'ul mubalaga kalibi. Yapi: inne + ism (el-insane, mansub) + carr ve mecrur (li-rabbihi, takdim edilmis) + haber (le-kenudun, merfu). li-rabbihi'nin haberden once gelmesi onemlidir — ILISKIYI (Rabbine) HUKUM'den (nankor) once koyar, nankorlugun soyut degil ozellikle iliskisel oldugunu on plana cikarir. Ayet Adiyat suresinin tez cumlesini olusturur: yemin dizisinden (100:1-5) sonra bu muksemun aleyh'tir (uzerine yemin edilen sey). Uclu vurgu, bu zor gercegi tesis etmek icin belagat gucune ihtiyac duyuldugunu isaret eder."}, "words": [{"id": 1, "arabic": "إِنَّ", "translit": "inna", "gloss": "indeed, surely, verily", "glossTr": "gerçekten, şüphesiz, muhakkak", "userNotes": "", "root": "—", "grammar": "Emphatic particle (ḥarf al-tawkīd wa-l-naṣb). Opens a nominal sentence (jumla ismiyya) with emphasis. Governs its subject (ism) in the accusative case (naṣb). One of the six sisters of inna (inna wa-akhawātuhā): إِنَّ، أَنَّ، كَأَنَّ، لَٰكِنَّ، لَيْتَ، لَعَلَّ.", "grammarTr": "Vurgu edati (harf-i te'kid ve nasb). Isim cumlesini vurguyla acar. Ismini mansub hale ceker. Inne ve kardeslerinden (inne ve ehavatiha) biridir: inne, enne, keenne, lakinna, leyte, le'alle.", "semantics": ["Emphatic particle: confirms and stresses the truth of the following statement. Classical grammarians note it \"removes doubt from the listener's mind.\" Used when the content may be unexpected, contested, or requires rhetorical weight.", "Discourse function: signals that what follows is a significant declaration — functions as a truth-marker or assertion-intensifier in Quranic rhetoric"], "semanticsTr": ["Vurgu edati: ardından gelen ifadenin doğruluğunu teyit ve tekid eder. Klasik dilbilginleri \"dinleyicinin zihninden şüpheyi kaldırır\" der. İçerik beklenmedik, tartışmalı veya belağat ağırlığı gerektirdiğinde kullanılır.", "Söylem işlevi: ardından gelenin önemli bir beyan olduğunu işaret eder — Kur'an belağatında hakikat işaretleyicisi veya iddia güçlendiricisi işlevi görür"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "", "criticalTr": "", "temporal": "7C"}, {"id": 2, "arabic": "ٱلْإِنسَٰنَ", "translit": "al-insāna", "gloss": "the human being, humankind, the person", "glossTr": "insan, insanlık, beşer", "userNotes": "", "root": "أ ن س ('-n-s)", "grammar": "Definite noun in the accusative (manṣūb) as ism of inna (the subject of the emphatic clause). The definite article al- is for al-jins (generic reference) — referring to the human species as a whole, not a specific individual. The alif-lām-nūn-sīn-alif-nūn form (insān) is the standard Quranic noun for \"the human being.\"", "grammarTr": "Marife isim, mansub halde inne'nin ismi (vurgulu cumlenin oznesi). Belirlilik takisi (el-) cins icindir (tumel gonderim) — belirli bir birey degil, tur olarak insana isaret eder. İnsan formu, \"beser\" icin standart Kur'an ismidir.", "semantics": ["أ ن س ('-n-s, I): to be sociable, to be friendly, to be companionable; to be intimate with; to perceive, to detect (with the senses)", "Lane's Lexicon: insān from '-n-s = the being characterized by sociability (uns), perception, and forgetfulness. Some derive from n-s-y (forgetfulness) — \"the forgetting creature.\" Others from '-n-s (perceiving/sociability). The dual etymology itself carries tension: human as both \"the sociable perceiver\" and \"the forgetful one\"", "Lane's: 'anisa bihi = he was cheered by him, delighted in his company. al-ins = humankind (collective), as opposed to al-jinn (the unseen). insiyy = a human being (individual). uns = intimacy, sociability, friendliness", "Hans Wehr: insān = man, human being; ins = humankind, mankind; 'anisa = to be friendly, sociable; to be familiar, accustomed; ta'annus = humanization; insāniyya = humanity, humaneness", "Lisan al-Arab: al-insān derives from al-uns (intimacy/sociability) or from al-nisyān (forgetfulness). Some say from al-'iyān (perception/sight) since the root '-n-s includes \"to perceive.\" al-insān can also mean \"the pupil of the eye\" (insān al-'ayn) — that which perceives and in which one sees one's own reflection", "Classical non-Quranic: 'anasa = he perceived with the eye, he caught sight of (something from a distance). ānasa = he perceived, noticed. This sensory meaning connects to the \"pupil\" sense: the human is the perceiving entity", "Futuristic: insān as \"the perceiving interface\" — the conscious node in any information network, whether biological neural networks or artificial systems. The root's dual sense of \"sociability + perception\" maps onto modern concepts of social intelligence and sentient systems", "Core concept: the root '-n-s holds a triple identity — the sociable being (uns/intimacy), the perceiving being ('anasa/to perceive), and the forgetting being (nisyān) — creating an entity defined by its capacity for connection, awareness, and forgetfulness simultaneously"], "semanticsTr": ["أ ن س ('-n-s, I. bab): sosyal olmak, cana yakın olmak, yakınlık duymak; algılamak, hissetmek (duyularla)", "Lane's Lexikon: insan '-n-s kokuunden = sosyallik (uns), algilama ve unutkanlikla tanimlanan varlik. Bazilari n-s-y'den (unutkanlik) tureterek \"unutan yaratik\" der. Diğerleri '-n-s'den (algilama/sosyallik). Cift etimolojinin kendisi gerilim tasir: insan hem \"sosyal algilayici\" hem \"unutan varlik\"", "Lane: enise bihi = onun yakinligindan memnun oldu. el-ins = insanlik (topluluk), el-cinn'in (gorunmez) karsiligi. insiyy = bir insan (birey). uns = yakinlik, sosyallik, cana yakinlik", "Hans Wehr: insan = adam, beser; ins = insanlik; enise = cana yakin olmak, alisik olmak; teennus = insanilesme; insaniyye = insanlik, insancillik", "Lisanu'l-Arab: el-insan el-uns'ten (yakinlik/sosyallik) veya el-nisyan'dan (unutkanlik) turetilir. Bazilari el-iyan'dan (algi/gorus) der, zira '-n-s koku \"algilamak\" anlamini icerir. el-insan ayrica \"goz bebegi\" (insanu'l-ayn) anlamina gelebilir — algilayan ve icinde kisinin kendi yansımasını gördugu sey", "Geleceksel: insan \"algilayan arayuz\" olarak — biyolojik sinir aglarindan yapay sistemlere her bilgi agindaki bilincli dugum noktasi. Kokuun \"sosyallik + algilama\" ikili anlami modern sosyal zeka ve duyarli sistem kavramlarina eslenir", "Kok kavram: '-n-s koku uclu bir kimlik tasir — sosyal varlik (uns/yakinlik), algilayan varlik ('enese/algilamak) ve unutan varlik (nisyan) — baglanti, farkindalik ve unutkanlik kapasitesiyle ayni anda tanimlanan bir varlik olusturur"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Subject of emphatic clause (inna l-insāna...) — human being characterized", "count": "~25 ayahs", "examples": [{"ref": "17:100", "arabic": "وَكَانَ ٱلْإِنسَٰنُ قَتُورًۭا", "english": "...and the human being is (ever) tight-fisted", "turkish": "...ve insan cimri olmustur"}, {"ref": "70:19", "arabic": "إِنَّ ٱلْإِنسَٰنَ خُلِقَ هَلُوعًا", "english": "Indeed the human being was created anxious/impatient", "turkish": "Gercekten insan aceleci/sabirsiz yaratilmistir"}, {"ref": "96:6", "arabic": "كَلَّآ إِنَّ ٱلْإِنسَٰنَ لَيَطْغَىٰٓ", "english": "No indeed! The human being surely transgresses", "turkish": "Hayir! Gercekten insan azginlik eder"}]}, {"label": "B. Agent/subject in verbal sentences — human acting", "count": "~64 ayahs", "examples": [{"ref": "2:13", "arabic": "وَإِذَا قِيلَ لَهُمْ ءَامِنُوا۟ كَمَآ ءَامَنَ ٱلنَّاسُ قَالُوٓا۟ أَنُؤْمِنُ كَمَآ ءَامَنَ ٱلسُّفَهَآءُ", "english": "And when it is said to them: believe as the people have believed, they say: shall we believe as the fools have believed?", "turkish": "Onlara \"insanların inandığı gibi iman edin\" denildiğinde \"biz de o beyinsizlerin inandığı gibi mi iman edelim?\" derler"}, {"ref": "3:173", "arabic": "ٱلَّذِينَ قَالَ لَهُمُ ٱلنَّاسُ إِنَّ ٱلنَّاسَ قَدْ جَمَعُوا۟ لَكُمْ فَٱخْشَوْهُمْ", "english": "Those to whom the people said: the people have gathered against you, so fear them", "turkish": "Kendilerine insanlar \"insanlar size karsi toplandi, onlardan korkun\" dedi"}]}, {"label": "C. Prepositional object (of/from/to humankind)", "count": "~108 ayahs", "examples": [{"ref": "2:199", "arabic": "ثُمَّ أَفِيضُوا۟ مِنْ حَيْثُ أَفَاضَ ٱلنَّاسُ", "english": "Then surge forth from where the people have surged", "turkish": "Sonra insanlarin akip gittigi yerden akin edin"}]}, {"label": "D. Genitive construct (insān as first term in iḍāfa or possessed)", "count": "~55 ayahs", "examples": [{"ref": "75:14", "arabic": "بَلِ ٱلْإِنسَٰنُ عَلَىٰ نَفْسِهِۦ بَصِيرَةٌۭ", "english": "Rather, the human being has insight over his own self", "turkish": "Bilakis insan kendi nefsinin basiretidir"}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "58", "refs": "100:6;17:60;17:100;18:55;19:10;19:21;2:21;2:124;2:200;3:9", "note": "Human being ('-n-s) paired with nurturing/lordship (r-b-b) in 58 ayahs — the insān-rabb relationship is a core Quranic axis. In this ayah, the human is characterized as kanūd (ungrateful) specifically TOWARD the rabb, making this a diagnosis of relational failure ← IN THIS AYAH", "noteTr": "Insan ('-n-s) terbiye/rububiyet (r-b-b) ile 58 ayette eslesir — insan-rabb iliskisi Kur'an'in temel eksenlerindendir. Bu ayette insan ozellikle RABBİNE karsi kenud (nankor) olarak nitelenir, iliskisel basarisizligin teshisi yapilir ← BU AYETTE"}], "critical": "The definite article on al-insān is for generic reference (al-jins), making this a universal claim about the human species — not a specific person or group, but humanity as such. The accusative case (manṣūb) follows from inna governance. The '-n-s root's dual etymology (sociability/forgetfulness) creates an internal tension relevant here: the being DEFINED by sociability and intimacy (uns) is declared to be one who CUTS OFF (kanūd) from the very relationship that defines it. The \"pupil of the eye\" (insān al-'ayn) meaning adds another layer: the human is designed to perceive and reflect, yet fails to perceive the source of its sustenance. The pattern of inna l-insāna + intensive adjective appears in multiple surahs (17:100 qatūran, 70:19 halū'an, 96:6 layaṭghā) creating a Quranic motif of divine commentary on the human condition — each instance diagnosing a different constitutional failing.", "criticalTr": "el-insan'daki belirlilik takisi cins icindir (el-cins), bu iddiayı insan turune yonelik evrensel kilar — belirli bir kisi veya grup degil, insanlik olarak insanlik. Mansub hal inne'nin amil olmasindan gelir. '-n-s kokuunun cift etimolojisi (sosyallik/unutkanlik) burada ilgili bir ic gerilim yaratir: sosyallik ve yakinlikla (uns) TANIMLANAN varlik, kendisini tanimlayan iliskiDEN KOPARAN (kenud) biri olarak ilan edilir. \"Goz bebegi\" (insanu'l-ayn) anlami baska bir katman ekler: insan algilamak ve yansitmak icin tasarlanmistir, ama rizik kaynagini algilayamaz. inne'l-insane + mubalaga sifati kalıbı birden fazla surede gorunur (17:100 katuren, 70:19 helu'an, 96:6 leyetga) ve insan durumuna ilahi yorum seklinde Kur'anî bir motif olusturur — her biri farkli bir yapisal kusuru teshis eder.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "لِرَبِّهِۦ", "translit": "li-rabbihi", "gloss": "to his nurturer, to his lord, to his sustainer", "glossTr": "Rabbine, yetiştiricisine, sahibine", "userNotes": "", "root": "ر ب ب (r-b-b)", "grammar": "Preposition لِ (li, to/for) + noun رَبّ (rabb, nurturer/lord) in genitive as object of preposition + possessive pronoun ـهِ (hi, his) referring back to al-insān. The prepositional phrase functions as a fronted qualifier (muqaddam) before the predicate la-kanūdun. The لِ here indicates direction/recipient of the attitude — \"toward his rabb.\"", "grammarTr": "Harf-i cer لِ (li, -e/-a) + isim رَبّ (rabb, terbiye edici/sahip) mecrur halde harf-i cer'in nesnesi + muttasil zamir ـهِ (hi, onun) el-insan'a donen. Carr ve mecrur, haber le-kenud'un onunde takdim edilmis niteleyici (mukaddem) olarak gorev yapar. لِ burada tutumun yonunu/alicisini gosterir — \"Rabbine karsi.\"", "semantics": ["رَبَّ (rabba, I): to possess, to own, to be master of; to nurture, to rear, to bring up from a state of incompleteness to completion; to sustain, to maintain; to repair, to mend", "رَبَّى (rabbā, II): to nurture, to educate, to raise (a child); to cultivate (a plant); to develop incrementally", "Lane's Lexicon: ar-rabb = the owner/possessor; one who nurtures a thing from state to state until it reaches its complete condition. Applied to God: the one who brings creation from non-existence through stages to maturity. Also: the master (as opposed to the slave). ar-rabb with the definite article is used only for God. Without the article: master, owner, guardian, head of household", "Lane's: rabba = he collected/brought together; rabbahu = he managed/conducted it; tarbiya = rearing, education, cultivation. rabb al-dār = head of the household. rabbānī = one deeply learned in divine knowledge", "Hans Wehr: rabb = lord, master; God; owner, possessor; host. rabba = to raise, rear, bring up, educate. tarbiya = education, upbringing, breeding, cultivation", "Lisan al-Arab: ar-rabb = al-mālik (owner), al-sayyid (master), al-mudabbir (manager), al-murabbi (cultivator), al-qā'im (the one who stands over/manages). Distinguished from other divine names: rabb emphasizes the ONGOING RELATIONSHIP of cultivation, not a static attribute. The rabb continuously acts upon the marbūb (the nurtured one)", "Classical non-Quranic: rubba = many/how many (quantifier particle — distinct homophone). rabb al-ṣanī'a = patron, benefactor. rabab = a musical instrument (distinct root connection). rabbā fī ḥijrihi = he raised (the child) in his care/bosom", "Modern: rabb as \"programmer/developer\" — one who designs growth algorithms, incremental development systems. tarbiya as educational technology, developmental programming", "The لِ preposition with rabb: indicates the direction of the kanūd attitude — ingratitude is not abstract but targeted AT the very source of nurture. Classical functions of li here: (1) li al-ḍarar (to the detriment of) — \"against his lord\"; (2) li al-ta'diya (transitivity marker) — kanūd directed toward; (3) li al-ikhtisāṣ (specifically to his lord, as opposed to others)", "Core concept: the root r-b-b denotes an entity that continuously, incrementally cultivates another from potential to actuality — an ongoing relational act, not a one-time creation"], "semanticsTr": ["رَبَّ (rabbe, I. bab): sahip olmak, malik olmak; yetistirmek, buyutmek, eksiklikten tamlığa ulastirmak; gecindirmek, bakim yapmak; onarmak, duzeltmek", "رَبَّى (rabba, II. bab): yetistirmek, egitmek, buyutmek (cocuk); ekip yetistirmek (bitki); kademeli olarak gelistirmek", "Lane's Lexikon: er-rabb = sahip/malik; bir seyi hal'den hal'e yetistirerek tamliga ulastiran. Allah icin: yaratilisi yokluktan asama asama olgunluga getiren. Ayrica: efendi (kulun karsiligi). Belirlilik takisiyla er-rabb yalnizca Allah icin kullanilir. Takisiz rabb: efendi, sahip, veli, hane reisi", "Hans Wehr: rabb = efendi, sahip; Allah; malik. rabbe = buyutmek, yetistirmek, egitmek. terbiye = egitim, yetistirme, islah", "Lisanu'l-Arab: er-rabb = el-malik (sahip), es-seyyid (efendi), el-mudebir (yonetici), el-murabbi (yetistirici), el-kaim (ustunde duran/yoneten). Diger ilahi isimlerden farki: rabb statik bir sifat degil SUREGELEN YETISTIRME ILISKISI'ni vurgular. Rabb surekli merbub (yetistirilen) uzerinde eylem yapar", "Modern: rabb \"programci/gelistirici\" olarak — buyume algoritmalari, kademeli gelistirme sistemleri tasarlayan. Terbiye egitim teknolojisi, gelisimsel programlama olarak", "لِ harfi rabb ile: kenud tutumunun yonunu gosterir — nankorluk soyut degil, yetistirme kaynagina YONELIK. Burada li'nin klasik islevleri: (1) li'l-darar (aleyhine) — \"Rabbine karsi\"; (2) li't-te'diye (gecislilik isaretleyicisi) — kenud yonlendirilmis; (3) li'l-ihtisas (ozellikle Rabbine, baskalarina degil)", "Kok kavram: r-b-b koku bir varligi surekli, kademeli olarak potansiyelden gerceklige yetistiren bir varliga isaret eder — tek seferlik yaratilis degil, suregelen iliskisel bir eylem"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Vocative address (yā rabbi, rabbanā) — calling upon the nurturer", "count": "~136 ayahs", "examples": [{"ref": "1:2", "arabic": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ", "english": "The praise belongs to God, the nurturer of all realms of being", "turkish": "Hamd, alemlerin Rabbi olan Allah'a aittir"}, {"ref": "7:89", "arabic": "قَدِ ٱفْتَرَيْنَا عَلَى ٱللَّهِ كَذِبًا إِنْ عُدْنَا فِى مِلَّتِكُم بَعْدَ إِذْ نَجَّىٰنَا ٱللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَىْءٍ عِلْمًا", "english": "...We would have fabricated a lie against God if we returned to your religion after God saved us from it. It is not for us to return except that God, our nurturer, wills. Our nurturer encompasses all things in knowledge...", "turkish": "...Bizi ondan Allah kurtardiktan sonra sizin dininize donersek Allah'a karsi yalan uydurmus oluruz. Rabbimiz Allah dilemedikce donmemiz mumkun degildir. Rabbimiz her seyi ilmiyle kuşatmıştır..."}]}, {"label": "B. Genitive construct (rabb + possessed noun: rabbuhum, rabbuka, etc.)", "count": "~215 ayahs", "examples": [{"ref": "2:283", "arabic": "فَلْيُؤَدِّ ٱلَّذِى ٱؤْتُمِنَ أَمَٰنَتَهُۥ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ", "english": "...let the one who is entrusted fulfill his trust and let him be conscious of God, his nurturer", "turkish": "...guvenilen emanetini odesin ve Rabbi olan Allah'a karsi takva sahibi olsun"}]}, {"label": "C. Prepositional object (li-rabbihi, bi-rabbihi, 'an rabbihi)", "count": "~229 ayahs", "examples": [{"ref": "6:15", "arabic": "قُلْ إِنِّىٓ أَخَافُ إِنْ عَصَيْتُ رَبِّى عَذَابَ يَوْمٍ عَظِيمٍۢ", "english": "Say: I fear, if I disobey my nurturer, the punishment of a tremendous day", "turkish": "De ki: Rabbime isyan edersem buyuk bir gunun azabindan korkarim"}, {"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى", "english": "He said: This is a mercy from my nurturer", "turkish": "Dedi: Bu Rabbimden bir rahmettir"}]}]}, "qiraat": [{"arabic": "لِرَبِّهْ", "translit": "li-rabbih", "status": "Irreg", "type": "skn", "note": "Irregular variant: sukūn (quiescence) on the final hā', dropping the kasra vowel. This is a phonological variant in pause (waqf) or dialectal pronunciation. The possessive pronoun ـهِ loses its vowel, becoming ـهْ. No semantic change, but creates a harder, more abrupt ending — the possessive relationship is phonetically truncated.", "noteTr": "Duzensiz varyant: son ha'da sukun (harekesizlik), kesre'nin dusurulmesi. Bu vakif (durma) veya lehcesel telaffuzda fonolojik bir varyanttir. Muttasil zamir ـهِ unlusunu kaybederek ـهْ olur. Anlam degisikligi yok, ancak daha sert, daha ani bir bitis olusturur — aitlik iliskisi fonetik olarak kisaltilir.", "source": "erquran.org"}, {"arabic": "لِرَبِّهٗ", "translit": "li-rabbihⁱ", "status": "Irreg", "type": "skn", "note": "Irregular variant: ishbā' (vowel prolongation) or ṣila on the hā' — extending the kasra into a full yā' sound. The possessive pronoun ـهِ is prolonged as ـهِي. This lengthening gives the possessive relationship auditory prominence — the \"his\" (belonging to the human) is stretched, emphasizing the intimacy and specificity of the rabb-insān bond.", "noteTr": "Duzensiz varyant: ha'da isbā' (unlu uzatmasi) veya sila — kesre'nin tam bir ya sesine uzatilmasi. Muttasil zamir ـهِ ـهِي olarak uzatilir. Bu uzatma aitlik iliskisine isitsel one cikarma verir — \"onun\" (insana ait) uzatilir, rabb-insan baginin yakinligini ve ozgunlugunu vurgular.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-n-s", "coRootAr": "أ ن س", "count": "58", "refs": "100:6;17:60;17:100;18:55;19:10;19:21;2:21;2:124;2:200;3:9", "note": "Nurturing/lordship (r-b-b) paired with human being ('-n-s) — the fundamental Quranic relational pair. The rabb-insān axis is diagnosed here: the nurturer provides, the human denies ← IN THIS AYAH", "noteTr": "Terbiye/rububiyet (r-b-b) insan ('-n-s) ile eslesir — temel Kur'anî iliskisel cift. Rabb-insan ekseni burada teshis edilir: terbiye edici saglar, insan inkar eder ← BU AYETTE"}], "critical": "The fronting of li-rabbihi before the predicate la-kanūdun is a deliberate syntactic choice (taqdīm). In Arabic, fronting typically signals emphasis or exclusivity. Here it foregrounds the RELATIONSHIP — the human's ingratitude is not generic but specifically directed at the rabb. The choice of rabb (not Allāh, not ilāh) is significant: rabb denotes the nurturing, cultivating relationship — the one who incrementally brings the human from potential to actuality. To be kanūd to one's rabb is to deny the very process that made you what you are. The possessive pronoun -hi (his) creates a reciprocal bond: the rabb is HIS rabb — personal, specific, intimate — and yet the human is ungrateful TO that very personal nurturer. The two irregular qira'at variants both affect the pronoun vowel: one truncates it (harsher ending), one extends it (emphasizing the possessive bond), creating a phonetic spectrum from abruptness to intimacy around the same relational claim.", "criticalTr": "li-rabbihi'nin haber le-kenud'un onunde takdim edilmesi bilinçli bir sozdizimsel tercihdir (takdim). Arapcada takdim genellikle vurgu veya munhasirligi isaret eder. Burada ILISKIYI on plana cikarir — insanin nankorlugu genel degil, ozellikle rabbe yoneliktir. Rabb secimi (Allah veya ilah degil) onemlidir: rabb yetistirici, besleyici iliskiyi gosterir — insani potansiyelden gerceklige kademeli olarak getiren. Rabbine karsi kenud olmak, seni sen yapan sureci inkar etmektir. Muttasil zamir -hi (onun) karsilikli bir bag kurar: rabb ONUN Rabbidir — kisisel, ozel, yakin — ve yine de insan o kisisel yetistiriciye nankor davranir. Iki duzensiz kiraat varyanti zamirin unlusunu etkiler: biri kisaltir (daha sert bitis), biri uzatir (aitlik bagini vurgular), ayni iliskisel iddia etrafinda aniliktan yakinliga fonetik bir yelpaze olusturur.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 4, "arabic": "لَكَنُودٌ", "translit": "la-kanūdun", "gloss": "surely ungrateful, resistant, cutting-off, barren", "glossTr": "kesinlikle nankor, direncli, bag koparan, corak", "userNotes": "", "root": "ك ن د (k-n-d)", "grammar": "Predicate (khabar) of inna in the nominative (marfū'). Prefixed with لَ (lām al-tawkīd / lām of emphasis), which doubles the emphatic force already established by inna. The fa'ūl pattern (kanūd) is an intensive/persistent adjective form indicating a deep-seated, habitual quality — not occasional ingratitude but a defining characteristic.", "grammarTr": "inne'nin haberi merfu halde. Basinda لَ (lam-i te'kid / vurgu lami), inne'nin zaten kurdugu vurgu gucunu ikiye katlar. Fu'ul kalibi (kenud) mubalaga/sureklilik sifatidir, derin koklesmis, aliskanlik haline gelmis bir niteligi gosterir — ara sira degil, tanimlayici bir ozellik olarak nankorluk.", "semantics": ["كَنَدَ (kanada, I): to cut, to sever; to be ungrateful; to deny benefits received; to cut off relationship with a benefactor", "Lane's Lexicon: kanūd = very ungrateful, one who denies/ignores benefits. Also: kanūd = a land that produces nothing (barren soil) — \"arḍun kanūd\" = land that does not grow anything despite being watered. kanada l-ḥabla = he cut the rope. kanada n-ni'ma = he denied/rejected the blessing. The root carries both \"cutting\" and \"barrenness\" — the ungrateful person severs ties AND fails to produce return", "Lane's: al-kanūd from kanada = to cut off. kunūd = ingratitude as a form of severance. Some classical authorities derive it from Kinda (the tribal name), suggesting a cultural association. Also: kanūd = one who eats alone and withholds from others (Lane cites this as a characterization of extreme selfishness)", "Lisan al-Arab: al-kanūd = al-kashshāf li-kufri n-ni'am (the one who exposes/uncovers the ingratitude for blessings). Also: kanūd = al-'āṣī (the disobedient one). al-kanūd = the one who counts afflictions and forgets blessings. Also attested: kanūd = a woman who is ungrateful to her husband (gendered usage in classical lexicons). al-arḍ al-kanūd = barren land that gives no vegetation", "Hans Wehr: kanūd = ungrateful, thankless. The root k-n-d has limited productive derivation in modern Arabic, but the adjectival form kanūd persists as a literary/religious term", "Classical non-Quranic: kand = white sugar (a different but homophonous root, possibly k-n-d II = to sweeten/crystallize — though this is disputed). The Kinda tribal etymology: some lexicographers connect kanūd to the tribe of Kinda, known for a reputation of disloyalty in pre-Islamic Arabia", "The fa'ūl pattern (kanūd, ṣabūr, shakūr, kafūr): this morphological pattern indicates INTENSITY and PERSISTENCE. Compare: kāfir (one who denies) vs kafūr (persistently, constitutionally ungrateful — 76:3). kanūd follows the same intensification: not someone who occasionally forgets, but one whose very nature is to cut off and deny", "Semantic tension: kanūd simultaneously means \"one who cuts\" (active severance) AND \"barren land\" (passive unproductivity). The human is both the CUTTER of relationships and the SOIL that refuses to yield — both agent and failed medium", "Modern/futuristic: kanūd as \"one who extracts without returning\" — consumer who depletes resources without regenerating them. Also: \"disconnector\" — one who severs feedback loops in sustaining systems (ecological, social, informational)", "Core concept: k-n-d denotes the severing of a productive bond — the ingratitude of cutting off from one's source while consuming what that source provides, like soil that drinks rain but grows nothing"], "semanticsTr": ["كَنَدَ (kenede, I. bab): kesmek, koparmak; nankor olmak; alinan nimetleri inkar etmek; nimet verenle iliskiyi kesmek", "Lane's Lexikon: kenud = cok nankor, nimetleri inkar/gormezden gelen. Ayrica: kenud = hicbir sey uretmeyen toprak (corak arazi) — \"ardun kenud\" = sulanmasina ragmen hicbir sey yetistirmeyen toprak. kenede'l-hable = ipi kesti. kenede'n-ni'me = nimeti inkar/reddetti. Kok hem \"kesme\" hem \"coraklik\" tasir — nankor kisi hem baglari koparir HEM de karsilik uretmede basarisiz olur", "Lane: kenud kunude'den = koparmak. kunud = koparma biciminde nankorluk. Bazi klasik otoriteler Kinde (kabile adi) ile iliskilendirir. Ayrica: kenud = tek basina yiyen ve baskasindan esirgenen (Lane bunu asiri bencillik nitelemesi olarak alintılar)", "Lisanu'l-Arab: el-kenud = el-keşşafu li-kufri'n-ni'am (nimetlere nankorlugu aciga cikaran/gosteren). Ayrica: kenud = el-asi (isyan eden). el-kenud = belaları sayan ve nimetleri unutan. Ayrica: kenud = kocasina nankor olan kadin (klasik sozluklerde cinsiyetli kullanim). el-ardu'l-kenud = bitki vermeyen corak toprak", "Hans Wehr: kenud = nankor, nankorca. k-n-d koku modern Arapcada sinirli uretken turetmeye sahip, ancak kenud sifat formu edebi/dini terim olarak surmuştur", "Fu'ul kalibi (kenud, sabur, sekur, kefur): bu morfolojik kalip YOGUNLUK ve SUREKLILIK gosterir. Karsilastir: kafir (inkar eden) ile kefur (surekli, yapisal olarak nankor — 76:3). Kenud
