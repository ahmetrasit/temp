kabir içeriklerinin dirilişine bağlar. استئناف (istinaf) olarak da okunabilir — iç açığa çıkarma hakkında yeni ama paralel bir ifade sunar.", "semantics": [], "semanticsTr": [], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The وَ here creates a structural pairing between 100:9 (قُبُور qubūr, graves — external/physical) and 100:10 (صُدُور ṣudūr, chests — internal/psychological). This pairing is phonetically reinforced: qubūr and ṣudūr share the same broken plural pattern (fu'ūl), creating a rhyme that binds the two verses sonically. The وَ is the hinge of this parallelism. Reading it as simple coordination (\"and\") captures the additive structure; reading it as sequential (\"then\") implies temporal order — first graves opened, then chests exposed; reading it as explanatory (\"that is\") implies the chest-extraction explains or elaborates the grave-resurrection.", "criticalTr": "Buradaki وَ, 100:9 (قُبُور qubūr, kabirler — dışsal/fiziksel) ile 100:10 (صُدُور ṣudūr, göğüsler — içsel/psikolojik) arasında yapısal bir eşleşme yaratır. Bu eşleşme fonetik olarak pekiştirilir: qubūr ve ṣudūr aynı kırık çoğul kalıbını (fu'ūl) paylaşır ve iki ayeti ses olarak birbirine bağlayan bir kafiye yaratır. وَ bu paralelliğin menteşesidir. Basit eşgüdüm (\"ve\") olarak okumak toplayıcı yapıyı yakalar; sıralı (\"sonra\") olarak okumak zamansal sıra ima eder — önce kabirler açılır, sonra göğüsler; açıklayıcı (\"yani\") olarak okumak göğüs çıkarmasının kabir dirilişini açıkladığını veya detaylandırdığını ima eder."}, {"id": 2, "arabic": "حُصِّلَ", "translit": "ḥuṣṣila", "gloss": "is sifted out, is extracted, is collected, is made to yield", "glossTr": "ayıklanır, çıkarılır, toplanır, hasadı alınır", "userNotes": "", "root": "ح ص ل (h-s-l)", "grammar": "Passive perfect verb (fi'l māḍī majhūl), Form II (fu''ila pattern). The Form II intensification of the root ḥ-ṣ-l adds thoroughness: not merely obtaining but thoroughly extracting, separating completely. Subject (nā'ib al-fā'il) is the following mā fī ṣ-ṣudūri. The agent is deliberately left unspecified by the passive construction.", "grammarTr": "Edilgen geçmiş zaman fiil (fiil-i mâzî mechûl), II. bab (fu''ile kalıbı). II. bab ḥ-ṣ-l kökünün yoğunlaştırmasını sağlar: salt elde etme değil, eksiksiz çıkarma, tamamen ayırma. Özne (nâib-i fâil) sonraki mā fī ṣ-ṣudūr'dur. Fail edilgen yapı tarafından kasıtlı olarak belirsiz bırakılmıştır.", "semantics": ["Root ḥ-ṣ-l (ح ص ل): to separate, to sift out, to extract the essential from the non-essential", "فَعَلَ (ḥaṣala, I): to result, to come about, to be produced; to be obtained; to remain after sifting/winnowing (Lane's: \"it remained after the perishing of what was around it\" — what is left when the husk is removed)", "فَعَّلَ (ḥaṣṣala, II): to collect, to gather, to acquire; to obtain knowledge; to separate grain from chaff; to extract the useful from the useless (Lane's: taḥṣīl = the act of obtaining, collecting, separating)", "تَفَعَّلَ (taḥaṣṣala, V): to be collected, to be gathered; to be obtained", "Noun ḥāṣil: result, outcome, product, yield, harvest; what remains after processing", "Noun ḥaṣīla: the act of collecting dates from a palm tree (Lane's); the essential/core that remains", "Noun maḥṣūl: product, crop, yield, harvest; result, outcome", "Noun taḥṣīl: collection, acquisition; academic study/education (obtaining knowledge); tax collection", "Lane's Lexicon: ḥ-ṣ-l fundamentally means \"to separate a thing from another, to distinguish the good from the bad\" — the chaff from the grain, the ore from the rock, the essential from the incidental. It implies a process of refinement and revelation of true nature.", "Lisan al-Arab: taḥṣīl al-kalām = getting to the gist/essence of speech; ḥaṣala = it remained, it was the residue; the word implies what survives destruction or processing", "Hans Wehr: ḥaṣṣala = to collect, to cash in, to harvest; taḥṣīl = collection (of taxes, debts), acquisition (of knowledge), education", "Modern extension: data harvesting, information extraction, content aggregation — extracting structured information from unstructured sources", "Futuristic: algorithmic extraction — machine processes that sift through vast internal data (biometric, neural, cognitive) to isolate and present core patterns", "Core concept: the act of separating the essential from the incidental — revealing what truly remains when all coverings are stripped away"], "semanticsTr": ["Kök ḥ-ṣ-l (ح ص ل): ayırmak, ayıklamak, özü önemsizden çıkarmak", "فَعَلَ (ḥaṣale, I. bab): sonuçlanmak, meydana gelmek, üretilmek; elde edilmek; eleme/savurma sonrası kalmak (Lane's: \"etrafındaki yok olduktan sonra kalan\" — kabuk kaldırıldığında geriye kalan)", "فَعَّلَ (ḥaṣṣale, II. bab): toplamak, biriktirmek, edinmek; bilgi edinmek; taneden samanı ayırmak; yararlıyı yararsızdan çıkarmak (Lane's: taḥṣīl = elde etme, toplama, ayırma eylemi)", "تَفَعَّلَ (teḥaṣṣale, V. bab): toplanmak, biriktirilmek; elde edilmek", "İsim ḥāṣil: sonuç, netice, ürün, verim, hasat; işlemden sonra kalan", "İsim ḥaṣīle: hurma ağacından hurma toplama eylemi (Lane's); kalan öz/çekirdek", "İsim maḥṣūl: ürün, mahsul, verim, hasat; sonuç, netice", "İsim taḥṣīl: toplama, edinme; akademik öğrenim/eğitim (bilgi edinme); vergi toplama", "Lane's Lexicon: ḥ-ṣ-l temelde \"bir şeyi diğerinden ayırmak, iyiyi kötüden ayırt etmek\" anlamına gelir — samandan taneyi, kayadan cevheri, tâli olandan özü. Arıtma ve gerçek doğanın açığa çıkarılması sürecini ima eder.", "Lisânü'l-Arab: taḥṣīlü'l-kelâm = sözün özüne/esasına ulaşmak; ḥaṣale = kaldı, artık idi; kelime yıkım veya işleme sonrası hayatta kalanı ima eder", "Hans Wehr: ḥaṣṣale = toplamak, tahsil etmek, hasat etmek; taḥṣīl = tahsilat (vergi, borç), tahsil (bilgi), eğitim", "Modern genişleme: veri hasadı, bilgi çıkarma, içerik toplama — yapılandırılmamış kaynaklardan yapılandırılmış bilgi çıkarma", "Geleceksel: algoritmik çıkarma — geniş iç verileri (biyometrik, nöral, bilişsel) eleyerek temel örüntüleri izole eden ve sunan makine süreçleri", "Kök kavram: özü tâli olandan ayırma eylemi — tüm örtüler soyulduğunda gerçekten kalanı ortaya çıkarma"], "occurrences": {"type": "all", "items": [{"ref": "100:10", "arabic": "— this verse —", "english": "The ONLY occurrence of ḥ-ṣ-l in the entire Quran. This hapax legomenon status makes it extraordinary: God chose a word used nowhere else in the Quran to describe the eschatological exposure of inner states. The singularity of the word mirrors the singularity of the event.", "turkish": "ḥ-ṣ-l kökünün tüm Kur'an'daki TEK geçişi. Bu hapax legomenon statüsü onu olağanüstü kılar: Tanrı, iç durumların eskatolojik açığa çıkarılmasını tanımlamak için Kur'an'da başka hiçbir yerde kullanılmayan bir kelime seçmiştir. Kelimenin tekilliği olayın tekilliğini yansıtır."}]}, "qiraat": [{"arabic": "وَحَصَلَ", "translit": "wa-ḥaṣala", "status": "Irreg", "type": "Vr", "note": "Active Form I (fa'ala) — shifts from passive \"is extracted\" to active \"it resulted/remained.\" The subject (mā fī ṣ-ṣudūri) becomes the active agent: \"what is in the chests came forth / yielded itself.\" This removes the implication of an external extracting force and suggests the contents emerge autonomously. Not in standard Hafs reading.", "noteTr": "Etken I. bab (fe'ale) — edilgen \"çıkarılır\"dan etken \"sonuçlandı/kaldı\"ya geçiş. Özne (mā fī ṣ-ṣudūr) etken fail olur: \"göğüslerdeki ortaya çıktı / kendini verdi.\" Bu dışsal bir çıkarma gücü imasını kaldırır ve içeriklerin özerk olarak ortaya çıktığını ima eder. Standart Hafs kıraatinde yoktur.", "source": "erquran.org"}, {"arabic": "وَحَصَّلَ", "translit": "wa-ḥaṣṣala", "status": "Irreg", "type": "Pss", "note": "Active Form II (fa''ala) — shifts from passive to active with intensification. An unspecified agent \"thoroughly collected/extracted what is in the chests.\" This restores an active agent (God or an angel) who performs the extraction deliberately and completely. Not in standard Hafs reading.", "noteTr": "Etken II. bab (fa''ale) — edilgenden etkene yoğunlaştırma ile geçiş. Belirsiz bir fail \"göğüslerdekini eksiksiz biçimde topladı/çıkardı.\" Bu, çıkarmayı kasıtlı ve eksiksiz biçimde gerçekleştiren etken bir faili (Tanrı veya melek) geri getirir. Standart Hafs kıraatinde yoktur.", "source": "erquran.org"}, {"arabic": "وَحَصِلَ", "translit": "wa-ḥaṣila", "status": "Irreg", "type": "vw", "note": "Active Form I with kasra on medial ṣād (fa'ila pattern) — an adjectival/stative verb: \"it became extracted/sifted.\" The fa'ila pattern often denotes entering a state: the contents of chests entered the state of being extracted. This is the most intransitive reading — the contents simply \"become exposed\" without any agent or process implied. Not in standard Hafs reading.", "noteTr": "Orta ṣād'da kesre ile etken I. bab (fe'ile kalıbı) — sıfat-fiil/durum fiili: \"çıkarılmış/elenmiş hale geldi.\" Fe'ile kalıbı genellikle bir duruma girmeyi ifade eder: göğüslerin içeriği çıkarılmış olma durumuna girdi. En geçişsiz okumadır — içerikler herhangi bir fail veya süreç ima edilmeden salt \"açığa çıkmış hale gelir.\" Standart Hafs kıraatinde yoktur.", "source": "erquran.org"}], "cooccurrence": [], "critical": "This is a HAPAX LEGOMENON — ḥ-ṣ-l occurs only here in the entire Quran (100:10). This singularity demands attention: the Quran's vocabulary of ~1,700 roots is deployed with precision, and a root used only once carries exceptional weight. The three irregular qiraat variants collectively map out a semantic spectrum: (1) wa-ḥaṣala (I active) — the contents themselves emerge; (2) wa-ḥaṣṣala (II active) — an agent forcibly extracts them; (3) wa-ḥaṣila (I stative) — the contents enter the state of being exposed; (4) wa-ḥuṣṣila (II passive, standard Hafs) — they are extracted by an unspecified force. The progression from stative to active to passive reveals layers of agency: self-emergence → divine extraction → state-change. The Form II passive (standard reading) occupies the middle ground: something IS done TO the contents, but the doer is unnamed — maximizing both the inevitability and the mystery of the process. The agricultural metaphor embedded in ḥ-ṣ-l (separating grain from chaff) implies that human intentions have a \"husk\" and a \"kernel\" — the Day strips away pretense to reveal essence. Grammar enacts content: the passive voice itself performs the helplessness of those whose interiors are exposed.", "criticalTr": "Bu bir HAPAX LEGOMENON'dur — ḥ-ṣ-l tüm Kur'an'da yalnızca burada (100:10) geçer. Bu tekillik dikkat gerektirir: Kur'an'ın ~1.700 köklük kelime hazinesi hassasiyetle kullanılır ve yalnızca bir kez kullanılan kök istisnai ağırlık taşır. Üç düzensiz kıraat varyantı birlikte anlamsal bir spektrum çizer: (1) wa-ḥaṣala (I. bab etken) — içerikler kendileri ortaya çıkar; (2) wa-ḥaṣṣala (II. bab etken) — bir fail onları zorla çıkarır; (3) wa-ḥaṣila (I. bab durumsal) — içerikler açığa çıkmış olma durumuna girer; (4) wa-ḥuṣṣila (II. bab edilgen, standart Hafs) — belirsiz bir güç tarafından çıkarılırlar. Durumsal → etken → edilgen ilerlemesi faillik katmanlarını ortaya koyar: kendi kendine ortaya çıkma → ilahi çıkarma → durum değişikliği. II. bab edilgen (standart okuma) orta yerde durur: içeriklere bir şey YAPILIR ama yapan adlandırılmaz — sürecin hem kaçınılmazlığını hem gizemini en üst düzeye çıkarır. ḥ-ṣ-l'deki tarımsal mecaz (samandan taneyi ayırma) insan niyetlerinin bir \"kabuğu\" ve bir \"çekirdeği\" olduğunu ima eder — O Gün gösterişi sıyırıp özü ortaya çıkarır. Dilbilgisi içeriği icra eder: edilgen yapının kendisi iç dünyaları açığa çıkarılanların çaresizliğini yaşatır.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "مَا", "translit": "mā", "gloss": "what; that which; whatever", "glossTr": "ne; olan şey; her ne", "userNotes": "", "root": "—", "grammar": "Relative pronoun (ism mawṣūl) introducing a relative clause. Functions as nā'ib al-fā'il (pro-agent/subject of passive verb) of ḥuṣṣila. The mā is general and unspecified — \"whatever is in the chests\" — universalizing the scope of extraction. Not a negation particle here.", "grammarTr": "İsm-i mevsul (bağ zamiri) sıla cümlesini başlatır. ḥuṣṣila'nın nâib-i fâili (edilgen fiilin öznesi) olarak işlev görür. mā genel ve belirsizdir — \"göğüslerde ne varsa\" — çıkarmanın kapsamını genelleştirir. Burada olumsuzluk edatı değildir.", "semantics": [], "semanticsTr": [], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "", "criticalTr": ""}, {"id": 4, "arabic": "فِى", "translit": "fī", "gloss": "in; within; inside", "glossTr": "içinde; -de/-da", "userNotes": "", "root": "—", "grammar": "Preposition (ḥarf jarr) governing ṣ-ṣudūri in the genitive case. Establishes spatial containment: the contents are INSIDE the chests. The preposition fī here denotes interiority — not \"on\" or \"about\" but truly \"within,\" emphasizing that what is extracted was deeply contained, hidden, not on the surface.", "grammarTr": "Edat (harf-i cer) ṣ-ṣudūr'u mecrur halde yönetir. Mekansal içerme kurar: içerikler göğüslerin İÇİNDEDİR. fī edatı burada içselliği belirtir — \"üzerinde\" veya \"hakkında\" değil gerçekten \"içinde\" — çıkarılanın derinde saklı olduğunu, yüzeyde olmadığını vurgular.", "semantics": [], "semanticsTr": [], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The preposition fī here creates a layered spatial metaphor: the ṣudūr (chests) are containers, and fī marks the contents as being WITHIN — enclosed, concealed, inaccessible from outside. The eschatological act of ḥuṣṣila violates this interiority: what was fī (inside) is brought OUT. The preposition thus participates in the ayah's core drama — the inversion of inside and outside, the exposure of what was contained. In the Quran, the phrase mā fī ṣ-ṣudūr appears repeatedly (3:29, 3:119, 3:154, 5:7, 8:43, 11:5, 27:74, 28:69, 29:10, 31:23, 35:38, 39:7, 40:19, 42:24, 57:6, 64:4, 67:13) — always referring to hidden inner states that God knows. Here in 100:10, uniquely, those contents are not merely KNOWN but EXTRACTED.", "criticalTr": "Buradaki fī edatı katmanlı bir mekansal mecaz yaratır: ṣudūr (göğüsler) kaplardır ve fī içerikleri İÇERİDE — kapalı, gizli, dışarıdan erişilemez — olarak işaretler. ḥuṣṣila'nın eskatolojik eylemi bu içselliği ihlal eder: fī (içeride) olan DIŞARI çıkarılır. Edat böylece ayetin temel dramına katılır — iç ile dışın tersine çevrilmesi, kapalı olanın açığa çıkarılması. Kur'an'da mā fī ṣ-ṣudūr ifadesi tekrar tekrar geçer (3:29, 3:119, 3:154, 5:7, 8:43, 11:5, 27:74, 28:69, 29:10, 31:23, 35:38, 39:7, 40:19, 42:24, 57:6, 64:4, 67:13) — her zaman Tanrı'nın bildiği gizli iç durumları ifade eder. 100:10'da benzersiz biçimde bu içerikler salt BİLİNMEZ aynı zamanda ÇIKARILIR."}, {"id": 5, "arabic": "ٱلصُّدُورِ", "translit": "aṣ-ṣudūri", "gloss": "the chests; the breasts; the fronts; the interiors", "glossTr": "göğüsler; sineler; ön yüzler; iç dünyalar", "userNotes": "", "root": "ص د ر (s-d-r)", "grammar": "Noun, masculine plural (jam' taksīr — broken plural of ṣadr), definite with al-, genitive (majrūr) governed by fī. The broken plural pattern fu'ūl indicates concrete plurality. ṣadr literally means \"front, forepart, chest, breast\" — the seat of thought, emotion, intention in Quranic anthropology. The definite article al- here is for generic reference (istighrāq) — ALL chests, not specific ones.", "grammarTr": "İsim, eril kırık çoğul (cem'-i teksîr — ṣadr'ın kırık çoğulu), el- ile marife, fī tarafından yönetilen mecrur halde. fu'ūl kalıbı somut çoğulluğu gösterir. ṣadr kelimesi kelime anlamıyla \"ön, ön kısım, göğüs, sine\" demektir — Kur'an antropolojisinde düşünce, duygu, niyet merkezi. Buradaki el- harf-i tarifi cins belirtir (istiğrak) — belirli değil TÜM göğüsler.", "semantics": ["Root ṣ-d-r (ص د ر): to go forth, to issue from, to emanate; the front/forepart of anything", "فَعَلَ (ṣadara, I): to go out, to come forth, to issue, to emanate; to turn away from water after drinking (Lane's: \"he went away from the water after having drunk\"); to return from", "أَفْعَلَ (aṣdara, IV): to issue, to publish, to send out, to promulgate; to cause to go forth", "Noun ṣadr: chest, breast, bosom; front, forepart; beginning (of a road, a chapter, a period); the seat of the heart, emotions, intentions; the upper part of a valley", "Noun ṣudūr: plural of ṣadr — chests, breasts; metaphorically: the inner selves, the seats of consciousness", "Noun maṣdar: source, origin, infinitive/verbal noun (grammatical term); place of issuing", "Lane's Lexicon: ṣadr is \"the upper or uppermost part of the front of a thing\" — the most prominent, forward-facing surface. Of a person: the chest as seat of the heart and mind. ṣadara 'an = to turn away from, to leave (water). The root conveys emergence and prominence — what is at the FRONT, what COMES FORTH.", "Lisan al-Arab: ṣadr al-amr = the beginning/commencement of a matter; ṣadr al-majlis = the seat of honor (the front/chief position); ṣadīr = mirage (what appears to issue forth but is illusion)", "Hans Wehr: ṣadr = chest, breast, bosom; front, face; beginning; ṣadara = to appear, to be published, to come out; iṣdār = issuance, publication", "Modern extension: ṣadr as processing center — where data is received, processed, and decisions generated; maṣdar as data source, origin server, content publisher", "Futuristic: ṣudūr as cognitive centers — biological or artificial processing units that contain internal states, neural patterns, encrypted intentions accessible only through extraction protocols", "Classical meaning absent from Quran: ṣadīr (mirage) — the illusion of water issuing forth in the desert; related to the root's sense of \"what comes to the front\" vs what is real", "Core concept: the front-facing surface and what issues from within it — emergence, prominence, the seat from which inner states originate and radiate outward"], "semanticsTr": ["Kök ṣ-d-r (ص د ر): çıkmak, sâdır olmak, yayılmak; herhangi bir şeyin ön/ön kısmı", "فَعَلَ (ṣadere, I. bab): dışarı çıkmak, ortaya çıkmak, sâdır olmak, yayılmak; su içtikten sonra sudan dönmek (Lane's: \"içtikten sonra sudan ayrıldı\"); dönmek", "أَفْعَلَ (eṣdere, IV. bab): yayımlamak, neşretmek, göndermek, ilan etmek; çıkmasına sebep olmak", "İsim ṣadr: göğüs, sine, bağır; ön, ön kısım; başlangıç (yol, bölüm, dönem); kalbin, duyguların, niyetlerin merkezi; vadinin üst kısmı", "İsim ṣudūr: ṣadr'ın çoğulu — göğüsler, sineler; mecazen: iç benlikler, bilinç merkezleri", "İsim maṣdar: kaynak, köken, mastar (dilbilgisi terimi); çıkış yeri", "Lane's Lexicon: ṣadr \"bir şeyin ön yüzünün üst veya en üst kısmı\"dır — en belirgin, öne bakan yüzey. Kişi için: kalbin ve zihnin merkezi olarak göğüs. ṣadere ʿan = -den dönmek, bırakmak (su). Kök ortaya çıkma ve belirginliği iletir — ÖNDE olan, ORTAYA ÇIKAN.", "Lisânü'l-Arab: ṣadru'l-emr = bir meselenin başlangıcı; ṣadru'l-meclis = şeref koltuğu (ön/baş mevki); ṣadīr = serap (ortaya çıkıyor gibi görünen ama yanılsama olan)", "Hans Wehr: ṣadr = göğüs, sine, bağır; ön, yüz; başlangıç; ṣadere = ortaya çıkmak, yayımlanmak; iṣdâr = yayımlama, neşir", "Modern genişleme: ṣadr işlem merkezi olarak — verinin alınıp işlendiği ve kararların üretildiği yer; maṣdar veri kaynağı, kaynak sunucu, içerik yayımcısı olarak", "Geleceksel: ṣudūr bilişsel merkezler olarak — iç durumları, nöral örüntüleri, yalnızca çıkarma protokolleriyle erişilebilen şifreli niyetleri barındıran biyolojik veya yapay işlem birimleri", "Kur'an'da bulunmayan klasik anlam: ṣadīr (serap) — çölde sâdır oluyormuş gibi görünen su yanılsaması; kökün \"öne çıkan\" ile gerçek olan arasındaki gerilimle ilişkili", "Kök kavram: öne bakan yüzey ve içinden çıkan — ortaya çıkma, belirginlik, iç durumların kaynaklandığı ve dışarıya yayıldığı merkez"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ṣadr as chest/breast — seat of emotion, thought, inner state", "count": "~22 ayahs", "examples": [{"ref": "16:106", "arabic": "مَن كَفَرَ بِٱللَّهِ مِنۢ بَعْدِ إِيمَٰنِهِۦٓ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُۥ مُطْمَئِنٌّۢ بِٱلْإِيمَٰنِ وَلَٰكِن مَّن شَرَحَ بِٱلْكُفْرِ صَدْرًۭا فَعَلَيْهِمْ غَضَبٌۭ مِّنَ ٱللَّهِ وَلَهُمْ عَذَابٌ عَظِيمٌۭ", "english": "Whoever disbelieves in God after their faith — except one who is compelled while their heart is at rest with faith — but whoever opens their ṣadr (chest/breast) to disbelief, upon them is wrath from God and for them is a great punishment.", "turkish": "Kim imanından sonra Allah'ı inkar ederse — kalbi imanla mutmain olduğu halde zorlanan hariç — ama kim küfre ṣadr'ını (göğsünü/sinesini) açarsa, onlara Allah'ın gazabı vardır ve onlar için büyük bir azap vardır."}, {"ref": "26:13", "arabic": "وَيَضِيقُ صَدْرِى وَلَا يَنطَلِقُ لِسَانِى فَأَرْسِلْ إِلَىٰ هَٰرُونَ", "english": "And my ṣadr (chest/breast) tightens and my tongue does not flow freely, so send for Harun.", "turkish": "Ve ṣadr'ım (göğsüm/sinem) daralır ve dilim dönmez, Harun'a haber gönder."}, {"ref": "40:19", "arabic": "يَعْلَمُ خَآئِنَةَ ٱلْأَعْيُنِ وَمَا تُخْفِى ٱلصُّدُورُ", "english": "He knows the treachery of the eyes and what the ṣudūr (chests/breasts) conceal.", "turkish": "Gözlerin hainliğini ve ṣudūr'un (göğüslerin/sinelerin) gizlediğini bilir."}]}, {"label": "B. ṣadr as abstract/gerund — issuing, emanating, source", "count": "~4 ayahs", "examples": [{"ref": "16:106", "arabic": "مَن كَفَرَ بِٱللَّهِ مِنۢ بَعْدِ إِيمَٰنِهِۦٓ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُۥ مُطْمَئِنٌّۢ بِٱلْإِيمَٰنِ وَلَٰكِن مَّن شَرَحَ بِٱلْكُفْرِ صَدْرًۭا فَعَلَيْهِمْ غَضَبٌۭ مِّنَ ٱللَّهِ وَلَهُمْ عَذَابٌ عَظِيمٌۭ", "english": "Whoever opens their ṣadr (breast) to disbelief — ṣadr here as the issuing-place of belief/disbelief decisions", "turkish": "Kim küfre ṣadr'ını (sinesini) açarsa — ṣadr burada iman/küfür kararlarının çıkış yeri olarak"}]}]}, "qiraat": [], "cooccurrence": [], "critical": "ṣudūr (chests) in 100:10 operates at the intersection of multiple semantic fields: (1) ANATOMICAL — the physical chest cavity; (2) PSYCHOLOGICAL — the seat of hidden thoughts, emotions, unspoken desires (the Quran locates consciousness in the ṣadr, not the brain); (3) COGNITIVE — the processing center where intentions form before becoming actions; (4) ESCHATOLOGICAL — the container whose contents are forcibly extracted on the Day. The Quranic phrase mā fī ṣ-ṣudūr (what is in the chests) appears ~17 times, always marking the gap between inner reality and outer appearance. In 40:19 (وَمَا تُخْفِى ٱلصُّدُورُ — \"what the chests conceal\"), the ṣudūr actively HIDE. In 100:10, uniquely, ḥuṣṣila forces the hiding to end — the ṣudūr are emptied, their contents laid bare. The broken plural fu'ūl rhymes with qubūr (graves) in 100:9, binding physical resurrection (graves opened) with psychological exposure (chests emptied). Note the untranslatable wordplay: ṣ-d-r (chest/issuing-forth) contains within it the concept of EMERGENCE — what is in the ṣadr is, by etymology, what will eventually ISSUE FORTH (ṣadara). The container carries in its very name the promise that its contents will emerge.", "criticalTr": "ṣudūr (göğüsler) 100:10'da birden fazla anlam alanının kesişiminde çalışır: (1) ANATOMİK — fiziksel göğüs boşluğu; (2) PSİKOLOJİK — gizli düşüncelerin, duyguların, söylenmemiş arzuların merkezi (Kur'an bilinci beyinde değil ṣadr'da konumlandırır); (3) BİLİŞSEL — niyetlerin eylem haline gelmeden önce oluştuğu işlem merkezi; (4) ESKATOLOJİK — içeriği O Gün zorla çıkarılan kap. Kur'an'daki mā fī ṣ-ṣudūr (göğüslerdeki) ifadesi ~17 kez geçer ve her zaman iç gerçeklik ile dış görünüş arasındaki uçurumu işaretler. 40:19'da (وَمَا تُخْفِى ٱلصُّدُورُ — \"göğüslerin gizlediği\") ṣudūr aktif olarak GİZLER. 100:10'da benzersiz biçimde ḥuṣṣila gizlemeyi sona erdirir — ṣudūr boşaltılır, içerikleri açığa serilir. fu'ūl kırık çoğulu 100:9'daki qubūr (kabirler) ile kafiye yaparak fiziksel diriliş (kabirler açılır) ile psikolojik açığa çıkarmayı (göğüsler boşaltılır) bağlar. Çevrilemeyen kelime oyununa dikkat: ṣ-d-r (göğüs/sâdır olma) kendi içinde ORTAYA ÇIKMA kavramını barındırır — ṣadr'daki şey etimolojik olarak eninde sonunda SÂDIR OLACAK olandır (ṣadere). Kap kendi adında içeriğinin ortaya çıkacağı vaadini taşır.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran use the hapax legomenon ḥuṣṣila (ḥ-ṣ-l) here instead of the more common ukhrija (kh-r-j, to bring out) or kushifa (k-sh-f, to uncover)? Does the agricultural metaphor of separating grain from chaff imply that inner contents have both \"wheat\" and \"chaff\" — valuable and worthless components?", "The qubūr-ṣudūr rhyme in 100:9-10 pairs GRAVES (external containers of dead bodies) with CHESTS (internal containers of living intentions). Does this suggest that the physical body in the grave and the psychological content in the chest are parallel forms of concealment — both broken open on the Day?", "The three irregular qiraat variants (ḥaṣala, ḥaṣṣala, ḥaṣila) collectively span the full spectrum of agency: autonomous emergence, divine extraction, and state-change. Does the standard Hafs passive (ḥuṣṣila) deliberately sit at the center of this spectrum, allowing all three readings simultaneously?", "The phrase mā fī ṣ-ṣudūr occurs ~17 times in the Quran, always in the context of God KNOWING what is hidden. Here in 100:10, uniquely, the contents are not merely known but EXTRACTED. Does this represent an escalation from divine omniscience (knowing) to divine judgment (exposing)?", "ṣ-d-r etymologically carries the sense of \"issuing forth\" (ṣadara = to come forth). Does the choice of ṣudūr (chests) as the container imply that the contents were always destined to emerge — that concealment in the ṣadr is inherently temporary, since the very word means \"the place from which things issue\"?", "Modern data extraction technologies (data mining, neural decoding, brain-computer interfaces) perform literal ḥuṣṣila — sifting through internal data to extract meaningful patterns. Does the Quran's eschatological vocabulary anticipate the technological capacity to extract inner states from biological systems?", "The passive construction of ḥuṣṣila removes human agency entirely — people do not choose to reveal their inner states; the states are extracted from them. Does this grammatical passivity mirror the theological claim that the Day of Judgment strips away all human control, including the ability to hide one's true nature?", "If ḥ-ṣ-l means \"to separate the essential from the incidental\" (Lane's), what counts as \"essential\" in the contents of the chest? Are destructive intentions the \"grain\" being separated, or are hidden virtues the \"grain\" while pretense is the \"chaff\"?", "The phonetic pairing of qubūr (قُبُور) and ṣudūr (صُدُور) creates a sonic echo across 100:9-10. Both are fu'ūl broken plurals. Does this phonetic parallelism suggest that graves and chests are structurally equivalent — both sealed containers awaiting forced opening?", "Could ṣudūr in a futuristic reading refer not only to biological chests but to any system that contains and processes hidden information — encrypted databases, classified archives, black-box algorithms? If so, does ḥuṣṣila describe a universal principle of forced disclosure that applies across all storage systems?"], "questionsTr": ["Kur'an neden burada daha yaygın olan ukhrija (kh-r-j, çıkarmak) veya kushifa (k-sh-f, açmak) yerine hapax legomenon olan ḥuṣṣila (ḥ-ṣ-l) kelimesini kullanır? Samandan taneyi ayırmanın tarımsal mecazı, iç içeriklerin hem \"buğday\" hem \"saman\" — değerli ve değersiz bileşenler — barındırdığını mı ima eder?", "100:9-10'daki qubūr-ṣudūr kafiyesi KABİRLERİ (ölü bedenlerin dışsal kapları) GÖĞÜSLERLE (yaşayan niyetlerin içsel kapları) eşleştirir. Bu, kabirdeki fiziksel beden ile göğüsteki psikolojik içeriğin paralel gizlenme biçimleri olduğunu — her ikisinin de O Gün kırılıp açıldığını — mı gösterir?", "Üç düzensiz kıraat varyantı (ḥaṣala, ḥaṣṣala, ḥaṣila) birlikte faillik spektrumunun tamamını kapsar: özerk ortaya çıkma, ilahi çıkarma ve durum değişikliği. Standart Hafs edilgeni (ḥuṣṣila) bu spektrumun kasıtlı olarak merkezinde mi durur ve üç okumaya da aynı anda izin mi verir?", "mā fī ṣ-ṣudūr ifadesi Kur'an'da ~17 kez geçer, her zaman Tanrı'nın gizli olanı BİLMESİ bağlamında. 100:10'da benzersiz biçimde içerikler salt bilinmez aynı zamanda ÇIKARILIR. Bu ilahi her şeyi bilmeden (bilme) ilahi yargıya (açığa çıkarma) bir yükselişi mi temsil eder?", "ṣ-d-r etimolojik olarak \"sâdır olma\" (ṣadere = ortaya çıkmak) anlamını taşır. ṣudūr (göğüsler) kap olarak seçimi, içeriklerin her zaman ortaya çıkmaya yazgılı olduğunu — ṣadr'daki gizlenmenin doğası gereği geçici olduğunu, çünkü kelimenin kendisinin \"şeylerin sâdır olduğu yer\" anlamına geldiğini — mi ima eder?", "Modern veri çıkarma teknolojileri (veri madenciliği, nöral kod çözme, beyin-bilgisayar arayüzleri) harfi harfine ḥuṣṣila gerçekleştirir — anlamlı örüntüleri çıkarmak için iç verileri eler. Kur'an'ın eskatolojik kelime dağarcığı, biyolojik sistemlerden iç durumları çıkarmaya yönelik teknolojik kapasiteyi önceden mi görür?", "ḥuṣṣila'nın edilgen yapısı insan failliğini tamamen kaldırır — insanlar iç durumlarını açığa çıkarmayı seçmez; durumlar onlardan çıkarılır. Bu dilbilgisel edilgenlik, Kıyamet Günü'nün gerçek doğasını gizleme yeteneği dahil tüm insan kontrolünü sıyırdığı teolojik iddiayı mı yansıtır?", "Eğer ḥ-ṣ-l \"özü tâli olandan ayırmak\" (Lane's) anlamına geliyorsa, göğüs içeriklerinde \"öz\" olarak ne sayılır? Yıkıcı niyetler mi ayrılan \"tane\"dir yoksa gizli erdemler mi \"tane\" iken gösteriş mi \"saman\"dır?", "qubūr (قُبُور) ve ṣudūr (صُدُور) fonetik eşleşmesi 100:9-10 boyunca ses yankısı yaratır. Her ikisi de fu'ūl kırık çoğuludur. Bu fonetik paralellik, kabirlerin ve göğüslerin yapısal olarak eşdeğer olduğunu — her ikisinin de zorla açılmayı bekleyen mühürlü kaplar olduğunu — mu ileri sürer?", "Geleceksel bir okumada ṣudūr yalnızca biyolojik göğüslere değil, gizli bilgi barındıran ve işleyen her sisteme — şifreli veritabanları, gizli arşivler, kara kutu algoritmaları — atıfta bulunabilir mi? Öyleyse ḥuṣṣila tüm depolama sistemlerine uygulanan evrensel bir zorla ifşa ilkesini mi tanımlar?"], "key": "100:10"}, "100:11": {"surah": 100, "ayah": 11, "arabic": "إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍۢ لَّخَبِيرٌۢ", "transliteration": "inna rabbahum bihim yawmaʾidhin la-khabīrun", "readings": [{"text": "Indeed their Lord, concerning them, on that Day, is surely one possessing inner knowledge of them", "textTr": "Gerçekten, o gün Rableri onlar hakkında kesinlikle iç bilgiye sahiptir", "rationale": "inna is parsed as an emphatic particle governing rabbahum (accusative), bihim is a prepositional phrase (bi- of specification + pronoun), yawmaʾidhin is a temporal adverbial (adverb of time, genitive due to tanwīn idāfī from the elided clause), la-khabīrun is the predicate of inna with lām al-ibtidāʾ (emphatic lām) reinforcing the assertion. khabīr is fa'īl intensive adjective denoting deep, experiential knowledge — not surface awareness but knowledge gained through testing and penetration into inner reality.", "rationaleTr": "inna vurgulayıcı edat olarak rabbahum'u mansub halde yönetir, bihim edatlı tamlama (bi- tahsis edatı + zamir), yawmaʾidhin zaman zarfı (mahzuf cümleden kaynaklanan tenvin-i izafi ile mecrur), la-khabīrun inna'nın haberidir ve lâmu'l-ibtidâ (vurgu lâmı) iddiayı pekiştirir. khabīr fa'īl kalıbında mübalağa sıfatı olup yüzeysel farkındalık değil, sınama ve iç gerçekliğe nüfuz yoluyla kazanılan derin, deneyimsel bilgiyi ifade eder."}, {"text": "Indeed their Sustainer, through them, on that Day, is surely one thoroughly informed", "textTr": "Gerçekten, o gün onların Rezzakı, onlar aracılığıyla, kesinlikle her şeyden haberdardır", "rationale": "rabb is read not as \"Lord/Master\" but as \"Sustainer/Nourisher\" (from r-b-b: to raise, nurture, bring to maturity). bi- is parsed as instrumental (\"through them\" — God's khabīr-knowledge manifests through their very being, their deeds serving as the evidence). yawmaʾidhin functions as a pivot — \"that Day\" when inner realities become transparent. la-khabīrun carries the sense of \"thoroughly informed through direct experience.\"", "rationaleTr": "rabb burada \"Efendi/Sahip\" değil \"Besleyici/Rezzak\" olarak okunur (r-b-b: beslemek, yetiştirmek, olgunlaştırmak). bi- araçsallık edatı olarak okunur (\"onlar aracılığıyla\" — Allah'ın khabīr-bilgisi onların varlığıyla tezahür eder, amelleri kanıt olarak işlev görür). yawmaʾidhin bir dönüm noktası olarak işlev görür — iç gerçekliklerin şeffaf hale geldiği \"o gün.\" la-khabīrun \"doğrudan deneyimle tam bilgilenen\" anlamı taşır."}, {"text": "Indeed their Educator, about them, at that time-marker, is surely one who has tested and knows their innermost", "textTr": "Gerçekten, o zaman diliminde onların Terbiyecisi, onlar hakkında, kesinlikle sınamış ve en iç hallerini bilendir", "rationale": "rabb as \"Educator\" (from r-b-b: to educate, to develop gradually). bi- parsed as \"about/concerning\" (specification). yawmaʾidhin read not as an eschatological \"Day of Judgment\" but as any decisive temporal marker — any moment of reckoning, whether personal, historical, or cosmic. khabīr from kh-b-r carries the classical sense of \"one who has tested, probed, experienced\" — knowledge through active investigation, not passive omniscience.", "rationaleTr": "rabb \"Terbiyeci\" olarak okunur (r-b-b: terbiye etmek, kademeli olarak geliştirmek). bi- tahsis edatı olarak \"hakkında\" anlamında. yawmaʾidhin sadece eskatolojik \"Kıyamet Günü\" değil herhangi bir hesap anı olarak — kişisel, tarihsel veya kozmik herhangi bir belirleyici zaman dilimi olarak okunur. khabīr kh-b-r kökünden klasik \"sınamış, araştırmış, deneyimlemiş\" anlamı taşır — pasif her şeyi bilme değil, aktif soruşturma yoluyla bilgi."}, {"text": "Indeed the one who gradually brought them to maturity, concerning them, when that time arrives, is surely the expert analyst", "textTr": "Gerçekten, onları kademeli olarak olgunlaştıran, onlar hakkında, o zaman geldiğinde, kesinlikle uzman çözümleyicidir", "rationale": "rabb is read through the full r-b-b semantic range of gradual nurturing and development — the same entity that raised them from nothing to maturity is the one who possesses khabīr-knowledge of them. The temporal yawmaʾidhin becomes a culmination point: the nurturing process reaches its endpoint and the Nurturer reveals complete knowledge. In modern/futuristic terms, khabīr can denote expert-level analytical knowledge — forensic understanding, data analysis, complete diagnostic awareness.", "rationaleTr": "rabb, r-b-b kökünün kademeli besleme ve geliştirme anlamının tamamıyla okunur — onları yoktan olgunluğa yetiştiren varlık aynı zamanda onlar hakkında khabīr-bilgiye sahip olandır. Zamansal yawmaʾidhin bir doruk noktası olur: yetiştirme süreci son noktasına ulaşır ve Yetiştirici tam bilgiyi açığa çıkarır. Modern/geleceksel anlamda khabīr uzman düzeyinde analitik bilgiyi ifade edebilir — adli anlayış, veri analizi, tam teşhis farkındalığı."}, {"text": "Indeed their Lord, in their very matter, on that decisive occasion, is surely the one whose knowledge penetrates all layers", "textTr": "Gerçekten, Rableri onların tam da meselesinde, o belirleyici anda, kesinlikle bilgisi tüm katmanlara nüfuz edendir", "rationale": "bi- is parsed with the widest possible range: \"in\" (locative — God's knowledge is situated within their very being), \"concerning\" (topical), \"through\" (instrumental — their deeds are the medium of knowledge). The emphasis structure (inna ... la-) creates a double assertion, grammatically enacting certainty. The word order places bihim before yawmaʾidhin, foregrounding the relationship (God-to-them) before the temporal setting. khabīr as \"one whose knowledge penetrates all layers\" — from khabara: to penetrate, to test, to probe the inner quality of soil or news.", "rationaleTr": "bi- mümkün olan en geniş kapsamda okunur: \"içinde\" (mekânsal — Allah'ın bilgisi onların varlığının içinde konumlanmış), \"hakkında\" (konusal), \"aracılığıyla\" (araçsal — amelleri bilginin aracıdır). Vurgu yapısı (inne ... le-) çifte teyit yaratır, dilbilgisel olarak kesinliği icra eder. Söz dizimi bihim'i yawmaʾidhin'den önce yerleştirir, ilişkiyi (Tanrı-onlara) zamansal ayardan önce ön plana çıkarır. khabīr \"bilgisi tüm katmanlara nüfuz eden\" olarak — khabara: nüfuz etmek, sınamak, toprağın veya haberin iç niteliğini araştırmak."}], "structure": {"beats": [{"label": "Emphatic declaration and subject", "labelTr": "Vurgu bildirimi ve özne", "lines": [{"arabic": "إِنَّ رَبَّهُم", "translit": "inna rabbahum", "english": "Indeed their Lord", "turkish": "Gerçekten onların Rabbi"}]}, {"label": "Object of knowledge and temporal frame", "labelTr": "Bilgi nesnesi ve zaman çerçevesi", "lines": [{"arabic": "بِهِمْ يَوْمَئِذٍۢ", "translit": "bihim yawmaʾidhin", "english": "concerning them, on that Day", "turkish": "onlar hakkında, o gün"}]}, {"label": "Emphatic predicate", "labelTr": "Vurgulu yüklem", "lines": [{"arabic": "لَّخَبِيرٌۢ", "translit": "la-khabīrun", "english": "is surely All-Aware", "turkish": "kesinlikle her şeyden haberdardır"}]}], "summary": "The ayah is a single nominal sentence governed by the emphatic particle inna. The structure is: [inna + ism inna (rabbahum, accusative) + prepositional phrase (bihim) + temporal adverb (yawmaʾidhin) + khabar inna (la-khabīrun, nominative with emphatic lām)]. The double emphasis (inna at the start, lām al-ibtidāʾ on the predicate) creates a grammatical envelope of certainty — the sentence both opens and closes with emphatic markers. The word order is significant: bihim (concerning them) precedes yawmaʾidhin (on that Day), placing the relational axis (God's knowledge OF them) before the temporal axis. This is a climactic closure to Surah al-ʿĀdiyāt, summarizing the consequence: after the charges of ingratitude and avarice (100:6-8) and the eschatological upheaval (100:9-10), the final assertion is that God possesses deep, tested, penetrating knowledge. The structure enacts its content: the emphatic grammar PERFORMS certainty rather than merely stating it.", "summaryTr": "Ayet, inna vurgulayıcı edatının yönettiği tek bir isim cümlesidir. Yapı: [inna + ism-i inna (rabbahum, mansub) + edatlı tamlama (bihim) + zaman zarfı (yawmaʾidhin) + haber-i inna (la-khabīrun, lâmu'l-ibtidâ ile merfû)]. Çifte vurgu (başta inna, yüklemde lâmu'l-ibtidâ) dilbilgisel bir kesinlik zarfı yaratır — cümle hem vurgulu işaretle açılır hem kapanır. Söz dizimi önemlidir: bihim (onlar hakkında) yawmaʾidhin'den (o gün) önce gelir, ilişki eksenini (Allah'ın ONLAR hakkındaki bilgisi) zaman ekseninden önce yerleştirir. Bu, Sûretu'l-Âdiyât'ın doruk noktası kapanışıdır: nankörlük ve hırs suçlamalarından (100:6-8) ve eskatolojik sarsıntıdan (100:9-10) sonra son iddia, Allah'ın derin, sınanmış, nüfuz eden bilgiye sahip olduğudur. Yapı içeriğini icra eder: vurgulu dilbilgisi kesinliği salt ifade etmek yerine İCRA eder."}, "words": [{"id": 1, "arabic": "إِنَّ", "translit": "inna", "gloss": "indeed; verily; it is a fact that", "glossTr": "gerçekten; kesinlikle; şüphesiz ki", "userNotes": "", "root": "—", "grammar": "Emphatic particle (ḥarf tawkīd/naṣb). Governs the following noun in the accusative (ism inna = rabbahum). Introduces a nominal sentence with emphasis. Part of the inna wa-akhawātuhā group of particles that restructure nominal sentences.", "grammarTr": "Vurgulayıcı edat (harf-i tevkîd/nasb). Sonraki ismi mansub halde yönetir (ism-i inna = rabbahum). Vurgulu bir isim cümlesini başlatır. İnne ve kardeşleri (inne ve ehavâtuhâ) grubuna aittir; isim cümlelerini yeniden yapılandırır.", "semantics": ["Emphatic particle: introduces factual assertions with force; marks the following clause as established truth; creates an assertive frame that resists doubt", "Classical grammarians: inna \"removes doubt from the heart of the listener\" (Lane's: inna is for taḥqīq — verification, making certain)", "Discourse function: topic-fronting device that signals important information follows; in modern text analysis, functions as an \"attention anchor\""], "semanticsTr": ["Vurgulayıcı edat: olgusal iddiaları güçle sunar; sonraki cümleyi yerleşik hakikat olarak işaretler; şüpheye direnen bir iddia çerçevesi yaratır", "Klasik dilciler: inna \"dinleyicinin kalbinden şüpheyi giderir\" (Lane's: inna taḥqīq içindir — doğrulama, kesinleştirme)", "Söylem işlevi: önemli bilginin geldiğini işaret eden konu öne çıkarma aracı; modern metin analizinde \"dikkat çapası\" işlevi görür"], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "أَنَّ", "translit": "anna", "status": "Irreg", "type": "in↔an", "note": "The variant anna (without initial hamza of kasra) changes the particle from inna (emphatic assertion about a present fact) to anna (subordinating conjunction meaning \"that\"). With anna, the clause would depend on a preceding verb — possibly linking to the content of 100:9-10 (knowledge of what is in the graves and what is in the hearts). This shifts the ayah from an independent emphatic statement to a dependent clause completing the previous sentence's meaning.", "noteTr": "anna varyantı (kesra hemzesi olmadan) edatı inna'dan (mevcut bir olgu hakkında vurgulu iddia) anna'ya (bağlama edatı: \"ki, ...olduğunu\") dönüştürür. anna ile cümle önceki bir fiile bağlanır — muhtemelen 100:9-10'un içeriğine bağlanır (kabirlerdekinin ve kalplerdekinin bilgisi). Bu, ayeti bağımsız bir vurgulu ifadeden önceki cümlenin anlamını tamamlayan bağımlı bir cümleye dönüştürür.", "source": "erquran.org"}], "cooccurrence": [], "critical": "The inna/anna variant creates a significant structural ambiguity. With inna (standard Hafs), 100:11 stands as an independent emphatic declaration — the surah's climactic final statement. With anna (irregular reading), it becomes a dependent clause completing the preceding ayahs: \"Does he not know when the graves are overturned and what is in the breasts is obtained — THAT their Lord concerning them on that Day is surely All-Aware?\" The inna reading creates a fresh, autonomous assertion of divine omniscience. The anna reading embeds that omniscience as the CONTENT of the implied knowledge. Both readings are structurally coherent. The double emphasis (inna ... la-) is a Quranic pattern that appears in climactic declarations, grammatically enacting certainty rather than merely asserting it.", "criticalTr": "inna/anna varyantı önemli bir yapısal belirsizlik yaratır. inna (standart Hafs) ile 100:11 bağımsız bir vurgulu bildirim olarak durur — surenin doruk son ifadesi. anna (düzensiz kıraat) ile önceki ayetleri tamamlayan bağımlı bir cümle olur: \"Kabirler altüst edildiğinde ve göğüslerdeki elde edildiğinde — Rablerinin o gün onlar hakkında kesinlikle haber sahibi olduğunu bilmez mi?\" inna okuması ilahi her şeyi bilmenin taze, özerk bir iddiasını yaratır. anna okuması bu her şeyi bilmeyi ima edilen bilginin İÇERİĞİ olarak gömer. Her iki okuma da yapısal olarak tutarlıdır. Çifte vurgu (inne ... le-) doruk bildirimlerde görülen bir Kur'anî kalıptır ve kesinliği salt iddia etmek yerine dilbilgisel olarak icra eder.", "temporal": "7C"}, {"id": 2, "arabic": "رَبَّهُم", "translit": "rabbahum", "gloss": "their Lord; their Sustainer; their Nurturer; the one who raised them", "glossTr": "Rableri; onların Besleyicisi; onların Terbiyecisi; onları yetiştiren", "userNotes": "", "root": "ر ب ب (r-b-b)", "grammar": "Noun (ism), masculine singular, accusative (manṣūb) as ism inna. Attached pronoun -hum (3rd person masculine plural, genitive) functions as muḍāf ilayh in a possessive construct. rabb is a noun of agency (quasi-participle) from r-b-b, pattern fa'l. The accusative case is governed by inna.", "grammarTr": "İsim, eril tekil, inna'nın ismi olarak mansub halde. Bitişik zamir -hum (üçüncü şahıs eril çoğul, mecrur) izafe yapısında muzafun ileyh işlevi görür. rabb, r-b-b kökünden fa'l kalıbında fail ismidir (yarı-ism-i fail). Mansub hali inna tarafından yönetilir.", "semantics": ["Root r-b-b (ر ب ب): to be lord/master of; to own; to nourish, rear, foster; to bring to maturity", "فَعَّ (rabba, I): to have lordship over, to possess, to be master of; to raise, nourish, bring up (a child, a creature)", "II (rabba/rabbā): to raise, nurture, educate; to bring to full development; to foster gradually", "Noun rabb: lord, master, owner, possessor; sustainer, nourisher; educator, fosterer; one who brings to maturity stage by stage", "Noun rabb: head of household; chief; patron (pre-Islamic usage)", "Lane's Lexicon: rabb = \"the lord, or possessor; the one who has the right of ownership over a thing; the regulator, manager, disposer; the one who nourishes and sustains.\" Also: rabb al-dār = owner of the house; rabb al-māl = owner of wealth; rubb = condensed juice, syrup (the ESSENCE extracted by reduction — metaphor for concentration of authority)", "Lisan al-Arab: rabbahu = he reared him, fostered him, brought him up; ar-rabb = the one who reforms, amends, manages affairs; also attested: rabbānī = one devoted to the Lord, a scholar who acts on knowledge", "Hans Wehr: rabb = lord, master, God; tarbiya = education, upbringing (Form II derivative); rabbānī = divine, godly", "Classical lexicon meaning not in direct Quranic nominal usage: rubb = thick juice, concentrate, essence — the distillation of a substance to its core. This concrete sense (reducing something to its purest form) underlies the abstract \"lordship\" meaning: the rabb is the one who refines and concentrates.", "Modern: rabb as \"system administrator,\" \"curator,\" \"developer\" — one who maintains, develops, and has complete access to a system", "Futuristic: rabb as the entity that holds the developmental trajectory of a being from origin to completion — applicable to any nurturing intelligence, biological or computational", "Core concept: graduated nurturing toward maturity — the rabb is not merely an owner but an active developer who brings something from raw potential to full realization"], "semanticsTr": ["Kök r-b-b (ر ب ب): rab olmak, efendi olmak; sahip olmak; beslemek, yetiştirmek; olgunlaştırmak", "فَعَّ (rabbe, I. bab): üzerinde rablik etmek, sahip olmak; yetiştirmek, besleyip büyütmek", "II. bab (rabbâ): yetiştirmek, eğitmek, terbiye etmek; tam gelişime kavuşturmak; kademeli olarak beslemek", "İsim rabb: efendi, sahip, malik; besleyici, rızık veren; terbiyeci, mürebbi; aşama aşama olgunlaştıran", "İsim rabb: hane reisi; reis; patron (İslam öncesi kullanım)", "Lane's Lexicon: rabb = \"efendi veya sahip; bir şey üzerinde mülkiyet hakkına sahip olan; düzenleyici, yönetici, tasarruf eden; besleyen ve sürdüren.\" Ayrıca: rabbu'd-dâr = evin sahibi; rabbu'l-mâl = malın sahibi; rubb = koyu meyve suyu, şurup (indirgemeyle çıkarılan ÖZ — otoritenin yoğunlaşması metaforu)", "Lisan al-Arab: rabbahu = onu yetiştirdi, besledi, büyüttü; er-rabb = ıslah eden, düzelten, işleri yöneten; ayrıca: rabbânî = Rabbe adanmış, bilgisiyle amel eden alim", "Hans Wehr: rabb = efendi, sahip, Tanrı; terbiye = eğitim, yetiştirme (II. bab türevi); rabbânî = ilahi, tanrısal", "Kur'an'da doğrudan isim kullanımında olmayan klasik sözlük anlamı: rubb = koyu meyve suyu, konsantre, öz — bir maddenin çekirdeğine damıtılması. Bu somut anlam (bir şeyi en saf haline indirgeme) soyut \"rablik\" anlamının altında yatar: rabb arıtıp yoğunlaştırandır.", "Modern: rabb \"sistem yöneticisi,\" \"küratör,\" \"geliştirici\" olarak — bir sistemi bakımını yapan, geliştiren ve tam erişime sahip olan", "Geleceksel: rabb bir varlığın kökeninden tamamlanışına gelişim yörüngesini tutan varlık — biyolojik veya hesaplamalı herhangi bir besleyici zekaya uygulanabilir", "Kök kavram: olgunluğa doğru kademeli yetiştirme — rabb salt bir sahip değil, bir şeyi ham potansiyelden tam gerçekleşmeye taşıyan aktif bir geliştiricidir"], "occurrences": {"type": "grouped", "groups": [{"label": "A. rabb as subject of inna-clause (SUBJ_COP_PART) — emphatic declarations about the Lord", "count": "~67 ayahs", "examples": [{"ref": "7:89", "arabic": "قَدِ ٱفْتَرَيْنَا عَلَى ٱللَّهِ كَذِبًا إِنْ عُدْنَا فِى مِلَّتِكُم بَعْدَ إِذْ نَجَّىٰنَا ٱللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَىْءٍ عِلْمًا ۚ عَلَى ٱللَّهِ تَوَكَّلْنَا ۚ رَبَّنَا ٱفْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِٱلْحَقِّ وَأَنتَ خَيْرُ ٱلْفَٰتِحِينَ", "english": "We would have fabricated a lie against God if we returned to your creed after God delivered us from it. It is not for us to return to it unless God — rabbunā (our Lord) — wills. rabbunā (Our Lord) encompasses all things in knowledge. Upon God we rely. rabbana (Our Lord), decide between us and our people in truth, for You are the best of deciders.", "turkish": "Rabbimiz olan Allah bizi ondan kurtardıktan sonra sizin dininize dönersek Allah'a iftira etmiş oluruz. Rabbimiz Allah dilemedikçe ona dönmemiz bizim için söz konusu değildir. Rabbimiz ilmiyle her şeyi kuşatmıştır. Allah'a tevekkül ettik. Rabbimiz, bizimle kavmimiz arasında hak ile hükmet; Sen hükmedenlerin en hayırlısısın."}, {"ref": "1:2", "arabic": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ", "english": "All praise belongs to God, rabbi l-ʿālamīna (Lord of all worlds/beings).", "turkish": "Hamd, âlemlerin Rabbi olan Allah'a aittir."}]}, {"label": "B. rabb with possessive pronoun — personal Lord-servant relationship (GEN_CONS, PREP_OBJ)", "count": "~215+ ayahs", "examples": [{"ref": "2:283", "arabic": "۞ وَإِن كُنتُمْ عَلَىٰ سَفَرٍۢ وَلَمْ تَجِدُوا۟ كَاتِبًۭا فَرِهَٰنٌۭ مَّقْبُوضَةٌۭ ۖ فَإِنْ أَمِنَ بَعْضُكُم بَعْضًۭا فَلْيُؤَدِّ ٱلَّذِى ٱؤْتُمِنَ أَمَٰنَتَهُۥ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ", "english": "And if you are on a journey and cannot find a scribe, then pledges held in hand. But if one of you trusts another, let the one entrusted discharge his trust, and let him be mindful of God, rabbahu (his Lord).", "turkish": "Seferde olursanız ve yazıcı bulamazsanız alınmış rehinler yeterlidir. Birbirinize güvenirseniz emanetçi emanetini ödesin ve Allah'tan — Rabbinden — sakınsın."}, {"ref": "3:41", "arabic": "قَالَ رَبِّ ٱجْعَل لِّىٓ ءَايَةًۭ", "english": "He said: rabbi (my Lord), make for me a sign.", "turkish": "Dedi: Rabbim, bana bir işaret ver."}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "kh-b-r", "coRootAr": "خ ب ر", "count": "5", "refs": "100:11;17:17;17:30;11:111;33:2", "note": "Lord/Sustainer paired with inner-knowledge — the Nurturer who possesses penetrating awareness of His servants ← IN THIS AYAH", "noteTr": "Rab/Besleyici iç bilgiyle eşleşmiş — kullarının derinliklerine nüfuz eden farkındalığa sahip Yetiştirici ← BU AYETTE"}, {"coRoot": "y-w-m", "coRootAr": "ي و م", "count": "27", "refs": "100:11;18:19;3:9;3:41;5:64;6:15;6:128;7:54;7:167;10:3", "note": "Lord paired with day/time — the Lord's authority manifests temporally, at appointed times and on the Day of accounting ← IN THIS AYAH", "noteTr": "Rab zaman/gün ile eşleşmiş — Rabbin otoritesi zamanda, belirlenen vakitlerde ve hesap gününde tezahür eder ← BU AYETTE"}], "critical": "The pairing rabbahum (their Lord) with la-khabīrun (surely All-Aware) in this ayah creates a theologically dense construction. rabb with the 3rd-person plural pronoun -hum establishes a possessive relationship: \"THEIR Lord\" — emphasizing that the very entity who nurtured them is the one who knows their inner reality. This is not abstract omniscience but relational knowledge: the Nurturer knows because nurturing IS knowing. The co-occurrence of r-b-b with kh-b-r appears in 5 ayahs (100:11, 17:17, 17:30, 11:111, 33:2) — each time pairing lordship with deep experiential knowledge, suggesting that divine rabūbiyya (lordship) inherently includes khibra (expert knowledge through experience). The classical lexicon meaning of rubb (concentrated essence) adds a layer: the Lord distills knowledge of His servants to their essence. The accusative case (mansūb by inna) is itself meaningful: inna \"seizes\" the noun, grammatically enacting the certainty of the divine relationship.", "criticalTr": "Rabbahum (onların Rabbi) ile la-khabīrun (kesinlikle Haberdâr) eşleşmesi teolojik olarak yoğun bir yapı yaratır. rabb üçüncü şahıs çoğul zamiri -hum ile mülkiyet ilişkisi kurar: \"ONLARIN Rabbi\" — onları yetiştiren varlığın aynı zamanda iç gerçekliklerini bilen olduğunu vurgular. Bu soyut her şeyi bilme değil ilişkisel bilgidir: Yetiştirici bilir çünkü yetiştirmek bilmektir. r-b-b ile kh-b-r birlikteliği 5 ayette görünür (100:11, 17:17, 17:30, 11:111, 33:2) — her seferinde rabliği derin deneyimsel bilgiyle eşleştirir ve ilahi rubûbiyyetin özünde hıbre (deneyim yoluyla uzmanlık bilgisi) içerdiğini gösterir. rubb'un klasik sözlük anlamı (yoğunlaştırılmış öz) bir katman ekler: Rab kullarının bilgisini özlerine damıtır. Mansub hal (inna tarafından yönetilen) başlı başına anlamlıdır: inna ismi \"yakalar\" ve ilahi ilişkinin kesinliğini dilbilgisel olarak icra eder.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "بِهِمْ", "translit": "bihim", "gloss": "concerning them; about them; through them; in them", "glossTr": "onlar hakkında; onlar aracılığıyla; onların içinde", "userNotes": "", "root": "—", "grammar": "Prepositional phrase: bi- (preposition) + -him (attached pronoun, 3rd person masculine plural, genitive governed by bi-). bi- here functions as a preposition of specification/relation (bāʾ al-taʿdiya or bāʾ al-ilṣāq) — marking what the knowledge pertains to. Can also carry instrumental force (through them) or locative force (in their case).", "grammarTr": "Edatlı tamlama: bi- (edat) + -him (bitişik zamir, üçüncü şahıs eril çoğul, bi- tarafından mecrur). bi- burada tahsis/ilgi edatı (bâu't-ta'diye veya bâu'l-ilsâk) işlevi görür — bilginin neye ilişkin olduğunu belirtir. Araçsal (onlar aracılığıyla) veya mekânsal (onların durumunda) anlam da taşıyabilir.", "semantics": ["bi- as preposition of specification: \"concerning, about, with regard to\" — marks the object/topic of khabīr-knowledge", "bi- as preposition of instrument: \"through, by means of\" — their deeds/being serve as the medium of divine knowledge", "bi- as preposition of proximity/attachment (ilṣāq): \"close to, attached to, in contact with\" — divine knowledge is intimate, not distant", "Lane's Lexicon: bāʾ has 13+ semantic functions including instrumentality, causation, specification, accompaniment, oath, substitution, transference. In \"khabīrun bi-\", it marks the domain of expertise."], "semanticsTr": ["bi- tahsis edatı olarak: \"hakkında, ile ilgili\" — khabīr-bilginin nesnesini/konusunu belirtir", "bi- araçsallık edatı olarak: \"aracılığıyla, vasıtasıyla\" — amelleri/varlıkları ilahi bilginin aracı olarak işlev görür", "bi- yakınlık/ilsâk edatı olarak: \"yakın, bağlı, temas halinde\" — ilahi bilgi yakın ve içseldir, uzak değil", "Lane's Lexicon: bâ'nın 13'ten fazla anlamsal işlevi vardır: araçsallık, nedensellik, tahsis, beraberlik, yemin, ikame, nakil. \"khabīrun bi-\" yapısında uzmanlık alanını belirtir."], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The prepositional phrase bihim is positioned between the subject (rabbahum) and the temporal marker (yawmaʾidhin), creating a grammatical chiasm: Lord-[them]-[that Day]-Aware. The pronoun -him refers back to the humans described in the preceding ayahs (those who are ungrateful, who love wealth). The placement of bihim before yawmaʾidhin is significant: the relationship (God knows THEM) is foregrounded before the temporal setting (on THAT DAY). This word order suggests that the knowledge is primary and the temporal occasion is secondary — God's khibra of them is not limited to \"that Day\" but is revealed/manifested on that Day. The bāʾ in khabīr bi- is the standard Arabic construction for \"expert in, knowledgeable about\" — like ṭabīb bi- (skilled physician in), ʿālim bi- (knowledgeable in). This makes khabīr a term of EXPERTISE, not mere awareness.", "criticalTr": "Edatlı tamlama bihim, özne (rabbahum) ile zaman belirteci (yawmaʾidhin) arasına yerleştirilerek dilbilgisel bir kiazm yaratır: Rab-[onlar]-[o gün]-Haberdâr. Zamir -him önceki ayetlerde anlatılan insanlara (nankör, malı seven) gönderir. bihim'in yawmaʾidhin'den önce yerleştirilmesi önemlidir: ilişki (Allah ONLARI bilir) zamansal ayardan (O GÜNDE) önce ön plana çıkarılır. Bu söz dizimi bilginin birincil, zamansal vesile'nin ikincil olduğunu gösterir — Allah'ın onlar hakkındaki hıbresi \"o gün\"le sınırlı değildir, o gün açığa çıkarılır/tezahür ettirilir. khabīr bi- yapısındaki bâ standart Arapça \"... konusunda uzman, ... hakkında bilgili\" yapısıdır — tabîb bi- (... konusunda uzman hekim), âlim bi- (... konusunda bilgili) gibi. Bu, khabīr'ı salt farkındalık değil UZMANLIK terimi yapar.", "temporal": "7C"}, {"id": 4, "arabic": "يَوْمَئِذٍۢ", "translit": "yawmaʾidhin", "gloss": "that Day; on the day when; at that time", "glossTr": "o gün; ne zaman ki o gün; o zaman", "userNotes": "", "root": "ي و م (y-w-m)", "grammar": "Noun (ism), masculine singular, accusative (manṣūb) as adverb of time (ẓarf zamān). Composed of yawm (day) + idh (when, at the time of) + tanwīn (nunation replacing the genitive iḍāfa clause). The tanwīn on idhin is compensatory (ʿiwaḍ) — replacing an elided clause (the events described in 100:9-10: when graves are overturned and what is in breasts is obtained). The accusative marks temporal adverbial function.", "grammarTr": "İsim, eril tekil, zaman zarfı (zarf-ı zaman) olarak mansub halde. yawm (gün) + idh (ne zaman, ...vakti) + tenvîn'den (mecrur izafe cümlesinin yerine geçen nunlama) oluşur. idhin üzerindeki tenvîn ıvaz tenvînidir (telafi edici) — mahzuf bir cümlenin yerine geçer (100:9-10'da anlatılan olaylar: kabirler altüst edildiğinde ve göğüslerdekiler elde edildiğinde). Mansub hal zamansal zarfımsı işlevi belirtir.", "semantics": ["Root y-w-m (ي و م): day; time period; era; occasion; epoch", "Noun yawm: day (from dawn to sunset, or sunrise to sunrise); a period of time of any length; era, epoch", "Plural ayyām: days; periods; battles/events (ayyām al-ʿArab = the notable events/battles of the Arabs — \"days\" as markers of significant happenings)", "Lane's Lexicon: yawm = \"a day; a time; a period of time, whether short or long.\" Also: yawm as \"condition, state\" (one's yawm = one's present condition). yawmaʾidhin = \"on that day, at that time\" — a demonstrative temporal reference", "Lisan al-Arab: yawm can denote any span of time — from a moment to a cosmic epoch. yawm ʿinda rabbika ka-alf sanatin (a day with your Lord is like a thousand years, 22:47) — yawm is elastic, not fixed", "Hans Wehr: yawm = day, date; al-yawm = today, now; yawmī = daily; yawmiyya = diary, daily allowance", "Modern: yawm as a data unit of time — a measurable period; yawmaʾidhin as \"at that computational moment,\" \"when that process runs\"", "Futuristic: yawm as any phase-transition marker — a singularity, a collapse event, a moment when hidden data becomes visible (cf. \"when graves are overturned\" = when stored information is retrieved)", "Core concept: a marked period in which events unfold and realities become manifest — yawm is not merely chronological time but a container for disclosure"], "semanticsTr": ["Kök y-w-m (ي و م): gün; zaman dilimi; dönem; vesile; çağ", "İsim yawm: gün (şafaktan akşama veya gün doğumundan gün doğumuna); herhangi bir uzunlukta zaman dilimi; dönem, çağ", "Çoğul eyyâm: günler; dönemler; savaşlar/olaylar (eyyâmu'l-Arab = Arapların önemli olayları/savaşları — önemli olayların işaretçileri olarak \"günler\")", "Lane's Lexicon: yawm = \"gün; zaman; kısa veya uzun herhangi bir zaman dilimi.\" Ayrıca: yawm \"durum, hal\" olarak (birinin yawm'u = şimdiki durumu). yawmaʾidhin = \"o gün, o zaman\" — göstermesel zamansal referans", "Lisan al-Arab: yawm bir andan kozmik bir çağa kadar herhangi bir zaman aralığını ifade edebilir. yawmun ʿinde rabbike ke-elfi seneh (Rabbinin katında bir gün bin yıl gibidir, 22:47) — yawm esnektir, sabit değildir", "Hans Wehr: yawm = gün, tarih; el-yawm = bugün, şimdi; yawmî = günlük; yawmiyye = günlük, gündelik ödenek", "Modern: yawm bir zaman veri birimi olarak — ölçülebilir bir dönem; yawmaʾidhin \"o hesaplama anında,\" \"o süreç çalıştığında\"", "Geleceksel: yawm herhangi bir faz geçiş işaretçisi olarak — tekillik, çökme olayı, gizli verinin görünür hale geldiği an (kr. \"kabirler altüst edildiğinde\" = depolanan bilgi geri alındığında)", "Kök kavram: olayların açıldığı ve gerçekliklerin tezahür ettiği işaretli dönem — yawm salt kronolojik zaman değil, açığa çıkarma kabıdır"], "occurrences": {"type": "grouped", "groups": [{"label": "A. yawm as temporal adverb (ADV_TIME) — marking occasions of divine action or judgment", "count": "~107 ayahs", "examples": [{"ref": "34:40", "arabic": "وَيَوْمَ يَحْشُرُهُمْ جَمِيعًۭا ثُمَّ يَقُولُ لِلْمَلَٰٓئِكَةِ أَهَٰٓؤُلَآءِ إِيَّاكُمْ كَانُوا۟ يَعْبُدُونَ", "english": "And yawma (on the Day) He will gather them all together, then say to the angels: \"Were these the ones who used to worship you?\"", "turkish": "Ve yawm (gün) onların hepsini toplayacak, sonra meleklere diyecek: \"Bunlar mı size ibadet ediyorlardı?\""}, {"ref": "2:85", "arabic": "ثُمَّ أَنتُمْ هَٰٓؤُلَآءِ تَقْتُلُونَ أَنفُسَكُمْ وَتُخْرِجُونَ فَرِيقًۭا مِّنكُم مِّن دِيَٰرِهِمْ تَظَٰهَرُونَ عَلَيْهِم بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَإِن يَأْتُوكُمْ أُسَٰرَىٰ تُفَٰدُوهُمْ وَهُوَ مُحَرَّمٌ عَلَيْكُمْ إِخْرَاجُهُمْ ۚ أَفَتُؤْمِنُونَ بِبَعْضِ ٱلْكِتَٰبِ وَتَكْفُرُونَ بِبَعْضٍۢ ۚ فَمَا جَزَآءُ مَن يَفْعَلُ ذَٰلِكَ مِنكُمْ إِلَّا خِزْىٌۭ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَيَوْمَ ٱلْقِيَٰمَةِ يُرَدُّونَ إِلَىٰٓ أَشَدِّ ٱلْعَذَابِ", "english": "Then you are those who kill your own selves and evict a group from their homes... The recompense for whoever does that among you is nothing but disgrace in worldly life, and yawma l-qiyāmati (on the Day of Resurrection) they will be returned to the severest punishment.", "turkish": "Sonra siz birbirinizi öldürüyor ve bir kısmınızı yurtlarından çıkarıyorsunuz... Bunu yapanın cezası dünya hayatında rezilliktir ve yawme'l-kıyâme (Kıyamet Günü) en şiddetli azaba döndürülürler."}]}, {"label": "B. yawm in genitive constructs (GEN_CONS) — \"Day of X\" compound expressions", "count": "~47 ayahs", "examples": [{"ref": "2:80", "arabic": "وَقَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ إِلَّآ أَيَّامًۭا مَّعْدُودَةًۭ", "english": "And they said: \"The fire shall not touch us except for ayyāman (a number of days).\"", "turkish": "Dediler: \"Bize ateş ancak sayılı eyyâm (günler) dokunacaktır.\""}, {"ref": "6:15", "arabic": "قُلْ إِنِّىٓ أَخَافُ إِنْ عَصَيْتُ رَبِّى عَذَابَ يَوْمٍ عَظِيمٍۢ", "english": "Say: \"I fear, if I disobey my Lord, the punishment of yawmin (a Day) tremendous.\"", "turkish": "De ki: \"Rabbime isyan edersem büyük bir yawm'un (gün) azabından korkarım.\""}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "27", "refs": "100:11;18:19;3:9;3:41;5:64;6:15;6:128;7:54;7:167;10:3", "note": "Day/time paired with Lord — temporal occasions of divine manifestation ← IN THIS AYAH", "noteTr": "Gün/zaman Rab ile eşleşmiş — ilahi tezahürün zamansal vesileleri ← BU AYETTE"}, {"coRoot": "kh-b-r", "coRootAr": "خ ب ر", "count": "5", "refs": "100:11;6:73;25:59;35:14;99:4", "note": "Day/time paired with inner-knowledge — awareness manifests at appointed temporal markers ← IN THIS AYAH", "noteTr": "Gün/zaman iç bilgiyle eşleşmiş — farkındalık belirlenen zamansal işaretlerde tezahür eder ← BU AYETTE"}], "critical": "yawmaʾidhin is a compound temporal expression whose tanwīn is one of the most discussed phenomena in Arabic grammar. The nunation on idhin (إذ + tanwīn → إذٍ) replaces an entire clause — the events of 100:9-10: \"when what is in the graves is overturned (buʿthira) and what is in the breasts is obtained (ḥuṣṣila).\" This tanwīn al-ʿiwaḍ (compensatory nunation) compresses an entire eschatological narrative into a single morpheme. The word thus carries enormous semantic weight: it does not just say \"that day\" but implicitly includes \"the day when the dead are resurrected and inner secrets are exposed.\" The co-occurrence of y-w-m with kh-b-r in only 5 ayahs (100:11, 6:73, 25:59, 35:14, 99:4) creates a tight cluster linking temporal markers with divine inner-knowledge — suggesting that khibra (expert awareness) has a temporal dimension: it manifests or becomes apparent at specific moments. Notably, 99:4 is from Surah al-Zalzala (the Earthquake), thematically adjacent to al-ʿĀdiyāt — both concern the Day when hidden things are revealed.", "criticalTr": "yawmaʾidhin tenvîni Arap dilbilgisinin en çok tartışılan olgularından birini içeren bileşik zamansal ifadedir. idhin üzerindeki nunlama (idh + tenvîn → idhin) bütün bir cümlenin yerine geçer — 100:9-10'un olayları: \"kabirlerdekiler altüst edildiğinde (buʿsire) ve göğüslerdeki elde edildiğinde (ḥuṣṣile).\" Bu tenvînu'l-ıvaz (telafi edici nunlama) bütün bir eskatolojik anlatıyı tek bir morfeme sıkıştırır. Sözcük böylece devasa anlamsal ağırlık taşır: sadece \"o gün\" demez, örtük olarak \"ölülerin diriltildiği ve iç sırların açığa çıkarıldığı gün\"ü içerir. y-w-m ile kh-b-r birlikteliğinin yalnızca 5 ayette (100:11, 6:73, 25:59, 35:14, 99:4) görülmesi, zamansal işaretleri ilahi iç bilgiyle bağlayan sıkı bir küme yaratır — hıbrenin (uzman farkındalığın) zamansal bir boyutu olduğunu, belirli anlarda tezahür ettiğini veya belirgin hale geldiğini gösterir. Özellikle 99:4 Sûretu'z-Zelzele'dendir ve tematik olarak el-Âdiyât'a komşudur — her ikisi de gizli şeylerin açığa çıkarıldığı Gün ile ilgilidir.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 5, "arabic": "لَّخَبِيرٌۢ", "translit": "la-khabīrun", "gloss": "surely All-Aware; surely one who possesses inner knowledge; surely the Expert Knower", "glossTr": "kesinlikle Her Şeyden Haberdâr; kesinlikle iç bilgiye sahip olan; kesinlikle Uzman Bilen", "userNotes": "", "root": "خ ب ر (kh-b-r)", "grammar": "Adjective, intensive form (ṣīghat al-mubālagha), pattern fa'īl (فَعِيل), masculine singular, nominative (marfūʿ) as khabar inna (predicate of inna). Prefixed with lām al-ibtidāʾ (emphatic lām) — a lām that enters upon the khabar of inna to intensify the emphasis already established by inna. This double emphasis (inna ... la-) is a distinctly Quranic rhetorical structure.", "grammarTr": "Sıfat, mübalağa sîgası, fa'īl (فَعِيل) kalıbı, eril tekil, inna'nın haberi olarak merfû. Önünde lâmu'l-ibtidâ (vurgu lâmı) vardır — inna'nın haberine girerek inna'nın kurduğu vurguyu pekiştiren lâm. Bu çifte vurgu (inne ... le-) belirgin bir Kur'anî belagat yapısıdır.", "semantics": ["Root kh-b-r (خ ب ر): to know by experience, to test, to try, to probe; to be aware of inner realities", "فَعَلَ (khabara, I): to know, to be aware of, to have information about; to test, try, prove by experience; to probe the nature of soil (khabara al-arḍ = he tested the earth to know what it contains)", "فَعَّلَ (khabbara, II): to inform, to tell, to notify; to communicate news", "أَفْعَلَ (akhbara, IV): to inform, to report, to give news; to make known", "VIII (ikhtabara): to test, to examine, to put to trial; to gain experience of", "X (istakhbara): to inquire, to seek information, to investigate", "Noun khabar (pl. akhbār): news, information, report, tidings; a narrative, an account; in grammar: the predicate of a sentence (the \"news\" the sentence delivers)", "Noun khibra: experience, expertise, practical knowledge gained through testing; expert skill", "Noun khubr: knowledge of the inner nature of things (Lane's: \"the knowing of the internal, intrinsic, or real states, conditions, circumstances, or properties of things\")", "Adjective khabīr: fully aware, thoroughly informed, one who possesses deep experiential knowledge; divine attribute — God as the one who knows inner realities that are hidden from surface observation", "Lane's Lexicon: khabīr = \"one possessing خُبْر (khubr), which is knowledge of the internal, hidden qualities of things.\" Distinguished from ʿalīm (general knowledge) by its emphasis on INNER, TESTED, EXPERIENTIAL knowledge. khabara al-arḍ = \"he ploughed the earth\" (penetrating its surface to know what lies beneath). The root fundamentally denotes knowledge through penetration, not observation.", "Lisan al-Arab: al-khabīr min asmāʾ Allāh = \"the Khabīr is among God's names — He who knows the hidden realities (bawāṭin) of things and their concealed aspects (khafāyā).\" Also: mukhbir = one who reports, informant. The root connects knowing and telling — one who truly knows can truly inform.", "Hans Wehr: khabīr = experienced, expert, knowledgeable; khabara = to know by experience, to be informed; khibra = experience, expertise", "Classical meaning not in Quranic usage: khabbāra = a large blister, a swelling (the surface puffing up to reveal what is beneath) — the physical metaphor of inner content breaking through the surface, parallel to the root's abstract meaning of inner knowledge penetrating outward", "Modern: khabīr as \"expert, specialist, consultant\" — one who possesses tested professional knowledge; forensic analyst who penetrates evidence to its inner truth", "Futuristic: khabīr as deep learning model — an intelligence that processes not surface data but underlying patterns, penetrating layers of information to extract hidden structure; diagnostic AI that knows internal states from external signals", "Core concept: knowledge that penetrates beneath surfaces — not observation but probing, testing, and experiencing the inner reality of things"], "semanticsTr": ["Kök kh-b-r (خ ب ر): deneyimle bilmek, sınamak, denemek, araştırmak; iç gerçekliklerin farkında olmak", "فَعَلَ (habere, I. bab): bilmek, haberdar olmak; sınamak, deneyle kanıtlamak; toprağın doğasını yoklamak (haberel-ard = ne içerdiğini bilmek için toprağı yokladı)", "فَعَّلَ (habbere, II. bab): haber vermek, bildirmek, bilgilendirmek", "أَفْعَلَ (ahbere, IV. bab): haber vermek, rapor etmek, duyurmak", "VIII. bab (ihtebere): sınamak, incelemek, denemeye tabi tutmak; tecrübe edinmek", "X. bab (istahbere): soruşturmak, bilgi aramak, araştırmak", "İsim haber (ç. ahbâr): haber, bilgi, rapor; anlatı, rivayet; dilbilgisinde: cümlenin yüklemi (cümlenin ilettiği \"haber\")", "İsim hıbre: deneyim, uzmanlık, sınama yoluyla kazanılan pratik bilgi", "İsim hubr: şeylerin iç doğasının bilgisi (Lane's: \"şeylerin içsel, özsel veya gerçek durumlarının, koşullarının veya özelliklerinin bilinmesi\")", "Sıfat habîr: tam haberdar, derinlemesine bilgili, derin deneyimsel bilgiye sahip; ilahi sıfat — gizli iç gerçeklikleri bilen Tanrı", "Lane's Lexicon: habîr = \"hubr sahibi, ki bu şeylerin içsel, gizli niteliklerinin bilgisidir.\" Alîm'den (genel bilgi) İÇSEL, SINANMIŞ, DENEYİMSEL bilgi vurgusuyla ayrılır. haberel-ard = \"toprağı sürdü\" (altında ne olduğunu bilmek için yüzeyine nüfuz etti). Kök temelde gözlem değil, nüfuz yoluyla bilgiyi ifade eder.", "Lisan al-Arab: el-habîr min esmâillâh = \"Habîr Allah'ın isimlerinden biridir — şeylerin gizli gerçekliklerini (bevâtın) ve örtülü yönlerini (hafâyâ) bilendir.\" Ayrıca: muhbir = haber veren, muhbir. Kök bilmeyi ve söylemeyi birbirine bağlar — gerçekten bilen gerçekten bildirebilir.", "Hans Wehr: habîr = deneyimli, uzman, bilgili; habere = deneyimle bilmek, haberdar olmak; hıbre = deneyim, uzmanlık", "Kur'an kullanımında olmayan klasik anlam: habbâre = büyük su kabarcığı, şişkinlik (altındakini açığa çıkarmak için yüzeyin kabarması) — iç içeriğin yüzeyi kırıp dışarı çıkmasının fiziksel metaforu, kökün soyut iç bilgi anlamıyla paralel", "Modern: habîr \"uzman, mütehassıs, danışman\" olarak — sınanmış mesleki bilgiye sahip olan; kanıtı iç gerçeğine kadar nüfuz eden adli analist", "Geleceksel: habîr derin öğrenme modeli olarak — yüzey verisini değil altta yatan kalıpları işleyen, bilgi katmanlarına nüfuz ederek gizli yapıyı çıkaran zeka; dış sinyallerden iç durumları bilen teşhis yapay zekası", "Kök kavram: yüzeylerin altına nüfuz eden bilgi — gözlem değil, şeylerin iç gerçekliğini yoklama, sınama ve deneyimleme"], "occurrences": {"type": "grouped", "groups": [{"label": "A. khabīr as intensive adjective (ADJ_INTENS) in inna-predicate — emphatic declarations of divine inner-knowledge", "count": "~2 ayahs", "examples": [{"ref": "35:31", "arabic": "وَٱلَّذِىٓ أَوْحَيْنَآ إِلَيْكَ مِنَ ٱلْكِتَٰبِ هُوَ ٱلْحَقُّ مُصَدِّقًۭا لِّمَا بَيْنَ يَدَيْهِ ۗ إِنَّ ٱللَّهَ بِعِبَادِهِۦ لَخَبِيرٌۢ بَصِيرٌۭ", "english": "And that which We revealed to you of the Scripture — it is the truth, confirming what preceded it. inna llāha bi-ʿibādihi la-khabīrun baṣīrun (Indeed God, concerning His servants, is surely khabīr [All-Aware], baṣīr [All-Seeing]).", "turkish": "Sana Kitap'tan vahyettiğimiz haktır, öncekini doğrulayandır. İnne'llâhe bi-ʿibâdihi le-habîrun basîr (Gerçekten Allah, kulları hakkında, kesinlikle habîr [Her Şeyden Haberdâr], basîr [Her Şeyi Gören]'dir)."}]}, {"label": "B. khabīr as qualitative adjective (ADJ_QUALIT) — describing God's attribute in various syntactic positions", "count": "~43 ayahs", "examples": [{"ref": "6:73", "arabic": "وَهُوَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۖ وَيَوْمَ يَقُولُ كُن فَيَكُونُ ۚ قَوْلُهُ ٱلْحَقُّ ۚ وَلَهُ ٱلْمُلْكُ يَوْمَ يُنفَخُ فِى ٱلصُّورِ ۚ عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ ۚ وَهُوَ ٱلْحَكِيمُ ٱلْخَبِيرُ", "english": "And He it is who created the heavens and the earth in truth... Knower of the unseen and the witnessed. And He is al-ḥakīmu l-khabīru (the Wise, the All-Aware).", "turkish": "Gökleri ve yeri hak ile yaratan O'dur... Gaybı ve aşikârı bilendir. Ve O el-Hakîmu'l-Habîr (Hikmet sahibi, Her Şeyden Haberdâr) olandır."}, {"ref": "25:59", "arabic": "ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَمَا بَيْنَهُمَا فِى سِتَّةِ أَيَّامٍۢ ثُمَّ ٱسْتَوَىٰ عَلَى ٱلْعَرْشِ ۚ ٱلرَّحْمَٰنُ فَسْـَٔلْ بِهِۦ خَبِيرًۭا", "english": "The one who created the heavens and the earth and what is between them in six periods, then established Himself over the Throne — the All-Merciful. So ask about Him one khabīran (one who is expert/aware).", "turkish": "Gökleri ve yeri ve aralarındakileri altı devirde yaratan, sonra Arş'a istiva eden — Rahmân. O'nu bir habîr'e (uzmana/haberdâra) sor."}, {"ref": "11:111", "arabic": "وَإِنَّ كُلًّۭا لَّمَّا لَيُوَفِّيَنَّهُمْ رَبُّكَ أَعْمَٰلَهُمْ ۚ إِنَّهُۥ بِمَا يَعْمَلُونَ خَبِيرٌۭ", "english": "And indeed, your Lord will fully repay each their deeds. innahū bi-mā yaʿmalūna khabīrun (Indeed He, concerning what they do, is khabīr [All-Aware]).", "turkish": "Ve gerçekten Rabbin onlara amellerinin karşılığını tam verecektir. İnnehû bi-mâ ya'melûne habîr (Gerçekten O, yaptıkları hakkında habîr [Her Şeyden Haberdâr]'dır)."}]}, {"label": "C. khabar/akhbār as noun — news, information, report", "count": "~5 ayahs", "examples": [{"ref": "99:4", "arabic": "يَوْمَئِذٍۢ تُحَدِّثُ أَخْبَارَهَا", "english": "yawmaʾidhin (On that Day) it shall report its akhbārahā (its news/information).", "turkish": "yawmaʾidhin (O gün) ahbârını (haberlerini) anlatacaktır."}]}]}, "qiraat": [{"arabic": "خَبِيرٌ", "translit": "khabīrun", "status": "shawādhdh", "type": "ḥf", "note": "The variant removes the lām al-ibtidāʾ prefix (la-), reducing the emphasis from double (inna ... la-) to single (inna ... khabīrun). The lām in the standard reading creates a grammatical crescendo — inna opens with emphasis, la- closes with emphasis, creating an emphatic envelope. Without the lām, the statement remains emphatic (inna alone suffices) but loses the rhetorical closure. This variant is shawādhdh (anomalous) and not in the standard Hafs text.", "noteTr": "Varyant lâmu'l-ibtidâ önekini (le-) kaldırır, vurguyu çifte (inne ... le-) den tekle (inne ... habîrun) düşürür. Standart okumadaki lâm dilbilgisel bir kreşendo yaratır — inne vurguyla açılır, le- vurguyla kapanır ve vurgulu bir zarf oluşturur. Lâm olmadan ifade vurgulu kalır (inne tek başına yeter) ama belagat kapanışını kaybeder. Bu varyant şâz (anormal) olup standart Hafs metninde yoktur.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "5", "refs": "100:11;17:17;17:30;11:111;33:2", "note": "Inner-knowledge paired with Lord/Sustainer — divine expertise inseparable from the nurturing relationship ← IN THIS AYAH", "noteTr": "İç bilgi Rab/Besleyici ile eşleşmiş — ilahi uzmanlık yetiştirme ilişkisinden ayrılmaz ← BU AYETTE"}, {"coRoot": "y-w-m", "coRootAr": "ي و م", "count": "5", "refs": "100:11;6:73;25:59;35:14;99:4", "note": "Inner-knowledge paired with day/time — khibra manifests at appointed temporal markers, especially eschatological ones ← IN THIS AYAH", "noteTr": "İç bilgi gün/zaman ile eşleşmiş — hıbre belirlenen zamansal işaretlerde, özellikle eskatolojik olanlarda tezahür eder ← BU AYETTE"}], "critical": "khabīr as a divine name carries a fundamentally different weight than ʿalīm (All-Knowing). While ʿalīm denotes comprehensive, universal knowledge (ʿilm), khabīr denotes knowledge gained through penetration, testing, and experience (khibra/khubr). Lane's explicitly distinguishes: khubr is knowledge of the INTERNAL, HIDDEN qualities. The classical sense of khabara al-arḍ (\"he ploughed the earth\") provides the physical metaphor: to know deeply is to break the surface and reach what lies beneath. Applied to God, this means divine knowledge is not distant observation but intimate penetration into the inner reality (bāṭin) of things. The pairing in 35:31 of khabīr with baṣīr (All-Seeing) and in 6:73 with ḥakīm (All-Wise) shows khabīr functioning within a cluster of divine attributes that together cover inner knowledge (khabīr), outer perception (baṣīr), and judicial wisdom (ḥakīm). The fa'īl pattern (فَعِيل) for khabīr indicates an enduring, inherent quality — not a temporary state but a permanent attribute. The lām al-ibtidāʾ prefix (la-) is restricted in Arabic grammar to the khabar of inna (or its equivalents), making la-khabīrun a grammatically marked assertion — the language has no stronger way to emphasize a nominal predicate. The classical meaning of khabbāra (large blister — inner content breaking through the surface) provides a physical metaphor for the root's entire semantic range: what is hidden WILL surface, and the Khabīr is the one who already knows what will emerge.", "criticalTr": "habîr ilahi isim olarak alîm'den (Her Şeyi Bilen) temelden farklı ağırlık taşır. alîm kapsamlı, evrensel bilgiyi (ilm) ifade ederken, habîr nüfuz, sınama ve deneyim yoluyla kazanılan bilgiyi (hıbre/hubr) ifade eder. Lane's açıkça ayırır: hubr İÇSEL, GİZLİ niteliklerin bilgisidir. haberel-ard'ın (toprağı sürdü) klasik anlamı fiziksel metaforu sağlar: derinden bilmek yüzeyi kırıp altındakine ulaşmaktır. Tanrı'ya uygulandığında bu, ilahi bilginin uzaktan gözlem değil şeylerin iç gerçekliğine (bâtın) yakın nüfuz olduğu anlamına gelir. 35:31'de habîr'in basîr (Her Şeyi Gören) ile ve 6:73'te hakîm (Hikmet Sahibi) ile eşleşmesi, habîr'in birlikte iç bilgiyi (habîr), dış algıyı (basîr) ve hükmi hikmeti (hakîm) kapsayan ilahi sıfat kümesi içinde işlev gördüğünü gösterir. fa'īl kalıbı habîr için kalıcı, özsel bir nitelik belirtir — geçici durum değil sürekli sıfat. Lâmu'l-ibtidâ (le-) Arap dilbilgisinde inna'nın haberine (veya eşdeğerlerine) özgüdür ve le-habîrun'u dilbilgisel olarak işaretli bir iddia yapar — dil, bir isim yüklemini vurgulamanın bundan daha güçlü bir yoluna sahip değildir. habbâre'nın (büyük su kabarcığı — iç içeriğin yüzeyi kırması) klasik anlamı kökün tüm anlam alanı için fiziksel bir metafor sağlar: gizli olan YÜZEYE ÇIKACAKTIR ve Habîr zaten neyin ortaya çıkacağını bilendir.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran choose khabīr (experiential, penetrating knowledge) rather than ʿalīm (comprehensive knowledge) as the climactic attribute in this surah about human ingratitude?", "The inna/anna variant transforms 100:11 from an independent assertion to a d
