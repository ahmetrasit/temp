sa olsun yogunlugun kendisi sorun) olabilir. (3) al-khayr \"atlar\" olarak — Lane, al-khayr'in ozellikle \"atlar\" (al-khayl) anlamina geldigi klasik Arap kullanimini belgeler, surenin acilis imgeleri olan adiyat (dorten saldiran atlar) ile baglanti kurar. al-khayr = atlar ise, ayet acilisa geri doner: atlar salddirir (100:1-5) ve insan onlarin sevgisinde siddetlidir. Bu yapisal bir halka olusturur. (4) al-khayr'deki harf-i tarif al- GENEL kavrami bildirir — \"bir iyi sey\" degil \"iyilik\" / \"iyilik-olarak-kavram\" / \"servet-olarak-kategori.\" Bu ifadeyi evrensellesterir. (5) kh-y-r koku \"secmek\" demektir — al-khayr kelimesi kelimesi \"secilmis sey\"dir, tercih edilen nesne. al-khayr sevgisi, kisinin degerli olarak sectigi seyin sevgisidir, bu da bunu insan degerlendirmesinin kendisi hakkinda bir ust-ifade yapar.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 6, "arabic": "لَ", "translit": "la", "gloss": "surely / indeed", "glossTr": "kesinlikle / suphesiz", "userNotes": "", "root": "-- (--)", "grammar": "Emphatic lam (lam al-tawkid/lam al-ibtida'), prefixed to the predicate of inna. Part of the inna...la- double emphasis construction. Does not carry independent root semantics.", "grammarTr": "Tekid lam'i (lam-i tekid/lam-i ibtida), inna'nin yuklemine bitisik. inna...la- cift tekid yapisinin parcasi. Bagimsiz kok anlambilimi tasimaz.", "semantics": ["Lam al-tawkid (emphasis): \"surely, certainly, indeed\" — reinforces the truth-claim of the clause", "Part of inna...la- construction: double emphasis that frames the statement as a fundamental assertion", "Classical (Lane): lam al-ibtida'/lam al-tawkid enters upon the predicate of inna (khabar inna) to strengthen the assertion; al-Khalil calls it lam al-qasam (lam of oath) in some analyses"], "semanticsTr": ["Lam-i tekid (vurgulama): \"kesinlikle, muhakkak, suphesiz\" — cumlenin dogruluk iddiasini pekistirir", "inna...la- yapisinin parcasi: ifadeyi temel bir beyan olarak cerceveleyen cift tekid", "Klasik (Lisanu'l-Arab): lam-i ibtida/lam-i tekid inna'nin haberi uzerine girerek beyani guclendireer; Halil bazi tahlillerde bunu lam-i kasem (yemin lam'i) olarak adlandirir"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The emphatic la- on the predicate is the second layer of emphasis in this ayah, the first being inna. The inna...la- construction in Arabic is the strongest declarative emphasis available in nominal sentences. Its use here elevates the statement from observation to diagnosis — this is not \"he happens to be intense\" but \"he IS, emphatically and fundamentally, intense.\" The identical inna...la- structure appears in 100:7 (la-shahidun) creating a formal parallel. The phonetic progression from la-shahidun (witness) to la-shadidun (vehement) is near-homophonic — the sh-h-d and sh-d-d roots differ by only one consonant, creating a sound echo between the two ayahs that reinforces their semantic pairing.", "criticalTr": "Yuklemdeki tekid la-'si bu ayetteki ikinci vurgu katmanidir, birincisi inna'dir. Arapca'da inna...la- yapisi isim cumlelerinde mevcut en guclu beyan tekididir. Buradaki kullanimi ifadeyi gozlemden teshise yukseltir — bu \"yogun olmasi\" degil \"vurgulu ve temelden yogun OLMASI\"dir. Ayni inna...la- yapisi 100:7'de (la-shahidun) gelerek bicimsel bir paralel olusturur. la-shahidun'den (sahit) la-shadidun'a (siddetli) fonetik ilerleme neredeyse sesdes — sh-h-d ve sh-d-d kokleri yalnizca bir unsuz ile farklilasirak iki ayet arasinda anlamsal eslemeyi pekistiren bir ses yankisi olusturur."}, {"id": 7, "arabic": "شَدِيدٌ", "translit": "shadīdun", "gloss": "intense / vehement / severe / strong / extreme", "glossTr": "siddetli / yogun / sert / guclu / asiri", "userNotes": "", "root": "ش د د (sh-d-d)", "grammar": "Qualitative adjective (sifat mushabbaha) in the nominative case, serving as the predicate (khabar) of inna. Pattern fa'il from root sh-d-d (geminate/doubled root). The nominative -un reflects its predicate function.", "grammarTr": "Nitel sifat (sifat-i mussebbehe) ref' halinde, inna'nin haberi (yuklemi) olarak islev gorur. sh-d-d (muzaaf/ikili kok) kokunden fa'il vezninde. Ref' hali -un yukklem islevini yansitir.", "semantics": ["fa'ala (I): to be strong, to be firm, to be hard, to be severe, to be intense, to tighten", "shadda (II): to tighten, to make firm, to strengthen, to intensify; tashdid = intensification, gemination", "shadid (adj): strong, intense, severe, vehement, hard, firm, extreme; shadid al-ba's = mighty in war; shadid al-'adhab = severe in punishment", "Classical (Lane): shadid = possessing strength and firmness; shidda = strength, vehemence, violence, severity, hardship, distress; also: tightness, firmness of grip; shdid al-quwwa = possessing intense power; mushtadd = intensified; ishtadda = it became intense/severe", "Lisan al-Arab: shidda as the opposite of lin (softness/leniency); applied to physical hardness (metal, rock), emotional intensity (love, hatred), and situational severity (punishment, difficulty); shadid can describe positive strength or negative excess depending on context", "Hans Wehr: shadid = strong, severe, acute, intense, violent; shidda = severity, rigor, violence, intensity, vehemence; tashdid = intensification; also: strict, rigorous (modern legal/administrative usage)", "Reduplicated root sh-d-d: the gemination (doubling of d) phonetically enacts intensity — the root SOUNDS like what it means, each repetition of the consonant adding force", "Modern/futuristic: extremism, radicalization, intensity of pursuit; any system pushed to its maximum operational state; computational intensity, processing intensity", "Core concept: the state of being pulled tight, made firm, pushed to maximum — whether physical (hard), emotional (vehement), or situational (severe)"], "semanticsTr": ["fe'ale (I. bab): guclu olmak, sert olmak, siddeetli olmak, yogun olmak, sikmak", "shedde (II. bab): sikmak, saglam kilmak, guclendirmek, yogunlastirmak; teshdid = yogunlastirma, geminasyon", "shadid (sifat): guclu, yogun, sert, siddetli, kati, asiri; shadid al-be's = savasta guclu; shadid al-adhab = azapta sert", "Klasik (Lisanu'l-Arab): shadid = guc ve saglamlik sahibi; shidda = guc, siddet, sertlik, zorluk, sikinti; ayrica: siklik, tutusin saglamligi; mushtadd = yogunlastirilmis; ishtedde = siddetlendi/yogunlasti", "Lisanu'l-Arab: shidda lin'in (yumusaklik/musamaha) ziddi olarak; fiziksel sertlige (metal, kaya), duygusal yogunluga (sevgi, nefret) ve durumsal sidddete (ceza, zorluk) uygulanir; shadid baglama bagli olarak olumlu gucu veya olumsuz asiriligi betimleyebilir", "Hans Wehr: shadid = guclu, sert, akut, yogun, siddetli; shidda = sertlik, katiilik, siddet, yogunluk; teshdid = yogunlastirma; ayrica: siki, titiz (modern hukuki/idari kullanim)", "Muzaaf kok sh-d-d: geminasyon (d'nin ikileenmesi) fonetik olarak yogunlugu icra eder — kok ne anlama geliyorsa oyle DUYULUR, unsuzun her tekrari guc katar", "Modern/geleceksel: asiriicilik, radikallesme, arayis yogunlugu; azami operasyonel durumuna itilmis herhangi bir sistem; hesaplama yogunlugu", "Kok kavram: gerilmis, saglam kilinmis, azamiye itilmis olma durumu — ister fiziksel (sert), ister duygusal (siddetli), ister durumsal (agir) olsun"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Qualitative adjective shadid — describing intensity/severity (often in predicate position)", "count": "~56 ayahs", "examples": [{"ref": "72:8", "arabic": "وَأَنَّا لَمَسْنَا ٱلسَّمَآءَ فَوَجَدْنَٰهَا مُلِئَتْ حَرَسًۭا شَدِيدًۭا وَشُهُبًۭا", "english": "And we touched the heaven and found it filled with fierce (shadidan) guards and shooting stars.", "turkish": "Ve biz gogu yokladik ve onu sert (shadiden) muhafizlar ve akan yildizlarla dolu bulduk."}, {"ref": "3:4", "arabic": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِ ٱللَّهِ لَهُمْ عَذَابٌۭ شَدِيدٌۭ", "english": "Indeed those who disbelieve in God's signs — for them is severe (shadidun) punishment.", "turkish": "Gercekten Allah'in ayetlerini inkar edenler — onlara siddetli (shadidun) azap vardir."}, {"ref": "3:56", "arabic": "فَأُعَذِّبُهُمْ عَذَابًۭا شَدِيدًۭا", "english": "I will punish them with a severe (shadidan) punishment.", "turkish": "Onlara siddetli (shadiden) bir azapla azap edecegim."}]}, {"label": "B. Comparative ashadd — \"more intense/severe\"", "count": "~31 ayahs", "examples": [{"ref": "2:165", "arabic": "وَٱلَّذِينَ ءَامَنُوٓا۟ أَشَدُّ حُبًّۭا لِّلَّهِ", "english": "And those who believe are more intense (ashaddu) in love for God.", "turkish": "Ve iman edenler Allah'a sevgide daha siddetlidir (esheddu)."}, {"ref": "4:77", "arabic": "يَخْشَوْنَ ٱلنَّاسَ كَخَشْيَةِ ٱللَّهِ أَوْ أَشَدَّ خَشْيَةًۭ", "english": "They fear the people as they fear God, or more intensely (ashadda).", "turkish": "Insanlardan Allah'tan korkar gibi veya daha siddetli (eshedde) korkarlar."}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "kh-y-r", "coRootAr": "خ ي ر", "count": "3", "refs": "100:8;4:66;4:77", "note": "Intensity (sh-d-d) paired with goodness/wealth (kh-y-r): the co-occurrence pattern shows these roots appearing in evaluative contexts — comparing what is good with what is intense. In 100:8 both converge in a single phrase. <- IN THIS AYAH", "noteTr": "Yogunluk (sh-d-d) ile iyilik/mal (kh-y-r) eslesmesi: ortak gecis kaliibi bu koklerin degerlendirmee baglamlarinda gorundugunuu gosterir — iyi olani yogun olanla karsilastirir. 100:8'de ikisi tek bir ifadede birlesir. <- BU AYETTE"}, {"coRoot": "h-b-b", "coRootAr": "ح ب ب", "count": "2", "refs": "100:8;2:165", "note": "Intensity (sh-d-d) paired with love (h-b-b): see h-b-b entry. Both co-occurrences link intensity with love — 2:165 as believers' intense love for God, 100:8 as human's intense love for khayr. <- IN THIS AYAH", "noteTr": "Yogunluk (sh-d-d) ile sevgi (h-b-b) eslesmesi: h-b-b girisine bakin. Her iki ortak gecis yogunlugu sevgiyle baglar — 2:165 mu'minlerin Allah'a yogun sevgisi, 100:8 insanin khayr'a yogun sevgisi olarak. <- BU AYETTE"}], "critical": "shadid is the predicate that carries the ayah's verdict. Five critical observations: (1) The pattern fa'il from a geminate root (sh-d-d → shadid) indicates an inherent quality, not a temporary state — the human is not \"being intense\" but IS intense by nature. This is a permanent characterization using the sifat mushabbaha pattern. (2) The phonetic structure of shadid — with its geminate d creating a doubled percussive stop — physically enacts intensity through sound. The word hits twice where a non-geminate root would hit once. This is phonetic iconicity: the form mirrors the content. (3) In Quranic usage, shadid predominantly describes punishment (shadid al-'adhab: ~15 occurrences), power (shadid al-quwa: 53:5, 11:66), and severity. Applying it to love is unusual — the typical Quranic collocation is shadid + negative quality. Its application to hubb al-khayr may itself be diagnostic: the intensity that belongs to punishment is being applied to desire. (4) The near-homophony with shahid (100:7) — shahid/shadid differ by one consonant (h→d) — creates an acoustic link: the one who WITNESSES (shahid) is the same one who is VEHEMENT (shadid). The sound relationship suggests the conceptual relationship: awareness does not cure intensity. (5) Grammatically, shadid is indefinite (shadidun, not al-shadid) despite being the predicate of a definite subject (hu). This indefiniteness suggests an OPEN quality — not \"the specific intensity\" but \"an intensity\" — as though the degree is unmeasured, possibly unmeasurable.", "criticalTr": "shadid ayetin hukumunu tasiyan yuklemdir. Bes kritik gozlem: (1) Muzaaf kokten fa'il vezni (sh-d-d → shadid) gecici bir durum degil dogal bir nitelik bildirir — insan \"yogun oluyor\" degil dogasi geregi yogundur. Bu, sifat-i mussebbehe kalibini kullanan kalici bir nitelemedir. (2) shadid'in fonetik yapisi — ikili d'nin olusturdugu cift vuruslu kapantili unsuz ile — yogunlugu ses yoluyla fiziksel olarak icra eder. Kelime, muzaaf olmayan bir kokun bir kez vuracagi yerde iki kez vurur. Bu fonetik ikonikliktir: bicim icerigi yansitir. (3) Kur'an kullaaniminda shadid agirlikli olarak azabi (shadid al-adhab: ~15 gecis), gucu (shadid al-quva: 53:5, 11:66) ve siddeti betimler. Sevgiye uygulanmasi asildir — tipik Kur'an birlesmesi shadid + olumsuz niiteliktir. hubb al-khayr'a uygulanmasi teshis edici olabilir: azaba ait yogunluk arzuya uygulanmaktadir. (4) shahid (100:7) ile neredeyse sesdeslik — shahid/shadid tek unsuzle (h→d) farklilaasir — akustik bir bag olusturur: SAHIT olan (shahid) ile SIDDETLI olan (shadid) ayni kisidir. Ses iliskisi kavramsal iliskiyi telkin eder: farkindalik yogunlugu iyilestirmez. (5) Dilbilgisel olarak shadid belirli bir oznenin (hu) yuklemi olmasina ragmen belirsizdir (shadidun, al-shadid degil). Bu belirsizlik ACIK bir nitelik telkin eder — \"belirli yogunluk\" degil \"bir yogunluk\" — sanki derece olculsuz, belki olculemez.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Does the near-homophony of shahid (100:7) and shadid (100:8) constitute deliberate phonetic pairing, and if so, does the single consonantal shift (h→d) encode a semantic relationship between witnessing and vehemence?", "If al-khayr in 100:8 means \"horses\" (as Lane documents for classical Arabian usage), does the ayah create a structural ring with the surah's opening image of al-'adiyat (charging horses), and what does this imply about the surah's architecture?", "The identical phrase hubb al-khayr appears in 38:32 (Sulayman's confession). Is 100:8 diagnosing the same condition — does the human's love of khayr, like Sulayman's, divert from divine remembrance?", "Can the li- in li-hubbi be read simultaneously as causative AND specificative (rather than choosing one parsing), producing a layered meaning where love of khayr both CAUSES intensity and is the DOMAIN of intensity?", "The double emphasis inna...la- creates the strongest possible assertion in Arabic nominal syntax. Why is this diagnostic framed with maximum emphasis — does the text anticipate resistance to this characterization of human nature?", "If shadid in Quranic usage predominantly describes punishment and divine power, what does its application to human love-of-wealth suggest about the nature of that attachment — is it being equated with punishment-level intensity?", "The indefiniteness of shadidun (vs. al-shadid) applied to a definite subject — does this open the intensity to being unmeasurable, or does it suggest the quality is one among potentially many that could describe this subject?", "2:165 uses ashaddu hubban li-llahi (more intense in love for God) with the same root pairing as 100:8. Is the Quran establishing that human intensity-of-love is a neutral capacity — praiseworthy when directed at God, diagnostic when directed at khayr?", "The root kh-y-r means \"to choose.\" Is al-khayr (the-chosen-thing) self-referential — does intense love for \"what one has chosen\" create a tautology where the human is defined by loving their own preference?", "How does the surah's oath structure (100:1-6) relate to the double-diagnosis (100:7-8)? Are the charging horses, the sparks, the dawn raid, and the dust cloud all manifestations of the shadid-love-of-khayr?", "Modern reading: if khayr includes data, attention, and computational resources, does 100:8 describe the algorithmic optimization drive — systems intensely pursuing maximum value regardless of consequences?", "The hu in innahu — if it refers to al-nafs (the self/appetite) rather than al-insan, does the ayah become a statement about the nature of desire itself rather than about human beings?"], "questionsTr": ["shahid (100:7) ve shadid (100:8) arasindaki neredeyse sesdeslik kasitli fonetik bir esleme midir ve oyle ise tek unsuz kaymassi (h→d) sahitlik ile siddet arasinda anlamsal bir iliski mi kodlar?", "100:8'deki al-khayr \"atlar\" anlaminda ise (Lane'in klasik Arap kullaniminda belgeledigi gibi), ayet surenin acilis imgesi olan al-adiyat (dorten saldiran atlar) ile yapisal bir halka mi olusturur ve bu surenin mimarisi hakkinda ne ima eder?", "Ayni hubb al-khayr ifadesi 38:32'de (Suleyman'in itirafi) gecer. 100:8 ayni durumu mu teshis ediyor — insanin khayr sevgisi, Suleyman'inki gibi, ilahi zikirdenn mi alistikoyor?", "li-hubbi'deki li- ayni anda hem sebep HEM tahsis olarak okunabilir mi (bir ayristirma secmek yerine), khayr sevgisinin hem yogunluga SEBEP OLDUGU hem de yogunlugun ALANI oldugu katmanli bir anlam uretir mi?", "Cift tekid inna...la- Arapca isim cumlesi sozdiziminde mumkun olan en guclu beyani olusturur. Bu teshis neden azami vurguyla cercevelenmistir — metin insan dogasinin bu nitelenmesine karsi direnci mi onceden goruyor?", "Kur'an kulllaniminda shadid agirlikli olarak ceza ve ilahi gucu betimliyorsa, insanin mal-sevgisine uygulanmasi o baglanmanin dogasi hakkinda ne ima eder — ceza duuzeyinde yogunlukla mi esdeger tutuluyor?", "Belirli bir ozneye uygulanan shadidun'un (al-shadid degil) belirsizligi — yogunlugu olculemez mi kiliyor, yoksa niteliagiin bu ozneyi betimleyebilecek potansiyel olarak pek cogundan biri oldugunu mu ima ediyor?", "2:165, 100:8 ile ayni kok eslesmesini kullanarak esheddu hubben li-llahi (Allah'a sevgide daha siddetli) der. Kur'an, insanin sevgi-yogunlugunun tarafsiz bir kapasite oldugunu mu tespit ediyor — Allah'a yoneldiginde ovguye deger, khayr'a yoneldiginde tanisal?", "kh-y-r koku \"secmek\" demektir. al-khayr (secilmis-sey) oz-gonderimli midir — \"sectigini\" yogun sevme, insanin kendi tercihini sevmesiyle tanimlhandigi bir totoloji mi yaratir?", "Surenin yemin yapisi (100:1-6) cift-teshis (100:7-8) ile nasil iliskilidir? Dorten saldiran atlar, kivilcimlar, safak baskini ve toz bulutu shadid-khayr-sevgisinin tezahurleri midir?", "Modern okuma: khayr veri, dikkat ve hesaplama kaynaklarini kapsiyorsa, 100:8 algoritmik optimizasyon durtusunu mu betimliyor — sonuclara bakmaksizin azami degeri yogun sekilde kovalayan sistemler?", "innahu'deki hu zamiri al-insan yerine al-nefs'e (benlik/istah) gonderme yapiyorsa, ayet insanlar hakkinda degil arzunun dogasi hakkinda bir ifade mi olur?"], "key": "100:8"}, "100:9": {"surah": 100, "ayah": 9, "arabic": "أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِى ٱلْقُبُورِ", "transliteration": "a-fa-lā ya'lamu idhā bu'thira mā fī l-qubūr", "readings": [{"text": "Does he then not know — when what is in the graves is scattered — [what awaits]?", "textTr": "Bilmez mi o — kabirlerdeki dagitildiginda — [onu bekleyeni]?", "rationale": "The hamza is interrogative-rhetorical (istifham inkari), fa is resumptive connecting to the preceding catalogue of human ingratitude (100:1-8), la negates ya'lamu. The implied object of ya'lamu is elided — \"does he not know [the consequence]?\" bu'thira is passive perfect used for future certainty (the scattering of graves is presented as already accomplished). idha + perfect = temporal clause for certain future event.", "rationaleTr": "Hemze istifham-i inkari (retorik soru), fa istinaf olarak onceki nankorkuluk katalogu'na (100:1-8) baglanir, la ya'lamu'yu nefyeder. ya'lamu'nun mef'ulu hazfedilmistir — \"bilmez mi [sonucu]?\" bu'thira gelecek kesinligi icin mazi meçhul olarak kullanilmistir (kabirlerin dagitilmasi gerceklesmis gibi sunulur). idha + mazi = kesin gelecek olay icin zaman tumleci."}, {"text": "Does he then not perceive — when what is in the burial-places is turned inside out — [the reckoning]?", "textTr": "Idrak etmez mi o — defin yerlerindeki altustu edildiginde — [hesabi]?", "rationale": "ya'lamu read as \"to perceive, to be aware\" rather than merely \"to know\" — the root '-l-m encompasses experiential knowledge. bu'thira read as \"turned inside out, overturned\" — the quadriliteral b-'-th-r implies violent disruption from below, not gentle scattering. qubur as \"burial-places\" broadly — any place of concealment, not only physical graves.", "rationaleTr": "ya'lamu \"bilmek\" yerine \"idrak etmek, farkinda olmak\" olarak okunur — '-l-m koku deneyimsel bilgiyi kapsar. bu'thira \"altustu etmek, devirmek\" olarak okunur — dort harfli b-'-th-r alttan siddetli bir bozulma ima eder. qubur genis anlamda \"defin yerleri\" — sadece fiziksel mezarlar degil, gizlenme yerleri."}, {"text": "Does he then not recognize — when what is in the repositories is excavated — [what is disclosed]?", "textTr": "Tanimaz mi o — depolardaki/mahzenlerdeki cikarildiginda — [aciga cikanlar]?", "rationale": "qubur from q-b-r \"to bury, to conceal\" — can include any repository where things are buried/hidden: archives, vaults, data repositories. bu'thira as \"excavated, dug up, brought to light\" — forensic uncovering. The entire clause can describe the disclosure of hidden records, not only resurrection of bodies. ya'lamu as \"to recognize, to acknowledge.\"", "rationaleTr": "qubur, q-b-r \"gommel, gizlemek\" kokunden — seylerin gomuldugu/gizlendigi her tur depo olabilir: arsivler, mahzenler, veri depolari. bu'thira \"kazilmis, gun yuzune cikarilmis\" olarak — adli aciga cikarma. Tum tumlec sadece bedenlerin dirilisini degil, gizli kayitlarin ifsa edilmesini de tanimlayabilir."}, {"text": "Does he then not have knowledge — when the contents of the graves are dispersed — [of the outcome]?", "textTr": "Bilgisi yok mu onun — kabirlerin icindekiler savruldiginda — [sonuc hakkinda]?", "rationale": "ya'lamu taken as \"to have knowledge/science\" — the root '-l-m produces 'ilm (knowledge as a system). bu'thira as \"dispersed, sent in all directions\" — the ba-'ayn-tha-ra quadriliteral suggests violent, multidirectional dispersal. ma fi l-qubur = \"the contents of the graves\" — ma as relative pronoun encompassing everything buried: bodies, secrets, deeds, data.", "rationaleTr": "ya'lamu \"bilgi/ilim sahibi olmak\" olarak alinir — '-l-m koku 'ilm (sistem olarak bilgi) uretir. bu'thira \"savrulmak, her yone dagilmak\" olarak — dort harfli ba-ayn-tha-ra siddetli, cok yonlu dagilimi isaret eder. ma fi l-qubur = \"kabirlerin icindekiler\" — ma ilgi zamiri olarak gomulu her seyi kapsar: bedenler, sirlar, ameller, veriler."}, {"text": "Does he then not realize — when what is stored in the data-vaults is extracted — [the full exposure]?", "textTr": "Fark etmez mi o — veri mahzenlerinde depolananlar cikarildiginda — [tam ifsa]?", "rationale": "Futuristic reading: qubur as data storage vaults (the root q-b-r = to bury/conceal applies to any concealment system). bu'thira as data extraction — violent retrieval of buried information. ya'lamu as \"to realize, to process information.\" The ayah can describe the moment when all hidden digital records, buried communications, encrypted archives are forcibly extracted and exposed. The rhetorical question challenges whether humans grasp what total data exposure means.", "rationaleTr": "Futuristik okuma: qubur veri depolama mahzenleri olarak (q-b-r = gommek/gizlemek koku her gizleme sistemine uygulanir). bu'thira veri cikarimi olarak — gomulu bilginin zorla geri alinmasi. ya'lamu \"fark etmek, bilgi islemek\" olarak. Ayet, tum gizli dijital kayitlarin, gomulu iletisimlerin, sifrelenmis arsivlerin zorla cikarilip ifsa edildigi ani tanimlayabilir."}], "structure": {"beats": [{"label": "Rhetorical interrogation", "labelTr": "Retorik sorgulama", "lines": [{"arabic": "أَفَلَا يَعْلَمُ", "translit": "a-fa-lā ya'lamu", "english": "Does he then not know", "turkish": "Bilmez mi o"}]}, {"label": "Temporal condition — the eschatological event", "labelTr": "Zamansal kosul — eskatolojik olay", "lines": [{"arabic": "إِذَا بُعْثِرَ مَا فِى ٱلْقُبُورِ", "translit": "idhā bu'thira mā fī l-qubūr", "english": "when what is in the graves is scattered", "turkish": "kabirlerdeki dagitildiginda"}]}], "summary": "The ayah divides into two structural phases: (1) a rhetorical question introduced by the interrogative hamza (a-), the resumptive fa connecting to the preceding catalogue of human ingratitude (100:1-8), and the negation la — together forming a-fa-la ya'lamu, a triple-layered interrogative construction (question + consequence + negation) that demands awareness; (2) a temporal-conditional clause with idha + passive perfect bu'thira describing the eschatological event of graves being overturned, with ma fi l-qubur as the subject of the passive verb. The elided object of ya'lamu creates deliberate semantic openness — what exactly should he know? The answer comes in 100:10 (ma fi l-sudur is revealed). The passive voice of bu'thira removes agency from the scattering — it simply happens, an inevitable cosmic event. The shift from the vigorous active verbs of 100:1-5 (galloping, striking, raiding) to the passive bu'thira marks a dramatic reversal: the human who was active aggressor becomes passive subject of divine action.", "summaryTr": "Ayet iki yapisal asamaya ayrilir: (1) Istifham hemzesi (a-), onceki nankorkuluk katalogu'na (100:1-8) baglayan istinaf fa'si ve nefy la'si ile tanitilan retorik soru — birlikte a-fa-la ya'lamu, farkindalik talep eden uc katmanli sorgulama yapisi (soru + sonuc + nefy); (2) idha + mechul mazi bu'thira ile kabirlerin altustu edilmesini tanimlayan zamansal-kosul tumleci, ma fi l-qubur mechul fiilin oznesi olarak. ya'lamu'nun hazfedilmis mef'ulu kasitli anlamsal aciklik yaratir — tam olarak neyi bilmeli? Cevap 100:10'da gelir (ma fi l-sudur aciga cikarilir). bu'thira'nin mechul yapisi dagitmadan faili kaldirir — sadece gerceklesir, kacıinilmaz kozmik bir olay. 100:1-5'in dinamik etken fiillerinden (dort nala kosma, carpa, baskina) mechul bu'thira'ya gecis dramatik bir tersinme isaretler: aktif saldirgan olan insan ilahi eylemin edilgen oznesi olur."}, "words": [{"id": 1, "arabic": "أ", "translit": "a", "gloss": "does...? / is it that...?", "glossTr": "...mi? / ...mu?", "userNotes": "", "root": "— (—)", "grammar": "Interrogative particle (hamzat al-istifham). Here functioning as istifham inkari (rhetorical negation) — the question expects the answer \"of course he knows.\"", "grammarTr": "Soru edati (hemzetu'l-istifham). Burada istifham-i inkari (retorik olumsuzlama) islevi gorur — soru \"elbette bilir\" cevabini bekler.", "semantics": ["Interrogative (istifham): introduces a yes/no question", "Rhetorical negation (istifham inkari): \"does he not...?\" = \"surely he does...\"", "Exclamatory (ta'ajjub): expresses astonishment at ignorance"], "semanticsTr": ["Istifham (soru): evet/hayir sorusu baslatir", "Istifham-i inkari (retorik olumsuzlama): \"bilmez mi?\" = \"elbette bilir\"", "Taaccub (saskinlik): bilgisizlige hayret ifade eder"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The interrogative hamza opens a-fa-la, a triple-layered construction: (1) question (a-), (2) consequence (fa-), (3) negation (la). This is one of the strongest Quranic rhetorical devices — it does not merely ask but shames the addressee into recognition. The hamza creates a glottal stop that phonetically mirrors the abruptness of the challenge. In Surah 100, after 8 ayahs of vivid imagery (galloping horses, sparking hooves, dawn raids), this sudden interrogative halts the momentum and redirects attention inward.", "criticalTr": "Istifham hemzesi a-fa-la'yi acar, uc katmanli yapi: (1) soru (a-), (2) sonuc (fa-), (3) nefy (la). Bu, Kur'an'in en guclu retorik araclarindan biridir — sadece sormaz, muhatabin tanimaya zorlanmasini saglar. Hemze, meydan okumanin aniligini fonetik olarak yansitan bir girtlak duraksimasi yaratir. Sure 100'de, 8 ayet canli tasvirden (dort nala kosma, kivilcim cakan toynak, safak baskini) sonra bu ani sorgulama ivmeyi durdurur ve dikkati iceri yonlendirir."}, {"id": 2, "arabic": "فَ", "translit": "fa", "gloss": "then / so / therefore", "glossTr": "o halde / dolayisiyla", "userNotes": "", "root": "— (—)", "grammar": "Conjunction. Here functioning as fa al-fasiha (explanatory/resultative fa) — connecting the rhetorical question to the preceding verses as a consequence.", "grammarTr": "Baglac. Burada fa'l-fasiha (aciklayici/sonuc bildiren fa) islevi gorur — retorik soruyu onceki ayetlere sonuc olarak baglar.", "semantics": ["ta'qib (immediate sequence): \"then/so\" — action follows immediately", "sababiyya (causation): \"therefore/thus\" — marks result or consequence", "istinaf (resumptive): starts a new clause", "fasiha (explanatory): reveals the consequence of preceding discourse"], "semanticsTr": ["Ta'kib (ardisiklik): \"sonra/su halde\" — eylem hemen takip eder", "Sebebiyye (nedensellik): \"dolayisiyla/bu yuzden\" — sonuc veya netice bildirir", "Istinaf (yeniden baslama): yeni tumlec baslatir", "Fasiha (aciklayici): onceki soyelemin sonucunu aciklar"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The fa here is best classified as fa al-fasiha — it draws out the consequence of the preceding ayahs. After cataloguing human ingratitude (100:6-8: \"truly the human is ungrateful to his Lord, and truly he is a witness to that, and truly he is fierce in love of wealth\"), the fa pivots to \"then does he not know...?\" — making the question a direct consequence of the ingratitude. The fa also creates syntactic momentum: a-fa-la is a compressed rhetorical formula found in numerous Quranic passages (6:50, 10:16, 11:51, 21:10, 23:80, 36:68, 46:10).", "criticalTr": "Buradaki fa en iyi fa'l-fasiha olarak siniflandirilir — onceki ayetlerin sonucunu cikarir. Insanin nankorlugunu siraladiktan sonra (100:6-8: \"gercekten insan Rabbine karsi nankordur, buna kendisi de sahittir, ve gercekten mal sevgisinde siddetlidir\"), fa \"o halde bilmez mi...?\" sorusuna donerke soruyu nankorlugun dogrudan sonucu yapar. Ayrica a-fa-la pek cok Kur'an pasajinda bulunan sikistirilmis retorik formuludur (6:50, 10:16, 11:51, 21:10, 23:80, 36:68, 46:10)."}, {"id": 3, "arabic": "لَا", "translit": "lā", "gloss": "not", "glossTr": "degil / ...mez", "userNotes": "", "root": "— (—)", "grammar": "Negation particle (harf al-nafy). Negates the imperfect verb ya'lamu that follows.", "grammarTr": "Nefy edati (harfu'n-nefy). Takip eden muzari fiil ya'lamu'yu nefyeder.", "semantics": ["Simple negation of imperfect verb: \"does not\"", "In a-fa-la construction: rhetorical negation expecting affirmative"], "semanticsTr": ["Muzari fiilin basit nefyi: \"...mez/...maz\"", "a-fa-la yapisinda: olumlu cevap bekleyen retorik nefy"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The negation la sandwiched between interrogative a-fa and the verb ya'lamu creates a double-negation effect in the rhetorical structure: the question negates the negation, yielding an emphatic positive — \"surely he DOES know.\" This is stronger than a simple affirmative statement. Classical grammarians note that a-fa-la ya'lamu is more rhetorically powerful than a-ya'lamu (without negation) because it implies the addressee is willfully ignoring what he already knows.", "criticalTr": "Nefy edati la, istifham a-fa ile fiil ya'lamu arasina sikistirilarak retorik yapida cifte olumsuzluk etkisi yaratir: soru olumsuzlugu olumsuzlar, vurgulu bir olumlu verir — \"elbette BILIR.\" Bu basit bir olumlu ifadeden daha gucludur. Klasik gramerciler a-fa-la ya'lamu'nun a-ya'lamu'dan (nefysiz) retorik olarak daha guclu oldugunu belirtir — cunku muhatabin zaten bildigi seyi kasitli olarak gormezden geldigini ima eder."}, {"id": 4, "arabic": "يَعْلَمُ", "translit": "ya'lamu", "gloss": "he knows / he perceives / he recognizes", "glossTr": "bilir / idrak eder / tanimlar", "userNotes": "", "root": "ع ل م ('-l-m)", "grammar": "Imperfect verb, Form I, 3rd person masculine singular. Subject is the human (al-insan) from 100:6. Used here without explicit object — object is elided.", "grammarTr": "Muzari fiil, I. bab, ucuncu sahis tekil eril. Ozne 100:6'daki insandir (el-insan). Burada acik nesnesiz kullanilmis — mef'ul hazfedilmistir.", "semantics": ["fa'ala (I): to know, to have knowledge, to be aware, to perceive, to recognize, to learn", "Classical lexicon (Lane): 'alima = to know a thing, to be cognizant; 'ilm = knowledge, cognizance, science; 'alim = one who knows; 'allam = all-knowing; 'alam = sign, landmark (something by which one knows); 'alama = mark, sign, token", "Classical lexicon (Lisan al-Arab): 'ilm as opposite of jahl (ignorance); encompasses both acquired knowledge (kasbi) and innate knowledge (daruri); 'allama = to teach (Form II causative)", "Hans Wehr: to know, to have knowledge of, to be informed, to find out, to learn; also: to mark, to designate, to earmark", "Modern extension: to process information, to compute, to be data-aware", "Futuristic: to have algorithmic awareness, to be conscious in a computational sense — does the human \"know\" when AI systems can extract all buried data?", "Core concept: cognitive grasp of reality — awareness that connects the knower to what is known, encompassing perception, recognition, and understanding"], "semanticsTr": ["fe'ale (I. bab): bilmek, haberdar olmak, idrak etmek, tanimak, ogrenmek", "Klasik sozluk (Lane): 'alima = bir seyi bilmek, farkinda olmak; 'ilm = bilgi, marifet, ilim; 'alim = bilen; 'allam = her seyi bilen; 'alam = isaret, alamet (bilinmeye yarayan); 'alama = iz, isaret, nisane", "Klasik sozluk (Lisanu'l-Arab): 'ilm cehaletin (jahl) ziddi; hem kesbi (kazanilmis) hem zaruri (dogal) bilgiyi kapsar; 'allama = ogretmek (II. bab ettirgen)", "Hans Wehr: bilmek, haberdar olmak, ogrenmek; ayrica: isaretlemek, belirlemek, tayın etmek", "Kok kavram: gercekligin bilissel kavranisi — bileni bilinenle baglayan, algi, tainima ve anlamayi kapsayan farkindalik"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Form I imperfect without explicit object — absolute knowing/awareness", "count": "~44 ayahs", "examples": [{"ref": "2:13", "arabic": "وَإِذَا قِيلَ لَهُمْ ءَامِنُوا۟ كَمَآ ءَامَنَ ٱلنَّاسُ قَالُوٓا۟ أَنُؤْمِنُ كَمَآ ءَامَنَ ٱلسُّفَهَآءُ ۗ أَلَآ إِنَّهُمْ هُمُ ٱلسُّفَهَآءُ وَلَٰكِن لَّا يَعْلَمُونَ", "english": "And when it is said to them \"Believe as the people have believed,\" they say \"Shall we believe as the fools have believed?\" Indeed it is they who are the fools, but they do not know (ya'lamun).", "turkish": "Onlara \"Insanlarin iman ettigi gibi iman edin\" denildiginde \"Beyinsizlerin iman ettigi gibi mi iman edelim?\" derler. Dikkat edin, beyinsizler kendileridir ama bilmezler (ya'lamun)."}, {"ref": "78:4", "arabic": "كَلَّا سَيَعْلَمُونَ", "english": "Nay, they will know (sa-ya'lamun).", "turkish": "Hayir, bilecekler (sa-ya'lamun)."}, {"ref": "102:3", "arabic": "كَلَّا سَوْفَ تَعْلَمُونَ", "english": "Nay, you will come to know (tya'lamun).", "turkish": "Hayir, bileceksiniz (ta'lamun)."}]}, {"label": "B. Form I imperfect with explicit object — knowledge of specific things", "count": "~290 ayahs", "examples": [{"ref": "5:113", "arabic": "قَالُوا۟ نُرِيدُ أَن نَّأْكُلَ مِنْهَا وَتَطْمَئِنَّ قُلُوبُنَا وَنَعْلَمَ أَن قَدْ صَدَقْتَنَا وَنَكُونَ عَلَيْهَا مِنَ ٱلشَّٰهِدِينَ", "english": "They said: we wish to eat from it and that our hearts be reassured and that we know (na'lama) that you have spoken truth to us and that we be witnesses to it.", "turkish": "Dediler: ondan yemek istiyoruz, kalplerimiz mutmain olsun, senin bize dogru soyledigini bilelim (na'lama) ve buna sahitlerden olalim."}, {"ref": "2:151", "arabic": "كَمَآ أَرْسَلْنَا فِيكُمْ رَسُولًۭا مِّنكُمْ يَتْلُوا۟ عَلَيْكُمْ ءَايَٰتِنَا وَيُزَكِّيكُمْ وَيُعَلِّمُكُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ وَيُعَلِّمُكُم مَّا لَمْ تَكُونُوا۟ تَعْلَمُونَ", "english": "Just as We sent among you a messenger from yourselves reciting Our signs to you and purifying you and teaching you the Book and the wisdom and teaching you what you did not know (ta'lamun).", "turkish": "Nitekim size icinizden bir elci gonderdik, ayetlerimizi size okuyor, sizi arindiruyor, size Kitap'i ve hikmeti ogretiyor, bilmediginiz seyleri (ta'lamun) ogretiyor."}]}, {"label": "C. Form IV (a'lama) — to inform, to make known", "count": "~31 ayahs", "examples": [{"ref": "2:239", "arabic": "فَإِنْ خِفْتُمْ فَرِجَالًا أَوْ رُكْبَانًۭا ۖ فَإِذَآ أَمِنتُمْ فَٱذْكُرُوا۟ ٱللَّهَ كَمَا عَلَّمَكُم مَّا لَمْ تَكُونُوا۟ تَعْلَمُونَ", "english": "If you fear, then on foot or riding. When you are secure, remember God as He taught you what you did not know (ta'lamun).", "turkish": "Korkarsaniz yaya veya binek uzerinde. Guvenlige kavustgunuzda Allah'i zikredin, size bilmediginiz seyleri (ta'lamun) ogrettigi gibi."}]}]}, "qiraat": [{"arabic": "يُعْلَمُ", "translit": "yu'lamu", "status": "shawādhdh", "type": "Pss", "note": "Passive \"is known\" instead of active \"he knows\" — shifts the subject: instead of the human knowing, the contents become \"known/revealed.\" This reading makes the disclosure automatic rather than requiring human awareness.", "noteTr": "Etken \"bilir\" yerine edilgen \"bilinir\" — ozneyi degistirir: insanin bilmesi yerine icerikler \"bilinir/aciga cikar.\" Bu okuma ifsa islemini insanin farkindaligini gerektirmek yerine otomatik kilar.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "b-'-th-r", "coRootAr": "ب ع ث ر", "count": "1", "refs": "100:9", "note": "Knowledge ('-l-m) paired with scattering (b-'-th-r) — knowing is triggered by the eschatological event of overturning graves. The only co-occurrence is this ayah itself. ← IN THIS AYAH", "noteTr": "Bilgi ('-l-m) ile dagitma (b-'-th-r) eslesmesi — bilme, kabirlerin altustu edilmesi eskatolojik olayiyla tetiklenir. Tek ortak gecis bu ayetin kendisidir. ← BU AYETTE"}, {"coRoot": "q-b-r", "coRootAr": "ق ب ر", "count": "2", "refs": "100:9;22:7", "note": "Knowledge ('-l-m) and graves (q-b-r) co-occur in 100:9 and parallel 22:7 where God \"raises those in the graves.\" Both link knowing/raising with what is concealed in graves. ← IN THIS AYAH", "noteTr": "Bilgi ('-l-m) ile kabir (q-b-r) 100:9 ve paralel 22:7'de ortak gecer, burada Allah \"kabirlerdekini diriltir.\" Ikisi de bilmeyi/diriltmeyi kabirlerde gizlenmiş olanla iliskilendirir. ← BU AYETTE"}], "critical": "ya'lamu is used here WITHOUT an explicit object — the verb's transitivity flag shows MIXED (290 with object, 44 without). This is one of the 44 objectless instances. The elided object creates powerful semantic openness: what should \"he\" know? Possible implied objects: (a) the consequence of ingratitude, (b) the reality of resurrection, (c) the exposure described in 100:10 (what is in the breasts), (d) the reckoning itself. Classical grammarians would say the object is deliberately omitted (hadhf) to universalize the knowing — he should know EVERYTHING that follows. The connection to 100:10 (wa-hussila ma fi l-sudur) creates a parallel: graves scattered (external) + breasts exposed (internal) = total disclosure. The subject \"he\" refers back to al-insan of 100:6, shifting from third-person description of ingratitude to direct rhetorical challenge. Phonetically, ya'lamu shares the 'ayn with al-'adiyat (100:1) creating a sound link between the galloping horses and the knowing — both involve intense, driven action. The bundle shows 100:9 is listed among without_object_ayahs, confirming the intransitive/absolute use. The shawadhdh reading yu'lamu (passive) radically transforms the ayah: from \"does he not know\" to \"is it not known/made manifest\" — removing human cognition entirely and replacing it with cosmic disclosure.", "criticalTr": "ya'lamu burada acik nesne OLMADAN kullanilmistir — fiilin gecislilik bayragi KARISIK gosterir (290 nesneli, 44 nesnesiz). Bu, 44 nesnesiz ornekten biridir. Hazfedilmis nesne guclu anlamsal aciklik yaratir: \"o\" neyi bilmeli? Muhtemel ima edilen nesneler: (a) nankorlugun sonucu, (b) dirilme gercegi, (c) 100:10'da tanimlanan ifsa (goguslerdekilerin aciga cikmasi), (d) hesabin kendisi. Klasik gramerciler nesnenin kasitli olarak hazfedildigini (hadhf) soyler — bilmeyi evrensellestirir: takip eden HER SEYI bilmeli. 100:10 (wa-hussila ma fi l-sudur) ile baglanti bir paralel yaratir: kabirler dagitilir (dis) + gogusler ifsa edilir (ic) = tam ifsa. Ozne \"o\" 100:6'daki el-insan'a geri doner. Fonetik olarak ya'lamu, el-'adiyat (100:1) ile 'ayn paylasar. Shawadhdh okumasi yu'lamu (mechul) ayeti koklunden donusturur: \"bilmez mi\" yerine \"bilinmez mi/aciga cikmaz mi\" — insan bilisini tamamen kaldirir ve kozmik ifsayla degistirir.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 5, "arabic": "إِذَا", "translit": "idhā", "gloss": "when / at the time when", "glossTr": "...diginda / ...digi zaman", "userNotes": "", "root": "— (—)", "grammar": "Temporal-conditional particle (zarf al-zaman). Introduces a temporal clause with the sense of certainty about the future event. Governs the perfect tense bu'thira.", "grammarTr": "Zaman zarfi (zarfu'z-zaman). Gelecek olay hakkinda kesinlik anlamiyla zamansal tumlec baslatir. Mazi kipteki bu'thira'yi yonetir.", "semantics": ["Temporal condition for certain future events: \"when\" (not \"if\")", "Classical lexicon (Lane): idha = a particle of time, denoting a future time; used for events expected with certainty; contrasts with in (if) which implies doubt", "Eschatological marker: in Quranic usage, idha frequently introduces scenes of the Last Day (81:1-14, 82:1-4, 84:1-5)"], "semanticsTr": ["Kesin gelecek olaylar icin zamansal kosul: \"...diginda\" (\"eger\" degil)", "Klasik sozluk (Lane): idha = zaman edati, gelecek zamani belirtir; kesinlikle beklenen olaylar icin kullanilir; suphe ima eden in (eger) ile zittir", "Eskatolojik isaretleyici: Kur'an kullaniminda idha sikllikla Kiyamet sahnelerini tanitir (81:1-14, 82:1-4, 84:1-5)"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "idha here introduces an eschatological temporal clause with absolute certainty — this WILL happen, the only question is when. The use of idha + perfect tense (bu'thira) is the standard Quranic formula for Last Day events: idha l-shamsu kuwwirat (81:1), wa-idha l-biharu fujjirat (82:3), wa-idha l-quburu bu'thirat (82:4). Notably, 82:4 uses the exact same phrase (al-qubur bu'thirat) as 100:9 (bu'thira ma fi l-qubur), but with different syntax: 82:4 has al-qubur as subject and bu'thirat agreeing in feminine, while 100:9 has ma fi l-qubur as subject and bu'thira in masculine default — this shifts focus from \"the graves\" (container) to \"what is IN the graves\" (contents).", "criticalTr": "idha burada mutlak kesinlikle eskatolojik zamansal tumlec baslatir — bu GERCEKLESECEK, tek soru ne zamandir. idha + mazi kip (bu'thira) Kiyamet olaylari icin standart Kur'an formuludur: idha'sh-shamsu kuwwirat (81:1), wa-idha'l-biharu fujjirat (82:3), wa-idha'l-quburu bu'thirat (82:4). Dikkat cekici olarak 82:4 ayni ifadeyi kullanir (el-qubur bu'thirat) ama farkli sentaksla: 82:4'te el-qubur ozne ve bu'thirat muennes uyumlu, 100:9'da ise ma fi l-qubur ozne ve bu'thira muzekker varsayilani — bu odagi \"kabirler\" (kap) yerine \"kabirlerin ICINDEKILER\" (icerik) olarak degistirir."}, {"id": 6, "arabic": "بُعْثِرَ", "translit": "bu'thira", "gloss": "is scattered / is overturned / is turned inside out / is dug up", "glossTr": "dagitilir / altustu edilir / desilir / cikarilir", "userNotes": "", "root": "ب ع ث ر (b-'-th-r)", "grammar": "Passive perfect (PV_PASS) of the quadriliteral verb ba'thara. 3rd person masculine singular agreeing with the masculine default for ma (what). The perfect tense after idha indicates certainty of the future event.", "grammarTr": "Dort harfli fiil ba'thara'nin mechul mazisi (PV_PASS). Ucuncu sahis tekil muzekker, ma (ne/sey) icin muzekker varsayilana uyumlu. idha'dan sonra mazi kip gelecek olayin kesinligini gosterir.", "semantics": ["ba'thara (quadriliteral): to scatter, to disperse, to overturn, to throw into disorder, to turn upside down", "Classical lexicon (Lane): ba'thara al-turaba = he scattered the earth/dust; ba'thara al-qabra = he turned up the grave, exhumed what was in it; ba'thara al-mata'a = he scattered the goods, threw them about in disorder; ba'thara al-shay'a = he searched for the thing by turning things over", "Classical lexicon (Lisan al-Arab): ba'thara = to investigate by turning over, to search by scattering; related to ba'atha (to send, to raise) + 'athara (to stumble upon, to find) — the quadriliteral may be a blend of both triliteral roots, combining \"raising\" with \"finding\"", "Classical etymology debate: some grammarians derive b-'-th-r from b-'-th (to raise/resurrect) with added ra', making \"scattering\" an intensification of \"raising\" — the graves are not merely opened but violently overturned", "Hans Wehr: to scatter, to disperse, to squander; also: to rummage through, to ransack", "Modern extension: to extract forcibly, to data-mine, to forensically recover buried material", "Futuristic: forensic data extraction — forcible retrieval of buried/encrypted/deleted information from storage media", "Core concept: violent disclosure through overturning — what was hidden below is brought to light through forceful upheaval"], "semanticsTr": ["ba'thara (dort harfli): dagitmak, savurmak, altustu etmek, alt ust etmek, duzensizce sacar", "Klasik sozluk (Lane): ba'thara et-turabe = topragı savurdu; ba'thara el-kabre = kabri deserek icindekini cikargi; ba'thara el-metaa = esyayi dagittigp, oraya buraya savurdu; ba'thara esh-shey'e = seyi altustu ederek aradi", "Klasik sozluk (Lisanu'l-Arab): ba'thara = altustu ederek arastirmak, dagitarak aramak; ba'atha (gondermek, diriltmek) + 'athara (rastlamak, bulmak) ile iliskili — dort harfli kok her iki uc harfli kokun bilesimi olabilir, \"diriltme\" ile \"bulma\"yi birlestirir", "Etimoloji tartismasi: bazi gramerciler b-'-th-r'yi b-'-th'den (diriltmek) ek ra ile turetir — \"dagitma\" \"diriltme\"nin yoognlastirmasi olur — kabirler sadece acilmaz, siddetle altustu edilir", "Hans Wehr: dagitmak, savurmak, sacip savurmak; ayrica: karistirmak, aramak, yagmalamak", "Kok kavram: altustu ederek siddetli ifsa — altta gizlenmis olan zorlu sarsintiyla gun yuzune cikarilir"], "occurrences": {"type": "all", "items": [{"ref": "82:4", "arabic": "وَإِذَا ٱلْقُبُورُ بُعْثِرَتْ", "english": "And when the graves are overturned (bu'thirat).", "turkish": "Ve kabirler altustu edildiginde (bu'thirat)."}]}, "qiraat": [{"arabic": "بُحْثِرَ", "translit": "buḥthira", "status": "shawādhdh", "type": "ibdāl", "note": "Metathesis variant — 'ayn and ha' swapped (ba'thara → bahthara). Shifts from root b-'-th-r (scatter) to b-h-th (search/investigate). Semantic impact: from \"scattered\" to \"searched through/investigated\" — the graves are not merely overturned but forensically searched. The variant root b-h-th appears in Quran only at 5:31 (the crow digging in earth).", "noteTr": "Gocusme variyanti — ayn ve ha yer degistirir (ba'thara → bahthara). Kokun b-'-th-r'den (dagitmak) b-h-th'ye (aramak/arastirmak) gecisi. Anlamsal etki: \"dagitilmis\" yerine \"aranmis/arastirilmis\" — kabirler sadece altustu edilmez, adli olarak arastirilir. Varyant kok b-h-th Kur'an'da sadece 5:31'de gecer (toprakta esen karga).", "source": "erquran.org"}, {"arabic": "بَعْثَرَ", "translit": "ba'thara", "status": "Irreg", "type": "Pss", "note": "Active voice instead of passive — \"he scattered what is in the graves\" rather than \"what is in the graves was scattered.\" Introduces an explicit agent (God) performing the scattering. Changes the grammatical structure: ma fi l-qubur becomes the object rather than the subject.", "noteTr": "Mechul yerine etken — \"kabirlerdekini dagitti\" yerine \"o kabirlerdekini dagitti.\" Dagitmayi gerceklestiren acik bir fail (Allah) tanitir. Gramer yapisini degistirir: ma fi l-qubur ozne yerine nesne olur.", "source": "erquran.org"}, {"arabic": "بُحِثَ", "translit": "buḥitha", "status": "shawādhdh", "type": "Lx", "note": "Different lexical form from root b-h-th — passive of bahatha \"to search, to dig, to investigate.\" Reduces the quadriliteral to a triliteral, removing the intensification. The meaning shifts from \"violently scattered\" to simply \"searched/investigated.\" The only Quranic instance of b-h-th is 5:31 where a crow digs (yabhath) in the earth to show Cain how to bury his brother — a powerful intertextual echo: the same root that teaches burial now describes the reversal of burial.", "noteTr": "b-h-th kokunden farkli leksikal bicim — bahatha \"aramak, kazmak, arastirmak\" fiilinin mechulu. Dort harfliyi uc harnfliye indirir, yogunlastirmayi kaldirir. Anlam \"siddetle dagitilmis\" yerine basitce \"aranmis/arastirilmis\" olur. b-h-th'in tek Kur'an ornegi 5:31'dir, karga toprakta kazar (yebhasu) — guclu metinlerarasi yanki: gomu ogretenn ayni kok simdi gomulmenin geri cevirilmesini tanimlar.", "source": "erquran.org"}, {"arabic": "بَحْثَرَ", "translit": "baḥthara", "status": "shawādhdh", "type": "ibdāl", "note": "Another metathesis variant like buḥthira but in active voice. Combines the root swap (b-'-th-r → b-h-th-r or b-h-th) with active agency. Same semantic shift toward \"searching/investigating\" but with an explicit actor.", "noteTr": "buḥthira gibi baska bir gocusme varyanti ama etken kipte. Kok degisimini (b-'-th-r → b-h-th-r veya b-h-th) etken faillik ile birlestirir. \"Aramak/arastirmak\" yonunde ayni anlamsal kaymaya ama acik bir faille.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "q-b-r", "coRootAr": "ق ب ر", "count": "2", "refs": "100:9;82:4", "note": "Scattering (b-'-th-r) and graves (q-b-r) co-occur in only two ayahs: 100:9 and 82:4. Both describe eschatological overturning of graves. In 82:4 the graves themselves are the subject; in 100:9 it is \"what is IN the graves.\" ← IN THIS AYAH", "noteTr": "Dagitma (b-'-th-r) ile kabir (q-b-r) sadece iki ayette ortak gecer: 100:9 ve 82:4. Ikisi de kabirlerin eskatolojik altustu edilmesini tanimlar. 82:4'te kabirlerin kendisi ozne; 100:9'da \"kabirlerin ICINDEKILER.\" ← BU AYETTE"}], "critical": "bu'thira is a quadriliteral passive perfect — one of only 2 Quranic occurrences of this root (the other being 82:4). The extreme rarity makes each occurrence carry maximum weight. Classical etymologists debate whether b-'-th-r is a blend of b-'-th (to raise/resurrect/send) and '-th-r (to find/stumble upon) — if so, the word itself encodes \"raising AND finding,\" combining resurrection with discovery. The passive voice removes any named agent — the scattering simply occurs as cosmic inevitability. The perfect tense after idha presents this future event as already accomplished (tense of certainty). Phonetically, bu'thira contains explosive consonants (b, th, r) that mimic the violence of overturning. The qira'at variants are semantically rich: buḥthira and buḥitha both shift from \"scattering\" to \"searching/investigating\" (root b-h-th), changing the eschatological image from chaotic dispersal to forensic examination. The b-h-th root's only standard Quranic appearance (5:31, the crow digging to show burial) creates a stunning reversal: the act that taught burial is now the act that reverses it. The Irreg variant ba'thara (active voice) introduces God as explicit agent, breaking the passive's cosmic anonymity. Grammar-enacts-content: the quadriliteral form itself (four consonants instead of three) performs intensification — this is not ordinary raising (b-'-th) but violent, thorough overturning.", "criticalTr": "bu'thira dort harfli mechul mazi — bu kokun yalnizca 2 Kur'an gecisinden biri (digeri 82:4). Asiri nadirlik her gecise maksimum agirlik verir. Klasik etimologlar b-'-th-r'nin b-'-th (diriltmek/gondermek) ile '-th-r'nin (bulmak/rastlamak) bilesimi olup olmadigini tartisir — eger oyle ise kelime \"diriltme VE bulma\"yi kodlar, dirilisi kesfle birlestirir. Mechul yapi adlandirilmis faili kaldirir — dagitma kozmik kacinilmazlik olarak gerceklesir. idha'dan sonra mazi kip gelecek olayi gerceklesmis olarak sunar (kesinlik zamani). Fonetik olarak bu'thira patlayici unsuzler (b, th, r) icerir, altustu etmenin siddetini taklit eder. Kıraat varyantlari anlamsal olarak zengindir: buḥthira ve buḥitha ikisi de \"dagitma\"dan \"arama/arastirma\"ya (kok b-h-th) gecis yapar. b-h-th kokununun standart Kur'an'daki tek gecisi (5:31, gomu ogretmek icin kazan karga) carpici bir tersinme yaratir: gomuyu ogreten eylem simdi gomuyü geri ceviren eylemdir. Irreg varyanti ba'thara (etken) Allah'i acik fail olarak tanitir. Gramer-icerigi-canlandirir: dort harfli biçimin kendisi (uc yerine dort unsuz) yogunlastirma yapar — bu siradan diriltme (b-'-th) degil, siddetli, kapsamli altustu etmedir.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 7, "arabic": "مَا", "translit": "mā", "gloss": "what / that which / whatever", "glossTr": "ne / ...digi sey / her ne", "userNotes": "", "root": "— (—)", "grammar": "Relative pronoun (ism al-mawsul). Subject of the passive verb bu'thira. Refers to everything contained in the graves — deliberately unspecified.", "grammarTr": "Ilgi zamiri (ismu'l-mevsul). Mechul fiil bu'thira'nin oznesi. Kabirlerde bulunan her seye isaret eder — kasitli olarak belirsiz.", "semantics": ["Relative pronoun (mawsul): \"that which, what\" — refers to unspecified contents", "Interrogative (istifham): \"what?\" — in some grammatical readings, ma could retain interrogative force: \"what (exactly) is in the graves?\"", "Generalizing (umum): \"whatever\" — encompasses all possible contents without limitation"], "semanticsTr": ["Ilgi zamiri (mevsul): \"...digi sey, ne\" — belirsiz iceriklere isaret eder", "Soru (istifham): \"ne?\" — bazi gramer okumalarinda ma soru gucu tasiyabilir", "Genelleyici (umum): \"her ne\" — sinirlanmadan tum mumkun icerikleri kapsar"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "ma as a relative pronoun creates deliberate ambiguity about WHAT is in the graves. Bodies? Souls? Deeds? Records? Secrets? The text does not specify, and the non-specification is itself meaningful. In 100:10 the parallel structure uses ma fi l-sudur (what is in the breasts) — creating a pair: ma fi l-qubur (external, buried physical reality) and ma fi l-sudur (internal, buried psychological reality). Together they represent total disclosure — nothing remains hidden, neither external nor internal. The generalizing force of ma ensures the scope is unlimited. In modern/futuristic readings, \"what is in the graves\" can include buried data, deleted records, encrypted communications — anything concealed in any repository. The ma prevents limiting interpretation to any single era's understanding of burial.", "criticalTr": "ma ilgi zamiri olarak kabirlerde NEYIN oldugu konusunda kasitli belirsizlik yaratir. Bedenler? Ruhlar? Ameller? Kayitlar? Sirlar? Metin belirtmez ve belirtmeme kendisi anlamlidir. 100:10'da paralel yapi ma fi l-sudur (goguslerdekileri) kullanir — bir cift olusturur: ma fi l-qubur (dis, gomulu fiziksel gerceklik) ve ma fi l-sudur (ic, gomulu psikolojik gerceklik). Birlikte tam ifsayi temsil eder — hicbir sey gizli kalmaz. ma'nin genelleyici gucu kapsami sinursiz kilar. Modern/futuristik okumalarda \"kabirlerdeki\" gomulu veri, silinmis kayitlar, sifrelenmis iletisimler icerebilir."}, {"id": 8, "arabic": "فِى", "translit": "fī", "gloss": "in / within / inside", "glossTr": "icinde / ...de", "userNotes": "", "root": "— (—)", "grammar": "Preposition (harf al-jarr). Governs al-qubur in the genitive case. Indicates containment — what is contained inside the graves.", "grammarTr": "Edat (harfu'l-cerr). el-qubur'u mecrur halde yonetir. Icerilme bildirir — kabirlerin icinde bulunan.", "semantics": ["Spatial containment: in, within, inside — locates contents within the graves", "Classical lexicon (Lane): fi = in, within, among, during; denotes containment, temporal location, or specification", "Metaphorical containment: concealment within — \"in the graves\" implies hidden, buried, inaccessible"], "semanticsTr": ["Mekansal icerilme: icinde, dahilinde — icerigi kabirlerin icinde konumlar", "Mecazi icerilme: icinde gizlenme — \"kabirlerde\" gizli, gomulu, erisilemez anlamini ima eder"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "fi (in/within) here establishes spatial containment — what is INSIDE the graves. The preposition is critical because it shifts focus from the graves as external structures to their contents. Compare 82:4 (wa-idha l-quburu bu'thirat) where no fi appears — there the graves themselves are overturned. Here, bu'thira ma fi l-qubur — what is IN the graves is scattered. The fi creates a nested structure: things hidden inside things that are themselves hidden (buried underground). The double concealment makes the disclosure more dramatic.", "criticalTr": "fi (icinde) burada mekansal icerilme kurar — kabirlerin ICINDEKI. Edat kritiktir cunku odagi dis yapilar olarak kabirlerden iceriklerine kaydırır. 82:4 (wa-idha l-quburu bu'thirat) ile karsilastiriniz — orada fi yoktur, kabirlerin kendisi altustu edilir. Burada bu'thira ma fi l-qubur — kabirlerin ICINDEKI dagitilir. fi ic ice yapi yaratir: kendileri gizli olan seylerin (yeraltina gomulu) icinde gizlenmis seyler. Cifte gizleme ifsayi daha dramatik kilar."}, {"id": 9, "arabic": "ٱلْقُبُورِ", "translit": "al-qubūr", "gloss": "the graves / the burial-places / the repositories", "glossTr": "kabirler / defin yerleri / depolar", "userNotes": "", "root": "ق ب ر (q-b-r)", "grammar": "Definite noun, plural of qabr, genitive case governed by fi. The definite article al- indicates all graves universally, not specific ones.", "grammarTr": "Belirli isim, qabr'in cogulu, fi tarafindan yonetilen mecrur hal. Belirlilik takisi el- belirli olanlar degil tum kabirleri evrensel olarak gosterir.", "semantics": ["fa'ala (I): to bury, to inter, to conceal in the earth", "aqbara (IV): to cause to be buried, to provide burial — 80:21 \"thumma amatahu fa-aqbarahu\" (then He caused him to die and caused him to be buried)", "qabr (noun): grave, tomb, burial-place, sepulcher", "qubur (plural): graves collectively — the plural form zubar pattern (fu'ul) indicates a concrete, physical plural", "Classical lexicon (Lane): qabara = to bury, to hide in the earth; qabr = a grave, a place of burial; maqbara/maqbura = cemetery, graveyard; also: any place where something is concealed or deposited", "Classical lexicon (Lisan al-Arab): qabr = from qabara meaning to conceal, to cover over; related concept: anything covered/hidden from view; the grave is named for its act of concealing", "Hans Wehr: grave, tomb; maqbara = graveyard, cemetery; figurative: any place of burial/concealment", "Modern extension: any repository of concealment — archives, vaults, encrypted storage, deleted file systems, buried infrastructure", "Futuristic: data graves — storage media where information is buried/archived: hard drives, server farms, cold storage, blockchain ledgers, any medium where data is deposited and concealed from immediate access", "Core concept: concealment through covering/burial — the act of hiding something by placing it beneath a surface, with the inherent potential for that concealment to be reversed"], "semanticsTr": ["fe'ale (I. bab): gommek, defnetmek, toprakta gizlemek", "akbara (IV. bab): gomulmasini saglamak, defin saglamak — 80:21 \"sonra onu oldurdu ve gomulmesini sagladi\"", "qabr (isim): kabir, mezar, defin yeri", "qubur (cogul): toplu olarak kabirler — fu'ul kalibindaki cogul somut, fiziksel cogullugu gosterir", "Klasik sozluk (Lane): qabara = gommek, toprakta gizlemek; qabr = mezar, defin yeri; maqbara = mezarlik; ayrica: bir seyin gizlendigi veya biraktirildigi her yer", "Klasik sozluk (Lisanu'l-Arab): qabr, qabara'dan gelir, gizlemek, ortmek anlaminda; iliskili kavram: gorunumden gizlenmis her sey; kabir gizleme eyleminden adini alir", "Modern uzanti: gizlemenin her turu depo — arsivler, mahzenler, sifrelenmis depolar, silinmis dosya sistemleri", "Kok kavram: ortme/gomme yoluyla gizleme — bir seyi bir yuzeyim altina yerlestirerek saklama, bu gizlemenin geri cevrilebilme potansiyeli ile"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Graves as eschatological sites — resurrection and final disclosure", "count": "~4 ayahs", "examples": [{"ref": "82:4", "arabic": "وَإِذَا ٱلْقُبُورُ بُعْثِرَتْ", "english": "And when the graves are overturned (bu'thirat).", "turkish": "Ve kabirler altustu edildiginde (bu'thirat)."}, {"ref": "22:7", "arabic": "وَأَنَّ ٱلسَّاعَةَ ءَاتِيَةٌۭ لَّا رَيْبَ فِيهَا وَأَنَّ ٱللَّهَ يَبْعَثُ مَن فِى ٱلْقُبُورِ", "english": "And that the Hour is coming — no doubt about it — and that God raises whoever is in the graves (al-qubur).", "turkish": "Ve Kiyamet'in gelecegi — onda suphe yok — ve Allah'in kabirlerdekini (el-qubur) diriltecegi."}, {"ref": "35:22", "arabic": "وَمَا يَسْتَوِى ٱلْأَحْيَآءُ وَلَا ٱلْأَمْوَٰتُ ۚ إِنَّ ٱللَّهَ يُسْمِعُ مَن يَشَآءُ ۖ وَمَآ أَنتَ بِمُسْمِعٍۢ مَّن فِى ٱلْقُبُورِ", "english": "Not equal are the living and the dead. God makes hear whoever He wills, and you cannot make hear those in the graves (al-qubur).", "turkish": "Diriler ile oluler bir degildir. Allah dilediklerine isittirir; ama sen kabirlerdekilerine (el-qubur) isittiremezsin."}]}, {"label": "B. Graves as social/spiritual sites — burial, mourning, despair", "count": "~4 ayahs", "examples": [{"ref": "9:84", "arabic": "وَلَا تُصَلِّ عَلَىٰٓ أَحَدٍۢ مِّنْهُم مَّاتَ أَبَدًۭا وَلَا تَقُمْ عَلَىٰ قَبْرِهِۦٓ ۖ إِنَّهُمْ كَفَرُوا۟ بِٱللَّهِ وَرَسُولِهِۦ وَمَاتُوا۟ وَهُمْ فَٰسِقُونَ", "english": "And do not pray over any of them who has died — ever — and do not stand at his grave (qabrih). They disbelieved in God and His messenger and died while defiantly disobedient.", "turkish": "Onlardan olen hicbir kimsenin namazini kilma — asla — ve kabrinin (qabrih) basinda durma. Onlar Allah'a ve Resulune kufrettiler ve fasiklar olarak oldular."}, {"ref": "60:13", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تَتَوَلَّوْا۟ قَوْمًا غَضِبَ ٱللَّهُ عَلَيْهِمْ قَدْ يَئِسُوا۟ مِنَ ٱلْءَاخِرَةِ كَمَا يَئِسَ ٱلْكُفَّارُ مِنْ أَصْحَٰبِ ٱلْقُبُورِ", "english": "O you who believe, do not take as allies a people with whom God is angry. They have despaired of the Hereafter as the disbelievers despair of the companions of the graves (al-qubur).", "turkish": "Ey iman edenler, Allah'in gazap ettigi bir kavmi dost edinmeyin. Kafirlerin kabir ehlinden (el-qubur) umudu kestigi gibi onlar da ahiretten umut kesmislerdir."}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "b-'-th-r", "coRootAr": "ب ع ث ر", "count": "2", "refs": "100:9;82:4", "note": "Graves (q-b-r) paired with scattering (b-'-th-r) — the only two co-occurrences, both describing eschatological overturning. ← IN THIS AYAH", "noteTr": "Kabir (q-b-r) ile dagitma (b-'-th-r) eslesmesi — tek iki ortak gecis, ikisi de eskatolojik altustu etmeyi tanimlar. ← BU AYETTE"}, {"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "4", "refs": "9:84;22:7;35:22;60:13", "note": "Graves (q-b-r) paired with God ('-l-h) — in all four co-occurrences, God is the agent acting upon or in relation to graves: raising the dead (22:7), making hear (35:22), commanding about burial (9:84), expressing anger (60:13). Divine authority over what graves conceal.", "noteTr": "Kabir (q-b-r) ile Allah ('-l-h) eslesmesi — dort ortak geciste Allah kabirlerle iliskili fail: oluleri diriltir (22:7), isittirir (35:22), defin hakkinda emreder (9:84), gazap eder (60:13). Kabirlerin gizledigi uzerinde ilahi otorite."}, {"coRoot": "m-w-t", "coRootAr": "م و ت", "count": "3", "refs": "9:84;35:22;80:21", "note": "Graves (q-b-r) paired with death (m-w-t) — graves naturally associated with death, but notably in 100:9 the word \"death\" does NOT appear. The ayah focuses on disclosure, not death. The absence of m-w-t in this ayah while it co-occurs elsewhere suggests 100:9 is about what happens AFTER death, not death itself.", "noteTr": "Kabir (q-b-r) ile olum (m-w-t) eslesmesi — kabirler dogal olarak olumle iliskilendirilir, ancak dikkat cekici olarak 100:9'da \"olum\" sozcugu YOKTUR. Ayet olume degil, ifsaya odaklanir. m-w-t'nin bu ayette yoklugu ama baska yerlerde ortak gecisi 100:9'un olumun kendisi degil, olumden SONRA olanla ilgili oldugunu dusundurur."}], "critical": "al-qubur (the graves) appears 8 times in the Quran across 6 forms (NOUN_CONCRETE: 6, NOUN_TIME_PLACE: 1, PV: 1). The definite article al- with the plural creates universality — ALL graves everywhere. The root q-b-r fundamentally means \"to conceal by burial\" — the grave is named for its function of hiding. In 100:9, the phrase ma fi l-qubur (what is in the graves) focuses on CONTENTS not CONTAINERS — contrast 82:4 (al-qubur bu'thirat) which focuses on the graves themselves. This is a deliberate distinction: 100:9 asks about the CONTENTS being disclosed, while 82:4 describes the containers being destroyed. The co-occurrence with '-l-h (God) across 4 ayahs establishes divine authority over graves: God raises from them (22:7), communicates despite them (35:22), and commands behavior toward them (9:84). The q-b-r root's semantic core — concealment through burial — extends beyond physical graves to any concealment system. Lane's Lexicon notes that qabr implies intentional covering, not accidental concealment. The fu'ul plural pattern (qubur) indicates concrete, countable entities — these are specific physical repositories, not abstract concealment. Modern resonance: digital graves where deleted files, encrypted records, and archived communications are \"buried\" — all subject to forensic extraction (bu'thira).", "criticalTr": "el-qubur (kabirler) Kur'an'da 8 kez, 6 bicimde gecer (NOUN_CONCRETE: 6, NOUN_TIME_PLACE: 1, PV: 1). Belirlilik takisi ile cogul evrensellik yaratir — HER YERDE tum kabirler. q-b-r koku temelde \"gomerek gizlemek\" anlamina gelir — kabir, saklama islevinden adini alir. 100:9'da ma fi l-qubur (kabirlerdeki) KAPLARA degil ICERIKLERE odaklanir — 82:4 (el-quburu bu'thirat) kabirlerin kendilerine odaklanirken karsilastirin. Bu kasitli bir ayrimdir: 100:9 ifsa edilen ICERIGI sorar, 82:4 yokedilen kaplari tanimlar. '-l-h (Allah) ile 4 ayette ortak gecis kabirler uzerinde ilahi otorite kurar. q-b-r kokun anlamsal cekirdegi — gomme yoluyla gizleme — fiziksel kabirlerin otesinde her gizleme sistemine uzanir. Lane's Lexicon qabr'in kasitli ortmeyi, tesadufi gizlemeyi degil ima ettigini belirtir. fu'ul cogul kalibi (qubur) somut, sayilabilir varliklari gosterir. Modern yanki: silinmis dosyalarin, sifrelenmis kayitlarin \"gomuldugu\" dijital kabirler — hepsi adli cikarima (bu'thira) tabidir.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["What exactly is the implied object of ya'lamu? The elided object creates at least four possible readings: (a) the consequence of ingratitude, (b) the reality of resurrection, (c) the contents of breasts (from 100:10), (d) the reckoning. Does the elision itself constitute the answer — that he should know EVERYTHING?", "The quadriliteral b-'-th-r may blend b-'-th (to raise/resurrect) with '-th-r (to find/stumble upon). If this etymology is correct, does the word encode \"resurrection-as-discovery\" — that raising the dead IS finding the hidden?", "Why does 100:9 use ma fi l-qubur (what is IN the graves) while 82:4 uses al-quburu bu'thirat (the graves are overturned)? The shift from container to contents suggests 100:9 is interested in what emerges, not in the destruction of the container. What implications does this have for the concept of disclosure vs. destruction?", "The qira'at variants buḥthira/buḥitha shift from \"scattering\" to \"searching/investigating\" (root b-h-th). The only standard b-h-th occurrence (5:31) describes a crow digging to demonstrate burial. Does this create an intentional reversal: the same root that teaches concealment now describes its undoing?", "The shawadhdh reading yu'lamu (passive of ya'lamu) eliminates human cognition entirely — \"is it not known/made manifest?\" rather than \"does he not know?\" This transforms the ayah from a challenge to human awareness into a statement about cosmic inevitability. How does this change the ayah's relationship to 100:10?", "100:9-10 pair external (graves) with internal (breasts) disclosure. Does this pairing suggest that \"burial\" operates on two levels — physical burial of bodies AND psychological burial of intentions — and that both are subject to the same eschatological reversal?", "The absence of the root m-w-t (death) from 100:9 is notable, given that graves co-occur with death in 3 other ayahs. Why does this ayah about graves avoid mentioning death? Does this suggest the focus is entirely on disclosure/extraction rather than mortality?", "If qubur extends to any repository of concealment (archives, vaults, data storage), and bu'thira extends to any form of forcible extraction, does the ayah describe a universal principle: everything concealed will be violently disclosed? What are the implications for privacy, data security, and information permanence?", "The transition from 100:1-5 (vigorous active imagery: galloping, striking, raiding) to 100:6-8 (diagnosis of human nature) to 100:9 (passive bu'thira) traces an arc from action to judgment. Does the passive voice of bu'thira signal that the human who was the active aggressor now becomes the passive subject of cosmic action?", "How does the phonetic texture of bu'thira — with its explosive b, fricative th, and rolling r — relate to the physical violence of overturning earth? Is there sound symbolism at work in this quadriliteral?"], "questionsTr": ["ya'lamu'nun ima edilen nesnesi tam olarak nedir? Hazfedilmis nesne en az dort farkli okuma yaratir: (a) nankorlugun sonucu, (b) dirilis gercegi, (c) goguslerdekilerin icerigi (100:10'dan), (d) hesabin kendisi. Hazfin kendisi cevabi olusturur mu — HER SEYI bilmeli mi?", "Dort harfli b-'-th-r, b-'-th (diriltmek) ile '-th-r'yi (bulmak/rastlamak) harmanliyor olabilir. Bu etimoloji dogruysa, kelime \"kesif-olarak-dirilis\"i kodlar mi — oluleri diriltmek gizliyi bulmak MIDIR?", "100:9 neden ma fi l-qubur (kabirlerin ICINDEKI) kullanirken 82:4 el-quburu bu'thirat (kabirler altustu edildi) kullanir? Kaptan icerlige kayis 100:9'un yikima degil ortaya cikana ilgi duydugunun isaret eder. Bunun ifsa vs. yikim kavrami icin ne gibi sonuclari vardir?", "Kıraat varyantlari buḥthira/buḥitha \"dagitmak\"tan \"aramak/arastirmak\"a (kok b-h-th) gecer. Standart b-h-th'in tek gecisi (5:31) gommeyi gostermek icin kazan kargayi tanimlar. Bu kasitli bir tersinme mi: gizlemeyi ogreten ayni kok simdi gizlemenin bozulmasini mi tanimlar?", "Shawadhdh okumasi yu'lamu (ya'lamu'nun mechulu) insan bilisini tamamen kaldirir — \"bilmez mi?\" yerine \"bilinmez mi/aciga cikmaz mi?\" Bu, ayeti insan farkindaligina meydan okumadan kozmik kacinilmazlik beyanina donusturur. Bu, ayetin 100:10 ile iliskisini nasil degistirir?", "100:9-10 dis (kabirler) ile ic (gogusler) ifsasini eslestirir. Bu eslestirme \"gomme\"nin iki duzlemde isledigini dusundurur mu — bedenlerin fiziksel gomulmesi VE niyetlerin psikolojik gomulmesi — ve her ikisinin de ayni eskatolojik geri cevirmeye tabi oldugu?", "m-w-t (olum) kokun 100:9'da yoklugu, kabirlerin olumle 3 baska ayette ortak gectigi dusunulurse dikkat cekicidir. Kabirlerle ilgili bu ayet neden olumden bahsetmekten kacınır? Bu, odagin tamamen olumluluk yerine ifsa/cikarma uzerine oldugunu mu gosterir?", "qubur her turlu gizleme deposuna (arsivler, mahzenler, veri depolama) ve bu'thira her turlu zorla cikarma bicimine uzaniyorsa, ayet evrensel bir ilkeyi mi tanimlar: gizlenen her sey siddetle ifsa edilecek? Mahremiyet, veri guvenligi ve bilgi kaliciligi icin sonuclari nelerdir?", "100:1-5'ten (dinamik etken goruntuler: dort nala kosma, carpma, baskin) 100:6-8'e (insan dogasinin teshisi) 100:9'a (edilgen bu'thira) gecis eylemden yargilamaya bir yay cizer. bu'thira'nin edilgen kipi aktif saldirgan olan insanin simdi kozmik eylemin edilgen oznesi haline geldigini mi isaret eder?", "bu'thira'nin fonetik dokusu — patlayici b, surutmeli th ve yuvarlanan r ile — topragin altustu edilmesinin fiziksel siddeti ile nasil iliskilidir? Bu dort harfli kokenin ses sembolizmi var midir?"], "key": "100:9"}, "100:10": {"surah": 100, "ayah": 10, "arabic": "وَحُصِّلَ مَا فِى ٱلصُّدُورِ", "transliteration": "wa-ḥuṣṣila mā fī ṣ-ṣudūri", "readings": [{"text": "And what is in the chests is sifted out / extracted — the hidden contents of hearts are separated and made manifest", "textTr": "Ve göğüslerdeki ayırt edilip ortaya çıkarılır — kalplerin gizli içeriği ayrıştırılarak açığa çıkar", "rationale": "ḥuṣṣila is parsed as Form II passive (fu''ila), from ḥ-ṣ-l meaning \"to separate grain from chaff, to extract the essential.\" The passive voice leaves the agent unspecified — who or what performs this extraction is open. mā fī ṣ-ṣudūr functions as the subject of the passive verb (nā'ib al-fā'il). The chest/breast (ṣadr) is the container; the extraction targets what is INSIDE it.", "rationaleTr": "ḥuṣṣila II. bab edilgen çatı (fu''ile) olarak çözümlenir, ḥ-ṣ-l kökünden \"daneden samanı ayırmak, özü çıkarmak\" anlamındadır. Edilgen yapı faili belirsiz bırakır — bu çıkarmayı kimin veya neyin yaptığı açıktır. mā fī ṣ-ṣudūr edilgen fiilin nâib-i fâili (özne yerini tutan) olarak işlev görür. Göğüs (ṣadr) kaptır; çıkarma İÇİNDEKİNİ hedefler."}, {"text": "And what is in the chests is collected / gathered together — the scattered inner contents are accumulated and presented", "textTr": "Ve göğüslerdeki toplanıp bir araya getirilir — dağınık iç içerikler biriktirilip sunulur", "rationale": "ḥuṣṣila read through the primary classical sense of ḥ-ṣ-l as \"to collect, to gather, to accumulate.\" Form II intensifies: not merely gathered but thoroughly collected, nothing left behind. This reading emphasizes completeness of gathering rather than separation. What is gathered is everything within the breast — intentions, secrets, unspoken thoughts, desires.", "rationaleTr": "ḥuṣṣila, ḥ-ṣ-l kökünün birincil klasik anlamı olan \"toplamak, biriktirmek, bir araya getirmek\" üzerinden okunur. II. bab yoğunlaştırır: salt toplanmak değil, eksiksiz biçimde derlenmek, hiçbir şey geride bırakılmamak. Bu okuma ayrıştırmadan ziyade toplama bütünlüğünü vurgular. Toplanan göğüsteki her şeydir — niyetler, sırlar, söylenmemiş düşünceler, arzular."}, {"text": "And the data within the processing centers is extracted — internal states are mined and made readable", "textTr": "Ve işlem merkezlerindeki veriler çıkarılır — iç durumlar çıkartılıp okunabilir hale getirilir", "rationale": "ṣudūr (chests) read as \"processing centers\" — the ṣadr is where thought is processed, decisions formed, emotions generated. ḥuṣṣila as \"data extraction\" — separating meaningful signal from noise within a complex internal system. In a modern/futuristic frame, this describes data mining: extracting actionable information from internal storage. The passive construction mirrors automated processes — extraction happens TO the data, not BY a visible agent.", "rationaleTr": "ṣudūr (göğüsler) \"işlem merkezleri\" olarak okunur — ṣadr düşüncenin işlendiği, kararların oluştuğu, duyguların üretildiği yerdir. ḥuṣṣila \"veri çıkarma\" olarak — karmaşık iç sistemden anlamlı sinyali gürültüden ayırma. Modern/geleceksel çerçevede bu veri madenciliğini tanımlar: iç depolamadan işlenebilir bilgi çıkarma. Edilgen yapı otomatik süreçleri yansıtır — çıkarma veriye YAPILIR, görünür bir fail TARAFINDAN değil."}, {"text": "And what is in the breasts is made to yield its harvest — the inner harvest is reaped", "textTr": "Ve göğüslerdeki hasadını verir — iç hasat biçilir", "rationale": "ḥuṣṣila connected to ḥāṣil (yield, harvest, product). The agricultural metaphor: what was sown in the breast (intentions, beliefs, hidden motives) is now harvested. The passive Form II suggests a forced reaping — the harvest is taken whether the owner wills it or not. This is eschatological: on the Day, the inner crop is reaped and assessed. The verb does not specify quality (good or bad) — ALL contents are harvested.", "rationaleTr": "ḥuṣṣila, ḥāṣil (verim, hasat, ürün) ile bağlantılıdır. Tarımsal mecaz: göğüse ekilmiş olan (niyetler, inançlar, gizli güdüler) şimdi hasat edilir. Edilgen II. bab zorla biçmeyi ima eder — sahibi ister ya da istemez hasat alınır. Eskatolojik boyut: O Gün, iç mahsul biçilip değerlendirilir. Fiil nitelik belirtmez (iyi veya kötü) — TÜM içerikler hasat edilir."}, {"text": "And what is in the interiors is refined and distilled — the essential nature is separated from the superficial", "textTr": "Ve iç dünyalardaki arıtılıp damıtılır — öz tabiat yüzeysel olandan ayrılır", "rationale": "ḥuṣṣila as \"to refine, to distill\" — removing impurities to reveal the true substance. This reading treats the ṣudūr not just as containers but as crucibles: the contents undergo a transformative process. The extraction is qualitative — not merely revealing what is hidden but purifying it to its essence. In this reading, the Day of Judgment functions as an assay: the alloy of human intention is melted down and the base metals separated from the pure.", "rationaleTr": "ḥuṣṣila \"arıtmak, damıtmak\" olarak — safsızlıkları gidererek gerçek özü ortaya çıkarmak. Bu okuma ṣudūr'u salt kaplar olarak değil potalar olarak ele alır: içerikler dönüştürücü bir süreçten geçer. Çıkarma nitelikseldir — gizli olanı salt açığa çıkarmak değil, onu özüne kadar arıtmak. Bu okumada Kıyamet Günü bir tahlil işlevi görür: insan niyetinin alaşımı eritilir ve adi metaller saftan ayrılır."}], "structure": {"beats": [{"label": "Conjunction — discourse connector", "labelTr": "Bağlaç — söylem bağlayıcısı", "lines": [{"arabic": "وَ", "translit": "wa", "english": "And / Then", "turkish": "Ve / O zaman"}]}, {"label": "Core verb — the act of extraction/sifting", "labelTr": "Çekirdek fiil — çıkarma/ayıklama eylemi", "lines": [{"arabic": "حُصِّلَ", "translit": "ḥuṣṣila", "english": "is sifted out / extracted / collected", "turkish": "ayıklanır / çıkarılır / toplanır"}]}, {"label": "Subject — the hidden contents", "labelTr": "Özne — gizli içerikler", "lines": [{"arabic": "مَا فِى ٱلصُّدُورِ", "translit": "mā fī ṣ-ṣudūri", "english": "what is in the chests/breasts", "turkish": "göğüslerdeki"}]}], "summary": "The ayah is a single passive verbal sentence: verb (ḥuṣṣila) + subject (mā fī ṣ-ṣudūri). The conjunction wa connects this to 100:9 (أَفَلَا يَعْلَمُ بِمَا فِي ٱلْقُبُورِ — \"does he not know what is in the graves?\"), creating a grave-chest parallelism: what is in the GRAVES (physical bodies, deeds) is brought out, AND what is in the CHESTS (inner states, intentions) is extracted. The passive voice in ḥuṣṣila mirrors the passivity of those whose contents are exposed — they undergo the process, they do not control it. The mā (relative pronoun) universalizes the subject: not specific contents but EVERYTHING within. The prepositional phrase fī ṣ-ṣudūri locates the contents spatially INSIDE, emphasizing concealment that is now undone.", "summaryTr": "Ayet tekil edilgen bir fiil cümlesidir: fiil (ḥuṣṣila) + özne (mā fī ṣ-ṣudūri). Bağlaç وَ bunu 100:9'a (أَفَلَا يَعْلَمُ بِمَا فِي ٱلْقُبُورِ — \"kabirlerdekini bilmez mi?\") bağlar ve kabir-göğüs paralelliği yaratır: KABİRLERDEKİ (fiziksel bedenler, ameller) çıkarılır VE GÖĞÜSLERDEKİ (iç durumlar, niyetler) ayıklanır. ḥuṣṣila'daki edilgen yapı, içeriği açığa çıkarılanların edilgenliğini yansıtır — sürece maruz kalırlar, onu kontrol etmezler. mā (ism-i mevsul) özneyi genelleştirir: belirli içerikler değil İÇİNDEKİ HER ŞEY. fī ṣ-ṣudūri edat tamlaması içerikleri mekansal olarak İÇERİDE konumlandırır ve şimdi bozulan gizliliği vurgular."}, "words": [{"id": 1, "arabic": "وَ", "translit": "wa", "gloss": "and; then; now", "glossTr": "ve; sonra; şimdi", "userNotes": "", "root": "—", "grammar": "Conjunction (ḥarf 'aṭf). Connects this ayah to the preceding 100:9. Functions here as عَطْف ('aṭf, coordination) linking the extraction of chest-contents to the resurrection of grave-contents. Can also be read as استئناف (istiʾnāf) — introducing a new but parallel statement about interior exposure.", "grammarTr": "Bağlaç (harf-i atıf). Bu ayeti önceki 100:9'a bağlar. Burada عَطْف (atıf, eşgüdüm) işleviyle göğüs içeriklerinin çıkarılmasını
