 from a concealing medium (Lane's: qadaha = \"he struck fire from a flint\"; hassala = \"he separated grain from chaff\"). The physical extraction of hidden fire from stone (100:2) prefigures the eschatological extraction of hidden intentions from chests (100:10). Both roots are Quranic hapax or near-hapax, reinforcing the correspondence through shared rarity.", "tr": "100:2 ve 100:10'u test etme: qadhan (100:2, kıvılcım çakma -- çakmaktaşından ateş çıkarma, q-d-h kökü) hussila'yı (100:10, göğüslerdekini çıkarma, h-s-l kökü) yansıtır. Her ikisi de gizleyici bir ortamdan çıkarma eylemleridir (Lane's: qadaha = \"çakmaktaşından ateş çaktı\"; hassala = \"daneden samanı ayırdı\"). Taştan gizli ateşin fiziksel çıkarımı (100:2), göğüslerden gizli niyetlerin eskatoljik çıkarımını önceden haber verir (100:10). Her iki kök de Kur'an'da hapax veya neredeyse-hapax'tır, paylaşılan nadirlik yoluyla uyumu güçlendirir."}}, {"type": "CONFIRMED", "ref": "100:3", "threadId": "cross_bookend_3_9", "title": {"en": "[Bookend] Ayah 3 and Ayah 9: Military Dawn and Eschatological Dawn", "tr": "[Kitap Sonu] Ayet 3 ve Ayet 9: Askeri Şafak ve Eskatoljik Şafak"}, "text": {"en": "Testing 100:3 and 100:9: subhan (100:3, \"at dawn,\" root s-b-h) corresponds to idha bu'thira (100:9, the eschatological event). The military dawn (100:3) -- a single morning of human violence -- maps to the cosmic Dawn when graves are overturned (100:9). Both mark a temporal threshold: the moment when darkness yields to exposure. The s-b-h root (100:3, morning) finds its eschatological counterpart in the implied yawm (100:11, \"that Day\"), and both ayahs inaugurate a disclosure that cannot be reversed.", "tr": "100:3 ve 100:9'u test etme: subhan (100:3, \"şafakta\", s-b-h kökü) idha bu'thira'ya (100:9, eskatoljik olay) karşılık gelir. Askeri şafak (100:3) -- insan şiddetinin tek bir sabahı -- kabirlerin alt üst edildiği kozmik Şafak'a (100:9) eşlenir. Her ikisi de zamansal bir eşiği işaretler: karanlığın ifşaya yol verdiği an. S-b-h kökü (100:3, sabah) eskatoljik karşılığını ima edilen yawm'da (100:11, \"o Gün\") bulur ve her iki ayet de geri döndürülemeyecek bir ifşayı başlatır."}}, {"type": "DISCOVERY", "ref": "100:4", "threadId": "cross_bookend_4_8", "title": {"en": "[Bookend] Ayah 4 and Ayah 8: Dust and Desire as Obscuring Forces", "tr": "[Kitap Sonu] Ayet 4 ve Ayet 8: Karartıcı Güçler Olarak Toz ve Arzu"}, "text": {"en": "Testing 100:4 and 100:8: atharna bihi naq'an (100:4, raising dust that obscures the battlefield, root '-th-r + n-q-') pairs with li-hubbi l-khayri la-shadid (100:8, intense love of wealth, roots h-b-b + kh-y-r + sh-d-d). The dust cloud (100:4) is physical obscuration; the love of wealth (100:8) is moral obscuration -- desire blinds judgment as dust blinds sight. Both ayahs describe a force that prevents clear perception: one external and environmental, one internal and dispositional. The agricultural thread deepens the link: the ploughing (100:4, '-th-r) produces dust that hides, while the barren soil (100:6, k-n-d) connects to the fierce attachment (100:8) that prevents spiritual yield.", "tr": "100:4 ve 100:8'i test etme: atharna bihi naq'an (100:4, savaş alanını karatan toz kaldırma, '-th-r + n-q-' kökleri) li-hubbi l-khayri la-shadid (100:8, mal sevgisinde yoğunluk, h-b-b + kh-y-r + sh-d-d kökleri) ile eşleşir. Toz bulutu (100:4) fiziksel karartmadır; mal sevgisi (100:8) ahlaki karartmadır — arzu yargıyı toz görüşü köreltiği gibi köreltir. Her iki ayet de net algıyı engelleyen bir gücü anlatır: biri dış ve çevresel, diğeri iç ve yapısal. Tarımsal dizgi bağlantıyı derinleştirir: sürme (100:4, '-th-r) gizleyen toz üretir, kısır toprak (100:6, k-n-d) ise manevi verime engel olan şiddetli bağlanmaya (100:8) bağlanır."}}, {"type": "DISCOVERY", "ref": "100:5", "threadId": "cross_concentric_5_6", "title": {"en": "[Concentric] Ayah 5 and Ayah 6: Penetrating the Centre", "tr": "[Konsantrik] Ayet 5 ve Ayet 6: Merkeze Nüfuz Etme"}, "text": {"en": "Testing the innermost symmetric pair 100:5 and 100:6: fa-wasatna bihi jam'an (100:5, \"they penetrated the centre of a host,\" root w-s-t) meets inna l-insana li-rabbihi la-kanud (100:6, \"the human is ungrateful to his Lord,\" roots '-n-s + r-b-b + k-n-d). The verb wasatna (100:5) literally means \"entered the middle\" -- and 100:5-100:6 IS the middle of the 11-ayah surah. The structural pivot is marked by the semantics of centrality itself. The oath's climactic act -- plunging into the midst -- is answered by the surah plunging into its own core claim. This is the only point where physical action and structural function coincide: the word for \"centre\" sits at the centre.", "tr": "En içteki simetrik çift 100:5 ve 100:6'yı test etme: fa-wasatna bihi jam'an (100:5, \"bir ordunun merkezine nüfuz ettiler\", w-s-t kökü) inna l-insana li-rabbihi la-kanud (100:6, \"insan Rabbine karşı nankördür\", '-n-s + r-b-b + k-n-d kökleri) ile buluşur. Wasatna fiili (100:5) kelimenin tam anlamıyla \"ortaya girdi\" demektir — ve 100:5-100:6, 11 ayetlik surenin ortasıDIR. Yapısal dönüş noktası, merkezilik semantiğinin kendisi tarafından işaretlenir. Yeminin doruk eylemi -- ortasına dalma -- surenin kendi çekirdek iddiasına dalmasıyla yanıtlanır. Bu, fiziksel eylemin ve yapısal işlevin çakıştığı tek noktadır: \"merkez\" kelimesi merkezde oturur."}}, {"type": "DISCOVERY", "ref": "100:1", "threadId": "cross_escalation_agency", "title": {"en": "[Escalation] Five-Stage Progressive Agency Loss", "tr": "[Tırmanlama] Beş Aşamalı İlerleyici Faillik Kaybı"}, "text": {"en": "Across the full surah, grammatical agency progressively diminishes in five stages: (1) active participles describing the horses' nature (100:1-100:3, al-'adiyat, al-muriyat, al-mughirat); (2) active past-tense verbs narrating their actions (100:4-100:5, atharna, wasatna); (3) stative adjectives diagnosing the human condition (100:6-100:8, kanud, shahid, shadid -- no verb, no action); (4) passive verbs where the human is acted upon by unnamed forces (100:9-100:10, bu'thira, hussila); (5) divine attribute where God alone retains full agency as subject (100:11, khabir). The trajectory is: being active -> doing active -> being diagnosed -> being acted upon -> God knowing. Human agency evaporates across five grammatically distinct stages spanning all four sections.", "tr": "Surenin tamamında dilbilgisel faillik beş aşamada kademeli olarak azalır: (1) atların doğasını tanımlayan etken ortaçlar (100:1-100:3, al-'adiyat, al-muriyat, al-mughirat); (2) eylemlerini anlatan etken geçmiş zaman fiilleri (100:4-100:5, atharna, wasatna); (3) insan durumunu teşhis eden durum sıfatları (100:6-100:8, kanud, shahid, shadid -- fiil yok, eylem yok); (4) insanın adı verilmemiş güçler tarafından eyleme maruz kaldığı pasif fiiller (100:9-100:10, bu'thira, hussila); (5) yalnızca Allah'ın özne olarak tam failliği elinde tuttuğu ilahi sıfat (100:11, khabir). Yörünge şudur: etken varlık -> etken yapma -> teşhis edilmiş varlık -> eyleme maruz kalma -> Allah'ın bilmesi. İnsan failliği tüm dört bölümü kapsayan beş dilbilgisel olarak farklı aşamada buharlaşır."}}, {"type": "DISCOVERY", "ref": "100:1", "threadId": "cross_contrapuntal", "title": {"en": "[Contrapuntal] Louder Rhetoric, Quieter Imagery", "tr": "[Kontrpuantal] Daha Yüksek Retorik, Daha Sessiz İmgelem"}, "text": {"en": "The surah runs two simultaneous trajectories in opposite directions: (1) rhetorical emphasis escalates from oath formula (waw al-qasam, 100:1) through triple inna...la- (100:6, 100:7, 100:8) to the climactic inna...la- with God as subject (100:11); (2) kinetic energy de-escalates from thundering cavalry (100:1-100:5, feminine plural participles, fire, dust, penetration) through still diagnosis (100:6-100:8, singular al-insan, no movement) to the single quiet word khabir (100:11, no kinetic energy, pure cognition). The loudest section (100:1-100:5) carries the lightest theological weight; the quietest ayah (100:11) carries the heaviest. These opposing vectors produce a contrapuntal tension visible only when both trajectories are traced simultaneously.", "tr": "Sure iki eşzamanlı yörüngeyi zıt yönlerde işletir: (1) retorik vurgu yemin formülünden (waw al-qasam, 100:1) üçlü inna...la- (100:6, 100:7, 100:8) yoluyla Allah'ın özne olduğu doruk inna...la-'ya (100:11) tırmanır; (2) kinetik enerji gümbürdayan süvariden (100:1-100:5, dişil çoğul ortaçlar, ateş, toz, nüfuz) durağan teşhise (100:6-100:8, tekil al-insan, hareket yok) tek sessiz kelime khabir'e (100:11, kinetik enerji yok, saf biliş) inerken azalır. En gürültülü bölüm (100:1-100:5) en hafif teolojik ağırlığı taşır; en sessiz ayet (100:11) en ağırını taşır. Bu zıt vektörler, yalnızca her iki yörünge de aynı anda izlendiğinde görülebilen bir kontrpuantal gerilim üretir."}}, {"type": "CONFIRMED", "ref": "100:1", "threadId": "cross_parallel_variants", "title": {"en": "[Parallel] Variant Type Segregation Matches Structural Zones", "tr": "[Paralel] Varyant Türü Ayrışımı Yapısal Bölgelerle Eşleşir"}, "text": {"en": "The surah's 18 qira'at variants sort with perfect precision into three structural zones independently identified by grammatical analysis: dot-placement variants (nuqat) appear only in the oath (100:1-100:5), phonological/sukun variants appear only in the theological diagnosis (100:6-100:8), and semantic/voice/substitution variants (Pss, ibdal, Lx) appear only in the eschatological section (100:9-100:11). Zero overlap between variant type categories and structural zones. This triple confirmation -- grammar, root distribution, and variant tradition converging on identical boundaries -- is the strongest architectural finding in the surah.", "tr": "Surenin 18 kıraat varyantı, dilbilgisel analiz tarafından bağımsız olarak tanımlanan üç yapısal bölgeye mükemmel hassasiyetle sıralanır: nokta yerleşimi varyantları (nuqat) yalnızca yeminde (100:1-100:5) görünür, fonolojik/sukun varyantları yalnızca teolojik teşhiste (100:6-100:8) görünür ve semantik/ses/ikame varyantları (Pss, ibdal, Lx) yalnızca eskatoljik bölümde (100:9-100:11) görünür. Varyant türü kategorileri ile yapısal bölgeler arasında sıfır örtüşme. Bu üçlü teyit -- dilbilgisi, kök dağılımı ve varyant geleneği özdeş sınırlarda yakınsıyor -- suredeki en güçlü mimari bulgudur."}}, {"type": "DISCOVERY", "ref": "100:1", "threadId": "cross_lexical_mirror", "title": {"en": "[Mirror] Semantic Echo across Total Lexical Disjunction", "tr": "[Ayna] Tam Sözcüksel Ayrılık Boyunca Semantik Yankı"}, "text": {"en": "The symmetric bookend correspondences (100:1/100:11, 100:2/100:10, 100:3/100:9, 100:4/100:8, 100:5/100:6) demonstrate that the oath section (100:1-100:5) and declaration section (100:6-100:11) mirror each other semantically -- runners/knower, extraction/extraction, dawn/judgment-day, dust/desire, centre/centre -- despite sharing zero root vocabulary. The absolute lexical partition (0 of 25 roots crossing the 100:5/100:6 boundary) means these semantic echoes are achieved entirely through synonymy and metaphor, never through root repetition. Meaning resonates across total lexical silence. This is the surah's deepest structural paradox: its two halves say the same things with entirely different words.", "tr": "Simetrik kitap sonu yazışmaları (100:1/100:11, 100:2/100:10, 100:3/100:9, 100:4/100:8, 100:5/100:6), yemin bölümünün (100:1-100:5) ve beyan bölümünün (100:6-100:11) semantik olarak birbirini yansıttığını gösterir -- koşanlar/bilen, çıkarma/çıkarma, şafak/yargı-günü, toz/arzu, merkez/merkez -- sıfır kök sözcük paylaşımına rağmen. Mutlak sözcüksel bölünme (25 kökten 0'ı 100:5/100:6 sınırını geçiyor), bu semantik yankıların tamamen eş anlamlılık ve metafor yoluyla sağlandığı, asla kök tekrarı yoluyla olmadığı anlamına gelir. Anlam, tam sözcüksel sessizlik boyunca yankılanır. Bu, surenin en derin yapısal paradoksudur: iki yarısı aynı şeyleri tamamen farklı kelimelerle söyler."}}], "threads": [], "technicals": []}], "arcs": [{"from": "100:1", "to": "100:2", "arcType": "root", "label": {"en": "d-b-h (scorching) to w-r-y (kindling): fire-chain", "tr": "d-b-h (yakıcı) - w-r-y (tutuşturma): ateş zinciri"}}, {"from": "100:2", "to": "100:3", "arcType": "semantic", "label": {"en": "Fire (100:2) to dawn-light (100:3): disclosure escalation", "tr": "Ateş (100:2) - şafak-ışığı (100:3): ifşa tırmanışı"}}, {"from": "100:4", "to": "100:5", "arcType": "structural", "label": {"en": "Paired consequences: atharna bihi / wasatna bihi (identical bihi construction)", "tr": "Eşleşen sonuçlar: atharna bihi / wasatna bihi (özdeş bihi yapısı)"}}, {"from": "100:5", "to": "100:9", "arcType": "semantic", "label": {"en": "Penetrating a gathering (wasatna) foreshadows overturning graves (bu'thira): physical to eschatological disclosure", "tr": "Bir topluluğa nüfuz etme (wasatna), kabirleri alt üst etmeyi (bu'thira) önceden haber verir: fiziksel - eskatoljik ifşa"}}, {"from": "100:4", "to": "100:6", "arcType": "semantic", "label": {"en": "'-th-r (ploughing) to k-n-d (barren soil): agricultural thread", "tr": "'-th-r (sürme) - k-n-d (kısır toprak): tarımsal dizgi"}}, {"from": "100:1", "to": "100:6", "arcType": "structural", "label": {"en": "Oath (active horses) to verdict (passive human): the structural contrast", "tr": "Yemin (etken atlar) - hüküm (pasif insan): yapısal tezat"}}, {"from": "100:7", "to": "100:8", "arcType": "root", "label": {"en": "shahid / shadid: single-consonant phonetic-semantic bond", "tr": "shahid / shadid: tek-sessiz fonetik-semantik bağ"}}, {"from": "100:8", "to": "100:1", "arcType": "semantic", "label": {"en": "If al-khayr = horses, 100:8 loops back to the oath imagery (ring structure)", "tr": "Eğer al-khayr = atlar, 100:8, yemin imgesine geri döner (halka yapısı)"}}, {"from": "100:6", "to": "100:8", "arcType": "structural", "label": {"en": "The 38:32 parallel: hubb al-khayr + forgetting rabb = kanud + shadid", "tr": "38:32 paraleli: hubb al-khayr + rabb'ı unutma = kanud + shadid"}}, {"from": "100:5", "to": "100:9", "arcType": "structural", "label": {"en": "wasatna (active penetration) to bu'thira (passive overturning): voice reversal across sections", "tr": "wasatna (etken nüfuz) - bu'thira (pasif alt üst etme): bölümler arası ses terslemesi"}}, {"from": "100:9", "to": "100:10", "arcType": "structural", "label": {"en": "qubur / sudur: outer container to inner container, fu'ul rhyme pair", "tr": "qubur / sudur: dış kap - iç kap, fu'ul kafiye çifti"}}, {"from": "100:4", "to": "100:10", "arcType": "root", "label": {"en": "'-th-r (ploughing) to h-s-l (harvesting): agricultural thread complete", "tr": "'-th-r (sürme) - h-s-l (hasat): tarımsal dizgi tamamlandı"}}, {"from": "100:6", "to": "100:10", "arcType": "semantic", "label": {"en": "k-n-d (barren soil) to h-s-l (harvest-sifting): the barren land faces the threshing floor", "tr": "k-n-d (kısır toprak) - h-s-l (hasat-ayıklama): kısır toprak harman yeriyle yüzleşir"}}, {"from": "100:2", "to": "100:11", "arcType": "root", "label": {"en": "w-r-y (concealment/kindling) to kh-b-r (penetrating/ploughing): bookend roots of the concealment-disclosure arc", "tr": "w-r-y (gizlenme/tutuşturma) - kh-b-r (nüfuz etme/sürme): gizlenme-ifşa yayının kitap sonu kökleri"}}, {"from": "100:6", "to": "100:11", "arcType": "root", "label": {"en": "r-b-b inclusio: li-rabbihi (singular) to rabbahum (plural), framing the declaration section", "tr": "r-b-b inklüzyosu: li-rabbihi (tekil) - rabbahum (çoğul), beyan bölümünü çerçeveleme"}}, {"from": "100:9", "to": "100:11", "arcType": "structural", "label": {"en": "a-fa-la ya'lamu (100:9) to khabir (100:11): the question of knowing answered by the One who knows", "tr": "a-fa-la ya'lamu (100:9) - khabir (100:11): bilme sorusu Bilen tarafından yanıtlanır"}}, {"from": "100:4", "to": "100:11", "arcType": "semantic", "label": {"en": "'-th-r (physical ploughing) to kh-b-r (metaphysical ploughing): agricultural thread's deepest connection", "tr": "'-th-r (fiziksel sürme) - kh-b-r (metafiziksel sürme): tarımsal dizginin en derin bağlantısı"}}, {"from": "100:2", "to": "100:11", "arcType": "structural", "label": {"en": "[Ring] w-r-y concealment/kindling (100:2) <-> kh-b-r penetration/ploughing (100:11)", "tr": "[Halka] w-r-y gizlenme/tutuşturma (100:2) <-> kh-b-r nüfuz etme/sürme (100:11)"}}, {"from": "100:1", "to": "100:11", "arcType": "structural", "label": {"en": "[Bookend] al-'adiyat runners (100:1) <-> khabir knower (100:11)", "tr": "[Kitap Sonu] al-'adiyat koşanlar (100:1) <-> khabir bilen (100:11)"}}, {"from": "100:2", "to": "100:10", "arcType": "structural", "label": {"en": "[Bookend] extraction from stone (100:2) <-> extraction from breasts (100:10)", "tr": "[Kitap Sonu] taştan çıkarma (100:2) <-> göğüslerden çıkarma (100:10)"}}, {"from": "100:3", "to": "100:9", "arcType": "structural", "label": {"en": "[Bookend] military dawn (100:3) <-> eschatological dawn (100:9)", "tr": "[Kitap Sonu] askeri şafak (100:3) <-> eskatoljik şafak (100:9)"}}, {"from": "100:4", "to": "100:8", "arcType": "structural", "label": {"en": "[Bookend] dust obscures sight (100:4) <-> desire obscures judgment (100:8)", "tr": "[Kitap Sonu] toz görüşü karartır (100:4) <-> arzu yargıyı karartır (100:8)"}}, {"from": "100:5", "to": "100:6", "arcType": "structural", "label": {"en": "[Concentric] wasatna \"entered the centre\" (100:5) <-> the surah's thematic centre (100:6)", "tr": "[Konsantrik] wasatna \"merkeze girdi\" (100:5) <-> surenin tematik merkezi (100:6)"}}, {"from": "100:1", "to": "100:11", "arcType": "structural", "label": {"en": "[Escalation] active participles (100:1-3) -> active verbs (100:4-5) -> statives (100:6-8) -> passives (100:9-10) -> divine attribute (100:11)", "tr": "[Tırmanlama] etken ortaçlar (100:1-3) -> etken fiiller (100:4-5) -> durum bildiren (100:6-8) -> pasif (100:9-10) -> ilahi sıfat (100:11)"}}, {"from": "100:1", "to": "100:11", "arcType": "structural", "label": {"en": "[Contrapuntal] kinetic loudness (100:1-5) inversely proportional to theological weight (100:11)", "tr": "[Kontrpuantal] kinetik gürültü (100:1-5), teolojik ağırlıkla (100:11) ters orantılı"}}, {"from": "100:5", "to": "100:6", "arcType": "structural", "label": {"en": "[Parallel] structural boundary at 100:5/6 confirmed by grammar + roots + variant types", "tr": "[Paralel] 100:5/6'daki yapısal sınır dilbilgisi + kökler + varyant türleri tarafından teyit edildi"}}, {"from": "100:8", "to": "100:9", "arcType": "structural", "label": {"en": "[Parallel] structural boundary at 100:8/9 confirmed by grammar + roots + variant types", "tr": "[Paralel] 100:8/9'daki yapısal sınır dilbilgisi + kökler + varyant türleri tarafından teyit edildi"}}, {"from": "100:1", "to": "100:6", "arcType": "structural", "label": {"en": "[Mirror] oath section (100:1-5) semantically mirrors declaration (100:6-11) across zero shared roots", "tr": "[Ayna] yemin bölümü (100:1-5) semantik olarak beyandan (100:6-11) sıfır paylaşılan kök boyunca yansır"}}], "threads": {"fire-chain": [{"stage": "planted", "ref": "100:1", "text": {"en": "The scorching sense of d-b-h plants fire in the surah's opening syllable. What sounds like breath is already flame.", "tr": "D-b-h'ın yakıcı anlamı, surenin açılış hecesine ateş eker. Nefes gibi görünen şey zaten alevdir."}}, {"stage": "developed", "ref": "100:2", "text": {"en": "The fire planted in d-b-h (scorching breath) now becomes literal: sparks fly from hooves. The chain runs: heat (100:1) to flame (100:2).", "tr": "D-b-h'ta (yakıcı nefes) ekilen ateş şimdi gerçek olur: toynaklar kıvılcım saçar. Zincir işler: sıcaklık (100:1), alev (100:2)."}}, {"stage": "developed", "ref": "100:8", "text": {"en": "Intensity (shadid) in the human mirrors the intensity of the oath: fierce charge (100:1-5) and fierce love (100:8) are parallel manifestations. Fire in breath (100:1), sparks (100:2), and now burning desire.", "tr": "İnsandaki yoğunluk (shadid) yemindeki yoğunluğu yansıtır: şiddetli hücum (100:1-5) ve şiddetli sevgi (100:8) paralel tezahürlerdir. Nefeste ateş (100:1), kıvılcımlar (100:2) ve şimdi yanan arzu."}}, {"stage": "harvested", "ref": "100:11", "text": {"en": "The fire chain resolves: scorching breath (100:1), visible sparks (100:2), and burning desire (100:8) culminate in khabir — penetrating knowledge that is the final light, leaving nothing in darkness.", "tr": "Ateş zinciri çözülür: yakıcı nefes (100:1), görünür kıvılcımlar (100:2) ve yanan arzu (100:8), khabir'de doruğa ulaşır — hiçbir şeyi karanlıkta bırakmayan nüfuz eden bilgi olan nihai ışık."}}], "concealment-disclosure": [{"stage": "planted", "ref": "100:2", "text": {"en": "The root w-r-y encodes the surah's deepest pattern at the lexicographic level: concealment (wara'a) and disclosure (awra) are held within a single root. The sparks are hidden fire made visible.", "tr": "W-r-y kökü, surenin en derin desenini leksikografik düzeyde kodlar: gizlenme (wara'a) ve ifşa (awra) tek bir kök içinde tutulur. Kıvılcımlar, gizli ateşin görünür hâle gelmesidir."}}, {"stage": "developed", "ref": "100:4", "text": {"en": "Dust re-conceals the scene. The surah's disclosure pattern oscillates: fire reveals (100:2), dawn reveals (100:3), dust conceals again (100:4). The concealment will persist until eschatological stripping.", "tr": "Toz sahneyi yeniden gizler. Surenin ifşa deseni salınır: ateş açığa çıkarır (100:2), şafak açığa çıkarır (100:3), toz tekrar gizler (100:4). Gizlenme, eskatoljik soyulmaya kadar sürecektir."}}, {"stage": "developed", "ref": "100:5", "text": {"en": "The horses penetrate the concealing mass of a gathered host, breaking it open. Physical penetration of a gathering foreshadows eschatological penetration of graves (100:9) and chests (100:10).", "tr": "Atlar toplu bir toplantının gizleyici kütlesine nüfuz eder, onu kırar. Bir topluluğa fiziksel nüfuz, kabirlere (100:9) ve göğüslere (100:10) eskatoljik nüfuzu önceden haber verir."}}, {"stage": "developed", "ref": "100:6", "text": {"en": "Ingratitude is a form of concealment: the kanud hides blessings from acknowledgment. The surah moves from physical concealment (dust, 100:4) to moral concealment (ingratitude, 100:6).", "tr": "Nankörlük bir gizleme biçimidir: kanud nimetleri ikrardan gizler. Sure, fiziksel gizlemeden (toz, 100:4) ahlaki gizlemeye (nankörlük, 100:6) geçer."}}, {"stage": "developed", "ref": "100:7", "text": {"en": "Shahid (witness) means concealment is already breached from within. Whether the human witnesses himself or God witnesses him, the inner state of kanud is no longer hidden.", "tr": "Shahid (şahit) gizlenmenin zaten içeriden delindiği anlamına gelir. İnsan kendine tanıklık etsin veya Allah ona tanıklık etsin, kanud'un iç hâli artık gizli değildir."}}, {"stage": "developed", "ref": "100:9", "text": {"en": "Graves — the ultimate containers of concealment — are forced open. The physical disclosure of 100:2-5 (fire, dawn, dust) now becomes eschatological. What was buried will be exposed.", "tr": "Kabirler — gizlenmenin nihai kapları — zorla açılır. 100:2-5'in fiziksel ifşası (ateş, şafak, toz) şimdi eskatoljik olur. Gömülü olan ifşa edilecektir."}}, {"stage": "harvested", "ref": "100:10", "text": {"en": "The master arc reaches its penultimate step: breasts sifted open, contents laid bare. From hidden fire (100:2) through moral concealment (100:6) to forced disclosure of the innermost self. Only divine knowledge (100:11) remains.", "tr": "Ana yay sondan bir önceki adımına ulaşır: göğüsler ayıklanarak açılır, içindekiler açığa serilir. Gizli ateşten (100:2) ahlaki gizlemeye (100:6) en içteki benliğin zorla ifşasına. Yalnızca ilahi bilgi (100:11) kalır."}}, {"stage": "harvested", "ref": "100:11", "text": {"en": "The master arc completes. From fire hidden in stone (100:2) through moral concealment (100:6) and self-witness (100:7) through exhumation and extraction (100:9-10), everything arrives at khabir: the One whose knowing is etymologically a ploughing, a penetration beneath every surface. The w-r-y (conceal/kindle) to kh-b-r (penetrate/plough) bookend closes the seven-ayah arc.", "tr": "Ana yay tamamlanır. Taşta gizli ateşten (100:2) ahlaki gizleme (100:6) ve öz-tanıklık (100:7) aracılığıyla mezardan çıkarma ve göğüslerden ayıklama (100:9-10) yoluyla her şey khabir'e varır: bilmesi etimolojik olarak bir sürme, her yüzeyin altına bir nüfuz olan Olan. W-r-y (gizlemek/tutuşturmak) - kh-b-r (nüfuz etmek/sürmek) kitap sonu yedi ayetlik yayı kapatır."}}], "agricultural": [{"stage": "planted", "ref": "100:4", "text": {"en": "The root '-th-r carries \"to plough\" alongside \"to stir up dust.\" The earth is turned — an agricultural act dressed in martial imagery.", "tr": "'-th-r kökü \"tozu karıştırmak\"ın yanı sıra \"sürmek\" anlamını taşır. Toprak çevrilir — savaşçıl imgelere bürünmüş tarımsal bir eylem."}}, {"stage": "developed", "ref": "100:6", "text": {"en": "The ploughed earth of 100:4 is now diagnosed: it is kanud — barren soil. The human receives rain (divine nurturing through rabb) but produces nothing. The harvest is still coming.", "tr": "100:4'ün sürülmüş toprağı şimdi teşhis edilir: o kanud'dur — kısır topraktır. İnsan yağmur alır (rabb aracılığıyla ilahi besleme) ama hiçbir şey üretmez. Hasat hâlâ geliyor."}}, {"stage": "harvested", "ref": "100:10", "text": {"en": "The agricultural sub-narrative completes: ploughing (100:4) to barren soil (100:6) to harvest-sifting (100:10). Three roots independently carry agricultural meanings beneath the martial surface, forming a coherent narrative visible only through cross-ayah root analysis.", "tr": "Tarımsal alt anlatı tamamlanır: sürme (100:4), kısır toprak (100:6), hasat-ayıklama (100:10). Savaşçıl yüzeyin altında üç kök bağımsız olarak tarımsal anlamlar taşır, yalnızca ayetler arası kök analizi yoluyla görülebilen tutarlı bir anlatı oluşturur."}}, {"stage": "harvested", "ref": "100:11", "text": {"en": "The agricultural arc reaches its final resonance in a divine name: ploughing (100:4) to barren soil (100:6) to harvest (100:10) to the divine Ploughman (100:11). Four roots across four sections, invisible beneath the martial surface, forming a sub-narrative visible only through lexicographic analysis.", "tr": "Tarımsal yay nihai yankısını ilahi bir isimde bulur: sürme (100:4), kısır toprak (100:6), hasat (100:10), ilahi Çiftçi (100:11). Dört bölümde dört kök, savaşçıl yüzeyin altında görünmez, yalnızca leksikografik analiz yoluyla görülebilen bir alt anlatı oluşturur."}}], "lexical-partition": [{"stage": "planted", "ref": "100:5", "text": {"en": "At this exact point, the surah's vocabulary resets entirely. Not a single root from the oath section will appear again. The total lexical partition is about to become audible.", "tr": "Tam bu noktada surenin sözcük dağarcığı tamamen sıfırlanır. Yemin bölümünden tek bir kök bile bir daha görünmeyecektir. Tam sözcüksel bölünme işitilebilir hâle gelmek üzeredir."}}, {"stage": "harvested", "ref": "100:11", "text": {"en": "The lexical partition holds absolutely: 10 roots in the oath (100:1-5), 15 in the declaration (100:6-11), zero overlap. R-b-b, the only root appearing twice, frames the declaration section as an inclusio (100:6, 100:11). The surah's two halves are composed from entirely separate vocabularies.", "tr": "Sözcüksel bölünme mutlak olarak tutar: yeminde 10 kök (100:1-5), beyanda 15 kök (100:6-11), sıfır örtüşme. İki kez geçen tek kök r-b-b, beyan bölümünü inklüzyo olarak çerçeveler (100:6, 100:11). Surenin iki yarısı tamamen ayrı sözcüklerden oluşturulmuştur."}}], "variant-zones": [{"stage": "planted", "ref": "100:1", "text": {"en": "Dot-placement variants appear only in the oath section (100:1-5). The surah's recitation traditions will mirror its structural architecture with perfect precision — each zone carrying a different variant type.", "tr": "Nokta yerleşimi varyantları yalnızca yemin bölümünde (100:1-5) görünür. Surenin kıraat gelenekleri, yapısal mimarisini mükemmel hassasiyetle yansıtacaktır — her bölge farklı bir varyant türü taşır."}}, {"stage": "developed", "ref": "100:9", "text": {"en": "The eschatological section (100:9-11) carries 10 of the surah's 18 qira'at variants — over half, concentrated in three ayahs. These are exclusively meaning-changing types (Pss, ibdal, Lx), unlike the harmless dot variants of the oath or phonological variants of the diagnosis.", "tr": "Eskatoljik bölüm (100:9-11), surenin 18 kıraat varyantından 10'unu taşır — yarısından fazlası üç ayette yoğunlaşır. Bunlar yalnızca anlam değiştiren türlerdir (Pss, ibdal, Lx), yeminin zararsız nokta varyantları veya teşhisin fonolojik varyantlarından farklı olarak."}}, {"stage": "harvested", "ref": "100:11", "text": {"en": "The variant-zone segregation holds to the end: 100:11's two variants (inna/anna particle, lam removal) belong to types (in/an, hf) found only in the eschatological zone. Across all 18 variants and three structural zones, the correlation between variant type and surah architecture is perfect.", "tr": "Varyant-bölge ayrışımı sona kadar tutar: 100:11'in iki varyantı (inna/anna edatı, lam kaldırılması) yalnızca eskatoljik bölgede bulunan türlere (in/an, hf) aittir. Tüm 18 varyant ve üç yapısal bölge boyunca, varyant türü ile sure mimarisi arasındaki korelasyon mükemmeldir."}}], "agency": [{"stage": "planted", "ref": "100:1", "text": {"en": "Active voice dominates the oath: participles (characterizing being) give way to verbs (narrating action). The creatures are maximally agentive. This will be reversed.", "tr": "Etken ses yeminde baskındır: ortaçlar (varlığı karakterize etme) fiillere (eylemi anlatma) yol verir. Yaratıklar maksimal faildir. Bu tersine dönecektir."}}, {"stage": "developed", "ref": "100:9", "text": {"en": "The voice shifts from active (the horses ACT) to passive (the graves are ACTED UPON). The human who charged vigorously loses all agency in the eschatological scene. Variant traditions contest this passivity, redistributing agency across the spectrum.", "tr": "Ses etkenden (atlar HAREKET eder) pasife (kabirler HAREKET EDİLİR) kayar. Güçlü bir şekilde hücum eden insan, eskatoljik sahnede tüm failliğini kaybeder. Varyant gelenekleri bu pasifliği tartışır, failliği spektrum boyunca yeniden dağıtır."}}, {"stage": "developed", "ref": "100:10", "text": {"en": "Three variant forms of hussila distribute agency across the full spectrum: autonomous emergence (hasala), divine extraction (hassala), ontological shift (hasila). The standard passive is flanked by alternatives that make the theological question explicit.", "tr": "Hussila'nın üç varyant biçimi failliği tam spektrum boyunca dağıtır: otonom ortaya çıkış (hasala), ilahi çıkarma (hassala), ontolojik kayma (hasila). Standart pasif, teolojik soruyu açık hâle getiren alternatiflerle çevrilir."}}, {"stage": "harvested", "ref": "100:11", "text": {"en": "The agency arc completes: active horses (100:1-5), passive human (100:9-10), divine knower (100:11). God is the sole named agent at the surah's close — not charging, not striking, but knowing. Creaturely agency gives way to divine agency of a wholly different kind.", "tr": "Faillik yayı tamamlanır: etken atlar (100:1-5), pasif insan (100:9-10), ilahi bilen (100:11). Allah, surenin kapanışında tek adı verilen faildir — hücum etmeyen, çarpmayan, ancak bilen. Yaratık failliği tamamen farklı bir türden ilahi failliğe yol verir."}}]}, "openQuestions": [{"ref": "100:8", "text": {"en": "Is al-khayr wealth, moral good, or horses? If horses, the surah forms a ring: the oath's steeds become the object of misplaced love. The 38:32 Sulayman parallel activates fully. The root kh-y-r means \"to choose\" — al-khayr is \"the chosen thing,\" and the choice itself may be the diagnosis.", "tr": "Al-khayr mal mı, ahlaki iyilik mi, yoksa atlar mı? Eğer atlar ise sure bir halka oluşturur: yeminin atları yanlış yere konmuş sevginin nesnesi olur. 38:32 Süleyman paraleli tamamen aktive olur. Kh-y-r kökü \"seçmek\" anlamına gelir — al-khayr \"seçilen şey\"dir ve seçimin kendisi teşhis olabilir."}}, {"ref": "100:1", "text": {"en": "The referent of al-'adiyat remains genuinely unresolved. Horses, camels, warriors, or abstract forces of transgression? The root '-d-w carries both \"running\" and \"enmity\" (Lane's). The qira'at variant al-ghadiyati (\"those going forth at dawn\") supports the camel reading. The polysemy may be deliberate: the surah's opening resists identification, letting the image serve multiple readings simultaneously.", "tr": "Al-'adiyat'ın atıfta bulunduğu gerçekten çözümlenmemiş kalır. Atlar, develer, savaşçılar mı yoksa soyut tecavüz güçleri mi? '-d-w kökü hem \"koşma\" hem de \"düşmanlık\" anlamlarını taşır (Lane's). Al-ghadiyati kıraat varyantı (\"şafakta gidenler\") deve okumasını destekler. Çokanlamlılık kasıtlı olabilir: surenin açılışı tanımlamaya direnç gösterir, imgenin aynı anda birden fazla okumaya hizmet etmesine izin verir."}}, {"ref": "100:7", "text": {"en": "The pronoun in \"he is witness\" sustains a productive triple ambiguity: the human witnessing against himself, God witnessing over the human, or both at once. The grammar enables all three. The choice determines whether the surah presents a psychological portrait (self-aware ingratitude), a juridical warning (divine surveillance), or a deliberately bivalent text.", "tr": "\"O şahittir\"deki zamir üretken bir üçlü belirsizliği sürdürür: insan kendine karşı tanıklık eder, Allah insan üzerine tanıklık eder veya her ikisi birden. Dilbilgisi her üçünü de mümkün kılar. Seçim, surenin psikolojik bir portre (öz-farkındalıklı nankörlük), hukuki bir uyarı (ilahi gözetim) veya kasıtlı olarak iki değerli bir metin sunup sunmadığını belirler."}}], "handoff": [{"en": "The concealment-to-disclosure master arc (7 nodes across 7 ayahs, roots w-r-y, '-th-r, k-n-d, sh-h-d, b-'-th-r, h-s-l, kh-b-r) should be tested against other oath surahs (91, 92, 103) to determine whether root-level concealment-disclosure polarity is a feature of the oath-surah genre or specific to Surah 100.", "tr": "Gizlenme-ifşa ana yayı (7 ayete yayılmış 7 düğüm, kökler w-r-y, '-th-r, k-n-d, sh-h-d, b-'-th-r, h-s-l, kh-b-r), kök düzeyinde gizlenme-ifşa kutbunun yemin-sure türünün bir özelliği mi yoksa Sure 100'e özgü mü olduğunu belirlemek için diğer yemin sureleriyle (91, 92, 103) test edilmelidir."}, {"en": "The agricultural sub-narrative ('-th-r 100:4, k-n-d 100:6, h-s-l 100:10, kh-b-r 100:11) warrants cross-surah validation against Quranic agricultural parables (2:261, 14:24-26, 48:29) to test whether the metaphor is locally emergent or draws on a broader register.", "tr": "Tarımsal alt anlatı ('-th-r 100:4, k-n-d 100:6, h-s-l 100:10, kh-b-r 100:11), metaforun yerel olarak ortaya çıktığını mı yoksa daha geniş bir kaydeden çekip çekmediğini test etmek için Kur'an tarımsal benzetmelerine (2:261, 14:24-26, 48:29) karşı sureler arası doğrulama gerektirir."}, {"en": "The symmetric bookend structure (100:1/11, 100:2/10, 100:3/9, 100:4/8, 100:5/6) needs cross-surah validation: do other 11-ayah surahs exhibit similar concentric patterning?", "tr": "Simetrik kitap sonu yapısı (100:1/11, 100:2/10, 100:3/9, 100:4/8, 100:5/6) sureler arası doğrulama gerektirir: diğer 11 ayetlik sureler benzer konsantrik desenler sergiler mi?"}, {"en": "The hussila triptych (hasala/hassala/hasila at 100:10) should be compared with other eschatological passives to test whether variant traditions systematically redistribute agency at such sites.", "tr": "Hussila üçlemesi (100:10'da hasala/hassala/hasila), varyant geleneklerinin böyle yerlerde failliği sistematik olarak yeniden dağıtıp dağıtmadığını test etmek için diğer eskatoljik pasiflerle karşılaştırılmalıdır."}, {"en": "The inna/anna variant at 100:11 reconfigures the surah's closing logic (independent assertion vs. subordinate clause). Phase 5 should examine whether similar particle variants at surah closings produce comparable reconfigurations elsewhere.", "tr": "100:11'deki inna/anna varyantı surenin kapanış mantığını yeniden yapılandırır (bağımsız iddia vs. bağlı cümle). Faz 5, benzer edat varyantlarının sure kapanışlarında başka yerlerde karşılaştırılabilir yeniden yapılandırmalar üretip üretmediğini incelemelidir."}]};
    const __EMBEDDED_AYAH_DATA__ = {"100:1": {"surah": 100, "ayah": 1, "arabic": "وَٱلْعَٰدِيَٰتِ ضَبْحًۭا", "transliteration": "wa-l-'ādiyāti ḍabḥan", "readings": [{"text": "By those that charge (in assault), panting", "textTr": "Koşarak saldıranlara andolsun, soluyarak", "rationale": "The oath particle wa- introduces an oath sworn by al-'ādiyāt (active participle, feminine plural of '-d-w), understood as charging/running entities, with ḍabḥan as a cognate accusative or ḥāl describing their panting breath. The runners can be war horses, camels, warriors, or any charging force.", "rationaleTr": "Yemin edatı وَ, ism-i fail kalıbındaki العاديات ile birlikte gelir. ضَبْحًا meful-u mutlak veya hal olarak soluma/nefes nefese kalma durumunu bildirir. Koşanlar savaş atları, develer, savaşçılar veya herhangi bir hücum eden güç olabilir."}, {"text": "By those that run with heavy breathing", "textTr": "Ağır nefesle koşanlara andolsun", "rationale": "al-'ādiyāt from '-d-w in the sense of running/sprinting (not hostility), with ḍabḥan describing the audible exhalation of effort. This focuses on physical exertion rather than aggression.", "rationaleTr": "العاديات kökü ع د و burada düşmanlık değil koşma/sprint anlamında kullanılır, ضَبْحًا fiziksel eforun duyulabilir nefes çıkışını ifade eder. Odak saldırı değil, fiziksel çaba üzerinedir."}, {"text": "By those that transgress, gasping", "textTr": "Haddi aşanlar, nefes nefese kalarak", "rationale": "'-d-w also carries \"to transgress, to exceed bounds.\" The 'ādiyāt can be those who transgress limits, and ḍabḥan describes the gasping that accompanies extreme exertion or agitation. This reading opens a moral dimension: the oath is by transgressors.", "rationaleTr": "ع د و kökü aynı zamanda \"haddi aşmak, sınırı geçmek\" anlamı taşır. العاديات sınırı aşanlar olabilir; ضَبْحًا aşırı efor veya ajitasyonun nefes darlığını betimler. Bu okuma ahlaki bir boyut açar: yemin haddi aşanlara yapılır."}, {"text": "By those that advance swiftly, with breath sounds (data streams, signals)", "textTr": "Hızla ilerleyenler, nefes sesleriyle (veri akışları, sinyaller)", "rationale": "In a futuristic reading, al-'ādiyāt can encompass any entities that rush/advance swiftly — vehicles, data packets, electromagnetic signals. ḍabḥan as the sound/vibration accompanying rapid transmission. The oath dignifies speed and purposeful motion across any era.", "rationaleTr": "Gelecekçi bir okumada العاديات hızla ilerleyen herhangi bir varlığı kapsayabilir: araçlar, veri paketleri, elektromanyetik sinyaller. ضَبْحًا hızlı iletimin eşlik eden ses/titreşimi olarak okunabilir. Yemin, her çağda hız ve amaçlı hareketi yüceltir."}, {"text": "By the running ones at dawn (reading ṣubḥan for ḍabḥan)", "textTr": "Sabah koşanlar (ضَبْحًا yerine صُبْحًا okunuşuyla)", "rationale": "The qira'at variant صُبْحًا (ṣubḥan, \"at dawn/morning\") from root ص ب ح replaces ضَبْحًا. This changes the temporal setting: the runners charge at dawn. Dawn raids are a classical military tactic. The oath binds the runners to a specific time — the liminal moment between darkness and light.", "rationaleTr": "Kıraat varyantı صُبْحًا (ṣubḥan, \"sabah vakti\") kökü ص ب ح ile gelir ve ضَبْحًا yerine geçer. Bu zamansal bağlamı değiştirir: koşanlar şafakta saldırır. Şafak baskınları klasik askeri taktiktir. Yemin, koşanları belirli bir zamana bağlar — karanlık ile aydınlık arasındaki eşik ana."}], "structure": {"beats": [{"label": "Oath formula", "labelTr": "Yemin kalıbı", "lines": [{"arabic": "وَٱلْعَٰدِيَٰتِ", "translit": "wa-l-'ādiyāti", "english": "By those that charge/run", "turkish": "Koşarak saldıranlara andolsun"}, {"arabic": "ضَبْحًۭا", "translit": "ḍabḥan", "english": "panting / gasping", "turkish": "soluyarak / nefes nefese"}]}], "summary": "A single-clause oath formula: the particle wa- introduces the sworn-by entity (al-'ādiyāt, feminine plural active participle in the genitive), qualified by a cognate/circumstantial accusative (ḍabḥan). The oath is incomplete — its jawāb (response/answer) comes in later ayahs. This verse establishes the sonic and kinetic imagery that builds through the following oaths (100:2-5) before the jawāb at 100:6. The structure is: oath-particle + sworn-entity + manner-qualifier.", "summaryTr": "Tek cümleli yemin kalıbı: وَ yemin edatı, yemin edilen varlığı (العاديات, mecrur dişil çoğul ism-i fail) sunar; ضَبْحًا meful-u mutlak veya hal olarak durumu nitelendirir. Yemin eksiktir — cevabı (جواب القسم) sonraki ayetlerde gelir. Bu ayet, 100:2-5 boyunca devam eden yeminlerden önce ses ve hareket imgesini kurar; cevap 100:6'da gelir. Yapı: yemin edatı + yemin edilen + durum niteleyicisi."}, "words": [{"id": 1, "arabic": "وَ", "translit": "wa", "gloss": "by (oath particle)", "glossTr": "andolsun (yemin edatı)", "userNotes": "", "root": "— (-)", "grammar": "Conjunction functioning as قَسَم (qasam, oath particle). Governs the genitive case on العاديات. Introduces the oath series that extends through 100:5.", "grammarTr": "Bağlaç, قَسَم (yemin) işlevinde. العاديات üzerinde mecrur hal hükümü verir. 100:5'e kadar devam eden yemin serisini başlatır.", "semantics": ["قَسَم (qasam): oath particle — \"I swear by,\" used to introduce solemn oaths", "عَطْف ('atf): coordination — \"and,\" joining parallel elements (not this context)", "استئناف (isti'naf): resumptive — marks new discourse section (not this context)", "Core concept: oath-introducing particle binding the speaker to what follows"], "semanticsTr": ["قَسَم (kasem): yemin edatı — \"andolsun,\" ciddi yeminleri başlatmak için kullanılır", "عَطْف (atıf): bağlama — \"ve,\" paralel unsurları birleştirir (bu bağlamda değil)", "استئناف (isti'naf): yeniden başlama — yeni söylem bölümü işareti (bu bağlamda değil)", "Kök kavram: konuşanı, takip edene bağlayan yemin başlatma edatı"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The وَ here functions as قَسَم (qasam), introducing a divine oath. This is the first in a series of five oath clauses (100:1-5). The oath-وَ governs the genitive on the following noun and creates an arc of escalating imagery — charging, sparking, raiding, dust-raising — before the jawab al-qasam (oath response) in 100:6. The choice of وَ rather than a more explicit oath formula (e.g., تَاللَّهِ) leaves the oath-swearer ambiguous: is this God swearing, or the Prophet instructed to swear? Both parsings are structurally valid.", "criticalTr": "Buradaki وَ قَسَم (kasem/yemin) işlevindedir, ilahi bir yemini başlatır. Bu, beş yeminlik serinin ilkidir (100:1-5). Yemin-وَ sonraki isim üzerinde mecrur hal hükümü verir ve hücum, kıvılcım, baskın, toz kaldırma gibi yoğunlaşan bir imgeler dizisi oluşturur — cevap 100:6'da gelir. Daha açık bir yemin kalıbı (تَاللَّهِ gibi) yerine وَ kullanımı yemin edenin kimliğini belirsiz bırakır: Allah mı yemin ediyor, yoksa Peygamber'e mi yemin ettirilmiştir? Her iki okuma yapısal olarak geçerlidir."}, {"id": 2, "arabic": "ٱلْعَٰدِيَٰتِ", "translit": "al-'ādiyāti", "gloss": "those that charge / the runners / the transgressors", "glossTr": "koşanlar / saldıranlar / haddi aşanlar", "userNotes": "", "root": "ع د و ('-d-w)", "grammar": "Feminine plural active participle (ism fā'il) from '-d-w, definite with al-, genitive case governed by oath-وَ. Form I participle عَادِي ('ādī) with feminine sound plural -āt suffix, yielding العاديات. The genitive ending -i reflects jarr by the oath particle.", "grammarTr": "ع د و kökünden dişil çoğul ism-i fail, belirli (ال- ile), yemin-وَ tarafından mecrur hale getirilmiş. I. bab ism-i fail عَادِي ('ādī) dişil sağlam çoğul -āt ekiyle العاديات olur. Mecrur -i takısı yemin edatının hükmünü yansıtır.", "semantics": ["فَعَلَ ('adā, I): to run, to gallop, to sprint, to race — said of horses and humans", "فَعَلَ ('adā, I): to attack, to assault, to charge against — with 'alā: to commit aggression upon", "فَعَلَ ('adā, I): to transgress, to exceed bounds, to go beyond what is right — related to عُدْوَان ('udwān, transgression)", "عَدُوّ ('aduww): enemy, adversary, foe — one who acts with hostility (Lane's: \"one who acts with enmity\")", "عَدْوَى ('adwā): infection, contagion — the running/spreading of disease (Hans Wehr); lit. \"that which runs from one to another\"", "عَدَا ('adā): to pass by, to pass beyond — \"the days passed by\" (Lane's: عَدَا الأَمْرَ = he passed beyond the affair)", "Classical (Lane's): عَدَا also means \"to deviate from the right course, to swerve\" — connoting moral or physical departure from the straight path", "Classical (Lisan al-Arab): عَدَا عَلَيْهِ = he wronged him, acted unjustly toward him; also عَدَّى = to cause to cross over, to transport across", "Modern: to rush, to dash — rapid purposeful movement of vehicles, data, signals, projectiles", "Futuristic: any entity that advances with speed and force — drones, autonomous systems, data streams racing through networks", "Core concept: rapid forward motion that can be neutral (running), hostile (attacking), or transgressive (exceeding bounds) — the root holds all three simultaneously"], "semanticsTr": ["فَعَلَ ('adā, I. bab): koşmak, dört nala gitmek, hızla ilerlemek — atlar ve insanlar için söylenir", "فَعَلَ ('adā, I. bab): saldırmak, hücum etmek — عَلَى ile birlikte: birine düşmanca davranmak", "فَعَلَ ('adā, I. bab): haddi aşmak, sınırı geçmek — عُدْوَان (udvan, tecavüz/saldırganlık) ile bağlantılı", "عَدُوّ ('aduvv): düşman, hasım — düşmanlıkla davranan kimse (Lane: \"enmity ile hareket eden\")", "عَدْوَى ('advā): enfeksiyon, bulaşma — hastalığın koşması/yayılması (Hans Wehr); harfi harfine \"birinden diğerine koşan\"", "عَدَا ('adā): geçmek, ötesine geçmek — \"günler geçti\" (Lane: عَدَا الأَمْرَ = meseleyi geçti)", "Klasik (Lane): عَدَا ayrıca \"doğru yoldan sapmak, çark etmek\" anlamı taşır — ahlaki veya fiziksel olarak doğru yoldan ayrılma", "Klasik (Lisanü'l-Arab): عَدَا عَلَيْهِ = ona zulmetti; ayrıca عَدَّى = karşıya geçirmek, taşımak", "Modern: acele etmek, atılmak — araçların, verilerin, sinyallerin hızlı amaçlı hareketi", "Gelecekçi: hız ve güçle ilerleyen herhangi bir varlık — dronlar, otonom sistemler, ağlarda koşan veri akışları", "Kök kavram: nötr (koşma), düşmanca (saldırma) veya sınır aşıcı (haddi aşma) olabilen hızlı ileri hareket — kök üçünü de aynı anda taşır"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle forms (mu'tadīn, 'ādiyāt) — those who transgress or run", "count": "~10 ayahs", "examples": [{"ref": "5:87", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا تُحَرِّمُوا۟ طَيِّبَٰتِ مَآ أَحَلَّ ٱللَّهُ لَكُمْ وَلَا تَعْتَدُوٓا۟ ۚ إِنَّ ٱللَّهَ لَا يُحِبُّ ٱلْمُعْتَدِينَ", "english": "O you who believe, do not prohibit the good things God has made lawful for you, and do not transgress (ta'tadū). God does not love the transgressors (al-mu'tadīn).", "turkish": "Ey iman edenler, Allah'ın size helal kıldığı güzel şeyleri haram kılmayın ve haddi aşmayın (ta'tadū). Allah haddi aşanları (el-mu'tedîn) sevmez."}, {"ref": "50:25", "arabic": "مَّنَّاعٍۢ لِّلْخَيْرِ مُعْتَدٍۢ مُّرِيبٍ", "english": "A preventer of good, a transgressor (mu'tadin), a doubter.", "turkish": "İyiliği engelleyen, haddi aşan (mu'ted), şüpheci."}]}, {"label": "B. Intensive adjective forms ('aduww) — enemy, adversary", "count": "~23 ayahs", "examples": [{"ref": "2:36", "arabic": "فَأَزَلَّهُمَا ٱلشَّيْطَٰنُ عَنْهَا فَأَخْرَجَهُمَا مِمَّا كَانَا فِيهِ ۖ وَقُلْنَا ٱهْبِطُوا۟ بَعْضُكُمْ لِبَعْضٍ عَدُوٌّۭ", "english": "But Satan caused them to slip and removed them from where they had been. We said: Descend, some of you enemies ('aduww) to one another.", "turkish": "Ama Şeytan onları oradan kaydırdı ve bulundukları yerden çıkardı. Dedik ki: İnin, birbirinize düşman ('aduvv) olarak."}, {"ref": "7:22", "arabic": "فَدَلَّىٰهُمَا بِغُرُورٍۢ ۚ فَلَمَّا ذَاقَا ٱلشَّجَرَةَ بَدَتْ لَهُمَا سَوْءَٰتُهُمَا وَطَفِقَا يَخْصِفَانِ عَلَيْهِمَا مِن وَرَقِ ٱلْجَنَّةِ ۖ وَنَادَىٰهُمَا رَبُّهُمَآ أَلَمْ أَنْهَكُمَا عَن تِلْكُمَا ٱلشَّجَرَةِ وَأَقُل لَّكُمَآ إِنَّ ٱلشَّيْطَٰنَ لَكُمَا عَدُوٌّۭ مُّبِينٌۭ", "english": "So he brought them down with deception. When they tasted the tree, their shame became apparent. Their Lord called: Did I not forbid you that tree and say: Satan is a clear enemy ('aduww) to you?", "turkish": "Böylece onları aldatarak düşürdü. Ağacı tattıklarında edep yerleri açıldı. Rableri seslendi: O ağacı size yasaklamadım mı? Şeytan sizin apaçık düşmanınızdır ('aduvv) demedim mi?"}]}, {"label": "C. Concrete nouns ('udwān, 'adw) — transgression, hostility, enmity", "count": "~30 ayahs", "examples": [{"ref": "2:85", "arabic": "ثُمَّ أَنتُمْ هَٰٓؤُلَآءِ تَقْتُلُونَ أَنفُسَكُمْ وَتُخْرِجُونَ فَرِيقًۭا مِّنكُم مِّن دِيَٰرِهِمْ تَظَٰهَرُونَ عَلَيْهِم بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ", "english": "Then you are those who kill your own people and expel a group among you from their homes, supporting one another in sin and transgression (al-'udwān).", "turkish": "Sonra siz birbirinizi öldürüyor, aranızdan bir grubu yurtlarından çıkarıyorsunuz; günah ve düşmanlıkla (el-udvan) onlara karşı yardımlaşıyorsunuz."}, {"ref": "5:2", "arabic": "وَتَعَاوَنُوا۟ عَلَى ٱلْبِرِّ وَٱلتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا۟ عَلَى ٱلْإِثْمِ وَٱلْعُدْوَٰنِ", "english": "Cooperate in righteousness and piety, and do not cooperate in sin and transgression (al-'udwān).", "turkish": "İyilik ve takvada yardımlaşın; günah ve düşmanlıkta (el-udvan) yardımlaşmayın."}]}]}, "qiraat": [{"arabic": "وَالْغَادِيَاتِ", "translit": "wa-l-ghādiyāti", "status": "None", "type": "Dot", "note": "The variant وَالْغَادِيَاتِ (wa-l-ghādiyāti) replaces ع ('ayn) with غ (ghayn), shifting the root from '-d-w (running/hostility) to gh-d-w (going forth in the morning). This transforms \"the runners\" into \"those that go forth at dawn,\" adding a temporal dimension and connecting to early-morning military sorties. The semantic shift is from manner (running) to time (dawn departure).", "noteTr": "Varyant وَالْغَادِيَاتِ (va'l-gādiyāti) ع (ayn) harfini غ (gayn) ile değiştirir; kök ع د و (koşma/düşmanlık) yerine غ د و (sabah erkenden yola çıkma) olur. Bu \"koşanlar\"ı \"şafakta yola çıkanlar\"a dönüştürür, zamansal boyut ekler ve sabah baskınlarına bağlanır. Anlamsal kayma tarzdan (koşma) zamana (şafak harekatı) doğrudur.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-b-h", "coRootAr": "ض ب ح", "count": "1", "refs": "100:1", "note": "Panting (ḍabḥ) accompanies running/charging ('adw) — the sound produced by the runners. These two roots occur ONLY here in the entire Quran, creating a unique pairing. ← IN THIS AYAH", "noteTr": "Soluma (dabh) koşma/hücuma ('adv) eşlik eder — koşanların çıkardığı ses. Bu iki kök Kur'an'da SADECE burada birlikte geçer, eşsiz bir çift oluşturur. ← BU AYETTE"}, {"coRoot": "s-b-h", "coRootAr": "س ب ح", "count": "3", "refs": "3:103;61:14;100:1", "note": "Co-occurrence with s-b-ḥ (glorification/swimming) is variant-sourced [v] for 100:1. In 3:103 '-d-w appears as \"enemies\" (a'dā') alongside becoming brothers; in 61:14 it appears as \"their enemy\" ('aduwwihim). Pattern: hostility/enmity contrasted with divine support.", "noteTr": "س ب ح (tesbih/yüzme) ile birlikte geçiş 100:1 için varyant kaynaklı [v]. 3:103'te ع د و \"düşmanlar\" (a'dā') olarak kardeş olmakla birlikte; 61:14'te \"düşmanları\" ('aduvvihim) olarak geçer. Desen: düşmanlık, ilahi destekle karşıtlık içinde."}], "critical": "The active participle العاديات (al-'ādiyāt) is feminine plural, yet the referent is deliberately unspecified. Classical readings identify war horses, camels, or warriors. The root '-d-w holds a fundamental semantic tension: it means BOTH \"to run\" (neutral physical motion) AND \"to transgress/show enmity\" (moral judgment). The Quranic text does not resolve this — the feminine plural form with the definite article creates a generic category (\"the running/charging ones\") that refuses to settle into a single referent. Lane's Lexicon attests عَدَا meaning \"he ran,\" \"he sprang,\" \"he leaped,\" AND \"he acted wrongfully\" — all from the SAME root. The phonetic weight of the word (three syllables, the long -āt ending) creates a rhythmic galloping effect. The qira'at variant الغاديات (al-ghādiyāt, \"those going forth at dawn\") shifts from manner to temporal reference, suggesting that the standard reading's deliberate ambiguity between running and hostility is a feature, not an accident.", "criticalTr": "İsm-i fail العاديات (el-'ādiyāt) dişil çoğuldur, ancak kastedilen varlık kasıtlı olarak belirsiz bırakılmıştır. Klasik okumalar savaş atlarını, develeri veya savaşçıları tanımlar. ع د و kökü temel bir anlamsal gerilim taşır: HEM \"koşmak\" (nötr fiziksel hareket) HEM DE \"haddi aşmak/düşmanlık göstermek\" (ahlaki yargı) anlamına gelir. Kur'an metni bunu çözmez — belirli dişil çoğul kalıp, tek bir gösterene yerleşmeyi reddeden genel bir kategori (\"koşanlar/hücum edenler\") oluşturur. Lane'in Sözlüğü عَدَا için \"koştu,\" \"sıçradı,\" \"atladı\" VE \"haksızlık etti\" anlamlarını atar — hepsi AYNI kökten. Kelimenin fonetik ağırlığı (üç hece, uzun -āt sonu) ritmik bir dörtnala efekti yaratır. Kıraat varyantı الغاديات (el-gādiyāt, \"şafakta yola çıkanlar\") tarzdan zamansal referansa kayar; bu da standart okumanın koşma ile düşmanlık arasındaki kasıtlı belirsizliğinin bir özellik olduğunu, tesadüf olmadığını düşündürür.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "ضَبْحًۭا", "translit": "ḍabḥan", "gloss": "panting / gasping", "glossTr": "soluma / nefes nefese kalma", "userNotes": "", "root": "ض ب ح (ḍ-b-ḥ)", "grammar": "Indefinite accusative gerund (maṣdar), functioning either as مَفْعُول مُطْلَق (maf'ūl muṭlaq, cognate accusative describing the manner of the action) or as حَال (ḥāl, circumstantial accusative describing the state of the 'ādiyāt). The tanwīn -an confirms the indefinite accusative.", "grammarTr": "Belirsiz mansub mastar (masdar); ya مَفْعُول مُطْلَق (mef'ûl-i mutlak, eylemin tarzını betimleyen) ya da حَال (hâl, العاديات'ın durumunu betimleyen hal) işlevindedir. Tenvin -en belirsiz mansub halini doğrular.", "semantics": ["ضَبَحَ (ḍabaḥa, I): to pant, to breathe hard with audible exhalation — said of horses and other animals during exertion (Lane's Lexicon: \"he breathed hard, or panted\")", "ضَبْح (ḍabḥ): the sound of hard breathing, panting — specifically the audible exhalation of a horse at full gallop (Lane's: \"the sound of the breathing of a horse in running\")", "Classical (Lane's): also said to mean \"to cry out, to utter a cry\" — a guttural vocal sound, not merely breathing but a vocalization of effort", "Classical (Lisan al-Arab): ضَبَحَ can also describe the sound of foxes; ضُبَاح (ḍubāḥ) = the cry/bark of foxes; also: a plant (coloquintida) — by extension, any harsh, rasping sound", "Classical (Lane's): ضَبَحَ النَّارُ الشَّيْءَ = \"the fire scorched/singed the thing\" — the root also carries a sense of scorching, burning surface contact, heat damage", "Modern: the sound of engines, turbines, exhaust — any mechanical panting or rhythmic expulsion of energy", "Futuristic: vibrational output of any rapidly advancing system — electromagnetic hum, data throughput noise, signal frequency", "Core concept: audible exhalation of effort — the sound that accompanies strenuous, rapid motion, whether biological or mechanical"], "semanticsTr": ["ضَبَحَ (dabaḥa, I. bab): solumak, zorlu nefes almak — atlar ve diğer hayvanlar için efor sırasında söylenir (Lane: \"sert nefes aldı, soludu\")", "ضَبْح (dabḥ): sert nefes sesi, soluma — özellikle dörtnala koşan atın duyulabilir nefes çıkışı (Lane: \"koşan atın nefes sesi\")", "Klasik (Lane): ayrıca \"haykırmak, çığlık atmak\" anlamı da verilir — sadece nefes değil, eforun seslendirilmesi, gırtlaktan gelen ses", "Klasik (Lisanü'l-Arab): ضَبَحَ tilkilerin sesi için de kullanılır; ضُبَاح (dubāḥ) = tilkilerin havlaması/çığlığı; ayrıca: bir bitki (ebucehil karpuzu) — genişleme ile, herhangi bir sert, hırıltılı ses", "Klasik (Lane): ضَبَحَ النَّارُ الشَّيْءَ = \"ateş şeyi kavruldu/yaktı\" — kök ayrıca kavurma, yüzey yanığı, ısı hasarı anlamı taşır", "Modern: motor, türbin, egzoz sesi — herhangi bir mekanik soluma veya ritmik enerji atılımı", "Gelecekçi: hızla ilerleyen herhangi bir sistemin titreşim çıktısı — elektromanyetik uğultu, veri aktarım gürültüsü, sinyal frekansı", "Kök kavram: eforun duyulabilir nefes çıkışı — ister biyolojik ister mekanik olsun, zorlu hızlı harekete eşlik eden ses"], "occurrences": {"type": "all", "items": [{"ref": "100:1", "arabic": "— this verse —", "english": "This is the ONLY occurrence of root ḍ-b-ḥ in the entire Quran. The hapax legomenon status makes this word uniquely significant — its meaning must be determined entirely from classical lexicon knowledge and internal context, with no intra-Quranic cross-reference available.", "turkish": "Bu, ض ب ح kökünün Kur'an'daki TEK geçişidir. Hapax legomenon statüsü bu kelimeyi benzersiz kılar — anlamı tamamen klasik sözlük bilgisi ve iç bağlamdan belirlenmeli; Kur'an içi çapraz referans mevcut değildir."}]}, "qiraat": [{"arabic": "صُبْحًا", "translit": "ṣubḥan", "status": "None", "type": "Dot", "note": "The variant صُبْحًا (ṣubḥan) replaces ض (ḍād) with ص (ṣād), changing the root from ḍ-b-ḥ (panting) to ṣ-b-ḥ (morning/dawn). This transforms the manner description (\"panting\") into a temporal marker (\"at dawn/in the morning\"). The semantic shift is radical: from auditory imagery (sound of breathing) to temporal setting (dawn). Root ṣ-b-ḥ occurs 43 times in the Quran across forms including ṣubḥ (morning), iṣbāḥ (daybreak), maṣābīḥ (lamps), aṣbaḥa (to enter morning/become). In oaths, ṣubḥ appears in 74:34 and 81:18 paired with cosmic phenomena.", "noteTr": "Varyant صُبْحًا (subḥan) ض (dâd) harfini ص (sâd) ile değiştirir; kök ض ب ح (soluma) yerine ص ب ح (sabah/şafak) olur. Bu, tarz betimlemesini (\"soluyarak\") zamansal bir işarete (\"şafakta/sabahleyin\") dönüştürür. Anlamsal kayma radikaldir: işitsel imgeden (nefes sesi) zamansal bağlama (şafak). ص ب ح kökü Kur'an'da 43 kez geçer: صُبْح (sabah), إصْبَاح (tan yeri), مَصَابِيح (lambalar), أَصْبَحَ (sabaha girmek/olmak). Yeminlerde صُبْح 74:34 ve 81:18'de kozmik olgularla birlikte geçer.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-d-w", "coRootAr": "ع د و", "count": "1", "refs": "100:1", "note": "Panting paired with running/charging — the physical exertion sound accompanying the runners. This is the only co-occurrence of these two roots in the Quran, making it a unique semantic pairing. ← IN THIS AYAH", "noteTr": "Soluma, koşma/hücumla eşleşir — koşanlara eşlik eden fiziksel efor sesi. Bu iki kökün Kur'an'daki tek birlikte geçişidir, eşsiz bir anlamsal çift oluşturur. ← BU AYETTE"}], "critical": "ضَبْحًا (ḍabḥan) is a hapax legomenon — it occurs nowhere else in the Quran. This rarity forces interpretation to rely entirely on classical lexicons and context. Lane's Lexicon gives two primary senses: (1) panting/hard breathing of horses in running, and (2) scorching/singeing by fire. Lisan al-Arab adds the cry of foxes (ḍubāḥ). The scorching meaning is particularly significant: ضَبَحَ النَّارُ الشَّيْءَ (\"the fire scorched the thing\") creates a secondary layer where the runners do not merely pant but BURN — their breath is hot, searing. This fire-connection anticipates 100:2 (sparking fire with hooves). The qira'at variant صُبْحًا (ṣubḥan, \"at dawn\") from root ṣ-b-ḥ is a complete semantic replacement: from manner (HOW they run) to time (WHEN they run). The variant root ṣ-b-ḥ is NOT in the standard text for this ayah. Phonetically, ḍabḥan uses the emphatic ḍād — the heaviest consonant in Arabic — creating a visceral, guttural sound that ENACTS the panting it describes. The sound of the word IS the meaning.", "criticalTr": "ضَبْحًا (dabḥan) hapax legomenondur — Kur'an'da başka hiçbir yerde geçmez. Bu nadirlık, yorumu tamamen klasik sözlüklere ve bağlama bağımlı kılar. Lane'in Sözlüğü iki temel anlam verir: (1) koşan atların soluması/ağır nefes alması, (2) ateşin bir şeyi kavurması. Lisanü'l-Arab tilkilerin çığlığını (dubāḥ) ekler. Kavurma anlamı özellikle önemlidir: ضَبَحَ النَّارُ الشَّيْءَ (\"ateş şeyi kavruldu\") koşanların sadece solumadiğı, aynı zamanda YAKTIKLARI — nefeslerinin sıcak, yakıcı olduğu ikincil bir katman yaratır. Bu ateş bağlantısı 100:2'yi (toynaklarla kıvılcım çıkarma) önceden haber verir. Kıraat varyantı صُبْحًا (subḥan, \"şafakta\") kökü ص ب ح ile tam bir anlamsal değiştirmedir: tarzdan (NASIL koşuyorlar) zamana (NE ZAMAN koşuyorlar). Varyant kökü ص ب ح bu ayetin standart metninde DEĞİLDİR. Fonetik olarak, ضَبْحًا Arapça'nın en ağır ünsüzü olan emfatik ض (dâd) kullanır — betimlediği solumayı İCRA EDEN viseral, gırtlaktan gelen bir ses yaratır. Kelimenin sesi anlamın kendisidir.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran use the hapax legomenon ḍabḥ rather than a more common word for breathing (tanaffus) or running sounds? Does the rarity itself function as a semantic signal?", "Does the fire/scorching sense of ḍ-b-ḥ (Lane's: \"the fire scorched the thing\") deliberately anticipate the fire-striking imagery in 100:2 (qadḥan), creating a phonetic-semantic chain across the oath series?", "The referent of al-'ādiyāt is left unspecified. If the runners are NOT horses but human beings (or abstract forces), how does ḍabḥan change meaning — from animal panting to human gasping, struggle, or moral exertion?", "The qira'at variant al-ghādiyāt (\"those going forth at dawn\") combined with ṣubḥan (\"at dawn\") would create a double dawn reference. Is this redundancy evidence that the standard reading (al-'ādiyāt + ḍabḥan) was chosen precisely to avoid temporal specification and maintain semantic openness?", "Root '-d-w holds \"running\" AND \"enmity\" simultaneously. Does the feminine plural form with no explicit referent create a deliberate category that encompasses BOTH neutral runners and hostile transgressors — and is the panting (ḍabḥan) meant to apply equally to both?", "The emphatic ḍād in ḍabḥan is the phonetically heaviest consonant in Arabic. Is the choice of this specific root (over alternatives) motivated by sound symbolism — the word physically performing the effortful breathing it names?", "If al-'ādiyāt represents modern rapid-advance entities (vehicles, data, signals), what would ḍabḥan correspond to — engine noise, electromagnetic frequency, system heat exhaust?", "Lane's Lexicon attests ḍubāḥ as the cry of foxes. Does the Quranic context allow an animal cry reading — the runners howling/screaming as they charge — rather than merely breathing?", "The series of oaths (100:1-5) moves from running + panting → striking sparks → raiding at dawn → raising dust → penetrating into the midst. Is this a sequential narrative or simultaneous description? Does ḍabḥan establish the temporal beginning of this sequence?", "Classical lexicons attest ع د و for contagion ('adwā, \"infection\" — that which runs from person to person). Could al-'ādiyāt metaphorically reference spreading phenomena — ideas, beliefs, diseases, information — and ḍabḥan their audible/perceptible trace?"], "questionsTr": ["Kur'an neden soluma için daha yaygın bir kelime (teneffüs) yerine hapax legomenon olan ضَبْح kullanır? Nadirliğin kendisi anlamsal bir sinyal işlevi görür mü?", "ض ب ح kökünün ateş/kavurma anlamı (Lane: \"ateş şeyi kavruldu\") kasıtlı olarak 100:2'deki (قَدْحًا) ateş çakma imgesini önceden haber verir mi; yemin serisi boyunca fonetik-anlamsal bir zincir yaratır mı?", "العاديات'ın göstereni belirsiz bırakılmıştır. Koşanlar atlar DEĞİL de insanlar (veya soyut güçler) ise, ضَبْحًا nasıl anlam değiştirir — hayvan solumasından insani nefes darlığına, mücadeleye veya ahlaki çabaya?", "Kıraat varyantı الغاديات (\"şafakta yola çıkanlar\") ile صُبْحًا (\"şafakta\") birleştirildiğinde çifte şafak referansı oluşur. Bu fazlalık, standart okumanın (العاديات + ضَبْحًا) zamansal belirlemeyi önlemek ve anlamsal açıklığı korumak için seçildiğinin kanıtı mıdır?", "ع د و kökü \"koşma\" VE \"düşmanlık\" anlamlarını aynı anda taşır. Açık gösterensiz dişil çoğul kalıp, HEM nötr koşanları HEM düşmanca sınır aşanları kapsayan kasıtlı bir kategori mi yaratır — ve ضَبْحًا her ikisine de eşit olarak mı uygulanır?", "ضَبْحًا'daki emfatik ض (dâd) Arapça'nın fonetik olarak en ağır ünsüzüdür. Bu kökün (alternatiflere karşı) seçimi ses sembolizmi tarafından mı yönlendirilir — kelime, adlandırdığı zorlu nefes alışı fiziksel olarak icra eder mi?", "العاديات modern hızlı ilerleme varlıklarını (araçlar, veri, sinyaller) temsil ederse, ضَبْحًا neye karşılık gelir — motor gürültüsü, elektromanyetik frekans, sistem ısı atığı?", "Lane'in Sözlüğü ضُبَاح'ı tilkilerin çığlığı olarak atar. Kur'ani bağlam bir hayvan çığlığı okumasına — koşanların sadece nefes almayıp hücum ederken uluma/çığlık atması — izin verir mi?", "Yeminler serisi (100:1-5) koşma + soluma → kıvılcım çakma → şafak baskını → toz kaldırma → ortaya dalma şeklinde ilerler. Bu ardışık bir anlatı mı yoksa eşzamanlı betimleme mi? ضَبْحًا bu dizinin zamansal başlangıcını mı kurar?", "Klasik sözlükler ع د و için bulaşma anlamını (عَدْوَى, \"enfeksiyon\" — kişiden kişiye koşan) doğrular. العاديات mecazi olarak yayılan olguları — fikirler, inançlar, hastalıklar, bilgi — ve ضَبْحًا onların duyulabilir/algılanabilir izini temsil edebilir mi?"], "key": "100:1"}, "100:2": {"surah": 100, "ayah": 2, "arabic": "فَٱلْمُورِيَٰتِ قَدْحًۭا", "transliteration": "fa-l-mūriyāti qadḥan", "readings": [{"text": "By the ones that strike fire — sparking: The fa connects this oath clause to 100:1 (the charging runners). The muriyat (active participle, feminine plural) are those that produce fire through friction or impact. qadhan is a cognate accusative (maf'ul mutlaq) intensifying the act of striking.", "textTr": "Atesi cakarak carpalara andolsun: fa bu kasem cumlesini 100:1'e (kosanlara) baglar. muriyat (ism-i fail, disil cogul) surtunme veya carpismayla ates cikaranlardir. qadhan fiili pekistiren mutlak meful'dur.", "rationale": "Reading the muriyat as horses whose hooves strike sparks from rocks. The oath sequence builds: running (100:1) produces friction sparks (100:2). The cognate accusative qadhan emphasizes the intensity of the spark-producing action.", "rationaleTr": "muriyat'i toynaklariyla kayalardan kivilcim cikaran atlar olarak okumak. Kasem dizisi yukselir: kosma (100:1) surtunme kivilcimlari uretir (100:2). Mutlak meful qadhan kivilcim cikartma eyleminin siddetini vurgular."}, {"text": "By those that ignite ideas — kindling: The muriyat can be read as those who kindle or set alight, extending beyond physical fire to the ignition of thought, inspiration, or understanding. qadhan as the act of sparking insight.", "textTr": "Fikirleri tutusuturanlara andolsun: muriyat fiziksel atesin otesinde dusunce, ilham veya anlayisi tutusuturanlar olarak okunabilir. qadhan fikir kivilcimini catma eylemi.", "rationale": "Root w-r-y encompasses concealment AND fire-kindling — what is concealed can also be ignited. The active participle muriyat describes agents that bring hidden potential into visible flame. qadhan as cognitive triggering.", "rationaleTr": "Kok w-r-y gizleme VE ates yakmayi kapsar — gizlenen ayni zamanda tututurulabilir. Ism-i fail muriyat gizli potansiyeli gorunur aleve donusturan failleri tanimlar. qadhan bilissel tetikleme olarak."}, {"text": "By the data-igniters — processing: In a futuristic reading, muriyat are processors that ignite electrical sparks (transistors, circuits). qadhan as the act of firing/triggering signals. Iron-oxide disks, silicon chips, and electrical arcing all involve ignition at the micro level.", "textTr": "Veri-tutusturanlara andolsun — isleme: Gelecege donuk okumada muriyat elektriksel kivilcimlari atesleven islemcilerdir (transistorler, devreler). qadhan sinyal atesleyerek tetikleme eylemi. Demir oksit diskler, silikon cipler ve elektrik arklarinin tumunde mikro duzeyde tututurma vardir.", "rationale": "Modern technology operates through spark-like electrical discharges. The semantic range of w-r-y (to kindle, to conceal, to produce fire) and q-d-h (to strike fire, to gouge, to draw lots) both accommodate technological ignition processes.", "rationaleTr": "Modern teknoloji kivilcimsi elektriksel desarjlarla calisir. w-r-y (yakmak, gizlemek, ates uretmek) ve q-d-h (ates cakmak, oymak, kura cekmek) anlam alanlari teknolojik tututurma sureclerini karsilar."}, {"text": "By the ones that conceal and then spark forth: Reading w-r-y primarily in its sense of \"to conceal/hide behind\" — the muriyat are entities that first conceal, then produce fire. This captures the semantic tension in the root: concealment preceding revelation through fire/light.", "textTr": "Gizleyip sonra kivilcim sacanlara andolsun: w-r-y'yi oncelikle \"arkasina gizlenmek\" anlamiyla okumak — muriyat once gizleyen, sonra ates ureten varliklardir. Bu kokteki anlamsal gerilimi yakalar: ates/isikla aciga cikmadan once gizlenme.", "rationale": "The root w-r-y has a fundamental duality: to hide/conceal AND to kindle fire. Both senses converge in muriyat: what strikes fire first operates in concealment (flint within rock, spark within friction). The oath may invoke this paradox of hidden fire.", "rationaleTr": "Kok w-r-y temel bir ikilik tasir: gizlemek VE ates yakmak. Iki anlam muriyat'ta birlesir: ates cakan once gizlilik icinde calisir (kayaiicindeki cakmak tasi, surtunme icindeki kivilcim). Kasem gizli atesin bu paradoksunu cagirabilir."}, {"text": "By the war-strikers — combat ignition: In the martial context of the surah (horses charging, raiding at dawn), muriyat specifically denotes the clash of weapons or hooves against stone that produces sparks in battle. qadhan as the percussive blow of combat.", "textTr": "Savas atesleyicilere andolsun — muharebe tututurmasi: Surenin askeri baglaminda (savas atlari, safak baskini), muriyat ozellikle savas sirasinda silahlarin veya toynaklarin tasa carpmasindan cikan kivilcimlari belirtir. qadhan savasin vurus darbesi.", "rationale": "The surah's opening sequence (100:1-5) describes a military campaign: charging, sparking, raiding at dawn, raising dust, penetrating the center. The muriyat are battle-horses whose iron-shod hooves strike sparks from rocky ground during a night charge before the dawn raid of 100:3.", "rationaleTr": "Surenin acilis dizisi (100:1-5) bir askeri seferi betimler: hamle, kivilcim, safak baskini, toz kaldirma, merkeze dalma. muriyat nallanmis toynaklariyla gece hamlesinde kayalik zeminden kivilcim cikan savas atlaridir, 100:3'un safak baskinina hazirlik olarak."}], "structure": {"beats": [{"label": "Oath: spark-producers", "labelTr": "Kasem: kivilcim cikaranlar", "lines": [{"arabic": "فَٱلْمُورِيَٰتِ قَدْحًۭا", "translit": "fa-l-mūriyāti qadḥan", "english": "By the spark-strikers — striking", "turkish": "Kivilcim cakanlara andolsun — cakarak"}]}], "summary": "This ayah is a single oath clause, the second in a series of five oath clauses (100:1-5) that form the protasis of a conditional structure. The apodosis begins at 100:6 (inna l-insana). The fa connecting this clause to 100:1 functions as sequential (ta'qib), indicating that the spark-striking follows from and is caused by the running/charging. The structure is: oath particle (wa in 100:1, fa here) + definite active participle (feminine plural, genitive after oath) + cognate accusative (maf'ul mutlaq). The five-clause oath builds a kinetic sequence: running → sparking → raiding → dust-raising → penetrating — an escalation from motion to ignition to assault to aftermath to climax.", "summaryTr": "Bu ayet, bes kasem cumlesinden (100:1-5) ikincisi olan tek bir kasem cumlesidir ve sart yapisinin on bolumunu olusturur. Cevap 100:6'da (inne'l-insane) baslar. Bu cumleyi 100:1'e baglayan fa ta'kib (ardisiklik) islevindedir, kivilcim cikartmanin kosmadan/hamle etmeden kaynaklandigini gosterir. Yapi soyledir: kasem edati (100:1'de wa, burada fa) + marife ism-i fail (disil cogul, kasemden sonra mecrur) + mutlak meful. Bes cumleli kasem kinetik bir dizi kurar: kosu → kivilcim → baskin → toz → dalma — hareketten tututurmaya, saldiridan sonuca, doruga dogru bir tirmanis."}, "words": [{"id": 1, "arabic": "فَ", "translit": "fa", "gloss": "then / so", "glossTr": "sonra / iste", "userNotes": "", "root": "— (—)", "grammar": "Conjunction functioning as ta'qib (sequential), connecting this oath clause to 100:1. Indicates the spark-striking follows from and is produced by the charging/running.", "grammarTr": "Ta'kib (ardisiklik) islevinde baglac, bu kasem cumlesini 100:1'e baglar. Kivilcim cikartmanin kosu/hamleden kaynaklandigini gosterir.", "semantics": ["ta'qib (sequential): immediate succession — \"then/and then\" — action follows directly from the preceding", "sababiyya (causative): result/consequence — \"so/therefore\" — second clause results from first", "istinaf (resumptive): starts new clause — discourse marker", "In oath sequences, fa chains successive oath elements in rapid succession, building momentum"], "semanticsTr": ["Ta'kib (ardisiklik): hemen ardindan gelme — \"sonra\" — eylem oncekinden dogrudan kaynaklanir", "Sebebiyye (nedensellik): sonuc — \"bu yuzden/dolayisiyla\" — ikinci cumle birinciden kaynaklanir", "Istinaf (yeniden baslama): yeni cumle baslatir — soylem isaretleyicisi", "Kasem dizilerinde fa ardisik kasem ogelerini hizli bir sekilde zincirleyerek ivme olusturur"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The fa here is critical to the surah's architecture. Unlike wa in 100:1 which opens the oath series, fa in 100:2-5 creates a CAUSAL-SEQUENTIAL chain: each clause follows from and is produced by the previous. This is not mere listing (\"and X and Y and Z\") but a cause-effect cascade: the running (100:1) PRODUCES the sparking (100:2), the sparking accompanies the dawn-raiding (100:3), the raiding RAISES dust (100:4), the dust-raisers PENETRATE the center (100:5). The repeated fa constructs this kinetic escalation grammatically. Classical grammarians note that fa in oath sequences carries both sequentiality and intensification — each oath builds on the previous one. The phonetic brevity of fa (single consonant + vowel) mirrors its function: rapid, percussive connection — like the sparks it introduces.", "criticalTr": "Buradaki fa surenin mimarisinde kritiktir. 100:1'deki kasem dizisini acan wa'nin aksine, 100:2-5'teki fa NEDENSEL-ARDISIK bir zincir olusturur: her cumle oncekinden kaynaklanir ve onceki tarafindan uretilir. Bu basit bir siralama degil (\"ve X ve Y ve Z\") bir neden-sonuc selalesidir: kosu (100:1) kivilcimi URETIR (100:2), kivilcim safak baskinina eslik eder (100:3), baskin toz KALDIRIR (100:4), toz kaldiricilar merkeze DALAR (100:5). Tekrarlanan fa bu kinetik tirmanisi dilbilgisel olarak kurar. Klasik gramerciler kasem dizilerinde fa'nin hem ardisiklik hem yogunlastirma tasidifini belirtir — her kasem oncekinin uzerine insa eder. fa'nin fonetik kisaligi (tek unsuz + unlu) islevini yansitir: hizli, vurussulu baglanti — tanittigi kivilcimlar gibi."}, {"id": 2, "arabic": "ٱلْمُورِيَٰتِ", "translit": "al-mūriyāti", "gloss": "the spark-strikers / the fire-kindlers / the igniters", "glossTr": "kivilcim cakanlar / ates yakicilar / tutusuturanlar", "userNotes": "", "root": "و ر ي (w-r-y)", "grammar": "Active participle (ism fa'il), Form IV (af'ala → muf'il), feminine plural, definite with al-, genitive case (after oath particle). The IV form (awra) is causative: \"to cause fire to appear.\"", "grammarTr": "Ism-i fail, IV. bab (ef'ale → muf'il), disil cogul, el- ile marife, mecrur hal (kasem edatindan sonra). IV. bab (evra) ettirgen: \"atesin ortaya cikmasina neden olmak.\"", "semantics": ["فَعَلَ (fa'ala, I) wariya: to kindle fire, to produce fire by friction or striking; also to conceal, to hide behind something (wara'a = behind)", "أَفْعَلَ (af'ala, IV) awra: to strike fire, to cause sparks, to kindle — causative of Form I; awra l-zanda = he struck fire with the fire-stick", "تَوَارَى (tawara, VI): to hide oneself, to conceal oneself behind something", "Classical lexicon (Lane): wariya l-zandu = the fire-stick produced fire; wariya l-naru = the fire became kindled; also al-wariy = fatness, plumpness (what lies concealed under skin); wara'a = behind, beyond", "Classical lexicon (Lisan al-Arab): w-r-y encompasses both fire-production and concealment — the fire is concealed within the flint/wood until struck. Also: wariya al-'azmu = the bone became full of marrow (concealed nourishment inside)", "Hans Wehr: awra = to kindle, light (fire); wara' = behind, beyond, on the other side; tawarra = to hide, conceal oneself", "Modern extension: to ignite, to activate, to trigger — electrical ignition, engine spark, digital signal firing", "Futuristic: processors that fire electrical impulses, ignition systems, any mechanism that converts latent energy into active discharge", "Semantic tension: the root simultaneously means \"to kindle/reveal (fire)\" AND \"to conceal/hide behind\" — fire emerges FROM concealment, the act of producing light is rooted in hiddenness", "Core concept: the emergence of fire/light/energy from a concealed or latent state through active causation"], "semanticsTr": ["فَعَلَ (fe'ale, I. bab) veriye: ates yakmak, surtunme veya darbe ile ates uretmek; ayrica gizlemek, arkasina saklanmak (vera'e = arka, geri)", "أَفْعَلَ (ef'ale, IV. bab) evra: ates cakmak, kivilcim cikarmak, tutusmak — I. babin ettirgen bicimi; evra'z-zende = cakmak tasiyla ates cakti", "تَوَارَى (tevara, VI. bab): gizlenmek, saklanmak, bir seyin arkasina cekilmek", "Klasik sozluk (Lane): veriye'z-zendu = cakmak tasi ates uretti; veriye'n-naru = ates tutustu; ayrica el-veriy = semizlik, dolgunluk (derinin altinda gizlenen); vera'e = arka, ote", "Klasik sozluk (Lisanu'l-Arab): w-r-y ates uretimi ve gizlemeyi birlikte kapsar — ates cakmak tasi/odunun icinde vurulanaqkadar gizlidir. Ayrica: veriye'l-azmu = kemik ilikle doldu (i
