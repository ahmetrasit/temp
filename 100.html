    // ═══ EMBEDDED DATA (generated by build_standalone_reader.py) ═══
    const __EMBEDDED_GD_DATA__ = {"surah": "100", "sections": [{"title": {"en": "Section A: The Oath Scene", "tr": "Section A: Yemin Sahnesi"}, "ayahStart": "1", "ayahEnd": "5", "ayahs": [{"ref": "100:1", "arabic": "وَٱلْعَٰدِيَٰتِ ضَبْحًۭا", "translation": {"en": "By the charging ones, panting —", "tr": "Koşanlara, soluk soluğa —"}}, {"ref": "100:2", "arabic": "فَٱلْمُورِيَٰتِ قَدْحًۭا", "translation": {"en": "Then the spark-strikers, striking fire —", "tr": "Sonra kıvılcım saçanlara, ateş çakmak için —"}}, {"ref": "100:3", "arabic": "فَٱلْمُغِيرَٰتِ صُبْحًۭا", "translation": {"en": "Then the raiders at dawn —", "tr": "Sonra şafakta baskın yapanlara —"}}, {"ref": "100:4", "arabic": "فَأَثَرْنَ بِهِۦ نَقْعًۭا", "translation": {"en": "And they raised a cloud of dust —", "tr": "Ve onunla toz bulutu kaldırdılar —"}}, {"ref": "100:5", "arabic": "فَوَسَطْنَ بِهِۦ جَمْعًا", "translation": {"en": "And plunged into the midst of a host —", "tr": "Ve onunla bir topluluğun ortasına daldılar —"}}], "classical": [{"ref": "100:1", "text": {"en": "The surah opens with an oath by war-horses charging into battle, their breath audible as they gallop. The root '-d-w carries both \"running\" and \"enmity,\" and classical commentators debate whether the referent is horses, camels, or warriors. The scene is kinetic and percussive — sound is the first sensory register.", "tr": "Sure, savaşa koşan atların nefeslerinin duyulabilir hâle geldiği bir yemin ile başlar. '-d-w kökü hem \"koşmak\" hem de \"düşmanlık\" anlamlarını taşır; klasik müfessirler atıfın atlara, develere veya savaşçılara yapılıp yapılmadığını tartışırlar. Sahne kinetik ve vurgulu — ilk duyusal kayıt sestir."}}, {"ref": "100:2", "text": {"en": "The horses' hooves strike stones and produce sparks. Al-muriyat (from w-r-y, \"to kindle\") paired with qadhan (from q-d-h, \"to strike fire from flint\") creates a vivid image of nocturnal cavalry, their charge betrayed by sparks in the darkness. The fa- connector marks temporal sequence within the oath chain.", "tr": "Atların toynakları taşlara çarpar ve kıvılcımlar üretir. Al-muriyat (w-r-y, \"tutuşturmak\" kökünden) ile qadhan (q-d-h, \"çakmaktaşından ateş çakmak\" kökünden) bir araya gelerek gece süvarisinin canlı bir tasvirini yaratır — hücumları karanlıkta kıvılcımlar sayesinde ortaya çıkar. Fa- bağlacı, yemin zincirindeki zamansal sıralamanın işaretçisidir."}}, {"ref": "100:3", "text": {"en": "The scene sharpens: the charge occurs at dawn (subhan), the traditional time for a raid. The root gh-y-r means \"to raid, to descend upon suddenly.\" The temporal marker introduces the third sensory register after sound (100:1) and light/fire (100:2): now time itself. The pre-dawn darkness is about to yield.", "tr": "Sahne keskinleşir: hücum şafakta (subhan) gerçekleşir — baskınların geleneksel zamanı. Gh-y-r kökü \"baskın yapmak, ani olarak saldırmak\" anlamına gelir. Zaman belirleyicisi, ses (100:1) ve ışık/ateş (100:2) ardından üçüncü duyusal kaydı getirir: şimdi zamanın kendisi. Şafak öncesi karanlık teslim olmak üzeredir."}}, {"ref": "100:4", "text": {"en": "The charge raises dust, obscuring the battlefield. The root n-q-' denotes both dust and soaking/permeation. Classical commentators read this as the visual climax of the oath scene: after sound, fire, and dawn, now the earth itself is churned up and the air thickens. The grammatical shift to past-tense verb (atharna) marks the transition from describing the oath subjects to narrating their actions.", "tr": "Hücum toz kaldırır, savaş alanını görünmez kılar. N-q-' kökü hem tozu hem de ıslatma/nüfuz etme anlamlarını taşır. Klasik müfessirler bunu yemin sahnesinin görsel doruk noktası olarak okurlar: ses, ateş ve şafak ardından artık toprağın kendisi kaynayıp hava yoğunlaşır. Geçmiş zaman filine (atharna) dilbilgisel geçiş, yemin öznelerini tanımlamadan onların eylemlerini anlatmaya geçişin işaretçisidir."}}, {"ref": "100:5", "text": {"en": "The oath climaxes: the horses penetrate the center of an enemy gathering. The root w-s-t means \"middle, center.\" The root j-m-' means \"gathering, assembly.\" The oath scene resolves with the charge reaching its target. The bihi construction echoes 100:4, binding the two action-ayahs as a paired consequence.", "tr": "Yemin doruk noktasına ulaşır: atlar düşman topluluğunun merkezine nüfuz eder. W-s-t kökü \"orta, merkez\" anlamına gelir. J-m-' kökü \"topluluk, toplantı\" anlamına gelir. Yemin sahnesi, hücumun hedefine ulaşmasıyla çözülür. Bihi yapısı 100:4'ü yankılar ve iki eylem-ayetini ikili bir sonuç olarak birbirine bağlar."}}], "findings": [{"type": "CONFIRMED", "ref": "100:1", "threadId": "fire-chain", "title": {"en": "Breath as Heat", "tr": "Nefes Olarak Sıcaklık"}, "text": {"en": "Classical tafsir recognizes dabh (panting) as the heavy exhalation of galloping horses. Lane's Lexicon confirms the primary meaning: \"he breathed hard, he panted.\" The acoustic image is universally noted.", "tr": "Klasik tefsir, dabh'ı (soluma) dörtnala koşan atların ağır nefes verişi olarak tanır. Lane's Lexicon birincil anlamı teyit eder: \"ağır nefes aldı, soluk soluğa kaldı\". İşitsel imge evrensel olarak kaydedilmiştir."}}, {"type": "DISCOVERY", "ref": "100:1", "threadId": "fire-chain", "title": {"en": "Fire Hidden in the First Word", "tr": "İlk Kelimede Gizli Ateş"}, "text": {"en": "The root d-b-h carries a secondary meaning Lane's documents: dabaha l-naru l-shay'a, \"the fire scorched the thing.\" The panting breath is already burning. Fire semantics begin not at 100:2 (the spark-striking) but here in 100:1, embedded in the sound-word itself. The fa-causal connector in 100:2 grammatically encodes this as sequence: hot breath produces sparks.", "tr": "D-b-h kökü, Lane's Lexicon'ın kaydettiği ikincil bir anlam taşır: dabaha l-naru l-shay'a, \"ateş şeyi kavurdu\". Soluk zaten yanıyordur. Ateş semantiği 100:2'de (kıvılcım çakma) değil, burada 100:1'de, ses kelimesinin içine gömülü olarak başlar. 100:2'deki fa- nedensel bağlacı bunu dilbilgisel olarak sıralı olarak kodlar: sıcak nefes kıvılcım üretir."}}, {"type": "DISCOVERY", "ref": "100:1", "threadId": "concealment-disclosure", "title": {"en": "A Word Found Nowhere Else", "tr": "Başka Hiçbir Yerde Bulunmayan Kelime"}, "text": {"en": "The root d-b-h is a Quranic hapax legomenon — it appears only here in the entire Quran. Of 25 distinct roots in this surah, five are hapax legomena (28% of the root inventory), each placed at a structural joint. This concentration of unique vocabulary is a data-driven finding: the surah selects the rarest possible words to maximize semantic density.", "tr": "D-b-h kökü Kur'an'da hapax legomenon'dur — tüm Kur'an'da yalnızca burada geçer. Suredeki 25 farklı kökten beşi hapax legomenon'dur (%28 kök envanteri), her biri yapısal bir eklemde yerleştirilmiştir. Bu benzersiz sözcük yoğunluğu veri-temelli bir bulgudur: sure, semantik yoğunluğu maksimize etmek için mümkün olan en nadir kelimeleri seçer."}}, {"type": "CONFIRMED", "ref": "100:2", "threadId": "fire-chain", "title": {"en": "The Spark Image", "tr": "Kıvılcım İmgesi"}, "text": {"en": "The fire-striking imagery is universally recognized in classical tafsir. What the data confirms is that this is not a new image but a continuation: the fa- connector grammatically encodes 100:2 as caused by 100:1. The fire was already latent in the panting; here it becomes visible.", "tr": "Ateş çakma imgesi klasik tefsirde evrensel olarak tanınır. Verinin teyit ettiği nokta, bunun yeni bir imge değil bir devam olduğudur: fa- bağlacı, 100:2'yi dilbilgisel olarak 100:1'in neden olduğu bir şey olarak kodlar. Ateş zaten solukta gizliydi; burada görünür hâle gelir."}}, {"type": "DISCOVERY", "ref": "100:2", "threadId": "concealment-disclosure", "title": {"en": "The Root That Means Both \"Hide\" and \"Kindle\"", "tr": "Hem \"Gizlemek\" Hem \"Tutuşturmak\" Anlamına Gelen Kök"}, "text": {"en": "The root w-r-y carries a dual meaning Lane's documents: wara'a means \"to conceal, hide behind\" while awra means \"to kindle, produce fire.\" The same root holds concealment and revelation as two faces of one act. Fire hidden within stone becomes manifest through striking. This duality plants the surah's master theme: what is concealed will be disclosed.", "tr": "W-r-y kökü, Lane's Lexicon'ın kaydettiği ikili bir anlam taşır: wara'a \"gizlemek, ardına saklamak\", awra ise \"tutuşturmak, ateş üretmek\" anlamına gelir. Aynı kök, gizleme ve ifşayı tek bir eylemin iki yüzü olarak barındırır. Taşın içinde gizli ateş, çarpma yoluyla açığa çıkar. Bu ikilik, surenin ana temasını eker: gizli olan ifşa edilecektir."}}, {"type": "CONFIRMED", "ref": "100:3", "threadId": "concealment-disclosure", "title": {"en": "Dawn as the Threshold", "tr": "Eşik Olarak Şafak"}, "text": {"en": "Classical commentators note that subh (dawn) is the moment darkness yields to light — an attack under cover that coincides with the moment cover dissolves. The data confirms this as the third step in a concealment-to-disclosure progression: sound (hidden exertion), fire (hidden energy made visible), dawn (darkness giving way to light).", "tr": "Klasik müfessirler, subh'ın (şafak) karanlığın ışığa teslim olduğu an olduğunu kaydederler — örtü altında bir saldırı, örtünün eridiği anla çakışır. Veri bunu gizleme-ifşa ilerlemesindeki üçüncü adım olarak teyit eder: ses (gizli çaba), ateş (gizli enerji görünür hâle gelir), şafak (karanlık ışığa yol verir)."}}, {"type": "DISCOVERY", "ref": "100:3", "threadId": "agency", "title": {"en": "The Grammatical Pivot Ahead", "tr": "Yaklaşan Dilbilgisel Dönüş Noktası"}, "text": {"en": "Ayahs 100:1-3 all use definite feminine plural active participles: al-'adiyat, al-muriyat, al-mughirat. These describe what the oath subjects ARE — their nature, their character. But at 100:4, the grammar will shift to past-tense verbs (atharna, wasatna), describing what they DID. This participle-to-verb transition marks a structural sub-boundary within the oath: characterization (1-3) gives way to narration (4-5).", "tr": "100:1-3 ayetlerinin tümü belirli dişil çoğul etken ortaçlar kullanır: al-'adiyat, al-muriyat, al-mughirat. Bunlar yemin öznelerinin NE olduğunu tanımlar — doğalarını, karakterlerini. Ancak 100:4'te dilbilgisi geçmiş zaman fiillerine geçer (atharna, wasatna), ne YAPTIKLARINI anlatır. Bu ortaç-fiil geçişi, yemin içinde yapısal bir alt sınırı işaretler: karakterizasyon (1-3) anlatıya (4-5) yol verir."}}, {"type": "CONFIRMED", "ref": "100:4", "threadId": "concealment-disclosure", "title": {"en": "Dust as Re-Concealment", "tr": "Yeniden Gizleme Olarak Toz"}, "text": {"en": "The classical reading recognizes the dust cloud as battlefield obscurity. The data confirms this is the fourth stage of the concealment-disclosure sequence: the dust temporarily RE-conceals the scene. After the partial disclosure of fire and dawn, the dust throws a veil back over the action — a concealment that itself comes from disclosure (the charge that stirs the earth).", "tr": "Klasik okuma, toz bulutunu savaş alanı karartısı olarak tanır. Veri bunu gizleme-ifşa dizisinin dördüncü aşaması olarak teyit eder: toz, sahneyi geçici olarak YENİDEN gizler. Ateşin ve şafağın kısmi ifşasından sonra toz, eylemin üzerine bir perde geri atar — ifşadan kaynaklanan bir gizleme (toprağı karıştıran hücum)."}}, {"type": "DISCOVERY", "ref": "100:4", "threadId": "agricultural", "title": {"en": "The Plough Beneath the Charge", "tr": "Hücumun Altındaki Saban"}, "text": {"en": "Lane's Lexicon attests athara l-arda: \"he ploughed the earth, he turned the soil.\" Beneath the martial surface of dust-raising lies an agricultural image — the horses plough the ground. This is the first appearance of an agricultural thread that will run beneath the surah: ploughing here, barren soil at 100:6 (kanud), and harvest-sifting at 100:10 (hussila). The human is implicitly soil: worked by divine forces, expected to produce.", "tr": "Lane's Lexicon, athara l-arda'yı onaylar: \"toprağı sürdü, toprağı çevirdi\". Toz kaldırmanın savaşçıl yüzeyinin altında bir tarım imgesi yatar — atlar toprağı sürerler. Bu, surenin altından geçecek tarımsal bir dizginin ilk görünümüdür: burada sürme, 100:6'da kısır toprak (kanud) ve 100:10'da hasat-ayıklama (hussila). İnsan dolaylı olarak topraktır: ilahi güçler tarafından işlenir, ürün vermesi beklenir."}}, {"type": "DISCOVERY", "ref": "100:5", "threadId": "concealment-disclosure", "title": {"en": "The Only Violent \"Middle\" in the Quran", "tr": "Kur'an'daki Tek Şiddetli \"Orta\""}, "text": {"en": "The root w-s-t appears 5 times in the Quran. Four times it is an adjective meaning \"middle, moderate, best\" — most famously in 2:143, ummatan wasatan (\"a moderate/best nation\"). Here alone it becomes a verb: the concept of \"center\" is made kinetic, violent. The Quran verbalizes wasat exclusively in a destructive context. The root that elsewhere builds the ideal community (2:143) here destroys one (Lane's, Hans Wehr both attest \"middle/moderate\" and \"to penetrate the center\" senses).", "tr": "W-s-t kökü Kur'an'da 5 kez geçer. Dört kez \"orta, ılımlı, en iyi\" anlamında bir sıfattır — en meşhuru 2:143'te, ummatan wasatan (\"ılımlı/en iyi ümmet\"). Yalnızca burada fiil olur: \"merkez\" kavramı kinetik, şiddetli hâle getirilir. Kur'an, wasat'ı yalnızca yıkıcı bir bağlamda fiilleştirir. Başka yerde ideal topluluğu inşa eden kök (2:143) burada bir topluluğu yok eder (Lane's ve Hans Wehr, \"orta/ılımlı\" ve \"merkeze nüfuz etme\" anlamlarını onaylar)."}}, {"type": "DISCOVERY", "ref": "100:5", "threadId": "lexical-partition", "title": {"en": "The Absolute Boundary Ahead", "tr": "Yaklaşan Mutlak Sınır"}, "text": {"en": "Of the surah's 25 distinct roots, not a single one crosses the boundary between 100:1-5 and 100:6-11. The oath section and the declaration section share zero root vocabulary. The only root appearing twice in the surah, r-b-b, occurs at 100:6 and 100:11 — both within the declaration section. This total lexical partition is quantitatively extreme and goes beyond what classical commentary notes about the bipartite structure.", "tr": "Surenin 25 farklı kökünden tek biri bile 100:1-5 ile 100:6-11 arasındaki sınırı geçmez. Yemin bölümü ve beyan bölümü sıfır kök sözcük paylaşır. Surede iki kez geçen tek kök r-b-b, 100:6 ve 100:11'de geçer — ikisi de beyan bölümü içindedir. Bu tam sözcüksel bölünme nicel olarak aşırıdır ve klasik tefsirin iki parçalı yapı hakkında kaydettiğinin ötesine geçer."}}, {"type": "DISCOVERY", "ref": "100:1", "threadId": "variant-zones", "title": {"en": "Dot Variants Confined to the Oath", "tr": "Nokta Varyantları Yalnızca Yeminde"}, "text": {"en": "Among the surah's 18 qira'at variants, dot-placement variants (nuqat) occur exclusively in the oath section (100:1-5). Phonological/sukun variants appear exclusively in the diagnosis (100:6-8). Semantic/voice variants appear exclusively in the eschatology (100:9-11). This perfect segregation of variant types by structural zone was discovered independently by grammatical and variant analysis — two methods converging without coordination.", "tr": "Surenin 18 kıraat varyantı arasında nokta yerleşimi varyantları (nuqat) yalnızca yemin bölümünde (100:1-5) geçer. Fonolojik/sukun varyantları yalnızca teşhiste (100:6-8) görünür. Semantik/ses varyantları yalnızca eskatoljide (100:9-11) görünür. Varyant türlerinin yapısal bölgelere göre bu mükemmel ayrışımı, dilbilgisel ve varyant analizi tarafından bağımsız olarak keşfedilmiştir — iki yöntem koordinasyonsuz yakınsamıştır."}}, {"type": "DISCOVERY", "ref": "100:1", "threadId": "agency", "title": {"en": "Active Voice, Maximum Agency", "tr": "Etken Ses, Maksimum Faillik"}, "text": {"en": "All verbs and participles in the oath block are active: the chargers run, strike, raid, stir, plunge. This scene of maximal agency contrasts sharply with the passive verbs ahead at 100:9-10. The grammatical sub-boundary at 100:3-4 (participles to past-tense verbs) intensifies the agency: from describing what the oath subjects ARE to narrating what they DID.", "tr": "Yemin bloğundaki tüm fiiller ve ortaçlar etkendir: koşanlar koşar, çarpar, baskın yapar, karıştırır, dalar. Bu maksimal faillik sahnesi, 100:9-10'daki pasif fiillerle keskin bir tezat oluşturur. 100:3-4'teki dilbilgisel alt sınır (ortaçlardan geçmiş zaman fiillerine) failliği yoğunlaştırır: yemin öznelerinin NE olduğunu tanımlamaktan ne YAPTIKLARINI anlatmaya."}}], "threads": [{"threadId": "fire-chain", "stage": "planted", "ref": "100:1", "text": {"en": "The scorching sense of d-b-h plants fire in the surah's opening syllable. What sounds like breath is already flame.", "tr": "D-b-h'ın yakıcı anlamı, surenin açılış hecesine ateş eker. Nefes gibi görünen şey zaten alevdir."}}, {"threadId": "concealment-disclosure", "stage": "planted", "ref": "100:2", "text": {"en": "The root w-r-y encodes the surah's deepest pattern at the lexicographic level: concealment (wara'a) and disclosure (awra) are held within a single root. The sparks are hidden fire made visible.", "tr": "W-r-y kökü, surenin en derin desenini leksikografik düzeyde kodlar: gizleme (wara'a) ve ifşa (awra) tek bir kök içinde tutulur. Kıvılcımlar, gizli ateşin görünür hâle gelmesidir."}}, {"threadId": "fire-chain", "stage": "developed", "ref": "100:2", "text": {"en": "The fire planted in d-b-h (scorching breath) now becomes literal: sparks fly from hooves. The chain runs: heat (100:1) to flame (100:2).", "tr": "D-b-h'ta (yakıcı nefes) ekilen ateş şimdi gerçek olur: toynaklar kıvılcım saçar. Zincir işler: sıcaklık (100:1) alevlere (100:2)."}}, {"threadId": "agricultural", "stage": "planted", "ref": "100:4", "text": {"en": "The root '-th-r carries \"to plough\" alongside \"to stir up dust.\" The earth is turned — an agricultural act dressed in martial imagery.", "tr": "'-th-r kökü \"tozu karıştırmak\"ın yanı sıra \"sürmek\" anlamını taşır. Toprak çevrilir — savaşçıl imgelere bürünmüş tarımsal bir eylem."}}, {"threadId": "concealment-disclosure", "stage": "developed", "ref": "100:4", "text": {"en": "Dust re-conceals the scene. The surah's disclosure pattern oscillates: fire reveals (100:2), dawn reveals (100:3), dust conceals again (100:4). The concealment will persist until eschatological stripping.", "tr": "Toz sahneyi yeniden gizler. Surenin ifşa deseni salınır: ateş açığa çıkarır (100:2), şafak açığa çıkarır (100:3), toz tekrar gizler (100:4). Gizlenme, eskatoljik soyulmaya kadar sürecektir."}}, {"threadId": "concealment-disclosure", "stage": "developed", "ref": "100:5", "text": {"en": "The horses penetrate the concealing mass of a gathered host, breaking it open. Physical penetration of a gathering foreshadows eschatological penetration of graves (100:9) and chests (100:10).", "tr": "Atlar toplu bir toplantının gizleyici kütlesine nüfuz eder, onu kırar. Bir topluluğa fiziksel nüfuz, kabirlere (100:9) ve göğüslere (100:10) eskatoljik nüfuzu önceden haber verir."}}, {"threadId": "lexical-partition", "stage": "planted", "ref": "100:5", "text": {"en": "At this exact point, the surah's vocabulary resets entirely. Not a single root from the oath section will appear again. The total lexical partition is about to become audible.", "tr": "Tam bu noktada surenin sözcük dağarcığı tamamen sıfırlanır. Yemin bölümünden tek bir kök bile bir daha görünmeyecektir. Tam sözcüksel bölünme işitilebilir hâle gelmek üzeredir."}}, {"threadId": "variant-zones", "stage": "planted", "ref": "100:1", "text": {"en": "Dot-placement variants appear only in the oath section (100:1-5). The surah's recitation traditions will mirror its structural architecture with perfect precision — each zone carrying a different variant type.", "tr": "Nokta yerleşimi varyantları yalnızca yemin bölümünde (100:1-5) görünür. Surenin kıraat gelenekleri, yapısal mimarisini mükemmel hassasiyetle yansıtacaktır — her bölge farklı bir varyant türü taşır."}}, {"threadId": "agency", "stage": "planted", "ref": "100:1", "text": {"en": "Active voice dominates the oath: participles (characterizing being) give way to verbs (narrating action). The creatures are maximally agentive. This will be reversed.", "tr": "Etken ses yeminde baskındır: ortaçlar (varlığı karakterize etme) fiillere (eylemi anlatma) yol verir. Yaratıklar maksimal faildir. Bu tersine dönecektir."}}], "technicals": [{"ref": "100:1", "title": {"en": "Hapax and Polysemy Data", "tr": "Hapax ve Çokanlamlılık Verisi"}, "text": {"en": "Root d-b-h: 1 occurrence in the entire Quran (hapax). Lane's Lexicon attests two primary senses: (1) \"he breathed hard, panted\" and (2) \"the fire scorched the thing\" (dabaha l-naru). The root '-d-w in al-'adiyat carries \"to run, spring, leap\" AND \"to act wrongfully, show enmity\" (Lane's). The '-d-w polysemy is noted by al-Zamakhshari and al-Razi but is not resolved anywhere in the surah — both senses operate simultaneously.", "tr": "D-b-h kökü: Tüm Kur'an'da 1 geçiş (hapax). Lane's Lexicon iki birincil anlam onaylar: (1) \"ağır nefes aldı, soluk soluğa kaldı\" ve (2) \"ateş şeyi kavurdu\" (dabaha l-naru). Al-'adiyat'taki '-d-w kökü \"koşmak, sıçramak, atlamak\" VE \"haksızlık etmek, düşmanlık göstermek\" anlamlarını taşır (Lane's). '-d-w çokanlamlılığı el-Zemahşeri ve el-Razi tarafından kaydedilir ancak surenin hiçbir yerinde çözülmez — her iki anlam da aynı anda işler."}}, {"ref": "100:2", "title": {"en": "Root Polysemy and Hapax Data", "tr": "Kök Çokanlamlılığı ve Hapax Verisi"}, "text": {"en": "Root w-r-y: 37 total Quranic occurrences, but overwhelmingly as tawrat (\"Torah,\" 18x) or wara' (\"behind,\" 12x). The active participle al-muriyat (\"the fire-kindlers\") is the sole active participle use of this root in the Quran — a deliberately rare morphological form of a common root. Root q-d-h: Quranic hapax. Lane's attests \"to strike fire from flint\" and also \"to draw lots\" (qadaha bi-l-sahm). The lot-drawing sense is absent here but resonates with the eschatological reckoning of 100:9-11. Qira'at variant al-muriyyati (intensified gemination) strengthens the fire-production, suggesting a reading tradition that emphasized the fire-chain.", "tr": "W-r-y kökü: Kur'an'da toplam 37 geçiş, ancak ezici bir şekilde tawrat (\"Tevrat,\" 18x) veya wara' (\"arkasında,\" 12x) olarak. Al-muriyat etken ortacı (\"ateş tutuşturanlar\") bu kökün Kur'an'da tek etken ortaç kullanımıdır — yaygın bir kökün bilinçli olarak nadir bir morfolojik biçimi. Q-d-h kökü: Kur'an'da hapax. Lane's \"çakmaktaşından ateş çakmak\"ı ve ayrıca \"kura çekmek\"i (qadaha bi-l-sahm) onaylar. Kura çekme anlamı burada yoktur ancak 100:9-11'deki eskatoljik hesaplaşmayla yankılanır. Al-muriyyati kıraat varyantı (yoğunlaştırılmış şedde) ateş üretimini güçlendirir, bir okuma geleneğinin ateş zincirini vurguladığını önerir."}}, {"ref": "100:3", "title": {"en": "Morphological Pattern", "tr": "Morfolojik Desen"}, "text": {"en": "Root gh-y-r: 154 total Quranic occurrences, but predominantly as the noun ghayr (\"other than,\" 112x). The active participle al-mughirat is one of only 2 active participle uses — the surah selects the rarest form of a common root. All three oath participles (al-'adiyat, al-muriyat, al-mughirat) follow this pattern: common roots in their least common morphological form, producing a defamiliarization effect.", "tr": "Gh-y-r kökü: Kur'an'da toplam 154 geçiş, ancak ağırlıklı olarak ghayr ismi (\"başka,\" 112x) olarak. Al-mughirat etken ortacı yalnızca 2 etken ortaç kullanımından biridir — sure, yaygın bir kökün en nadir biçimini seçer. Her üç yemin ortacı da (al-'adiyat, al-muriyat, al-mughirat) bu deseni takip eder: yaygın kökler en az yaygın morfolojik biçimlerinde, yabancılaştırma etkisi üretir."}}, {"ref": "100:4", "title": {"en": "Root Data and Form Shift", "tr": "Kök Verisi ve Biçim Kayması"}, "text": {"en": "Root '-th-r: 21 total Quranic occurrences. In 14 of 21 it is the noun athar (\"trace, remnant\"). The verbal form atharna (\"they stirred up\") is one of only 3 past-tense verb uses — again, the rarest form of a common root. Root n-q-': Quranic hapax. Lane's attests three senses: (1) dust, (2) clamor/sound of battle, (3) soaking/permeation. The grammatical shift from participle (100:1-3) to past-tense verb (100:4-5) marks the sub-boundary between characterization and narration within the oath section. Qira'at variant fa-aththarna (Form II, geminated) deepens the marks from surface stirring to permanent impression.", "tr": "'-th-r kökü: Kur'an'da toplam 21 geçiş. 21'in 14'ünde athar ismidir (\"iz, kalıntı\"). Atharna fiil biçimi (\"karıştırdılar\") yalnızca 3 geçmiş zaman fiil kullanımından biridir — yine, yaygın bir kökün en nadir biçimi. N-q-' kökü: Kur'an'da hapax. Lane's üç anlam onaylar: (1) toz, (2) savaş gürültüsü/sesi, (3) ıslatma/nüfuz etme. Ortaçtan (100:1-3) geçmiş zaman fiiline (100:4-5) dilbilgisel kayma, yemin bölümü içinde karakterizasyon ile anlatı arasındaki alt sınırı işaretler. Fa-aththarna kıraat varyantı (Form II, şeddeli) izleri yüzeysel karıştırmadan kalıcı izlere derinleştirir."}}, {"ref": "100:5", "title": {"en": "Lexical Partition Data", "tr": "Sözcüksel Bölünme Verisi"}, "text": {"en": "Root w-s-t: 5 Quranic occurrences. 4 are nominal/adjectival (2:143 ummatan wasatan, 5:89, 68:28, 2:238). Only 100:5 is verbal — the sole verbalization of \"center/middle\" in the Quran. 25-root partition: Block A (100:1-5) contains '-d-w, d-b-h, w-r-y, q-d-h, gh-y-r, s-b-h, '-th-r, n-q-', w-s-t, j-m-'. Block B (100:6-11) contains '-n-s, k-n-d, r-b-b, '-l-w, sh-h-d, h-b-b, kh-y-r, sh-d-d, '-l-m, b-'-th-r, q-b-r, h-s-l, s-d-r, y-w-m, kh-b-r. Zero overlap. Qira'at variant fa-wassatna (Form II, geminated s) intensifies from \"entering the center\" to \"violently penetrating.\"", "tr": "W-s-t kökü: Kur'an'da 5 geçiş. 4'ü isim/sıfattır (2:143 ummatan wasatan, 5:89, 68:28, 2:238). Yalnızca 100:5 fiildir — Kur'an'da \"merkez/orta\"nın tek fiilleşmesi. 25-kök bölünmesi: Blok A (100:1-5) '-d-w, d-b-h, w-r-y, q-d-h, gh-y-r, s-b-h, '-th-r, n-q-', w-s-t, j-m-' içerir. Blok B (100:6-11) '-n-s, k-n-d, r-b-b, '-l-w, sh-h-d, h-b-b, kh-y-r, sh-d-d, '-l-m, b-'-th-r, q-b-r, h-s-l, s-d-r, y-w-m, kh-b-r içerir. Sıfır örtüşme. Fa-wassatna kıraat varyantı (Form II, şeddeli s) \"merkeze girme\"den \"şiddetle nüfuz etme\"ye yoğunlaşır."}}, {"ref": "100:1", "title": {"en": "Variant Type Distribution", "tr": "Varyant Türü Dağılımı"}, "text": {"en": "18 total qira'at variants. Dot variants (nuqat): 100:1 wa-l-ghadiyati, 100:1 subhan — confined to oath. Vr variants (morphological): 100:2 al-muriyyati, 100:4 fa-aththarna, 100:5 fa-wassatna — confined to oath. skn variants (phonological): 100:6 li-rabbih, 100:6 li-rabbihi, 100:8 al-khayr — confined to diagnosis. Pss/ibdal/Lx/in-an/hf variants: all confined to 100:9-11 eschatology. Perfect correlation between variant type and structural zone.", "tr": "Toplam 18 kıraat varyantı. Nokta varyantları (nuqat): 100:1 wa-l-ghadiyati, 100:1 subhan — yeminle sınırlı. Vr varyantları (morfolojik): 100:2 al-muriyyati, 100:4 fa-aththarna, 100:5 fa-wassatna — yeminle sınırlı. skn varyantları (fonolojik): 100:6 li-rabbih, 100:6 li-rabbihi, 100:8 al-khayr — teşhisle sınırlı. Pss/ibdal/Lx/in-an/hf varyantları: tümü 100:9-11 eskatoljisiyle sınırlı. Varyant türü ile yapısal bölge arasında mükemmel korelasyon."}}]}, {"title": {"en": "Section B: The Human Diagnosis", "tr": "Section B: İnsan Teşhisi"}, "ayahStart": "6", "ayahEnd": "8", "ayahs": [{"ref": "100:6", "arabic": "إِنَّ ٱلْإِنسَٰنَ لِرَبِّهِۦ لَكَنُودٌۭ", "translation": {"en": "Truly, the human being is ungrateful to his Lord —", "tr": "Gerçekten, insan Rabbine karşı nankörlük eder —"}}, {"ref": "100:7", "arabic": "وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌۭ", "translation": {"en": "And truly, he is a witness to that —", "tr": "Ve gerçekten, o, buna şahittir —"}}, {"ref": "100:8", "arabic": "وَإِنَّهُۥ لِحُبِّ ٱلْخَيْرِ لَشَدِيدٌ", "translation": {"en": "And truly, in his love of wealth he is fierce —", "tr": "Ve gerçekten, mal sevgisinde şiddetlidir —"}}], "classical": [{"ref": "100:6", "text": {"en": "The oaths resolve into a verdict: the human (al-insan) is kanud — ungrateful. Classical lexicons give \"one who withholds, who counts afflictions and forgets blessings.\" This word occurs nowhere else in the Quran. The inna...la- construction (double emphasis) marks the transition from oath to judgment. The vivid horse scene was prosecutorial evidence — the horse gives its utmost while the human hoards.", "tr": "Yeminler bir hükme varır: insan (al-insan) kanud'dur — nankördür. Klasik leksikonlar \"engelleyen, belâları sayan ve nimetleri unutan\" anlamını verir. Bu kelime Kur'an'ın başka yerinde geçmez. İnna...la- yapısı (çift vurgu) yeminden hükme geçişi işaretler. Canlı at sahnesi savcılık deliliydi — at elinden geleni yapar, insan ise saklar."}}, {"ref": "100:7", "text": {"en": "The human knows his own ingratitude — he is shahid (witness) upon it. Some commentators read the pronoun as referring to God: \"He [God] is witness to that.\" The ambiguity creates a double courtroom: the defendant is also the witness, or the Judge is also the witness. Either way, concealment becomes impossible.", "tr": "İnsan kendi nankörlüğünü bilir — o, ona şahiddir (shahid). Bazı müfessirler zamiri Allah'a atıfta bulunan olarak okur: \"O [Allah] buna şahittir\". Belirsizlik çifte bir mahkeme yaratır: sanık aynı zamanda şahittir, ya da Hâkim aynı zamanda şahittir. Her iki durumda da gizlenme imkânsız hâle gelir."}}, {"ref": "100:8", "text": {"en": "The diagnosis sharpens: the human is shadid (intense, fierce) in love of al-khayr. Classical commentators gloss al-khayr as \"wealth\" (al-mal), following Quranic usage in 2:180 and 89:20. The tricolon of 100:6-8 is complete: ungrateful, self-aware, yet fierce in attachment. The three predicates (kanud, shahid, shadid) rhyme in -id, binding the diagnosis sonically.", "tr": "Teşhis keskinleşir: insan al-khayr sevgisinde shadid'dir (yoğun, şiddetli). Klasik müfessirler al-khayr'ı 2:180 ve 89:20'deki Kur'an kullanımına dayanarak \"mal\" (al-mal) olarak yorumlarlar. 100:6-8'in üçlü dizisi tamamlanır: nankör, farkında, ancak bağlanmada şiddetli. Üç yüklem (kanud, shahid, shadid) -id ile kafiyeli, teşhisi sesli olarak birbirine bağlar."}}], "findings": [{"type": "CONFIRMED", "ref": "100:6", "threadId": "concealment-disclosure", "title": {"en": "The Pivot to Inner Reality", "tr": "İç Gerçekliğe Dönüş"}, "text": {"en": "Classical tafsir identifies this as the jawab al-qasam (oath response) and the surah's central diagnosis. The inna...la- construction marks the transition from external scene to inner moral reality. The data confirms this as the surah's single pivot point, reinforced by the total lexical partition at the 5/6 boundary.", "tr": "Klasik tefsir bunu jawab al-qasam (yemin cevabı) ve surenin merkezi teşhisi olarak tanımlar. İnna...la- yapısı dış sahneden iç ahlaki gerçekliğe geçişi işaretler. Veri bunu surenin tek dönüş noktası olarak teyit eder, 5/6 sınırındaki tam sözcüksel bölünme tarafından pekiştirilir."}}, {"type": "DISCOVERY", "ref": "100:6", "threadId": "agricultural", "title": {"en": "Barren Soil That Receives Rain and Yields Nothing", "tr": "Yağmur Alan Ama Hiçbir Şey Vermeyen Kısır Toprak"}, "text": {"en": "Lane's Lexicon attests a meaning of kanud beyond mere ingratitude: \"barren land that yields nothing despite receiving rain\" (al-ard al-kanud). Lisan al-Arab confirms. The human is not merely ungrateful — he is soil that receives divine sustenance (from rabb, the Nurturer) but fails to produce. This connects back to '-th-r (100:4, \"ploughing\") and forward to h-s-l (100:10, \"separating grain from chaff\"): the ploughed earth is barren and will face a final harvest.", "tr": "Lane's Lexicon, kanud'un salt nankörlüğün ötesinde bir anlamını onaylar: \"yağmur almasına rağmen hiçbir şey vermeyen kısır toprak\" (al-ard al-kanud). Lisânü'l-Arab teyit eder. İnsan yalnızca nankör değil — ilahi beslemeyi (rabb'dan, Besleyici'den) alan ama üretmeyen topraktır. Bu, '-th-r'a (100:4, \"sürme\") geri ve h-s-l'ye (100:10, \"daneden samanı ayırma\") ileriye bağlanır: sürülmüş toprak kısırdır ve nihai bir hasatla yüzleşecektir."}}, {"type": "DISCOVERY", "ref": "100:6", "threadId": "concealment-disclosure", "title": {"en": "The Rarest Word in Maximum-Frequency Company", "tr": "Maksimum Frekanslı Eşlik İçinde En Nadir Kelime"}, "text": {"en": "The root k-n-d is a Quranic hapax — appearing only here. Yet it is embedded between '-n-s (343 Quranic occurrences) and r-b-b (975 occurrences), two of the most frequent roots in the entire Quran. The rarest possible word is framed by maximum familiarity, creating a deliberate shock: the listener encounters a completely unique word inside the most established of Quranic relationships (human-to-Lord). The '-n-s + r-b-b co-occurrence pair shares 58 ayahs elsewhere.", "tr": "K-n-d kökü Kur'an'da hapax'tır — yalnızca burada geçer. Ancak Kur'an'ın tamamındaki en sık geçen köklerinden ikisi olan '-n-s (343 Kur'an geçişi) ve r-b-b (975 geçiş) arasına yerleştirilmiştir. En nadir olası kelime maksimum tanışıklıkla çerçevelenir, kasıtlı bir şok yaratır: dinleyici, en yerleşik Kur'an ilişkilerinin (insan-Rab) içinde tamamen benzersiz bir kelimeyle karşılaşır. '-n-s + r-b-b birlikte geçiş çifti başka yerlerde 58 ayeti paylaşır."}}, {"type": "CONFIRMED", "ref": "100:7", "threadId": "concealment-disclosure", "title": {"en": "Self-Knowledge Breaks Concealment", "tr": "Öz-Bilgi Gizlemeyi Kırar"}, "text": {"en": "Classical tafsir identifies the paradox: the human witnesses his own failing. Whether the pronoun refers to the human or to God, concealment is pierced by awareness. The data confirms this as another step in the concealment-to-disclosure arc — the inner state of kanud is no longer fully hidden.", "tr": "Klasik tefsir paradoksu tanımlar: insan kendi başarısızlığına tanıklık eder. Zamir insana veya Allah'a atıfta bulunsun, gizlenme farkındalık tarafından delinir. Veri bunu gizleme-ifşa yayındaki bir başka adım olarak teyit eder — kanud'un iç hâli artık tamamen gizli değildir."}}, {"type": "TENSION", "ref": "100:7", "threadId": "concealment-disclosure", "title": {"en": "Three Witnesses, One Pronoun", "tr": "Üç Şahit, Bir Zamir"}, "text": {"en": "The pronoun -hu in innahu has three grammatically valid referents, each producing a different theology: (1) the human witnesses his own ingratitude (psychological), (2) God witnesses the human's ingratitude (juridical), (3) both simultaneously (the text holds the ambiguity as a feature). The wa- particle changes function depending on the referent: if human, it is 'atf (coordination with 100:6); if God, it is isti'naf (resumptive, introducing a new subject). Classical tafsir debates the referent; the data shows the ambiguity is structural, not accidental.", "tr": "İnnahu'daki -hu zamiri dilbilgisel olarak geçerli üç atıfta bulunana sahiptir, her biri farklı bir ilahiyat üretir: (1) insan kendi nankörlüğüne tanıklık eder (psikolojik), (2) Allah insanın nankörlüğüne tanıklık eder (hukuki), (3) her ikisi aynı anda (metin belirsizliği bir özellik olarak taşır). Wa- edatı, atıfta bulunana bağlı olarak işlev değiştirir: eğer insan ise 'atf'tır (100:6 ile koordinasyon); eğer Allah ise isti'naf'tır (yeni bir özne getiren). Klasik tefsir atıfta bulunanı tartışır; veri belirsizliğin yapısal olduğunu gösterir, rastlantısal değil."}}, {"type": "CONFIRMED", "ref": "100:8", "threadId": "agency", "title": {"en": "The Tricolon Complete", "tr": "Üçlü Dizi Tamamlandı"}, "text": {"en": "Classical tafsir recognizes the three-part inna...la- structure. The data confirms: each predicate follows the fa'il/fa'ul pattern (kanud, shahid, shadid) with phonological near-rhyme, creating a rhetorical escalation from diagnosis (100:6) to self-awareness (100:7) to the specific manifestation of the condition (100:8).", "tr": "Klasik tefsir üç parçalı inna...la- yapısını tanır. Veri teyit eder: her yüklem fa'il/fa'ul desenini (kanud, shahid, shadid) fonolojik neredeyse-kafiye ile takip eder, teşhisten (100:6) öz-farkındalığa (100:7) durumun özel tezahürüne (100:8) retorik bir yükseliş yaratır."}}, {"type": "DISCOVERY", "ref": "100:8", "threadId": "fire-chain", "title": {"en": "Shahid and Shadid: One Consonant Apart", "tr": "Shahid ve Shadid: Bir Sessiz Harf Farkında"}, "text": {"en": "The predicates shahid (100:7) and shadid (100:8) differ by a single consonant (h to d). Both follow the fa'il pattern, both begin with sh-. The phonetic near-identity implies conceptual fusion: self-knowledge (shahid) does not cure intensity (shadid) — it coexists with it. The human is not ungrateful despite knowing better; the knowing and the excess are structurally fused at the level of sound. This link was independently identified by two separate analytical passes.", "tr": "Shahid (100:7) ve shadid (100:8) yüklemleri tek bir sessiz harfle (h'den d'ye) farklıdır. Her ikisi de fa'il desenini takip eder, her ikisi de sh- ile başlar. Fonetik neredeyse-özdeşlik kavramsal füzyonu ima eder: öz-bilgi (shahid) yoğunluğu (shadid) tedavi etmez — onunla birlikte var olur. İnsan daha iyi bilmesine rağmen nankör değildir; bilme ve aşırılık ses düzeyinde yapısal olarak kaynaşmıştır. Bu bağlantı iki ayrı analitik geçiş tarafından bağımsız olarak tanımlanmıştır."}}, {"type": "DISCOVERY", "ref": "100:8", "threadId": "agricultural", "title": {"en": "The Sulayman Parallel: Horses, Love, and Forgetting the Lord", "tr": "Süleyman Paraleli: Atlar, Sevgi ve Rabbi Unutma"}, "text": {"en": "The triple root cluster h-b-b + kh-y-r + sh-d-d co-occurs in only three Quranic contexts. At 2:165: ashuddu hubban lillah (\"more intense in love for God\") — the positive mirror. At 38:32: Sulayman says hubba l-khayr (\"I loved the love of horses/good\") until he forgot dhikri rabbi (\"remembrance of my Lord\") — a direct thematic parallel. The 38:32 connection is lexically bonded at the root level, not merely thematic: both involve horses, love of khayr, and distraction from rabb.", "tr": "H-b-b + kh-y-r + sh-d-d üçlü kök kümesi yalnızca üç Kur'an bağlamında birlikte geçer. 2:165'te: ashuddu hubban lillah (\"Allah'a karşı sevgide daha şiddetli\") — pozitif ayna. 38:32'de: Süleyman hubba l-khayr (\"atların/iyiliğin sevgisini sevdim\") der, ta ki dhikri rabbi'yi (\"Rabbimi anmayı\") unutana kadar — doğrudan tematik paralel. 38:32 bağlantısı yalnızca tematik değil kök düzeyinde leksiksel olarak bağlıdır: her ikisi de atlar, khayr sevgisi ve rabb'den dikkatin dağılmasını içerir."}}, {"type": "TENSION", "ref": "100:8", "threadId": "concealment-disclosure", "title": {"en": "Horses or Wealth? The al-khayr Question", "tr": "Atlar mı Mal mı? Al-khayr Sorusu"}, "text": {"en": "Lane's attests al-khayr = al-khayl (horses) in pre-Islamic usage. If al-khayr means horses, the surah forms a ring: the charging steeds of 100:1-5 become the object of the human's fierce love in 100:8, and the 38:32 parallel (Sulayman distracted by horses from remembering his Lord) is fully activated. If it means wealth, the diagnosis is simpler. The root kh-y-r fundamentally means \"to choose\" (Lane's, Hans Wehr) — al-khayr is \"the chosen thing,\" subsuming all specific readings.", "tr": "Lane's, İslam öncesi kullanımda al-khayr = al-khayl (atlar) onaylar. Eğer al-khayr atlar anlamına gelirse sure bir halka oluşturur: 100:1-5'in koşan atları 100:8'de insanın şiddetli sevgisinin nesnesi olur ve 38:32 paraleli (Süleyman'ın atlar tarafından Rabbini anmaktan dikkati dağılması) tamamen aktive olur. Eğer mal anlamına gelirse, teşhis daha basittir. Kh-y-r kökü temel olarak \"seçmek\" anlamına gelir (Lane's, Hans Wehr) — al-khayr \"seçilen şey\"dir, tüm özel okumaları kapsar."}}, {"type": "DISCOVERY", "ref": "100:6", "threadId": "variant-zones", "title": {"en": "Phonological Variants Only in the Diagnosis", "tr": "Yalnızca Teşhiste Fonolojik Varyantlar"}, "text": {"en": "The theological core (100:6-8) carries exclusively phonological/sukun qira'at variants — zero semantic variants. The reading tradition preserved the diagnosis section's meaning with maximum stability while allowing minor phonological variation. This contrasts with the eschatological section ahead, where variants actively contest meaning and redistribute agency.", "tr": "Teolojik çekirdek (100:6-8) yalnızca fonolojik/sukun kıraat varyantları taşır — sıfır semantik varyant. Okuma geleneği, teşhis bölümünün anlamını maksimum istikrarla korumuş, küçük fonolojik varyasyona izin vermiştir. Bu, ilerideki eskatoljik bölümle tezat oluşturur, burada varyantlar aktif olarak anlam üzerinde mücadele eder ve failliği yeniden dağıtır."}}], "threads": [{"threadId": "agricultural", "stage": "developed", "ref": "100:6", "text": {"en": "The ploughed earth of 100:4 is now diagnosed: it is kanud — barren soil. The human receives rain (divine nurturing through rabb) but produces nothing. The harvest is still coming.", "tr": "100:4'ün sürülmüş toprağı şimdi teşhis edilir: o kanud'dur — kısır topraktır. İnsan yağmur alır (rabb aracılığıyla ilahi besleme) ama hiçbir şey üretmez. Hasat hâlâ geliyor."}}, {"threadId": "concealment-disclosure", "stage": "developed", "ref": "100:6", "text": {"en": "Ingratitude is a form of concealment: the kanud hides blessings from acknowledgment. The surah moves from physical concealment (dust, 100:4) to moral concealment (ingratitude, 100:6).", "tr": "Nankörlük bir gizleme biçimidir: kanud nimetleri ikrardan gizler. Sure, fiziksel gizlemeden (toz, 100:4) ahlaki gizlemeye (nankörlük, 100:6) geçer."}}, {"threadId": "concealment-disclosure", "stage": "developed", "ref": "100:7", "text": {"en": "Shahid (witness) means concealment is already breached from within. Whether the human witnesses himself or God witnesses him, the inner state of kanud is no longer hidden.", "tr": "Shahid (şahit) gizlenmenin zaten içeriden delindiği anlamına gelir. İnsan kendine tanıklık etsin veya Allah ona tanıklık etsin, kanud'un iç hâli artık gizli değildir."}}, {"threadId": "fire-chain", "stage": "developed", "ref": "100:8", "text": {"en": "Intensity (shadid) in the human mirrors the intensity of the oath: fierce charge (100:1-5) and fierce love (100:8) are parallel manifestations. Fire in breath (100:1), sparks (100:2), and now burning desire.", "tr": "İnsandaki yoğunluk (shadid) yemindeki yoğunluğu yansıtır: şiddetli hücum (100:1-5) ve şiddetli sevgi (100:8) paralel tezahürlerdir. Nefeste ateş (100:1), kıvılcımlar (100:2) ve şimdi yanan arzu."}}], "technicals": [{"ref": "100:6", "title": {"en": "Root and Co-occurrence Data", "tr": "Kök ve Birlikte Geçiş Verisi"}, "text": {"en": "Root k-n-d: Quranic hapax. Lane's attests: (1) ungrateful, (2) one who counts afflictions and forgets blessings, (3) barren land yielding nothing despite rain, (4) one who eats alone and withholds, (5) one who severs ties. Lisan al-Arab confirms all senses. The '-n-s + r-b-b co-occurrence pair has 58 shared ayahs — one of the Quran's most frequent pairings. Qira'at: only phonological (sukun) variants on li-rabbihi in this section — zero semantic variants. The theological core is textually the most stable part of the surah.", "tr": "K-n-d kökü: Kur'an'da hapax. Lane's onaylar: (1) nankör, (2) belâları sayan ve nimetleri unutan, (3) yağmura rağmen hiçbir şey vermeyen kısır toprak, (4) yalnız yiyen ve engelleyen, (5) bağları koparan. Lisânü'l-Arab tüm anlamları teyit eder. '-n-s + r-b-b birlikte geçiş çifti 58 paylaşılan ayete sahiptir — Kur'an'ın en sık geçen eşleşmelerinden biri. Kıraat: bu bölümde li-rabbihi üzerinde yalnızca fonolojik (sukun) varyantlar — sıfır semantik varyant. Teolojik çekirdek metinsel olarak surenin en istikrarlı kısmıdır."}}, {"ref": "100:7", "title": {"en": "Grammatical Ambiguity", "tr": "Dilbilgisel Belirsizlik"}, "text": {"en": "If -hu = al-insan (100:6): wa- is 'atf (coordination) and the human is defendant and witness. If -hu = God: wa- is isti'naf (new beginning), introducing a divine statement. Root sh-h-d: 160+ Quranic occurrences. Lane's: \"he witnessed, was present, gave testimony.\" The martyr sense (shahid = one who dies bearing witness) is conspicuously absent in a surah opening with battle imagery — the surah deflects from martial heroism toward ethical self-awareness.", "tr": "Eğer -hu = al-insan (100:6) ise: wa- 'atf'tır (koordinasyon) ve insan sanık ve şahittir. Eğer -hu = Allah ise: wa- isti'naf'tır (yeni başlangıç), ilahi bir ifadeyi getirir. Sh-h-d kökü: 160+ Kur'an geçişi. Lane's: \"tanıklık etti, hazır bulundu, şahitlik etti\". Şehit anlamı (shahid = tanıklık ederek ölen) savaş imgesiyle açılan bir surede belirgin şekilde yoktur — sure, savaşçı kahramanlıktan etik öz-farkındalığa saptırır."}}, {"ref": "100:8", "title": {"en": "Co-occurrence and Polysemy Data", "tr": "Birlikte Geçiş ve Çokanlamlılık Verisi"}, "text": {"en": "Root h-b-b + kh-y-r co-occurrences: 100:8, 2:216, 38:32. Root h-b-b + sh-d-d: 100:8, 2:165. Root kh-y-r + sh-d-d: 100:8, 4:66, 4:77. The 38:32 parallel (Sulayman and horses) noted by al-Qurtubi. Root kh-y-r fundamental meaning: \"to choose\" (ikhtara, Lane's, Hans Wehr). Three possible glosses of al-khayr: (a) wealth (supported by 2:180, 89:20), (b) moral goodness, (c) horses (supported by Lane's pre-Islamic attestation, 38:32 parallel). Qira'at: only phonological (sukun) variant on al-khayr — zero semantic variants in the diagnostic section.", "tr": "H-b-b + kh-y-r birlikte geçişleri: 100:8, 2:216, 38:32. H-b-b + sh-d-d: 100:8, 2:165. Kh-y-r + sh-d-d: 100:8, 4:66, 4:77. 38:32 paraleli (Süleyman ve atlar) el-Kurtubi tarafından kaydedilir. Kh-y-r kökünün temel anlamı: \"seçmek\" (ikhtara, Lane's, Hans Wehr). Al-khayr'ın üç olası yorumu: (a) mal (2:180, 89:20 tarafından desteklenir), (b) ahlaki iyilik, (c) atlar (Lane's İslam öncesi onayı, 38:32 paraleli tarafından desteklenir). Kıraat: al-khayr üzerinde yalnızca fonolojik (sukun) varyant — teşhis bölümünde sıfır semantik varyant."}}]}, {"title": {"en": "Section C: The Eschatological Warning", "tr": "Section C: Eskatoljik Uyarı"}, "ayahStart": "9", "ayahEnd": "10", "ayahs": [{"ref": "100:9", "arabic": "أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِى ٱلْقُبُورِ", "translation": {"en": "Does he not know? When what is in the graves is overturned —", "tr": "Bilmiyor mu? Kabirlerdeki alt üst edildiğinde —"}}, {"ref": "100:10", "arabic": "وَحُصِّلَ مَا فِى ٱلصُّدُورِ", "translation": {"en": "And what is in the breasts is brought forth —", "tr": "Ve göğüslerdeki açığa çıkarıldığında —"}}], "classical": [{"ref": "100:9", "text": {"en": "The rhetorical question halts the momentum: a-fa-la ya'lamu (\"does he not know?\"). The scene shifts to eschatology — graves are overturned (bu'thira). The root b-'-th-r is a rare quadriliteral evoking violent upheaval. Classical commentators pair this with 82:4 (the only other occurrence of this exact formula) as an eschatological stock image.", "tr": "Retorik soru momentumu durdurur: a-fa-la ya'lamu (\"bilmiyor mu?\"). Sahne eskatoljiye kayar — kabirler alt üst edilir (bu'thira). B-'-th-r kökü, şiddetli çalkantıyı çağrıştıran nadir bir dörtlü harfli kökdür. Klasik müfessirler bunu 82:4 ile (bu tam formülün geçtiği tek diğer yer) eskatoljik kalıp imge olarak eşleştirir."}}, {"ref": "100:10", "text": {"en": "The disclosure deepens from external to internal: not only graves but breasts are opened. Hussila means \"extracted, sifted, made apparent.\" Classical reading sees a tight parallel: qubur (graves) and sudur (breasts) share the fu'ul broken plural pattern, binding external containers (graves) and internal containers (chests). What was physically buried and what was psychologically hidden — both are exposed.", "tr": "İfşa dışsaldan içsele derinleşir: yalnızca kabirler değil göğüsler de açılır. Hussila \"çıkarıldı, ayıklandı, açığa çıkarıldı\" anlamına gelir. Klasik okuma sıkı bir paralellik görür: qubur (kabirler) ve sudur (göğüsler) fu'ul kırık çoğul desenini paylaşır, dış kapları (kabirler) ve iç kapları (göğüsler) birbirine bağlar. Fiziksel olarak gömülü olan ve psikolojik olarak gizli olan — her ikisi de ifşa edilir."}}], "findings": [{"type": "CONFIRMED", "ref": "100:9", "threadId": "concealment-disclosure", "title": {"en": "Graves Opened: Physical Concealment Undone", "tr": "Açılan Kabirler: Fiziksel Gizlenme Geri Alındı"}, "text": {"en": "Classical tafsir universally reads bu'thira ma fi l-qubur as the resurrection: the dead are raised, what was buried is exposed. The data confirms this as the penultimate stage of the concealment-to-disclosure arc: fire from stone, dawn from darkness, dust from earth, ingratitude from the heart — and now bodies from graves.", "tr": "Klasik tefsir evrensel olarak bu'thira ma fi l-qubur'u diriliş olarak okur: ölüler diriltilir, gömülü olan ifşa edilir. Veri bunu gizleme-ifşa yayının sondan bir önceki aşaması olarak teyit eder: taştan ateş, karanlıktan şafak, topraktan toz, kalpten nankörlük — ve şimdi kabirlerden bedenler."}}, {"type": "DISCOVERY", "ref": "100:9", "threadId": "agency", "title": {"en": "The Voice Reversal: Active Becomes Passive", "tr": "Ses Terslemesi: Etken Pasif Olur"}, "text": {"en": "In 100:1-5, the oath subjects are vigorously active: they charge, strike, raid, stir, penetrate. Now the verbs are passive: bu'thira (\"is overturned\"), with no agent named. The human who charged vigorously is now passively subjected to cosmic processes. Qira'at variants at this point systematically contest the passive: one reads ba'thara (active voice), another reads yu'lamu (passive) for the standard ya'lamu (active). The active-to-passive reversal is both a compositional choice and a site of theological debate across reading traditions.", "tr": "100:1-5'te yemin özneleri güçlü bir şekilde etkendir: koşarlar, çarparlar, baskın yaparlar, karıştırırlar, nüfuz ederler. Şimdi fiiller pasiftir: bu'thira (\"alt üst edilir\"), fail adı verilmez. Güçlü bir şekilde hücum eden insan şimdi pasif olarak kozmik süreçlere tabi tutulur. Bu noktadaki kıraat varyantları sistematik olarak pasifi tartışır: biri ba'thara (etken ses) okur, bir diğeri standart ya'lamu (etken) için yu'lamu (pasif) okur. Etken-pasif terslemesi hem kompozisyonel bir seçimdir hem de okuma gelenekleri arasında teolojik bir tartışma alanıdır."}}, {"type": "DISCOVERY", "ref": "100:9", "threadId": "variant-zones", "title": {"en": "The Forensic Alternative: Searching, Not Scattering", "tr": "Adli Alternatif: Araştırma, Dağıtma Değil"}, "text": {"en": "Three independent variant traditions (ibdal, Lx, active ibdal) all converge on the root b-h-th (\"to search, investigate\") instead of b-'-th-r (\"to scatter\"). This transforms the eschatological image from chaotic upheaval to systematic investigation: graves are forensically examined, not violently overturned. The root b-h-th appears at 5:31, where a crow digs in the earth to teach Cain burial — the same root that teaches burial now describes its reversal. Both readings serve the concealment-disclosure arc: b-'-th-r is violent disclosure, b-h-th is methodical disclosure (Lane's: bahatha, \"he searched, investigated, dug\").", "tr": "Üç bağımsız varyant geleneği (ibdal, Lx, etken ibdal) hepsi b-'-th-r (\"dağıtmak\") yerine b-h-th (\"aramak, soruşturmak\") köküne yakınsar. Bu, eskatoljik imgeyi kaotik çalkantıdan sistematik soruşturmaya dönüştürür: kabirler adli olarak incelenir, şiddetli olarak alt üst edilmez. B-h-th kökü 5:31'de geçer, orada bir karga gömüyü Kabil'e öğretmek için toprağı kazar — gömüyü öğreten aynı kök şimdi onun tersine dönüşünü anlatır. Her iki okuma da gizleme-ifşa yayına hizmet eder: b-'-th-r şiddetli ifşadır, b-h-th metodolojik ifşadır (Lane's: bahatha, \"aradı, soruşturdu, kazdı\")."}}, {"type": "CONFIRMED", "ref": "100:10", "threadId": "concealment-disclosure", "title": {"en": "The Inner Container Opened", "tr": "Açılan İç Kap"}, "text": {"en": "Classical tafsir reads hussila ma fi l-sudur as the exposure of hidden intentions on the Day of Judgment. The data confirms the qubur/sudur pairing as a deliberate outer-to-inner intensification: from graves (external) to chests (internal), from physical concealment to psychological concealment. The root s-d-r etymologically carries sadara, \"to issue forth\" (Lane's) — the container's very name encodes the inevitability of its contents emerging.", "tr": "Klasik tefsir hussila ma fi l-sudur'u Kıyamet Günü'nde gizli niyetlerin ifşası olarak okur. Veri qubur/sudur eşleşmesini kasıtlı bir dış-iç yoğunlaştırması olarak teyit eder: kabirlerden (dışsal) göğüslere (içsel), fiziksel gizlemeden psikolojik gizlemeye. S-d-r kökü etimolojik olarak sadara'yı taşır, \"çıkmak\" (Lane's) — kabın adı içeriğinin çıkışının kaçınılmazlığını kodlar."}}, {"type": "DISCOVERY", "ref": "100:10", "threadId": "agricultural", "title": {"en": "The Final Harvest: Separating Grain from Chaff", "tr": "Nihai Hasat: Daneden Samanı Ayırma"}, "text": {"en": "Lane's Lexicon attests the primary meaning of h-s-l: \"to separate grain from chaff, to gather dates from a palm tree, to distinguish the good from the bad.\" Lisan al-Arab confirms: tahsil = \"extracting the kernel from the husk.\" The eschatological extraction from breasts is cast in agricultural language — it is a harvest. The thread completes: earth ploughed (100:4), soil barren (100:6), harvest arrives (100:10). The human-as-soil metaphor resolves: divine judgment is the threshing floor.", "tr": "Lane's Lexicon, h-s-l'nin birincil anlamını onaylar: \"daneden samanı ayırmak, hurma ağacından hurma toplamak, iyiyi kötüden ayırt etmek\". Lisânü'l-Arab teyit eder: tahsil = \"kabuğundan çekirdeği çıkarma\". Göğüslerden eskatoljik çıkarma, tarımsal dilde ifade edilir — bir hasattır. Dizgi tamamlanır: toprak sürüldü (100:4), toprak kısır (100:6), hasat geldi (100:10). İnsan-toprak olarak metaforu çözülür: ilahi yargı harman yeridir."}}, {"type": "DISCOVERY", "ref": "100:10", "threadId": "agency", "title": {"en": "The Hussila Triptych: Three Theologies of Disclosure", "tr": "Hussila Üçlemesi: Üç İfşa İlahiyatı"}, "text": {"en": "The word hussila generates three variant forms, each encoding a different theology. Hasala (Form I active): \"what is in the breasts came forth\" — autonomous emergence, truth surfaces on its own. Hassala (Form II active): \"He thoroughly extracted what is in the breasts\" — God acts deliberately as forensic agent. Hasila (stative): \"what is in the breasts entered a disclosed state\" — no agent, no process, just a transition of being. These three readings map the complete spectrum of eschatological agency. No other word in this surah generates such systematic exploration of a single theological question.", "tr": "Hussila kelimesi üç varyant biçimi üretir, her biri farklı bir ilahiyatı kodlar. Hasala (Form I etken): \"göğüslerdekiler çıktı\" — otonom ortaya çıkış, hakikat kendi başına yüzeye çıkar. Hassala (Form II etken): \"O, göğüslerdekini tamamen çıkardı\" — Allah adli fail olarak kasıtlı hareket eder. Hasila (durum bildiren): \"göğüslerdekiler ifşa edilmiş bir duruma girdi\" — fail yok, süreç yok, sadece varlık geçişi. Bu üç okuma, eskatoljik failliğin tam spektrumunu eşler. Surede başka hiçbir kelime tek bir teolojik sorunun bu sistematik keşfini üretmez."}}], "threads": [{"threadId": "concealment-disclosure", "stage": "developed", "ref": "100:9", "text": {"en": "Graves — the ultimate containers of concealment — are forced open. The physical disclosure of 100:2-5 (fire, dawn, dust) now becomes eschatological. What was buried will be exposed.", "tr": "Kabirler — gizlenmenin nihai kapları — zorla açılır. 100:2-5'in fiziksel ifşası (ateş, şafak, toz) şimdi eskatoljik olur. Gömülü olan ifşa edilecektir."}}, {"threadId": "agency", "stage": "developed", "ref": "100:9", "text": {"en": "The voice shifts from active (the horses ACT) to passive (the graves are ACTED UPON). The human who charged vigorously loses all agency in the eschatological scene. Variant traditions contest this passivity, redistributing agency across the spectrum.", "tr": "Ses etkenden (atlar HAREKET eder) pasife (kabirler HAREKET EDİLİR) kayar. Güçlü bir şekilde hücum eden insan, eskatoljik sahnede tüm failliğini kaybeder. Varyant gelenekleri bu pasifliği tartışır, failliği spektrum boyunca yeniden dağıtır."}}, {"threadId": "variant-zones", "stage": "developed", "ref": "100:9", "text": {"en": "The eschatological section (100:9-11) carries 10 of the surah's 18 qira'at variants — over half, concentrated in three ayahs. These are exclusively meaning-changing types (Pss, ibdal, Lx), unlike the harmless dot variants of the oath or phonological variants of the diagnosis.", "tr": "Eskatoljik bölüm (100:9-11), surenin 18 kıraat varyantından 10'unu taşır — yarısından fazlası üç ayette yoğunlaşır. Bunlar yalnızca anlam değiştiren türlerdir (Pss, ibdal, Lx), yeminin zararsız nokta varyantları veya teşhisin fonolojik varyantlarından farklı olarak."}}, {"threadId": "concealment-disclosure", "stage": "harvested", "ref": "100:10", "text": {"en": "The master arc reaches its penultimate step: breasts sifted open, contents laid bare. From hidden fire (100:2) through moral concealment (100:6) to forced disclosure of the innermost self. Only divine knowledge (100:11) remains.", "tr": "Ana yay sondan bir önceki adımına ulaşır: göğüsler ayıklanarak açılır, içindekiler açığa serilir. Gizli ateşten (100:2) ahlaki gizlemeye (100:6) en içteki benliğin zorla ifşasına. Yalnızca ilahi bilgi (100:11) kalır."}}, {"threadId": "agricultural", "stage": "harvested", "ref": "100:10", "text": {"en": "The agricultural sub-narrative completes: ploughing (100:4) to barren soil (100:6) to harvest-sifting (100:10). Three roots independently carry agricultural meanings beneath the martial surface, forming a coherent narrative visible only through cross-ayah root analysis.", "tr": "Tarımsal alt anlatı tamamlanır: sürme (100:4), kısır toprak (100:6), hasat-ayıklama (100:10). Savaşçıl yüzeyin altında üç kök bağımsız olarak tarımsal anlamlar taşır, yalnızca ayetler arası kök analizi yoluyla görülebilen tutarlı bir anlatı oluşturur."}}, {"threadId": "agency", "stage": "developed", "ref": "100:10", "text": {"en": "Three variant forms of hussila distribute agency across the full spectrum: autonomous emergence (hasala), divine extraction (hassala), ontological shift (hasila). The standard passive is flanked by alternatives that make the theological question explicit.", "tr": "Hussila'nın üç varyant biçimi failliği tam spektrum boyunca dağıtır: otonom ortaya çıkış (hasala), ilahi çıkarma (hassala), ontolojik kayma (hasila). Standart pasif, teolojik soruyu açık hâle getiren alternatiflerle çevrilir."}}], "technicals": [{"ref": "100:9", "title": {"en": "Variant and Co-occurrence Data", "tr": "Varyant ve Birlikte Geçiş Verisi"}, "text": {"en": "Root b-'-th-r: 2 total Quranic occurrences (100:9 and 82:4 only). The b-'-th-r + q-b-r pair is an exclusive eschatological formula — 100% co-occurrence rate. Three b-h-th variants: (1) buhtira (ibdal), (2) buhitha (Lx), (3) ba'thara (active ibdal). Root b-h-th standard text only at 5:31 (crow digging earth for burial). Lane's: bahatha = \"he searched, investigated, dug.\" Voice variants at 100:9: ya'lamu (active) has variant yu'lamu (passive, \"is he not made to know?\"); bu'thira (passive) has variant ba'thara (active). The variants consistently redistribute agency.", "tr": "B-'-th-r kökü: Kur'an'da toplam 2 geçiş (yalnızca 100:9 ve 82:4). B-'-th-r + q-b-r çifti özel bir eskatoljik formüldür — %100 birlikte geçiş oranı. Üç b-h-th varyantı: (1) buhtira (ibdal), (2) buhitha (Lx), (3) ba'thara (etken ibdal). B-h-th kökü standart metinde yalnızca 5:31'de (gömü için toprağı kazan karga). Lane's: bahatha = \"aradı, soruşturdu, kazdı\". 100:9'daki ses varyantları: ya'lamu (etken) yu'lamu (pasif, \"bilindirilmiyor mu?\") varyantına sahiptir; bu'thira (pasif) ba'thara (etken) varyantına sahiptir. Varyantlar tutarlı bir şekilde failliği yeniden dağıtır."}}, {"ref": "100:10", "title": {"en": "Hapax, Variant, and Agricultural Data", "tr": "Hapax, Varyant ve Tarımsal Veri"}, "text": {"en": "Root h-s-l: Quranic hapax. Lane's: \"to separate a thing from another, to distinguish the good from the bad; to gather dates from a tree.\" Lisan al-Arab: tahsil = \"extracting the kernel from the husk.\" The qubur/sudur phonetic pair: both fu'ul broken plural pattern. Three hussila variants: hasala (Form I active, Pss type), hassala (Form II active, Pss type), hasila (stative, Pss type). All Pss variants confined to 100:9-11. 10 of 18 total variants in this three-ayah section.", "tr": "H-s-l kökü: Kur'an'da hapax. Lane's: \"bir şeyi diğerinden ayırmak, iyiyi kötüden ayırt etmek; ağaçtan hurma toplamak\". Lisânü'l-Arab: tahsil = \"kabuğundan çekirdeği çıkarma\". Qubur/sudur fonetik çifti: her ikisi de fu'ul kırık çoğul deseni. Üç hussila varyantı: hasala (Form I etken, Pss türü), hassala (Form II etken, Pss türü), hasila (durum bildiren, Pss türü). Tüm Pss varyantları 100:9-11 ile sınırlı. Bu üç ayetlik bölümde toplam 18 varyantın 10'u."}}]}, {"title": {"en": "Section D: Divine Closure", "tr": "Section D: İlahi Kapanış"}, "ayahStart": "11", "ayahEnd": "11", "ayahs": [{"ref": "100:11", "arabic": "إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍۢ لَّخَبِيرٌۢ", "translation": {"en": "Truly, their Lord, concerning them, on that Day, is fully aware.", "tr": "Gerçekten, onların Rabbi, onlar hakkında, o Gün, tamamen haberdar olandır."}}], "classical": [{"ref": "100:11", "text": {"en": "The surah closes with the inna...la- construction returning for the fourth time, now with God as subject. Khabir means \"intimately knowing, fully aware.\" Classical reading sees an epistemological arc: man is shahid (witness, 100:7) to his own state, but God is khabir (penetratingly knowing) of all. The singular \"his Lord\" (100:6) has widened to \"their Lord\" (100:11) — individual diagnosis becomes collective judgment.", "tr": "Sure, dördüncü kez dönen inna...la- yapısıyla kapanır, şimdi Allah öznedir. Khabir \"yakından bilen, tamamen haberdar\" anlamına gelir. Klasik okuma epistemolojik bir yay görür: insan kendi durumunun şahididir (shahid, 100:7), ancak Allah her şeyi nüfuz ederek bilen (khabir) olandır. Tekil \"onun Rabbi\" (100:6) çoğul \"onların Rabbi\"ne (100:11) genişlemiştir — bireysel teşhis kolektif yargı olur."}}], "findings": [{"type": "CONFIRMED", "ref": "100:11", "threadId": "concealment-disclosure", "title": {"en": "Nothing Remains Hidden", "tr": "Hiçbir Şey Gizli Kalmaz"}, "text": {"en": "Classical tafsir reads khabir as total divine knowledge. The data confirms this as the arc's terminus: the surah begins with concealment (dawn raids, dust clouds, hidden ingratitude) and ends with the One from whom nothing was ever hidden. The epistemological complement is precise: shahid (100:7, human self-knowledge) is answered by khabir (100:11, divine knowledge that penetrates beneath all surfaces).", "tr": "Klasik tefsir khabir'i tam ilahi bilgi olarak okur. Veri bunu yayın son noktası olarak teyit eder: sure gizlenme ile başlar (şafak baskınları, toz bulutları, gizli nankörlük) ve hiçbir şeyin asla gizli kalmadığı Olan ile biter. Epistemolojik tamamlayıcı hassastır: shahid (100:7, insanın öz-bilgisi) khabir (100:11, tüm yüzeylerin altına nüfuz eden ilahi bilgi) tarafından yanıtlanır."}}, {"type": "CONFIRMED", "ref": "100:11", "threadId": "agency", "title": {"en": "The r-b-b Inclusio", "tr": "R-b-b İnklüzyosu"}, "text": {"en": "Classical commentators note the return of rabb. The data confirms a structural inclusio framing 100:6-11: li-rabbihi (100:6, singular, \"his Lord\") to rabbahum (100:11, plural, \"their Lord\"). The shift from singular to plural tracks the surah's movement from individual diagnosis to collective accountability. The emphasis arc — four inna...la- constructions — culminates here with the shift from human subject (100:6-8) to divine subject (100:11).", "tr": "Klasik müfessirler rabb'ın dönüşünü kaydederler. Veri, 100:6-11'i çerçeveleyen yapısal bir inklüzyoyu teyit eder: li-rabbihi (100:6, tekil, \"onun Rabbi\") rabbahum'a (100:11, çoğul, \"onların Rabbi\"). Tekilden çoğula kayma, surenin bireysel teşhisten kolektif hesap verebilirliğe hareketini izler. Vurgu yayı — dört inna...la- yapısı — burada insan özneden (100:6-8) ilahi özneye (100:11) kaymayla doruğa ulaşır."}}, {"type": "DISCOVERY", "ref": "100:11", "threadId": "concealment-disclosure", "title": {"en": "The Ploughman Who Knows: khabir's Physical Metaphor", "tr": "Bilen Çiftçi: khabir'in Fiziksel Metaforu"}, "text": {"en": "The root kh-b-r carries a physical sense Lane's documents: khabara l-ard, \"he ploughed the earth, he penetrated the surface to reach what lies beneath.\" God's knowledge is not abstract omniscience but the knowledge of one who digs beneath surfaces — the ploughman's knowledge. This connects to '-th-r (100:4, \"ploughing/stirring\"): the horses plough the earth physically, God \"ploughs\" human reality metaphysically. The surah's bookend roots — w-r-y (100:2, \"conceal/kindle\") and kh-b-r (100:11, \"penetrate beneath surfaces\") — both encode piercing through what conceals.", "tr": "Kh-b-r kökü, Lane's Lexicon'ın kaydettiği fiziksel bir anlam taşır: khabara l-ard, \"toprağı sürdü, altında yatanı bulmak için yüzeye nüfuz etti\". Allah'ın bilgisi soyut her şeyi bilme değil, yüzeylerin altını kazan birisinin bilgisidir — çiftçinin bilgisi. Bu, '-th-r'a (100:4, \"sürme/karıştırma\") bağlanır: atlar toprağı fiziksel olarak sürerler, Allah insan gerçekliğini metafiziksel olarak \"sürer\". Surenin kitap sonu kökleri — w-r-y (100:2, \"gizlemek/tutuşturmak\") ve kh-b-r (100:11, \"yüzeylerin altına nüfuz etmek\") — her ikisi de gizleyeni delmeyi kodlar."}}, {"type": "DISCOVERY", "ref": "100:11", "threadId": "agricultural", "title": {"en": "The Divine Ploughman", "tr": "İlahi Çiftçi"}, "text": {"en": "The agricultural thread finds its unexpected conclusion in a divine attribute. Kh-b-r carries \"to plough the earth\" (Lane's: khabara l-ard). The four-station arc: ploughing (100:4), barren soil (100:6), harvest-sifting (100:10), the divine Ploughman (100:11). God's intimate knowledge (khibra) is etymologically rooted in the act of turning soil — the Nurturer (rabb) who knows because nurturing IS knowing, as one who tends the soil knows its depths.", "tr": "Tarımsal dizgi beklenmedik sonucunu ilahi bir sıfatta bulur. Kh-b-r \"toprağı sürmek\" anlamını taşır (Lane's: khabara l-ard). Dört istasyonlu yay: sürme (100:4), kısır toprak (100:6), hasat-ayıklama (100:10), ilahi Çiftçi (100:11). Allah'ın yakın bilgisi (khibra) etimolojik olarak toprağı çevirme eyleminde köklenmiştir — toprağa bakan birisinin derinliklerini bildiği gibi bilme VE besleme olan Besleyici (rabb)."}}, {"type": "DISCOVERY", "ref": "100:11", "threadId": "agency", "title": {"en": "Contrapuntal Resolution: The Quietest Word Carries the Most", "tr": "Kontrpuantal Çözümleme: En Sessiz Kelime En Fazlasını Taşır"}, "text": {"en": "The surah's loudest images (thundering cavalry, fire, dust) carried the lightest theological weight. Its quietest ayah — a single declarative sentence, no kinetic energy — carries the heaviest. Rhetorical emphasis increases across the surah (inna...la- pattern builds) while kinetic energy decreases to zero. This contrapuntal structure resolves in a God who does not charge or strike but simply knows. The being who knows (khabir) outweighs all the beings who act.", "tr": "Surenin en gürültülü imgeleri (gümbürdayan süvari, ateş, toz) en hafif teolojik ağırlığı taşıdı. En sessiz ayeti — tek bir bildirim cümlesi, kinetik enerji yok — en ağır olanı taşır. Retorik vurgu sure boyunca artar (inna...la- deseni inşa olur) kinetik enerji sıfıra düşerken. Bu kontrpuantal yapı, hücum etmeyen veya çarpmayan ancak sadece bilen bir Allah'ta çözülür. Bilen varlık (khabir) tüm hareket eden varlıkları ağırlıkta geçer."}}, {"type": "TENSION", "ref": "100:11", "threadId": "variant-zones", "title": {"en": "Eternal Knowledge or Eschatological Framing?", "tr": "Ezeli Bilgi mi Eskatoljik Çerçeveleme mi?"}, "text": {"en": "A qira'at variant reads anna (subordinating conjunction) instead of inna (independent emphatic). Under inna, 100:11 is an absolute theological assertion — God's awareness stands independent of time. Under anna, 100:11 becomes subordinate to ya'lamu in 100:9: \"Does he not know THAT their Lord is aware?\" — the knowledge is eschatologically framed, presented as what the human should already recognize. A second variant removes the emphatic la- before khabir, breaking the inna...la- pattern that has governed 100:6-8, 11. Both variants are grammatically sound; the tension between ontological statement and eschatological warning remains open.", "tr": "Bir kıraat varyantı inna (bağımsız vurgulu) yerine anna (bağlı bağlaç) okur. İnna altında, 100:11 mutlak bir teolojik iddiadır — Allah'ın farkındalığı zamandan bağımsız durur. Anna altında, 100:11, 100:9'daki ya'lamu'ya bağlı olur: \"Rablerinin haberdar olduğunu bilmiyor mu?\" — bilgi eskatoljik olarak çerçevelenir, insanın zaten tanıması gereken şey olarak sunulur. İkinci bir varyant khabir öncesindeki vurgulu la-'yı kaldırır, 100:6-8, 11'i yöneten inna...la- desenini kırar. Her iki varyant da dilbilgisel olarak geçerlidir; ontolojik ifade ile eskatoljik uyarı arasındaki gerilim açık kalır."}}], "threads": [{"threadId": "concealment-disclosure", "stage": "harvested", "ref": "100:11", "text": {"en": "The master arc completes. From fire hidden in stone (100:2) through moral concealment (100:6) and self-witness (100:7) through exhumation and extraction (100:9-10), everything arrives at khabir: the One whose knowing is etymologically a ploughing, a penetration beneath every surface. The w-r-y (conceal/kindle) to kh-b-r (penetrate/plough) bookend closes the seven-ayah arc.", "tr": "Ana yay tamamlanır. Taşta gizli ateşten (100:2) ahlaki gizleme (100:6) ve öz-tanıklık (100:7) aracılığıyla mezardan çıkarma ve göğüslerden ayıklama (100:9-10) yoluyla her şey khabir'e varır: bilmesi etimolojik olarak bir sürme, her yüzeyin altına bir nüfuz olan Olan. W-r-y (gizlemek/tutuşturmak) - kh-b-r (nüfuz etmek/sürmek) kitap sonu yedi ayetlik yayı kapatır."}}, {"threadId": "agricultural", "stage": "harvested", "ref": "100:11", "text": {"en": "The agricultural arc reaches its final resonance in a divine name: ploughing (100:4) to barren soil (100:6) to harvest (100:10) to the divine Ploughman (100:11). Four roots across four sections, invisible beneath the martial surface, forming a sub-narrative visible only through lexicographic analysis.", "tr": "Tarımsal yay nihai yankısını ilahi bir isimde bulur: sürme (100:4), kısır toprak (100:6), hasat (100:10), ilahi Çiftçi (100:11). Dört bölümde dört kök, savaşçıl yüzeyin altında görünmez, yalnızca leksikografik analiz yoluyla görülebilen bir alt anlatı oluşturur."}}, {"threadId": "fire-chain", "stage": "harvested", "ref": "100:11", "text": {"en": "The fire chain resolves: scorching breath (100:1), visible sparks (100:2), and burning desire (100:8) culminate in khabir — penetrating knowledge that is the final light, leaving nothing in darkness.", "tr": "Ateş zinciri çözülür: yakıcı nefes (100:1), görünür kıvılcımlar (100:2) ve yanan arzu (100:8), khabir'de doruğa ulaşır — hiçbir şeyi karanlıkta bırakmayan nüfuz eden bilgi olan nihai ışık."}}, {"threadId": "agency", "stage": "harvested", "ref": "100:11", "text": {"en": "The agency arc completes: active horses (100:1-5), passive human (100:9-10), divine knower (100:11). God is the sole named agent at the surah's close — not charging, not striking, but knowing. Creaturely agency gives way to divine agency of a wholly different kind.", "tr": "Faillik yayı tamamlanır: etken atlar (100:1-5), pasif insan (100:9-10), ilahi bilen (100:11). Allah, surenin kapanışında tek adı verilen faildir — hücum etmeyen, çarpmayan, ancak bilen. Yaratık failliği tamamen farklı bir türden ilahi failliğe yol verir."}}, {"threadId": "variant-zones", "stage": "harvested", "ref": "100:11", "text": {"en": "The variant-zone segregation holds to the end: 100:11's two variants (inna/anna particle, lam removal) belong to types (in/an, hf) found only in the eschatological zone. Across all 18 variants and three structural zones, the correlation between variant type and surah architecture is perfect.", "tr": "Varyant-bölge ayrışımı sona kadar tutar: 100:11'in iki varyantı (inna/anna edatı, lam kaldırılması) yalnızca eskatoljik bölgede bulunan türlere (in/an, hf) aittir. Tüm 18 varyant ve üç yapısal bölge boyunca, varyant türü ile sure mimarisi arasındaki korelasyon mükemmeldir."}}, {"threadId": "lexical-partition", "stage": "harvested", "ref": "100:11", "text": {"en": "The lexical partition holds absolutely: 10 roots in the oath (100:1-5), 15 in the declaration (100:6-11), zero overlap. R-b-b, the only root appearing twice, frames the declaration section as an inclusio (100:6, 100:11). The surah's two halves are composed from entirely separate vocabularies.", "tr": "Sözcüksel bölünme mutlak olarak tutar: yeminde 10 kök (100:1-5), beyanda 15 kök (100:6-11), sıfır örtüşme. İki kez geçen tek kök r-b-b, beyan bölümünü inklüzyo olarak çerçeveler (100:6, 100:11). Surenin iki yarısı tamamen ayrı sözcüklerden oluşturulmuştur."}}], "technicals": [{"ref": "100:11", "title": {"en": "Root, Co-occurrence, and Variant Data", "tr": "Kök, Birlikte Geçiş ve Varyant Verisi"}, "text": {"en": "Root kh-b-r: 52 Quranic occurrences. Lane's: \"he knew it, was acquainted with it\" AND \"khabara l-ard = he ploughed the earth.\" Lisan al-Arab confirms both. The r-b-b + kh-b-r co-occurrence: 5 shared ayahs (100:11, 17:17, 17:30, 11:111, 33:2) — God as khabir invoked specifically in contexts of hidden deeds and divine recompense. The r-b-b + kh-b-r + y-w-m triple co-occurrence compresses into a single ayah a formula normally distributed across dozens of contexts. Inna/anna variant: inna = independent emphatic; anna = subordinating, making 100:11 depend on ya'lamu in 100:9.", "tr": "Kh-b-r kökü: Kur'an'da 52 geçiş. Lane's: \"onu bildi, ondan haberdar oldu\" VE \"khabara l-ard = toprağı sürdü\". Lisânü'l-Arab her ikisini de teyit eder. R-b-b + kh-b-r birlikte geçişi: 5 paylaşılan ayet (100:11, 17:17, 17:30, 11:111, 33:2) — Allah'ın khabir olarak anılması özellikle gizli işler ve ilahi karşılık bağlamlarında. R-b-b + kh-b-r + y-w-m üçlü birlikte geçişi, normalde düzinelerce bağlamda dağılmış bir formülü tek bir ayete sıkıştırır. İnna/anna varyantı: inna = bağımsız vurgulu; anna = bağlı, 100:11'i 100:9'daki ya'lamu'ya bağımlı yapar."}}]}, {"title": {"en": "Cross-Section Patterns", "tr": "Bölümler Arası Desenler"}, "ayahStart": "1", "ayahEnd": "11", "ayahs": [], "classical": [], "findings": [{"type": "DISCOVERY", "ref": "100:1", "threadId": "cross_ring_wry_khbr", "title": {"en": "[Ring] w-r-y / kh-b-r Concealment Envelope", "tr": "[Halka] w-r-y / kh-b-r Gizlenme Zarfı"}, "text": {"en": "The root w-r-y (100:2, \"to conceal / to kindle fire from hidden sources\") and the root kh-b-r (100:11, \"to penetrate beneath surfaces, to plough the earth\") form a semantic envelope around the surah. Both roots encode the act of reaching through what conceals: w-r-y strikes hidden fire from stone, kh-b-r ploughs earth to reach what lies below (Lane's Lexicon: khabara l-ard). The surah opens with penetrating concealment physically (100:2) and closes with penetrating it epistemologically (100:11). This ring is invisible without lexicographic data: standard translations render these as simply \"striking sparks\" and \"aware.\"", "tr": "W-r-y kökü (100:2, \"gizlemek / gizli kaynaklardan ateş tutuşturmak\") ve kh-b-r kökü (100:11, \"yüzeylerin altına nüfuz etmek, toprağı sürmek\") surenin etrafında semantik bir zarf oluşturur. Her iki kök de gizleyene erişme eylemini kodlar: w-r-y taştan gizli ateş çıkarır, kh-b-r altında yatana ulaşmak için toprağı sürer (Lane's Lexicon: khabara l-ard). Sure fiziksel olarak gizlenmeyi delme (100:2) ile açılır ve epistemolojik olarak delme (100:11) ile kapanır. Bu halka leksikografik veri olmadan görünmezdir: standart çeviriler bunları basitçe \"kıvılcım çakma\" ve \"haberdar\" olarak işler."}}, {"type": "DISCOVERY", "ref": "100:1", "threadId": "cross_bookend_1_11", "title": {"en": "[Bookend] Ayah 1 and Ayah 11: Runners vs. Knower", "tr": "[Kitap Sonu] Ayet 1 ve Ayet 11: Koşanlar - Bilen"}, "text": {"en": "Testing the outermost symmetric pair 100:1 and 100:11: the surah opens with al-'adiyat (100:1, \"the runners,\" root '-d-w, defined by kinetic action) and closes with khabir (100:11, \"the deeply knowing,\" root kh-b-r, defined by epistemological penetration). The first word characterises by what bodies do; the last by what God knows. The surah's trajectory moves from kinetic energy to epistemological certainty, from maximal physical exertion to maximal cognitive awareness. The horses run; God knows. Neither root appears elsewhere in the surah, making this a pure bookend.", "tr": "En dıştaki simetrik çift 100:1 ve 100:11'i test etme: sure al-'adiyat (100:1, \"koşanlar\", '-d-w kökü, kinetik eylemle tanımlanan) ile açılır ve khabir (100:11, \"derinlemesine bilen\", kh-b-r kökü, epistemolojik nüfuzla tanımlanan) ile kapanır. İlk kelime bedenlerin ne yaptığıyla karakterize eder; son kelime Allah'ın ne bildiğiyle. Surenin yörüngesi kinetik enerjiden epistemolojik kesinliğe, maksimal fiziksel çabadan maksimal bilişsel farkındalığa geçer. Atlar koşar; Allah bilir. Hiçbir kök surede başka yerde görünmez, bu yüzden saf bir kitap sonudur."}}, {"type": "CONFIRMED", "ref": "100:2", "threadId": "cross_bookend_2_10", "title": {"en": "[Bookend] Ayah 2 and Ayah 10: Extraction from Stone, Extraction from Breasts", "tr": "[Kitap Sonu] Ayet 2 ve Ayet 10: Taştan Çıkarma, Göğüslerden Çıkarma"}, "text": {"en": "Testing 100:2 and 100:10: qadhan (100:2, striking sparks -- extracting fire from flint, root q-d-h) mirrors hussila (100:10, extracting what is in breasts, root h-s-l). Both are acts of extraction
