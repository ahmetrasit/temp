 ayni yogunlastirmayi izler: ara sira unutan degil, dogasi geregi koparan ve inkar eden", "Anlamsal gerilim: kenud ayni anda \"kesen\" (etkin koparma) VE \"corak toprak\" (pasif verimsizlik) anlami tasir. Insan hem iliskilerin KOPARICISI hem de verim vermeyi reddeden TOPRAK'tir — hem fail hem basarisiz aracı", "Modern/geleceksel: kenud \"geri vermeden cikaran\" olarak — kaynaklari yenilemeden tuketen tuketici. Ayrica: \"baglanti koparan\" — besleyen sistemlerdeki (ekolojik, sosyal, bilgisel) geri besleme dongulerini koparan", "Kok kavram: k-n-d uretken bir bagin koparilmasini gosterir — kaynagindan tuketirken o kaynakla baglantıyı kesmenin nankorlugu, yagmur icip hicbir sey yetistirmeyen toprak gibi"], "occurrences": {"type": "all", "items": [{"ref": "100:6", "arabic": "— this verse —", "english": "The sole Quranic occurrence of k-n-d. This is a hapax legomenon — kanūd appears nowhere else in the Quran. Its singularity gives it extraordinary weight: the Quran deploys this rare root precisely once, in this emphatic declaration about the human condition. The absence of other Quranic contexts means the word must be understood entirely through classical Arabic lexicography and this single usage context.", "turkish": "k-n-d kokuunun tek Kur'an kullanimi. Bu bir hapax legomenon'dur — kenud Kur'an'in baska hicbir yerinde gecmez. Tekilliği ona olaganustu bir agirlik verir: Kur'an bu nadir koku tam olarak bir kez, insan durumu hakkindaki bu vurgulu beyanda kullanir. Baska Kur'anî baglamlarin yokluğu kelimenin tamamen klasik Arapca sozlukbilimi ve bu tek kullanim baglami uzerinden anlasilmasi gerektigini gosterir."}]}, "qiraat": [], "cooccurrence": [{"coRoot": "'-n-s", "coRootAr": "أ ن س", "count": "1", "refs": "100:6", "note": "The hapax root k-n-d co-occurs with '-n-s only here — the sole diagnostic statement uses the rarest possible word to characterize the most common being ← IN THIS AYAH", "noteTr": "Hapax kok k-n-d, '-n-s ile yalnizca burada birlikte gorulur — en nadir kelime en yaygin varligi nitelemek icin kullanilir ← BU AYETTE"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "1", "refs": "100:6", "note": "k-n-d pairs with r-b-b only in this ayah — the act of cutting off is directed at the nurturer, making kanūd the anti-tarbiya: denying the very process of cultivation ← IN THIS AYAH", "noteTr": "k-n-d yalnizca bu ayette r-b-b ile eslesmistir — koparma eylemi yetistiriciye yoneliktir, kenud'u anti-terbiye yapar: yetistirme surecinin kendisini inkar etmek ← BU AYETTE"}], "critical": "kanūd is a HAPAX LEGOMENON — it appears exactly once in the entire Quran, making it one of the most linguistically significant words in this surah. The fa'ūl pattern (intensive adjective) combined with hapax status creates maximum semantic density: the Quran chooses a word it never repeats, in its most intensive form, to diagnose the human condition. The triple-layered emphasis (inna + lām + fa'ūl) is structurally unprecedented in such a compact form. Classical lexicographers offer multiple characterizations: (1) one who counts afflictions and forgets blessings (Lisan al-Arab), (2) barren land that yields nothing despite rain, (3) one who eats alone and withholds from others, (4) one who actively severs ties with a benefactor. All four characterizations apply simultaneously — kanūd is not one type of ingratitude but a SYNDROME of relational failure. The agricultural metaphor (barren soil) connects to the surah's animal imagery (horses charging) — both are about creatures that receive (rain, training) and either produce or fail to produce. The phonetic texture of k-n-d (velar stop + nasal + dental stop) creates a sound of abrupt cutting — the word physically enacts its meaning.", "criticalTr": "kenud bir HAPAX LEGOMENON'dur — butun Kur'an'da tam olarak bir kez gecmistir, bu suredeki en dilbilimsel olarak onemli kelimelerden birini yapar. Fu'ul kalibi (mubalaga sifati) hapax statusuyle birlesince maksimum anlamsal yogunluk yaratir: Kur'an hic tekrarlamadigi bir kelimeyi, en yogun formunda, insan durumunu teshis etmek icin secer. Uclu vurgu (inne + lam + fu'ul) bu denli kompakt bir formda yapisal olarak emsalsizdir. Klasik sozlukcular birden fazla niteleme sunar: (1) belaları sayıp nimetleri unutan (Lisanu'l-Arab), (2) yagmura ragmen hicbir sey vermeyen corak toprak, (3) tek basina yiyen ve baskasindan esirgenen, (4) nimet verenle baglarini etkin olarak koparan. Dort nitelemenin hepsi ayni anda gecerlidir — kenud tek bir nankorluk turu degil, iliskisel basarisizlik SENDROMU'dur. Tarimsal metafor (corak toprak) surenin hayvan tasvirine (dortnal koşan atlar) baglanir — ikisi de alan (yagmur, egitim) ve ya ureten ya da uretemeyen yaratiklar hakkindadir. k-n-d'nin fonetik dokusu (art damak kapantili + geniz + dis kapantili) ani bir kesme sesi yaratir — kelime fiziksel olarak anlamini icra eder.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran use a hapax legomenon (kanūd) to characterize the human condition rather than the more common kafūr (persistently ungrateful, from k-f-r), which appears multiple times?", "Does the agricultural meaning of kanūd (barren soil) create an intentional parallel with the surah's equine imagery — are the charging horses a counter-image to the passive barrenness of the human?", "The fronting of li-rabbihi before la-kanūdun — does this suggest that the ingratitude is specifically relational (toward the nurturer) rather than ontological (a general trait), and what are the implications of each reading?", "Given that k-n-d carries both active (cutting) and passive (barren) meanings, is the human diagnosed as an active saboteur of the nurturing relationship or as constitutionally incapable of reciprocating?", "The triple emphasis (inna + lām + fa'ūl) is extraordinarily forceful for a five-word ayah — does this rhetorical intensity suggest the content is counter-intuitive or resistant to acceptance?", "How does the insān-rabb axis in this ayah relate to the 58 other ayahs where '-n-s and r-b-b co-occur? Is the kanūd diagnosis consistent across these contexts or does it introduce a unique perspective?", "The root '-n-s carries \"sociability/intimacy\" (uns) — how does the irony of the \"intimate being\" (insān) cutting off (kanūd) from its intimate nurturer (rabb) function as a rhetorical device?", "Could kanūd, as \"one who eats alone and withholds,\" function as an economic diagnosis — the human as hoarding consumer rather than circulating participant in a gift economy?", "The two qira'at variants on li-rabbihi (one truncating, one extending the pronoun vowel) create a phonetic spectrum — does this auditory variation mirror the spectrum of human attitudes toward the rabb (from abrupt rejection to lingering attachment)?", "In a futuristic reading, could kanūd describe the extractive relationship between sentient systems and their sustaining infrastructure — consuming computational resources without regenerating or acknowledging the source?", "Does the placement of this ayah immediately after the oath sequence (100:1-5, swearing by the charging horses) suggest that the horses' loyalty to their riders is being contrasted with the human's disloyalty to their rabb?", "If insān al-'ayn (pupil of the eye) is a valid semantic echo, does the human-as-perceiver failing to perceive its own nurturer constitute a special kind of blindness — seeing everything except its own source?"], "questionsTr": ["Kur'an insan durumunu nitelemek icin neden daha yaygin kefur (surekli nankor, k-f-r kokuunden) yerine hapax legomenon olan kenud'u kullanir?", "Kenud'un tarimsal anlami (corak toprak) surenin at tasviriyle kasitli bir paralel olusturur mu — dortnal koşan atlar, insanin pasif corakligina karsi-imge midir?", "li-rabbihi'nin le-kenud'un onune takdim edilmesi, nankorlugun ontolojik (genel bir ozellik) degil ozellikle iliskisel (yetistiriciye yonelik) oldugunu mu gosterir ve her okumanin sonuclari nelerdir?", "k-n-d hem etkin (kesme) hem pasif (coraklik) anlam tasidigindan, insan yetistirme iliskisinin etkin bir sabotajcisi mi yoksa yapisal olarak karsilik veremez mi teshis edilmektedir?", "Uclu vurgu (inne + lam + fu'ul) bes kelimelik bir ayet icin olaganustu gucludur — bu belagi yogunluk icerigin sezgiye aykiri veya kabule direncli oldugunu mu gosterir?", "Bu ayetteki insan-rabb ekseni '-n-s ve r-b-b'nin birlikte gorundugu diger 58 ayetle nasil iliskilenir? Kenud teshisi bu baglamlarda tutarli mi yoksa benzersiz bir bakis acisi mi sunar?", "'-n-s koku \"sosyallik/yakinlik\" (uns) tasir — \"yakin varlik\" (insan) olan varlığın yakin yetistiricisinden (rabb) koparmasi (kenud) ironisi belagi bir arac olarak nasil isler?", "Kenud, \"tek basina yiyen ve esirgenen\" olarak, ekonomik bir teshis islevi gorebilir mi — insan bir hediye ekonomisindeki dolaşan katilimci yerine stokcu tuketici olarak?", "li-rabbihi uzerindeki iki kiraat varyanti (biri zamir unlusunu kisaltan, biri uzatan) fonetik bir yelpaze olusturur — bu isitsel cesitlilik, insanin rabbe karsi tutumlarinin yelpazesini (ani reddetten kalici bagliliga) yansitir mi?", "Geleceksel bir okumada kenud, duyarli sistemlerle besleyen altyapilari arasindaki cikartici iliskiyi tanimlar mi — kaynagi tanımadan veya yenilemeden hesaplama kaynaklarini tuketmek?", "Bu ayetin yemin dizisinden hemen sonra yerlestirilmesi (100:1-5, dortnal koşan atlara yemin), atlarin binicilerine baglilığının insanin Rabbine bagliligsizigiyla karsilastirildigini gosterir mi?", "Insanu'l-ayn (goz bebegi) gecerli bir anlamsal yanki ise, algilayici-insan'in kendi yetistiricisini algilayamamasi ozel bir korluk turu olusturur mu — kaynagi haric her seyi goren?"], "key": "100:6"}, "100:7": {"surah": 100, "ayah": 7, "arabic": "وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٌۭ", "transliteration": "wa-innahū 'alā dhālika la-shahīdun", "readings": [{"text": "And indeed he is, to that, surely a witness", "textTr": "Ve gerçekten o, buna tanıktır", "rationale": "The pronoun -hu in innahu refers to al-insān (the human) from 100:6. 'alā dhālika points back to the ingratitude (kanūd) described in 100:6. shahīd is parsed as fa'īl (intensive adjective) from sh-h-d meaning \"one who witnesses, testifies.\" The human himself is a witness — he knows his own ingratitude but persists in it. The lām in la-shahīd is lām al-tawkīd (emphatic lām), reinforcing the assertion.", "rationaleTr": "innahu'daki -hu zamiri 100:6'daki el-insān'a (insan) döner. 'alā dhālika 100:6'da anlatılan nankörlüğe (kanūd) işaret eder. shahīd, sh-h-d kökünden fa'īl (mübalağa sıfatı) olarak çözümlenir, \"tanık olan, şahadet eden\" anlamında. İnsan kendi nankörlüğünün tanığıdır — bilir ama devam eder. la-shahīd'deki lâm, lâmü't-te'kîd (pekiştirme lâmı) olup iddiayı güçlendirir."}, {"text": "And indeed He [God] is, over that, surely a witness", "textTr": "Ve gerçekten O [Tanrı], bunun üzerinde elbette tanıktır", "rationale": "The pronoun -hu can refer to Allāh (implied from the broader Quranic discourse). On this reading, God is the witness over humanity's ingratitude. shahīd then carries its forensic sense: God as observer, recorder, and eventual judge of human conduct. 'alā shifts from \"to\" to \"over/watching over.\"", "rationaleTr": "-hu zamiri Allah'a dönebilir (genel Kur'an söyleminden çıkarılır). Bu okumada, Tanrı insanın nankörlüğünün tanığıdır. shahīd adli anlamını taşır: Tanrı gözlemci, kaydedici ve insanın davranışının nihai yargıcıdır. 'alā \"hakkında\" yerine \"üzerinde/gözetleyici\" anlamına kayar."}, {"text": "And indeed he is, regarding that, surely one who testifies against himself", "textTr": "Ve gerçekten o, buna karşı kendi aleyhine tanıklık edendir", "rationale": "shahīd here is read with the reflexive dimension: the human does not merely know his ingratitude but actively bears witness against himself through his own actions. Every act of ingratitude is itself an act of self-testimony. 'alā dhālika can mean \"against that\" — witnessing against his own nature. The body, limbs, and deeds themselves testify (cf. 36:65 where limbs speak).", "rationaleTr": "shahīd burada dönüşlü boyutuyla okunur: insan nankörlüğünü salt bilmekle kalmaz, eylemlerinin ta kendisiyle kendi aleyhine tanıklık eder. Her nankörlük eylemi başlı başına bir öz-tanıklık eylemidir. 'alā dhālika \"buna karşı\" anlamına gelebilir — kendi doğasına karşı tanıklık. Beden, uzuvlar ve fiillerin kendisi tanıklık eder (kr. 36:65 uzuvların konuştuğu ayet)."}, {"text": "And indeed it [the evidence/the Quran/the record] is, to that, surely a testimony", "textTr": "Ve gerçekten o [delil/Kur'an/kayıt], buna mutlaka bir tanıklıktır", "rationale": "The pronoun -hu can refer to an abstract antecedent: the Quran itself, the divine record, or the evidence of creation. shahīd on this reading functions as a passive-meaning fa'īl (= mashhūd, \"witnessed/testified to\") — the evidence IS the testimony. Modern extension: any data trail, digital footprint, or automated logging system that records human behavior without human awareness.", "rationaleTr": "-hu zamiri soyut bir öncüle dönebilir: Kur'an'ın kendisi, ilahi kayıt veya yaratılış delili. Bu okumada shahīd edilgen anlamlı fa'īl (= meşhūd, \"tanıklık edilen\") olarak işlev görür — delil tanıklığın ta kendisidir. Modern genişleme: insan davranışını insanın farkında olmadan kaydeden her veri izi, dijital ayak izi veya otomatik kayıt sistemi."}, {"text": "And indeed he is, upon that [ingratitude], relentlessly intense [in witnessing]", "textTr": "Ve gerçekten o, bu [nankörlük] üzerinde amansızca yoğundur [tanıklıkta]", "rationale": "shahīd read through its root connection to shidda (intensity) and mushāhada (direct observation). The fa'īl pattern denotes not just witnessing but persistent, unrelenting awareness. The human cannot escape self-knowledge. 'alā carries the sense of \"pressing upon\" — the awareness of one's own ingratitude weighs on the self. Futuristic: surveillance systems, AI monitoring, biometric data collection that makes every action a permanent testimony — the human is a witness because all actions are now recorded and analyzable.", "rationaleTr": "shahīd, şidde (yoğunluk) ve müşāhede (doğrudan gözlem) kök bağlantısıyla okunur. fa'īl kalıbı salt tanıklığı değil, sürekli ve amansız farkındalığı ifade eder. İnsan öz-bilgiden kaçamaz. 'alā \"üzerine basan\" anlamı taşır — kendi nankörlüğünün farkındalığı benliğe yük olur. Geleceksel: gözetim sistemleri, yapay zeka izlemesi, biyometrik veri toplama her eylemi kalıcı bir tanıklığa dönüştürür — insan tanıktır çünkü tüm eylemler artık kaydedilir ve çözümlenebilir."}], "structure": {"beats": [{"label": "Emphatic assertion", "labelTr": "Pekiştirmeli hüküm", "lines": [{"arabic": "وَإِنَّهُۥ", "translit": "wa-innahū", "english": "And indeed he/it", "turkish": "Ve gerçekten o"}]}, {"label": "Prepositional reference", "labelTr": "Edatlı gönderim", "lines": [{"arabic": "عَلَىٰ ذَٰلِكَ", "translit": "'alā dhālika", "english": "regarding/over that", "turkish": "buna dair / bunun üzerinde"}]}, {"label": "Emphatic predicate", "labelTr": "Pekiştirmeli yüklem", "lines": [{"arabic": "لَشَهِيدٌۭ", "translit": "la-shahīdun", "english": "surely a witness", "turkish": "elbette bir tanıktır"}]}], "summary": "The ayah is a nominal sentence (jumla ismiyya) introduced by the emphatic particle inna with its attached pronoun -hu as subject (ism inna). The predicate (khabar inna) is la-shahīdun, prefixed with the emphatic lām (lām al-ibtidā' / lām al-tawkīd), creating a double emphasis: inna + lām. The prepositional phrase 'alā dhālika is an intervening adverbial (ẓarf), separating subject from predicate and creating suspense — the listener hears \"indeed he... regarding that...\" before the resolution \"surely a witness.\" The demonstrative dhālika (that, distant) points backward to 100:6 (the human's ingratitude). The architecture is: [emphatic particle + pronoun-subject] + [prepositional phrase as adverbial] + [emphatic lām + predicate]. The double emphasis (inna... la-) is a Quranic rhetorical device signaling irrefutable assertion.", "summaryTr": "Ayet, pekiştirme edatı inne ile başlayan bir isim cümlesidir (cümle-i ismiyye); bağlı zamiri -hu ism-i inne (özne) konumundadır. Haber (haberü inne) la-shahīdun olup lâmü'l-ibtidā / lâmü't-te'kîd ile pekiştirilmiştir; böylece çifte vurgu oluşur: inne + lâm. 'alā dhālika edatlı tamlaması arada bir zarf (zarf) olarak yer alır, özne ile yüklemi ayırır ve gerilim yaratır — dinleyici \"gerçekten o... buna dair...\" ifadesini \"elbette bir tanıktır\" çözümünden önce işitir. İşaret zamiri dhālika (o, uzak) geriye, 100:6'daki insanın nankörlüğüne işaret eder. Mimari: [pekiştirme edatı + zamir-özne] + [edatlı tamlama zarf olarak] + [pekiştirme lâmı + yüklem]. Çifte pekiştirme (inne... le-) tartışılmaz bir iddiayı işaret eden Kur'anî belagat aracıdır."}, "words": [{"id": 1, "arabic": "وَ", "translit": "wa", "gloss": "and; now; [discourse connector]", "glossTr": "ve; şimdi; [söylem bağlayıcısı]", "userNotes": "", "root": "— (-)", "grammar": "Conjunction (ḥarf 'aṭf). Here functioning as 'aṭf (coordination) connecting this ayah to the preceding 100:6 (inna l-insāna li-rabbihi la-kanūd). The wa links two parallel emphatic assertions about the human: (1) he is ungrateful, (2) he is a witness to it.", "grammarTr": "Bağlaç (harf-i atıf). Burada 100:6'ya (inne'l-insāne li-rabbihi le-kenūd) bağlayan atıf (eşgüdüm) işlevi görür. ve iki paralel pekiştirmeli hükmü bağlar: (1) insan nankördür, (2) buna tanıktır.", "semantics": ["عَطْف ('aṭf) — Coordination: joins equals, \"and\" — links parallel assertions", "حال (ḥāl) — Circumstantial: \"while/as\" — marks accompanying state", "استئناف (isti'nāf) — Resumptive: discourse break, new topic", "Core concept: wa as the fundamental Quranic connector — its function varies by context; here it coordinates two parallel inna-clauses about the human condition"], "semanticsTr": ["عَطْف (atıf) — Eşgüdüm: eşitleri bağlar, \"ve\" — paralel iddiaları bağlar", "حال (hâl) — Durum: \"iken/olarak\" — eşzamanlı durumu belirtir", "استئناف (isti'nāf) — Yeniden başlama: söylem kırılması, yeni konu", "Kök kavram: ve en temel Kur'anî bağlayıcıdır — işlevi bağlama göre değişir; burada insanın durumu hakkında iki paralel inne cümlesini eşgüdümler"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The wa here coordinates two parallel inna... la- constructions: 100:6 (inna l-insāna li-rabbihi la-kanūd) and 100:7 (wa-innahū 'alā dhālika la-shahīd). This parallelism creates a diagnostic pair: the disease (ingratitude) and the awareness of the disease (self-witnessing). The wa functions as 'aṭf (coordination), not isti'nāf (resumptive), because the second clause amplifies and comments on the first — it does not introduce a new topic. However, a ḥāl (circumstantial) reading is also possible: \"while he is a witness to that\" — making the witnessing simultaneous with the ingratitude.", "criticalTr": "Buradaki ve iki paralel inne... le- yapısını eşgüdümler: 100:6 (inne'l-insāne li-rabbihi le-kenūd) ve 100:7 (ve innehu 'alā dhālike le-şehīd). Bu paralellik tanısal bir çift oluşturur: hastalık (nankörlük) ve hastalığın farkındalığı (öz-tanıklık). ve burada atıf (eşgüdüm) işlevi görür, isti'nāf (yeniden başlama) değil; çünkü ikinci cümle birincisini genişletir ve yorumlar — yeni bir konu başlatmaz. Ancak hâl (durum) okuması da mümkündür: \"o buna tanıkken\" — tanıklığı nankörlükle eşzamanlı kılar."}, {"id": 2, "arabic": "إِنَّهُۥ", "translit": "innahū", "gloss": "indeed he/it; verily he/it", "glossTr": "gerçekten o; muhakkak o", "userNotes": "", "root": "— (-)", "grammar": "Emphatic particle inna + attached pronoun -hu (3rd person masculine singular). inna is a ḥarf nasb (particle governing the accusative) that introduces emphatic nominal sentences. The pronoun -hu serves as ism inna (the subject of the emphatic construction). The referent of -hu is ambiguous: (1) al-insān from 100:6, (2) Allāh implied, (3) the Quran/record.", "grammarTr": "Pekiştirme edatı inne + bağlı zamir -hu (üçüncü şahıs eril tekil). inne bir harf-i nasb (mansub hali yöneten edat) olup pekiştirmeli isim cümleleri başlatır. -hu zamiri ism-i inne (pekiştirmeli yapının öznesi) konumundadır. -hu'nun gönderimi belirsizdir: (1) 100:6'daki el-insān, (2) zımnen Allah, (3) Kur'an/kayıt.", "semantics": ["inna: emphatic assertion particle — \"indeed, verily, truly\"; introduces irrefutable claims", "Lane's Lexicon: inna is a particle of emphasis and affirmation (ta'kīd); it governs the accusative for its subject and the nominative for its predicate", "The -hu pronoun: 3rd person masculine singular — \"he\" or \"it\"; referentially open in this context", "Modern extension: inna as a truth-assertion operator — in formal logic, it can be read as an affirmation marker declaring the truth value of the following proposition", "Core concept: inna converts a statement from descriptive to assertive — it marks what follows as non-negotiable reality"], "semanticsTr": ["inne: pekiştirme edatı — \"gerçekten, muhakkak, hakikaten\"; tartışılmaz iddiaları başlatır", "Lane's Lexicon: inne bir te'kîd (pekiştirme) ve tasdik (onaylama) edatıdır; öznesini mansub, haberini merfû yapar", "-hu zamiri: üçüncü şahıs eril tekil — \"o\"; bu bağlamda gönderimsel olarak açık", "Modern genişleme: inne bir doğruluk-iddiası işleci olarak — formel mantıkta, takip eden önermenin doğruluk değerini ilan eden bir onay işaretçisi olarak okunabilir", "Kök kavram: inne bir ifadeyi betimleyiciden kesinleyiciye dönüştürür — arkasından geleni pazarlık götürmez gerçeklik olarak işaretler"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The pronoun -hu in innahū is the crux of interpreting this entire ayah. Three referents are grammatically valid: (1) al-insān (the human) from the immediately preceding 100:6 — yielding \"the human himself is a witness to his own ingratitude.\" This is the most proximate referent and creates a devastating psychological portrait: the ungrateful one cannot claim ignorance. (2) Allāh — yielding \"God is a witness over that.\" The Quran frequently uses shahīd for God (cf. 4:79, 4:166, 10:29). This reading makes the ayah a warning. (3) An impersonal \"it\" — the record of deeds, the Quran, or reality itself as testimony. The ambiguity appears deliberate: ALL three witnessings are simultaneously true. The human witnesses his own ingratitude, God witnesses it, and the record preserves it.", "criticalTr": "innahū'daki -hu zamiri bu ayetin tamamını yorumlamanın kilit noktasıdır. Üç gönderim dilbilgisel olarak geçerlidir: (1) Hemen önceki 100:6'daki el-insān (insan) — \"insan kendi nankörlüğünün bizzat tanığıdır\" verir. Bu en yakın gönderimdir ve yıkıcı bir psikolojik portre çizer: nankör olan cahillik iddia edemez. (2) Allah — \"Allah buna tanıktır\" verir. Kur'an sıklıkla şehîd'i Allah için kullanır (kr. 4:79, 4:166, 10:29). Bu okuma ayeti bir uyarı yapar. (3) Kişisel olmayan \"o\" — amel defteri, Kur'an veya gerçekliğin kendisi tanıklık olarak. Belirsizlik kasıtlı görünür: HER ÜÇ tanıklık aynı anda doğrudur. İnsan kendi nankörlüğüne tanıklık eder, Allah tanıklık eder ve kayıt onu muhafaza eder.", "tag": "CRITICAL", "temporal": "M"}, {"id": 3, "arabic": "عَلَىٰ", "translit": "'alā", "gloss": "on/upon/over; regarding/concerning; against; watching over", "glossTr": "üzerinde/üstünde; hakkında/dair; karşı; gözetleyerek", "userNotes": "", "root": "ع ل و ('-l-w)", "grammar": "Preposition (ḥarf jarr) governing the genitive. In this context, 'alā can mean (1) \"regarding/concerning that\" — pointing to the content of the testimony, (2) \"over/watching over that\" — implying oversight and surveillance, (3) \"against that\" — testimony directed against the ingratitude. The preposition creates a spatial metaphor: the witness is positioned ABOVE or UPON the matter, surveying it.", "grammarTr": "Edat (harf-i cer), mecrur hali yönetir. Bu bağlamda 'alā (1) \"buna dair/hakkında\" — tanıklığın içeriğine işaret, (2) \"bunun üzerinde/gözetleyerek\" — denetim ve gözetim ima eder, (3) \"buna karşı\" — nankörlüğe yöneltilmiş tanıklık anlamına gelebilir. Edat mekansal bir metafor yaratır: tanık mesele'nin ÜZERİNDE veya ÜSTÜNDE konumlanmış, onu incelemektedir.", "semantics": ["Preposition 'alā: spatial — on, upon, over, above; marks superiority or surface contact", "Preposition 'alā: directional — against, upon (hostile sense); marks the target of action", "Preposition 'alā: metaphorical — regarding, concerning, about; marks the topic or content", "Preposition 'alā: obligation — incumbent upon, binding on; marks duty or responsibility", "Lane's Lexicon: 'alā as preposition governs genitive; basic sense is \"elevation/superiority over\"; extended to obligation, hostility, regarding, and surveillance", "Root '-l-w verbal/nominal senses (NOT the preposition): to be high, to ascend, to prevail; 'uluww = height, elevation; 'aliyy = exalted, sublime; ta'ālā = He is exalted (one of God's epithets)", "Hans Wehr: 'alā = on, upon, at, by; against; for the sake of; in spite of; according to", "Modern extension: 'alā as \"on top of\" in data structures — metadata that sits \"upon\" base data, monitoring/logging layer that watches \"over\" system activity", "Core concept: elevation and oversight — 'alā positions its object beneath or subject to the prepositional complement, creating hierarchy"], "semanticsTr": ["Edat 'alā: mekansal — üzerinde, üstünde, yukarısında; üstünlük veya yüzey temasını belirtir", "Edat 'alā: yönelimsel — karşı, aleyhine; eylemin hedefini belirtir", "Edat 'alā: mecazi — hakkında, dair, ilişkin; konuyu veya içeriği belirtir", "Edat 'alā: yükümlülük — üzerine düşen, bağlayıcı; görev veya sorumluluğu belirtir", "Lane's Lexicon: 'alā edat olarak mecrur hali yönetir; temel anlam \"üstünlük/yükseklik\"; yükümlülük, düşmanlık, ilgililik ve gözetim anlamlarına genişler", "Kök '-l-w fiil/isim anlamları (edat DEĞİL): yüksek olmak, yükselmek, galip gelmek; 'uluvv = yükseklik; 'aliyy = yüce; te'ālā = O yücedir (Tanrı'nın sıfatlarından)", "Hans Wehr: 'alā = üzerinde, üstünde, yanında; karşı; uğruna; rağmen; göre", "Modern genişleme: 'alā veri yapılarında \"üstünde\" olarak — temel verinin \"üzerinde\" duran üstveri, sistem etkinliğini \"gözetleyen\" izleme/kayıt katmanı", "Kök kavram: yücelik ve gözetim — 'alā nesnesini edatın tamamlayıcısının altına veya tabi kılar, hiyerarşi oluşturur"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The preposition 'alā here governs dhālika (that) in the genitive and establishes the relationship between the witness (shahīd) and the object of testimony (the ingratitude from 100:6). Three readings are structurally possible: (a) 'alā as \"regarding\" — the witness testifies ABOUT the ingratitude; (b) 'alā as \"over/upon\" — the witness hovers over or monitors the ingratitude; (c) 'alā as \"against\" — the testimony is directed AGAINST the self. Reading (c) is especially powerful: the human's self-knowledge is not neutral observation but evidence mounted against himself. The spatial metaphor of 'alā (elevation, being above) suggests inescapable awareness — one cannot hide from a witness who is \"upon\" the matter.", "criticalTr": "'alā edatı burada dhālika'yı (o/bunu) mecrur halde yönetir ve tanık (shahīd) ile tanıklık nesnesi (100:6'daki nankörlük) arasındaki ilişkiyi kurar. Üç okuma yapısal olarak mümkündür: (a) 'alā \"hakkında\" olarak — tanık nankörlük HAKKINDA tanıklık eder; (b) 'alā \"üzerinde\" olarak — tanık nankörlüğün üzerinde durur veya onu izler; (c) 'alā \"karşı/aleyhine\" olarak — tanıklık benliğe KARŞI yöneltilmiştir. (c) okuması özellikle güçlüdür: insanın öz-bilgisi tarafsız bir gözlem değil, kendi aleyhine sıralanmış delildir. 'alā'nın mekansal metaforu (yücelik, üstte olma) kaçınılmaz farkındalığı düşündürür — meselenin \"üstünde\" duran bir tanıktan saklanılamaz.", "temporal": "7C"}, {"id": 4, "arabic": "ذَٰلِكَ", "translit": "dhālika", "gloss": "that (distant demonstrative)", "glossTr": "o/şu (uzak işaret zamiri)", "userNotes": "", "root": "— (-)", "grammar": "Demonstrative pronoun (ism ishāra) for distant reference, masculine singular, in the genitive (majrūr) governed by 'alā. dhālika is composed of dhā (demonstrative base) + li (distance marker) + ka (addressee suffix). It refers backward to the content of 100:6: the human's ingratitude (kanūd) toward his Lord. The choice of the DISTANT demonstrative (dhālika rather than hādhā/this) creates emotional distance — the ingratitude is presented as something removed, objectified, viewed from above.", "grammarTr": "Uzak gönderimli işaret zamiri (ism-i işāre), eril tekil, 'alā tarafından yönetilen mecrur halde. dhālika, dhā (işaret tabanı) + li (uzaklık belirleyicisi) + ka (muhatap eki) bileşenlerinden oluşur. 100:6'nın içeriğine geriye döner: insanın Rabbine karşı nankörlüğü (kanūd). UZAK işaret zamiri seçimi (hādhā/bu yerine dhālika) duygusal mesafe yaratır — nankörlük uzaklaştırılmış, nesneleştirilmiş, yukarıdan bakılmış bir şey olarak sunulur.", "semantics": ["Demonstrative dhālika: \"that\" — refers to something distant in space, time, or discourse", "Lane's Lexicon: composed of dhā (pointing element) + lām (distance) + kāf (address); used for what is far from the speaker and near to or far from the addressee", "Discourse function: anaphoric reference — points backward to previously mentioned content; here anchoring the testimony to a specific antecedent (ingratitude)", "Core concept: objectifying distance — dhālika frames the referenced matter as something external, observable, and assessable rather than intimate or present"], "semanticsTr": ["İşaret zamiri dhālika: \"o/şu\" — mekanda, zamanda veya söylemde uzak olana işaret eder", "Lane's Lexicon: dhā (işaret öğesi) + lām (uzaklık) + kāf (hitap) bileşenidir; konuşmacıdan uzak olana işaret eder", "Söylem işlevi: geriye gönderim — daha önce belirtilen içeriğe işaret eder; burada tanıklığı belirli bir öncüle (nankörlüğe) bağlar", "Kök kavram: nesneleştirici mesafe — dhālika gönderim yapılan meseleyi yakın veya mevcut değil, dışsal, gözlemlenebilir ve değerlendirilebilir olarak çerçeveler"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "", "criticalTr": ""}, {"id": 5, "arabic": "لَشَهِيدٌۭ", "translit": "la-shahīdun", "gloss": "surely a witness; surely one who testifies; surely one who observes directly", "glossTr": "elbette bir tanık; elbette şahadet eden; elbette doğrudan gözlemleyen", "userNotes": "", "root": "ش ه د (sh-h-d)", "grammar": "Noun (ism), masculine singular, indefinite, nominative (marfū') as predicate of inna (khabar inna). Pattern fa'īl (فَعِيل), an intensive/habitual adjective denoting one characterized by the quality — here, one who habitually or inherently witnesses. Prefixed with lām al-tawkīd (emphatic lām), which combines with inna to create double emphasis. The indefinite form (shahīdun, not ash-shahīdu) makes the predication qualitative: \"he is [a type of being characterized as] witness\" rather than \"he is THE witness.\"", "grammarTr": "İsim, eril tekil, belirsiz (nekre), inne'nin haberi olarak merfû halde. fa'īl (فَعِيل) kalıbı, nitelikle karakterize olanı ifade eden mübalağa/devamlılık sıfatıdır — burada sürekli veya doğası gereği tanıklık eden. Lâmü't-te'kîd (pekiştirme lâmı) ile başlar; inne ile birleşerek çifte pekiştirme yaratır. Belirsiz form (shahīdun, eş-şehīdu değil) yüklemeyi niteliksel kılar: \"o tanıktır [bir varlık türü olarak]\" anlamını verir, \"o TEK tanıktır\" değil.", "semantics": ["Root sh-h-d (ش ه د): to witness, to be present, to testify, to observe, to experience firsthand", "فَعِلَ (shahida, I): to witness, to see with one's own eyes; to be present at; to testify, to bear witness; to die as a martyr (because the martyr witnesses divine reality at death)", "III (shāhada): to witness together, to observe mutually; to be face-to-face with", "IV (ashhada): to make someone witness, to call to testify; to make apparent", "X (istashhada): to ask for testimony; to die as a martyr (to seek the status of shahīd)", "Noun shahīd (fa'īl): one who witnesses, testifier, martyr; can carry active sense (one who witnesses) OR passive sense (one witnessed/attested to, i.e., mashhūd)", "Noun shahāda: testimony, witnessing; the visible world (ʿālam al-shahāda = realm of the observable, opposed to ʿālam al-ghayb = realm of the unseen)", "Noun mashhad: scene, spectacle; place of witnessing; court of testimony", "Noun shāhid: one who testifies (active participle); witness in legal proceedings", "Lane's Lexicon: shahida al-shay' = he was present at the thing and saw it; shahida 'alayhi = he bore witness against him; shahida lahu = he bore witness for him; the root combines presence, perception, and declaration — to witness is to BE THERE, to SEE, and to SPEAK about what was seen", "Lisan al-Arab: shahīd = one whose testimony is accepted because of direct experience; also = God (who witnesses all); also = the martyr (who witnesses the unseen at death and whose blood testifies to faith)", "Hans Wehr: shahida = to witness, attend, observe, experience; shahīd = witness, eyewitness, martyr; shahāda = testimony, certificate, diploma, creed (the shahāda as Islamic declaration of faith)", "Classical tension: shahīd carries both \"the one who witnesses\" (active) and \"the one witnessed about\" (passive, like qaṭīl = killed one). In this ayah, the human is both: he witnesses his own ingratitude AND his ingratitude is witnessed", "Modern extension: shahīd as data witness — surveillance footage, digital audit trails, blockchain timestamps; any system that records events for later verification", "Futuristic extension: the concept of permanent self-documentation — wearable tech, brain-computer interfaces, total life-logging where every human IS a complete record of their own existence", "Core concept: the convergence of presence, perception, and testimony — to witness is to be present, to perceive directly, and to carry the obligation of declaring what was perceived"], "semanticsTr": ["Kök sh-h-d (ش ه د): tanıklık etmek, hazır bulunmak, şahadet etmek, gözlemlemek, bizzat deneyimlemek", "فَعِلَ (şehide, I. bab): tanıklık etmek, kendi gözüyle görmek; hazır bulunmak; şahadet etmek, tanıklık yapmak; şehit düşmek (çünkü şehit ölümde ilahi gerçekliğe tanıklık eder)", "III. bab (şāhede): birlikte tanıklık etmek, karşılıklı gözlemlemek; yüz yüze olmak", "IV. bab (eşhede): tanık tutmak, şahit göstermek; açığa çıkarmak", "X. bab (isteşhede): tanıklık istemek; şehit düşmek (şehīd makamını aramak)", "İsim shahīd (fa'īl): tanık, şahit, şehit; etken anlam (tanıklık eden) VEYA edilgen anlam (tanıklık edilen, yani meşhūd) taşıyabilir", "İsim şehāde: tanıklık, şahadet; görünür alem (ālemü'ş-şehāde = gözlemlenebilir alem, ālemü'l-ğayb = görünmeyen alemin karşıtı)", "İsim meşhed: sahne, manzara; tanıklık yeri; mahkeme", "İsim şāhid: tanıklık eden (ism-i fāil); hukuki işlemlerde tanık", "Lane's Lexicon: şehide'ş-şey' = o şeye hazır bulundu ve gördü; şehide 'aleyhi = ona karşı tanıklık etti; şehide lehu = onun lehine tanıklık etti; kök mevcudiyet, algı ve beyanı birleştirir — tanıklık etmek ORADA OLMAK, GÖRMEK ve görülenı SÖYLEMEKtir", "Lisan al-Arab: shahīd = doğrudan deneyim nedeniyle tanıklığı kabul edilen; ayrıca = Allah (her şeye tanık olan); ayrıca = şehit (ölümde görünmeyene tanıklık eden ve kanı imana şahadet eden)", "Hans Wehr: şehide = tanıklık etmek, katılmak, gözlemlemek, deneyimlemek; shahīd = tanık, görgü tanığı, şehit; şehāde = tanıklık, sertifika, diploma, kelime-i şehadet", "Klasik gerilim: shahīd hem \"tanıklık eden\" (etken) hem \"hakkında tanıklık edilen\" (edilgen, katīl = öldürülen gibi) anlamı taşır. Bu ayette insan her ikisidir: kendi nankörlüğüne tanıklık eder VE nankörlüğü tanıklık edilir", "Modern genişleme: shahīd veri tanığı olarak — güvenlik kamerası görüntüsü, dijital denetim izleri, blokzincir zaman damgaları; olayları sonradan doğrulama için kaydeden her sistem", "Geleceksel genişleme: kalıcı öz-belgeleme kavramı — giyilebilir teknoloji, beyin-bilgisayar arayüzleri, her insanın kendi varoluşunun eksiksiz kaydı olduğu total yaşam kaydı", "Kök kavram: mevcudiyet, algı ve tanıklığın birleşimi — tanıklık etmek hazır bulunmak, doğrudan algılamak ve algılananı beyan etme yükümlülüğünü taşımaktır"], "occurrences": {"type": "grouped", "groups": [{"label": "A. shahīd as divine attribute — God as witness over creation and human deeds", "count": "~56 ayahs", "examples": [{"ref": "4:79", "arabic": "مَّآ أَصَابَكَ مِنْ حَسَنَةٍۢ فَمِنَ ٱللَّهِ ۖ وَمَآ أَصَابَكَ مِن سَيِّئَةٍۢ فَمِن نَّفْسِكَ ۚ وَأَرْسَلْنَٰكَ لِلنَّاسِ رَسُولًۭا ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًۭا", "english": "Whatever good reaches you is from God, and whatever evil befalls you is from yourself. And We have sent you to people as a messenger. And sufficient is God as shahīd (witness).", "turkish": "Sana ulaşan her iyilik Allah'tandır, başına gelen her kötülük kendindedir. Seni insanlara elçi olarak gönderdik. Tanık olarak Allah yeter."}, {"ref": "4:166", "arabic": "لَّٰكِنِ ٱللَّهُ يَشْهَدُ بِمَآ أَنزَلَ إِلَيْكَ ۖ أَنزَلَهُۥ بِعِلْمِهِۦ ۖ وَٱلْمَلَٰٓئِكَةُ يَشْهَدُونَ ۚ وَكَفَىٰ بِٱللَّهِ شَهِيدًا", "english": "But God bears witness to what He has revealed to you — He revealed it with His knowledge — and the angels bear witness. And sufficient is God as shahīd (witness).", "turkish": "Ama Allah sana indirdiğine tanıklık eder — onu ilmiyle indirdi — ve melekler de tanıklık eder. Tanık olarak Allah yeter."}, {"ref": "10:29", "arabic": "فَكَفَىٰ بِٱللَّهِ شَهِيدًۢا بَيْنَنَا وَبَيْنَكُمْ إِن كُنَّا عَنْ عِبَادَتِكُمْ لَغَٰفِلِينَ", "english": "Then sufficient is God as shahīd (witness) between us and you — indeed, we were unaware of your worship.", "turkish": "Aramızda ve aranızda tanık olarak Allah yeter — gerçekten biz sizin ibadetinizden habersizdik."}]}, {"label": "B. shahīd as human witness — testimony in legal, social, and eschatological contexts", "count": "~56 ayahs", "examples": [{"ref": "2:282", "arabic": "وَٱسْتَشْهِدُوا۟ شَهِيدَيْنِ مِن رِّجَالِكُمْ", "english": "And call to witness two shahīdayn (witnesses) from among your men.", "turkish": "Ve erkeklerinizden iki şahit (shahīdayn) tutun."}, {"ref": "5:106", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ شَهَٰدَةُ بَيْنِكُمْ إِذَا حَضَرَ أَحَدَكُمُ ٱلْمَوْتُ حِينَ ٱلْوَصِيَّةِ ٱثْنَانِ ذَوَا عَدْلٍۢ مِّنكُمْ", "english": "O you who believe, testimony (shahāda) between you when death approaches one of you at the time of bequest — two just persons from among you.", "turkish": "Ey iman edenler! Birinize ölüm geldiğinde vasiyet zamanında aranızda tanıklık (şehāde) — içinizden adaletli iki kişi."}]}, {"label": "C. shahīd as self-witnessing — creatures testifying about/against themselves", "count": "~14 ayahs", "examples": [{"ref": "6:19", "arabic": "قُلْ أَىُّ شَىْءٍ أَكْبَرُ شَهَٰدَةًۭ ۖ قُلِ ٱللَّهُ ۖ شَهِيدٌۢ بَيْنِى وَبَيْنَكُمْ", "english": "Say: what thing is greatest in shahāda (testimony)? Say: God — shahīd (witness) between me and you.", "turkish": "De ki: Hangi şey tanıklıkta (şehāde) en büyüktür? De ki: Allah — benimle sizin aranızda tanıktır (shahīd)."}, {"ref": "41:20", "arabic": "حَتَّىٰٓ إِذَا مَا جَآءُوهَا شَهِدَ عَلَيْهِمْ سَمْعُهُمْ وَأَبْصَٰرُهُمْ وَجُلُودُهُم بِمَا كَانُوا۟ يَعْمَلُونَ", "english": "Until, when they reach it, their hearing and their eyes and their skins will shahida (testify) against them about what they used to do.", "turkish": "Sonunda oraya vardıklarında kulakları, gözleri ve derileri yaptıklarına dair onların aleyhine tanıklık edecek (şehide)."}]}]}, "qiraat": [], "cooccurrence": [], "critical": "shahīd in the fa'īl pattern is one of the most semantically loaded words in the Quran (160 occurrences of the root sh-h-d). The fa'īl pattern carries an inherent ambiguity: it can be active (fā'il meaning, \"one who witnesses\") or passive (maf'ūl meaning, \"one who is witnessed/testified about,\" like jarīḥ = wounded, qatīl = killed). In this ayah, the active reading is primary (the human/God as witness), but the passive undertone persists: the human is also the one WITNESSED — his ingratitude is on display, observed, exposed. Lane's Lexicon records shahida as combining three elements: (1) ḥuḍūr (presence — being there), (2) ru'ya (seeing — perceiving directly), (3) iqrār (declaration — stating what was seen). All three converge in this ayah: the human is present to his own ingratitude, perceives it, and his existence declares it. The indefinite form la-shahīdun (rather than definite la-sh-shahīd) makes the predication qualitative: the human is CHARACTERIZED by witnessing, it is his nature, not just an act. The phonetic echo between shahīd (100:7) and shadīd (100:8, next ayah) — both fa'īl pattern words with sh- initial — creates a sonic and semantic link: the witness (shahīd) of ingratitude is also intense (shadīd) in his love of wealth.", "criticalTr": "shahīd fa'īl kalıbında Kur'an'ın anlamsal olarak en yüklü kelimelerinden biridir (sh-h-d kökünün 160 geçişi). fa'īl kalıbı doğal bir belirsizlik taşır: etken (fāil anlamı, \"tanıklık eden\") veya edilgen (mef'ūl anlamı, \"tanıklık edilen,\" cerīḥ = yaralı, katīl = öldürülmüş gibi) olabilir. Bu ayette etken okuma birincildir (insan/Allah tanık olarak), ama edilgen alt ses sürer: insan aynı zamanda tanıklık EDİLENdir — nankörlüğü sergilenmekte, gözlemlenmekte, ifşa edilmektedir. Lane's Lexicon şehide'nin üç öğeyi birleştirdiğini kaydeder: (1) ḥuḍūr (mevcudiyet — orada olmak), (2) ru'ye (görme — doğrudan algılama), (3) ikrār (beyan — görülenı ifade etme). Üçü de bu ayette birleşir: insan kendi nankörlüğüne mevcuttur, onu algılar ve varlığı onu beyan eder. Belirsiz form le-shahīdun (belirli le-ş-şehīd yerine) yüklemeyi niteliksel kılar: insan tanıklıkla NİTELENİR, bu onun doğasıdır, salt bir eylem değil. shahīd (100:7) ile şedīd (100:8, sonraki ayet) arasındaki fonetik yankı — ikisi de fa'īl kalıbında, ş- başlangıçlı — sonik ve anlamsal bir bağ yaratır: nankörlüğün tanığı (shahīd) aynı zamanda servet sevgisinde yoğundur (shadīd).", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Does the pronoun -hu in innahū refer to the human (al-insān), to God, or to both simultaneously? Is the ambiguity itself the message — that witnessing is multi-layered?", "Why is shahīd in the indefinite form (shahīdun) rather than definite (ash-shahīd)? Does the qualitative predication suggest that self-witnessing is an inherent human trait, not a specific act?", "The demonstrative dhālika (distant \"that\") objectifies the ingratitude. Does this distancing create a forensic frame — as if the human's ingratitude is evidence presented in a cosmic court?", "How does the double emphasis (inna... la-) function rhetorically? Is it addressing denial — the human who knows but pretends not to know?", "The phonetic echo shahīd (100:7) / shadīd (100:8) creates a sonic pair. Does this echo link witnessing to intensity — is the human's witnessing of his own ingratitude itself intense, or does witnessing coexist with intensity of desire?", "If -hu refers to God, then kafā bi-llāhi shahīdan (4:79, 4:166, 10:29) provides the formula \"God suffices as witness.\" Does 100:7 invert this formula by making the human the witness rather than God?", "The root sh-h-d connects shahīd (witness), shahāda (testimony/creed), and shahīd (martyr). Does the martyr sense (\"one who dies witnessing truth\") create an undertone in this ayah — is the human's self-witnessing a kind of slow martyrdom?", "In 41:20-22, body parts testify against the self. Does 100:7 anticipate this eschatological testimony by establishing the human as already a witness against himself in the present life?", "Modern surveillance technology makes every human action permanently recorded and analyzable. Does 100:7's assertion that the human \"is surely a witness\" gain new force in an era of total digital documentation?", "The choice of 'alā (upon/over/against) rather than bi- (with/by) or li- (for) suggests the testimony is directional — aimed at or weighing upon the ingratitude. Does this preposition choice indicate hostile testimony (against oneself) rather than neutral observation?"], "questionsTr": ["innahū'daki -hu zamiri insana (el-insān) mı, Allah'a mı, yoksa ikisine birden mi döner? Belirsizliğin kendisi mesaj mıdır — tanıklığın çok katmanlı olduğu?", "shahīd neden belirsiz formda (shahīdun) olup belirli formda (eş-şehīd) değildir? Niteliksel yükleme, öz-tanıklığın belirli bir eylem değil, insana özgü bir nitelik olduğunu mu düşündürür?", "İşaret zamiri dhālika (uzak \"o\") nankörlüğü nesneleştirir. Bu mesafe bir adli çerçeve mi yaratır — sanki insanın nankörlüğü kozmik bir mahkemede sunulan delildir?", "Çifte pekiştirme (inne... le-) retorik olarak nasıl işlev görür? İnkarı mı hedefler — bilen ama bilmezden gelen insanı mı?", "shahīd (100:7) / şedīd (100:8) fonetik yankısı sonik bir çift yaratır. Bu yankı tanıklığı yoğunluğa mı bağlar — insanın kendi nankörlüğüne tanıklığı mı yoğundur, yoksa tanıklık arzu yoğunluğuyla mı bir arada bulunur?", "-hu Allah'a dönerse, kefā billāhi şehīden (4:79, 4:166, 10:29) \"tanık olarak Allah yeter\" formülünü verir. 100:7, Tanrı yerine insanı tanık yaparak bu formülü tersine mi çevirir?", "sh-h-d kökü shahīd'ı (tanık), şehāde'yi (tanıklık/kelime-i şehadet) ve şehīd'i (şehit) birbirine bağlar. Şehit anlamı (\"hakikate tanıklık ederek ölen\") bu ayette bir alt ses yaratır mı — insanın öz-tanıklığı bir tür yavaş şehadet midir?", "41:20-22'de beden parçaları benliğe karşı tanıklık eder. 100:7, insanı şimdiki hayatta zaten kendi aleyhine tanık olarak kurarak bu eskatologik tanıklığı önceden mi haber verir?", "Modern gözetim teknolojisi her insani eylemi kalıcı olarak kaydedilir ve çözümlenebilir kılar. 100:7'nin insanın \"elbette tanıktır\" iddiası total dijital belgeleme çağında yeni güç mü kazanır?", "'alā (üzerinde/karşı) seçimi bi- (ile) veya li- (için) yerine tanıklığın yönlü olduğunu düşündürür — nankörlüğe yöneltilmiş veya üzerine basan. Bu edat seçimi tarafsız gözlem yerine düşmanca tanıklığı (kendi aleyhine) mı gösterir?"], "key": "100:7"}, "100:8": {"surah": 100, "ayah": 8, "arabic": "وَإِنَّهُۥ لِحُبِّ ٱلْخَيْرِ لَشَدِيدٌ", "transliteration": "wa-innahu li-ḥubbi l-khayri la-shadīdun", "readings": [{"text": "And indeed he, in his love for wealth, is vehement/intense.", "textTr": "Ve gercekten o, mal sevgisinde siddetlidir/asiridir.", "rationale": "The li- is read as causative or specificative: \"in/for the love of\" — human beings are characterized by intense love of al-khayr (wealth). innahu refers to al-insan from 100:6. shadid describes the intensity of attachment. This reading treats al-khayr as \"wealth/property\" (a well-attested Quranic meaning).", "rationaleTr": "li- sebep veya tahsis edati olarak okunur: \"... sevgisinde/ugruna\" — insan al-khayr (mal) sevgisinde siddetli olarak nitelenir. innahu 100:6'daki al-insan'a donuk. shadid baglanmanin yogunlugunu betimler. Bu okuma al-khayr'i \"mal/mulk\" olarak alir (Kur'an'da iyi bilinen bir anlam)."}, {"text": "And indeed he is, due to the love of goodness, tenacious/strong.", "textTr": "Ve gercekten o, iyilik sevgisi sayesinde guclu/metanetlidir.", "rationale": "Here al-khayr is read as \"goodness/virtue\" rather than \"wealth.\" The li- indicates causation: BECAUSE of loving good, he becomes strong/tenacious. shadid = strength, not negative excess. This reading presents a positive characterization rather than criticism.", "rationaleTr": "Burada al-khayr \"mal\" degil \"iyilik/erdem\" olarak okunur. li- sebep bildirir: Iyiligi sevdigi ICIN guclu/dayanikli olur. shadid = guc, olumsuz asirilik degil. Bu okuma elestirel degil olumlu bir niteleme sunar."}, {"text": "And indeed he — for the love of material resources — is extreme/excessive.", "textTr": "Ve gercekten o — maddi kaynaklar ugruna — asiri/olcusuzdur.", "rationale": "al-khayr as material resources (modern extension: capital, assets, data, accumulated value of any kind). shadid as \"excessive/extreme\" — a critique of resource accumulation behavior. The lam al-tawkid (la-shadidun) doubles down on the emphasis, suggesting this is a defining trait.", "rationaleTr": "al-khayr maddi kaynaklar olarak (modern uzanti: sermaye, varlik, veri, her turlu biriktirilmis deger). shadid \"asiri/olcusuz\" olarak — kaynak biriktirme davranisinin elestirisi. Lam-i tekid (la-shadidun) vurguyu ikiye katlar, bunun tanimlayici bir ozellik oldugunu ima eder."}, {"text": "And indeed it — for the love of advantage — is fierce/relentless.", "textTr": "Ve gercekten o (sey) — avantaj sevgisi icin — amansiz/acimasizdir.", "rationale": "innahu with hu referring not to al-insan but to the nafs (self/appetite) or to the broader condition described in 100:1-5. al-khayr as \"advantage/benefit\" (classical meaning). shadid as \"fierce/relentless\" — an unstoppable drive. This reading makes the ayah describe a psychological force, not just a human trait.", "rationaleTr": "innahu'deki hu zamiri al-insan'a degil nefs'e (benlik/istah) veya 100:1-5'te betimlenen genel duruma gonderme yapar. al-khayr \"avantaj/menfaat\" olarak (klasik anlam). shadid \"acimasiz/amansiz\" olarak — durdurulamaz bir durtugu. Bu okuma ayeti sadece insani bir ozellik degil psikolojik bir gucu betimler."}, {"text": "And indeed he is, in his love for the optimum/best, unyielding/rigid.", "textTr": "Ve gercekten o, en iyiyi/optimumu sevmesinde katı/odunsuzd.", "rationale": "al-khayr from kh-y-r in its superlative/comparative root sense: not just \"good\" but \"the best/optimum.\" shadid as \"rigid/unyielding\" — the human pursuit of optimization is itself relentless. Futuristic extension: algorithmic optimization, pursuit of maximum efficiency. The human as an optimization engine.", "rationaleTr": "al-khayr, kh-y-r kokunden ust-derece/karsilastirma anlaminda: sadece \"iyi\" degil \"en iyi/optimum.\" shadid \"kati/odunsuz\" olarak — insanin optimizasyon arayisi basli basina amansizdir. Geleceksel uzanti: algoritmik optimizasyon, azami verimlilik arayisi. Insan bir optimizasyon motoru olarak."}], "structure": {"beats": [{"label": "Emphatic assertion", "labelTr": "Vurgulu beyan", "lines": [{"arabic": "وَإِنَّهُۥ", "translit": "wa-innahu", "english": "And indeed he", "turkish": "Ve gercekten o"}]}, {"label": "Object of intensity", "labelTr": "Yogunlugun nesnesi", "lines": [{"arabic": "لِحُبِّ ٱلْخَيْرِ", "translit": "li-ḥubbi l-khayri", "english": "for the love of wealth/good", "turkish": "mal/iyilik sevgisinde"}]}, {"label": "Predicate of intensity", "labelTr": "Yogunluk yuklemegi", "lines": [{"arabic": "لَشَدِيدٌ", "translit": "la-shadīdun", "english": "is surely intense/vehement", "turkish": "kesinlikle siddetlidir"}]}], "summary": "The ayah is a single nominal sentence with double emphasis: inna (emphatic particle asserting certainty) + la- prefix on the predicate (shadidun). The structure is: [wa + inna + hu (subject pronoun)] + [li-hubbi l-khayri (prepositional phrase — either causative, specificative, or purpose)] + [la-shadidun (emphatic predicate)]. The li- in li-hubbi can be parsed as: (a) lam al-ta'lil (causative: because of love), (b) lam al-takhsis (specificative: with respect to love), or (c) lam al-jarr (prepositional: for/toward love). Each parsing generates a different semantic reading. The double emphasis (inna... la-) frames this as a fundamental statement about human nature — not an incidental observation but a defining characterization. The pronoun hu refers back to al-insan in 100:6, maintaining the surah's diagnostic tone.", "summaryTr": "Ayet, cift vurgulu tek bir isim cumlesidir: inna (kesinlik bildiren tekid edati) + yuklem uzerinde la- oneki (shadidun). Yapi soyledir: [wa + inna + hu (ozne zamiri)] + [li-hubbi l-khayri (edat tamlamasi — ya sebep, tahsis veya amac bildiren)] + [la-shadidun (tekidli yuklem)]. li-hubbi'deki li- su sekillerde ayrıstırılabilir: (a) lam-i ta'lil (sebep: sevgi yuzunden), (b) lam-i tahsis (tahsis: sevgi bakimindan), (c) lam-i cerr (edat: sevgiye/sevgi icin). Her ayristirma farkli bir anlamsal okuma uretir. Cift tekid (inna... la-) bunu insan dogasi hakkinda temel bir ifade olarak cerceveler — gelisiguzel bir gozlem degil, tanimlayici bir niteleme. hu zamiri 100:6'daki al-insan'a gonderme yapar, surenin tanisal tonunu surddurur."}, "words": [{"id": 1, "arabic": "وَ", "translit": "wa", "gloss": "and / now", "glossTr": "ve / simdi", "userNotes": "", "root": "-- (--)", "grammar": "Conjunction. In this context functions as 'atf (coordination) linking this assertion to the preceding ayah 100:7 (wa-innahu 'ala dhalika la-shahid / wa-innahu li-hubbi l-khayri la-shadid). The parallel structure of 100:7 and 100:8 both using inna...la- suggests this wa coordinates two parallel characterizations.", "grammarTr": "Baglac. Bu baglamda 100:7 ile paralel yapi olusturan atif (baglama) islevindedir (wa-innahu 'ala dhalika la-shahid / wa-innahu li-hubbi l-khayri la-shadid). 100:7 ve 100:8'in ikisinin de inna...la- kullanmasi bu vav'in iki paralel nitelemeyi bagladigini gosterir.", "semantics": ["'atf (coordination): joins parallel elements — \"and\"", "hal (circumstantial): marks simultaneous state — \"while/when\"", "qasam (oath): introduces oath — \"by\"", "istinaf (resumptive): opens new topic/section — often untranslated or \"now\""], "semanticsTr": ["Atif (baglama): esit ogeleri birlestirir — \"ve\"", "Hal (durum): es zamanli durumu belirtir — \"iken\"", "Kasem (yemin): yemin baslatir — \"yemin olsun\"", "Istinaf (yeniden baslama): yeni konu/bolum acar — genellikle cevirilmez"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The wa here functions as 'atf (coordination), creating a parallel pair with 100:7: (1) wa-innahu 'ala dhalika la-shahidun (and indeed he is a witness to that), (2) wa-innahu li-hubbi l-khayri la-shadidun (and indeed he, in his love for wealth, is vehement). Both clauses share identical syntactic structure: wa + inna + hu + prepositional phrase + la- + predicate adjective. This structural parallelism creates a rhetorical pairing: self-awareness (shahid) paired with self-indulgence (shadid for hubb al-khayr). The parallel suggests these are two sides of the same human condition — the human KNOWS (shahid) yet still remains VEHEMENT (shadid).", "criticalTr": "Buradaki vav atif islevindedir, 100:7 ile paralel bir cift olusturur: (1) wa-innahu 'ala dhalika la-shahidun (ve gercekten o buna sahittir), (2) wa-innahu li-hubbi l-khayri la-shadidun (ve gercekten o mal sevgisinde siddetlidir). Her iki cumle ayni sozdizimsel yapiyi paylaşır: wa + inna + hu + edat tamlamasi + la- + yuklem sifati. Bu yapisal paralellik retorik bir esleme olusturur: oz-farkindalik (shahid) ile oz-duskunluk (hubb al-khayr icin shadid) eslesmesi. Paralellik bunlarin ayni insani durumun iki yuzu oldugunu ileri surer — insan BILIR (shahid) ama yine de SIDDETLI kalir (shadid)."}, {"id": 2, "arabic": "إِنَّهُۥ", "translit": "innahu", "gloss": "indeed he / verily he", "glossTr": "gercekten o / suphesiz o", "userNotes": "", "root": "-- (--)", "grammar": "Emphatic particle inna with attached pronoun hu (3rd masc. sing.). inna governs the accusative on its subject (here the pronoun is suffixed, so case is not visible). The hu refers back to al-insan in 100:6. inna + la- on the predicate creates double emphasis.", "grammarTr": "Tekid edati inna ile bitisik zamir hu (ucuncu sahis tekil eril). inna oznesini mansub halde yonetir (burada zamir bitisik oldugu icin hal gorunmez). hu zamiri 100:6'daki al-insan'a gonderme yapar. inna + yuklemdeki la- cift tekid olusturur.", "semantics": ["inna: emphatic assertive particle — \"indeed, verily, truly\"", "Classical (Lane): used to confirm and assert the content of the clause; al-Khalil and Sibawayh classify it among huruf al-tawkid (particles of emphasis)", "The suffixed -hu carries pronominal reference: \"he/it\" — referent depends on context (al-insan from 100:6, or the self/nafs, or the condition described)", "Modern/futuristic: the emphatic assertion can describe any self-aware agent — human, collective, algorithmic — characterized by vehement pursuit"], "semanticsTr": ["inna: tekid edati — \"gercekten, suphesiz, kesinlikle\"", "Klasik (Lisanu'l-Arab): cumle icerigini pekistirmek ve dogrulamak icin kullanilir; Halil ve Sibeveyhi huruf-u tekid (pekistirme harfleri) arasinda siniflandirir", "Bitisik -hu zamirsel gonderme tasir: \"o\" — gonderge baglama baglidir (100:6'daki al-insan, nefs, veya betimlenen durum)", "Modern/geleceksel: tekid bildirimi herhangi bir oz-farkinda failii betimleyebilir — insan, topluluk, algoritmik — siddetli arayisla nitelenen"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The pronoun hu in innahu creates a key interpretive question: what is its referent? The immediate antecedent is al-insan (100:6, \"indeed the human being is ungrateful to his Lord\"). But al-insan in Arabic can mean: (a) the human species generically, (b) the specific individual human, (c) the human self/nafs. Each referent produces a different reading. If generic: this is a universal diagnosis of human nature. If specific: it targets a particular type of person. If nafs: it describes the inner drive/appetite itself as the subject. The double-emphasis construction inna...la- appears in both 100:7 and 100:8, creating a structural frame: the human is simultaneously a witness (shahid, 100:7) and vehement in love of khayr (100:8). This paradox — awareness coexisting with excess — is the surah's central tension.", "criticalTr": "innahu'deki hu zamiri onemli bir yorum sorusu olusturur: gondergesi nedir? Dogrudan oncel 100:6'daki al-insan'dir (\"gercekten insan Rabbine karsi nankordur\"). Ancak Arapca'da al-insan su anlamlara gelebilir: (a) genel olarak insan turu, (b) belirli bir birey, (c) insani benlik/nefs. Her gonderge farkli bir okuma uretir. Genel ise: insanligin evrensel tanisi. Belirli ise: belli bir insan tipini hedefler. Nefs ise: ic durtunun/istahin kendisini ozne olarak betimler. Cift tekid yapisi inna...la- hem 100:7 hem 100:8'de gelerek yapisal bir cerceve olusturur: insan ayni anda hem sahittir (shahid, 100:7) hem de khayr sevgisinde siddetlidir (100:8). Bu paradoks — farkindaligin asirilikla bir arada olmasi — surenin merkezi gerilimini olusturur.", "temporal": "F"}, {"id": 3, "arabic": "لِ", "translit": "li", "gloss": "for / due to / in (his love)", "glossTr": "icin / yuzunden / ... (sevgi)sinde", "userNotes": "", "root": "-- (--)", "grammar": "Preposition prefixed to hubbi. Governs the genitive case. Ambiguous function: (a) lam al-ta'lil — causative: \"because of / due to,\" (b) lam al-takhsis — specificative: \"with respect to / in the matter of,\" (c) lam al-jarr — directional: \"for / toward.\"", "grammarTr": "hubbi'ye bitisik edat. Mecrur halini yonetir. Belirsiz islev: (a) lam-i ta'lil — sebep: \"yuzunden / dolayi,\" (b) lam-i tahsis — tahsis: \"bakimindan / konusunda,\" (c) lam-i cerr — yonelim: \"icin / -e dogru.\"", "semantics": ["Lam al-ta'lil (causation): \"because of / due to\" — the love of khayr causes the intensity", "Lam al-takhsis (specification): \"with respect to / in the matter of\" — specifies the domain in which the intensity manifests", "Lam al-jarr (purpose/direction): \"for / toward\" — the intensity is directed toward love of khayr", "Classical (Lane): li- governs the genitive; among its primary functions: possession (lam al-milk), purpose (lam al-ghaya), causation (lam al-ta'lil), specification (lam al-takhsis), temporal (lam al-waqt)"], "semanticsTr": ["Lam-i ta'lil (sebep): \"yuzunden / dolayi\" — khayr sevgisi yogunluga sebep olur", "Lam-i tahsis (tahsis): \"bakimindan / konusunda\" — yogunlugun kendini gosterdigi alani belirtir", "Lam-i cerr (amac/yon): \"icin / -e dogru\" — yogunluk khayr sevgisine yoneliktir", "Klasik (Lisanu'l-Arab): li- mecrur halini yonetir; temel islevleri arasinda: mulkiyet (lam-i milk), amac (lam-i gaye), sebep (lam-i ta'lil), tahsis (lam-i tahsis), zaman (lam-i vakit)"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The li- prefix is the grammatical pivot of the entire ayah. Its parsing determines the fundamental meaning: (a) If causative (lam al-ta'lil): \"due to his love of khayr, he is intense\" — the love CAUSES the intensity in other domains (greed, competition, hoarding). (b) If specificative (lam al-takhsis): \"in the matter of love of khayr, he is intense\" — the intensity is LOCALIZED to the domain of loving khayr. (c) If directional/purposive: \"for the love of khayr, he is intense\" — the intensity is DIRECTED toward acquiring khayr. Classical grammarians debated this: al-Zamakhshari favored the specificative reading, while others allowed the causative. The ambiguity is likely deliberate — all three parsings coexist in the text.", "criticalTr": "li- oneki ayetin tumunun dilbilgisel eksenini olusturur. Ayristirmasi temel anlami belirler: (a) Sebep (lam-i ta'lil) ise: \"khayr sevgisi yuzunden siddetlidir\" — sevgi diger alanlarda (hirss, rekabet, biriktirme) yogunluga SEBEP OLUR. (b) Tahsis (lam-i tahsis) ise: \"khayr sevgisi konusunda siddetlidir\" — yogunluk khayr sevme alanina SINIRLANIR. (c) Yon/amac ise: \"khayr sevgisi icin siddetlidir\" — yogunluk khayr edinmeye YONELIKTIR. Klasik gramerciler bunu tartismistir: Zamahseri tahsis okumasini tercih ederken digeleri sebep okumaisna da izin vermistir. Belirsizlik muhtemelen kasitlidir — uc ayristirma da metinde bir arada bulunur."}, {"id": 4, "arabic": "حُبِّ", "translit": "ḥubb", "gloss": "love / desire / attachment / passion", "glossTr": "sevgi / arzu / baglanti / tutku", "userNotes": "", "root": "ح ب ب (h-b-b)", "grammar": "Verbal noun (masdar/gerund) in the genitive case, governed by li-. First element of an idafa (construct) with al-khayri. From root h-b-b. The GERUND form indicates the abstract concept of loving.", "grammarTr": "Mecrur halde mastar (sozel isim), li- tarafindan yonetilir. al-khayri ile izafe yapisinin ilk ogesi. h-b-b kokunden. Mastar biciimi soyut sevme kavramini bildirir.", "semantics": ["fa'ala (I): to love, to like, to desire; ahabba (IV): to love, to prefer; habba (I alternate): to become dear", "hubb (masdar): love, affection, desire, attachment, passion; also: seed, grain (habb — same root, different derivative)", "Classical (Lane): hubb = love, affection; also habb = seed/grain; hubab = bubbling of water; habba = a single grain; hababah = pupil of the eye (that which is loved/cherished); al-habib = the beloved; istahabb = to prefer, to deem lovable", "Lisan al-Arab: hubb as the opposite of bughd (hatred); habb as the seed from which things grow — semantic link between love and germination/origin", "Hans Wehr: hubb = love, affection; habb = grain, seed, pill, tablet; habba = berry, pill; mahbub = beloved, popular", "Modern/futuristic: attachment, preference, optimization bias — any system's weighted preference toward an outcome; algorithmic \"love\" as weighted attraction toward a value", "Core concept: gravitational attraction toward a valued object — whether emotional (love), botanical (seed drawn to earth), or systematic (preference weighting)"], "semanticsTr": ["fe'ale (I. bab): sevmek, begenmek, arzu etmek; ehabbe (IV. bab): sevmek, tercih etmek", "hubb (mastar): sevgi, muhabbet, arzu, baglanti, tutku; ayrica: tane, tohum (habb — ayni kok, farkli turev)", "Klasik (Lisanu'l-Arab): hubb = sevgi, muhabbet; habb = tohum/tane; hubab = suyun kabarciklari; habba = tek tane; hababah = goz bebegi (sevilen/deger verilen); al-habib = sevgili; istahabb = tercih etmek", "Hans Wehr: hubb = sevgi, muhabbet; habb = tane, tohum, hap, tablet; habba = cilek, hap; mahbub = sevilen, populer", "Modern/geleceksel: baglanma, tercih, optimizasyon yanilimi — herhangi bir sistemin bir sonuca yonelik agirlikli tercihi; algoritmik \"sevgi\" olarak bir degere cekiim", "Kok kavram: degerli bir nesneye cekimsel cekim — duygusal (sevgi), botanik (tohumun topraga cekimi) veya sistematik (tercih agirliklandirmasi)"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Gerund/masdar hubb in prepositional and object positions — expressing love as abstract force", "count": "~10 ayahs", "examples": [{"ref": "2:165", "arabic": "وَمِنَ ٱلنَّاسِ مَن يَتَّخِذُ مِن دُونِ ٱللَّهِ أَندَادًۭا يُحِبُّونَهُمْ كَحُبِّ ٱللَّهِ ۖ وَٱلَّذِينَ ءَامَنُوٓا۟ أَشَدُّ حُبًّۭا لِّلَّهِ", "english": "Among people are those who take besides God equals, loving them as (they should love) God (ka-hubbi llahi). Those who believe are more intense in love (ashaddu hubban) for God.", "turkish": "Insanlardan bazilari Allah'tan baska esler edinir, onlari Allah'i sever gibi severler (ka-hubbi llahi). Iman edenler ise Allah'a sevgide daha siddetlidir (esheddu hubben)."}, {"ref": "12:30", "arabic": "۞ وَقَالَ نِسْوَةٌۭ فِى ٱلْمَدِينَةِ ٱمْرَأَتُ ٱلْعَزِيزِ تُرَٰوِدُ فَتَىٰهَا عَن نَّفْسِهِۦ ۖ قَدْ شَغَفَهَا حُبًّا", "english": "Women in the city said: \"The wife of the noble seduces her young man — he has penetrated her heart with love (hubban).\"", "turkish": "Sehirdeki kadinlar dedi: \"Aziz'in karisi delikanlisinii bastas ediyor — onu ask ile (hubben) yuregi delinmis.\""}, {"ref": "89:20", "arabic": "وَتُحِبُّونَ ٱلْمَالَ حُبًّۭا جَمًّۭا", "english": "And you love wealth with an all-consuming love (hubban jamman).", "turkish": "Ve siz mali asiri bir sevgiyle (hubben cemmen) seviyorsunuz."}]}, {"label": "B. Verb forms (IV ahabba, I habba) — expressing acts of loving and preferring", "count": "~63 ayahs", "examples": [{"ref": "3:31", "arabic": "قُلْ إِن كُنتُمْ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِى يُحْبِبْكُمُ ٱللَّهُ", "english": "Say: If you love God, then follow me — God will love you.", "turkish": "De ki: Eger Allah'i seviyorsaniz bana uyun ki Allah sizi sevsin."}, {"ref": "76:8", "arabic": "وَيُطْعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسْكِينًۭا وَيَتِيمًۭا وَأَسِيرًا", "english": "And they feed food — despite their love for it (hubbiihi) — to the needy, the orphan, and the captive.", "turkish": "Ve yemegi — ona duydukluari sevgiye ragmen (hubbihi) — yoksula, yetime ve esire yedirirler."}]}, {"label": "C. Concrete noun habb (seed/grain) — material/botanical sense", "count": "~12 ayahs", "examples": [{"ref": "6:95", "arabic": "۞ إِنَّ ٱللَّهَ فَالِقُ ٱلْحَبِّ وَٱلنَّوَىٰ", "english": "Indeed God is the splitter of the seed (al-habb) and the date-stone.", "turkish": "Gercekten Allah tohumu (al-habb) ve cekirdegi yarandir."}, {"ref": "2:261", "arabic": "مَّثَلُ ٱلَّذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِى سَبِيلِ ٱللَّهِ كَمَثَلِ حَبَّةٍ أَنۢبَتَتْ سَبْعَ سَنَابِلَ", "english": "The likeness of those who spend their wealth in God's way is as the likeness of a seed (habbatin) that sprouts seven ears.", "turkish": "Allah yolunda mallarini harcayanlarin ornegi yedi basak bitiren bir tane (habbetin) ornegi gibidir."}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "kh-y-r", "coRootAr": "خ ي ر", "count": "3", "refs": "100:8;2:216;38:32", "note": "Love (h-b-b) paired with goodness/wealth (kh-y-r): the three co-occurrences map a spectrum — 100:8 diagnoses intensity of love for khayr, 2:216 contrasts love/hate with hidden good/evil, 38:32 (Sulayman) confesses love of khayr diverted from divine remembrance. The 38:32 parallel is striking: same phrase hubb al-khayr appears there. <- IN THIS AYAH", "noteTr": "Sevgi (h-b-b) ile iyilik/mal (kh-y-r) eslesmesi: uc ortak gecis bir tayfolulusturur — 100:8 khayr sevgisinin yogunlugunu teshis eder, 2:216 sevgi/nefreti gizli iyi/kotuyle karsilastirir, 38:32'de (Suleyman) ilahi zikirdinden alikoyan khayr sevgisini itiraf eder. 38:32 paraleli carpici: ayni hubb al-khayr ifadesi orada gecer. <- BU AYETTE"}, {"coRoot": "sh-d-d", "coRootAr": "ش د د", "count": "2", "refs": "100:8;2:165", "note": "Love (h-b-b) paired with intensity (sh-d-d): 2:165 uses ashaddu hubban (more intense in love) for believers' love of God vs idolaters' love of equals. 100:8 uses shadid to characterize the human's love of khayr. The root pairing frames love as inherently intense — the question is WHAT is loved, not WHETHER love is intense. <- IN THIS AYAH", "noteTr": "Sevgi (h-b-b) ile yogunluk (sh-d-d) eslesmesi: 2:165 mu'minlerin Allah sevgisi ile musriklerin eslere sevgisi icin esheddu hubben (sevgide daha siddetli) kullanir. 100:8 insanin khayr sevgisini shadid ile niteler. Kok eslesmesi sevgiyi dogasi geregi yogun olarak cerceveler — soru sevginin yogun OLUP OLMADIGSI degil NEYIN sevildigi. <- BU AYETTE"}], "critical": "The word hubb (love/desire) is the emotional core of the ayah. Three critical observations: (1) The same phrase hubb al-khayr appears in 38:32 where Sulayman says \"inni ahbabtu hubba l-khayri 'an dhikri rabbi\" (I loved the love of khayr until [the horses] disappeared) — a direct textual parallel where love of khayr diverts from divine remembrance. This creates an intertextual resonance: is 100:8 diagnosing the same condition Sulayman confessed? (2) The root h-b-b also yields habb (seed/grain) — a concrete noun meaning the physical seed. There is a deep etymological link: love as that which germinates, which grows from a seed. The \"love of khayr\" can be read as the \"seed of khayr\" — something planted deep that grows uncontrollably. (3) In 2:165, ashaddu hubban li-llahi (more intense in love for God) uses the same root pairing (h-b-b + sh-d-d) as 100:8, but directed toward God rather than khayr. This suggests the capacity for intense love is neutral — it becomes praise or blame depending on its object. (4) Phonetically, the doubled b in hubb creates a percussive, insistent sound that enacts the meaning: love as repetitive, pulsing, insistent.", "criticalTr": "hubb (sevgi/arzu) kelimesi ayetin duygusal cekirdeigidir. Uc kritik gozlem: (1) Ayni hubb al-khayr ifadesi 38:32'de Suleyman'in \"inni ahbabtu hubba l-khayri 'an dhikri rabbi\" (Rabbimin zikrinden alikoyan khayr sevgisini sevdim) dedigi yerde gecer — khayr sevgisinin ilahi zikirrden alikoydugu dogrudan bir metinsel paralel. Bu metinlerarasi yanki olusturur: 100:8 Suleyman'in itiraf ettigi ayni durumu mu teshis ediyor? (2) h-b-b koku ayrica habb (tohum/tane) turetir — fiziksel tohum anlaminda somut bir isim. Derin bir etimolojik bag vardir: sevgi, filizlenen, tohumdan buyuyen. \"khayr sevgisi\" ayni zamanda \"khayr tohumu\" olarak okunabilir — derine ekilmis ve kontrolsuz buyuyen bir sey. (3) 2:165'te esheddu hubben li-llahi (Allah'a sevgide daha siddetli) 100:8 ile ayni kok eslesmesini (h-b-b + sh-d-d) kullanir, ancak khayr yerine Allah'a yoneliktir. Bu, yogun sevgi kapasitesinin tarafsiz oldugunu ileri surer — nesnesine bagli olarak ovgu veya yergi olur. (4) Ses acisindan, hubb'daki ikili b vurgulu, israrci bir ses olusturarak anlamı icra eder: sevgi tekrarli, nabiz atan, israrci olarak.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 5, "arabic": "ٱلْخَيْرِ", "translit": "al-khayri", "gloss": "wealth / good / advantage / the optimum", "glossTr": "mal / iyilik / menfaat / en iyi", "userNotes": "", "root": "خ ي ر (kh-y-r)", "grammar": "Noun (abstract) in the genitive case, second element of idafa with hubb. Definite article al- indicates the generic concept (\"the good\" / \"wealth\" in general). From root kh-y-r.", "grammarTr": "Mecrur halde isim (soyut), hubb ile izafe yapisinin ikinci ogesi. Harf-i tarif al- genel kavrami bildirir (\"iyilik\" / \"mal\" genel olarak). kh-y-r kokunden.", "semantics": ["fa'ala (I): to choose, to select, to prefer; istafa (X): to choose for oneself", "khayr (noun): good, goodness, virtue; wealth, property, possessions (especially horses and camels in classical usage); advantage, benefit", "Classical (Lane): khayr = good; opposed to sharr (evil); also specifically: wealth, property, especially abundant property; Lane cites: \"rajulun dhu khayrin\" = a man of wealth; al-khayr in some contexts = horses specifically (classical Arabian usage); also: what is chosen/preferred (from the root meaning \"to choose\")", "Lisan al-Arab: khayr = all that is beneficial and chosen; al-khayr = al-mal (wealth) in multiple Quranic contexts (2:180, 100:8); khayr as the superlative/comparative form (better/best); khiyar = the best ones, the chosen; ikhtiyar = choice, free will", "Hans Wehr: khayr = good, goodness; pl. khuyur/akhyar; khayr min = better than; khayriyya = charity; ikhtiyar = choice, option, preference", "Modern: resources, assets, capital, data, accumulated value of any kind — financial, informational, or social", "Futuristic: any value-carrying entity — data, attention, influence, computational power; \"love of khayr\" as the drive to accumulate value in any medium", "Core concept: that which is selected/preferred/valued — the object of choice, whether material (wealth), moral (goodness), or abstract (advantage)"], "semanticsTr": ["fe'ale (I. bab): secmek, tercih etmek; istafe (X. bab): kendisi icin secmek", "khayr (isim): iyilik, erdem; mal, mulk, varlik (klasik kullanamda ozellikle at ve deve); avantaj, menfaat", "Klasik (Lisanu'l-Arab): khayr = iyi; sherr'in (kotuluk) ziddi; ayrica ozellikle: servet, mulk, bol mulk; al-khayr = birkac Kur'an baglaminda al-mal (servet) (2:180, 100:8); khayr ust-derece/karsilastirma biciimi (daha iyi/en iyi); khiyar = en iyiler, secilenler; ikhtiyar = secim, irade", "Hans Wehr: khayr = iyilik; cog. khuyur/akhyar; khayr min = daha iyi; khayriyye = hayir isi; ikhtiyar = secim, opsiyon, tercih", "Modern: kaynaklar, varliklar, sermaye, veri, her turlu biriktirilmis deger — finansal, bilgisel veya sosyal", "Geleceksel: herhangi bir deger tasiyan varlik — veri, dikkat, etki, hesaplama gucu; \"khayr sevgisi\" herhangi bir ortamda deger biriktirme duurtisu olarak", "Kok kavram: secilen/tercih edilen/degeer verilen — secimin nesnesi, ister maddi (servet), ister ahlaki (iyilik), ister soyut (avantaj) olsun"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Abstract noun al-khayr (goodness/wealth) in various syntactic roles", "count": "~30 ayahs", "examples": [{"ref": "70:21", "arabic": "وَإِذَا مَسَّهُ ٱلْخَيْرُ مَنُوعًا", "english": "And when good/wealth (al-khayru) touches him, he is withholding.", "turkish": "Ve ona iyilik/mal (al-khayru) dokununda engel olur/esirger."}, {"ref": "21:35", "arabic": "وَنَبْلُوكُم بِٱلشَّرِّ وَٱلْخَيْرِ فِتْنَةًۭ", "english": "And We test you with evil and with good (al-khayri) as trial.", "turkish": "Ve sizi serr ile ve khayr (al-khayri) ile imtihan olarak sinariz."}, {"ref": "21:73", "arabic": "وَأَوْحَيْنَآ إِلَيْهِمْ فِعْلَ ٱلْخَيْرَٰتِ", "english": "And We revealed to them the doing of good deeds (al-khayrat).", "turkish": "Ve onlara hayirlari (al-khayrat) yapmayi vahyettik."}]}, {"label": "B. Comparative/superlative khayr (better/best)", "count": "~101 ayahs", "examples": [{"ref": "2:184", "arabic": "وَأَن تَصُومُوا۟ خَيْرٌۭ لَّكُمْ", "english": "And that you fast is better (khayrun) for you.", "turkish": "Ve oruc tutmaniz sizin icin daha hayirlidir (khayrun)."}, {"ref": "4:77", "arabic": "وَٱلْءَاخِرَةُ خَيْرٌۭ لِّمَنِ ٱتَّقَىٰ", "english": "And the hereafter is better (khayrun) for whoever is mindful.", "turkish": "Ve ahiret takva sahibi icin daha hayirlidir (khayrun)."}]}, {"label": "C. Gerund/masdar khayr (goodness as concept)", "count": "~57 ayahs", "examples": [{"ref": "2:180", "arabic": "كُتِبَ عَلَيْكُمْ إِذَا حَضَرَ أَحَدَكُمُ ٱلْمَوْتُ إِن تَرَكَ خَيْرًا", "english": "Prescribed for you: when death approaches one of you, if he leaves behind wealth (khayran)...", "turkish": "Size yazildi: birinize olum yaklastiginda, arkasinnnda mal (khayran) birakiyorsa..."}, {"ref": "3:26", "arabic": "بِيَدِكَ ٱلْخَيْرُ", "english": "In Your hand is all good (al-khayru).", "turkish": "Hayir (al-khayru) Senin elindedir."}]}]}, "qiraat": [{"arabic": "الْخَيْرْ", "translit": "al-khayr", "status": "Gramm", "type": "skn", "note": "Grammatical variant with sukun on ra' — pausaal pronunciation (waqf form) applied in continuous reading (wasl). This is a grammatical/dialectal difference in recitation practice, not a textual variant. Does not change meaning.", "noteTr": "Ra' uzerinde sukun ile dilbilgisel varyant — surekli okuma (vasl) icinde duraklama telaffuzu (vakf bicimi). Bu bir metin farkliligi degil, kipraat/lehce farki. Anlami degistirmez.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "h-b-b", "coRootAr": "ح ب ب", "count": "3", "refs": "100:8;2:216;38:32", "note": "Goodness/wealth (kh-y-r) paired with love (h-b-b): see h-b-b entry. The 38:32 Sulayman parallel is the most significant — identical phrase hubb al-khayr. <- IN THIS AYAH", "noteTr": "Iyilik/mal (kh-y-r) ile sevgi (h-b-b) eslesmesi: h-b-b girisine bakin. 38:32 Suleyman paraleli en anlamlisi — ayni hubb al-khayr ifadesi. <- BU AYETTE"}, {"coRoot": "sh-d-d", "coRootAr": "ش د د", "count": "3", "refs": "100:8;4:66;4:77", "note": "Goodness/wealth (kh-y-r) paired with intensity (sh-d-d): in 4:66 \"it would have been better (khayran) for them and more firmly establishing (ashadda tathbitan)\"; in 4:77 \"the hereafter is better (khayrun)\" vs \"more intense in fear (ashadda khashyatan).\" The pairing repeatedly contrasts what is better/good with what is more intense/severe. In 100:8, both roots converge on the same subject. <- IN THIS AYAH", "noteTr": "Iyilik/mal (kh-y-r) ile yogunluk (sh-d-d) eslesmesi: 4:66'da \"onlar icin daha hayirli (khayran) ve daha saglam (eshedde tethbiten) olurdu\"; 4:77'de \"ahiret daha hayirlidir (khayrun)\" ile \"korkuda daha siddetli (eshedde hashyeten).\" Esleme surekli daha iyi/haayirli olani daha yogun/siddetli olanla karsilastirir. 100:8'de her iki kok ayni ozne uzerinde birlesir. <- BU AYETTE"}], "critical": "al-khayr is the semantic crux of the ayah. Its meaning determines whether the ayah is a critique, a diagnosis, or a neutral observation. Four critical points: (1) al-khayr as \"wealth/property\" — classical lexicographers (Lane, Lisan al-Arab) explicitly gloss al-khayr as al-mal (wealth) in multiple Quranic contexts, especially 2:180 (inheritance verse: \"if he leaves behind khayr\" = wealth) and 100:8. In pre-Islamic poetry, \"rajulun dhu khayrin\" = \"a man of wealth.\" This reading makes the ayah a critique of materialist attachment. (2) al-khayr as \"goodness/virtue\" — if read as moral good, the ayah says humans are intensely devoted to goodness, which could be positive (passionate about doing good) or diagnostic (the intensity itself is the problem, regardless of object). (3) al-khayr as \"horses\" — Lane documents classical Arabian usage where al-khayr specifically means \"horses\" (al-khayl), connecting to the surah's opening imagery of 'adiyat (charging horses). If al-khayr = horses, the ayah circles back to the opening: the horses charge (100:1-5), and the human is vehement in love of them. This creates a structural ring. (4) The definite article al- in al-khayr indicates the GENERIC concept — not \"a good thing\" but \"the-good\" / \"goodness-as-such\" / \"wealth-as-category.\" This universalizes the statement. (5) Root kh-y-r means \"to choose\" — al-khayr is literally \"the chosen thing,\" the preferred object. Love of al-khayr is love of what one has selected as valuable, making this a meta-statement about human valuation itself.", "criticalTr": "al-khayr ayetin anlamsal odak noktasidir. Anlami ayetin bir elestiri mi, teshis mi yoksa tarafsiz bir gozlem mi oldugunu belirler. Dort kritik nokta: (1) al-khayr \"servet/mulk\" olarak — klasik sozlukcculer (Lane, Lisanu'l-Arab) al-khayr'i bircok Kur'an baglaminda, ozellikle 2:180 (miras ayeti: \"arkasindan khayr birakiyorsa\" = servet) ve 100:8'de al-mal (servet) olarak acikca karsilastirir. Cahiliye siirinde \"rajulun dhu khayrin\" = \"varlikli adam.\" Bu okuma ayeti maddeci baglanmanin elestirisi yapar. (2) al-khayr \"iyilik/erdem\" olarak — ahlaki iyi olarak okunursa, ayet insanlarin iyilige yogun sekilde bagli oldugunu soyler; bu olumlu (iyilik yapma konusunda tutkulu) veya tanisal (nesne ne olur
