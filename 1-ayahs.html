s eliminates the pronoun-fronting syntax and replaces it with repeated nominal assertions of belonging.", "noteTr": "İlk iyyāka varyantına paralel — ikinci tahsis zamirini \"ve biz gerçekten Senin içiniz\" ile değiştirir. Her iki kullanım da innā laka olarak okunursa ayetin tamamı şöyle olur: \"Biz gerçekten Seniniz — kulluk ederiz, ve biz gerçekten Seniniz — yardım dileriz.\" Bu, zamir öne alma sözdizimini ortadan kaldırır ve yerine tekrarlanan aidiyet isim cümleleri koyar.", "source": "erquran.org"}, {"arabic": "وَأَيَّاكَ", "translit": "wa-ayyāka", "status": "Irreg", "type": "vw", "note": "Vowel change (fatḥa on hamza) — dialectal variant, no semantic change.", "noteTr": "Ünlü değişimi (hemzede fetha) — lehçe varyantı, anlam değişikliği yok.", "source": "erquran.org"}, {"arabic": "وَإِيَاكَ", "translit": "wa-iyāka", "status": "Irreg", "type": "Gm", "note": "Removal of shadda from yā' — lighter pronunciation, same meaning.", "noteTr": "Yā'dan şedde kaldırılması — daha hafif telaffuz, aynı anlam.", "source": "erquran.org"}], "cooccurrence": [], "critical": "The repetition of iyyāka rather than simple pronominal suffixation (nasta'īnuka) is the second key syntactic feature of this ayah. The speaker deliberately re-establishes the full exclusivity structure for the second predicate. This has two implications: (1) each act (worship and seeking aid) gets its OWN exclusivity declaration — they are not lumped together; (2) the parallel structure creates a rhetorical emphasis (tarsī'/murā'āt al-naẓīr) where form mirrors content — the two-part structure of the relationship (giving service / receiving aid) is enacted by the two-part structure of the sentence. The wa-innā laka variant (shawādhdh) for both occurrences would transform the entire ayah from a syntactic restriction to a repeated confession of belonging — a radically different speech act.", "criticalTr": "iyyāka'nın basit zamir ekleme (nasta'īnuka) yerine tekrarlanması bu ayetin ikinci temel sözdizimi özelliğidir. Konuşan, ikinci yüklem için tam tahsis yapısını kasıtlı olarak yeniden tesis eder. İki sonucu vardır: (1) her eylem (kulluk ve yardım dileme) KENDİ tahsis bildirimine sahiptir — birlikte paketlenmezler; (2) paralel yapı, biçimin içeriği yansıttığı belagat vurgusu (tarsī'/mürā'ātü'n-nazīr) oluşturur — ilişkinin iki bölümlü yapısı (hizmet verme / yardım alma) cümlenin iki bölümlü yapısıyla icra edilir. Her iki kullanım için wa-innā laka varyantı (şāzz) tüm ayeti sözdizimsel tahsisten tekrarlanan aidiyet itirafına dönüştürür — radikal biçimde farklı bir söz eylemi."}, {"id": 5, "arabic": "نَسْتَعِينُ", "translit": "nasta'īnu", "gloss": "we seek aid/enablement/support", "glossTr": "yardım dileriz/güçlenme ararız/destek isteriz", "userNotes": "", "root": "ع و ن ('-w-n)", "grammar": "Imperfect verb, Form X (istaf'ala), 1st person plural indicative (marfū'). Form X adds the semantics of \"seeking/requesting\" to the base root — ista'āna = to seek 'awn (aid). The imperfect signals ongoing, habitual seeking. Transitivity: bundle shows TRANSITIVE (with_object: 1) — only occurrence in Quran is this ayah, where the object is fronted (iyyāka). The verb's sole Quranic occurrence makes it a hapax in terms of form+person combination.", "grammarTr": "Muzari fiil, X. bab (istif'āl), 1. çoğul şahıs marfu. X. bab temel köke \"talep etme/arama\" anlamı ekler — ista'āna = 'avn (yardım) aramak. Muzari kip süregelen, alışılmış arama eylemini işaret eder. Geçişlilik: veri GEÇİŞLİ (nesneli: 1) gösterir — Kur'an'daki tek kullanım bu ayettir; nesne öne alınmıştır (iyyāka). Fiilin tek Kur'anî kullanımı onu biçim+şahıs kombinasyonu açısından hapax yapar.", "semantics": ["فَعَلَ (fa'ala, I): 'āna = to help, to aid, to assist, to succor. 'awn = help, assistance, aid (Lane's)", "فَاعَلَ (fā'ala, III): 'āwana = to cooperate with, to assist mutually, to collaborate — reciprocal aid", "تَفَاعَلَ (tafā'ala, VI): ta'āwana = to cooperate with one another, mutual aid, collective support — cooperative dynamic between multiple parties", "اِسْتَفْعَلَ (istaf'ala, X): ista'āna = to seek help, to request aid, to ask for assistance, to seek enablement from someone. The X form adds the dimension of seeking/requesting to the base meaning.", "Classical extended meanings (Lane's, Lisan al-Arab): 'awn = helper, assistant; 'awān = mature (of a cow — one that has calved once, i.e., experienced/seasoned); mu'āwana = cooperation, mutual assistance; isti'āna = seeking aid; ma'ūna = aid given, subsidy; 'awāniyya = vessels, utensils (that assist/serve in tasks)", "The root carries the concept of strengthening through external support — the one seeking 'awn acknowledges insufficient capacity on their own", "Modern: isti'āna extends to any form of seeking technical support, requesting resources, calling for backup — systemic aid-seeking in organizational or technological contexts", "Futuristic: any system that requests external resources, processing power, or authorization from a central authority to complete its tasks performs isti'āna — the concept maps onto client-server architectures, resource allocation requests, API calls", "Core concept: seeking enabling power from an external source, acknowledging that one's own capacity is insufficient for the task"], "semanticsTr": ["فَعَلَ (fe'ale, I. bab): 'āna = yardım etmek, destek olmak, iane etmek. 'avn = yardım, destek, iane (Lane's)", "فَاعَلَ (fā'ale, III. bab): 'āvene = karşılıklı yardımlaşmak, işbirliği yapmak — çift yönlü yardım", "تَفَاعَلَ (tefā'ule, VI. bab): te'āvene = birbirleriyle yardımlaşmak, kolektif destek — çok taraflı işbirliği dinamiği", "اِسْتَفْعَلَ (istif'āl, X. bab): ista'āna = yardım dilemek, destek talep etmek, birinden güçlenme aramak. X. bab temel anlama talep/arama boyutu ekler.", "Klasik genişletilmiş anlamlar (Lane's, Lisānü'l-Arab): 'avn = yardımcı; 'avān = olgun (inek için — bir kez doğurmuş, yani deneyimli/olgunlaşmış); mu'āvene = işbirliği, karşılıklı yardım; isti'āne = yardım dileme; ma'ūne = verilen yardım, sübvansiyon; 'avāniyye = kaplar, aletler (görevlerde yardımcı olan)", "Kök, dış destek yoluyla güçlenme kavramını taşır — 'avn arayan kendi kapasitesinin yetersizliğini kabul eder", "Modern: isti'āne her türlü teknik destek arama, kaynak talep etme, yedek çağırma biçimine uzanır — örgütsel veya teknolojik bağlamlarda sistemik yardım arama", "Gelecekçi: görevlerini tamamlamak için merkezi otoriteden dış kaynak, işlem gücü veya yetkilendirme talep eden herhangi bir sistem isti'āne yapar — kavram istemci-sunucu mimarilerine, kaynak tahsis taleplerine, API çağrılarına eşlenir", "Kök kavram: dış kaynaktan güçlenme arama, görev için kendi kapasitesinin yetersiz olduğunu kabul etme"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Form X imperfect (nasta'īnu) — seeking aid", "count": "~1 ayah", "examples": [{"ref": "1:5", "arabic": "— this verse —", "english": "The sole occurrence of Form X imperfect 1st person plural in the entire Quran — a hapax that makes this the defining instance of communal isti'āna", "turkish": "Kur'an'ın tamamındaki X. bab muzari 1. çoğul şahsın tek kullanımı — topluluksal isti'āne'nin tanımlayıcı örneğini oluşturan hapax"}]}, {"label": "B. Form I imperfect (verb): to help, to aid — active provision of aid", "count": "~5 ayahs", "examples": []}, {"label": "C. Noun forms: 'awn (helper), mu'āwana (assistance), ma'ūna (material aid)", "count": "~5 ayahs", "examples": []}]}, "qiraat": [{"arabic": "نِسْتَعِينُ", "translit": "nistaʿīnu", "status": "14", "type": "vw", "note": "Changes the prefix vowel from fatḥa to kasra (nistaʿīnu vs nastaʿīnu). This is a canonical variant within the fourteen readings. Dialectal variation in 1st person plural prefix — no semantic change, same verb form and meaning.", "noteTr": "Ön ek ünlüsünü fethadan kesreye değiştirir (nistaʿīnu / nastaʿīnu). On dört kıraat içinde kanonik bir varyanttır. 1. çoğul şahıs ön ekinde lehçe farkı — anlam değişikliği yok, aynı fiil biçimi ve anlam.", "source": "erquran.org"}, {"arabic": "نَسْتَعِينُۥ", "translit": "nastaʿīnū", "status": "Irreg", "type": "madd", "note": "Adds prolongation (madd) to the final vowel — nastaʿīnū with extended ū. A phonetic variant affecting recitation rhythm but not semantic content.", "noteTr": "Son ünlüye med (uzatma) ekler — nastaʿīnū uzun ū ile. Tilavet ritmini etkileyen ama anlamsal içeriği etkilemeyen fonetik varyant.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-b-d", "coRootAr": "ع ب د", "count": "21", "refs": "1:5;18:102;3:64;3:182;7:128;8:41;8:51;9:104;11:109;16:2", "note": "Aid-seeking ('-w-n) paired with worship/service ('-b-d) in 21 ayahs — the structural pairing that defines the two poles of the divine-human relationship: giving service and receiving enablement. Both roots in this ayah create the foundational articulation of this dynamic. <- IN THIS AYAH", "noteTr": "Yardım arama ('-w-n) ile kulluk/hizmet ('-b-d) 21 ayette eşleşir — ilahi-insani ilişkinin iki kutbunu tanımlayan yapısal eşleşme: hizmet verme ve güçlenme alma. Bu ayetteki her iki kök bu dinamiğin temel ifadesini oluşturur. <- BU AYETTE"}, {"coRoot": "r-q-d", "coRootAr": "ر ق د", "count": "1", "refs": "18:9", "note": "Sleep/rest (r-q-d) paired with aid ('-w-n) — singular co-occurrence in the Cave narrative context. Variant-sourced connection.", "noteTr": "Uyku/istirahat (r-q-d) ile yardım ('-w-n) eşleşmesi — Kehf anlatısı bağlamında tekil birlikte geçiş. Varyant kaynaklı bağlantı."}], "critical": "This is the ONLY occurrence of the Form X verb nasta'īnu in the entire Quran — a hapax. The choice of Form X (istaf'ala, seeking/requesting) rather than Form I ('āna, receiving aid) or Form III (mu'āwana, mutual cooperation) is grammatically significant: it foregrounds the ACT OF SEEKING over the receiving. The speakers do not say \"You help us\" (tu'īnunā) or \"we cooperate with You\" (nu'āwinuka) — they say \"we seek help FROM You\" (nasta'īnuka). This preserves the asymmetry: the addressee is the source, the speakers are the seekers. The Form X also implies a process: seeking is continuous (imperfect tense), not a one-time request. Classical lexicons note 'avān (experienced/mature cow) as a secondary meaning — the idea of seasoned capability gained through support. The root's rarity in the Quran (only 11 total occurrences across all forms) contrasts sharply with '-b-d (275 occurrences), creating a quantitative asymmetry that mirrors the qualitative one: worship-language pervades the Quran, but aid-seeking language is concentrated here in al-Fātiḥa.", "criticalTr": "Bu, Kur'an'ın tamamında X. bab fiil nasta'īnu'nun TEK kullanımıdır — hapax. I. bab ('āna, yardım alma) veya III. bab (mu'āvene, karşılıklı işbirliği) yerine X. babın (istif'āl, arama/talep etme) tercih edilmesi dilbilgisel olarak anlamlıdır: almayı değil ARAMA EYLEMİNİ öne çıkarır. Konuşanlar \"Sen bize yardım edersin\" (tu'īnunā) veya \"Seninle işbirliği yaparız\" (nu'āvinuka) demez — \"Senden yardım DİLERİZ\" (nasta'īnuka) derler. Bu asimetriyi korur: muhatap kaynak, konuşanlar arayanlardır. X. bab ayrıca bir süreç ima eder: arama süreğendir (muzari kip), tek seferlik talep değil. Klasik sözlükler 'avān'ı (deneyimli/olgun inek) ikincil anlam olarak kaydeder — destek yoluyla kazanılmış olgun kapasite fikri. Kökün Kur'an'daki nadirliği (tüm biçimlerde yalnızca 11 kullanım) '-b-d ile (275 kullanım) keskin tezat oluşturur ve niceliksel asimetri niteliksel olanı yansıtır: kulluk dili Kur'an'a yayılmıştır, ama yardım arama dili burada el-Fātiḥa'da yoğunlaşmıştır.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the text repeat the full iyyāka structure rather than attaching the second predicate with a simple suffix (wa nasta'īnuka)? Does the repetition create two separate speech acts, or one compound act with rhetorical emphasis?", "The Form X hapax nasta'īnu: why is the seeking form chosen over the receiving form? Does this signal that the relationship is defined by the act of asking rather than the act of receiving?", "The quantitative asymmetry between '-b-d (275 occurrences) and '-w-n (11 occurrences) — does the rarity of '-w-n concentrate its theological weight in al-Fātiḥa, making this ayah the locus of aid-seeking theology?", "If the wa between the two clauses is read as istiʾnāf rather than 'aṭf, does this create a temporal or logical sequence: first devotion, THEN (as a consequence or separate act) seeking aid?", "The yu'badu variant (14 canonical) removes the speakers entirely — from \"we worship You\" to \"He is worshipped.\" Does this variant preserve or dissolve the relational intimacy of the standard reading?", "The innā laka variant replaces exclusivity-through-syntax with confession-of-belonging. How does this shift the speech act from restriction (ḥaṣr) to assertion (iqrār)?", "Lane's Lexicon attests '-b-d as \"to tread/smooth a road\" (ta'bīd). Does this physical meaning survive in the spiritual concept of 'ibāda — devotion as path-clearing, as making the way navigable through labor?", "The '-b-d / '-w-n co-occurrence appears in 21 ayahs. What patterns emerge when worship-language and aid-language appear together — is aid always contingent on worship, or do they function independently?", "Could the entire ayah be read as a systems-level declaration: \"We dedicate our operational cycles exclusively to You, and we request enabling resources exclusively from You\" — mapping onto any agent-source relationship, not just human-divine?", "The 5 objectless uses of '-b-d (21:67, 21:98, 26:92, 37:161, 43:26): in those contexts, 'ibāda appears as an absolute state. Does 1:5 combine the directed (iyyāka) and absolute (na'budu) dimensions simultaneously?"], "questionsTr": ["Metin neden basit ek yerine (wa nasta'īnuka) tam iyyāka yapısını tekrarlar? Tekrar iki ayrı söz eylemi mi yoksa belagat vurgulu tek bir bileşik eylem mi oluşturur?", "X. bab hapax nasta'īnu: neden alma biçimi yerine arama biçimi tercih edilir? Bu, ilişkinin almak yerine istemek eylemiyle mi tanımlandığını işaret eder?", "'-b-d (275 kullanım) ile '-w-n (11 kullanım) arasındaki niceliksel asimetri — '-w-n'un nadirliği teolojik ağırlığını el-Fātiḥa'da yoğunlaştırıyor mu, bu ayeti yardım dileme teolojisinin merkezi yapıyor mu?", "İki cümle arasındaki va atıf yerine isti'nāf olarak okunursa, bu zamansal veya mantıksal bir sıralama mı oluşturur: önce adanma, SONRA (sonuç olarak veya ayrı eylem olarak) yardım dileme?", "yu'badu varyantı (14 kanonik) konuşanları tamamen kaldırır — \"biz kulluk ederiz\" yerine \"O'na kulluk edilir.\" Bu varyant standart okumanın ilişkisel yakınlığını korur mu yoksa çözer mi?", "innā laka varyantı sözdizimsel tahsisi aidiyet itirafıyla değiştirir. Bu, söz eylemini sınırlandırmadan (hasr) beyana (ikrār) nasıl kaydırır?", "Lane's Lexicon '-b-d'yi \"yolu ezmek/düzleştirmek\" (ta'bīd) olarak belgeler. Bu fiziksel anlam 'ibāde'nin manevi kavramında varlığını sürdürür mü — kulluk yol açma olarak, emekle geçiş yolunu açma olarak?", "'-b-d / '-w-n birlikte geçişi 21 ayette görülür. Kulluk dili ile yardım dili birlikte göründüğünde hangi kalıplar ortaya çıkar — yardım her zaman kullukla mı koşullanır, yoksa bağımsız mı işler?", "Ayetin tamamı sistem düzeyinde bir bildirim olarak okunabilir mi: \"İşlem döngülerimizi münhasıran Sana tahsis ederiz ve etkinleştirici kaynakları münhasıran Senden talep ederiz\" — sadece insan-ilahi değil, herhangi bir varlık-kaynak ilişkisine eşlenebilir mi?", "'-b-d'nin 5 nesnesiz kullanımı (21:67, 21:98, 26:92, 37:161, 43:26): bu bağlamlarda 'ibāde mutlak bir hal olarak görünür. 1:5 yönlendirilmiş (iyyāka) ve mutlak (na'budu) boyutları aynı anda birleştirir mi?"], "key": "1:5"}, {"surah": 1, "ayah": 6, "arabic": "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "transliteration": "ihdinā ṣ-ṣirāṭa l-mustaqīma", "readings": [{"text": "Guide us to the straight path — a plea for active orientation toward a course that is itself upright and self-maintaining", "textTr": "Bizi doğru yola ilet — kendisi dik ve sürdürülebilir olan bir rotaya yönelme talebi", "rationale": "The verb ihdī (اهْدِ) from h-d-y in its base form (CV imperative) takes a double accusative: the person guided (nā) and the destination (aṣ-ṣirāṭ). The definite article on ṣirāṭ implies a specific, known path. Mustaqīm (X active participle of q-w-m) describes the path as self-standing, intrinsically upright.", "rationaleTr": "Fiil ihdī (اهْدِ) h-d-y kökünden, çift meful alan bir yapıda: bizi (nā) ve hedefi (aṣ-ṣirāṭ). Sırat kelimesindeki belirlilik takısı bilinen, belirli bir yolu işaret eder. Müstakim (q-w-m kökünden X. bab ism-i fail) yolun kendi başına ayakta duran, özünde doğru olduğunu anlatır."}, {"text": "Show us the path that maintains itself upright — hidāya as revelation of what already exists, not creation of something new", "textTr": "Bize kendiliğinden dik duran yolu göster — hidayet, yeni bir şey yaratma değil, zaten var olanı açığa çıkarma", "rationale": "Here ihdī can mean \"show, reveal, make visible\" rather than \"lead by the hand.\" The path (ṣirāṭ) pre-exists; the request is for perception, not construction. Mustaqīm reinforces this: the path is already upright; the supplicant needs eyes to see it.", "rationaleTr": "Burada ihdī \"elle yönlendirmek\" değil \"göstermek, açığa çıkarmak, görünür kılmak\" anlamına gelebilir. Yol (sırat) zaten mevcuttur; talep inşa değil, idrak içindir. Müstakim bunu pekiştirir: yol zaten doğrudur; dua eden onu görecek gözlere ihtiyaç duyar."}, {"text": "Grant us the capacity to walk the self-correcting course — hidāya as internal capacity, not external direction", "textTr": "Bize kendi kendini düzelten rotada yürüme kapasitesini ver — hidayet dışsal yönlendirme değil, içsel kapasite", "rationale": "The imperative ihdī can denote \"grant the ability/capacity to find\" rather than \"point toward.\" In this reading, the supplicant already knows the path but lacks the internal compass (hidāya) to stay on it. Mustaqīm as Form X active participle suggests the path actively straightens — it self-corrects.", "rationaleTr": "Emir kipi ihdī \"yönü göstermek\" değil \"bulma yeteneğini vermek\" anlamını taşıyabilir. Bu okumada dua eden yolu zaten bilir ama onda kalacak içsel pusuladan (hidayet) yoksundur. Müstakim X. bab ism-i fail olarak yolun aktif olarak doğrulduğunu — kendi kendini düzelttiğini — ima eder."}, {"text": "Navigate us along the elevated highway — ṣirāṭ as a raised, engineered thoroughfare requiring a navigator", "textTr": "Bizi yükseltilmiş ana yol boyunca yönlendir — sırat, yönlendirici gerektiren yüksek, inşa edilmiş bir geçit", "rationale": "If ṣirāṭ retains its etymological connection to Latin strāta (paved road) or its classical Arabic sense of a wide, swallowing road (from s-r-ṭ, to swallow), the path is not a gentle trail but an engineered corridor — wide enough to swallow travelers. Hidāya then becomes navigation through this overwhelming passage. Mustaqīm marks it as vertically upright — a bridge or elevated causeway.", "rationaleTr": "Sırat, Latince strāta (döşenmiş yol) ile etimolojik bağını veya klasik Arapça geniş, yutan yol anlamını (s-r-ṭ, yutmak) korursa, yol nazik bir patika değil mühendislik ürünü bir koridordur — yolcuları yutacak kadar geniş. Hidayet bu bunaltıcı geçitten navigasyon olur. Müstakim dikey olarak dik olduğunu işaret eder — bir köprü veya yükseltilmiş geçit."}, {"text": "Align us with the data-stream that self-calibrates — a futuristic reading where hidāya is signal-alignment and ṣirāṭ is an information channel", "textTr": "Bizi kendi kendini kalibre eden veri akışıyla hizala — hidayetin sinyal hizalaması, sıratın bilgi kanalı olduğu fütüristik bir okuma", "rationale": "In a framework where guidance (hidāya) means alignment with a signal or frequency, and path (ṣirāṭ) means a channel or conduit, the verse becomes a request for tuning. Mustaqīm (self-standing, self-maintaining) describes a channel with error-correction — it maintains integrity autonomously. The prayer asks for alignment with a self-correcting information stream.", "rationaleTr": "Rehberliğin (hidayet) bir sinyal veya frekansla hizalanma, yolun (sırat) kanal veya iletken anlamına geldiği bir çerçevede, ayet bir ayarlama talebi olur. Müstakim (kendi kendine ayakta duran, sürdürülebilir) hata düzeltmeli bir kanalı tanımlar — bütünlüğünü otonom olarak korur. Dua, kendi kendini düzelten bir bilgi akışıyla hizalanma talep eder."}], "structure": {"beats": [{"label": "Supplication: the plea", "labelTr": "Dua: yakarış", "lines": [{"arabic": "ٱهْدِنَا", "translit": "ihdinā", "english": "Guide us", "turkish": "Bizi ilet"}]}, {"label": "Object: the destination", "labelTr": "Nesne: hedef", "lines": [{"arabic": "ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "translit": "aṣ-ṣirāṭa l-mustaqīma", "english": "the straight path", "turkish": "doğru yol"}]}], "summary": "The ayah is a single imperative clause with no subordination. The verb ihdinā takes a double accusative construction: first accusative is the enclitic pronoun -nā (us), second accusative is aṣ-ṣirāṭa (the path), modified by the adjective al-mustaqīma. The entire clause is a request directed upward (from created to Creator), structurally the simplest possible sentence — imperative verb + two objects. This minimal structure carries maximum theological weight: the most essential human request distilled to three words. The definite article on ṣirāṭ and mustaqīm particularizes the path — it is THE path, not A path.", "summaryTr": "Ayet, hiçbir alt cümle içermeyen tek bir emir cümlesidir. İhdinā fiili çift meful yapısı alır: birinci meful bitişik zamir -nā (bizi), ikinci meful aṣ-ṣirāṭa (yol), al-mustaqīma sıfatıyla nitelenmiş. Tüm cümle aşağıdan yukarıya (yaratılandan Yaratıcıya) yöneltilmiş bir taleptir, yapısal olarak mümkün olan en yalın cümle — emir fiil + iki nesne. Bu minimal yapı maksimum teolojik ağırlık taşır: en temel insani talep üç kelimeye damıtılmıştır. Sırat ve müstakim üzerindeki belirlilik takısı yolu özelleştirir — bir yol değil, O yoldur."}, "words": [{"id": 1, "arabic": "ٱهْدِنَا", "translit": "ihdinā", "gloss": "guide us, show us the way, grant us orientation", "glossTr": "bizi hidayet et, bize yolu göster, bize yön ver", "userNotes": "", "root": "ه د ي (h-d-y)", "grammar": "Imperative (CV) verb, 2nd person masculine singular, addressing God; with 1st person plural enclitic pronoun -nā (us) as first object; double accusative construction taking aṣ-ṣirāṭa as second object", "grammarTr": "Emir kipi fiil, 2. tekil eril şahıs, Allah'a hitap; 1. çoğul şahıs bitişik zamiri -nā (bizi) birinci meful olarak; çift meful yapısıyla aṣ-ṣirāṭa ikinci meful", "semantics": ["هَدَى (hadā, I): to guide, to lead aright, to show the way, to conduct along a path; also: to give a gift/present (hadiyya), to offer (a sacrificial animal); to be rightly directed", "اِهْتَدَى (ihtadā, VIII): to find the right way, to be guided, to follow guidance", "هُدًى (hudan, verbal noun): guidance, right direction, the Quran itself (2:2 — hudan li-l-muttaqīn)", "هَدْي (hady): sacrificial offering, gift brought to the sanctuary — the concrete, material sense of h-d-y: something led/driven to its destination", "Classical lexicon (Lane's): hadā also means \"to precede, go before\" (as a guide walks ahead); \"to lead (a bride to her husband)\"; \"to send a present\"; the root carries both abstract direction and concrete conveyance", "Modern extension: guidance as navigation, GPS-like orientation, algorithmic pathfinding — the root allows \"align us with the correct signal\"", "Futuristic: hidāya as calibration — aligning a receiver with a source frequency; the prayer as a request for signal-lock with truth", "Core concept: movement toward a correct destination — whether physical travel, moral orientation, gift-giving (conveying something to its rightful recipient), or perceptual alignment"], "semanticsTr": ["هَدَى (hedā, I. bab): yol göstermek, doğru yola iletmek, rehberlik etmek; ayrıca: hediye vermek, kurban sunmak; doğru yönlendirilmiş olmak", "اِهْتَدَى (ihtedā, VIII. bab): doğru yolu bulmak, hidayete ermek, rehberliğe uymak", "هُدًى (hüden, mastar): hidayet, doğru yön, Kur'an'ın kendisi (2:2 — hüden li'l-müttakīn)", "هَدْي (hedy): kurban, kutsal mekana götürülen hediye — h-d-y kökünün somut, maddi anlamı: hedefine ulaştırılan şey", "Klasik sözlükler (Lane's): hedā ayrıca \"önden gitmek\" (rehberin önden yürümesi), \"gelini kocasına götürmek\", \"hediye göndermek\" anlamları taşır; kök hem soyut yönlendirme hem somut taşıma içerir", "Modern genişleme: hidayet navigasyon olarak, GPS benzeri yönlendirme, algoritmik yol bulma — kök \"bizi doğru sinyalle hizala\" anlamına izin verir", "Fütüristik: hidayet kalibrasyon olarak — alıcıyı kaynak frekansıyla hizalama; dua hakikatle sinyal kilidi talebi", "Kök kavram: doğru hedefe yönelik hareket — ister fiziksel yolculuk, ister ahlaki yönelim, ister hediye verme (bir şeyi hak sahibine ulaştırma), ister algısal hizalanma"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Imperative guidance — direct request for guidance (CV form)", "count": "~1 ayah", "examples": []}, {"label": "B. God guides (IV form, yuhdī/yahdī) — divine subject, active guidance", "count": "~109 ayahs", "examples": [{"ref": "2:142", "arabic": "۞ سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا ۚ قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ ۚ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "The foolish among the people will say: What turned them away from their qiblah which they used to face? Say: To God belongs the east and the west; He guides (yahdī) whom He wills to a straight path", "turkish": "İnsanlardan beyinsizler diyecekler: Onları yöneldikleri kıbleden çeviren nedir? De ki: Doğu da batı da Allah'ındır; dilediğini doğru yola iletir (yehdī)"}, {"ref": "2:213", "arabic": "كَانَ ٱلنَّاسُ أُمَّةًۭ وَٰحِدَةًۭ فَبَعَثَ ٱللَّهُ ٱلنَّبِيِّۦنَ مُبَشِّرِينَ وَمُنذِرِينَ وَأَنزَلَ مَعَهُمُ ٱلْكِتَٰبَ بِٱلْحَقِّ لِيَحْكُمَ بَيْنَ ٱلنَّاسِ فِيمَا ٱخْتَلَفُوا۟ فِيهِ ۚ وَمَا ٱخْتَلَفَ فِيهِ إِلَّا ٱلَّذِينَ أُوتُوهُ مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَٰتُ بَغْيًۢا بَيْنَهُمْ ۖ فَهَدَى ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ لِمَا ٱخْتَلَفُوا۟ فِيهِ مِنَ ٱلْحَقِّ بِإِذْنِهِۦ ۗ وَٱللَّهُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍ", "english": "Mankind was one community, then God sent prophets as bringers of good tidings and warners, and sent down with them the Book in truth to judge between people in what they differed. Then God guided (hadā) those who believed to the truth of what they differed in, by His permission. God guides (yahdī) whom He wills to a straight path", "turkish": "İnsanlar tek bir ümmetti; Allah peygamberleri müjdeleyici ve uyarıcı olarak gönderdi, onlarla birlikte hak ile Kitabı indirdi ki ihtilaf ettikleri konuda insanlar arasında hükmetsin. Allah iman edenleri, ihtilaf ettikleri hakka Kendi izniyle iletti (hedā). Allah dilediğini doğru yola iletir (yehdī)"}, {"ref": "3:101", "arabic": "وَكَيْفَ تَكْفُرُونَ وَأَنتُمْ تُتْلَىٰ عَلَيْكُمْ ءَايَٰتُ ٱللَّهِ وَفِيكُمْ رَسُولُهُۥ ۗ وَمَن يَعْتَصِم بِٱللَّهِ فَقَدْ هُدِىَ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "How can you deny while God's signs are recited to you and His messenger is among you? Whoever holds fast to God has been guided (hudiya, passive) to a straight path", "turkish": "Nasıl inkar edersiniz ki size Allah'ın ayetleri okunuyor ve aranızda Resulü var? Kim Allah'a sarılırsa doğru yola iletilmiştir (hüdiye, edilgen)"}]}, {"label": "C. Guidance as verbal noun (hudan) — abstract concept", "count": "~92 ayahs", "examples": [{"ref": "17:9", "arabic": "إِنَّ هَٰذَا ٱلْقُرْءَانَ يَهْدِى لِلَّتِى هِىَ أَقْوَمُ وَيُبَشِّرُ ٱلْمُؤْمِنِينَ ٱلَّذِينَ يَعْمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ أَجْرًۭا كَبِيرًۭا", "english": "This Quran guides (yahdī) to that which is most upright (aqwam) and gives good tidings to the believers who do righteous deeds that they will have a great reward", "turkish": "Bu Kur'an en doğru olana (akvem) iletir (yehdī) ve salih amel işleyen müminlere büyük bir mükafat olduğunu müjdeler"}]}, {"label": "D. Guided ones / those who found the path (active participle, muhtadī)", "count": "~30 ayahs", "examples": [{"ref": "17:97", "arabic": "وَمَن يَهْدِ ٱللَّهُ فَهُوَ ٱلْمُهْتَدِ ۖ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُمْ أَوْلِيَآءَ مِن دُونِهِۦ", "english": "Whoever God guides — he is the rightly-guided (al-muhtadī). And whoever He sends astray — you will never find for them protectors besides Him", "turkish": "Allah kimi hidayete erdirirse o, doğru yolu bulmuştur (el-mühtedī). Kimi de saptırırsa, onlara O'ndan başka dostlar bulamazsın"}]}]}, "qiraat": [{"arabic": "أَرْشِدْنَا", "translit": "arshidnā", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution: arshidnā (from r-sh-d) replaces ihdinā (from h-d-y). R-sh-d emphasizes rational discernment and maturity (rushd = right judgment), whereas h-d-y emphasizes directional guidance. The variant narrows the semantic field from broad guidance to intellectual/moral rectitude.", "noteTr": "Sözlüksel değişim: arshidnā (r-sh-d kökünden) ihdinā (h-d-y kökünden) yerine geçer. R-sh-d akılcı ayırt etme ve olgunluğu (rüşd = doğru hüküm) vurgularken, h-d-y yönsel rehberliği vurgular. Varyant anlam alanını geniş rehberlikten entelektüel/ahlaki doğruluğa daraltır.", "source": "erquran.org"}, {"arabic": "بَصِّرْنَا", "translit": "baṣṣirnā", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution: baṣṣirnā (from b-ṣ-r, Form II intensive — \"make us see clearly\") replaces ihdinā. This shifts guidance from directional orientation to visual perception — the request becomes \"grant us insight/vision\" rather than \"lead us.\" Emphasizes inner sight (baṣīra) over external direction.", "noteTr": "Sözlüksel değişim: baṣṣirnā (b-ṣ-r kökünden, II. bab yoğunlaştırma — \"bize açıkça gördür\") ihdinā yerine geçer. Bu, rehberliği yönsel yönlendirmeden görsel algıya kaydırır — talep \"bizi ilet\" yerine \"bize basiret/görüş ver\" olur. Dış yönlendirme yerine iç görüşü (basîre) vurgular.", "source": "erquran.org"}, {"arabic": "تُرْشِدُ سَبِيلَ الْمُسْتَقيمِ", "translit": "turshidu sabīla l-mustaqīmi", "status": "shii", "type": "Stx|Lx", "note": "Complete syntactic restructuring: imperative ihdinā becomes indicative turshidu (you guide/direct), ṣirāṭ becomes sabīl (a different word for path), and the speaker-addressee relationship reverses — instead of \"guide us\" (plea), it becomes \"you direct the straight path\" (declarative statement about the addressee's role). The shift from ṣirāṭ to sabīl is significant: sabīl (from s-b-l) implies a traveled, worn path, while ṣirāṭ implies a wide, engineered road.", "noteTr": "Tam sözdizimsel yeniden yapılanma: emir ihdinā bildirme kipi turshidu (sen yönlendirirsin) olur, sırat sebîl (yol için farklı kelime) olur ve konuşan-muhatap ilişkisi tersine döner — \"bizi ilet\" (yakarış) yerine \"sen doğru yolu yönlendirirsin\" (muhatabın rolü hakkında bildirim cümlesi). Sırattan sebîle geçiş önemlidir: sebîl (s-b-l kökünden) yürünmüş, aşınmış bir yolu ima ederken, sırat geniş, inşa edilmiş bir yolu ima eder.", "source": "erquran.org"}, {"arabic": "أَرْشِدْنَا سَبِيلَ الْمُسْتَقيمِ", "translit": "arshidnā sabīla l-mustaqīmi", "status": "shawādhdh", "type": "Lx|Stx", "note": "Double substitution: verb changes from h-d-y to r-sh-d (rational guidance) AND noun changes from ṣirāṭ to sabīl (worn path). Combines the semantic shifts of both previous variants: rational discernment along a traveled road rather than divine guidance along an engineered highway.", "noteTr": "Çifte değişim: fiil h-d-y'den r-sh-d'ye (akılcı rehberlik) VE isim sırat'tan sebîl'e (yürünmüş yol) değişir. Önceki iki varyantın anlamsal kaymalarını birleştirir: inşa edilmiş bir otoyolda ilahi rehberlik yerine, yürünmüş bir yolda akılcı ayırt etme.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "q-w-m", "coRootAr": "ق و م", "count": "65", "refs": "1:6;17:9;17:97;2:142;2:213;2:258;2:264;3:86;3:101;4:46", "note": "The root of guidance (h-d-y) and the root of standing/uprightness (q-w-m) co-occur 65 times — the most frequent pairing for h-d-y. Guidance consistently leads TO uprightness. In 17:9 the Quran \"guides to that which is aqwam (most upright)\" — the superlative of q-w-m. IN THIS AYAH: ihdinā (guide us) targets al-mustaqīm (the upright one, from q-w-m).", "noteTr": "Hidayet kökü (h-d-y) ile ayakta durma/doğruluk kökü (q-w-m) 65 kez birlikte geçer — h-d-y için en sık eşleşme. Hidayet tutarlı olarak doğruluğa GÖTÜRÜR. 17:9'da Kur'an \"en doğru olana (akvem) iletir\" — q-w-m'nin üstünlük derecesi. BU AYETTE: ihdinā (bizi ilet) al-müstakīm'i (doğru olan, q-w-m'den) hedefler."}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "20", "refs": "1:6;2:142;2:213;3:101;4:68;4:175;5:16;6:87;6:161;10:25", "note": "Guidance (h-d-y) and path (s-r-t) co-occur 20 times, forming a fixed Quranic phrase pattern: \"guide to/along the ṣirāṭ.\" The pairing is nearly formulaic, suggesting ṣirāṭ is the privileged object of hidāya. IN THIS AYAH: ihdinā aṣ-ṣirāṭa — the foundational instance of this pairing.", "noteTr": "Hidayet (h-d-y) ve yol (s-r-t) 20 kez birlikte geçer ve sabit bir Kur'anî kalıp oluşturur: \"sırata ilet/yönlendir.\" Eşleşme neredeyse kalıplaşmıştır, bu da sıratın hidayetin ayrıcalıklı nesnesi olduğunu düşündürür. BU AYETTE: ihdinā aṣ-ṣirāṭa — bu eşleşmenin kurucu örneği."}], "critical": "The verb ihdinā is the ONLY occurrence of h-d-y in CV (base imperative) form in the entire Quran (count: 1). Every other instance uses Form IV (yuhdī, yahdī — causative \"He guides\") or Form VIII (ihtadā — reflexive \"he found guidance\") or verbal nouns. This unique form — the raw, unaugmented imperative — strips guidance to its most elemental: not \"cause us to be guided\" (IV) but simply \"guide us\" (I). The direct, unmediated plea. The rarity of this form (hapax in CV) makes this the most intimate address to God in the entire Quran regarding guidance. The qira'at variants (arshidnā from r-sh-d, baṣṣirnā from b-ṣ-r) reveal the semantic space the standard reading occupies: h-d-y sits between rational discernment (r-sh-d) and perceptual insight (b-ṣ-r), encompassing both. The Shia variant turshidu reverses the speech act entirely — from supplication to declaration.", "criticalTr": "İhdinā fiili, tüm Kur'an'da h-d-y kökünün CV (temel emir) kalıbındaki TEK kullanımıdır (sayı: 1). Diğer tüm örnekler IV. bab (yuhdī, yahdī — ettirgen \"O iletir\"), VIII. bab (ihtedā — dönüşlü \"yolu buldu\") veya mastarlar kullanır. Bu benzersiz kalıp — ham, artırılmamış emir — hidayeti en temel haline indirger: \"bizi hidayete erdir\" (IV) değil, sadece \"bizi ilet\" (I). Doğrudan, aracısız yakarış. Bu kalıbın nadirliği (CV'de hapax) bunu, hidayet konusunda Kur'an'daki en mahrem Allah'a hitap yapar. Kıraat varyantları (r-sh-d'den arshidnā, b-ṣ-r'den baṣṣirnā) standart okumanın kapladığı anlamsal alanı ortaya koyar: h-d-y akılcı ayırt etme (r-sh-d) ile algısal basiret (b-ṣ-r) arasında durur, ikisini de kapsar. Şii varyantı turshidu söz edimini tamamen tersine çevirir — yakarıştan bildirime.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 2, "arabic": "ٱلصِّرَٰطَ", "translit": "aṣ-ṣirāṭa", "gloss": "the path, the road, the way", "glossTr": "yol, cadde, geçit", "userNotes": "", "root": "ص ر ط (s-r-t)", "grammar": "Accusative definite noun (second object of ihdinā); the definite article al- indicates a specific, known path — not any path but THE path", "grammarTr": "Mansub belirli isim (ihdinā'nın ikinci mefulu); belirlilik takısı el- belirli, bilinen bir yolu işaret eder — herhangi bir yol değil, O yol", "semantics": ["صَرَطَ (saraṭa, I): to swallow, to gulp down — the primary classical meaning (Lane's Lexicon, Lisan al-Arab); a road \"swallows\" the traveler", "صِرَاط (ṣirāṭ): road, path, way — the wide road that accommodates travelers; possibly cognate with Latin strāta (paved road) via Aramaic/Syriac", "Classical lexicons distinguish ṣirāṭ from sabīl: ṣirāṭ implies a clear, wide, engineered road; sabīl implies a worn path made by travelers. The Quran uses both but reserves ṣirāṭ for THE definitive path, while sabīl appears for various paths (subul, plural)", "The swallowing metaphor: a ṣirāṭ does not merely carry the traveler — it engulfs them. Once on it, one is inside it, consumed by the journey", "Modern: highway, expressway, arterial route — engineered infrastructure for mass transit; also: data pipeline, information channel", "Futuristic: any structured conduit for transmission — fiber optic cable, neural pathway, quantum channel; the ṣirāṭ as bandwidth", "Core concept: a wide, clear, engulfing passage — something that swallows the one who enters it, carrying them to their destination"], "semanticsTr": ["صَرَطَ (serata, I. bab): yutmak, bir yudumda içmek — asıl klasik anlam (Lane's Lexicon, Lisanü'l-Arab); bir yol yolcuyu \"yutar\"", "صِرَاط (sırât): yol, cadde, geçit — yolcuları barındıran geniş yol; muhtemelen Aramice/Süryanice aracılığıyla Latince strāta (döşenmiş yol) ile akraba", "Klasik sözlükler sırat ile sebîli ayırır: sırat açık, geniş, inşa edilmiş bir yolu; sebîl yolcuların açtığı aşınmış bir patikayı ima eder. Kur'an ikisini de kullanır ama sıratı KESİN yol için saklar, sebîl çeşitli yollar (sübül, çoğul) için geçer", "Yutma metaforu: sırat yolcuyu sadece taşımaz — onu kuşatır. Üzerine girildiğinde kişi onun içindedir, yolculuğa yutulmuştur", "Modern: otoyol, ekspres yol, ana arter — kitlesel ulaşım için mühendislik altyapısı; ayrıca: veri hattı, bilgi kanalı", "Fütüristik: iletim için yapılandırılmış herhangi bir kanal — fiber optik kablo, sinir yolu, kuantum kanalı; sırat bant genişliği olarak", "Kök kavram: geniş, açık, kuşatıcı bir geçit — içine girenin yutulduğu, hedefine taşındığı bir şey"], "occurrences": {"type": "grouped", "groups": [{"label": "A. The definite straight path (aṣ-ṣirāṭ al-mustaqīm) — the most common collocation", "count": "~22 ayahs", "examples": [{"ref": "2:142", "arabic": "۞ سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا ۚ قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ ۚ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "The foolish will say: What turned them from their qiblah? Say: To God belong east and west; He guides whom He wills to a straight path (ṣirāṭin mustaqīmin)", "turkish": "Beyinsizler diyecekler: Onları kıblelerinden çeviren ne? De ki: Doğu da batı da Allah'ındır; dilediğini doğru yola (sırâtin müstakîmin) iletir"}, {"ref": "6:153", "arabic": "وَأَنَّ هَٰذَا صِرَٰطِى مُسْتَقِيمًۭا فَٱتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا۟ ٱلسُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِۦ", "english": "And this is My path (ṣirāṭī), straight — so follow it, and do not follow the [other] ways (as-subul), for they will separate you from His way (sabīlihī)", "turkish": "Ve bu Benim yolumdur (sırâtî), dosdoğru — ona uyun; başka yollara (es-sübül) uymayın, yoksa sizi O'nun yolundan (sebîlihî) ayırır"}, {"ref": "19:36", "arabic": "وَإِنَّ ٱللَّهَ رَبِّى وَرَبُّكُمْ فَٱعْبُدُوهُ ۚ هَٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ", "english": "God is my Lord and your Lord, so worship Him — this is a straight path (ṣirāṭun mustaqīmun)", "turkish": "Allah benim Rabbim ve sizin Rabbinizdir, O'na kulluk edin — bu doğru yoldur (sırâtun müstakîmun)"}]}, {"label": "B. Path attributed to God (ṣirāṭ Allāh) — possessive construction", "count": "~3 ayahs", "examples": [{"ref": "42:53", "arabic": "صِرَٰطِ ٱللَّهِ ٱلَّذِى لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ أَلَآ إِلَى ٱللَّهِ تَصِيرُ ٱلْأُمُورُ", "english": "The path of God (ṣirāṭ Allāh), to whom belongs what is in the heavens and what is in the earth. Unquestionably, to God all matters return", "turkish": "Allah'ın yolu (sırâtu'llâh) — göklerde ve yerde ne varsa O'nundur. Şüphesiz işler Allah'a döner"}]}, {"label": "C. Path as physical road (sitting on the ṣirāṭ, blocking it)", "count": "~2 ayahs", "examples": [{"ref": "7:86", "arabic": "وَلَا تَقْعُدُوا۟ بِكُلِّ صِرَٰطٍۢ تُوعِدُونَ وَتَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ بِهِۦ وَتَبْغُونَهَا عِوَجًۭا", "english": "And do not sit on every path (ṣirāṭ), threatening and blocking from the way of God (sabīl Allāh) those who believe in Him, seeking to make it crooked", "turkish": "Her yolun (sırât) üzerine oturup tehdit ederek iman edenleri Allah'ın yolundan (sebîli'llâh) alıkoymayın ve onu eğriltmeye çalışmayın"}]}]}, "qiraat": [{"arabic": "السِّرَاطَ", "translit": "as-sirāṭa", "status": "7", "type": "ibdāl", "note": "Canonical variant: the ص (ṣ) is replaced by س (s) — pure sibilant without emphasis. This is a dialectal phonetic variant (ibdāl) among the seven readings. The meaning is identical but the phonetic texture shifts: ṣirāṭ carries emphatic weight (the tongue presses the palate), while sirāṭ is lighter. Some scholars see the emphatic ṣād as reinforcing the gravitas of THE path.", "noteTr": "Kanonik varyant: ص (ṣ) harfi س (s) ile değiştirilir — vurgu olmadan saf sızıcı. Bu, yedi kıraat arasında lehçesel bir ses değişimidir (ibdâl). Anlam aynıdır ama ses dokusu değişir: sırât vurgulu ağırlık taşır (dil damağa basar), sirât ise daha hafiftir. Bazı alimler vurgulu sâd'ın O YOLUN ağırlığını pekiştirdiğini görür.", "source": "erquran.org"}, {"arabic": "الصؗرَاطَ", "translit": "aṣᶻ-ṣᶻirāṭa", "status": "7", "type": "ibdāl", "note": "Canonical variant: the ṣ is pronounced with an ishāmm (slight blending) of z-sound — between ṣād and zāy. A third phonetic realization of the same word, attested in the seven readings. Demonstrates the phonetic plasticity of ṣirāṭ across canonical transmission.", "noteTr": "Kanonik varyant: ṣ harfi z sesinin hafif karışımıyla (işmâm) telaffuz edilir — sâd ile zây arasında. Aynı kelimenin üçüncü fonetik gerçekleşmesi, yedi kıraatte kayıtlıdır. Kanonik aktarım boyunca sırâtın fonetik esnekliğini gösterir.", "source": "erquran.org"}, {"arabic": "صِرَاطًا مُسْتَقِيمًا", "translit": "ṣirāṭan mustaqīman", "status": "14", "type": "al|Tnw", "note": "Removes the definite article and changes case to indefinite accusative (tanwīn). THE straight path becomes A straight path — shifting from a unique, specific path to one among possible straight paths. This is theologically significant: the definite version implies one exclusive path; the indefinite allows multiple valid paths, all of which are straight.", "noteTr": "Belirlilik takısını kaldırır ve hali belirsiz mansuba (tenvîn) çevirir. O DOĞRU YOL, bir doğru yol olur — benzersiz, belirli bir yoldan olası doğru yollardan birine geçiş. Bu teolojik açıdan önemlidir: belirli versiyon tek münhasır bir yolu ima eder; belirsiz olan, hepsi doğru olan birden fazla geçerli yola izin verir.", "source": "erquran.org"}, {"arabic": "الزِّرَاطَ", "translit": "az-zirāṭa", "status": "Irreg", "type": "ibdāl", "note": "Irregular phonetic variant: ṣ becomes z — full voicing of the sibilant. Not canonical but historically attested. Completes the phonetic spectrum: ṣ (emphatic voiceless) → ṣᶻ (emphatic with z-coloring) → s (plain voiceless) → z (plain voiced).", "noteTr": "Düzensiz fonetik varyant: ṣ, z olur — sızıcının tam seslendirilmesi. Kanonik değil ama tarihsel olarak kayıtlıdır. Fonetik spektrumu tamamlar: ṣ (vurgulu tonsuz) → ṣᶻ (z-renkli vurgulu) → s (düz tonsuz) → z (düz tonlu).", "source": "erquran.org"}, {"arabic": "صِرَاطَ", "translit": "ṣirāṭa", "status": "shawādhdh", "type": "al", "note": "Drops the definite article entirely, keeping definite accusative without al-. This is rare and anomalous — it would make ṣirāṭ syntactically indefinite yet contextually definite (known from context). A more intimate, stripped-down reference to the path.", "noteTr": "Belirlilik takısını tamamen düşürür, el- olmadan belirli mansub kalır. Bu nadir ve anomaldir — sırâtı sözdizimsel olarak belirsiz ama bağlamsal olarak belirli yapar (bağlamdan bilinen). Yola daha mahrem, yalınlaştırılmış bir gönderme.", "source": "erquran.org"}, {"arabic": "الصِّرَاطَ صِرَاطَكَ", "translit": "aṣ-ṣirāṭa ṣirāṭaka", "status": "shii", "type": "±", "note": "Shia addition: \"the path, YOUR path\" — adds a possessive suffix -ka (your) creating an appositive. This makes the identity of the path explicit: it is God's own path. The standard text leaves this implicit (al-ṣirāṭ — which path? answered in 1:7). The Shia variant answers immediately: it is YOUR path. This collapses the suspense between 1:6 and 1:7.", "noteTr": "Şii eklemesi: \"yol, SENİN yolun\" — iyelik eki -ke (senin) ekleyerek bir açıklayıcı oluşturur. Bu, yolun kimliğini açık kılar: Allah'ın kendi yoludur. Standart metin bunu örtük bırakır (es-sırât — hangi yol? 1:7'de cevaplanır). Şii varyantı hemen cevaplar: SENİN yolundur. Bu, 1:6 ile 1:7 arasındaki gerilimi çözer.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "q-w-m", "coRootAr": "ق و م", "count": "33", "refs": "1:6;19:36;2:142;2:213;3:51;3:101;4:68;4:175;5:16;6:39", "note": "Path (s-r-t) and uprightness (q-w-m) co-occur 33 times — the phrase \"ṣirāṭ mustaqīm\" is the Quran's most characteristic collocation for moral-spiritual direction. The path and its quality are inseparable. IN THIS AYAH: aṣ-ṣirāṭa al-mustaqīma.", "noteTr": "Yol (s-r-t) ve doğruluk (q-w-m) 33 kez birlikte geçer — \"sırât-ı müstakîm\" ifadesi Kur'an'ın ahlaki-manevi yön için en karakteristik kalıbıdır. Yol ve niteliği ayrılmazdır. BU AYETTE: aṣ-ṣirāṭa'l-müstakîme."}, {"coRoot": "h-d-y", "coRootAr": "ه د ي", "count": "20", "refs": "1:6;2:142;2:213;3:101;4:68;4:175;5:16;6:87;6:161;10:25", "note": "Path (s-r-t) and guidance (h-d-y) — the ṣirāṭ is consistently the TARGET of hidāya, not its source. One is guided TO the path, not BY the path. IN THIS AYAH: ihdinā aṣ-ṣirāṭa.", "noteTr": "Yol (s-r-t) ve hidayet (h-d-y) — sırat tutarlı olarak hidayetin HEDEFİdir, kaynağı değil. Kişi yola iletilir, yol tarafından iletilmez. BU AYETTE: ihdinā aṣ-ṣirāṭa."}, {"coRoot": "s-w-y", "coRootAr": "س و ي", "count": "5", "refs": "1:7;16:76;19:43;38:22;67:22", "note": "Path (s-r-t) and equality/evenness (s-w-y) — in 19:43, Ibrahim says ahdika ṣirāṭan sawiyyan (\"I will guide you to a level path\"), using s-w-y as an alternative descriptor to mustaqīm. Sawiyy emphasizes horizontal levelness while mustaqīm emphasizes vertical uprightness.", "noteTr": "Yol (s-r-t) ve eşitlik/düzlük (s-w-y) — 19:43'te İbrahim ehdike sırâten seviyyen (\"seni düz bir yola iletirim\") der, müstakîm yerine s-w-y'yi alternatif niteleyici olarak kullanır. Seviyy yatay düzlüğü vurgularken müstakîm dikey doğruluğu vurgular."}], "critical": "The word ṣirāṭ has four phonetic realizations within the canonical seven readings alone (ṣ, s, ṣᶻ, plus the irregular z), making it one of the most phonetically variable words in the Quran. This variability clusters around the initial consonant — the ROOT meaning is stable but its phonetic clothing shifts across dialects. The definite article is theologically loaded: the Fourteen Readings variant (ṣirāṭan mustaqīman, indefinite) opens the possibility that there are MULTIPLE straight paths, not one. The Shia addition of ṣirāṭaka (\"your path\") and the standard text's continuation in 1:7 (ṣirāṭa lladhīna — \"path of those whom...\") show competing strategies for identifying WHOSE path: God's (Shia), or the righteous community's (standard, via 1:7). The root s-r-ṭ meaning \"to swallow\" is absent from Quranic verbal usage — the Quran uses only the noun ṣirāṭ, never the verb saraṭa. This fossilized metaphor (a road that swallows) may be invisible to most readers but remains etymologically active.", "criticalTr": "Sırat kelimesi yalnızca kanonik yedi kıraat içinde dört fonetik gerçekleşmeye sahiptir (ṣ, s, ṣᶻ, artı düzensiz z), bu onu Kur'an'ın fonetik açıdan en değişken kelimelerinden biri yapar. Bu değişkenlik baş ünsüz etrafında kümelenir — KÖK anlam sabittir ama fonetik giysisi lehçeler arasında değişir. Belirlilik takısı teolojik açıdan yüklüdür: On Dört Kıraat varyantı (sırâten müstakîmen, belirsiz) BİRDEN FAZLA doğru yol olma olasılığını açar, tek değil. Şii sırâteke (\"senin yolun\") eklemesi ve standart metnin 1:7'deki devamı (sırâte'llezîne — \"...olanların yolu\") KİMİN yolu olduğunu belirleme konusunda rakip stratejiler gösterir: Allah'ın (Şii) mı, yoksa doğru topluluğun (standart, 1:7 aracılığıyla) mu. S-r-ṭ kökünün \"yutmak\" anlamı Kur'an'ın fiil kullanımında yoktur — Kur'an yalnızca isim sırât'ı kullanır, asla serata fiilini değil. Bu fosilleşmiş metafor (yutan bir yol) çoğu okuyucu için görünmez olabilir ama etimolojik olarak aktif kalır.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "ٱلْمُسْتَقِيمَ", "translit": "al-mustaqīma", "gloss": "the straight, the upright, the self-maintaining, the one that stands on its own", "glossTr": "doğru, dik, kendi kendine ayakta duran, kendiliğinden sürdürülebilir olan", "userNotes": "", "root": "ق و م (q-w-m)", "grammar": "Form X (istaf'ala) active participle, accusative definite, functioning as adjective modifying aṣ-ṣirāṭa; Form X adds the meaning of \"seeking to be\" or \"finding oneself to be\" — so mustaqīm means not just \"straight\" but \"seeking/maintaining its own straightness\"", "grammarTr": "X. bab (istef'ale) ism-i fail, belirli mansub, aṣ-ṣirāṭa'yı niteleyen sıfat; X. bab \"olmaya çalışmak\" veya \"kendini öyle bulmak\" anlamı katar — yani müstakîm sadece \"doğru\" değil \"kendi doğruluğunu arayan/sürdüren\" demektir", "semantics": ["قَامَ (qāma, I): to stand, to rise, to stand up; to be erect, upright; to endure, to last; to manage, to undertake; to perform (prayer — aqāma ṣ-ṣalāt); to have value (qīma)", "أَقَامَ (aqāma, IV): to erect, to establish, to set up; to perform, to observe (rituals); to maintain; to appoint; to reside", "قَوْم (qawm): a people, a community, a nation — those who stand together; men of a tribe (originally: those who stand/rise for battle)", "قِيَامَة (qiyāma): resurrection — the standing up, the great rising; yawm al-qiyāma = the Day of Standing", "مَقَام (maqām): station, place of standing; rank, position; shrine; a melodic mode in music (maqām system)", "اِسْتَقَامَ (istaqāma, X): to be or become straight, upright; to be correct, right, proper; to stand firm; to persevere on a course — the reflexive-estimative X form means \"to find straightness in oneself\" or \"to seek to stand\"", "قِوَام / قَوَام (qiwām): sustenance, livelihood, means of support; the backbone of something; that which enables something to stand", "Classical (Lane's): qāma also means \"to have a certain price\" (how much does it stand at?); qīma = value, worth; qayyim = self-subsisting, maintaining others; qayyūm = the eternally self-standing (divine attribute)", "Modern: to uphold (rights), to establish (institutions), to run (a program), to stand for (an idea); istiqāma = integrity, rectitude; also: self-correcting system, homeostasis", "Futuristic: self-maintaining code, self-correcting algorithm, autonomous system that preserves its own integrity; mustaqīm as a path with built-in error correction", "Core concept: vertical stability and self-maintenance — standing upright against gravity, and by extension: being correct, enduring, having value, forming a community (those who stand together)"], "semanticsTr": ["قَامَ (kāme, I. bab): ayağa kalkmak, dikilmek; dik olmak; dayanmak, sürmek; yönetmek, üstlenmek; namaz kılmak (ekāme's-salât); değer taşımak (kıyme)", "أَقَامَ (ekāme, IV. bab): dikmek, kurmak, tesis etmek; ifa etmek, yerine getirmek (ibadetler); sürdürmek; atamak; ikamet etmek", "قَوْم (kavm): bir halk, topluluk, millet — birlikte ayakta duranlar; bir kabilenin erkekleri (aslında: savaş için ayağa kalkanlar)", "قِيَامَة (kıyâme): diriliş — ayağa kalkış, büyük kalkış; yevmü'l-kıyâme = Kalkış Günü", "مَقَام (makām): durak, durma yeri; rütbe, konum; makam; müzikte melodik makam sistemi", "اِسْتَقَامَ (istikāme, X. bab): düz veya dik olmak/olmaya başlamak; doğru, düzgün olmak; kararlı durmak; bir rotada sebat etmek — dönüşlü-değerlendirici X. bab \"kendi içinde doğruluk bulmak\" veya \"ayakta durmaya çalışmak\" anlamına gelir", "قِوَام / قَوَام (kıvâm): geçim, rızık, destek aracı; bir şeyin belkemiği; bir şeyin ayakta durmasını sağlayan", "Klasik (Lane's): kāme ayrıca \"belirli bir fiyatı olmak\" (ne kadara duruyor?) anlamına gelir; kıyme = değer; kayyim = kendi kendine varlığını sürdüren; kayyûm = ebedi olarak kendi kendine ayakta duran (ilahi sıfat)", "Modern: hakları savunmak, kurumları kurmak, program yürütmek, bir fikri temsil etmek; istikâmet = dürüstlük, doğruluk; ayrıca: kendi kendini düzelten sistem, homeostaz", "Fütüristik: kendi kendini sürdüren kod, kendi kendini düzelten algoritma, kendi bütünlüğünü koruyan otonom sistem; müstakîm yerleşik hata düzeltmeli bir yol olarak", "Kök kavram: dikey stabilite ve kendi kendini sürdürme — yerçekimine karşı dik durma ve uzantı olarak: doğru olmak, dayanmak, değer taşımak, topluluk oluşturmak (birlikte ayakta duranlar)"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle (mustaqīm) as adjective describing path/religion", "count": "~63 ayahs", "examples": [{"ref": "6:39", "arabic": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا صُمٌّۭ وَبُكْمٌۭ فِى ٱلظُّلُمَٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "Those who deny Our signs are deaf and mute, in darknesses. Whomever God wills He sends astray, and whomever He wills He places upon a straight path (ṣirāṭin mustaqīmin)", "turkish": "Ayetlerimizi yalanlayanlar sağır ve dilsizdir, karanlıklar içindedir. Allah dilediğini saptırır, dilediğini doğru yol (sırâtin müstakîmin) üzerine koyar"}, {"ref": "16:76", "arabic": "وَضَرَبَ ٱللَّهُ مَثَلًۭا رَّجُلَيْنِ أَحَدُهُمَآ أَبْكَمُ لَا يَقْدِرُ عَلَىٰ شَىْءٍۢ وَهُوَ كَلٌّ عَلَىٰ مَوْلَىٰهُ أَيْنَمَا يُوَجِّههُّ لَا يَأْتِ بِخَيْرٍ ۖ هَلْ يَسْتَوِى هُوَ وَمَن يَأْمُرُ بِٱلْعَدْلِ ۙ وَهُوَ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "God sets forth a parable: two men — one mute, powerless, a burden on his master, wherever he directs him he brings no good. Is he equal to one who commands justice and is upon a straight path (ṣirāṭin mustaqīmin)?", "turkish": "Allah bir misal verdi: iki adam — biri dilsiz, hiçbir şeye gücü yetmez, efendisine yüktür, nereye yönlendirse hayır getirmez. O, adaleti emreden ve doğru yol (sırâtin müstakîmin) üzerinde olanla eşit midir?"}, {"ref": "19:36", "arabic": "وَإِنَّ ٱللَّهَ رَبِّى وَرَبُّكُمْ فَٱعْبُدُوهُ ۚ هَٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ", "english": "God is my Lord and your Lord, so worship Him — this is a straight path (ṣirāṭun mustaqīmun)", "turkish": "Allah benim Rabbim ve sizin Rabbinizdir, O'na kulluk edin — bu doğru yoldur (sırâtun müstakîmun)"}]}, {"label": "B. Community/people (qawm) — those who stand together", "count": "~383 ayahs", "examples": [{"ref": "18:86", "arabic": "حَتَّىٰٓ إِذَا بَلَغَ مَغْرِبَ ٱلشَّمْسِ وَجَدَهَا تَغْرُبُ فِى عَيْنٍ حَمِئَةٍۢ وَوَجَدَ عِندَهَا قَوْمًۭا", "english": "Until, when he reached the setting of the sun, he found it setting in a murky spring, and he found near it a people (qawman)", "turkish": "Nihayet güneşin battığı yere vardığında onu kara bir pınarın içinde batarken buldu ve yanında bir kavim (kavmen) buldu"}]}, {"label": "C. Superlative (aqwam) — most upright", "count": "~4 ayahs", "examples": [{"ref": "17:9", "arabic": "إِنَّ هَٰذَا ٱلْقُرْءَانَ يَهْدِى لِلَّتِى هِىَ أَقْوَمُ", "english": "This Quran guides to that which is most upright (aqwam)", "turkish": "Bu Kur'an en doğru olana (akvem) iletir"}]}]}, "qiraat": [{"arabic": "صِرَاطًا مُسْتَقِيمًا", "translit": "ṣirāṭan mustaqīman", "status": "14", "type": "al|Tnw", "note": "This variant affects mustaqīm by removing its definite article and making it indefinite with tanwīn. Instead of THE upright (specific, unique), it becomes AN upright one — one instance of the quality rather than the absolute. This shifts the theological weight: al-mustaqīm implies the path has a fixed, knowable identity; mustaqīman suggests the quality of uprightness is what matters, not the path's unique identity.", "noteTr": "Bu varyant müstakîm'i belirlilik takısını kaldırıp tenvînle belirsiz yaparak etkiler. O doğru (belirli, benzersiz) yerine bir doğru olur — mutlak olan yerine niteliğin bir örneği. Bu teolojik ağırlığı kaydırır: el-müstakîm yolun sabit, bilinebilir bir kimliği olduğunu ima eder; müstakîmen doğruluk niteliğinin önemli olduğunu, yolun benzersiz kimliğinin değil.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "h-d-y", "coRootAr": "ه د ي", "count": "65", "refs": "1:6;17:9;17:97;2:142;2:213;2:258;2:264;3:86;3:101;4:46", "note": "Uprightness (q-w-m) and guidance (h-d-y) — the most frequent pairing for q-w-m. The pattern: guidance LEADS TO uprightness, or uprightness RESULTS FROM guidance. In 17:9 the superlative aqwam is the destination of Quranic guidance. IN THIS AYAH: ihdinā (h-d-y) targets al-mustaqīma (q-w-m).", "noteTr": "Doğruluk (q-w-m) ve hidayet (h-d-y) — q-w-m için en sık eşleşme. Kalıp: hidayet doğruluğa GÖTÜRÜR veya doğruluk hidayetten KAYNAKLANIR. 17:9'da üstünlük derecesi akvem Kur'anî hidayetin hedefidir. BU AYETTE: ihdinā (h-d-y) el-müstakîme'yi (q-w-m) hedefler."}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "33", "refs": "1:6;19:36;2:142;2:213;3:51;3:101;4:68;4:175;5:16;6:39", "note": "Uprightness (q-w-m) and path (s-r-t) — the ṣirāṭ mustaqīm collocation appears in virtually every occurrence. The quality of mustaqīm appears inseparable from the noun ṣirāṭ in Quranic usage — they form a fixed phrase. IN THIS AYAH: aṣ-ṣirāṭa al-mustaqīma.", "noteTr": "Doğruluk (q-w-m) ve yol (s-r-t) — sırât müstakîm birlikteliği neredeyse her geçişte görülür. Müstakîm niteliği Kur'anî kullanımda sırât isminden ayrılmaz görünür — sabit bir kalıp oluştururlar. BU AYETTE: aṣ-ṣirāṭa'l-müstakîme."}, {"coRoot": "w-z-n", "coRootAr": "و ز ن", "count": "10", "refs": "7:85;11:84;11:85;17:35;18:105;18:105;21:47;26:182;55:9;57:25", "note": "Uprightness (q-w-m) and weighing/balance (w-z-n) — the co-occurrence connects standing upright with just measurement. In 55:9 wa-aqīmū l-wazna bi-l-qisṭ (\"establish the weighing with justice\"), uprightness IS the act of fair measurement. In 7:85 and 11:84-85 (Shu'ayb narrative), the command to establish just weights connects community integrity (qawm) with correct measurement. The semantic bridge: uprightness as calibration.", "noteTr": "Doğruluk (q-w-m) ve tartı/denge (w-z-n) — birlikte geçiş dik durmayı adil ölçümle bağlar. 55:9'da ve ekîmü'l-vezne bi'l-kıstı (\"tartıyı adaletle doğru tutun\"), doğruluk adil ölçümün ta kendisidir. 7:85 ve 11:84-85'te (Şuayb kıssası) adil tartı emri topluluk bütünlüğünü (kavm) doğru ölçümle bağlar. Anlamsal köprü: doğruluk kalibrasyon olarak."}], "critical": "The choice of Form X (istaf'ala) for mustaqīm is grammatically significant. Form X typically means \"to seek, request, or find in oneself\" the quality of the base root. So istaqāma means \"to seek straightness in oneself\" or \"to find oneself standing upright\" — it is REFLEXIVE and ACTIVE. The path does not merely happen to be straight — it actively maintains its own straightness. This is not a passive quality but an ongoing, self-sustaining process. Compare with the simpler adjective qā'im (standing) or qawīm (upright) — neither carries the self-seeking, self-maintaining force of mustaqīm. The co-occurrence with w-z-n (weighing/balance) across 10 ayahs reveals an unexpected dimension: uprightness as CALIBRATION. A system is mustaqīm when it self-calibrates, self-corrects, maintains its own balance. This connects to the futuristic reading of error-correcting channels and self-maintaining algorithms. The path is not just straight — it KEEPS ITSELF straight.", "criticalTr": "Müstakîm için X. bab (istef'ale) seçimi dilbilgisel açıdan önemlidir. X. bab tipik olarak temel kökün niteliğini \"aramak, talep etmek veya kendi içinde bulmak\" anlamına gelir. İstikāme \"kendi içinde doğruluk aramak\" veya \"kendini dik ayakta bulmak\" demektir — DÖNÜŞLÜ ve AKTİFTİR. Yol sadece düz değildir — aktif olarak kendi doğruluğunu sürdürür. Bu pasif bir nitelik değil, devam eden, kendi kendini sürdüren bir süreçtir. Daha basit sıfat kā'im (ayakta duran) veya kavîm (doğru) ile karşılaştırın — hiçbiri müstakîm'in kendi kendini arayan, sürdüren gücünü taşımaz. W-z-n (tartı/denge) ile 10 ayette birlikte geçiş beklenmedik bir boyut ortaya koyar: doğruluk KALİBRASYON olarak. Bir sistem kendi kendini kalibre ettiğinde, düzelttiğinde, dengesini koruduğunda müstakîmdir. Bu, hata düzelten kanalların ve kendi kendini sürdüren algoritmaların fütüristik okumasıyla bağlanır. Yol sadece düz değildir — KENDİNİ düz TUTAR.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran use the CV (base) imperative ihdinā for this single occurrence, when all other guidance verbs use Form IV or VIII? Does the stripped-down form carry theological intimacy — the most direct, unmediated plea?", "The definite article on aṣ-ṣirāṭ implies a unique, known path. But the Fourteen Readings variant removes it (ṣirāṭan mustaqīman — \"a straight path\"). Does this open the possibility of multiple valid straight paths, or is the indefinite merely stylistic?", "The root s-r-ṭ means \"to swallow\" — the Quran never uses this verb, only the noun ṣirāṭ. Is the swallowing metaphor dormant or active? Does a ṣirāṭ engulf the traveler, or has the metaphor fully lexicalized into just \"road\"?", "Form X mustaqīm implies self-maintaining straightness — the path corrects itself. How does this differ from a path that is simply straight (qawīm)? Does the X form suggest the path is a dynamic process, not a static line?", "The Shia variant adds ṣirāṭaka (\"your path\"), collapsing the suspense between 1:6 and 1:7. The standard text delays identification until 1:7 (path of those whom You have blessed). Does this delay serve a rhetorical purpose — making the supplicant ask and then receive the specification?", "The four phonetic realizations of ṣirāṭ (ṣ, s, ṣᶻ, z) span the full emphatic-to-plain spectrum. Is this phonetic variability meaningful, or merely dialectal? Could the emphatic ṣād be iconically representing the gravitas of the path?", "The co-occurrence of q-w-m with w-z-n (weighing/balance) across 10 ayahs suggests uprightness-as-calibration. Does mustaqīm describe a path that is self-calibrating — maintaining accuracy through continuous adjustment rather than through fixed positioning?", "If ihdinā is read as \"grant us the capacity to perceive\" (paralleling the baṣṣirnā variant), then the path already exists and the problem is human blindness. If read as \"lead us by the hand,\" the path requires active divine intervention. Which reading does the double accusative construction favor?", "The word hidāya encompasses gift-giving (hadiyya), sacrificial offering (hady), and moral guidance. When the supplicant says ihdinā, are all three senses active — \"give us the gift of the path, offer us to the path, guide us along the path\"?", "In a futuristic reading where ṣirāṭ is an information channel and mustaqīm is error-correction, the verse becomes a prayer for signal-alignment. Does the Quran's insistence on this phrase (45 occurrences of ṣirāṭ) suggest it encodes a concept broader than \"road\" — a conduit, a frequency, a channel?"], "questionsTr": ["Kur'an neden bu tek kullanım için CV (temel) emir ihdinā'yı kullanır da, diğer tüm hidayet fiilleri IV. veya VIII. bab kullanır? Yalınlaştırılmış kalıp teolojik mahremiyet mi taşır — en doğrudan, aracısız yakarış mı?", "Aṣ-ṣirāṭ üzerindeki belirlilik takısı benzersiz, bilinen bir yolu ima eder. Ama On Dört Kıraat varyantı bunu kaldırır (sırâten müstakîmen — \"bir doğru yol\"). Bu birden fazla geçerli doğru yol olasılığını açar mı, yoksa belirsizlik yalnızca üslupsal mıdır?", "S-r-ṭ kökü \"yutmak\" anlamına gelir — Kur'an bu fiili hiç kullanmaz, yalnızca isim sırât'ı kullanır. Yutma metaforu uykuda mı yoksa aktif mi? Sırat yolcuyu yutar mı, yoksa metafor tamamen sözlükselleşerek sadece \"yol\" mu olmuştur?", "X. bab müstakîm kendi kendini sürdüren doğruluğu ima eder — yol kendini düzeltir. Bu, sadece düz olan bir yoldan (kavîm) nasıl ayrılır? X. bab yolun statik bir çizgi değil, dinamik bir süreç olduğunu mu söyler?", "Şii varyantı sırâteke (\"senin yolun\") ekleyerek 1:6 ile 1:7 arasındaki gerilimi çözer. Standart metin tanımlamayı 1:7'ye (nimet verdiklerinin yolu) erteler. Bu erteleme retorik bir amaca mı hizmet eder — dua edenin sormasını ve sonra belirlemeyi almasını sağlamak?", "Sırâtın dört fonetik gerçekleşmesi (ṣ, s, ṣᶻ, z) tam vurgulu-düz spektrumu kapsar. Bu fonetik değişkenlik anlamlı mı, yoksa yalnızca lehçesel mi? Vurgulu sâd yolun ağırlığını ikonik olarak temsil ediyor olabilir mi?", "Q-w-m'nin w-z-n (tartı/denge) ile 10 ayette birlikte geçişi doğruluğu-kalibrasyon-olarak düşündürür. Müstakîm, sabit konumlanma yerine sürekli ayarlama yoluyla doğruluğu koruyan, kendi kendini kalibre eden bir yolu mu tanımlar?", "İhdinā \"algılama kapasitesini ver\" (baṣṣirnā varyantına paralel) olarak okunursa, yol zaten vardır ve sorun insani körlüktür. \"Elimden tutup götür\" olarak okunursa, yol aktif ilahi müdahale gerektirir. Çift meful yapısı hangi okumayı destekler?", "Hidâye kelimesi hediye verme (hediyye), kurban sunma (hedy) ve ahlaki rehberliği kapsar. Dua eden ihdinā dediğinde üç anlam da aktif midir — \"bize yolun hediyesini ver, bizi yola sun, bizi yol boyunca ilet\"?", "Sırâtın bilgi kanalı, müstakîm'in hata düzeltme olduğu fütüristik bir okumada, ayet sinyal hizalaması duası olur. Kur'an'ın bu ifadeye ısrarı (45 sırât geçişi) \"yol\"dan daha geniş bir kavramı — bir kanal, frekans, iletken — kodladığını mı düşündürür?"], "key": "1:6"}, {"surah": 1, "ayah": 7, "arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ", "transliteration": "ṣirāṭa lladhīna anʿamta ʿalayhim ghayri l-maghḍūbi ʿalayhim wa-lā ḍ-ḍāllīna", "readings": [{"text": "The path of those You have bestowed favor upon, not those who have incurred wrath upon themselves, nor those who have lost their way -- where ghayri functions as an adjective (badal) qualifying alladhīna, and al-maghḍūbi is a passive participle with an unspecified agent of wrath.", "textTr": "Kendilerine nimet verdiklerinin yolu; gazaba ugrayanlarinkini degil ve sapkinlarinkini da degil -- burada ghayri, alladhina'yi niteleyen bir sifat (bedel) islevi gorur, al-maghdubu ise fail belirtilmemis bir ism-i meful'dur.", "rationale": "ghayri as badal (substitutive apposition) from alladhina: the path is defined by exclusion -- first positively (those favored) then negatively (not those under wrath, not those astray). The passive al-maghdubi leaves the agent of wrath deliberately unspecified.", "rationaleTr": "ghayri, alladhina'dan bedel olarak gelir: yol once olumlu tanimlanir (nimet verilenler), sonra olumsuzla sinirlandirilir (gazaba ugrayanlar degil, sapkinlar degil). al-maghdubu'daki meçhul yapi, gazabin failini kasitli olarak belirsiz birakir."}, {"text": "The path of those upon whom You have bestowed grace -- other than [the path of] those upon whom anger has settled, and not [the path of] those who wander aimlessly -- reading ghayri as a genitive adjective modifying alladhina, with wrath as an enduring state (ism al-mafʿul indicating permanence).", "textTr": "Lutfunu bahsettigin kimselerin yolu -- uzerlerine gazap yerlesmis olanlarin [yolunun] disinda ve amacsizca dolasanlarin [yolunun] disinda -- ghayri, alladhina'yi niteleyen mecrur sifat olarak okunur, gazap kalici bir hal olarak (ism-i meful kalicilik ifade eder).", "rationale": "al-maghdubi as an established state (not a one-time event) -- the passive participle indicates an ongoing condition of being subject to wrath. The lost (al-dallin) are not merely mistaken but persistently off-course. Two distinct categories of deviation: passive reception of wrath vs active wandering.", "rationaleTr": "al-maghdubu yerlesmis bir durumu ifade eder (tek seferlik bir olay degil) -- ism-i meful devam eden bir gazaba maruz kalma halini gosterir. Sapkinlar (al-dallin) yalnizca yanilmis degil, israrla yoldan cikmistir. Iki ayri sapma kategorisi: gazabin pasif olarak alinmasi ile aktif bir sekilde sapmak."}, {"text": "The path of those whom You have endowed with well-being -- excluding those burdened with displeasure upon them, and not those who have gone astray -- reading anʿamta as intransitive (bestowed well-being without explicit object), and ghayri as genitive of exclusion.", "textTr": "Esenlik bahsettigin kimselerin yolu -- uzerlerinde hosnutsuzluk yukunu tasiyanlari disarda tutarak ve sapmislari da degil -- anʿamta nesnesiz (gecissiz) okunur, ghayri ise istisnai mecrur olarak alinir.", "rationale": "The verb anʿama appears without explicit object in this ayah (transitivity: MIXED, without_object_ayahs include 1:7). This allows reading: \"You bestowed [favor/well-being]\" where the nature of the favor is deliberately unspecified -- maximizing what the divine bestowal encompasses.", "rationaleTr": "anʿama fiili bu ayette acik bir nesne olmaksizin gelir (gecislilik: KARISIK, nesnesiz ayetler arasinda 1:7 vardir). Bu okuma imkani tanir: \"Sen [nimet/esenlik] bahsettin\" -- nimetin mahiyeti kasitli olarak belirsiz birakilir, ilahi ihsanin kapsami azami kilmak icin."}, {"text": "The road of those You have given ease to -- apart from those upon whom fury has descended, nor those who drift -- reading sirat as sabila (path/road, from the canonical variant s-r-t to s-b-l), emphasizing the traversable, physical dimension of the path, and al-dallin as those who drift without direction.", "textTr": "Kolaylastirdigin kimselerin yolu -- gazabin inenleri bir yana ve suruklenenleri de bir yana -- sirat'i sabila olarak okur (kanonik varyant s-r-t'den s-b-l'ye), yolun fiziksel, yurunebilir boyutunu vurgular, al-dallin ise yonsuz suruklenenleri ifade eder.", "rationale": "The canonical qira'at variant sirata/sabiila (reading with sin instead of sad, or the shawadhdh full lexical replacement) shifts the root from s-r-t (narrow defined road) to s-b-l (traversable way, course of travel). This widens the semantic field from a specific corridor to a general journey or life-course.", "rationaleTr": "Kanonik kirat varyanti sirata/sabiila (sad yerine sin ile okuma veya sawazz tam sozcuksel degisim) koku s-r-t'den (dar, tanimli yol) s-b-l'ye (yurunebilir yol, seyahat guzergahi) kaydirmaktadir. Bu, anlam alanini belirli bir koridordan genel bir yolculuga veya yasam guzergahina genisletir."}, {"text": "The trajectory of those You have graced -- distinct from those under systemic displeasure upon themselves, nor those in recursive deviation -- reading the entire ayah as a structural taxonomy of three human conditions: guided (anʿamta ʿalayhim), systemically opposed (al-maghdubi ʿalayhim), and recursively lost (al-dallin, with the doubled lam of d-l-l signifying iterative, compounding loss).", "textTr": "Lutfettigin kimselerin yonelisi -- sistematik hosnutsuzluk altindakilerin disinda, tekrarlayan sapmadakilerin de disinda -- tum ayeti uc insan durumunun yapisal siniflandirmasi olarak okur: hidayet edilmis (anʿamta ʿalayhim), sistematik olarak karsi konum (al-maghdubu ʿalayhim), tekrarlayici sapkinlik (al-dallin, d-l-l kokundeki seddeli lam, yinelenen ve birikimli bir kaybi isaret eder).", "rationale": "The ayah establishes a tripartite taxonomy: (1) those actively receiving divine favor, (2) those in a state of having wrath settled upon them (passive, externally imposed), (3) those in a state of going astray (active, self-generated). The doubled root d-l-l (with shadda on lam) phonetically enacts the recursiveness of straying -- the sound loops back on itself. This taxonomy can apply across all eras: from spiritual states to epistemic conditions (knowledge vs ignorance vs misinformation).", "rationaleTr": "Ayet uclu bir siniflandirma kurar: (1) ilahi nimeti aktif olarak alanlar, (2) uzerlerine gazap yerlesmis durumda olanlar (pasif, disaridan dayatilmis), (3) sapma halinde olanlar (aktif, kendi urettikleri). d-l-l kokundeki seddeli lam, sapmanin tekrarlayiciligini sessel olarak canlandirir -- ses kendi uzerine dolanir. Bu siniflandirma tum caglar icin gecerlidir: ruhani hallerden epistemik durumlara (bilgi-cehalet-dezenformasyon)."}], "structure": {"beats": [{"label": "Positive definition of the path", "labelTr": "Yolun olumlu tanimi", "lines": [{"arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ", "translit": "ṣirāṭa lladhīna anʿamta ʿalayhim", "english": "The path of those You have bestowed favor upon", "turkish": "Kendilerine nimet verdiklerinin yolu"}]}, {"label": "Negative exclusion: wrath", "labelTr": "Olumsuz dislanma: gazap", "lines": [{"arabic": "غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ", "translit": "ghayri l-maghḍūbi ʿalayhim", "english": "Not those upon whom wrath has settled", "turkish": "Gazaba ugrayanlarin degil"}]}, {"label": "Negative exclusion: straying", "labelTr": "Olumsuz dislanma: sapma", "lines": [{"arabic": "وَلَا ٱلضَّآلِّينَ", "translit": "wa-lā ḍ-ḍāllīna", "english": "Nor those who go astray", "turkish": "Ve sapkinlarin da degil"}]}], "summary": "The ayah is a single extended noun phrase in apposition to sirata l-mustaqima (1:6), structured as: positive identification + double negative exclusion. The path is first defined by WHO walks it (those favored), then delimited by WHO does not walk it (those under wrath + those astray). The double negation (ghayri... wa-la) creates a semantic corridor: the correct path is bounded on both sides by two distinct modes of failure. Syntactically, ghayri is in the genitive (matching alladhina's implied case), while wa-la coordinates the second exclusion. The passive voice in al-maghdubi (agent unspecified) contrasts sharply with the active participle al-dallin -- wrath is received, straying is enacted.", "summaryTr": "Ayet, sirata l-mustaqima'ya (1:6) atf-i beyan olan tek bir uzun isim cümlesidir ve su sekilde yapilanir: olumlu tanimlama + cift olumsuz dislanma. Yol once KIM'in yurudugu ile tanimlanir (nimet verilenler), sonra KIM'in yurumedigi ile sinirlandirilir (gazap altindakiler + sapkinlar). Cift olumsuzlama (ghayri... wa-la) anlamsal bir koridor olusturur: dogru yol, iki farkli basarisizlik bicimi tarafindan iki yandan sinirlandirilmistir. Sozdizimsel olarak ghayri mecrurdur (alladhina'nin zimni i'rabina uygun), wa-la ise ikinci dislanmayi baglar. al-maghdubu'daki mechul yapi (fail belirtilmemis) ile al-dallin'deki ism-i fail arasinda keskin bir karsilasma vardir -- gazap alinir, sapma yapilir."}, "words": [{"id": 1, "arabic": "صِرَٰطَ", "translit": "ṣirāṭa", "gloss": "path, road, way, trajectory", "glossTr": "yol, tarik, guzergah", "userNotes": "", "root": "ص ر ط (s-r-t)", "grammar": "Accusative noun in apposition (badal) to sirata l-mustaqima in 1:6. Definite by the following relative clause (idafa-like construction with alladhina).", "grammarTr": "Mansub isim, 1:6'daki sirata l-mustaqima'ya bedel. Sonraki sila cumlesi ile belirli kilinmistir (alladhina ile izafe benzeri yapi).", "semantics": ["Concrete: a road, path, way -- originally from the root meaning \"to swallow\" (as a road swallows travelers); Lane's Lexicon: a road that swallows those who travel upon it", "Extended: a course of conduct, a way of life, a trajectory of action -- any defined direction or methodology", "Modern: a system, a protocol, a structured approach -- any directed framework (technological, epistemic, procedural)", "Futuristic: an algorithm, a computational path, a decision tree -- any traversable sequence from input to outcome", "Classical lexicons (Lane's, Lisan al-Arab): s-r-t is cognate with s-r-d (to pierce through), emphasizing a path that cuts clearly through terrain; also attested as \"the bridge over Hell\" in eschatological usage; related to sarata meaning \"to swallow\" -- the path consumes the walker", "Core concept: a defined, traversable way that leads from origin to destination -- encompassing physical roads, moral trajectories, and any structured course of progression"], "semanticsTr": ["Somut: yol, tarik -- asil anlami \"yutmak\"tan gelir (yol yolcuyu yutar); Lane's Lexicon: uzerinde yuruyenleri yutan yol", "Genisletilmis: bir davranis yolu, yasam tarzi, hareket guzergahi -- herhangi bir tanimli yon veya yontem", "Modern: bir sistem, bir protokol, yapilandirilmis bir yaklasim -- yonlendirilmis herhangi bir cerceve (teknolojik, epistemik, prosedural)", "Geleceksel: bir algoritma, hesaplamali bir yol, bir karar agaci -- girdiden sonuca ulasan herhangi bir izlenebilir dizi", "Klasik sozlukler (Lane's, Lisan al-Arab): s-r-t, s-r-d (delmek, icinden gecmek) ile akrabadir, araziden net bir sekilde gecen yolu vurgular; eskatolojik kullanimda \"Cehennem uzerindeki kopru\" olarak da kanitlanmistir; sarata \"yutmak\" ile iliskilidir -- yol yuruyeni tuketir", "Kok kavram: baslangictan hedefe goturebilen tanimli, yurunebilir yol -- fiziksel yollardan ahlaki guzergahlara ve herhangi bir yapilandirilmis ilerleme rotasina kadar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. As object of hidaya (guidance toward the path) -- \"guide us to the sirat\"", "count": "~8 ayahs", "examples": [{"ref": "42:53", "arabic": "صِرَٰطِ ٱللَّهِ ٱلَّذِى لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ أَلَآ إِلَى ٱللَّهِ تَصِيرُ ٱلْأُمُورُ", "english": "The path of God, to whom belongs what is in the heavens and what is on earth -- indeed to God all matters return", "turkish": "Allah'in yolu, goklerde ve yerde ne varsa O'nundur -- isler sonunda Allah'a doner"}, {"ref": "7:86", "arabic": "وَلَا تَقْعُدُوا۟ بِكُلِّ صِرَٰطٍۢ تُوعِدُونَ وَتَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ بِهِۦ وَتَبْغُونَهَا عِوَجًۭا", "english": "And do not sit on every path, threatening and turning away from the path of God those who believe in Him, seeking crookedness in it", "turkish": "Ve her yol basinda oturup tehdit etmeyin, Allah'in yolundan iman edenleri cevirmeyin ve onda egrilik aramayin"}]}, {"label": "B. Described as mustaqim (straight) or sawiyy (level) -- the sirat qualified", "count": "~22 ayahs", "examples": [{"ref": "5:16", "arabic": "يَهْدِى بِهِ ٱللَّهُ مَنِ ٱتَّبَعَ رِضْوَٰنَهُۥ سُبُلَ ٱلسَّلَٰمِ وَيُخْرِجُهُم مِّنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِ بِإِذْنِهِۦ وَيَهْدِيهِمْ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "God guides by it those who follow His good pleasure to the ways of peace, and brings them out from darknesses into light by His permission, and guides them to a straight path", "turkish": "Allah onunla rizasina uyanlari selametin yollarina iletir, onlari karanliklardan nura cikarmak icin izniyle ve onlari dosdogru bir yola iletir"}, {"ref": "20:135", "arabic": "قُلْ كُلٌّۭ مُّتَرَبِّصٌۭ فَتَرَبَّصُوا۟ ۖ فَسَتَعْلَمُونَ مَنْ أَصْحَٰبُ ٱلصِّرَٰطِ ٱلسَّوِىِّ وَمَنِ ٱهْتَدَىٰ", "english": "Say: each is waiting, so wait -- you will know who are the companions of the level path and who is guided", "turkish": "De ki: herkes bekliyor, bekleyin -- dosdogru yolun sahiplerinin kim oldugunu ve kimin hidayet buldugunun yakinda bileceksiniz"}]}, {"label": "C. In apposition (this ayah's usage) -- the sirat defined by who walks it", "count": "~2 ayahs", "examples": [{"ref": "6:153", "arabic": "وَأَنَّ هَٰذَا صِرَٰطِى مُسْتَقِيمًۭا فَٱتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا۟ ٱلسُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِۦ", "english": "And this is My path, straight -- so follow it, and do not follow [other] ways lest they scatter you from His way", "turkish": "Ve bu Benim yolumdur, dosdogru -- ona uyun ve [baska] yollara uymayin ki sizi O'nun yolundan dagitmasinlar"}]}]}, "qiraat": [{"arabic": "سِرَاطَ", "translit": "sirāṭa", "status": "7", "type": "ibdal", "note": "Canonical variant with sin replacing sad -- shifts phonetically but preserves meaning; some grammarians see s-r-t and s-b-l as related semantic fields (road/path)", "noteTr": "Sad yerine sin ile kanonik varyant -- sessel olarak kaydirir ama anlamini korur; bazi dilciler s-r-t ve s-b-l'yi iliskili anlam alanlari olarak gorur (yo
