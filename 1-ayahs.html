Root spans exclusion (ghayri), alteration (ghayyara), and jealousy (ghayra) — boundary-marking is emotionally charged"}], "tag": "CRITICAL"}, {"id": 6, "arabic": "الْمَغْضُوبِ", "translit": "al-maghḍūbi", "gloss": "the ones upon whom anger has fallen, the wrath-received", "root": "غ ض ب (gh-d-b)", "grammar": "Passive participle (mafʿūl), genitive, definite — agent of anger left unnamed (divine passive); grammatically dependent on ʿalayhim following", "semantics": ["[7C] Lane's: ghaḍiba = to be angry, wrathful; ghaḍab = anger, wrath, indignation — vehement displeasure", "[7C] Form I ghaḍiba ʿalā: to be angry with/at — the preposition ʿalā marks the target of anger", "[7C] Passive participle maghḍūb: one upon whom anger has descended — agent deliberately unnamed (divine passive)", "[7C] Lisan al-Arab: ghaḍab contrasts with riḍā (satisfaction/pleasure) — ghaḍab is the absence of divine approval", "Hans Wehr: anger, wrath, fury, rage; ghaḍbān = angry; ghaḍūb = irascible", "[7C] Classical: ghaḍab also in animals — a bull's rage, a camel's fury — visceral, physical anger not just emotional", "[M] Modern: to be flagged, marked for penalty, sanctioned — systemic displeasure rather than personal emotion", "Core concept: vehement displeasure that descends upon its object — passive reception of an external force"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Passive participle: al-maghḍūb (the wrath-received)", "count": "~1 ayah", "examples": [{"ref": "1:7", "arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ", "english": "— this verse — Only Quranic occurrence of maghḍūb as passive participle; the agent of anger is grammatically absent"}]}, {"label": "B. Gerund: ghaḍab (anger/wrath as noun)", "count": "~16 ayahs", "examples": [{"ref": "2:61", "arabic": "وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ", "english": "And humiliation and poverty were stamped upon them, and they earned anger (ghaḍab) from God"}]}, {"label": "C. Perfect verb: ghaḍiba (to be angry)", "count": "~4 ayahs", "examples": [{"ref": "5:60", "arabic": "مَن لَّعَنَهُ ٱللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ ٱلْقِرَدَةَ وَٱلْخَنَازِيرَ", "english": "The one whom God cursed and was angry with (ghaḍiba ʿalayhi) and made from them apes and swine"}]}]}, "qiraat": [{"arabic": "الْمَغْطُوبِ", "translit": "al-maghṭūbi", "status": "None", "type": "ibdāl", "note": "Variant with ṭāʾ replacing ḍād — phonetic assimilation; same semantic range, dialectal pronunciation difference", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "2", "refs": "1:7;5:60", "note": "Wrath (gh-d-b) co-occurs with going astray — 5:60 links divine anger with apes/swine transformation and straying"}, {"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "4", "refs": "1:7;2:61;3:112", "note": "Wrath paired with exclusion/otherness — in 2:61 and 3:112, those under wrath acted bi-ghayri l-haqq (without right)"}], "critical": [{"cat": "GRAM", "pattern": "passive participle: agent unnamed", "kernel": "Maghḍūb is mafʿūl pattern — \"the anger-received\" — the anger's source is grammatically absent (divine passive)"}, {"cat": "HAPAX", "pattern": "only passive participle of gh-d-b in Quran", "kernel": "This is the sole Quranic instance of maghḍūb — all other gh-d-b forms are active verb or gerund (ghaḍab)"}, {"cat": "SEM", "pattern": "passive vs active: wrath received vs straying done", "kernel": "Maghḍūb (passive) contrasts with ḍāllīn (active) — one group RECEIVES wrath, the other DOES the straying"}], "tag": "CRITICAL"}, {"id": 7, "arabic": "عَلَيْهِمْ", "translit": "ʿalayhim", "gloss": "upon them", "root": "ع ل و ('-l-w)", "grammar": "Preposition ʿalā + 3rd person masculine plural pronoun -him; completes the passive construction of maghḍūb", "semantics": ["Preposition ʿalā: upon, on, over — here completes the passive participle construction (the anger is UPON them)", "The repetition of ʿalayhim (also in word 4) creates a structural mirror: favor upon them vs anger upon them", "Core concept: directionality — the same preposition channels both grace and wrath onto their recipients"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": [{"cat": "STRUCT", "pattern": "ʿalayhim mirror: favor (w.4) vs wrath (w.7)", "kernel": "Same phrase channels opposite forces — divine favor and divine anger both land ʿalayhim, structural antithesis"}, {"cat": "ECHO", "pattern": "ʿalayhim echo across ayah boundary", "kernel": "First ʿalayhim (anʿamta ʿalayhim) and second (al-maghḍūbi ʿalayhim) create root echo of ʿ-l-w framing the ayah"}]}, {"id": 8, "arabic": "وَ", "translit": "wa", "gloss": "and", "root": "أ و ي ('-w-y)", "grammar": "Conjunction — here functions as ʿaṭf (coordination), connecting the second negated group (ḍāllīn) to the first (maghḍūb)", "semantics": ["Conjunction wa: coordination (ʿaṭf) — joins two parallel elements under the same grammatical construction", "Alternative: wa could function as intensifying — \"and especially not\" — adding emphasis to the second exclusion", "Core concept: connective particle linking parallel or sequential elements"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": []}, {"id": 9, "arabic": "لَا", "translit": "lā", "gloss": "not, no", "root": "—", "grammar": "Negative particle (ḥarf nafy) — negates the following noun, reinforcing the exclusion begun by ghayri", "semantics": ["Negative particle: lā with nouns = categorical negation; reinforces and extends the ghayri exclusion", "Classical: lā al-nāfiya — when used with definite nouns in genitive, it intensifies the negation beyond ghayri alone", "Core concept: categorical denial — absolute exclusion from the defined group"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "wa-lā reinforcement of ghayri", "kernel": "The lā is not structurally necessary (ghayri already excludes) — wa-lā adds emphatic separate negation for ḍāllīn"}, {"cat": "STRUCT", "pattern": "double negation: ghayri + wa-lā", "kernel": "Two exclusion mechanisms: ghayri (genitive exclusion) then wa-lā (conjunctive negation) — emphatic binary rejection"}]}, {"id": 10, "arabic": "الضَّالِّينَ", "translit": "aḍ-ḍāllīna", "gloss": "those who go astray, the lost ones, the wandering", "root": "ض ل ل (d-l-l)", "grammar": "Active participle (fāʿil pattern), genitive plural, definite — in contrast to maghḍūb (passive), these are ACTIVE agents of their own straying", "semantics": ["[7C] Lane's: ḍalla = to go astray, to err, to lose the way, to wander from the right path", "[7C] Lane's: ḍalla also = to perish, to become lost, to vanish, to be hidden — \"ḍalla fī l-arḍ\" = to be dissolved/lost in the earth", "[7C] Lisan al-Arab: ḍalāl = deviation, error, wandering; also ḍalāla = the state of being lost or confused", "[7C] Form IV aḍalla: to lead astray, to mislead, to cause to lose the way — causative", "Hans Wehr: to go astray, to err; to be lost, misled; ḍalāl = error, aberration, misguidance", "[7C] Classical: ḍalla fī l-arḍ = to be absorbed into the ground, to decompose — physical dissolution", "[7C] Classical: ḍalla also = to forget, to lose from memory (related to being lost from consciousness)", "[M] Modern: to lose signal, to deviate from protocol, to go off-grid — systemic disorientation", "[F] Futuristic: signal loss, data corruption, decoherence — loss of coherent path in a network", "Core concept: deviation from a path resulting in dissolution, disorientation, or vanishing"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle: ḍāllīn/ḍāll (the straying ones)", "count": "~17 ayahs", "examples": [{"ref": "6:77", "arabic": "فَلَمَّا رَءَا ٱلْقَمَرَ بَازِغًۭا قَالَ هَٰذَا رَبِّى ۖ فَلَمَّآ أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِى رَبِّى لَأَكُونَنَّ مِنَ ٱلْقَوْمِ ٱلضَّآلِّينَ", "english": "When he saw the moon rising he said: This is my Lord — but when it set he said: If my Lord does not guide me I will be among the people who are astray (aḍ-ḍāllīna)"}, {"ref": "23:106", "arabic": "قَالُوا۟ رَبَّنَا غَلَبَتْ عَلَيْنَا شِقْوَتُنَا وَكُنَّا قَوْمًۭا ضَآلِّينَ", "english": "They said: Our Lord, our wretchedness overcame us and we were a people astray (ḍāllīna)"}]}, {"label": "B. Causative Form IV: aḍalla (to lead astray, to mislead)", "count": "~58 ayahs", "examples": [{"ref": "28:15", "arabic": "فَوَكَزَهُۥ مُوسَىٰ فَقَضَىٰ عَلَيْهِ ۖ قَالَ هَٰذَا مِنْ عَمَلِ ٱلشَّيْطَٰنِ ۖ إِنَّهُۥ عَدُوٌّۭ مُّضِلٌّۭ مُّبِينٌۭ", "english": "Moses struck him and killed him — he said: This is from the work of Satan, indeed he is an enemy, a clear misleader (muḍill)"}]}, {"label": "C. Gerund: ḍalāl/ḍalāla (the state of going astray)", "count": "~48 ayahs", "examples": [{"ref": "7:179", "arabic": "أُو۟لَٰٓئِكَ كَٱلْأَنْعَٰمِ بَلْ هُمْ أَضَلُّ", "english": "Those are like cattle — rather, they are more astray (aḍallu)"}]}]}, "qiraat": [{"arabic": "الضَّأَلِّينَ", "translit": "aḍ-ḍaʾallīna", "status": "Irreg", "type": "hmz", "note": "Irregular: hamza inserted — dialectal pronunciation variant, same meaning", "source": "erquran.org"}, {"arabic": "الضَّالُّونَ", "translit": "aḍ-ḍāllūna", "status": "None", "type": "CE", "note": "Case variant: nominative instead of genitive — would break the grammatical chain from ghayri, creating an independent clause", "source": "erquran.org"}, {"arabic": "الضَّالِّينَ آمِينَ", "translit": "aḍ-ḍāllīna āmīna", "status": "None", "type": "±", "note": "Addition of āmīn at the end — liturgical supplement, not part of the Quranic text in Hafs reading", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "12", "refs": "1:7;4:119;5:77;6:119;6:140;6:144;7:53;16:25;28:50", "note": "Going astray co-occurs with otherness/exclusion — straying is defined as being \"other than\" the guided path"}, {"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "5", "refs": "1:7;4:119;7:179;25:44;39:8", "note": "Going astray co-occurs with favor — 39:8 shows receiving favor then going astray, favor-straying tension"}, {"coRoot": "gh-d-b", "coRootAr": "غ ض ب", "count": "2", "refs": "1:7;5:60", "note": "Going astray co-occurs with wrath — 5:60 bundles divine anger with being led astray and transformation"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "2", "refs": "1:7;6:39", "note": "Going astray co-occurs with path — 6:39 juxtaposes God placing someone on ṣirāṭ vs leading astray"}], "critical": [{"cat": "SEM", "pattern": "d-l-l: stray AND perish AND dissolve", "kernel": "Root includes physical dissolution (lost in earth), cognitive error, and spiritual wandering — all layers active"}, {"cat": "GRAM", "pattern": "active participle vs passive (maghḍūb)", "kernel": "Ḍāllīn is fāʿil (active: they stray) while maghḍūb is mafʿūl (passive: wrath comes upon them) — moral asymmetry"}, {"cat": "INTER", "pattern": "ḍāllīn + ghaḍab in 5:60", "kernel": "In 5:60, both states merge in one group (cursed, angered upon, and led astray) — 1:7 separates them"}], "tag": "CRITICAL"}], "questions": ["Why does the ayah use passive voice for wrath (maghḍūb — anger received) but active voice for straying (ḍāllīn — those who stray) — does this imply different levels of moral agency?", "What is the grammatical relationship of ghayri — is it badal (substitution) for alladhīna, ṣifa (adjective) for alladhīna, or ḥāl (circumstantial) for the implicit subject? Each parsing changes the scope of exclusion.", "The path (ṣirāṭ) in 1:6 is described geometrically (mustaqīm = straight) while in 1:7 it is described by its inhabitants (alladhīna anʿamta) — does this shift from geometry to community redefine what \"straightness\" means?", "Why is the agent of anger in al-maghḍūbi left unnamed (divine passive) while the agent of favor in anʿamta is explicitly addressed as \"You\"? Does this asymmetry signal a theological distinction between how grace and wrath are attributed?", "The qiraat variant anʿamtu (first person: \"I bestowed\") vs standard anʿamta (second person: \"You bestowed\") shifts between direct divine speech and prayer address — does this reveal an ambiguity about who is speaking in al-Fātiḥa?", "Can the two excluded groups (maghḍūb and ḍāllīn) be read as two stages of the same condition rather than two separate groups — first wrath descends (passive), then straying follows (active)?", "The shawādhdh variant replacing ṣirāṭ with sabīl — given that ṣirāṭ appears 45 times and sabīl 176 times, what semantic distinction does the Quran maintain between these near-synonyms for \"path\"?", "Does the root connection between ṣirāṭ (from saraṭa, to swallow) and the eschatological bridge (ṣirāṭ over hellfire) activate in this context — is the \"path of the favored\" simultaneously a bridge that swallows/absorbs its travelers?", "In 4:119, Satan vows wa-la-uḍillannahum (I will lead them astray) and wa-la-ughayyirunna khalqa llāh (I will make them alter God's creation) — both d-l-l and gh-y-r appear together as here. Does 1:7 establish the template that 4:119 inverts?", "The futuristic reading of ṣirāṭ as bandwidth/channel and ḍāllīn as signal loss — does the Quranic insistence on a single ṣirāṭ (always singular) map onto information theory's concept of a single coherent signal versus noise?", "Why does the text use wa-lā (and not) rather than simply extending ghayri to cover both groups — what does the additional negation particle accomplish that ghayri alone cannot?", "Given that the passive participle maghḍūb occurs only here in the entire Quran, while the active ghaḍiba occurs 4 times and the gerund ghaḍab 16 times — why is this unique form chosen for this most-recited ayah?", "The n-ʿ-m root co-occurs with s-r-t in three ayahs (1:7, 16:121, 48:2) — does this triangle (al-Fātiḥa, Abraham, Muhammad) define a canonical progression of path-and-favor recipients?", "How does the repetition of ʿalayhim (upon them) for both favor and wrath create a spatial metaphor — are grace and anger understood as descending forces that land upon their targets from the same vertical axis?", "The Irreg variant ladhīna (dropping al-) and the shawādhdh man (replacing alladhīna entirely) — do these variants reveal that the identity of the favored group was a point of early interpretive tension?"], "key": "1:7"}];
    const __EMBEDDED_BOUNDARIES__ = {"1": {"1-2": [{"labels": ["particle_bridge"], "text": "The Basmala (1:1) is a verbless prepositional fragment — bi-smi requires an elided verb (abda'u, aqra'u, asta'inu) whose content remains permanently unspecified. Al-ḥamdu lillāhi (1:2) supplies the first actual predication in the Quran: a complete nominal sentence with subject and predicate. The grammatical incompleteness of 1:1 creates a syntactic vacuum that 1:2 fills — the elided verb of the Basmala finds its first concrete realization in the act of ḥamd. Reading across the boundary, \"in the name of God\" becomes \"in the name of God — [all] praise belongs to God,\" where the open-ended preposition retroactively acquires ḥamd as its governing action."}, {"labels": ["root_handoff"], "text": "The root '-l-h appears in Allāhi (1:1) and is immediately reprised in lillāhi (1:2), but with a critical grammatical shift: in 1:1, Allāh is the muḍāf ilayh (possessor of the name), reached through the genitive construct bismi llāhi; in 1:2, Allāh is the object of the lām preposition (recipient/owner of praise). The same divine referent pivots from being \"named\" to being \"praised\" — from identity-declaration to merit-recognition. Lane's notes that '-l-h carries both \"bewilderment/refuge\" and \"worship\"; the boundary enacts this progression: the naming in 1:1 (identifying the one to whom one turns) yields to the praise in 1:2 (the first act of worship directed at that identified entity)."}, {"labels": ["semantic_bridge"], "text": "The root s-m-w (ism, \"name/elevation/mark\") in 1:1 and the root ḥ-m-d (ḥamd, \"praise/recognition of intrinsic merit\") in 1:2 form a conceptual pair that neither ayah activates alone. Lane's defines ism as \"that which elevates/distinguishes its bearer\" and ḥamd as \"acknowledging excellence that exists in the object itself, regardless of personal benefit.\" Across the boundary, naming (identifying what something IS) leads directly to praising (declaring that what it IS is excellent). The Basmala's act of invoking the divine name is not neutral labeling — it is already an implicit acknowledgment of the merit that 1:2 makes explicit. Conversely, the praise in 1:2 is grounded because the name has already been spoken; ḥamd without prior ism would be praise of an unnamed entity."}, {"labels": ["semantic_bridge"], "text": "The paired attributes ar-Raḥmān ar-Raḥīm (1:1, root r-ḥ-m) describe HOW God relates to creation through mercy, while rabb al-'ālamīn (1:2, root r-b-b + '-l-m) describes WHAT God does with creation through nurturing cultivation. Lane's defines raḥma as \"the womb — the protective enclosure that enables growth\" and rabb as \"one who brings a thing from incompleteness to completion stage by stage.\" The boundary reveals that mercy (r-ḥ-m) is the mode and nurturing (r-b-b) is the method: the womb-like encompassing of Raḥmān/Raḥīm in 1:1 becomes the stage-by-stage developmental cultivation of Rabb in 1:2. Neither ayah alone shows this mercy-to-pedagogy arc."}, {"labels": ["register_shift"], "text": "1:1 is a formulaic invocation with no grammatical person — no speaker, no addressee, no verb. The Basmala floats as a preposition attached to an absent action, maximally impersonal. 1:2 introduces the first declarative proposition in the Quran: al-ḥamdu lillāhi is a complete predication that, while still third-person in surface grammar, implies a speaking subject who declares praise. The shift from verbless formula to assertive declaration marks the Quran's transition from invocation to speech — from ritual threshold to theological statement."}, {"labels": ["scene_shift"], "text": "The Basmala operates as a threshold marker — a liminal formula that precedes action (like \"once upon a time\" or \"in the name of the court\"). It names but does not yet describe. At the boundary, 1:2 opens the actual content of the Fātiḥa with a cosmological claim: God is rabb al-'ālamīn, nurturer of all realms of existence. The scope expands from a single naming act (one name, one God, two attributes) to a universal ontological statement (all worlds, all categories of being). The '-l-m root in al-'ālamīna — carrying \"knowledge, signs, worlds\" (Lane's: every created thing is a sign by which the Rabb is known) — transforms the intimate naming register of 1:1 into a panoramic survey of all knowable reality."}, {"labels": ["pronoun_chain"], "text": "There is no explicit pronoun crossing this boundary, but the implicit referent chain is significant: the elided subject of the Basmala (the unnamed \"I\" who begins in God's name) becomes the implied declarer of al-ḥamdu lillāhi in 1:2. The identity of the speaker is never stated in either ayah — yet the grammatical dependency between a preposition needing a verb (1:1) and a declaration needing a declarer (1:2) creates a phantom first-person that threads across the boundary. This unnamed subject is simultaneously the reciter, the Prophet, and any conscious being who enters the text."}], "2-3": [{"labels": ["particle_bridge"], "text": "The genitive case (kasra) on ar-raḥmāni and ar-raḥīmi in 1:3 is syntactically incomplete without 1:2 — these forms function as na't (attributive adjectives) of Allāhi or as further badal (apposition) to rabbi, both of which reside in the preceding ayah. The grammatical construction begun by lillāhi rabbi l-'ālamīna in 1:2 REQUIRES 1:3 to complete the chain of divine descriptors. Without 1:2, the genitive case of ar-raḥmāni r-raḥīmi has no governing element; without 1:3, the identity of the rabb remains defined only by scope (al-'ālamīna) but not by relational quality. The lām of istiḥqāq in lillāhi projects its governance across the boundary into the attributive chain."}, {"labels": ["root_handoff"], "text": "Root r-b-b (rabb, \"nurturer who brings from incompleteness to completion through stages\" — Lane's) in 1:2 hands off to root r-ḥ-m (raḥmān/raḥīm, \"visceral womb-sourced tenderness\" — Lane's: raqqat al-qalb) in 1:3. This is not mere repetition of \"God is good\" — r-b-b denotes authority-driven cultivation (Lane's: \"one who nurtures a thing from state to state until it reaches its complete condition\"), while r-ḥ-m denotes involuntary, constitutive caring sourced from the womb (raḥim). The boundary is the precise point where divine authority transforms into divine intimacy: the rabb who owns and manages all worlds is immediately revealed to operate through womb-like mercy, not coercion. Classical lexicographers (Lisan al-Arab) note raḥim as the physical womb — making the cultivator-to-womb transition across this boundary a deliberate semantic arc."}, {"labels": ["semantic_bridge"], "text": "The word al-'ālamīna (root '-l-m, \"worlds as sign-systems, domains of knowability\" — Lane's: \"everything by which the Rabb is known\") in 1:2 activates a specific reading of ar-raḥmān in 1:3: if each 'ālam is a domain through which the Rabb is recognized, then ar-raḥmān names the MODE of that recognition — mercy as the primary sign. Lane's notes al-'ālam derives from 'alāma (sign, indicator); the sign that all worlds emit, once 1:3 arrives, is identified as raḥma. The bridge also operates through the classical distinction (Lisan al-Arab) that ar-Raḥmān denotes raḥma 'āmma (general mercy encompassing all creation) — precisely matching the universal scope of al-'ālamīna. The totality of worlds in 1:2 finds its governing principle in the totality of mercy in 1:3."}, {"labels": ["pronoun_chain"], "text": "No overt pronoun appears at this boundary, yet the implicit referent performs a four-stage chain across 1:2–1:3: Allāh (named, lillāhi) → rabb (appositive, redefining God as nurturer) → ar-Raḥmān (attribute, redefining the nurturer as intensely merciful) → ar-Raḥīm (attribute, specifying that mercy as permanent trait). Each term across the boundary narrows the referent's identity without introducing a new subject. The absence of any conjunction (wa, fa, thumma) between 1:2 and 1:3 reinforces that these are not separate claims but a single cascading identification — the grammatical subject never shifts, it only deepens."}, {"labels": ["register_shift"], "text": "Ayah 1:2 is a complete jumla ismiyya (nominal sentence) — a self-standing declaration with mubtada' (al-ḥamdu) and khabar (lillāhi) plus appositional elaboration. It makes a CLAIM. Ayah 1:3, by contrast, contains no sentence structure at all — it is pure adjectival attribution, two ṣifas (qualities) hanging in genitive dependency on the preceding ayah. The register shifts from assertive declaration (\"all praise belongs to God, nurturer of all realms\") to intimate characterization (\"the overwhelmingly merciful, the perpetually merciful\"). This is a shift from WHAT IS TRUE about the universe (praise belongs to God) to WHO GOD IS in relation to that universe (mercy-defined). The hearer moves from cosmic theology to personal encounter."}, {"labels": ["scene_shift"], "text": "The scope narrows dramatically at this boundary. Ayah 1:2 establishes the widest possible frame: al-ḥamdu (the entire category of praise) + lillāhi (the singular God) + rabbi l-'ālamīna (the nurturer of every realm of existence). This is maximally expansive — all praise, all worlds. Then 1:3 zooms into the interior quality of that vast Lord: not what He governs but HOW He governs. The fa'lān pattern of raḥmān (overflowing intensity) paired with the fa'īl pattern of raḥīm (enduring constancy) creates a dual-lens focus on divine interiority. The scene shifts from the external panorama of cosmic lordship to the internal texture of divine character — from telescope to microscope."}], "3-4": [{"labels": ["semantic_bridge"], "text": "The root r-ḥ-m (mercy, womb-sourced tenderness) in 1:3 meets d-y-n (debt, judgment, recompense) in 1:4, creating a retroactive reframing: the classical sense of dāna = \"to owe a debt, to be judged\" (Lane's: dayyān = \"one who requites, rewards, or punishes\") recasts ar-Raḥmān ar-Raḥīm from a nurturing quality into the character of the judge. The merciful one is not separate from the judge — the judge's defining trait IS mercy. This semantic collision is invisible when either ayah is read alone: r-ḥ-m without d-y-n is pure tenderness; d-y-n without r-ḥ-m is pure accountability. The boundary fuses them into a single identity."}, {"labels": ["register_shift"], "text": "1:3 presents two attributes of pure character — ar-Raḥmān ar-Raḥīm are timeless qualities with no temporal anchor, no domain specified, no action implied. At the boundary, 1:4 introduces temporal specificity (yawm = a bounded period, an epoch, a decisive juncture — Lane's: \"a particular time in which an event occurs\") and institutional authority (mālik = one who has something firmly in his grasp — Lane's: malaka l-'ajīna = \"he kneaded the dough thoroughly,\" i.e., total mastery). The shift moves from WHO God is (character) to WHAT God governs (a specific domain of consequence), from being to jurisdiction."}, {"labels": ["particle_bridge"], "text": "Both 1:3 and 1:4 are verbless genitive constructions in apposition to rabb al-'ālamīn in 1:2 — ar-Raḥmāni ar-Raḥīmi and māliki yawmi d-dīni share the same kasra (genitive) ending and the same syntactic dependency. There is no conjunction (wa), no verb, no predicate break: the grammar treats the mercy-pair and the sovereignty-claim as a single continuous predication. Removing the boundary marker, the chain reads rabb-al-'ālamīn-ar-Raḥmān-ar-Raḥīm-mālik-yawm-al-dīn — one unbroken genitive descent from lordship through mercy to judgment."}, {"labels": ["root_handoff"], "text": "The root m-l-k in mālik activates a semantic field (mulk = dominion, malakūt = celestial sovereignty, malik = king, mamlūk = that which is owned) that answers a question left open by r-ḥ-m: mercy toward whom, and with what authority? The fa'lān/fa'īl patterns of ar-Raḥmān ar-Raḥīm established intensity and permanence of character; the fā'il pattern of mālik now establishes the scope of that character's authority. The handoff is from quality (r-ḥ-m) to jurisdiction (m-l-k), and the qirā'āt variant mālik (owner/possessor) vs malik (king/sovereign) intensifies the handoff — owner implies intimate possession (aligned with the womb-intimacy of r-ḥ-m), king implies public authority (aligned with the institutional weight of d-y-n)."}, {"labels": ["scene_shift"], "text": "1:3 operates in a realm of pure attribute — no place, no time, no event, just two adjectives describing an essence. At 1:4, a scene crystallizes: there is now a specific day (yawm), a specific system (al-dīn, THE recompense — definite, known, particular), and a specific role (mālik, the one in control). The shift is from abstract theology to concrete eschatology, from timeless description to a moment that will arrive. The triple iḍāfa (mālik-yawm-al-dīn) creates cascading specificity that contrasts sharply with the open, unbounded mercy of 1:3."}, {"labels": ["pronoun_chain"], "text": "No explicit pronoun appears in either ayah, yet the referent (God, introduced as rabb al-'ālamīn in 1:2) carries across the boundary entirely through genitive apposition — the grammatical case itself functions as the pronoun chain. The absence of any re-introduction or anaphoric pronoun means the listener must hold the referent continuously from 1:2 through 1:3 into 1:4. This implicit chain binds mercy and sovereignty to a single, unbroken subject without ever naming it again."}, {"labels": ["semantic_bridge"], "text": "The classical lexicographic note that ar-Raḥīm denotes raḥma khāṣṣa (specific, directed mercy — Lisan al-Arab) while ar-Raḥmān denotes raḥma 'āmma (general, universal mercy) creates a narrowing trajectory that continues into 1:4: from universal mercy (Raḥmān) to directed mercy (Raḥīm) to a specific day of a specific system (yawm al-dīn). The boundary between 1:3 and 1:4 is the pivot where this narrowing accelerates — from the most intimate divine quality (Raḥīm, the permanently merciful) directly into the most consequential divine function (Mālik yawm al-dīn, master of the reckoning)."}], "4-5": [{"labels": ["register_shift"], "text": "The most dramatic shift in the entire Quran occurs at this boundary: 1:4 is third-person description of God (māliki yawmi d-dīn — \"Master of the Day of Recompense\"), while 1:5 pivots to second-person direct address (iyyāka na'budu — \"You alone we serve\"). The speaker moves from talking ABOUT God to talking TO God. This is known in classical rhetoric as iltifāt (shift of grammatical person), and classical commentators mark it as the hinge of al-Fātiḥa — the moment where theology becomes encounter, where the catalogue of divine attributes (1:2-4) finds its purpose as the ground for direct speech."}, {"labels": ["pronoun_chain"], "text": "The referent accumulated across 1:2-4 — Rabb al-'ālamīn, al-Raḥmān al-Raḥīm, Mālik yawm al-dīn — is the unnamed \"He\" to whom all these attributes belong. At 1:5, this accumulated referent is captured by the second-person pronoun -ka in iyyāka. The chain is not explicit (no huwa appears in 1:2-4), but the attributes build a composite identity that the pronoun then addresses. The shift from implicit third-person referent to explicit second-person addressee means every attribute in 1:2-4 now saturates the \"You\" of 1:5; the listener understands exactly WHO is being addressed because of the preceding chain."}, {"labels": ["semantic_bridge"], "text": "The root m-l-k in mālik (1:4) establishes absolute ownership and sovereignty — Lane's core sense of \"having something firmly in one's grasp.\" This activates the meaning of 'ibāda in na'budu (1:5, root '-b-d) not merely as ritual worship but as the response of the owned to the Owner: 'abd means both slave and worshipper, and it is specifically the mālik/malik framing that selects the servitude-and-devotion polysemy of '-b-d. Without mālik preceding it, na'budu could lean toward mere ritual; with mālik, the full semantic range of '-b-d (slave, servant, one whose capacity is entirely at the disposal of the master) is engaged."}, {"labels": ["semantic_bridge"], "text": "The root d-y-n in al-dīn (1:4) carries the extraordinary double meaning of debt/recompense AND submission/obedience (Lane's: dāna lahu = \"he submitted to him\"). This meaning of submission crosses directly into na'budu (1:5), where the speakers enact that very submission. But d-y-n also means \"systematic accountability\" — and this crosses into nasta'īnu (1:5, root '-w-n, Form X = seeking aid), because the one who recognizes they stand within a system of recompense (dīn) is precisely the one who acknowledges insufficient capacity and seeks enabling power (isti'āna). The debt-consciousness of d-y-n motivates the aid-seeking of '-w-n."}, {"labels": ["particle_bridge"], "text": "The triple iḍāfa construction in 1:4 (māliki yawmi d-dīn) is a verbless nominal phrase functioning as an attribute in apposition. It has no predicate, no verb, no addressee — it is grammatically suspended. The verb and addressee arrive only in 1:5 (iyyāka na'budu), where the first-person plural verb and the second-person pronoun complete what 1:4 left open. In syntactic terms, 1:4 builds the ground (who God is) and 1:5 supplies the response (what follows from that identity). The absence of a finite verb in 1:4 creates a grammatical tension that 1:5 resolves with two verbs (na'budu, nasta'īnu)."}, {"labels": ["scene_shift"], "text": "The temporal frame shifts at this boundary. 1:4 is oriented toward yawm al-dīn — a future (or eternal) temporal marker, the Day of Recompense. 1:5 snaps into the present tense: na'budu and nasta'īnu are imperfect indicative verbs expressing continuous present action. The scene moves from contemplating a cosmic future event to enacting a present-tense relationship. The effect is that the eschatological horizon of 1:4 does not remain abstract — it is answered by immediate, ongoing practice in 1:5. The future accountability (yawm al-dīn) generates present devotion (na'budu) and present dependence (nasta'īnu)."}, {"labels": ["root_handoff"], "text": "The concept of mulk/mālik (root m-l-k, sovereignty and ownership) in 1:4 is answered by isti'āna (root '-w-n, seeking aid) in 1:5. Lane's records that '-w-n carries the core sense of \"strengthening through external support\" and that the one seeking 'awn \"acknowledges insufficient capacity on their own.\" This is the logical complement to mālik: the one who possesses absolute sovereignty (m-l-k) is the one from whom aid must be sought ('-w-n). The root handoff is not mere repetition but causal — sovereignty in 1:4 is the premise; seeking aid in 1:5 is the entailment."}], "5-6": [{"labels": ["register_shift"], "text": "Ayah 1:5 uses first-person plural declarative statements (na'budu, nasta'inu — \"we worship, we seek aid\"), asserting what the speakers do. Ayah 1:6 shifts to imperative mood (ihdina — \"guide us\"), converting the speakers from declarers into petitioners. The grammatical person of the addressee remains second-person singular throughout (iyyaka / implicit \"You\" in the imperative), but the speech act transforms from declaration of allegiance to active supplication. This is the surah's pivot: the community first establishes its credentials (exclusive worship + exclusive reliance) and only then is authorized to make a request."}, {"labels": ["particle_bridge"], "text": "The conjunction wa in 1:5 links worship (na'budu) to seeking aid (nasta'inu), and the Form X ista'ana (seeking enablement from an external source, root '-w-n) semantically requires that the aid sought be specified. Ayah 1:6 supplies precisely that specification: the aid requested is hidaya (guidance, root h-d-y) toward a particular path. The isti'ana of 1:5 is grammatically complete but semantically incomplete — it begs the question \"aid for what?\" — and 1:6 answers it. The boundary functions as an implicit li- (for/toward): \"we seek Your aid [for this]: guide us to the straight path.\""}, {"labels": ["semantic_bridge"], "text": "The root '-b-d in na'budu carries the classical meaning of smoothing/paving a road by treading it (Lane's: 'abada al-tariqa = he trod and made smooth the road). The root s-r-t in sirat means a wide, clear, engineered road that \"swallows\" its traveler. The act of 'ibada in 1:5 — understood through its concrete etymological sense of path-making through labor — prepares the ground for the sirat of 1:6. The worshipper who treads and smooths ('abada) is then asked to be placed on the already-smooth, already-wide road (sirat). The lexical archaeology reveals that the boundary joins two road metaphors: making a path (through devoted labor) and being placed on THE path (through divine guidance)."}, {"labels": ["semantic_bridge"], "text": "Form X nasta'inu in 1:5 (seeking external enablement, acknowledging insufficient personal capacity) activates a specific semantic field: the speakers cannot reach their destination alone. In 1:6, ihdi-na (guide us) from root h-d-y carries the classical sense of \"to precede, to go before\" — the guide walks ahead of the one being guided (Lane's). The bridge is precise: those who confess they cannot enable themselves (isti'ana) are answered by a mode of aid where the source literally leads from the front (hidaya). The Form X \"seeking\" in 1:5 finds its object in the imperative \"lead us\" of 1:6."}, {"labels": ["pronoun_chain"], "text": "The first-person plural subject -na runs unbroken across the boundary: na'budu (we worship), nasta'inu (we seek aid), ihdi-na (guide us). The second-person singular addressee likewise persists: iyyaka (You alone) in 1:5 becomes the implicit subject of the imperative ihdi (You guide) in 1:6. Both the \"we\" and the \"You\" carry across without restatement, but the relationship between them transforms — from parallel declarations of exclusivity (iyyaka...iyyaka) to a direct imperative request. The pronoun chain is the thread; the boundary is where the thread changes texture from statement to plea."}, {"labels": ["root_handoff"], "text": "Root '-w-n (aid, enablement) in nasta'inu and root q-w-m (standing, uprightness, self-maintenance) in al-mustaqim perform a handoff across the boundary. The speakers seek 'awn (strengthening through external support) in 1:5; in 1:6 they specify the destination of that support — a path that is mustaqim, from Form X istaqama (self-standing, self-correcting, maintaining its own straightness). The handoff is structurally exact: the seekers of external standing-power ('-w-n) ask to be placed on the path that possesses internal standing-power (q-w-m). What they lack, the path has. The aid sought is alignment with something already upright."}, {"labels": ["scene_shift"], "text": "Ayah 1:5 is abstract and relational — two verbs of inner disposition (worship, seek aid) with no spatial or sensory content. Ayah 1:6 introduces concrete spatial imagery: a road (sirat) with a physical quality (mustaqim — straight, upright). The scene shifts from the interior (the stance of the soul toward God) to the exterior (a path stretching ahead with directional properties). The boundary is the threshold between declaring one's orientation and seeing where that orientation leads — from posture to landscape."}], "6-7": [{"labels": ["particle_bridge"], "text": "The noun sirata in 1:7 stands in apposition (badal) to al-sirata l-mustaqima in 1:6, making the entire ayah 1:7 grammatically dependent on the imperative clause of 1:6. Without ihdina al-sirata l-mustaqima, the phrase sirata lladhina has no syntactic anchor. The imperative verb ihdina in 1:6 governs the double accusative that only reaches its full specification in 1:7 — the request \"guide us to THE straight path\" remains abstract until 1:7 defines it as \"the path of those You favored.\" The grammatical construction is deliberately incomplete at the boundary: 1:6 provides the verb and the generic object, 1:7 provides the identifying apposition. This is not mere continuation but syntactic entailment — 1:7 cannot exist as an independent sentence."}, {"labels": ["root_handoff"], "text": "The root s-r-t (ص ر ط) appears as al-sirata (definite, with al-) in 1:6 and as sirata (definite by idafa with alladhina) in 1:7. The repetition performs a semantic narrowing: the first sirat is qualified by an adjective (mustaqim — self-maintaining straightness), while the second is qualified by its travelers (those whom God favored). The path shifts from being defined by its intrinsic geometric property (straightness) to being defined by the people who walk it. Lane's Lexicon preserves the root meaning \"to swallow\" — in 1:6 the swallowing road is characterized by its own uprightness, in 1:7 by the community it has consumed. The double articulation — attribute then population — constitutes a complete definition that neither ayah achieves alone."}, {"labels": ["semantic_bridge"], "text": "The word al-mustaqima (from q-w-m, Form X: self-seeking straightness, self-maintenance) in 1:6 is semantically answered by the triple population structure in 1:7. The \"self-correcting\" quality of the path (istaqama = to find straightness in oneself) is concretized through its human content: it self-corrects by excluding two deviations. The favored group (an'amta 'alayhim) embodies the path's straightness; the wrathful (al-maghdubi 'alayhim) and the straying (al-dallin) embody the two modes of departure from q-w-m's vertical stability. Classical Lane's defines qawm as \"those who stand together\" — 1:7 literally specifies who stands on this self-standing path and who does not."}, {"labels": ["pronoun_chain"], "text": "The second-person address initiated by ihdi-na in 1:6 (imperative directed at \"You,\" God) carries silently across the boundary until it surfaces as an'am-ta (\"You bestowed\") in 1:7. The \"You\" who is asked to guide in 1:6 is the same \"You\" who previously bestowed favor in 1:7. This pronoun chain performs a theological argument: the one capable of future guidance (ihdi) is identified as the one who has already demonstrated past favor (an'amta, perfect tense). The shift from imperative (1:6) to perfect indicative (1:7) within the same second-person address creates a temporal arc — from present request to past evidence — that depends entirely on crossing the boundary."}, {"labels": ["semantic_bridge"], "text": "The root h-d-y (ه د ي) in ihdina (1:6) and the root d-l-l (ض ل ل) in al-dallin (1:7) form a precise antonym pair visible only across the boundary. Lane's Lexicon defines hada as \"to lead aright, to show the way, to precede as a guide\" and dalla as \"to stray, to lose one's way, to be lost.\" The prayer for guidance (h-d-y) in 1:6 receives its negative definition in 1:7: guidance is explicitly not-straying. But the cross-boundary placement makes this more than simple opposition — the request for hidaya is completed by the exclusion of dalal, as if the very act of asking to be guided requires specifying what non-guidance looks like."}, {"labels": ["register_shift"], "text": "In 1:6 the speech act is pure petition — a bare imperative (ihdi) with no descriptive content, only a request and its object. At the boundary, 1:7 shifts to descriptive-classificatory mode: it taxonomizes humanity into three groups (favored, wrathful, straying) using relative clauses, passive participles, and active participles. The grammatical texture changes from verbal-imperative to nominal-participial. This shift from requesting to defining is the structural hinge of the entire surah: the worshiper's petition (1:6) can only be understood through the map of human possibilities (1:7)."}, {"labels": ["semantic_bridge"], "text": "The preposition 'ala (ع ل و) appears once in 1:6 implicitly through the double-accusative construction of ihdi (guidance directed upon the guided), then twice explicitly in 1:7: 'alayhim (favor upon them) and 'alayhim (wrath upon them). The same spatial metaphor — something descending upon a recipient — carries both ni'ma (softness, ease, flourishing from n-'-m) and ghadab (intense heated anger from gh-d-b). This superposition structure is invisible within either ayah alone: only by reading across the boundary does one see that the path of 1:6 is defined in 1:7 by what falls upon its travelers — blessing or wrath — using identical prepositional architecture for opposite outcomes."}, {"labels": ["scene_shift"], "text": "Ayah 1:6 presents a scene of singular focus: one community (na, \"us\"), one path (al-sirat), one quality (al-mustaqim). The acoustic and conceptual space is unified. At the boundary, 1:7 fractures this unity into a tripartite scene: those favored, those under wrath, those astray. The singular corridor of 1:6 opens into a landscape with three distinct populations. Furthermore, the voice/agency grammar shifts: in 1:6 the worshiper actively requests (ihdi); in 1:7 the favored passively receive (an'amta 'alayhim), the wrathful passively bear (al-maghdubi, passive participle), and only the straying act (al-dallin, active participle). The boundary marks the transition from unified agency to differentiated destinies."}]}};
    
    const { useState, useRef, useEffect, useCallback } = React;

    const surahNames = {

    const c = {

    // Legend data for CRITICAL categories and semantic temporal badges
    const criticalLegend = {
      GRAM: "Grammar & syntax", SEM: "Semantic field", INTER: "Cross-reference",
      STRUCT: "Structure & pattern", ECHO: "Root echo", HAPAX: "Rare/unique", FORM: "Verb form (I-X)"
    };
    const temporalLegend = {
      "7C": { label: "7C", display: "7C", desc: "Classical", bg: "#8B4513" },
      "M":  { label: "M", display: "M", desc: "Modern", bg: "#0D7680" },
      "F":  { label: "F", display: "E", desc: "Emergent", bg: "#990F3D" }
    };

    // Parse semantic string for temporal badge: [7C], [M], [F] prefix
    function parseSemanticBadge(str) {
      const match = str.match(/^\[(\w+)\]\s*/);
      if (match) {
        const code = match[1].toUpperCase();
        const info = temporalLegend[code] || temporalLegend[code === "E" ? "F" : null];
        if (info) return { badge: info, text: str.slice(match[0].length) };
      }
      return { badge: null, text: str };
    }


    /*───────────────────────────────────────────────────────────
      UTILITIES — root matching & text highlighting
    ───────────────────────────────────────────────────────────*/
    const TRANSLIT_RE = /[āīūḥṭṣğʿḍẓšṯḫḏĀĪŪḤṬṢĞḌẒŠṮḪḎ]/;

    function extractRootLetters(rootStr) {
      if (!rootStr || rootStr === "—") return [];
      return rootStr.split("(")[0].trim().split(/\s+/).filter(Boolean);
    }

    function stripDiacritics(text) {
      return text.replace(/[\u064B-\u0652\u0670]/g, "");
    }

    function normChar(ch) {
      if ("أإآٱء".includes(ch)) return "ا";
      if ("ى".includes(ch)) return "ي";
      if ("ؤ".includes(ch)) return "و";
      if ("ة".includes(ch)) return "ه";
      return ch;
    }

    function charsMatch(wc, rc) {
      const nw = normChar(wc);
      const nr = normChar(rc);
      if (nw === nr) return true;
      if (nr === "ي" && nw === "ا") return true;
      if (nr === "و" && nw === "ا") return true;
      return false;
    }

    function wordMatchesRoot(arabicWord, rootLetters) {
      if (!rootLetters.length) return false;
      const clean = stripDiacritics(arabicWord);
      let ri = 0;
      for (let i = 0; i < clean.length && ri < rootLetters.length; i++) {
        if (charsMatch(clean[i], rootLetters[ri])) ri++;
      }
      return ri === rootLetters.length;
    }

    function renderArabicHL(text, rootStr, color) {
      if (!text || text.includes("this verse")) return text;
      const rootLetters = extractRootLetters(rootStr);
      if (!rootLetters.length) return text;
      return text.split(/(\s+)/).map((token, i) => {
        if (/^\s+$/.test(token)) return token;
        if (wordMatchesRoot(token, rootLetters)) {
          return <span key={i} style={{ color, fontWeight: 700 }}>{token}</span>;
        }
        return token;
      });
    }

    function renderEnglishHL(text, color) {
      if (!text) return text;
      const parts = [];
      const re = /(\S+)\s*\(([^)]+)\)/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (TRANSLIT_RE.test(m[1])) {
          if (m.index > last) parts.push(text.slice(last, m.index));
          parts.push(<strong key={m.index} style={{ color }}>{m[0]}</strong>);
          last = m.index + m[0].length;
        }
      }
      if (last < text.length) parts.push(text.slice(last));
      return parts.length ? parts : text;
    }

    /*───────────────────────────────────────────────────────────
      FILE PROCESSING — reads JSON files via File API
    ───────────────────────────────────────────────────────────*/
    function processFiles(fileList) {
      const jsonFiles = Array.from(fileList).filter(f => f.name.endsWith(".json") && !f.name.includes("-boundaries"));
      return Promise.all(jsonFiles.map(f => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              const threeMatch = f.name.match(/^(\d+)-(\d+)-(\d+)\.json$/);
              const twoMatch = f.name.match(/^(\d+)-(\d+)\.json$/);
              const oneMatch = f.name.match(/^(\d+)\.json$/);
              if (threeMatch) {
                // New format with version: surah-ayah-version
                data.key = `${data.surah}:${threeMatch[2]}-${threeMatch[3]}`;
              } else if (twoMatch) {
                // Could be new (surah-ayah) or old (ayah-version)
                if (String(data.surah) === twoMatch[1]) {
                  data.key = `${data.surah}:${twoMatch[2]}`;
                } else {
                  data.key = `${data.surah}:${twoMatch[1]}-${twoMatch[2]}`;
                }
              } else if (oneMatch) {
                // Old format: ayah only
                data.key = `${data.surah}:${oneMatch[1]}`;
              } else {
                data.key = `${data.surah}:${data.ayah}`;
              }
              resolve(data);
            } catch (err) {
              console.error(`Error parsing ${f.name}:`, err);
              resolve(null);
            }
          };
          reader.onerror = () => resolve(null);
          reader.readAsText(f);
        });
      })).then(results => {
        return results.filter(Boolean).sort((a, b) => {
          if (a.surah !== b.surah) return a.surah - b.surah;
          if (a.ayah !== b.ayah) return a.ayah - b.ayah;
          return (a.key || "").localeCompare(b.key || "");
        });
      });
    }

    function processBoundaryFiles(fileList) {
      const boundaryFiles = Array.from(fileList).filter(f => f.name.includes("-boundaries.json"));
      return Promise.all(boundaryFiles.map(f => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              resolve(data);
            } catch (err) {
              console.error(`Error parsing boundary file ${f.name}:`, err);
              resolve(null);
            }
          };
          reader.onerror = () => resolve(null);
          reader.readAsText(f);
        });
      })).then(results => results.filter(Boolean));
    }

    /*───────────────────────────────────────────────────────────
      FILE LOADER — landing screen
    ───────────────────────────────────────────────────────────*/
    function FileLoader({ onFilesLoaded }) {
      const [dragging, setDragging] = useState(false);
      const [status, setStatus] = useState("");
      const folderRef = useRef(null);
      const filesRef = useRef(null);

      const handleFiles = useCallback(async (fileList) => {
        const jsonCount = Array.from(fileList).filter(f => f.name.endsWith(".json")).length;
        if (jsonCount === 0) {
          setStatus("No .json files found. Please select a folder containing ayah analysis files.");
          return;
        }
        setStatus(`Reading ${jsonCount} file${jsonCount > 1 ? "s" : ""}...`);
        const [ayahs, boundaries] = await Promise.all([
          processFiles(fileList),
          processBoundaryFiles(fileList)
        ]);
        if (ayahs.length > 0 || boundaries.length > 0) {
          onFilesLoaded(ayahs, boundaries);
        } else {
          setStatus("Could not parse any files. Check that they are valid JSON.");
        }
      }, [onFilesLoaded]);

      const handleDrop = useCallback((e) => {
        e.preventDefault();
        setDragging(false);
        if (e.dataTransfer.files.length > 0) {
          handleFiles(e.dataTransfer.files);
        }
      }, [handleFiles]);

      return (
        <div
          onDragOver={(e) => { e.preventDefault(); setDragging(true); }}
          onDragLeave={() => setDragging(false)}
          onDrop={handleDrop}
          style={{
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
            height: "100vh", background: c.paper, fontFamily: font.serif, color: c.ink,
          }}
        >
          <div style={{
            border: `2px dashed ${dragging ? c.teal : c.border}`,
            borderRadius: "8px", padding: "60px 48px", textAlign: "center",
            maxWidth: "520px", width: "90%",
            background: dragging ? c.tealLight : c.white,
            transition: "all 0.2s ease",
          }}>
            <div style={{ fontFamily: font.arabic, fontSize: "28px", color: c.oxford, marginBottom: "8px", lineHeight: "1.8" }}>
              بِسْمِ اللَّهِ
            </div>
            <div style={{ fontSize: "20px", color: c.ink, marginBottom: "6px", fontWeight: 600 }}>
              Quran Analysis Reader
            </div>
            <div style={{ fontSize: "14px", color: c.inkLight, marginBottom: "32px" }}>
              Load your ayah analysis files to begin
            </div>

            {/* Hidden inputs */}
            <input
              ref={folderRef}
              type="file"
              webkitdirectory=""
              directory=""
              multiple
              style={{ display: "none" }}
              onChange={(e) => handleFiles(e.target.files)}
            />
            <input
              ref={filesRef}
              type="file"
              multiple
              accept=".json"
              style={{ display: "none" }}
              onChange={(e) => handleFiles(e.target.files)}
            />

            <button
              onClick={() => folderRef.current.click()}
              style={{
                fontFamily: font.sans, fontSize: "14px", fontWeight: 700,
                background: c.teal, color: c.white, border: "none",
                padding: "12px 28px", borderRadius: "4px", cursor: "pointer",
                marginBottom: "12px", display: "block", width: "100%",
              }}
            >
              Select ayah-data folder
            </button>

            <button
              onClick={() => filesRef.current.click()}
              style={{
                fontFamily: font.sans, fontSize: "13px", fontWeight: 600,
                background: "transparent", color: c.teal, border: `1px solid ${c.teal}`,
                padding: "10px 28px", borderRadius: "4px", cursor: "pointer",
                display: "block", width: "100%",
              }}
            >
              Or select individual .json files
            </button>

            <div style={{
              fontFamily: font.sans, fontSize: "12px", color: c.inkFaint,
              marginTop: "20px",
            }}>
              You can also drag and drop files here
            </div>

            {status && (
              <div style={{
                fontFamily: font.sans, fontSize: "13px", color: c.claret,
                marginTop: "16px", padding: "8px 12px",
                background: c.claretBg, borderRadius: "3px",
              }}>
                {status}
              </div>
            )}
          </div>
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      OCCURRENCE ITEM — single ref+arabic+english row
    ───────────────────────────────────────────────────────────*/
    function OccurrenceItem({ item, rootStr, studiedKeys, onNavigate }) {
      const isStudied = studiedKeys.includes(item.ref);
      const isThisVerse = item.arabic.includes("this verse");

      const refStyle = {
        fontFamily: font.sans, fontSize: "12px", fontWeight: 700, flexShrink: 0,

      return (
        <div style={{ marginBottom: "8px", paddingLeft: "14px", borderLeft: `2px solid ${c.wheat}` }}>
          <div style={{ lineHeight: "2" }}>
            <span style={refStyle} onClick={isStudied ? () => onNavigate(item.ref) : undefined}>{item.ref}</span>
            {" "}
            {isThisVerse ? (
              <span style={{ fontFamily: font.serif, fontSize: "13px", color: c.inkFaint, fontStyle: "italic" }}>{item.arabic}</span>
            ) : (
              <span style={{ fontFamily: font.arabic, fontSize: "17px", color: c.oxford }}>
                {renderArabicHL(item.arabic, rootStr, c.teal)}

            )}
