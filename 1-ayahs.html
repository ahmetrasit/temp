    // ═══ EMBEDDED DATA (generated by build_ayah_reader.py) ═══
    const __EMBEDDED_AYAHS__ = [{"surah": 1, "ayah": 1, "arabic": "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "transliteration": "bismi llāhi r-raḥmāni r-raḥīmi", "readings": [{"text": "In the name of God, the Encompassingly Merciful, the Intimately Merciful", "textTr": "Tanrı'nın adıyla — sınırsız merhamet sahibi, yakın merhamet sahibi", "rationale": "The preposition bi- introduces instrumentality or accompaniment: \"by means of the name.\" ism (name) here functions as a marker of invocation, establishing the divine identity through which all subsequent discourse operates. al-Raḥmān and al-Raḥīm are parsed as attributive adjectives (ṣifa) modifying Allāh, each intensifying the concept of raḥma differently: Raḥmān as fa'lān (intensive, all-encompassing) and Raḥīm as fa'īl (enduring, relational).", "rationaleTr": "bi- edatı araçsallık veya beraberlik bildirir: \"isim aracılığıyla.\" İsm burada nida işareti olarak işlev görür, ilahi kimliği belirler. er-Raḥmān ve er-Raḥīm, Allah'ı niteleyen sıfatlardır; her biri rahmet kavramını farklı yoğunlukta işler: Raḥmān fa'lān kalıbıyla (kuşatıcı, sınırsız), Raḥīm fa'īl kalıbıyla (süregelen, ilişkisel)."}, {"text": "By the naming-act of the Divine, the Boundlessly Compassionate, the Specifically Compassionate", "textTr": "İlahi olanın isimlendirme eylemiyle — sınırsız şefkat sahibi, özel şefkat sahibi", "rationale": "ism is read not as a static label but as the verbal noun (maṣdar) of s-m-w — the act of elevating, marking, distinguishing. \"By the naming/distinguishing-act of God\" — i.e., the act by which God makes Himself known. bi- here marks the means of self-revelation. Raḥmān and Raḥīm are then understood as the content of that self-naming: God names Himself through mercy.", "rationaleTr": "İsm burada statik bir etiket değil, s-m-w kökünün mastar formu olarak okunur — yükseltme, işaretleme, ayırt etme eylemi. \"Tanrı'nın kendini tanıtma eylemiyle\" — yani Tanrı'nın kendini bildirdiği eylem. bi- burada kendini açığa çıkarma aracını belirtir. Raḥmān ve Raḥīm bu isimlendirmenin içeriğidir: Tanrı kendini rahmetle isimlendirir."}, {"text": "Through the mark/sign of God, the One whose mercy saturates all, the One whose mercy is sustained", "textTr": "Tanrı'nın nişanıyla/işaretiyle — merhameti her şeyi kuşatan, merhameti sürekli olan", "rationale": "ism is read through its classical lexicon sense of \"mark, sign, distinguishing feature\" (Lane's: wasm → ism, the mark by which something is known). bi- introduces the identifying sign. The Basmala thus says: \"Through the distinguishing sign of God\" — the mark by which the divine is recognized. This sign is then specified as dual-mercy: Raḥmān (saturating, overwhelming) and Raḥīm (sustained, personally directed).", "rationaleTr": "İsm burada klasik sözlük anlamıyla \"nişan, işaret, ayırt edici özellik\" olarak okunur (Lane's: wasm → ism, bir şeyin tanındığı işaret). bi- tanıtıcı işareti sunar. Besmele böylece \"Tanrı'nın ayırt edici işaretiyle\" der — ilahi olanın tanındığı nişan. Bu nişan ikili rahmet olarak belirlenir: Raḥmān (kuşatıcı, baskın) ve Raḥīm (süregelen, kişisel)."}, {"text": "With the elevated identity of God, the Mercy-Saturated, the Mercy-Sustaining", "textTr": "Tanrı'nın yüce kimliğiyle — merhamet dolu, merhamet sürdüren", "rationale": "ism from s-m-w carries the primary sense of \"elevation, height, loftiness.\" bi-smi thus can mean \"with/through the elevated identity of\" — the highest designation. This reading emphasizes that the divine name is not merely a label but an elevated, transcendent marker. In the modern era, ism as \"identifier\" can extend to any system of designation — including digital identity, metadata, or authentication protocols.", "rationaleTr": "s-m-w kökünden gelen ism birincil olarak \"yükseklik, yücelik, ulviyet\" anlamı taşır. bi-smi böylece \"yüce kimliğiyle\" anlamına gelebilir — en yüksek tanımlama. Bu okuma ilahi ismin salt bir etiket değil, yüce ve aşkın bir işaret olduğunu vurgular. Modern çağda ism \"tanımlayıcı\" olarak dijital kimlik, üst veri veya doğrulama protokollerine kadar genişleyebilir."}, {"text": "By the designation of God — the One whose raḥma is explosive in scope, the One whose raḥma is enduring in depth", "textTr": "Tanrı'nın adlandırmasıyla — rahmeti kapsamda patlayıcı olan, rahmeti derinlikte kalıcı olan", "rationale": "This reading focuses on the morphological contrast between Raḥmān (fa'lān pattern — denotes temporary but overwhelming states, like 'aṭshān/thirsty, ghaḍbān/angry) and Raḥīm (fa'īl pattern — denotes permanent, inherent qualities). The tension: Raḥmān suggests mercy that surges and overflows NOW (an active state), while Raḥīm suggests mercy that is an enduring attribute. Together they create a paradox: mercy that is both a present surge and an eternal quality.", "rationaleTr": "Bu okuma Raḥmān (fa'lān kalıbı — geçici ama baskın durumları ifade eder: 'aṭşān/susamış, ğaḍbān/kızgın) ile Raḥīm (fa'īl kalıbı — kalıcı, özsel nitelikleri ifade eder) arasındaki morfolojik karşıtlığa odaklanır. Gerilim: Raḥmān şu anda taşan ve kabaran merhameti (aktif durum) ima ederken, Raḥīm kalıcı bir sıfat olarak merhameti ima eder. Birlikte bir paradoks yaratırlar: hem şimdiki bir kabarmadır hem de ebedi bir niteliktir."}], "structure": {"beats": [{"label": "Invocation formula", "labelTr": "Nida formülü", "lines": [{"arabic": "بِسْمِ ٱللَّهِ", "translit": "bismi llāhi", "english": "In/By the name of God", "turkish": "Tanrı'nın adıyla"}]}, {"label": "Divine attribute pair", "labelTr": "İlahi sıfat çifti", "lines": [{"arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "translit": "ar-raḥmāni r-raḥīmi", "english": "the Encompassingly Merciful, the Intimately Merciful", "turkish": "sınırsız merhamet sahibi, yakın merhamet sahibi"}]}], "summary": "The Basmala is a single nominal sentence with no verb. The prepositional phrase bi-smi is a predicate or adverbial modifier whose subject is elided — the implied subject can be \"I begin,\" \"I read,\" \"all action proceeds,\" or the entire Quran itself. The construct chain bismi llāhi binds \"name\" to \"God\" in an iḍāfa (genitive construct), and the two attributes ar-Raḥmān ar-Raḥīm follow as adjectives (ṣifa) in the genitive, agreeing with Allāh. The architecture is: [Prep + Noun-iḍāfa + Adj₁ + Adj₂], where the two adjectives create an internal semantic escalation from comprehensive to intimate mercy.", "summaryTr": "Besmele fiilsiz tek bir isim cümlesidir. bi-smi edatlı tamlaması, öznesi hazfedilmiş bir haber veya zarftır — gizli özne \"başlarım,\" \"okurum,\" \"tüm eylem devam eder\" veya Kur'an'ın kendisi olabilir. bismi llāhi izafe yapısı \"isim\"i \"Tanrı\"ya bağlar ve er-Raḥmān er-Raḥīm sıfatları mecrur halde Allah'a uyum gösterir. Mimari: [Edat + İsim-izafe + Sıfat₁ + Sıfat₂] şeklindedir; iki sıfat kuşatıcı merhametten yakın merhamete doğru anlamsal bir yükseliş yaratır."}, "words": [{"id": 1, "arabic": "بِسْمِ", "translit": "bismi", "gloss": "in/by the name of; by the mark/sign of; through the elevated identity of", "glossTr": "adıyla; işaretiyle; yüce kimliğiyle", "userNotes": "", "root": "س م و (s-m-w)", "grammar": "Prepositional phrase: bi- (preposition of instrumentality/accompaniment) + ism (noun, masculine singular, genitive due to bi-). The initial alif of ism is elided (hamzat al-waṣl drops in construct). ism is a maṣdar or noun from s-m-w meaning \"elevation, mark, name.\" The genitive construct bismi llāhi makes ism the muḍāf and Allāh the muḍāf ilayh.", "grammarTr": "Edatlı tamlama: bi- (araçsallık/beraberlik edatı) + ism (isim, eril tekil, bi- edatından dolayı mecrur). ism'in baştaki elifi hazfedilmiştir (hemzetü'l-vasl izafette düşer). ism, s-m-w kökünden \"yükseklik, işaret, isim\" anlamında mastar veya isimdir. bismi llāhi izafe yapısında ism muzaf, Allah muzafun ileyhtir.", "semantics": ["Root s-m-w (س م و): to be high, to rise, to be elevated, to be lofty", "فَعَا (samā, I): to be high, to rise, to tower; to aspire to; of reputation: to be exalted", "II (sammā): to name, to call by name, to designate", "V (tasammā): to be named, to bear a name, to call oneself", "Noun ism: name, designation, appellation; mark, sign (classical: related to wasm/sima — the distinguishing mark)", "Noun samā': sky, heaven, ceiling, canopy; any elevated expanse", "Lane's Lexicon: ism derives from either s-m-w (elevation — a name elevates/distinguishes its bearer) or w-s-m (mark — a name marks/identifies). Both etymologies are attested in classical grammar.", "Hans Wehr: ism = name, noun (grammatical term); samā' = sky, heaven; samiy = high, exalted, sublime", "Modern extension: ism as \"identifier\" — username, authentication token, digital signature; any system that distinguishes entities", "Futuristic: naming as metadata — the act of classification and indexing that makes information retrievable across systems", "Core concept: elevation and distinction — a name lifts something out of anonymity and marks it as identifiable"], "semanticsTr": ["Kök s-m-w (س م و): yüksek olmak, yükselmek, yücelmek", "فَعَا (semā, I. bab): yüksek olmak, yükselmek, yukarı kalkmak; ün bakımından yücelmek", "II. bab (semmā): isim vermek, adlandırmak, bir isimle çağırmak", "V. bab (tesemmā): adlanmak, bir isim taşımak", "İsim ism: ad, tanımlama, unvan; işaret, nişan (klasik: wasm/sīmā ile ilişkili — ayırt edici işaret)", "İsim semā': gök, cennet, tavan; herhangi bir yüksek alan", "Lane's Lexicon: ism ya s-m-w'dan (yücelik — isim taşıyıcısını yüceltir/ayırt eder) ya da w-s-m'dan (işaret — isim tanımlar) türer. Her iki etimoloji de klasik dilbilgisinde geçerlidir.", "Hans Wehr: ism = isim, ad (dilbilgisi terimi); semā' = gök, cennet; semiyy = yüce, yüksek", "Modern genişleme: ism \"tanımlayıcı\" olarak — kullanıcı adı, doğrulama belirteci, dijital imza; varlıkları ayırt eden her sistem", "Geleceksel: isimlendirme üst veri olarak — bilgiyi sistemler arası erişilebilir kılan sınıflandırma ve dizinleme eylemi", "Kök kavram: yücelik ve ayırt etme — isim bir şeyi anonimlikten çıkarır ve tanınabilir kılar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ism as abstract noun — name, designation, invocation", "count": "~39 ayahs", "examples": [{"ref": "49:11", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا يَسْخَرْ قَوْمٌۭ مِّن قَوْمٍ عَسَىٰٓ أَن يَكُونُوا۟ خَيْرًۭا مِّنْهُمْ وَلَا نِسَآءٌۭ مِّن نِّسَآءٍ عَسَىٰٓ أَن يَكُنَّ خَيْرًۭا مِّنْهُنَّ ۖ وَلَا تَلْمِزُوٓا۟ أَنفُسَكُمْ وَلَا تَنَابَزُوا۟ بِٱلْأَلْقَٰبِ ۖ بِئْسَ ٱلِٱسْمُ ٱلْفُسُوقُ بَعْدَ ٱلْإِيمَٰنِ ۚ وَمَن لَّمْ يَتُبْ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ", "english": "O you who believe, let not a people ridicule another people — they may be better than them. And do not insult one another, and do not call each other by offensive nicknames. Wretched is the ism (name) of disobedience after faith. And whoever does not repent — those are the wrongdoers.", "turkish": "Ey iman edenler! Bir topluluk diğerini alaya almasın — belki onlardan daha hayırlıdırlar. Birbirinizi karalamayın ve birbirinizi kötü lakaplarla çağırmayın. İmandan sonra fasıklık ismi ne kötüdür. Kim tövbe etmezse — işte onlar zalimlerin ta kendileridir."}, {"ref": "55:78", "arabic": "تَبَٰرَكَ ٱسْمُ رَبِّكَ ذِى ٱلْجَلَٰلِ وَٱلْإِكْرَامِ", "english": "Blessed is the ism (name) of your Lord, possessor of majesty and honor.", "turkish": "Celal ve ikram sahibi Rabbinin ismi ne yücedir."}, {"ref": "2:31", "arabic": "وَعَلَّمَ ءَادَمَ ٱلْأَسْمَآءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى ٱلْمَلَٰٓئِكَةِ فَقَالَ أَنۢبِـُٔونِى بِأَسْمَآءِ هَٰٓؤُلَآءِ إِن كُنتُمْ صَٰدِقِينَ", "english": "And He taught Adam the asmā' (names) — all of them. Then He presented them to the angels and said: inform Me of the asmā' (names) of these, if you are truthful.", "turkish": "Ve Adem'e isimlerin tümünü öğretti. Sonra onları meleklere sundu ve dedi: Eğer doğru söylüyorsanız bunların isimlerini bana bildirin."}]}, {"label": "B. samā' as sky/heaven — elevated expanse", "count": "~310 ayahs", "examples": [{"ref": "17:92", "arabic": "أَوْ تُسْقِطَ ٱلسَّمَآءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا أَوْ تَأْتِىَ بِٱللَّهِ وَٱلْمَلَٰٓئِكَةِ قَبِيلًا", "english": "Or you cause the samā' (sky) to fall upon us in fragments, as you have claimed, or you bring God and the angels face to face.", "turkish": "Ya göğü iddia ettiğin gibi üzerimize parçalar halinde düşür ya da Allah'ı ve melekleri karşımıza getir."}, {"ref": "17:99", "arabic": "۞ أَوَلَمْ يَرَوْا۟ أَنَّ ٱللَّهَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ قَادِرٌ عَلَىٰٓ أَن يَخْلُقَ مِثْلَهُمْ وَجَعَلَ لَهُمْ أَجَلًۭا لَّا رَيْبَ فِيهِ فَأَبَى ٱلظَّٰلِمُونَ إِلَّا كُفُورًۭا", "english": "Have they not seen that God, who created the samāwāt (heavens) and the earth, is able to create the like of them? And He appointed for them a term about which there is no doubt. But the wrongdoers refuse all but ingratitude.", "turkish": "Gökleri ve yeri yaratan Allah'ın benzerlerini yaratmaya kadir olduğunu görmediler mi? Onlara kuşkusuz bir vade tayin etti. Ama zalimler küfürden başka bir şeyi reddettiler."}]}]}, "qiraat": [{"arabic": "بِسُمَى", "translit": "bi-sumā", "status": "shawādhdh", "type": "Lvw", "note": "Anomalous reading bi-sumā makes the root s-m-w morphologically transparent (the final wāw appears as alif maqṣūra). This form suggests \"by the elevation/loftiness of\" rather than \"by the name of\" — foregrounding the root's primary sense of height and exaltation. Not in standard Hafs reading.", "noteTr": "Şâz kıraat bi-sumā, s-m-w kökünü morfolojik olarak şeffaf kılar (son vâv elif-i maksûre olarak görünür). Bu form \"adıyla\" yerine \"yüceliğiyle/yüksekliğiyle\" anlamını öne çıkarır — kökün birincil yükseklik ve yücelik anlamını vurgular. Standart Hafs kıraatinde yoktur.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "183", "refs": "1:1;17:92;17:99;17:110;18:14;18:26;18:45;2:19;2:22", "note": "Name/identity paired with divine being — the name invokes and identifies the divine ← IN THIS AYAH", "noteTr": "İsim/kimlik ilahi varlıkla eşleşmiş — isim ilahi olanı çağırır ve tanımlar ← BU AYETTE"}, {"coRoot": "r-h-m", "coRootAr": "ر ح م", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Name/elevation co-occurs with mercy — the divine name is characterized by mercy ← IN THIS AYAH", "noteTr": "İsim/yücelik merhamet ile birlikte geçer — ilahi isim merhamet ile nitelenir ← BU AYETTE"}], "critical": "The word bismi is one of the most analyzed constructs in Arabic grammar. The elision of the initial alif of ism (becoming bi-smi rather than bi-ismi) is unique to the Basmala formula. Classical grammarians debated whether ism derives from s-m-w (elevation — \"a name elevates its bearer above anonymity\") or w-s-m (marking — \"a name is a distinguishing mark\"). Both etymologies are grammatically defensible and semantically complementary. The shawādhdh variant bi-sumā makes the s-m-w derivation morphologically explicit, showing the root's final wāw. This variant, though non-canonical, serves as evidence for the s-m-w etymology. The implied verb (the elided subject of the prepositional phrase) is debated: \"I begin\" (abdaʾu), \"I read\" (aqraʾu), or \"I seek aid\" (astaʿīnu). Each implied verb changes the semantic force of the Basmala. The construct allows ALL of these simultaneously — the absence of the verb is itself meaningful, creating a formula that applies to any action.", "criticalTr": "Bismi kelimesi Arap dilbilgisinin en çok tartışılan yapılarından biridir. ism'in baştaki elifinin hazfi (bi-ismi yerine bi-smi) Besmele formülüne özgüdür. Klasik dilciler ism'in s-m-w'dan mı (yücelik — \"isim taşıyıcısını anonimlikten yüceltir\") yoksa w-s-m'dan mı (işaretleme — \"isim ayırt edici bir nişandır\") türediğini tartışmışlardır. Her iki etimoloji de dilbilgisel olarak savunulabilir ve anlamsal olarak tamamlayıcıdır. Şâz kıraat bi-sumā, s-m-w türetimini morfolojik olarak açık kılar ve kökün son vâv'ını gösterir. Bu kıraat kanonik olmasa da s-m-w etimolojisi için kanıt niteliğindedir. Gizli fiil (edatlı tamlamanın hazfedilmiş öznesi) tartışmalıdır: \"başlarım\" (ebdeʾu), \"okurum\" (eqreʾu) veya \"yardım dilerim\" (esteʿīnu). Her gizli fiil Besmele'nin anlamsal gücünü değiştirir. Yapı bunların tümüne aynı anda izin verir — fiilin yokluğu başlı başına anlamlıdır ve her eyleme uygulanabilir bir formül yaratır.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 2, "arabic": "ٱللَّهِ", "translit": "allāhi", "gloss": "God; the Divine; the deity", "glossTr": "Tanrı; ilah; mabud", "userNotes": "", "root": "أ ل ه ('-l-h)", "grammar": "Proper noun (ism 'alam), masculine, genitive (majrūr) as muḍāf ilayh in the construct bismi llāhi. The word Allāh is typically analyzed as al- (definite article) + ilāh (deity), with the hamza of ilāh elided and the lām assimilated, yielding Allāh. Others treat it as a primary proper noun not derived from ilāh.", "grammarTr": "Özel isim (ism-i alem), eril, izafe yapısında muzafun ileyh olarak mecrur halde. Allah kelimesi genellikle el- (harf-i tarif) + ilāh (tanrı) olarak çözümlenir; ilāh'ın hemzesi hazfedilir ve lâm idğam olur, sonuç Allah olur. Bazıları onu ilāh'tan türetilmemiş birincil bir özel isim olarak kabul eder.", "semantics": ["Root '-l-h (أ ل ه): to worship, to adore; to be bewildered, perplexed; to seek refuge", "فَعَلَ (aliha, I): to be bewildered, perplexed, confused; to be anxious; to seek refuge or protection (Lane's: aliha ilayhi = he betook himself to him for refuge)", "فَعَلَ (alaha, I): to worship, to serve with devotion", "تَفَعَّلَ (taʾallaha, V): to deify, to assume divine attributes, to make oneself god", "Noun ilāh: deity, god, object of worship; anything to which one turns for refuge or direction", "Lane's Lexicon: the root conveys both \"worship/devotion\" and \"bewilderment/perplexity\" — the one worshipped is the one before whom one is bewildered, lost, overwhelmed. Also: alihat al-farṣa = the foal was yearning for its mother (= deep attachment, dependent longing)", "Lisan al-Arab: ilāh is that to which hearts turn in worship, longing, or fear. The root connects worship (ʿibāda), refuge (iltijāʾ), and bewilderment (ḥayra) — all three converge in the concept of deity", "Hans Wehr: Allāh = God (in Islam); ilāh = god, deity, divine being", "Modern/futuristic: the concept of ilāh as \"that which commands ultimate attention and devotion\" — can extend to any ultimate concern or system of absolute authority", "Core concept: the convergence of worship, bewilderment, and refuge — the divine is simultaneously that before which one is overwhelmed, to which one turns for shelter, and which one serves with devotion"], "semanticsTr": ["Kök '-l-h (أ ل ه): ibadet etmek, tapınmak; şaşkına dönmek, hayrete düşmek; sığınmak", "فَعَلَ (elihe, I. bab): şaşkına dönmek, hayrete düşmek, kaygılanmak; sığınmak (Lane's: elihe ileyhi = ona sığındı)", "فَعَلَ (elehe, I. bab): ibadet etmek, kulluk etmek", "تَفَعَّلَ (teellehe, V. bab): ilahlaştırmak, ilahi sıfatlar edinmek", "İsim ilāh: tanrı, mabud, ibadet edilen; sığınılan veya yönelinilen her şey", "Lane's Lexicon: kök hem \"ibadet/kulluk\" hem \"şaşkınlık/hayret\" anlamı taşır — ibadet edilen, karşısında hayrete düşülen, kaybolunandır. Ayrıca: elihet el-ferse = tay annesini özlüyordu (= derin bağlılık, bağımlı özlem)", "Lisan al-Arab: ilāh kalplerin ibadet, özlem veya korku ile yöneldiği şeydir. Kök ibadeti (ʿibāde), sığınmayı (ilticā) ve hayreti (hayra) birbirine bağlar — üçü tanrılık kavramında birleşir", "Hans Wehr: Allāh = Tanrı (İslam'da); ilāh = tanrı, ilah, ilahi varlık", "Modern/geleceksel: ilāh kavramı \"nihai dikkat ve bağlılığı buyuran\" olarak — herhangi bir nihai kaygı veya mutlak otorite sistemine genişleyebilir", "Kök kavram: ibadet, hayret ve sığınmanın birleşimi — ilahi olan aynı anda karşısında hayrete düşülen, sığınılan ve kulluk edilendir"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Allāh as proper noun — agent/subject of divine action", "count": "~2704 ayahs", "examples": [{"ref": "2:159", "arabic": "إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ ٱلْبَيِّنَٰتِ وَٱلْهُدَىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِى ٱلْكِتَٰبِ ۙ أُو۟لَٰٓئِكَ يَلْعَنُهُمُ ٱللَّهُ وَيَلْعَنُهُمُ ٱللَّٰعِنُونَ", "english": "Indeed, those who conceal what We sent down of clear proofs and guidance after We made it clear for people in the Scripture — those are cursed by Allāh and cursed by the cursers.", "turkish": "Apaçık delilleri ve hidayeti — Kitap'ta insanlara açıkladıktan sonra — gizleyenler var ya, onlara hem Allah lanet eder hem de lanetçiler lanet eder."}, {"ref": "8:7", "arabic": "وَإِذْ يَعِدُكُمُ ٱللَّهُ إِحْدَى ٱلطَّآئِفَتَيْنِ أَنَّهَا لَكُمْ وَتَوَدُّونَ أَنَّ غَيْرَ ذَاتِ ٱلشَّوْكَةِ تَكُونُ لَكُمْ وَيُرِيدُ ٱللَّهُ أَن يُحِقَّ ٱلْحَقَّ بِكَلِمَٰتِهِۦ وَيَقْطَعَ دَابِرَ ٱلْكَٰفِرِينَ", "english": "And when Allāh was promising you one of the two groups — that it would be yours — and you wished that the unarmed one would be yours. But Allāh intended to establish the truth by His words and cut off the root of the disbelievers.", "turkish": "Allah size iki gruptan birinin sizin olacağını vaat ediyordu ve siz silahsız olanın sizin olmasını istiyordunuz. Oysa Allah kelimeleriyle hakkı yerleştirmek ve kafirlerin kökünü kesmek istiyordu."}, {"ref": "11:6", "arabic": "۞ وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّۭ فِى كِتَٰبٍۢ مُّبِينٍۢ", "english": "And there is no creature on earth but that upon Allāh is its provision, and He knows its place of settlement and its place of storage. All is in a clear record.", "turkish": "Yeryüzünde hiçbir canlı yoktur ki rızkı Allah'a ait olmasın. Onun yerleşim yerini de deposunu da bilir. Hepsi apaçık bir kitaptadır."}]}, {"label": "B. ilāh as common noun — deity, object of worship", "count": "~147 ayahs", "examples": [{"ref": "17:110", "arabic": "قُلِ ٱدْعُوا۟ ٱللَّهَ أَوِ ٱدْعُوا۟ ٱلرَّحْمَٰنَ ۖ أَيًّۭا مَّا تَدْعُوا۟ فَلَهُ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ ۚ وَلَا تَجْهَرْ بِصَلَاتِكَ وَلَا تُخَافِتْ بِهَا وَٱبْتَغِ بَيْنَ ذَٰلِكَ سَبِيلًۭا", "english": "Say: call upon Allāh or call upon ar-Raḥmān — whichever you call, to Him belong the most beautiful asmā' (names). And do not be loud in your prayer nor silent, but seek between that a way.", "turkish": "De ki: Allah diye çağırın ya da Raḥmān diye — hangisini çağırırsanız çağırın, en güzel isimler O'nundur. Namazında sesini yükseltme, kısma da; ikisi arasında bir yol tut."}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "s-m-w", "coRootAr": "س م و", "count": "183", "refs": "1:1;17:92;17:99;17:110;18:14;18:26;18:45;2:19;2:22", "note": "Divine being paired with name/elevation — God is the named, the elevated ← IN THIS AYAH", "noteTr": "İlahi varlık isim/yücelik ile eşleşmiş — Tanrı isimlenen, yüceltilendir ← BU AYETTE"}, {"coRoot": "r-h-m", "coRootAr": "ر ح م", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Divine being paired with mercy — God's identity is inseparable from raḥma ← IN THIS AYAH", "noteTr": "İlahi varlık merhamet ile eşleşmiş — Tanrı'nın kimliği rahmetten ayrılmaz ← BU AYETTE"}, {"coRoot": "s-w-d", "coRootAr": "س و د", "count": "5", "refs": "1:2;2:187;3:39;35:27;39:60", "note": "Divine being co-occurs with root s-w-d (blackness/mastery/leadership) — theological tension between lordship and darkness imagery", "noteTr": "İlahi varlık s-w-d kökü (siyahlık/efendilik/liderlik) ile birlikte geçer — efendilik ile karanlık imgesi arasında teolojik gerilim"}], "critical": "The word Allāh is the most frequently occurring word in the Quran (2853 occurrences). The root '-l-h carries a triple semantic core: worship (ʿibāda), bewilderment (ḥayra), and refuge (iltijāʾ). Lane's Lexicon records that aliha can mean \"he was bewildered, perplexed\" — suggesting that the very concept of deity involves being overwhelmed beyond comprehension. The etymological debate (is Allāh from al-ilāh or a primary proper noun?) remains unresolved and both positions are grammatically valid. If from al-ilāh, the definite article marks uniqueness (\"THE deity,\" implying there is only one). If a primary noun, it predates the category of \"deity\" entirely. The word appears here in the genitive as the second term of an iḍāfa (construct), making God the possessor of the name — or alternatively, making the name an attribute OF God. The phonetic weight of Allāh — the emphatic lām, the deep ā vowel — creates a sonic gravity that anchors the entire Basmala.", "criticalTr": "Allah kelimesi Kur'an'ın en sık geçen sözcüğüdür (2853 kez). '-l-h kökü üçlü bir anlam çekirdeği taşır: ibadet (ʿibāde), hayret (hayra) ve sığınma (ilticā). Lane's Lexicon elihe'nin \"şaşkına döndü, hayrete düştü\" anlamına gelebileceğini kaydeder — bu, tanrılık kavramının kavrayışın ötesinde bunalmayı içerdiğini düşündürür. Etimolojik tartışma (Allah el-ilāh'tan mı türer yoksa birincil bir özel isim mi?) çözümsüz kalır ve her iki konum da dilbilgisel olarak geçerlidir. el-ilāh'tan ise harf-i tarif tekliği belirtir (\"tanrı\" değil \"TEK tanrı\"). Birincil isimse \"tanrı\" kategorisinin kendisinden önce gelir. Kelime burada izafenin ikinci terimi olarak mecrur haldedir ve Tanrı'yı ismin sahibi kılar — ya da alternatif olarak ismi Tanrı'nın bir sıfatı yapar. Allah'ın fonetik ağırlığı — vurgulu lâm, derin ā ünlüsü — tüm Besmele'yi sabitleyen sonik bir ağırlık merkezi yaratır.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "ٱلرَّحْمَٰنِ", "translit": "ar-raḥmāni", "gloss": "the Encompassingly Merciful; the Mercy-Saturated; the Overwhelmingly Compassionate", "glossTr": "sınırsız merhamet sahibi; merhamet dolu; baskın şefkat sahibi", "userNotes": "", "root": "ر ح م (r-h-m)", "grammar": "Proper noun or adjective (ism ṣifa), masculine singular, genitive (majrūr) as attributive adjective (naʿt/ṣifa) following Allāh. Pattern fa'lān (فَعْلَان) — an intensive/hyperbolic form (ṣīghat al-mubālagha) denoting one who is overwhelmed by or saturated with the quality. The fa'lān pattern typically indicates temporary but intense states (cf. 'aṭshān/thirsty, ghaḍbān/angry, sakrān/drunk). Applied to God, this creates a theological paradox: a \"temporary\" pattern denoting an eternal attribute.", "grammarTr": "Özel isim veya sıfat (ism-i sıfat), eril tekil, Allah'ı niteleyen sıfat (naʿt/sıfa) olarak mecrur halde. fa'lān (فَعْلَان) kalıbı — mübalağa sîgası, niteliğe batmış veya boğulmuş olanı ifade eder. fa'lān kalıbı genellikle geçici ama yoğun durumları belirtir (kr. 'aṭşān/susamış, ğaḍbān/kızgın, sekrān/sarhoş). Tanrı'ya uygulandığında teolojik bir paradoks yaratır: ebedi bir sıfat için \"geçici\" bir kalıp.", "semantics": ["Root r-h-m (ر ح م): mercy, compassion, womb, kinship", "فَعِلَ (raḥima, I): to have mercy on, to be compassionate toward, to show tenderness", "II (raḥḥama): to ask for mercy, to say \"God have mercy on him\"", "V (taraḥḥama): to show mercy, to be merciful (reflexive/intensive)", "Noun raḥma: mercy, compassion, tenderness, kindness; rain (as mercy from sky)", "Noun raḥim/riḥm: womb, uterus; kinship, blood ties (the bond of the womb)", "Lane's Lexicon: ar-raḥmān is a name exclusively applied to God, denoting the abundance and comprehensiveness of His mercy extending to all creatures. Distinguished from ar-raḥīm which denotes mercy specifically to believers (though this is debated).", "Lane's Lexicon (additional): raḥima also means \"he pitied, had pity on\"; raḥm = the place where the young is formed (womb) — mercy and creation are etymologically linked", "Lisan al-Arab: ar-raḥmān denotes the one whose mercy encompasses everything — al-raḥma al-ʿāmma. It cannot be applied to any being other than God. The pattern fa'lān expresses fullness and saturation with the quality.", "Hans Wehr: raḥma = mercy, compassion, pity; raḥīm = merciful, compassionate; raḥmān = most gracious, most merciful (divine epithet)", "Modern extension: raḥma as systemic care — institutional mercy, social safety nets, universal basic provisions; any system designed to prevent suffering", "The womb (raḥim) connection: mercy is not abstract kindness but the nurturing, protective enclosure that enables growth — like a womb sustaining life", "Core concept: mercy as generative nurturing — the root links compassion to the womb, making mercy not an emotion but a creative, sustaining force"], "semanticsTr": ["Kök r-h-m (ر ح م): merhamet, şefkat, rahim, akrabalık", "فَعِلَ (rahime, I. bab): merhamet etmek, şefkat göstermek, yumuşak davranmak", "II. bab (rahhame): merhamet dilemek, \"Allah rahmet etsin\" demek", "V. bab (terahhame): merhamet göstermek (dönüşlü/yoğun)", "İsim rahme: merhamet, şefkat, yumuşaklık; yağmur (gökten gelen rahmet olarak)", "İsim rahim/rihm: rahim, döl yatağı; akrabalık, kan bağı (rahmin bağı)", "Lane's Lexicon: er-Raḥmān yalnızca Tanrı'ya uygulanan bir isimdir, O'nun rahmetinin bolluğunu ve tüm yaratıklara uzanan kuşatıcılığını ifade eder. Yalnızca müminlere yönelik rahmeti ifade eden er-Raḥīm'den ayrılır (bu tartışmalı olmakla birlikte).", "Lisan al-Arab: er-Raḥmān rahmeti her şeyi kuşatan olanı ifade eder — rahmet-i āmme. Tanrı dışında hiçbir varlığa uygulanamaz. fa'lān kalıbı niteliğe doluluk ve doygunluk ifade eder.", "Hans Wehr: rahme = merhamet, şefkat, acıma; rahīm = merhametli, şefkatli; rahmān = en lütufkar, en merhametli (ilahi sıfat)", "Modern genişleme: rahme sistemik bakım olarak — kurumsal merhamet, sosyal güvenlik ağları, evrensel temel sağlama; acıyı önlemek için tasarlanmış her sistem", "Rahim (döl yatağı) bağlantısı: merhamet soyut bir iyilik değil, büyümeyi sağlayan besleyici koruyucu kuşatmadır — bir rahimin hayatı sürdürmesi gibi", "Kök kavram: doğurgan besleyicilik olarak merhamet — kök şefkati rahime bağlar, merhameti bir duygu değil yaratıcı ve sürdürücü bir güç kılar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ar-Raḥmān as divine proper name/attribute", "count": "~91 ayahs", "examples": [{"ref": "1:3", "arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "ar-Raḥmān (the Encompassingly Merciful), ar-Raḥīm (the Intimately Merciful) — repeated from the Basmala as a separate ayah, emphasizing these attributes as the first content of the surah after the opening formula.", "turkish": "er-Raḥmān (sınırsız merhamet sahibi), er-Raḥīm (yakın merhamet sahibi) — açılış formülünden sonra ayrı bir ayet olarak tekrarlanır, bu sıfatları surenin ilk içeriği olarak vurgular."}, {"ref": "19:58", "arabic": "أُو۟لَٰٓئِكَ ٱلَّذِينَ أَنْعَمَ ٱللَّهُ عَلَيْهِم مِّنَ ٱلنَّبِيِّۦنَ مِن ذُرِّيَّةِ ءَادَمَ وَمِمَّنْ حَمَلْنَا مَعَ نُوحٍۢ وَمِن ذُرِّيَّةِ إِبْرَٰهِيمَ وَإِسْرَٰٓءِيلَ وَمِمَّنْ هَدَيْنَا وَٱجْتَبَيْنَآ ۚ إِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَٰتُ ٱلرَّحْمَٰنِ خَرُّوا۟ سُجَّدًۭا وَبُكِيًّۭا ۩", "english": "Those are the ones upon whom God bestowed favor — among the prophets from the descendants of Adam, and of those We carried with Noah, and of the descendants of Ibrahim and Isra'il, and of those We guided and chose. When the āyāt (signs) of ar-Raḥmān were recited to them, they fell in prostration and weeping.", "turkish": "İşte bunlar Allah'ın nimet verdiği peygamberlerdendir — Adem'in soyundan, Nuh ile birlikte taşıdıklarımızdan, İbrahim ve İsrail soyundan ve hidayet edip seçtiklerimizden. Onlara Raḥmān'ın ayetleri okunduğunda secdeye kapanır ağlarlardı."}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And rely upon the Almighty, ar-Raḥīm (the Intimately Merciful).", "turkish": "Aziz ve Rahîm olana tevekkül et."}]}, {"label": "B. raḥma as verbal noun/gerund — mercy as action", "count": "~114 ayahs", "examples": [{"ref": "18:16", "arabic": "وَإِذِ ٱعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا ٱللَّهَ فَأْوُۥٓا۟ إِلَى ٱلْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِۦ وَيُهَيِّئْ لَكُم مِّنْ أَمْرِكُم مِّرْفَقًۭا", "english": "And when you have withdrawn from them and what they worship other than God, then retreat to the cave. Your Lord will spread for you of His raḥma (mercy) and will facilitate for you from your affair comfort.", "turkish": "Onlardan ve Allah'tan başka taptıkları şeylerden ayrıldığınızda mağaraya sığının. Rabbiniz rahmetinden size yayar ve işinizden size bir kolaylık hazırlar."}, {"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا", "english": "He said: this is a raḥma (mercy) from my Lord. But when the promise of my Lord comes, He will make it level — and the promise of my Lord is ever true.", "turkish": "Dedi: Bu Rabbimden bir rahmettir. Rabbimin vaadi geldiğinde onu dümdüz yapar. Rabbimin vaadi haktır."}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Gramm", "type": "CE", "note": "Accusative case ending (fatḥa) instead of genitive (kasra). This grammatical variant re-parses ar-Raḥmān ar-Raḥīm as accusative, possibly as ḥāl (circumstantial — \"while being the Merciful\") or as a separate exclamatory accusative (naṣb 'alā l-madḥ — \"I praise the Merciful\"), breaking it from the genitive chain of bismi llāhi. This changes the syntactic relationship: instead of attributes OF God, they become independent praise-acts.", "noteTr": "Mecrur (kesra) yerine mansub (fetḥa) çekimi. Bu dilbilgisel varyant er-Raḥmān er-Raḥīm'i mansub olarak çözümler; hâl (durum zarfı — \"merhametli olarak\") veya müstakil medih mansûbu (naṣb ale'l-medḥ — \"merhametliyi överim\") olarak. Bu, bismi llāhi izafe zincirinden koparır. Sözdizimsel ilişkiyi değiştirir: Tanrı'nın sıfatları olmak yerine bağımsız övgü eylemleri olurlar.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Gramm", "type": "CE", "note": "Nominative case ending (ḍamma). This variant makes ar-Raḥmān ar-Raḥīm the subject of a nominal sentence (mubtadaʾ) with an elided predicate, or an appositional nominative (badal marfūʿ). It detaches the mercy-attributes from the genitive chain and grants them independent syntactic status — \"the Merciful, the Compassionate [is the one invoked].\"", "noteTr": "Merfû (damme) çekimi. Bu varyant er-Raḥmān er-Raḥīm'i isim cümlesinin mübtedası (gizli haberi olan) veya bedel-i merfû yapar. Merhamet sıfatlarını izafe zincirinden koparır ve onlara bağımsız sözdizimsel statü verir — \"Merhametli, Rahîm olan [çağırılan O'dur].\"", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Mercy-root paired with divine being — God's identity defined through mercy ← IN THIS AYAH", "noteTr": "Merhamet kökü ilahi varlıkla eşleşmiş — Tanrı'nın kimliği merhamet üzerinden tanımlanır ← BU AYETTE"}, {"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Mercy paired with name/elevation — mercy is the content of the divine name ← IN THIS AYAH", "noteTr": "Merhamet isim/yücelik ile eşleşmiş — merhamet ilahi ismin içeriğidir ← BU AYETTE"}, {"coRoot": "w-l-y", "coRootAr": "و ل ي", "count": "15", "refs": "2:64;2:226;2:286;7:155;8:75;9:71;18:58;19:45;28:43;33:5", "note": "Mercy co-occurs with walāya (closeness/authority/guardianship) — mercy as an expression of divine proximity and care", "noteTr": "Merhamet velāyet (yakınlık/otorite/himaye) ile birlikte geçer — merhamet ilahi yakınlık ve bakımın ifadesi"}], "critical": "ar-Raḥmān uses the fa'lān pattern (فَعْلَان), which in Arabic typically denotes temporary, overwhelming states: ʿaṭshān (desperately thirsty), ghaḍbān (consumed by anger), sakrān (intoxicated). Applied to the divine, this creates a fundamental paradox: a morphological pattern that signals transient intensity is used for an eternal attribute. This can mean: (1) God's mercy is experienced as a continuously renewed surge — not a static quality but an ever-active state; (2) the \"temporary\" pattern signals that mercy is volitional, not merely constitutional — God chooses to be in this state perpetually; (3) the pattern highlights the experiential dimension — those who receive this mercy experience it as overwhelming, saturating, all-encompassing. The word ar-Raḥmān is treated as a proper noun (ism ʿalam) — it cannot be applied to any being other than God, unlike ar-Raḥīm which can describe humans. The qira'at variants (accusative and nominative) suggest the text structurally allows ar-Raḥmān to be syntactically independent from the genitive chain — an autonomous divine self-declaration rather than merely an adjective modifying Allāh.", "criticalTr": "er-Raḥmān, fa'lān (فَعْلَان) kalıbını kullanır; bu kalıp Arapça'da genellikle geçici, baskın durumları ifade eder: ʿaṭşān (şiddetle susamış), ğaḍbān (öfkeye kapılmış), sekrān (sarhoş). İlahi olana uygulandığında temel bir paradoks yaratır: geçici yoğunluk işaret eden morfolojik kalıp ebedi bir sıfat için kullanılır. Bu şu anlama gelebilir: (1) Tanrı'nın rahmeti sürekli yenilenen bir kabarmadır — statik bir nitelik değil, her daim aktif bir durum; (2) \"geçici\" kalıp rahmetin iradi olduğunu işaret eder — salt doğasal değil, Tanrı bu durumda olmayı sürekli seçer; (3) kalıp deneyimsel boyutu vurgular — bu rahmeti alanlar onu baskın, kuşatıcı, her şeyi kaplayan olarak deneyimler. er-Raḥmān özel isim (ism-i alem) olarak kabul edilir — insanlara da uygulanabilen er-Raḥīm'den farklı olarak Tanrı dışında hiçbir varlığa uygulanamaz. Kıraat varyantları (mansub ve merfû) metnin er-Raḥmān'ın izafe zincirinden sözdizimsel olarak bağımsız olmasına yapısal olarak izin verdiğini gösterir — salt Allah'ı niteleyen bir sıfat yerine özerk bir ilahi öz-beyan.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 4, "arabic": "ٱلرَّحِيمِ", "translit": "ar-raḥīmi", "gloss": "the Intimately Merciful; the Mercy-Sustaining; the Enduringly Compassionate", "glossTr": "yakın merhamet sahibi; merhamet sürdüren; kalıcı şefkat sahibi", "userNotes": "", "root": "ر ح م (r-h-m)", "grammar": "Proper noun or adjective (ism ṣifa), masculine singular, genitive (majrūr) as second attributive adjective (naʿt thānī) following Allāh and ar-Raḥmān. Pattern fa'īl (فَعِيل) — denotes a permanent, inherent quality (ṣifa dāʾima). Unlike the fa'lān of Raḥmān (which suggests intensity of state), fa'īl suggests that mercy is a constitutional, enduring attribute — something God simply IS, not something God is currently in a state of. This pattern can be applied to humans (a person can be raḥīm), unlike Raḥmān.", "grammarTr": "Özel isim veya sıfat (ism-i sıfat), eril tekil, Allah ve er-Raḥmān'ı takip eden ikinci naʿt olarak mecrur halde. fa'īl (فَعِيل) kalıbı — kalıcı, özsel bir niteliği ifade eder (sıfat-ı dāime). Raḥmān'ın fa'lān kalıbından (durum yoğunluğu) farklı olarak fa'īl, rahmetin yapısal ve kalıcı bir sıfat olduğunu ima eder — Tanrı'nın o anda içinde olduğu bir durum değil, salt olduğu şey. Bu kalıp insanlara da uygulanabilir (bir kişi rahīm olabilir), Raḥmān'dan farklı olarak.", "semantics": ["Root r-h-m (ر ح م): [same root as word 3 — see above for full semantic range]", "fa'īl (raḥīm): one who possesses mercy as a permanent, inherent quality; enduringly compassionate", "Lane's Lexicon: ar-raḥīm denotes the one who exercises raḥma specifically, relationally, towards particular beings. Distinguished from ar-raḥmān's universal scope by its personal, directed quality.", "The fa'īl pattern (like ʿalīm/knowing, ḥakīm/wise, karīm/generous) denotes stable, constitutional attributes — things that define an entity's essential nature", "Modern extension: raḥīm as \"the one who sustains care\" — ongoing support, not just an initial act of mercy but continued provision", "Core concept: mercy as permanent constitution — not a surge but an abiding quality that defines the essential nature of its bearer"], "semanticsTr": ["Kök r-h-m (ر ح م): [3. kelimeyle aynı kök — tam anlam alanı için yukarıya bakınız]", "fa'īl (rahīm): rahmeti kalıcı ve özsel bir nitelik olarak taşıyan; süregelen şefkat sahibi", "Lane's Lexicon: er-rahīm rahmeti özellikle, ilişkisel olarak, belirli varlıklara yönelten olanı ifade eder. er-rahmān'ın evrensel kapsamından kişisel ve yönlendirilmiş niteliğiyle ayrılır.", "fa'īl kalıbı (ʿalīm/bilen, hakīm/bilge, kerīm/cömert gibi) sabit, yapısal sıfatları ifade eder — bir varlığın özsel doğasını tanımlayan şeyler", "Modern genişleme: rahīm \"bakımı sürdüren\" olarak — süregelen destek, salt ilk bir merhamet eylemi değil devam eden sağlama", "Kök kavram: kalıcı yapı olarak merhamet — bir kabarma değil, taşıyıcısının özsel doğasını tanımlayan kalıcı bir nitelik"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ar-Raḥīm as divine attribute", "count": "~91 ayahs", "examples": [{"ref": "2:226", "arabic": "لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍۢ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ", "english": "For those who swear to abstain from their wives, a waiting of four months. If they return — then indeed God is forgiving, raḥīm (enduringly merciful).", "turkish": "Eşlerinden uzak durmaya yemin edenler için dört ay bekleme süresi vardır. Dönerlerse — Allah bağışlayan ve rahîm olandır."}, {"ref": "3:129", "arabic": "وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ", "english": "To God belongs what is in the heavens and what is on the earth. He forgives whom He wills and punishes whom He wills. And God is forgiving, raḥīm (enduringly merciful).", "turkish": "Göklerde ve yerde ne varsa Allah'ındır. Dilediğini bağışlar, dilediğine azap eder. Allah bağışlayandır, rahîm olandır."}]}, {"label": "B. raḥīm as human quality — compassionate person", "count": "~21 ayahs", "examples": [{"ref": "19:58", "arabic": "أُو۟لَٰٓئِكَ ٱلَّذِينَ أَنْعَمَ ٱللَّهُ عَلَيْهِم مِّنَ ٱلنَّبِيِّۦنَ مِن ذُرِّيَّةِ ءَادَمَ وَمِمَّنْ حَمَلْنَا مَعَ نُوحٍۢ وَمِن ذُرِّيَّةِ إِبْرَٰهِيمَ وَإِسْرَٰٓءِيلَ وَمِمَّنْ هَدَيْنَا وَٱجْتَبَيْنَآ ۚ إِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَٰتُ ٱلرَّحْمَٰنِ خَرُّوا۟ سُجَّدًۭا وَبُكِيًّۭا ۩", "english": "Those upon whom God bestowed favor among the prophets — from Adam's descendants, from those carried with Noah, from Ibrahim's and Isra'il's descendants, from those We guided and chose. When ar-Raḥmān's signs were recited to them, they fell in prostration and weeping.", "turkish": "Allah'ın nimet verdiği peygamberlerden — Adem soyundan, Nuh ile taşıdıklarımızdan, İbrahim ve İsrail soyundan, hidayet edip seçtiklerimizden. Raḥmān'ın ayetleri onlara okunduğunda secdeye kapanır ağlarlardı."}]}]}, "qiraat": [{"arabic": "الرَّحِيمَ", "translit": "ar-raḥīma", "status": "Gramm", "type": "CE", "note": "Accusative case ending — same structural implications as the ar-Raḥmān accusative variant. Detaches ar-Raḥīm from the genitive chain, potentially as naṣb ʿalā l-madḥ (accusative of praise).", "noteTr": "Mansub çekimi — er-Raḥmān mansub varyantıyla aynı yapısal sonuçlar. er-Raḥīm'i izafe zincirinden koparır, olası naṣb ʿale'l-medḥ (övgü mansûbu) olarak.", "source": "erquran.org"}, {"arabic": "الرَّحِيمْ｡ أَلْحَمْدُ", "translit": "ar-raḥīm. al-ḥamdu", "status": "Irreg", "type": "waqf", "note": "This variant pauses (waqf) on ar-raḥīm with sukūn and begins a new sentence with al-ḥamdu. This splits the Basmala from al-Fātiḥa, making them two independent textual units rather than continuous. The semantic impact: the Basmala becomes a self-contained invocation, and \"al-ḥamdu li-llāhi\" begins as a fresh declaration.", "noteTr": "Bu varyant er-rahīm üzerinde sukûn ile durur (vakf) ve el-hamdu ile yeni bir cümle başlatır. Besmele'yi Fâtiha'dan ayırır, ikisini sürekli değil iki bağımsız metin birimi yapar. Anlamsal etki: Besmele kendi başına bir nida olur ve \"el-hamdu li-llāhi\" taze bir beyan olarak başlar.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Gramm", "type": "CE", "note": "[Same as word 3 variant — accusative pair. Both attributes shift to accusative together.]", "noteTr": "[3. kelimenin varyantıyla aynı — mansub çift. Her iki sıfat birlikte mansuba geçer.]", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Gramm", "type": "CE", "note": "[Same as word 3 variant — nominative pair. Both attributes shift to nominative together.]", "noteTr": "[3. kelimenin varyantıyla aynı — merfû çift. Her iki sıfat birlikte merfûa geçer.]", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Enduring mercy paired with divine being ← IN THIS AYAH", "noteTr": "Kalıcı merhamet ilahi varlıkla eşleşmiş ← BU AYETTE"}, {"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Enduring mercy paired with name/elevation ← IN THIS AYAH", "noteTr": "Kalıcı merhamet isim/yücelik ile eşleşmiş ← BU AYETTE"}], "critical": "ar-Raḥīm uses the fa'īl pattern (فَعِيل), denoting permanent, constitutional qualities — like ʿalīm (ever-knowing), ḥakīm (inherently wise), kabīr (inherently great). Where ar-Raḥmān (fa'lān) signals a state of mercy that overwhelms and surges, ar-Raḥīm (fa'īl) signals mercy as essential nature — not a chosen state but an inherent quality. Together, the two create a complementary pair: mercy that is both an active, overwhelming experience AND an enduring, constitutional attribute. The sequence Raḥmān → Raḥīm can be read as a narrowing arc: from the universal (all creation receives this overwhelming mercy) to the personal (specific beings receive sustained, relational mercy). Alternatively, it escalates from the experiential (you FEEL this mercy — it overwhelms) to the ontological (this mercy IS — it defines God's nature). The fa'lān → fa'īl progression mirrors other Quranic patterns where temporary states give way to permanent truths. The fact that Raḥīm can describe humans but Raḥmān cannot suggests that human mercy is always fa'īl (a character trait) but never fa'lān (the total saturation that only the divine can sustain). The qira'at variants (accusative, nominative, waqf) collectively demonstrate that the text allows these two attributes to be parsed as syntactically independent from the Allāh genitive — either as autonomous praise or as a separate nominal sentence.", "criticalTr": "er-Raḥīm, fa'īl (فَعِيل) kalıbını kullanır — kalıcı, yapısal nitelikleri ifade eder: ʿalīm (her daim bilen), ḥakīm (doğası gereği bilge), kebīr (doğası gereği büyük) gibi. er-Raḥmān (fa'lān) baskın ve kabaran bir merhamet durumu işaret ederken, er-Raḥīm (fa'īl) rahmeti özsel doğa olarak işaret eder — seçilmiş bir durum değil, doğuştan bir nitelik. Birlikte tamamlayıcı bir çift oluştururlar: hem aktif, baskın bir deneyim HEM DE kalıcı, yapısal bir sıfat olan merhamet. Raḥmān → Raḥīm sıralaması daralan bir yay olarak okunabilir: evrenselden (tüm yaratılış bu baskın rahmeti alır) kişisele (belirli varlıklar süregelen, ilişkisel rahmet alır). Alternatif olarak deneyimsel olandan (bu rahmeti HİSSEDERSİNİZ — baskındır) ontolojik olana (bu rahmet VARDIR — Tanrı'nın doğasını tanımlar) yükselir. fa'lān → fa'īl ilerlemesi geçici durumların kalıcı gerçeklere dönüştüğü diğer Kur'anî kalıpları yansıtır. Raḥīm'in insanları niteleyebilmesi ama Raḥmān'ın niteleyememesi, insan merhametinin her zaman fa'īl (karakter özelliği) ama asla fa'lān (yalnızca ilahi olanın sürdürebileceği tam doygunluk) olduğunu düşündürür. Kıraat varyantları (mansub, merfû, vakf) toplu olarak metnin bu iki sıfatın Allah mecrûrundan sözdizimsel olarak bağımsız çözümlenmesine izin verdiğini gösterir — özerk övgü veya ayrı bir isim cümlesi olarak.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Basmala elide the verb? What is gained by leaving the implied action unspecified — does this make the formula applicable to all possible actions simultaneously?", "The etymological dispute over ism (from s-m-w \"elevation\" vs w-s-m \"marking\") — if both are correct, does the Basmala simultaneously invoke elevation AND identification? Is a name both a mark and a lifting-up?", "The fa'lān → fa'īl progression (Raḥmān → Raḥīm): does this mirror a movement from the experiential to the ontological? Is the text saying \"you experience God's mercy as an overwhelming surge, but it IS God's permanent nature\"?", "The shawādhdh variant bi-sumā explicitly shows the s-m-w root — could the standard form bismi be deliberately ambiguous between \"name\" and \"elevation,\" while the variant resolves this ambiguity by foregrounding elevation?", "Why are the mercy-attributes placed after the divine name rather than before it? Does the sequence ism → Allāh → Raḥmān → Raḥīm create a progressive revelation: first the act of naming, then the named one, then the nature of the named one?", "The qira'at variants showing accusative (naṣb) and nominative (rafʿ) case endings for ar-Raḥmān ar-Raḥīm — do these suggest the text structurally permits the mercy-attributes to break free from the genitive construct and stand as independent declarations?", "The root r-h-m links mercy to the womb (raḥim). Does this imply that divine mercy is not abstract kindness but a generative, nurturing force — the force that creates and sustains life from within?", "Can bismi be read as a modern identifier — an authentication protocol, a digital signature, a metadata tag that marks all subsequent data as authorized by the divine system?", "The Basmala appears 114 times in the Quran (at the head of 113 surahs plus 27:30) — is its function primarily liturgical (marking the start of recitation), structural (dividing surahs), or semantic (framing all content within divine mercy)?"], "questionsTr": ["Besmele neden fiili hazfeder? Gizli eylemi belirsiz bırakmanın kazancı nedir — bu, formülü tüm olası eylemlere aynı anda uygulanabilir mi kılar?", "ism'in etimolojik tartışması (s-m-w \"yücelik\" mi w-s-m \"işaretleme\" mi) — her ikisi de doğruysa, Besmele aynı anda hem yücelmeyi HEM DE tanımlamayı mı çağırır? İsim hem bir nişan hem de bir yüceltme midir?", "fa'lān → fa'īl ilerlemesi (Raḥmān → Raḥīm): bu deneyimsel olandan ontolojik olana bir hareketi mi yansıtır? Metin \"Tanrı'nın rahmetini baskın bir kabarma olarak deneyimlersiniz ama o Tanrı'nın kalıcı doğasıDIR\" mı der?", "Şâz kıraat bi-sumā s-m-w kökünü açıkça gösterir — standart bismi formu kasıtlı olarak \"isim\" ile \"yücelik\" arasında belirsiz olabilir mi, varyant ise yüceliği öne çıkararak bu belirsizliği çözer mi?", "Merhamet sıfatları neden ilahi isimden sonra gelir, öncesinde değil? ism → Allāh → Raḥmān → Raḥīm sıralaması aşamalı bir açılım mı yaratır: önce isimlendirme eylemi, sonra isimlenen, sonra isimlenin doğası?", "er-Raḥmān er-Raḥīm için mansub ve merfû çekimi gösteren kıraat varyantları — bunlar metnin merhamet sıfatlarının izafe yapısından koparak bağımsız beyanlar olarak durmasına yapısal olarak izin verdiğini mi düşündürür?", "r-h-m kökü merhameti rahime (döl yatağı) bağlar. Bu, ilahi rahmetin soyut bir iyilik değil, doğurgan ve besleyici bir güç — içeriden hayat yaratan ve sürdüren güç — olduğunu mu ima eder?", "bismi modern bir tanımlayıcı olarak okunabilir mi — bir doğrulama protokolü, dijital imza, tüm sonraki veriyi ilahi sistem tarafından yetkilendirilmiş olarak işaretleyen bir üst veri etiketi?", "Besmele Kur'an'da 114 kez geçer (113 surenin başında artı 27:30) — işlevi öncelikle ibadetsel mi (kıraatin başlangıcını işaretler), yapısal mı (sureleri böler), yoksa anlamsal mı (tüm içeriği ilahi rahmet çerçevesinde konumlandırır)?"], "key": "1:1"}, {"surah": 1, "ayah": 2, "arabic": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ", "transliteration": "al-ḥamdu lillāhi rabbi l-'ālamīna", "readings": [{"text": "The praise belongs to God, the nurturer of all realms of being", "textTr": "Hamd, bütün varlık alemlerinin terbiye edicisi olan Allah'a aittir", "rationale": "The definite article on al-ḥamdu signals comprehensiveness — not \"a praise\" but THE praise, the totality of praise as a category. lillāhi with lām of possession (isti-ḥqāq) claims all praise as God's inherent right. rabb as \"nurturer/sustainer\" (not just \"lord\") connects to the root's sense of gradual cultivation. al-'ālamīna as \"realms of being\" captures the plural of 'ālam, meaning every category of existence.", "rationaleTr": "Hamd'daki belirlilik takısı (ال) tümelliği ifade eder — bir hamd değil, bütün hamd kavramını kapsar. لِلَّهِ'deki lam-ı istihkak, hamdin Allah'ın doğal hakkı olduğunu belirtir. رَبّ \"terbiye edici\" anlamıyla kökün tedricî yetiştirme kavramını taşır. عَالَمِينَ \"varlık alemleri\" olarak her varoluş kategorisini kapsar."}, {"text": "The gratitude is for God, master of all worlds", "textTr": "Şükür Allah'a mahsustur, bütün dünyaların sahibine", "rationale": "Reading ḥamd as \"gratitude\" (acknowledging received good) rather than \"praise\" (declaring excellence). lillāhi with lām of ikhtisāṣ (exclusivity) — gratitude is exclusively for God. rabb as \"master/owner\" from r-b-b's sense of possession and authority. al-'ālamīna as \"worlds\" — multiple distinct realms (physical, spiritual, unseen).", "rationaleTr": "Hamd burada \"şükür\" (iyiliği tanıma) olarak okunur, \"övgü\" (mükemmelliği ilan etme) değil. لِلَّهِ'deki lam tahsis ifade eder — şükür yalnızca Allah'a mahsustur. رَبّ \"sahip/malik\" olarak r-b-b kökünün mülkiyet anlamını taşır. عَالَمِينَ çoğul \"dünyalar\" — fiziksel, ruhani, gayb alemleri."}, {"text": "The defining acknowledgement is God's — the one who raises all conscious beings", "textTr": "Tanımlayıcı ikrar Allah'ındır — bütün bilinçli varlıkları yükseltenin", "rationale": "ḥamd as \"defining acknowledgement\" — a declaration that establishes identity through recognizing the attributes of the acknowledged. lillāhi as lām al-jins + Allāh — praise as a category belongs to the divine. rabb from r-b-b in its sense of \"raising from lower to higher state\" (Lane's: rabbā = he reared/raised). al-'ālamīna specifically as \"conscious beings\" — those capable of knowing ('ilm), since 'ālam derives from '-l-m (knowledge/perception).", "rationaleTr": "Hamd burada \"tanımlayıcı ikrar\" olarak okunur — tanınanın sıfatlarını tanıyarak kimlik kuran bir beyan. لِلَّهِ lam-ı cins ile — hamd kategorisi ilahi olana aittir. رَبّ \"aşağıdan yüksek duruma çıkaran\" anlamıyla (Lane: rabbā = yetiştirdi/yükseltti). عَالَمِينَ özellikle \"bilinçli varlıklar\" — bilebilen ('-l-m kökünden) varlıklar."}, {"text": "All systematic evaluation belongs to God, the programmer of all information systems", "textTr": "Tüm sistematik değerlendirme, bütün bilgi sistemlerinin programlayıcısı Allah'a aittir", "rationale": "Futuristic/modern reading: ḥamd as systematic evaluation and benchmarking (modern Arabic: taḥmīd = evaluation protocol). lillāhi as attribution to the source code of existence. rabb as \"the one who programs growth\" — designing systems that develop incrementally (software versioning, biological evolution). al-'ālamīna as \"information systems\" — each 'ālam is a complete system of data and rules, from quantum fields to neural networks to digital ecosystems.", "rationaleTr": "Modern/geleceksel okuma: Hamd sistematik değerlendirme ve kıyaslama olarak (modern Arapça: taḥmīd = değerlendirme protokolü). لِلَّهِ varoluşun kaynak koduna atıf. رَبّ \"büyümeyi programlayan\" — kademeli olarak gelişen sistemler tasarlayan (yazılım versiyonlama, biyolojik evrim). عَالَمِينَ \"bilgi sistemleri\" — her âlem kuantum alanlarından sinir ağlarına, dijital ekosistemlere kadar tam bir veri ve kural sistemi."}, {"text": "The praise — it is for the divine, the cultivator of all perceiving entities", "textTr": "Hamd — o, ilahi olana aittir, tüm algılayan varlıkların yetiştiricisine", "rationale": "This reading foregrounds the nominal sentence structure: al-ḥamdu is the mubtada' (subject) and lillāhi is the khabar (predicate). The dash marks the pause inherent in equational sentences — the sentence EQUATES praise with God, not just directs it. rabbi as badal (apposition) specifying which aspect of divinity receives this equation. al-'ālamīna from '-l-m with emphasis on 'alāma (sign/mark) — perceiving entities are those who recognize signs.", "rationaleTr": "Bu okuma isim cümlesi yapısını öne çıkarır: الحمد mübteda, لِلَّهِ haber. Tire, denklem cümlesindeki doğal duraklamayı işaretler — cümle hamdi Allah'a yönlendirmez, eşitler. رَبّ bedel (açıklama) olarak ilahiliğin hangi yönünün bu denklemin muhatabı olduğunu belirtir. عَالَمِينَ, '-l-m kökünden 'alāma (işaret/belge) vurgusuyla — algılayan varlıklar işaretleri tanıyanlardır."}], "structure": {"beats": [{"label": "Declaration of praise", "labelTr": "Hamd beyanı", "lines": [{"arabic": "ٱلْحَمْدُ", "translit": "al-ḥamdu", "english": "The praise", "turkish": "Hamd"}]}, {"label": "Attribution to divinity", "labelTr": "İlahi olana atıf", "lines": [{"arabic": "لِلَّهِ", "translit": "lillāhi", "english": "belongs to God", "turkish": "Allah'a aittir"}]}, {"label": "Appositive specification", "labelTr": "Açıklayıcı tanımlama", "lines": [{"arabic": "رَبِّ ٱلْعَٰلَمِينَ", "translit": "rabbi l-'ālamīna", "english": "nurturer of the realms of being", "turkish": "varlık alemlerinin terbiye edicisi"}]}], "summary": "The ayah is a complete nominal sentence (jumla ismiyya): al-ḥamdu (definite gerund, mubtada'/subject) + lillāhi (prepositional phrase, khabar/predicate) + rabbi l-'ālamīna (appositive genitive chain, badal specifying Allāh). The definiteness of al-ḥamdu creates a universal claim — not one act of praise but the entire category. The lām preposition establishes ownership/rightful belonging. The apposition rabbi l-'ālamīna then DEFINES the God being praised: not through names or attributes abstractly, but through a RELATIONSHIP (rabb = one who nurtures) with a SCOPE (al-'ālamīna = all realms). The structure moves from abstract concept (praise) → specific recipient (God) → relational definition (nurturer of everything). Each beat narrows the claim while expanding its scope.", "summaryTr": "Ayet tam bir isim cümlesidir (cümle-i ismiyye): الحمد (marife masdar, mübteda) + لِلَّهِ (harf-i cer + isim, haber) + رَبِّ العالمين (bedel, izafe zinciri). الحمد'deki belirlilik takısı tümel bir iddia kurar — tek bir hamd eylemi değil, tüm hamd kategorisi. لِ harfi sahiplik/hak ediş kurar. رَبِّ العالمين bedeli, övülen Allah'ı TANIMLAR: soyut isim veya sıfatlarla değil, bir İLİŞKİ (rabb = terbiye eden) ve bir KAPSAM (العالمين = tüm alemler) ile. Yapı soyut kavramdan (hamd) → belirli alıcıya (Allah) → ilişkisel tanıma (her şeyin yetiştiricisi) doğru ilerler. Her aşama iddiayı daraltırken kapsamını genişletir."}, "words": [{"id": 1, "arabic": "ٱلْحَمْدُ", "translit": "al-ḥamdu", "gloss": "praise, gratitude, commendation", "glossTr": "hamd, övgü, şükür", "userNotes": "", "root": "ح م د (h-m-d)", "grammar": "Definite masdar (verbal noun) in the nominative (marfu') as mubtada' (subject of a nominal sentence). The definite article al- is for al-istighrāq (comprehensiveness) — encompassing ALL praise, not a specific instance. Form I masdar from ḥamida.", "grammarTr": "Marife masdar, merfu halde mübteda olarak. Belirlilik takısı (ال) istiğrak içindir — belirli bir örnek değil TÜM hamdi kapsar. I. bab masdarı, ḥamida fiilinden.", "semantics": ["فَعِلَ (ḥamida, I): to praise, to commend, to speak well of; to be pleased with; to thank, to express gratitude for received good", "فَعَّلَ (ḥammada, II): to praise repeatedly or intensely; to laud, to eulogize", "أَفْعَلَ ('aḥmada, IV): to do what is praiseworthy; to find praiseworthy; to arrive at a state deserving praise", "Lane's Lexicon: al-ḥamdu is the opposite of al-dhammu (blame). It denotes praising/commending for a quality whether that quality is acquired by choice or not (unlike shukr which is specifically for received benefit). ḥamd = acknowledging excellence that exists in the object itself, regardless of whether the praiser benefits from it", "Hans Wehr: praise, commendation, laudation; also: satisfaction, contentment (ḥamida 'an = to be satisfied with)", "Lisan al-Arab: al-ḥamdu naqīḍu al-dhamm — praise is the opposite of blame. Distinguished from madḥ: ḥamd requires genuine merit in the praised, while madḥ can be flattery. Distinguished from shukr: ḥamd can be for inherent qualities, shukr only for benefits received", "Modern: evaluation, assessment, benchmarking — taḥmīd as systematic positive evaluation", "Core concept: recognizing and declaring the intrinsic excellence of something — a cognitive-verbal act that identifies merit independent of personal benefit"], "semanticsTr": ["فَعِلَ (ḥamide, I. bab): övmek, methetmek, iyi konuşmak; hoşnut olmak; şükretmek, alınan iyiliğe minnettarlık ifade etmek", "فَعَّلَ (ḥammede, II. bab): tekrar tekrar veya yoğun biçimde övmek; senâ etmek", "أَفْعَلَ (eḥmede, IV. bab): övülecek iş yapmak; övülmeye değer bulmak; övgüye lâyık hâle gelmek", "Lane's Lexikon: el-ḥamdu, ez-zemmü'nün (kınama) zıddıdır. Kişinin seçerek kazandığı veya doğasında var olan bir niteliği övmek demektir (şükürden farklı olarak alınan faydaya bağlı değildir). Ḥamd = övülenin kendi içinde var olan mükemmelliği tanımaktır — övenin fayda görüp görmemesinden bağımsız", "Hans Wehr: övgü, metih; ayrıca: hoşnutluk, memnuniyet (ḥamida 'an = hoşnut olmak)", "Lisanü'l-Arab: el-ḥamdu nakīḍu'z-zemm — hamd zemmin zıddıdır. Medihten ayrılır: hamd övülende gerçek bir meziyet gerektirir, medih dalkavukluk olabilir. Şükürden ayrılır: hamd doğal nitelikler için olabilir, şükür yalnızca alınan nimetler içindir", "Modern: değerlendirme, kıyaslama — taḥmīd sistematik olumlu değerlendirme olarak", "Kök kavram: bir şeyin özsel mükemmelliğini tanıyıp ilan etmek — kişisel fayda gözetmeksizin meziyeti belirleyen bilişsel-sözel bir eylem"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Gerund as subject (ḥamd as sentence opener)", "count": "~23 ayahs", "examples": [{"ref": "6:1", "arabic": "ٱلْحَمْدُ لِلَّهِ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَجَعَلَ ٱلظُّلُمَٰتِ وَٱلنُّورَ ۖ ثُمَّ ٱلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ يَعْدِلُونَ", "english": "The praise belongs to God, who created the heavens and the earth and made the darknesses and the light — yet those who deny equate (others) with their nurturer", "turkish": "Hamd, gökleri ve yeri yaratan, karanlıkları ve nuru var eden Allah'a aittir — öyle iken inkâr edenler Rablerine (başkalarını) denk tutarlar"}, {"ref": "18:1", "arabic": "ٱلْحَمْدُ لِلَّهِ ٱلَّذِىٓ أَنزَلَ عَلَىٰ عَبْدِهِ ٱلْكِتَٰبَ وَلَمْ يَجْعَل لَّهُۥ عِوَجَا ۜ", "english": "The praise belongs to God, who sent down the scripture upon His servant and made no crookedness in it", "turkish": "Hamd, kuluna Kitab'ı indiren ve onda bir eğrilik kılmayan Allah'a aittir"}]}, {"label": "B. Gerund with preposition (bi-ḥamdihi — \"with/through His praise\")", "count": "~15 ayahs", "examples": [{"ref": "2:30", "arabic": "وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّى جَاعِلٌۭ فِى ٱلْأَرْضِ خَلِيفَةًۭ ۖ قَالُوٓا۟ أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ ٱلدِّمَآءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّىٓ أَعْلَمُ مَا لَا تَعْلَمُونَ", "english": "And when your nurturer said to the angels: I am placing a successor in the earth. They said: Will you place therein one who corrupts and sheds blood, while we declare glory through Your praise and sanctify You? He said: I know what you do not know.", "turkish": "Hani Rabbin meleklere \"Ben yeryüzünde bir halife kılacağım\" demişti. Dediler: \"Orada bozgunculuk yapacak ve kan dökecek birini mi koyacaksın? Halbuki biz Seni hamdınla tesbih ediyor ve Seni takdis ediyoruz.\" Dedi: \"Ben sizin bilmediklerinizi bilirim.\""}, {"ref": "13:13", "arabic": "وَيُسَبِّحُ ٱلرَّعْدُ بِحَمْدِهِۦ وَٱلْمَلَٰٓئِكَةُ مِنْ خِيفَتِهِۦ وَيُرْسِلُ ٱلصَّوَٰعِقَ فَيُصِيبُ بِهَا مَن يَشَآءُ وَهُمْ يُجَٰدِلُونَ فِى ٱللَّهِ وَهُوَ شَدِيدُ ٱلْمِحَالِ", "english": "And the thunder declares glory through His praise, and the angels out of awe of Him; and He sends the thunderbolts striking with them whom He wills — yet they dispute about God, while He is severe in confrontation", "turkish": "Gök gürültüsü O'nu hamdıyla tesbih eder, melekler de O'nun korkusundan. Yıldırımları gönderir, dilediğini onlarla çarpar — hâlâ Allah hakkında tartışırlar, O ise azabı çetin olandır"}]}, {"label": "C. Gerund elided subject (qāla l-ḥamdu lillāhi)", "count": "~5 ayahs", "examples": [{"ref": "15:98", "arabic": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُن مِّنَ ٱلسَّٰجِدِينَ", "english": "So declare glory through the praise of your nurturer, and be among those who prostrate", "turkish": "Rabbinin hamdıyla tesbih et ve secde edenlerden ol"}]}, {"label": "D. Proper noun (Muḥammad, Aḥmad)", "count": "~15 ayahs", "examples": [{"ref": "17:79", "arabic": "وَمِنَ ٱلَّيْلِ فَتَهَجَّدْ بِهِۦ نَافِلَةًۭ لَّكَ عَسَىٰٓ أَن يَبْعَثَكَ رَبُّكَ مَقَامًۭا مَّحْمُودًۭا", "english": "And during the night, rise with it as a voluntary (act) for you — perhaps your nurturer will raise you to a praised station", "turkish": "Gecenin bir bölümünde onunla teheccüd kıl, sana has bir nafile olarak — umulur ki Rabbin seni övülmüş bir makama ulaştırır"}]}]}, "qiraat": [{"arabic": "الْـحَمْدِ", "translit": "al-ḥamdi", "status": "14", "type": "CE|vhr", "note": "Genitive case (kasra) reading: al-ḥamdi. If read as genitive, the word becomes dependent on a preceding element (e.g., connected to bismillāh as genitive chain). This disrupts the standard nominative/subject reading and reframes the sentence structure entirely.", "noteTr": "Mecrûr okuma (kesre ile): el-ḥamdi. Mecrûr okunursa kelime önceki bir unsura bağımlı hâle gelir (örn. besmeleye izafe zinciri olarak bağlanır). Bu, standart merfû/mübteda okumasını bozar ve cümle yapısını tamamen yeniden çerçeveler.", "source": "erquran.org"}, {"arabic": "الْـحَمْدَ", "translit": "al-ḥamda", "status": "Irreg", "type": "CE", "note": "Accusative case (fatḥa) reading: al-ḥamda. This would make it a direct object (mef'ūl bih), implying an elided verb (e.g., \"I establish/perform the praise for God\"). Shifts from declarative equation to active verbal performance.", "noteTr": "Mansûb okuma (fetha ile): el-ḥamda. Bu, kelimeyi mef'ûl-i bih yaparak hazf edilmiş bir fiil gerektirir (örn. \"Hamd'ı Allah için ikame ederim/yaparım\"). Bildirme denkleminden etkin fiilî icra'ya geçiş.", "source": "erquran.org"}, {"arabic": "الرَّحِيمْ｡ أَلْحَمْدُ", "translit": "ar-raḥīm. al-ḥamdu", "status": "Irreg", "type": "waqf", "note": "Waqf variant: pausing after ar-raḥīm (end of 1:1) with hamzat al-waṣl becoming hamzat al-qaṭ' on al-ḥamdu. This makes the basmala and the ḥamd declaration two fully independent sentences, emphasizing the fresh start of 1:2 as a new declarative act.", "noteTr": "Vakıf varyantı: er-raḥīm'den sonra durarak (1:1 sonu) الحمد'deki hemzetü'l-vasıl hemzetü'l-kat' olur. Bu, besmele ve hamd beyanını tamamen bağımsız iki cümle yapar, 1:2'nin yeni bir bildiri eylemi olarak taze başlangıcını vurgular.", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "Shia reading: complete syntactic restructuring from nominal to verbal sentence — \"we praise God, nurturer of...\" with first person plural verb (Form II intensive). This transforms the universal declaration into an active communal worship act. Not in the standard Hafs text.", "noteTr": "Şii okuması: isim cümlesinden fiil cümlesine tam sözdizimsel dönüşüm — \"biz Allah'ı hamd ederiz, alemlerin terbiye edicisini...\" birinci çoğul şahıs fiili (II. bab mübalağa). Evrensel bildiriyi etkin bir toplumsal ibadet eylemine dönüştürür. Standart Hafs metninde yoktur.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "46", "refs": "1:2;17:111;18:1;2:267;3:144;4:131;6:1;6:45;7:43;9:112", "note": "Praise (ḥ-m-d) paired with divinity ('-l-h) — the praise-divinity nexus appears in 46 ayahs, establishing ḥamd as a defining relational act toward the divine ← IN THIS AYAH", "noteTr": "Hamd (ḥ-m-d) ilahilik ('-l-h) ile eşleşmiş — hamd-ulûhiyet bağı 46 ayette görülür, hamdi ilahi olana yönelik tanımlayıcı bir ilişkisel eylem olarak kurar ← BU AYETTE"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "27", "refs": "1:2;17:79;2:30;6:1;6:45;7:43;10:10;14:1;14:39;15:98", "note": "Praise paired with nurturing/lordship — in 27 ayahs, ḥamd connects to rabb, making the nurturer-relationship the primary context for praise ← IN THIS AYAH", "noteTr": "Hamd terbiye/rububiyet ile eşleşmiş — 27 ayette hamd rabb ile bağlanır, terbiye edicilik ilişkisini hamdin birincil bağlamı yapar ← BU AYETTE"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "18", "refs": "1:2;2:30;2:267;3:188;6:45;10:10;16:75;22:5;27:15;31:25", "note": "Praise paired with knowledge/worlds — the semantic connection between ḥamd and '-l-m reflects both \"worlds\" (ālamīn) and \"knowledge\" (ilm), suggesting praise is a knowing act ← IN THIS AYAH", "noteTr": "Hamd bilgi/alemler ile eşleşmiş — ḥamd ve '-l-m arasındaki anlamsal bağ hem \"alemler\" (ālamīn) hem \"bilgi\" (ilm) anlamını yansıtır, hamdin bilen bir eylem olduğunu gösterir ← BU AYETTE"}, {"coRoot": "s-w-d", "coRootAr": "س و د", "count": "1", "refs": "1:2", "note": "Praise paired with mastery/blackness (s-w-d) — variant-sourced: the shawādhdh reading سَيِّدِ (sayyidi) replaces رَبِّ (rabbi), linking ḥamd to s-w-d \"master/leader\" rather than r-b-b \"nurturer\" ← IN THIS AYAH (variant only)", "noteTr": "Hamd efendilik/siyahlık (s-w-d) ile eşleşmiş — varyant kaynaklı: şâz okuma سَيِّدِ (seyyidi) رَبِّ (rabbi) yerine geçerek hamdi r-b-b \"terbiye edici\" yerine s-w-d \"efendi/lider\" ile bağlar ← BU AYETTE (yalnızca varyant)"}], "critical": "The nominative case (ḍamma) on al-ḥamdu establishes this as a declarative equation: praise IS God's — not a request or a performance but an ontological claim. The three case variants (nominative, genitive, accusative) each restructure the entire sentence differently. The genitive reading (al-ḥamdi, 14-reader canon) would make it dependent on the preceding basmala, creating a single flowing declaration from 1:1 into 1:2. The accusative reading (al-ḥamda, irregular) implies an active verbal performance. The Shia verbal reading (nuḥammidu) most radically transforms the sentence from a statement about reality into a communal act of worship. The ḥ-m-d root's distinction from both madḥ (which can be flattery) and shukr (which requires received benefit) is semantically critical: ḥamd recognizes intrinsic merit regardless of personal gain.", "criticalTr": "الحمد'deki merfu hâl (zamme) bunu bildirme denklemi olarak kurar: hamd Allah'ındır — bir talep veya icrâ değil, ontolojik bir iddia. Üç hâl varyantı (merfû, mecrûr, mansûb) cümle yapısını tamamen farklı biçimlerde yeniden düzenler. Mecrûr okuma (el-ḥamdi, 14 okuyucu kanonu) onu önceki besmeleye bağımlı kılarak 1:1'den 1:2'ye akan tek bir beyan oluşturur. Mansûb okuma (el-ḥamda, düzensiz) etkin bir fiilî icrâ gerektirir. Şii fiil okuması (nuḥammidu) cümleyi gerçeklik hakkında bir ifadeden toplumsal bir ibadet eylemine en köklü biçimde dönüştürür. Ḥ-m-d kökünün hem medihten (dalkavukluk olabilir) hem şükürden (alınan nimet gerektirir) ayrılması anlamsal olarak kritiktir: hamd, kişisel kazanımdan bağımsız olarak özsel meziyeti tanır.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 2, "arabic": "لِلَّهِ", "translit": "lillāhi", "gloss": "for/to God, belonging to God", "glossTr": "Allah'a, Allah'a ait", "userNotes": "", "root": "أ ل ه ('-l-h)", "grammar": "Preposition لِ (li, for/to) + proper noun ٱللَّهِ (Allāhi) in genitive. The لِ here functions as lām al-istiḥqāq (lām of deserved right) or lām al-ikhtisāṣ (lām of exclusive belonging). The compound lillāhi serves as the khabar (predicate) of the nominal sentence.", "grammarTr": "Harf-i cer لِ (li, için/a) + özel isim ٱللَّهِ (Allāhi) mecrûr halde. لِ burada lam-ı istihkak (hak ediş lâmı) veya lam-ı ihtisas (münhasır aitlik lâmı) işlevi görür. لِلَّهِ bileşik yapısı isim cümlesinin haberi olarak görev yapar.", "semantics": ["أ ل ه ('-l-h): the root denotes divinity, godhood, worship. Lane's Lexicon: 'alaha = he worshipped; 'ilāh = a deity, an object of worship; Allāh = the one true God (al + 'ilāh with assimilation). The root carries: (1) the act of seeking refuge or being bewildered/perplexed ('aliha = he was perplexed, confused, as one bewildered seeking refuge), (2) devotion and worship ('alaha = he served/worshipped), (3) elevation and hiddenness (lāha = he was high, he was hidden)", "Lane's: 'aliha ilayhi = he was frightened and fled to him for refuge. 'aliha = he became confounded/perplexed. The semantic origin may connect bewilderment → seeking refuge → worship: the one to whom all turn in bewilderment", "Hans Wehr: 'ilāh = god, deity; Allāh = God; ta'allaha = to deify, to worship; 'ulūhiyya = divinity, godhead", "Lisan al-Arab: Allāh — the name that encompasses all divine attributes. Some derive it from w-l-h (passionate love/devotion: waliha = he was passionately devoted). Others from '-l-h (refuge/worship). The name is unique — it has no plural, no gender variation, and cannot be applied to any other being", "The لِ preposition: classical functions include — (1) al-milk (possession: \"the house is li-Zayd\"), (2) al-istiḥqāq (deserved right: \"praise is li-llāh\"), (3) al-ikhtisāṣ (exclusivity), (4) al-ta'līl (causation: \"for the sake of\"), (5) al-ṣayrūra (becoming/eventual result)", "Core concept: the root '-l-h points toward an entity that is simultaneously the source of bewilderment and the refuge from it — the object of ultimate turning-to in all states of need, confusion, and devotion"], "semanticsTr": ["أ ل ه ('-l-h): kök ulûhiyet, tanrılık, ibadet anlamlarını taşır. Lane: 'aleha = ibadet etti; 'ilâh = tanrı, ibadet edilen; Allāh = tek gerçek Tanrı (el + ilâh idgâm ile). Kök şunları taşır: (1) sığınma veya şaşkınlık ('alihe = şaşırdı, hayrete düştü — sığınak arayan gibi), (2) bağlılık ve ibadet ('aleha = kulluk etti/ibadet etti), (3) yücelik ve gizlilik (lâhe = yüce idi, gizli idi)", "Lane: 'alihe ileyhi = korkup ona sığındı. 'alihe = şaşkına döndü. Anlamsal köken şaşkınlık → sığınma → ibadet bağlantısı kurabilir: şaşkınlık içinde herkesin döndüğü varlık", "Hans Wehr: 'ilâh = tanrı; Allāh = Allah; teeellehe = tanrılaştırmak, ibadet etmek; ulûhiyye = tanrılık, ilâhî makam", "Lisanü'l-Arab: Allāh — bütün ilâhî sıfatları kapsayan isim. Bazıları v-l-h kökünden türetir (tutkulu sevgi/bağlılık: velihe = tutkuyla bağlandı). Diğerleri '-l-h kökünden (sığınma/ibadet). İsim benzersizdir — çoğulu, cinsiyet değişimi yoktur ve başka hiçbir varlığa uygulanamaz", "لِ harfi: klasik işlevleri — (1) el-milk (sahiplik: \"ev Zeyd'indir\"), (2) el-istihkâk (hak ediş: \"hamd Allah'ındır\"), (3) el-ihtisâs (münhasırlık), (4) et-ta'lîl (sebep: \"uğruna\"), (5) es-sayrûre (oluş/nihaî sonuç)", "Kök kavram: '-l-h kökü aynı anda hem şaşkınlığın kaynağı hem ondan sığınağa işaret eder — ihtiyaç, şaşkınlık ve bağlılığın her hâlinde nihaî yöneliş nesnesi"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Proper noun as subject/agent (Allāhu)", "count": "~317 ayahs", "examples": [{"ref": "2:159", "arabic": "إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ ٱلْبَيِّنَٰتِ وَٱلْهُدَىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِى ٱلْكِتَٰبِ ۙ أُو۟لَٰٓئِكَ يَلْعَنُهُمُ ٱللَّهُ وَيَلْعَنُهُمُ ٱللَّٰعِنُونَ", "english": "Those who conceal what We sent down of clarifications and guidance after We made it clear to people in the scripture — those, God curses them, and the cursers curse them", "turkish": "Ayetlerden ve hidayetten indirdiğimiz şeyleri — insanlara Kitap'ta açıkladıktan sonra — gizleyenler, işte Allah onlara lanet eder, lanet ediciler de lanet eder"}, {"ref": "8:7", "arabic": "وَإِذْ يَعِدُكُمُ ٱللَّهُ إِحْدَى ٱلطَّآئِفَتَيْنِ أَنَّهَا لَكُمْ وَتَوَدُّونَ أَنَّ غَيْرَ ذَاتِ ٱلشَّوْكَةِ تَكُونُ لَكُمْ وَيُرِيدُ ٱللَّهُ أَن يُحِقَّ ٱلْحَقَّ بِكَلِمَٰتِهِۦ وَيَقْطَعَ دَابِرَ ٱلْكَٰفِرِينَ", "english": "And when God promised you one of the two groups — that it would be yours — and you wished that the one without thorns would be yours, but God intended to establish the truth through His words and cut the root of the deniers", "turkish": "Hani Allah size iki taifeden birini vaat ediyordu — onun sizin olacağını — siz de dikenli olmayanı istiyordunuz. Oysa Allah kelimâtıyla hakkı gerçekleştirmek ve inkârcıların kökünü kesmek istiyordu"}]}, {"label": "B. Proper noun as prepositional object (lillāhi, billāhi, etc.)", "count": "~515 ayahs", "examples": [{"ref": "11:6", "arabic": "وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّۭ فِى كِتَٰبٍۢ مُّبِينٍۢ", "english": "There is no moving creature on earth but its sustenance is upon God, and He knows its settling place and its repository — all is in a clear record", "turkish": "Yeryüzünde hiçbir canlı yoktur ki rızkı Allah'a ait olmasın. Onun yerleşim yerini ve emanet yerini bilir — hepsi apaçık bir kitaptadır"}]}, {"label": "C. Genitive construct (modifier of another noun)", "count": "~596 ayahs", "examples": [{"ref": "18:21", "arabic": "وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوٓا۟ أَنَّ وَعْدَ ٱللَّهِ حَقٌّۭ وَأَنَّ ٱلسَّاعَةَ لَا رَيْبَ فِيهَآ إِذْ يَتَنَٰزَعُونَ بَيْنَهُمْ أَمْرَهُمْ ۖ فَقَالُوا۟ ٱبْنُوا۟ عَلَيْهِم بُنْيَٰنًۭا ۖ رَّبُّهُمْ أَعْلَمُ بِهِمْ ۚ قَالَ ٱلَّذِينَ غَلَبُوا۟ عَلَىٰٓ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِدًۭا", "english": "And thus We made (people) stumble upon them, so they would know that God's promise is truth and that the Hour has no doubt in it — when they disputed among themselves about their affair. They said: Build over them a structure. Their nurturer knows best about them. Those who prevailed over their affair
