ime period (sunrise to sunset), or full 24-hour cycle", "[7C] يَوْم (yawm): a specific notable day, a battle-day (yawm Badr, yawm al-qiyāma)", "[7C] أَيَّام (ayyām): plural — days, but also \"events, epochs, notable periods\" (ayyām Allāh = events/trials of God)", "[7C] Lane's: yawm = time absolutely; can refer to any period of time, not necessarily solar day", "[7C] Lane's: yawm al-dīn = the day of requital, the day of reckoning; the day when accounts are settled", "[7C] Lisan al-Arab: yawm can mean \"state, condition\" — yawmuhum = their state/circumstance", "[M] Hans Wehr: yawm = day; yawman mā = some day; yawma'idhin = on that day; al-yawm = today, the present", "[M] Modern: temporal unit, era, age; \"the day of X\" can denote an entire epoch or paradigm", "[F] Futuristic: a dimension of time; a temporal domain or time-space — ownership of yawm can mean jurisdiction over a time-dimension", "Core concept: a bounded temporal unit that can scale from a moment to an epoch — its meaning expands based on what follows in the iḍāfa"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Adverbial time marker (yawma as adverb of time)", "count": "~107 ayahs", "examples": [{"ref": "34:40", "arabic": "وَيَوْمَ يَحْشُرُهُمْ جَمِيعًۭا ثُمَّ يَقُولُ لِلْمَلَٰٓئِكَةِ أَهَٰٓؤُلَآءِ إِيَّاكُمْ كَانُوا۟ يَعْبُدُونَ", "english": "And the day He gathers them all, then says to the angels: \"Were these the ones who used to worship you?\""}, {"ref": "2:85", "arabic": "ثُمَّ أَنتُمْ هَٰٓؤُلَآءِ تَقْتُلُونَ أَنفُسَكُمْ وَتُخْرِجُونَ فَرِيقًۭا مِّنكُم مِّن دِيَٰرِهِمْ تَظَٰهَرُونَ عَلَيْهِم بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَإِن يَأْتُوكُمْ أُسَٰرَىٰ تُفَٰدُوهُمْ وَهُوَ مُحَرَّمٌ عَلَيْكُمْ إِخْرَاجُهُمْ ۚ أَفَتُؤْمِنُونَ بِبَعْضِ ٱلْكِتَٰبِ وَتَكْفُرُونَ بِبَعْضٍۢ ۚ فَمَا جَزَآءُ مَن يَفْعَلُ ذَٰلِكَ مِنكُمْ إِلَّا خِزْىٌۭ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَيَوْمَ ٱلْقِيَٰمَةِ يُرَدُّونَ إِلَىٰٓ أَشَدِّ ٱلْعَذَابِ", "english": "Then you are those who kill your own people... the recompense for whoever does that among you is nothing but disgrace in worldly life, and on the day (yawm) of resurrection they are returned to the severest punishment"}]}, {"label": "B. Genitive construct — specifying a named day (yawm al-qiyāma, yawm al-dīn)", "count": "~47 ayahs", "examples": [{"ref": "2:80", "arabic": "وَقَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ إِلَّآ أَيَّامًۭا مَّعْدُودَةًۭ ۚ قُلْ أَتَّخَذْتُمْ عِندَ ٱللَّهِ عَهْدًۭا فَلَن يُخْلِفَ ٱللَّهُ عَهْدَهُۥٓ ۖ أَمْ تَقُولُونَ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ", "english": "And they said: \"The fire will not touch us except for numbered days (ayyāman).\" Say: \"Have you taken a covenant with God?\""}]}, {"label": "C. Predicate position — identifying a day (hādhā yawmukum)", "count": "~18 ayahs", "examples": [{"ref": "21:103", "arabic": "لَا يَحْزُنُهُمُ ٱلْفَزَعُ ٱلْأَكْبَرُ وَتَتَلَقَّىٰهُمُ ٱلْمَلَٰٓئِكَةُ هَٰذَا يَوْمُكُمُ ٱلَّذِى كُنتُمْ تُوعَدُونَ", "english": "The greatest terror will not grieve them, and the angels receive them: \"This is your day (yawmukum) which you were promised\""}]}, {"label": "D. Prepositional object (fī yawm, li-yawm)", "count": "~56 ayahs", "examples": [{"ref": "6:73", "arabic": "وَهُوَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۖ وَيَوْمَ يَقُولُ كُن فَيَكُونُ ۚ قَوْلُهُ ٱلْحَقُّ ۚ وَلَهُ ٱلْمُلْكُ يَوْمَ يُنفَخُ فِى ٱلصُّورِ", "english": "He is the One who created the heavens and the earth in truth, and the day (yawm) He says \"Be\" and it is — His word is the truth, and to Him belongs sovereignty on the day the trumpet is blown"}]}]}, "qiraat": [{"arabic": "مَلَكَ يَوْمَ", "translit": "malaka yawma", "status": "Irreg", "type": "Stx|V↔︎N|CE", "note": "Variant shifts yawm from genitive to accusative, making it the direct object of the verb malaka — \"He ruled the day of judgment\"", "source": "erquran.org"}, {"arabic": "مَالِكٌ يَوْمَ", "translit": "mālikun yawma", "status": "Irreg", "type": "iḍ|CE", "note": "Breaks the iḍāfa: yawm becomes adverbial accusative — \"an owner, on the day of judgment\" (mālik is a predicate, not bound to yawm)", "source": "erquran.org"}, {"arabic": "مَالِكًا يَوْمَ", "translit": "mālikan yawma", "status": "shawādhdh", "type": "iḍ|Tnw", "note": "Indefinite accusative breaks construct: yawm as adverbial — introduces indefiniteness to the owner designation", "source": "erquran.org"}, {"arabic": "مَلِكًا يَوْمَ", "translit": "malikan yawma", "status": "shawādhdh", "type": "iḍ|Tnw|Lvw", "note": "Combines malik variant with iḍāfa-breaking: \"a king, on the day of judgment\"", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-y-n", "coRootAr": "د ي ن", "count": "17", "refs": "1:4;18:19;3:24;7:51;9:29;11:84;15:35;24:25;30:43;37:20", "note": "y-w-m and d-y-n co-occur 17 times — the phrase yawm al-dīn is a Quranic formula linking temporal reckoning with requital"}, {"coRoot": "m-l-k", "coRootAr": "م ل ك", "count": "12", "refs": "1:4;6:73;21:103;22:56;25:22;25:25;25:26;34:40;45:27;69:17", "note": "y-w-m and m-l-k co-occur 12 times, establishing that sovereignty (mulk) belongs exclusively to God on the eschatological day"}], "critical": [{"cat": "GRAM", "pattern": "Genitive in double iḍāfa", "kernel": "yawm is both governed by mālik (possessum) and governing al-dīn (possessor) — mediating between agent and principle"}, {"cat": "SEM", "pattern": "yawm polysemy: day vs epoch", "kernel": "Lane's: yawm = \"time absolutely\" not restricted to solar day — the \"day\" of judgment can be an era or dimension of time"}, {"cat": "INTER", "pattern": "yawm al-dīn formula (10+ ayahs)", "kernel": "Recurs across 1:4, 15:35, 26:82, 37:20, 38:78, 51:12, 56:56 — each instance reveals a distinct facet"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "الدِّينِ", "translit": "al-dīni", "gloss": "judgment, recompense, religion, way of life, debt", "root": "د ي ن (d-y-n)", "grammar": "Noun, genitive case (third element of iḍāfa chain), masculine singular, definite with al-; governed by yawmi", "semantics": ["[7C] دَانَ (dāna, I): to owe a debt, to be indebted; to submit, to be obedient; to judge, to requite", "[7C] دَيَّنَ (dayyana, II): to lend, to give on credit; to leave to someone's judgment", "[7C] دَيْن (dayn): debt, obligation, something owed — the financial-legal sense of the root", "[7C] دِين (dīn): religion, faith, way of life, life-system; the comprehensive mode of living and belief", "[7C] دِين (dīn): judgment, requital, recompense — the day when all acts receive their due return", "[7C] دِين (dīn): obedience, submission, compliance — dāna lahu = he obeyed/submitted to him", "[7C] دِين (dīn): custom, habit, established practice — what a people follow habitually (Lane's, Lisan al-Arab)", "[7C] Lane's: dīna = rain (archaic) — as that which descends and is \"owed\" to the earth; extremely rare sense", "[7C] Lisan al-Arab: al-dīn = al-jazā' (recompense), al-ḥisāb (reckoning), al-ṭāʿa (obedience), al-qahr (subjugation)", "[7C] Hans Wehr: dīn = religion, creed, faith; also: rule, dominion, power — \"kamā tadīnu tudānu\" (as you judge/treat, so you are judged/treated)", "[M] Modern: legal system, constitutional framework, life-governance structure; systematic principle of accountability", "[F] Futuristic: algorithmic judgment system, comprehensive evaluation framework; a system that processes all inputs and returns proportional outputs", "Core concept: a system of reciprocal accountability — debt/obligation on one side, judgment/requital on the other; the root holds both the debt and its settlement"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Religion/faith/way of life (dīn as religious system)", "count": "~94 ayahs (NOUN_ABSTRACT)", "examples": [{"ref": "3:85", "arabic": "وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَٰمِ دِينًۭا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ", "english": "Whoever seeks other than submission (al-islām) as a way of life (dīnan), it will not be accepted from him, and in the hereafter he will be among the losers"}, {"ref": "4:125", "arabic": "وَمَنْ أَحْسَنُ دِينًۭا مِّمَّنْ أَسْلَمَ وَجْهَهُۥ لِلَّهِ وَهُوَ مُحْسِنٌۭ وَٱتَّبَعَ مِلَّةَ إِبْرَٰهِيمَ حَنِيفًۭا", "english": "And who is better in way of life (dīnan) than one who submits his face to God while being a doer of good and follows the creed of Ibrahim?"}, {"ref": "2:193", "arabic": "وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌۭ وَيَكُونَ ٱلدِّينُ لِلَّهِ", "english": "And fight them until there is no persecution and the way of life (al-dīn) belongs to God"}]}, {"label": "B. Concrete noun — debt, financial obligation (dayn)", "count": "~15 ayahs (NOUN_CONCRETE)", "examples": [{"ref": "12:76", "arabic": "فَبَدَأَ بِأَوْعِيَتِهِمْ قَبْلَ وِعَآءِ أَخِيهِ ثُمَّ ٱسْتَخْرَجَهَا مِن وِعَآءِ أَخِيهِ ۚ كَذَٰلِكَ كِدْنَا لِيُوسُفَ ۖ مَا كَانَ لِيَأْخُذَ أَخَاهُ فِى دِينِ ٱلْمَلِكِ", "english": "He began with their containers before his brother's container — thus We planned for Yusuf; he could not have taken his brother under the law/system (dīn) of the king"}]}, {"label": "C. Judgment/recompense (yawm al-dīn formula)", "count": "~10 ayahs", "examples": [{"ref": "7:51", "arabic": "ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَهُمْ لَهْوًۭا وَلَعِبًۭا وَغَرَّتْهُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۚ فَٱلْيَوْمَ نَنسَىٰهُمْ كَمَا نَسُوا۟ لِقَآءَ يَوْمِهِمْ هَٰذَا", "english": "Those who took their way of life (dīnahum) as amusement and play, and the worldly life deluded them — so today We forget them as they forgot the meeting of this day (yawmihim) of theirs"}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "y-w-m", "coRootAr": "ي و م", "count": "17", "refs": "1:4;18:19;3:24;7:51;9:29;11:84;15:35;24:25;30:43;37:20", "note": "d-y-n and y-w-m co-occur 17 times — \"day\" and \"judgment/religion\" are semantically bonded across the Quran"}, {"coRoot": "m-l-k", "coRootAr": "م ل ك", "count": "2", "refs": "1:4;12:76", "note": "d-y-n and m-l-k co-occur in only 2 ayahs: 1:4 and 12:76 (dīn al-malik) — the twin construction links divine judgment with human legal systems"}], "critical": [{"cat": "SEM", "pattern": "dīn: judgment AND religion AND debt", "kernel": "Three fields converge: requital (jazā'), life-system (sharīʿa), obligation (dayn) — all active in this word"}, {"cat": "ECHO", "pattern": "dīn echoes dayn (debt) root", "kernel": "Same root d-y-n yields dīn (judgment) and dayn (debt) — yawm al-dīn is literally the day of debt-settlement"}, {"cat": "INTER", "pattern": "dīn al-malik (12:76) parallel", "kernel": "12:76 has dīn al-malik (king's law) — 1:4 inverts to mālik al-dīn: God is sovereign OVER the system itself"}, {"cat": "STRUCT", "pattern": "Third element in triple iḍāfa", "kernel": "Terminal position in genitive chain — the endpoint toward which mālik and yawm both point: the purpose"}], "tag": "CRITICAL"}], "questions": ["Why does the Quran preserve BOTH مَالِكِ (mālik, owner) and مَلِكِ (malik, king) as canonical readings — does the ambiguity serve a theological function by refusing to choose between ownership and sovereignty?", "Is the \"day\" (yawm) of al-dīn a literal single day, an epoch, or a timeless condition? The absence of temporal markers (no \"when,\" no verb) in this ayah leaves the temporal scope deliberately open.", "If dīn carries the meaning of \"debt\" (dayn), does yawm al-dīn imply a cosmic debt-settlement — and if so, who is the debtor and who is the creditor?", "The triple iḍāfa (mālik → yawm → al-dīn) moves from agent to time to principle. Does this sequence mirror a jurisdictional hierarchy: authority over time over justice?", "In 12:76, dīn al-malik means \"the law of the king\" — does 1:4 deliberately invert this to assert that in the divine court, the sovereign IS the law rather than being subject to it?", "The 21 qira'at variants on مَالِكِ alone make this the most phonetically varied word in al-Fātiḥa. Does the multiplicity of readings itself serve as a semantic feature, resisting any single fixed meaning?", "The verb variant مَلَكَ يَوْمَ (malaka yawma) transforms a timeless attribute into a past-tense action. What theological difference does it create to say \"He possessed the day\" (completed act) versus \"possessor of the day\" (ongoing attribute)?", "How does the absence of any verb in this ayah (pure nominal chain) differ from the verbal sentences surrounding it in al-Fātiḥa? Does the verbless construction place this attribute outside of time?", "kamā tadīnu tudānu (\"as you judge, so you are judged\") is a well-known Arabic aphorism using d-y-n. Does yawm al-dīn invoke this reciprocity principle — the day when the measure you applied is applied to you?", "If yawm can mean \"state/condition\" (Lisan al-Arab), does mālik yawm al-dīn allow the reading \"master of the state of judgment\" — ownership of a condition rather than a temporal period?", "The mālik/malik distinction maps onto a fundamental political question: does God own the day of judgment (property right) or rule it (sovereign authority)? Can ownership and sovereignty be separated in the divine context?", "12:76 shows d-y-n and m-l-k co-occurring to describe a human king's legal system. Does the Quran's placement of the same root-pair in 1:4 create a deliberate parallel between divine and human justice systems?", "Modern systems of accountability (legal codes, algorithmic scoring, data-driven assessment) all embody the dīn principle of \"measure and return.\" Does the word dīn anticipate any conceivable accountability system, not just eschatological judgment?", "The archaic sense of dīn as \"rain\" (Lane's) connects to agricultural cycles of sowing and reaping. Does this dormant meaning reinforce the requital semantics — you harvest what you sow?", "Given that mālik in 3:26 governs al-mulk (sovereignty itself) and in 1:4 governs yawm al-dīn, does the Quran present God's ownership as operating at the meta-level — owning not things but the systems that govern things?"], "key": "1:4"}, {"surah": 1, "ayah": 5, "arabic": "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", "transliteration": "iyyāka naʿbudu wa-iyyāka nastaʿīnu", "readings": [{"text": "You alone we serve, and You alone we seek aid from — both verbs in first-person plural imperfect with fronted accusative pronoun (iyyāka) marking restriction (qaṣr), establishing exclusive devotion and exclusive reliance as twin declarations", "rationale": "Fronting iyyāka before the verb creates ḥaṣr (restriction/exclusivity): the structure \"it is You we serve\" rather than \"we serve You\" — the emphasis is on the exclusion of all others, not merely on the act of worship or aid-seeking"}, {"text": "You alone do we devote ourselves to in total submission, and You alone do we call upon for empowerment — reading ʿ-b-d as total self-surrender (ʿubūdiyya) and Form X istaʿāna as seeking inner capacity, not merely external help", "rationale": "ʿ-b-d carries both \"worship\" and \"enslavement/total submission\" (Lane's: ʿabd = one who is owned); Form X of ʿ-w-n implies seeking to be made capable — the combination frames the human condition as one of total dependence yielding total empowerment"}, {"text": "You alone we align our actions with, and from You alone we derive operational capacity — reading ʿ-b-d as alignment/calibration (modern: servicing a system) and istaʿāna as sourcing functional power (modern: drawing energy/resources from a source)", "rationale": "In modern/futuristic register, ʿibāda can mean systematic alignment with a governing principle, and istiʿāna can mean drawing computational or operational resources — the ayah becomes a declaration of exclusive interface with a single source"}, {"text": "It is You we bind ourselves to in covenant, and it is You we ask to intervene — reading ʿ-b-d in its covenantal sense (cf. ʿahd/ʿabd overlap in Semitic languages where servanthood implies covenant) and istiʿāna as requesting active divine intervention in human affairs", "rationale": "The Semitic root ʿ-b-d overlaps with covenant language; combined with the exclusive fronting structure, this reading frames the ayah as a bilateral covenant declaration: the speaker pledges exclusive allegiance and in return requests exclusive divine support"}, {"text": "You alone we express devotion to through action, and You alone we rely on for the capacity to act — reading the wa as establishing a causal sequence (sababiyya) rather than simple coordination: worship produces the condition in which aid-seeking becomes possible", "rationale": "If wa functions as sababiyya (causative \"and therefore\"), the two clauses are not merely parallel but sequential: the act of exclusive devotion creates the ground for requesting exclusive aid — worship is the prerequisite for empowerment"}], "structure": {"beats": [{"label": "Exclusive devotion declaration", "lines": [{"arabic": "إِيَّاكَ نَعْبُدُ", "translit": "iyyāka naʿbudu", "english": "You alone we serve"}]}, {"label": "Exclusive aid-seeking declaration", "lines": [{"arabic": "وَإِيَّاكَ نَسْتَعِينُ", "translit": "wa-iyyāka nastaʿīnu", "english": "and You alone we seek aid from"}]}], "summary": "Perfect binary parallelism: both halves share identical syntactic structure (fronted accusative pronoun + first-person plural imperfect verb), linked by wa. The fronting of iyyāka before the verb in both clauses creates ḥaṣr (restriction) — the grammatical architecture itself enacts exclusivity. The shift from ʿibāda (devotion/service) to istiʿāna (aid-seeking) moves from human action toward God to divine action toward humans, creating a reciprocal loop within a single ayah."}, "words": [{"id": 1, "arabic": "إِيَّاكَ", "translit": "iyyāka", "gloss": "You alone (accusative exclusive pronoun)", "root": "— (no root)", "grammar": "Detached accusative pronoun, 2nd person masculine singular, fronted for ḥaṣr (restriction/exclusivity). Functions as the direct object of naʿbudu, placed before the verb to indicate that worship is directed exclusively to the addressee.", "semantics": ["[7C] Detached accusative pronoun marking exclusivity — grammatical particle with no triliteral root", "[7C] In classical Arabic grammar (Sībawayhi, al-Khalīl), iyyāka belongs to the category of ḍamāʾir munfaṣila (detached pronouns) in the accusative case", "[M] Modern pragmatic function: exclusive address marker, equivalent to \"You and no other\" — a targeting/selection operator", "Core concept: grammatical device for exclusive restriction (qaṣr), directing the verb's action to one and only one recipient"], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "هِيَّاكَ", "translit": "hiyyāka", "status": "shawādhdh", "type": "ibdāl", "note": "Initial hamza replaced by hāʾ — dialectal variant (Banū Tamīm); shifts phonetic register but not semantic content", "source": "erquran.org"}, {"arabic": "إِيَاكَ", "translit": "iyāka", "status": "Irreg", "type": "Gm", "note": "Lightened yāʾ (without shadda) — grammatical variant reducing emphasis on the pronoun", "source": "erquran.org"}, {"arabic": "أَيَّاكَ", "translit": "ayyāka", "status": "Irreg", "type": "vw", "note": "Fatḥa on initial hamza — variant vocalization not affecting semantic function", "source": "erquran.org"}, {"arabic": "هَيَّاكَ", "translit": "hayyāka", "status": "shawādhdh", "type": "vw|ibdāl", "note": "Both vowel change and consonant substitution (hamza→hāʾ + kasra→fatḥa); some link hayyāka to the root h-y-ʾ meaning \"to prepare/arrange\" — if so, the meaning shifts from \"You alone\" to \"prepare yourself/make ready\"", "source": "erquran.org"}, {"arabic": "وِيَّاكَ", "translit": "wiyyāka", "status": "shawādhdh", "type": "ibdāl", "note": "Hamza replaced by wāw — dialectal phonetic shift (reported from some Bedouin varieties)", "source": "erquran.org"}, {"arabic": "إِنَّا لَكَ", "translit": "innā laka", "status": "shawādhdh", "type": "Lx|sp|Dot", "note": "Completely different lexical reading: \"indeed we are for You\" — transforms the exclusive pronoun into a declarative sentence, shifting from restriction syntax to affirmation syntax", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-w-n", "coRootAr": "ع و ن", "count": "21", "refs": "1:5;18:102;3:64;3:182;7:128;8:41;8:51;9:104;11:109;16:2", "note": "ʿ-b-d and ʿ-w-n co-occur 21 times; in this ayah both are in the same sentence — worship and aid-seeking presented as inseparable pair"}], "critical": [{"cat": "GRAM", "pattern": "iyyāka fronted before verb", "kernel": "Fronting accusative pronoun before verb creates ḥaṣr (restriction) — \"You alone\" not \"we worship You among others\""}, {"cat": "STRUCT", "pattern": "iyyāka doubled in single ayah", "kernel": "Same pronoun opens both halves creating perfect binary symmetry — exclusivity declared twice, once for each direction"}, {"cat": "SEM", "pattern": "iyyāka as exclusive operator", "kernel": "Functions like a logical operator restricting the verb's scope to a single object — no other addressee permitted"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "نَعْبُدُ", "translit": "naʿbudu", "gloss": "we worship/serve/devote ourselves to", "root": "ع ب د (ʿ-b-d)", "grammar": "Form I imperfect, 1st person plural, indicative mood (marfūʿ). Active voice. Subject is \"we\" (naḥnu, implied). Direct object is the fronted iyyāka. Transitivity: MIXED — 76 with object, 5 without in Quran.", "semantics": ["[7C] Form I (faʿala): to worship, to serve, to obey with humility and submission", "[7C] ʿabd: slave, servant, bondsman — one who is owned and has no autonomous will (Lane's Lexicon)", "[7C] ʿibāda: worship, devotion, religious service, ritual practice (Lisan al-Arab: includes all acts of obedience)", "[7C] Classical extension: to make smooth, to pave a road (ṭarīq muʿabbad = a well-trodden path) — Lane's: \"he made it smooth and easy to walk upon\"", "[7C] Hans Wehr: to worship, to adore, to idolize; ʿabada also \"to enslave, to subjugate\"", "[M] Modern: to serve a system, to execute programmed functions, to align operational behavior with a governing protocol", "[F] Futuristic: to interface with, to synchronize with a primary system — ʿibāda as calibration of action to a central authority", "[7C] Intransitive reading (5 Quranic instances without object): absolute devotion without specifying recipient — worship as a state of being rather than directed action", "Core concept: total submission of will and action to another — encompassing worship, servitude, path-smoothing, and systematic alignment"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Imperfect verb — worship directed to God (command or declaration of exclusive worship)", "count": "~80 ayahs", "examples": [{"ref": "2:83", "arabic": "وَإِذْ أَخَذْنَا مِيثَٰقَ بَنِىٓ إِسْرَٰٓءِيلَ لَا تَعْبُدُونَ إِلَّا ٱللَّهَ وَبِٱلْوَٰلِدَيْنِ إِحْسَانًۭا وَذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَقُولُوا۟ لِلنَّاسِ حُسْنًۭا وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ ثُمَّ تَوَلَّيْتُمْ إِلَّا قَلِيلًۭا مِّنكُمْ وَأَنتُم مُّعْرِضُونَ", "english": "And when We took the covenant of the Children of Israel: you shall not serve (taʿbudūna) any but God, and show goodness to parents, and the near of kin, and orphans, and the needy, and speak well to people, and establish prayer and give the purifying-due; then you turned away except a few of you, and you were averse"}, {"ref": "2:133", "arabic": "أَمْ كُنتُمْ شُهَدَآءَ إِذْ حَضَرَ يَعْقُوبَ ٱلْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ مِنۢ بَعْدِى قَالُوا۟ نَعْبُدُ إِلَٰهَكَ وَإِلَٰهَ ءَابَآئِكَ إِبْرَٰهِۦمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ إِلَٰهًۭا وَٰحِدًۭا وَنَحْنُ لَهُۥ مُسْلِمُونَ", "english": "Were you witnesses when death came to Jacob, when he said to his sons: What will you serve (taʿbudūna) after me? They said: We shall serve (naʿbudu) your God and the God of your fathers Ibrahim and Ismail and Ishaq — one God — and to Him we are submitting"}]}]}, "qiraat": [{"arabic": "يُعْبَدُ", "translit": "yuʿbadu", "status": "14", "type": "Imp", "note": "Passive voice \"He is worshipped\" — transforms the declaration from active first-person devotion to a statement about God being the object of worship universally; removes the human agent", "source": "erquran.org"}, {"arabic": "نَعْبُدْ", "translit": "naʿbud", "status": "Irreg", "type": "CE", "note": "Apocopated (majzūm) ending — as if governed by an implied conditional or jussive particle; shifts mood from declarative statement to something conditional or volitional", "source": "erquran.org"}, {"arabic": "نِعْبُدُ", "translit": "niʿbudu", "status": "Irreg", "type": "vw", "note": "Kasra on initial nūn — dialectal phonetic variant (some Arab tribes used ni- instead of na- for first-person plural prefix)", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-w-n", "coRootAr": "ع و ن", "count": "21", "refs": "1:5;18:102;3:64;3:182;7:128;8:41;8:51;9:104;11:109;16:2", "note": "Worship (ʿ-b-d) and aid (ʿ-w-n) co-occur 21 times — servitude and assistance presented as a theological pair across the Quran"}, {"coRoot": "k-l-l", "coRootAr": "ك ل ل", "count": "16", "refs": "2:172;3:30;5:117;6:102;8:41;11:123;16:36;16:114;19:49;19:82", "note": "ʿ-b-d with k-l-l (\"all/every\") — worship linked to universality and totality"}], "critical": [{"cat": "GRAM", "pattern": "naʿbudu imperfect active", "kernel": "Imperfect tense marks ongoing continuous action — worship is not a completed event but a perpetual state of being"}, {"cat": "SEM", "pattern": "ʿ-b-d polysemy: worship + enslave + pave", "kernel": "Lane's attests \"to make smooth a road\" (ṭarīq muʿabbad) alongside worship — devotion as path-clearing, making way smooth"}, {"cat": "FORM", "pattern": "Form I simple vs Form II ʿabbada", "kernel": "Form I chosen over causative Form II — direct unmediated submission, not caused or intensified worship"}, {"cat": "INTER", "pattern": "naʿbudu echoes 2:133 (Jacob scene)", "kernel": "Same naʿbudu form in Jacob's sons' response — Fātiḥa speaker echoes patriarchal covenant language"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "وَ", "translit": "wa", "gloss": "and", "root": "— (no root)", "grammar": "Conjunction (ḥarf ʿaṭf), coordinating the two clauses. Connects the worship declaration to the aid-seeking declaration.", "semantics": ["[7C] ʿaṭf (coordination): joins two parallel elements of equal grammatical status — \"and\"", "[7C] Possible sababiyya (causative): \"and therefore\" — worship produces the condition for aid-seeking", "[7C] Possible maʿiyya (simultaneity): worship and aid-seeking occur together, not sequentially", "Core concept: connective particle whose function (coordination, causation, or simultaneity) shapes the theological relationship between the two declarations"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "wa as ʿaṭf or sababiyya", "kernel": "If coordinative: worship and aid-seeking are parallel; if causative: worship is prerequisite for receiving aid"}, {"cat": "STRUCT", "pattern": "wa bisects the ayah symmetrically", "kernel": "Single conjunction creates the pivot point between the two matched halves of the binary structure"}]}, {"id": 4, "arabic": "إِيَّاكَ", "translit": "iyyāka", "gloss": "You alone (accusative exclusive pronoun)", "root": "— (no root)", "grammar": "Detached accusative pronoun, 2nd person masculine singular, repeated from the first half. Functions as direct object of nastaʿīnu, maintaining the ḥaṣr (restriction) structure in the second clause.", "semantics": ["[7C] Detached accusative pronoun — second occurrence maintaining the exclusivity restriction in the parallel clause", "[7C] Repetition of the identical pronoun reinforces that the same exclusive addressee governs both worship and aid-seeking", "Core concept: repeated exclusive operator — the doubling makes the restriction emphatic and structurally complete"], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "وَوِيَّاكَ", "translit": "wa-wiyyāka", "status": "shii", "type": "ibdāl", "note": "Shia reading: hamza replaced by wāw, creating wa-wiyyāka — dialectal phonetic variant", "source": "erquran.org"}, {"arabic": "وَإِنَّا لَكَ", "translit": "wa-innā laka", "status": "shawādhdh", "type": "Lx|sp", "note": "Lexical variant: \"and indeed we are for You\" — parallel to the first iyyāka variant, transforming restriction into declaration", "source": "erquran.org"}, {"arabic": "وَأَيَّاكَ", "translit": "wa-ayyāka", "status": "Irreg", "type": "vw", "note": "Fatḥa on initial hamza — variant vocalization", "source": "erquran.org"}, {"arabic": "وَإِيَاكَ", "translit": "wa-iyāka", "status": "Irreg", "type": "Gm", "note": "Lightened yāʾ without shadda — grammatical variant", "source": "erquran.org"}], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "iyyāka repeated with identical syntax", "kernel": "Second iyyāka mirrors first exactly — same pronoun, same fronted position, same ḥaṣr function for a different verb"}, {"cat": "ECHO", "pattern": "iyyāka→iyyāka root-echo (word 1→4)", "kernel": "Exact lexical repetition across the ayah's two halves creates a phonetic and semantic frame — exclusivity echoes itself"}], "tag": "CRITICAL"}, {"id": 5, "arabic": "نَسْتَعِينُ", "translit": "nastaʿīnu", "gloss": "we seek aid/help", "root": "ع و ن (ʿ-w-n)", "grammar": "Form X (istafʿala) imperfect, 1st person plural, indicative (marfūʿ). Form X = seeking/requesting the root meaning. Direct object is fronted iyyāka. This is the ONLY Form X occurrence of ʿ-w-n in the Quran.", "semantics": ["[7C] Form X (istafʿala): to seek aid, to ask for help, to request assistance — Lane's Lexicon: istaʿāna bihi \"he sought aid/help of him\"", "[7C] Root ʿ-w-n base meaning: to help, to aid, to assist, to support — Lane's: ʿāwanahu \"he helped/aided him\"", "[7C] ʿawn: help, aid, assistance, support; muʿāwana: mutual help, cooperation (Hans Wehr)", "[7C] maʿūna: aid, assistance, subsidy — also tribute or tax (classical fiscal term, Lisan al-Arab)", "[M] taʿāwun: mutual assistance, cooperation, teamwork (Hans Wehr: modern social/political usage)", "[7C] Classical extension: ʿawān = middle-aged (between young and old) — a cow neither young nor old (2:68); also a recurring war (ḥarb ʿawān) — Lisan al-Arab", "[7C] Form X (istafʿala) = seeking/requesting the action — marks the speaker as actively requesting capacity, not passively receiving it", "[M] Modern: to source operational support, to access system resources — istiʿāna as interfacing with a power grid or network", "[F] Futuristic: to draw computational power from a central processor — seeking aid as requesting allocation of processing capacity from a governing system", "Core concept: actively requesting support/capacity from an external source — Form X marks the speaker as the seeker, not the provider"], "occurrences": {"type": "all", "items": [{"ref": "1:5", "arabic": "— this ayah —", "english": "The only Quranic instance of Form X (istaʿāna) of root ʿ-w-n as an imperfect verb — this form appears nowhere else in the Quran in this exact conjugation"}]}, "qiraat": [{"arabic": "نِسْتَعِينُ", "translit": "nistaʿīnu", "status": "14", "type": "vw", "note": "Kasra on initial nūn — canonical variant among the fourteen readings; dialectal prefix ni- for first-person plural", "source": "erquran.org"}, {"arabic": "نَسْتَعِينُۥ", "translit": "nastaʿīnū", "status": "Irreg", "type": "madd", "note": "Extended final vowel (madd) — adds phonetic weight to the closing word, emphasizing the aid-seeking declaration", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-b-d", "coRootAr": "ع ب د", "count": "21", "refs": "1:5;18:102;3:64;3:182;7:128;8:41;8:51;9:104;11:109;16:2", "note": "Aid-seeking (ʿ-w-n) and worship (ʿ-b-d) co-occur 21 times — theological inseparability of servitude and assistance"}], "critical": [{"cat": "FORM", "pattern": "Form X istafʿala — seeking aid", "kernel": "Form X marks active requesting — speaker deliberately seeks capacity, not passively receiving help"}, {"cat": "HAPAX", "pattern": "Only Form X ʿ-w-n imperfect in Quran", "kernel": "nastaʿīnu is unique — this exact conjugation appears only here, making the Fātiḥa's aid-seeking formulation unrepeated"}, {"cat": "SEM", "pattern": "ʿ-w-n polysemy: aid + middle + war", "kernel": "Lane's: ʿawān = \"middle-aged\" and \"recurring war\" — aid-seeking implies struggle and in-between state"}, {"cat": "ECHO", "pattern": "naʿbudu→nastaʿīnu verb echo", "kernel": "Both share na- prefix (same subject) but action reverses: giving worship then requesting aid"}], "tag": "CRITICAL"}], "questions": ["Why does the Quran use the fronted accusative pronoun (iyyāka) for exclusivity rather than the more common illā (exception) construction like lā naʿbudu illā iyyāka? What does the syntactic choice of ḥaṣr by fronting achieve that exception syntax cannot?", "The shift from naʿbudu (active devotion from human to God) to nastaʿīnu (request for capacity from God to human) creates a directional reversal within a single ayah — does this binary structure establish a template for all subsequent Quranic God-human interactions?", "If wa between the two clauses is read as sababiyya (causative) rather than ʿaṭf (coordination), worship becomes the prerequisite for receiving aid — does the Quran elsewhere support this conditional reading?", "The Form X (istafʿala) of nastaʿīnu implies active seeking of aid rather than passive reception — is there a theological distinction between being given help (Form IV aʿāna) and seeking help (Form X istaʿāna)?", "The variant yuʿbadu (passive: \"He is worshipped\") for naʿbudu removes human agency entirely — how does this interact with the active nastaʿīnu in the second half? Can one passively worship but actively seek aid?", "ʿ-b-d also means \"to pave/smooth a road\" (Lane's: ṭarīq muʿabbad) — could naʿbudu carry the sense of \"we clear the path toward You\" alongside worship, creating a journey metaphor?", "Why is nastaʿīnu (Form X of ʿ-w-n) the ONLY occurrence of this conjugation in the entire Quran? Does its uniqueness to the Fātiḥa — the most repeated surah — carry structural significance?", "The variant innā laka (\"indeed we are for You\") for iyyāka transforms the pronoun into a full declarative sentence — does this suggest an early reading tradition where 1:5 was a covenant formula rather than a restriction statement?", "Classical Arabic ʿawān means \"middle-aged, neither young nor old\" and \"recurring war\" — could nastaʿīnu carry undertones of being in a state of struggle (ḥarb ʿawān) and seeking resolution?", "The exact parallelism (iyyāka + verb, iyyāka + verb) creates a binary structure unusual in Quranic syntax — does this mirror or contrast with other binary declarations in the Quran (e.g., 94:5-6 inna maʿa l-ʿusri yusrā repeated)?", "If ʿibāda in the futuristic register means systematic alignment with a governing protocol, and istiʿāna means sourcing operational capacity, does 1:5 describe an exclusive interface declaration — like a system binding itself to a single operating source?", "The root ʿ-w-n has only 11 total Quranic occurrences — why is such a rare root chosen for the most frequently recited ayah in the Quran?"], "key": "1:5"}, {"surah": 1, "ayah": 6, "arabic": "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "transliteration": "ihdinā ṣ-ṣirāṭa l-mustaqīma", "readings": [{"text": "Guide us [to] the straight path — a plea for directional orientation, with hidāya as showing the way and ṣirāṭ as a defined, singular route.", "rationale": "ihdinā parsed as Form I imperative with 1st plural object suffix; ṣirāṭ as accusative direct object (second object of double-transitive h-d-y); mustaqīm as adjectival qualifier from Form X of q-w-m meaning \"that which establishes itself upright.\""}, {"text": "Lead us along the self-correcting course — reading mustaqīm as active participle with reflexive Form X force: a path that actively straightens itself, not merely a static \"straight\" line.", "rationale": "Form X istaqāma carries reflexive-estimative meaning: \"to seek to stand, to establish oneself upright.\" The path is not passively straight but actively self-correcting. ihdinā can mean \"walk us through\" (Lane's: hadā as \"to walk before and lead\")."}, {"text": "Grant us the navigational capacity for the self-sustaining trajectory — a futuristic reading where hidāya is internal programming or calibration, ṣirāṭ is an optimal trajectory, and mustaqīm is a self-stabilizing system.", "rationale": "ihdinā as \"install in us the capacity to find the way\" (not just external showing); ṣirāṭ as any optimal course (not limited to physical road); mustaqīm as autonomously self-correcting — a system that returns to center when perturbed. Applicable to guidance systems, AI alignment, or moral compass."}, {"text": "Show us the path of those who stand (qaum) — connecting mustaqīm back to q-w-m root meaning \"people/nation/standing\" so the \"straight path\" is simultaneously \"the path of those who stand [for truth].\"", "rationale": "q-w-m root carries both \"to stand/be upright\" and \"people/community.\" The path described is not abstract geometry but the way walked by those who stand — linking ṣirāṭ al-mustaqīm to ṣirāṭ alladhīna (1:7). The adjective encodes the social identity of path-walkers."}, {"text": "Orient us [toward] the consuming road — reading ṣirāṭ through its disputed connection to the root s-r-t meaning \"to swallow\" (Lane's Lexicon: ṣirāṭ = a road, so called because it swallows travelers), making the path an all-encompassing trajectory that absorbs the walker entirely.", "rationale": "Lane's Lexicon notes ṣirāṭ may derive from a root meaning \"to swallow\" — the road swallows its travelers. This reading frames the path not as something walked upon but as something that consumes the walker, demanding total immersion. The double-transitive construction (ihdinā aṣ-ṣirāṭa) supports this: we are not merely placed on the path but given over to it."}], "structure": {"beats": [{"label": "Supplication: request for guidance", "lines": [{"arabic": "ٱهْدِنَا", "translit": "ihdinā", "english": "Guide us"}]}, {"label": "Object: the specified path", "lines": [{"arabic": "ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "translit": "ṣ-ṣirāṭa l-mustaqīma", "english": "The straight path"}]}], "summary": "The ayah is a single imperative clause: verb (ihdinā) + double accusative object (aṣ-ṣirāṭa al-mustaqīma). No conjunction, no condition, no subordination — the barest possible grammatical structure for a supplication. The verb h-d-y in its double-transitive construction takes both \"us\" (object suffix -nā) and \"the path\" (second accusative) simultaneously, meaning either \"guide us to the path\" or \"guide us along the path.\" The definite article on aṣ-ṣirāṭ (al- assimilated to ṣ) presupposes a KNOWN path — this is not \"a path\" but \"THE path,\" implying prior knowledge or uniqueness. The adjective al-mustaqīm (definite, matching the noun) closes the clause with a participle that is simultaneously stative (straight) and active (self-straightening, from Form X reflexive). The entire ayah is three words performing one act: asking."}, "words": [{"id": 1, "arabic": "اهْدِنَا", "translit": "ihdinā", "gloss": "guide us / lead us / show us the way", "root": "ه د ي (h-d-y)", "grammar": "Form I imperative, 2nd person masculine singular (addressing God), with 1st person plural object suffix -nā. Double-transitive verb: takes both \"us\" (suffix) and \"the path\" (second accusative). The imperative directed at God transforms command grammar into supplication grammar.", "semantics": ["[7C] فَعَلَ (fa'ala, I): to guide, to show the way, to lead on the right path, to walk before someone leading them", "[7C] Lane's Lexicon: hadā — to guide aright, to direct to the way; also: hadā l-'arūs — to conduct a bride to her husband; hadā l-ibil — to drive/lead camels from the front (not from behind)", "[7C] Lisan al-Arab: al-hudā — opposite of ḍalāl (going astray); also: the gift (hadiyya) sent forward, the sacrificial animal led to slaughter (hady)", "[7C] Hans Wehr: to lead the right way, to guide; II: to give as a present; IV: to present, to give (a gift); VIII: to be rightly guided, to find the way", "[7C] Root tension: h-d-y encompasses both \"guiding to truth\" and \"leading an animal to sacrifice\" — the guided one may be led to illumination or to total self-offering", "[M] Modern: to navigate, to orient, to calibrate (a system, a compass, a trajectory)", "[F] Futuristic: to program, to align (AI alignment), to install directional capacity — guidance as internal reconfiguration rather than external pointing", "Core concept: directed leading from the front — the guide goes ahead, the guided follows along a known trajectory"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Form I imperative — direct supplication for guidance (CV)", "count": "1", "examples": [{"ref": "1:6", "arabic": "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "english": "Guide us the straight path — sole occurrence of this exact imperative form (ihdinā) in the Quran"}]}, {"label": "B. Form I imperfect — God guides whom He wills (IV)", "count": "~109", "examples": [{"ref": "2:142", "arabic": "۞ سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا ۚ قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ ۚ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "The foolish among people will say: What turned them from their qibla? Say: To God belongs the east and west — He guides (yahdī) whom He wills to a straight path"}, {"ref": "2:213", "arabic": "كَانَ ٱلنَّاسُ أُمَّةًۭ وَٰحِدَةًۭ فَبَعَثَ ٱللَّهُ ٱلنَّبِيِّۦنَ مُبَشِّرِينَ وَمُنذِرِينَ وَأَنزَلَ مَعَهُمُ ٱلْكِتَٰبَ بِٱلْحَقِّ لِيَحْكُمَ بَيْنَ ٱلنَّاسِ فِيمَا ٱخْتَلَفُوا۟ فِيهِ ۚ وَمَا ٱخْتَلَفَ فِيهِ إِلَّا ٱلَّذِينَ أُوتُوهُ مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَٰتُ بَغْيًۢا بَيْنَهُمْ ۖ فَهَدَى ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ لِمَا ٱخْتَلَفُوا۟ فِيهِ مِنَ ٱلْحَقِّ بِإِذْنِهِۦ ۗ وَٱللَّهُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍ", "english": "Humanity was one nation, then God sent prophets... and God guided (hadā) those who believed... God guides (yahdī) whom He wills to a straight path"}]}, {"label": "C. Gerund hudā — guidance as abstract concept", "count": "~92", "examples": [{"ref": "17:9", "arabic": "إِنَّ هَٰذَا ٱلْقُرْءَانَ يَهْدِى لِلَّتِى هِىَ أَقْوَمُ وَيُبَشِّرُ ٱلْمُؤْمِنِينَ ٱلَّذِينَ يَعْمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ أَجْرًۭا كَبِيرًۭا", "english": "This Quran guides (yahdī) to that which is most upright (aqwam) and gives good tidings to believers who do good works — that for them is a great reward"}, {"ref": "17:97", "arabic": "وَمَن يَهْدِ ٱللَّهُ فَهُوَ ٱلْمُهْتَدِ ۖ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُمْ أَوْلِيَآءَ مِن دُونِهِۦ", "english": "Whomever God guides (yahdī), he is the rightly-guided (muhtadī); whomever He sends astray, you will never find for them allies besides Him"}]}]}, "qiraat": [{"arabic": "أَرْشِدْنَا", "translit": "arshidnā", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution replacing ihdinā with arshidnā (show us the right way, from r-sh-d). Shifts from general guidance to rational discernment — rushd implies maturity of judgment.", "source": "erquran.org"}, {"arabic": "بَصِّرْنَا", "translit": "baṣṣirnā", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution with baṣṣirnā (make us see, from b-ṣ-r Form II causative). Reframes guidance as granting vision — not leading but opening eyes. Sensory metaphor replaces directional metaphor.", "source": "erquran.org"}, {"arabic": "تُرْشِدُ سَبِيلَ الْمُسْتَقيمِ", "translit": "turshidu sabīla l-mustaqīmi", "status": "shii", "type": "Stx|Lx", "note": "Major syntactic restructuring: changes imperative supplication to declarative statement (\"You guide the straight path\"), eliminates -nā suffix, and replaces ṣirāṭ with sabīl. Transforms prayer into assertion.", "source": "erquran.org"}, {"arabic": "أَرْشِدْنَا سَبِيلَ الْمُسْتَقيمِ", "translit": "arshidnā sabīla l-mustaqīmi", "status": "shawādhdh", "type": "Lx|Stx", "note": "Combines lexical substitution (arshidnā for ihdinā) with noun substitution (sabīl for ṣirāṭ). Both mean \"path\" but sabīl implies a way with multiple travelers, while ṣirāṭ is a singular defined road.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "q-w-m", "coRootAr": "ق و م", "count": "65", "refs": "1:6;17:9;17:97;2:142;2:213;2:258;2:264;3:86;3:101;4:46", "note": "Guidance (h-d-y) and standing/uprightness (q-w-m) co-occur 65 times — the two most fundamental concepts in this ayah appear as a persistent Quranic pair"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "20", "refs": "1:6;2:142;2:213;3:101;4:68;4:175;5:16;6:87;6:161;10:25", "note": "Guidance (h-d-y) and path (s-r-t) form a 20-ayah cluster — guidance in the Quran is inseparable from the metaphor of a defined road"}], "critical": [{"cat": "GRAM", "pattern": "ihdinā: imperative to God + 1pl suffix", "kernel": "Imperative to the Divine converts command into supplication — h-d-y appears as ihdinā only here in the Quran"}, {"cat": "HAPAX", "pattern": "ihdinā: sole occurrence of this CV form", "kernel": "Exact imperative ihdinā occurs once in the Quran — the foundational daily prayer uses a hapax form"}, {"cat": "SEM", "pattern": "h-d-y polysemy: guide / lead to sacrifice", "kernel": "Lane's: hadā = \"guide aright\" AND \"lead sacrificial animal\" — supplicant asks to be led or to be offered"}, {"cat": "INTER", "pattern": "h-d-y + s-r-t + q-w-m triple (1:6, 2:142)", "kernel": "Triple h-d-y + s-r-t + q-w-m in 1:6 echoed in 2:142 and 2:213 — Fatiha encodes a root pattern repeated across Quran"}, {"cat": "FORM", "pattern": "Form I hadā vs Form IV ahdā", "kernel": "Form I = direct personal guidance; Form IV ahdā = \"to present a gift\" — form choice frames guidance as leading"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "الصِّرَاطَ", "translit": "aṣ-ṣirāṭa", "gloss": "the path / the road / the way", "root": "ص ر ط (s-r-t)", "grammar": "Definite noun, accusative case (second object of double-transitive ihdinā). The definite article al- (assimilated to ṣ as aṣ-ṣ) marks this as THE known path, not any path. Accusative naṣb indicates it functions as the direct object specifying the goal of guidance.", "semantics": ["[7C] Lane's Lexicon: aṣ-ṣirāṭ — a road, a way, a path; said to be from saraṭa (to swallow) because the road swallows travelers, or because travelers swallow it (traverse it)", "[7C] Lisan al-Arab: aṣ-ṣirāṭ = aṭ-ṭarīq — a clear, open road; the bridge over Hellfire (in eschatological usage); also: the sharp edge of a sword", "[7C] Classical Arabic (pre-Islamic): borrowed from Latin strāta (paved road) via Aramaic — a constructed, engineered path, not a natural trail", "[7C] Hans Wehr: ṣirāṭ — path, way; ṣirāṭ mustaqīm — the straight path (religious usage)", "[7C] Semantic tension: ṣirāṭ as \"that which swallows\" (saraṭa) vs \"that which is traversed\" — the path may consume the walker or be consumed by the walker", "[M] Modern: trajectory, course, route — any defined passage from origin to destination (career path, data pathway, flight path)", "[F] Futuristic: optimal route through possibility space — an algorithm's decision path, a neural pathway, a quantum trajectory through state-space", "Core concept: a defined, singular, traversable course — distinguished from sabīl (way with multiple lanes) by its singularity and definiteness"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ṣirāṭ as direct object — the path one is guided to or walks", "count": "~8", "examples": [{"ref": "1:7", "arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ", "english": "The path of those upon whom You have bestowed favor — not of those who earned wrath nor of those who went astray"}, {"ref": "42:53", "arabic": "صِرَٰطِ ٱللَّهِ ٱلَّذِى لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ أَلَآ إِلَى ٱللَّهِ تَصِيرُ ٱلْأُمُورُ", "english": "The path of God, to whom belongs what is in the heavens and what is in the earth — indeed, to God all matters return (taṣīru)"}]}, {"label": "B. ṣirāṭ as prepositional object — on/upon the path", "count": "~22", "examples": [{"ref": "6:39", "arabic": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا صُمٌّۭ وَبُكْمٌۭ فِى ٱلظُّلُمَٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "Those who denied Our signs are deaf and mute in darknesses. Whom God wills He sends astray, and whom He wills He places upon a straight path (ṣirāṭin mustaqīmin)"}, {"ref": "16:76", "arabic": "وَضَرَبَ ٱللَّهُ مَثَلًۭا رَّجُلَيْنِ أَحَدُهُمَآ أَبْكَمُ لَا يَقْدِرُ عَلَىٰ شَىْءٍۢ وَهُوَ كَلٌّ عَلَىٰ مَوْلَىٰهُ أَيْنَمَا يُوَجِّههُّ لَا يَأْتِ بِخَيْرٍ ۖ هَلْ يَسْتَوِى هُوَ وَمَن يَأْمُرُ بِٱلْعَدْلِ ۙ وَهُوَ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "God sets forth a parable of two men — one mute, incapable... is he equal to one who commands justice and is upon a straight path (ṣirāṭin mustaqīmin)?"}]}, {"label": "C. ṣirāṭ in possessive construction — path of God, path of those favored", "count": "~7", "examples": [{"ref": "7:86", "arabic": "وَلَا تَقْعُدُوا۟ بِكُلِّ صِرَٰطٍۢ تُوعِدُونَ وَتَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ بِهِۦ وَتَبْغُونَهَا عِوَجًۭا", "english": "Do not sit on every path (ṣirāṭ) threatening and turning away from God's way (sabīl) those who believe in Him, seeking crookedness"}]}]}, "qiraat": [{"arabic": "السِّرَاطَ", "translit": "as-sirāṭa", "status": "7", "type": "ibdāl", "note": "Canonical: ṣād replaced by sīn — as-sirāṭa. The phonetic shift from emphatic ṣ to plain s softens the articulation but preserves meaning. Both ṣ and s are attested as original.", "source": "erquran.org"}, {"arabic": "الصؗرَاطَ", "translit": "aṣᶻ-ṣᶻirāṭa", "status": "7", "type": "ibdāl", "note": "Canonical: ṣād pronounced with ishmām (a trace of z-sound blended into ṣ). Creates a phoneme between ṣ and z, attesting to dialectal variation in the original pronunciation.", "source": "erquran.org"}, {"arabic": "صِرَاطًا مُسْتَقِيمًا", "translit": "ṣirāṭan mustaqīman", "status": "14", "type": "al|Tnw", "note": "Drops the definite article and shifts to indefinite accusative tanwīn: \"a straight path\" instead of \"THE straight path.\" Removes the presupposition of a single known path — opens the reading to any path that is straight.", "source": "erquran.org"}, {"arabic": "الزِّرَاطَ", "translit": "az-zirāṭa", "status": "Irreg", "type": "ibdāl", "note": "Non-canonical: ṣād fully replaced by zāy. The emphatic sound disappears entirely. Historically attested but not in standard transmission chains.", "source": "erquran.org"}, {"arabic": "صِرَاطَ", "translit": "ṣirāṭa", "status": "shawādhdh", "type": "al", "note": "Drops the definite article while keeping accusative without tanwīn — a bare proper-noun-like usage, treating ṣirāṭ as a name rather than a common noun.", "source": "erquran.org"}, {"arabic": "الصِّرَاطَ صِرَاطَكَ", "translit": "aṣ-ṣirāṭa ṣirāṭaka", "status": "shii", "type": "±", "note": "Adds ṣirāṭaka (Your path) as an appositive — \"the path, Your path.\" Explicitly attributes the path to God, eliminating ambiguity about whose path is meant.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "q-w-m", "coRootAr": "ق و م", "count": "33", "refs": "1:6;19:36;2:142;2:213;3:51;3:101;4:68;4:175;5:16;6:39", "note": "Path (s-r-t) and standing/uprightness (q-w-m) form a 33-ayah cluster — the Quran consistently pairs the road metaphor with the concept of vertical integrity"}, {"coRoot": "h-d-y", "coRootAr": "ه د ي", "count": "20", "refs": "1:6;2:142;2:213;3:101;4:68;4:175;5:16;6:87;6:161;10:25", "note": "Path (s-r-t) and guidance (h-d-y) co-occur in 20 ayahs — the path is never described without the concept of being guided to or along it"}, {"coRoot": "s-b-l", "coRootAr": "س ب ل", "count": "4", "refs": "1:7;5:16;6:153;7:86", "note": "Path (s-r-t) and way (s-b-l) appear together 4 times — the two near-synonyms are juxtaposed to distinguish singular ṣirāṭ from plural subul"}], "critical": [{"cat": "SEM", "pattern": "ṣirāṭ etymology: saraṭa \"to swallow\"", "kernel": "Lane's: ṣirāṭ from saraṭa (swallowing) — the road swallows travelers or is swallowed by them, total immersion"}, {"cat": "GRAM", "pattern": "definite article al- on ṣirāṭ", "kernel": "Definite al- marks THE path (known, unique, presupposed) — 14-variant ṣirāṭan mustaqīman opens to \"any straight path\""}, {"cat": "INTER", "pattern": "ṣirāṭ vs sabīl (7:86, 6:153)", "kernel": "ṣirāṭ (singular road) and sabīl (traversed way) juxtaposed in 7:86 and 6:153 — ṣirāṭ is singular, sabīl plural"}, {"cat": "ECHO", "pattern": "ṣirāṭ (1:6) echoed by ṣirāṭ (1:7)", "kernel": "Path in 1:6 immediately specified in 1:7 as \"path of those You favored\" — echo across ayahs defines via social identity"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "الْمُسْتَقِيمَ", "translit": "al-mustaqīma", "gloss": "the straight / the upright / the self-establishing", "root": "ق و م (q-w-m)", "grammar": "Active participle of Form X (istaqāma), definite accusative, functioning as adjective modifying aṣ-ṣirāṭa. Form X istaf'ala adds reflexive-estimative meaning to root q-w-m (to stand): \"that which causes itself to stand upright / that which seeks to establish itself.\" The ism fā'il (active participle) indicates an ongoing state, not a completed action.", "semantics": ["[7C] فَعَلَ (fa'ala, I): to stand, to rise, to be upright; to stand firm; to undertake, to carry out", "[7C] أَقَامَ (aqāma, IV): to erect, to establish, to set up; to perform (prayer: aqāma ṣ-ṣalāta); to straighten", "[7C] اِسْتَقَامَ (istaqāma, X): to be straight, to be upright, to be correct; to go straight; to stand firm on the right path", "[7C] Lane's Lexicon: qāma — to stand; al-qiyāma — the rising/resurrection; al-qawm — a people/tribe (those who stand together); al-qīma/qiyam — value, worth (what something stands at)", "[7C] Lisan al-Arab: istaqāma — to become straight after crookedness; to be moderate, to be just; al-mustaqīm — one who does not deviate; also: al-qawwām — the one who sustains/maintains", "[7C] Hans Wehr: qāma — to stand up, to get up, to rise; to take place; to cost (a price); qiyām — standing, existence, support; mustaqīm — straight, direct, upright, correct, proper", "[7C] Root tension: q-w-m encompasses \"to stand\" AND \"a people/nation\" AND \"value/price\" AND \"resurrection\" — uprightness, community, worth, and eschatology share one root", "[M] Modern: self-correcting, self-calibrating, auto-stabilizing — a system that detects deviation and returns to center (like a gyroscope or guidance algorithm)", "[F] Futuristic: autonomously aligned, self-governing trajectory — a path with embedded correction mechanisms; applicable to AI alignment, self-healing networks, or adaptive routing", "Core concept: active vertical integrity — not passive straightness but dynamic self-maintenance of uprightness, encoded by Form X reflexive"], "occurrences": {"type": "grouped", "groups": [{"label": "A. mustaqīm as adjective for ṣirāṭ — the straight path", "count": "~33", "examples": [{"ref": "2:142", "arabic": "۞ سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا ۚ قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ ۚ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "The foolish will say: what turned them from their qibla? Say: God guides (yahdī) whom He wills to a straight path (ṣirāṭin mustaqīmin)"}, {"ref": "6:39", "arabic": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا صُمٌّۭ وَبُكْمٌۭ فِى ٱلظُّلُمَٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "Those who denied Our signs — deaf and mute in darknesses. Whom God wills He leads astray, whom He wills He places upon a straight path (ṣirāṭin mustaqīmin)"}]}, {"label": "B. mustaqīm as adjective for other nouns (dīn, hudā, etc.)", "count": "~10", "examples": [{"ref": "19:36", "arabic": "وَإِنَّ ٱللَّهَ رَبِّى وَرَبُّكُمْ فَٱعْبُدُوهُ ۚ هَٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ", "english": "Indeed God is my Lord and your Lord, so worship Him — this is a straight path (ṣirāṭun mustaqīmun)"}]}, {"label": "C. Form X verb istaqāma — to be/become straight, to stand firm", "count": "~8", "examples": [{"ref": "2:213", "arabic": "كَانَ ٱلنَّاسُ أُمَّةًۭ وَٰحِدَةًۭ فَبَعَثَ ٱللَّهُ ٱلنَّبِيِّۦنَ مُبَشِّرِينَ وَمُنذِرِينَ وَأَنزَلَ مَعَهُمُ ٱلْكِتَٰبَ بِٱلْحَقِّ لِيَحْكُمَ بَيْنَ ٱلنَّاسِ فِيمَا ٱخْتَلَفُوا۟ فِيهِ ۚ وَمَا ٱخْتَلَفَ فِيهِ إِلَّا ٱلَّذِينَ أُوتُوهُ مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَٰتُ بَغْيًۢا بَيْنَهُمْ ۖ فَهَدَى ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ لِمَا ٱخْتَلَفُوا۟ فِيهِ مِنَ ٱلْحَقِّ بِإِذْنِهِۦ ۗ وَٱللَّهُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍ", "english": "Humanity was one nation... God guided those who believed... God guides whom He wills to a straight path — h-d-y and q-w-m unite again"}]}]}, "qiraat": [{"arabic": "صِرَاطًا مُسْتَقِيمًا", "translit": "ṣirāṭan mustaqīman", "status": "14", "type": "al|Tnw", "note": "Part of the variant that drops the definite article from both ṣirāṭ and mustaqīm — shifts from \"THE straight path\" to \"A straight path,\" affecting the uniqueness claim.", "source": "erquran.org"}, {"arabic": "تُرْشِدُ سَبِيلَ الْمُسْتَقيمِ", "translit": "turshidu sabīla l-mustaqīmi", "status": "shii", "type": "Stx|Lx", "note": "In this restructuring, mustaqīm shifts from adjective of ṣirāṭ to genitive modifier of sabīl — \"the way of the straight/upright one.\" This personalizes the path: it belongs to someone who is mustaqīm, rather than describing the path itself.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "h-d-y", "coRootAr": "ه د ي", "count": "65", "refs": "1:6;17:9;17:97;2:142;2:213;2:258;2:264;3:86;3:101;4:46", "note": "Uprightness (q-w-m) and guidance (h-d-y) co-occur 65 times — the Quran treats standing firm and being guided as interdependent concepts"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "33", "refs": "1:6;19:36;2:142;2:213;3:51;3:101;4:68;4:175;5:16;6:39", "note": "Uprightness (q-w-m) and path (s-r-t) co-occur 33 times — the path metaphor requires the vertical axis of q-w-m to define its orientation"}, {"coRoot": "w-z-n", "coRootAr": "و ز ن", "count": "10", "refs": "7:85;11:84;11:85;17:35;18:105;18:105;21:47;26:182;55:9;57:25", "note": "Standing (q-w-m) and weighing (w-z-n) co-occur 10 times — uprightness is linked to just measure, connecting moral straightness to economic fairness"}], "critical": [{"cat": "FORM", "pattern": "Form X istaf'ala: reflexive-estimative", "kernel": "Form X adds reflexive force to q-w-m: not \"made straight\" but \"seeking to stand itself upright\" — active self-correction"}, {"cat": "SEM", "pattern": "q-w-m polysemy: stand / people / value / rise", "kernel": "One root yields qāma (stand), qawm (people), qīma (value), qiyāma (resurrection) — all four fields active here"}, {"cat": "ECHO", "pattern": "mustaqīm (1:6) → aqwam (17:9)", "kernel": "Quran guides to \"that which is aqwam\" (most upright, 17:9) — same root q-w-m echoes the Fatiha's mustaqīm"}, {"cat": "INTER", "pattern": "q-w-m + w-z-n co-occurrence (7:85, 55:9)", "kernel": "q-w-m and w-z-n (weighing/balance) share 10 ayahs — uprightness linked to just measure, moral to economic domains"}], "tag": "CRITICAL"}], "questions": ["Why does 1:6 use ṣirāṭ (singular, definite) rather than subul (plural paths) or sabīl (a way) — what does the singularity of THE path communicate versus the plurality available in other Quranic vocabulary?", "If mustaqīm is an active participle (the path that straightens itself), does this imply the path can deviate and self-correct — and if so, what does a \"self-correcting path\" mean for the walker?", "The imperative ihdinā is directed at God, yet imperative mood is typically used for commands to equals or subordinates — how does the grammar of supplication transform command structure into prayer?", "Given that h-d-y encompasses both \"guiding to truth\" and \"leading a sacrificial animal\" (Lane's), does the supplicant in 1:6 ask to be guided OR to be offered — and can both meanings be simultaneously active?", "The variant ṣirāṭan mustaqīman (indefinite, 14-reading) removes the definite article — does \"a straight path\" vs \"THE straight path\" open the possibility of multiple straight paths rather than one?", "How does the ṣirāṭ of 1:6 relate to the eschatological ṣirāṭ (bridge over Hellfire) in classical Arabic — is the daily prayer asking for guidance on the road AND across the bridge?", "If q-w-m means both \"to stand\" and \"a people,\" does al-mustaqīm encode a social identity (the path of those who stand) as well as a geometric quality (straightness)?", "The qira'at variant baṣṣirnā (make us see) replaces directional guidance with visual perception — does this suggest hidāya in 1:6 is not about movement but about vision?", "Why does the Quran pair s-r-t (path, 45 occurrences) and q-w-m (standing, 660 occurrences) in 33 shared ayahs — what is the structural necessity of linking road-metaphor to vertical-integrity?", "The co-occurrence of q-w-m and w-z-n (weighing/balance) across 10 ayahs suggests uprightness is linked to just measure — does mustaqīm in 1:6 carry an implied economic/justice dimension?", "If ṣirāṭ derives from saraṭa (to swallow), is the prayer asking to be placed on a path that consumes the walker — and how does this relate to the concept of total submission (islām)?", "The Shii variant adds ṣirāṭaka (Your path) — does the standard text's omission of the possessor deliberately leave open WHOSE path this is, creating productive ambiguity resolved only in 1:7?", "Can the futuristic reading of mustaqīm (self-correcting trajectory, auto-stabilizing system) illuminate how guidance functions not as a one-time event but as a continuous feedback mechanism?", "The three roots in this ayah (h-d-y, s-r-t, q-w-m) have a combined 1,010 Quranic occurrences — does their convergence in this three-word ayah make 1:6 the densest semantic node in the Quran?", "Given that 1:6 is recited in every unit of Muslim prayer (at minimum 17 times daily), how does the repetition of ihdinā interact with the hapax nature of this exact form — does frequency of recitation compensate for singularity of occurrence?"], "key": "1:6"}, {"surah": 1, "ayah": 7, "arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ", "transliteration": "ṣirāṭa lladhīna anʿamta ʿalayhim ghayri l-maghḍūbi ʿalayhim wa-lā ḍ-ḍāllīna", "readings": [{"text": "The path of those upon whom You have bestowed favor, not those who have received anger upon them and not those who have gone astray", "rationale": "Straightforward reading: ṣirāṭ in apposition to 1:6, alladhīna as relative pronoun identifying the favored group, ghayri as genitive exclusion (badal or adjective), two negated categories — recipients of wrath and those astray"}, {"text": "The way of those You have graced — other than the ones burdened-with-anger upon themselves, and not the ones who have lost orientation", "rationale": "Reads maghḍūb as self-inflicted (ʿalayhim reflexive — \"upon themselves\"), ḍāllīn from root d-l-l as spatial/cognitive disorientation rather than moral error, ghayri as independent exclusion clause"}, {"text": "The trajectory of those You have refined in wellbeing, excluding those upon whom displeasure has settled, and not those who have dissolved into confusion", "rationale": "Reads anʿamta from n-ʿ-m in its sense of softness/refinement (Lane's: naʿima = to be soft, pleasant), ṣirāṭ as trajectory or course (not static road), ḍāllīn from d-l-l including dissolution/dissipation (Lane's: ḍalla = to perish, vanish, be lost)"}, {"text": "The bandwidth of those You have data-enriched — not the ones flagged-with-error upon them, nor the signal-lost ones", "rationale": "Futuristic/information-age reading: ṣirāṭ as channel/bandwidth (continuous path of data flow), anʿamta as data enrichment (ni'ma = abundance of resource), maghḍūb as error-flagged (anger-marked = flagged for malfunction), ḍāllīn as signal loss (going astray = losing the signal path)"}, {"text": "The bridge of those You have nourished — apart from those compressed under wrath upon them, and not the ones scattered", "rationale": "Reads ṣirāṭ in its etymological connection to bridge (Lane's: ṣirāṭ = road, path, but cognate with Latin stratum; classical: bridge over hellfire), anʿamta as nourishment (n-ʿ-m includes cattle/livestock = sustenance), ḍāllīn as scattered/dispersed (d-l-l includes \"to be dispersed in the ground\" per Lane's)"}], "structure": {"beats": [{"label": "Apposition: Identification of the path", "lines": [{"arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ", "translit": "ṣirāṭa lladhīna anʿamta ʿalayhim", "english": "The path of those upon whom You have bestowed favor"}]}, {"label": "First exclusion: The wrath-receivers", "lines": [{"arabic": "غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ", "translit": "ghayri l-maghḍūbi ʿalayhim", "english": "Not those who have received wrath upon them"}]}, {"label": "Second exclusion: The astray", "lines": [{"arabic": "وَلَا ٱلضَّآلِّينَ", "translit": "wa-lā ḍ-ḍāllīna", "english": "And not those who have gone astray"}]}], "summary": "Tripartite structure: positive identification (path of the favored) followed by double negative exclusion (not the wrath-receivers, not the astray). The apposition to 1:6 (ihdina s-sirata l-mustaqima) specifies the straight path by peopling it — defining it through its walkers rather than its geometry. The two exclusions form a pair connected by wa-la, creating a binary of rejected states: passive reception of wrath (maghdub — passive participle, wrath comes upon them) versus active going-astray (dallin — active participle, they themselves stray). This passive-active distinction structures the entire ayah's moral architecture."}, "words": [{"id": 1, "arabic": "صِرَاطَ", "translit": "ṣirāṭa", "gloss": "path, road, way, bridge", "root": "ص ر ط (s-r-t)", "grammar": "Noun, accusative (manṣūb), apposition (badal) to ṣirāṭ in 1:6 or ʿaṭf bayān", "semantics": ["[7C] Lane's: road, way, path — from saraṭa (to swallow), the road \"swallows\" its travelers", "[7C] Classical lexicons: bridge (ṣirāṭ al-jahīm — the bridge over hellfire in eschatological literature)", "Hans Wehr: path, road, way — also figuratively: method, manner, course of action", "[7C] Lisan al-Arab: as-sirāṭ and aṣ-ṣirāṭ are dialectal variants; the ṣād is an emphatic substitute for sīn", "[M] Modern: trajectory, route, channel — any continuous directed pathway including digital", "[F] Futuristic: bandwidth, data channel, signal path — continuous transmission medium", "Core concept: a continuous directed passage that both contains and conveys its travelers"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Apposition or genitive construct specifying whose path", "count": "~5 ayahs", "examples": [{"ref": "42:53", "arabic": "صِرَٰطِ ٱللَّهِ ٱلَّذِى لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ أَلَآ إِلَى ٱللَّهِ تَصِيرُ ٱلْأُمُورُ", "english": "The path of God, to whom belongs what is in the heavens and the earth — indeed to God all matters return"}, {"ref": "20:135", "arabic": "قُلْ كُلٌّۭ مُّتَرَبِّصٌۭ فَتَرَبَّصُوا۟ ۖ فَسَتَعْلَمُونَ مَنْ أَصْحَٰبُ ٱلصِّرَٰطِ ٱلسَّوِىِّ وَمَنِ ٱهْتَدَىٰ", "english": "Say: All are waiting, so wait — you will know who the companions of the even path (as-sirat as-sawiyy) are and who is guided"}]}, {"label": "B. Object of guidance verb (ihdina, yahdiyaka, etc.)", "count": "~30 ayahs", "examples": [{"ref": "7:86", "arabic": "وَلَا تَقْعُدُوا۟ بِكُلِّ صِرَٰطٍۢ تُوعِدُونَ وَتَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ بِهِۦ وَتَبْغُونَهَا عِوَجًۭا", "english": "Do not sit on every path (sirat) threatening and blocking from the way (sabil) of God those who believe in it, seeking crookedness in it"}]}]}, "qiraat": [{"arabic": "سِرَاطَ", "translit": "sirāṭa", "status": "7", "type": "ibdāl", "note": "Canonical variant: sīn replaces ṣād — same root meaning but dialectal pronunciation; variant root annotated as s-b-l (sabīl), suggesting semantic overlap with \"way/path\" (sabīl)", "source": "erquran.org"}, {"arabic": "صِؗرَاطَ", "translit": "ṣᶻirāṭa", "status": "7", "type": "ibdāl", "note": "Canonical: ishmām — intermediate sound between ṣād and zāy, blending emphatic and non-emphatic articulation", "source": "erquran.org"}, {"arabic": "سَبِيلَ", "translit": "sabīla", "status": "shawādhdh", "type": "Lx", "note": "Non-canonical lexical substitution: replaces ṣirāṭ entirely with sabīl (path/way from s-b-l); not in standard Hafs reading", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "3", "refs": "1:7;16:121;48:2", "note": "Path (ṣirāṭ) co-occurs with bestowal/favor (niʿma) — the path is defined by its relationship to divine grace"}, {"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "2", "refs": "1:7;6:39", "note": "Path co-occurs with going astray — 6:39 explicitly contrasts guidance onto ṣirāṭ with being led astray"}], "critical": [{"cat": "SEM", "pattern": "ṣirāṭ polysemy: road/bridge/trajectory", "kernel": "Lane's: from saraṭa (swallow) — the path consumes its travelers; also bridge (eschatological), not merely static road"}, {"cat": "ECHO", "pattern": "ṣirāṭ repeated from 1:6", "kernel": "Apposition links mustaqīm (geometric straightness in 1:6) to human identification (those-You-favored in 1:7)"}, {"cat": "GRAM", "pattern": "accusative apposition (badal)", "kernel": "Accusative case continues from 1:6 ihdina s-sirāṭa — this ṣirāṭ specifies by population not by geometry"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "الَّذِينَ", "translit": "alladhīna", "gloss": "those who, the ones who", "root": "ل ل ذ (l-l-dh)", "grammar": "Relative pronoun, masculine plural, genitive (following ṣirāṭ in construct)", "semantics": ["Relative pronoun: \"those who\" — introduces a defining clause identifying a group by their characteristic", "Classical grammarians: al-ism al-mawṣūl — a connector word that joins a noun to a defining clause", "Core concept: identifies a group by action/attribute rather than by name or essence"], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "لَذِينَ", "translit": "ladhīna", "status": "Irreg", "type": "Gm", "note": "Irregular: drops definite article al- — grammatical variant treating it as a bare relative pronoun", "source": "erquran.org"}, {"arabic": "مَنْ", "translit": "man", "status": "shawādhdh", "type": "Lx", "note": "Non-canonical lexical substitution: replaces alladhīna with man (whoever/the one who); shifts from plural-specific to singular-universal; not in standard reading", "source": "erquran.org"}], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "alladhīna relative clause head", "kernel": "Plural masculine relative pronoun — defines the path by PEOPLE (those who...) not by abstract quality"}, {"cat": "SEM", "pattern": "man variant: singular-universal vs plural", "kernel": "Shawādhdh man reading shifts from group-identity to individual-universal — \"whoever You favored\" not \"those You favored\""}], "tag": "CRITICAL"}, {"id": 3, "arabic": "أَنْعَمْتَ", "translit": "anʿamta", "gloss": "You bestowed favor, You graced, You made pleasant", "root": "ن ع م (n-'-m)", "grammar": "Perfect verb (Form IV: afʿala), 2nd person masculine singular, transitive — subject is addressee (God), implied object is ʿalayhim via preposition", "semantics": ["[7C] Form IV afʿala: to bestow favor, to grace, to confer blessings upon", "[7C] Form I naʿima: to be soft, pleasant, comfortable, luxurious — to live in ease (Lane's)", "[7C] Noun niʿma: favor, blessing, bounty, grace — also: cattle, livestock (naʿam = grazing animals)", "[7C] Lisan al-Arab: naʿīm = bliss, paradise; tanʿīm (Form II) = to make soft, to pamper", "Hans Wehr: to bestow favors, to bless; niʿma = blessing, grace, benefit; naʿam = yes (affirmative particle)", "[M] Modern: to enrich, to provide resources, to optimize conditions — resource abundance", "[F] Futuristic: data enrichment, signal enhancement — abundance of informational resource", "[7C] Classical: n-ʿ-m also includes softness of skin, tenderness of life — not just material but qualitative ease", "Core concept: conferral of abundance that produces ease, softness, and flourishing"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Perfect verb: divine bestowal of favor (anʿamta/anʿamnā)", "count": "~18 ayahs", "examples": [{"ref": "2:40", "arabic": "يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُوا۟ بِعَهْدِىٓ أُوفِ بِعَهْدِكُمْ وَإِيَّٰىَ فَٱرْهَبُونِ", "english": "O Children of Israel, remember My favor (niʿmatī) which I bestowed upon you (anʿamtu ʿalaykum) and fulfill My covenant and I will fulfill your covenant, and fear Me"}, {"ref": "2:47", "arabic": "يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَنِّى فَضَّلْتُكُمْ عَلَى ٱلْعَٰلَمِينَ", "english": "O Children of Israel, remember My favor (niʿmatī) which I bestowed upon you (anʿamtu) and that I preferred you over all peoples"}, {"ref": "2:122", "arabic": "يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَنِّى فَضَّلْتُكُمْ عَلَى ٱلْعَٰلَمِينَ", "english": "O Children of Israel, remember My favor (niʿmatī) which I bestowed upon you (anʿamtu) and that I preferred you over all peoples"}]}]}, "qiraat": [{"arabic": "أَنْعَمْتُ", "translit": "anʿamtu", "status": "None", "type": "Pf", "note": "First person variant: \"I bestowed favor\" — shifts addressee from second person (You bestowed) to first person divine speech", "source": "erquran.org"}, {"arabic": "نَعَّمْتَ", "translit": "naʿʿamta", "status": "shii", "type": "Vr", "note": "Shia reading: Form II intensive — \"You intensively/repeatedly graced\" rather than Form IV simple bestowal", "source": "erquran.org"}, {"arabic": "مَنَنْتَ", "translit": "mananta", "status": "shawādhdh", "type": "Lx", "note": "Non-canonical lexical substitution: replaces anʿamta with mananta (You bestowed a favor, from m-n-n); not in standard reading", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "8", "refs": "1:7;4:119;5:1;5:3;8:53;31:20;35:3", "note": "Favor (n-ʿ-m) co-occurs with otherness/exclusion (gh-y-r) — divine favor defined partly by what it excludes"}, {"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "5", "refs": "1:7;4:119;7:179;25:44;39:8", "note": "Favor co-occurs with going astray — 4:119 links Satan's misleading with altering God's creation (niʿma)"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "3", "refs": "1:7;16:121;48:2", "note": "Bestowal of favor directly linked to path/guidance — 16:121 (Abraham) and 48:2 (Muhammad) both pair niʿma with ṣirāṭ"}], "critical": [{"cat": "FORM", "pattern": "Form IV afʿala causative", "kernel": "Form IV anʿama = causative of naʿima (to be in ease) — God CAUSES ease, not merely gives a gift externally"}, {"cat": "GRAM", "pattern": "MIXED transitivity (15 with/3 without obj)", "kernel": "Three Quranic instances lack explicit object (1:7, 19:58, 28:17) — here ʿalayhim supplies direction, not object"}, {"cat": "SEM", "pattern": "n-ʿ-m: favor AND cattle AND softness", "kernel": "Root spans material (livestock), qualitative (softness/ease), and relational (favor/grace) — all active here"}], "tag": "CRITICAL"}, {"id": 4, "arabic": "عَلَيْهِمْ", "translit": "ʿalayhim", "gloss": "upon them, on them", "root": "ع ل و ('-l-w)", "grammar": "Preposition ʿalā + 3rd person masculine plural pronoun -him; marks the recipients of the favor", "semantics": ["Preposition ʿalā: upon, on, over, against — here marks the direction/target of divine bestowal", "Classical: ḥurūf al-jarr — governs genitive, establishes spatial or relational superiority/contact", "The pronoun -him refers back to alladhīna — those whom You favored", "Core concept: directional marker indicating the surface or entity upon which an action lands"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "ʿalayhim directional not locative", "kernel": "ʿalā here marks the target of favor, not spatial location — favor descends UPON them from above"}, {"cat": "STRUCT", "pattern": "ʿalayhim repeated (words 4 and 7)", "kernel": "Same preposition+pronoun appears twice — once for favor, once for wrath — structural mirror with inverted content"}]}, {"id": 5, "arabic": "غَيْرِ", "translit": "ghayri", "gloss": "other than, not, different from, excluding", "root": "غ ي ر (gh-y-r)", "grammar": "Noun (abstract), genitive case — functions as adjective (badal or ṣifa) modifying alladhīna or ṣirāṭ; introduces the exclusion clause", "semantics": ["[7C] Lane's: other than, different from, not being — ghayyara (Form II): to change, alter, transform", "[7C] Lisan al-Arab: ghayra = otherness, exclusion, being-different; taghayyur = transformation, mutation", "Hans Wehr: other, different; ghayra (prep): except, apart from, without; ghayr = non-, un-, in-", "[7C] Classical: also jealousy (ghayra) — protective possessiveness, guarding boundaries", "[M] Modern: alteration, mutation, change-of-state — excluding one state to affirm another", "Core concept: otherness and exclusion — marking a boundary between what belongs and what does not"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Adjective or exception marker: \"other than\" in exclusion constructions", "count": "~34 ayahs", "examples": [{"ref": "2:230", "arabic": "فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥ", "english": "If he divorces her, she is not lawful to him thereafter until she marries a husband other than him (ghayra-hu)"}, {"ref": "4:56", "arabic": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا سَوْفَ نُصْلِيهِمْ نَارًۭا كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَٰهُمْ جُلُودًا غَيْرَهَا لِيَذُوقُوا۟ ٱلْعَذَابَ", "english": "Those who disbelieve Our signs — We shall roast them in fire; whenever their skins are done We replace them with skins other than them (ghayra-hā) so they taste the punishment"}]}, {"label": "B. Prepositional object: bi-ghayri (without) or li-ghayri (for other than)", "count": "~50 ayahs", "examples": [{"ref": "4:140", "arabic": "وَقَدْ نَزَّلَ عَلَيْكُمْ فِى ٱلْكِتَٰبِ أَنْ إِذَا سَمِعْتُمْ ءَايَٰتِ ٱللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا۟ مَعَهُمْ حَتَّىٰ يَخُوضُوا۟ فِى حَدِيثٍ غَيْرِهِۦ", "english": "He has sent down to you in the Book that when you hear God's signs being disbelieved and mocked, do not sit with them until they engage in a discourse other than it (ghayri-hi)"}]}]}, "qiraat": [{"arabic": "غَيْرَ", "translit": "ghayra", "status": "14", "type": "CE", "note": "Accusative variant: changes grammatical relationship — from genitive (adjective of alladhīna) to accusative (ḥāl/exception), altering whether ghayri modifies the people or the path", "source": "erquran.org"}, {"arabic": "سِوَى", "translit": "siwā", "status": "shawādhdh", "type": "Lx", "note": "Non-canonical lexical substitution: replaces ghayri with siwā (equal to, other than, from s-w-y); not in standard reading", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "12", "refs": "1:7;4:119;5:77;6:119;6:140;6:144;7:53;16:25;28:50", "note": "Otherness (gh-y-r) frequently co-occurs with going astray — those who stray are \"other than\" the guided"}, {"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "8", "refs": "1:7;4:119;5:1;5:3;8:53;31:20;35:3", "note": "Exclusion (ghayri) paired with favor (niʿma) — favor requires boundary-marking to define its recipients"}, {"coRoot": "gh-d-b", "coRootAr": "غ ض ب", "count": "4", "refs": "1:7;2:61;3:112", "note": "Otherness co-occurs with wrath — 2:61 and 3:112 use bi-ghayri l-ḥaqq alongside divine anger"}], "critical": [{"cat": "GRAM", "pattern": "genitive case: badal or ṣifa", "kernel": "Ghayri in genitive can modify alladhīna (adjective) or substitute for it (badal) — two different scopes"}, {"cat": "SEM", "pattern": "gh-y-r: otherness AND jealousy AND change", "kernel": "
