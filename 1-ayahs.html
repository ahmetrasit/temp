said: We shall surely build over them a place of prostration.", "turkish": "İşte böylece onları (insanlara) buldurduk ki Allah'ın vaadinin hak olduğunu ve Saat'te şüphe olmadığını bilsinler — kendi aralarında işlerini tartışırlarken. Dediler: Üzerlerine bir yapı kurun. Rableri onları en iyi bilir. İşlerine galip gelenler dedi: Mutlaka üzerlerine bir mescit edinelim."}]}]}, "qiraat": [{"arabic": "لُـلَّـٰهِ", "translit": "lullāhi", "status": "Irreg", "type": "vhr", "note": "Irregular vowel change: ḍamma on the lām preposition instead of kasra. This is a dialectal pronunciation variant that does not change meaning significantly but reflects phonological diversity in early Arabic recitation traditions.", "noteTr": "Düzensiz ünlü değişikliği: لِ harf-i cerinde kesre yerine zamme. Bu, anlamı önemli ölçüde değiştirmeyen lehçesel bir telaffuz varyantıdır, ancak erken Arapça kıraat geleneklerindeki fonolojik çeşitliliği yansıtır.", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "Shia reading: restructures Allāh from genitive (lillāhi) to accusative (Allāha) as direct object of the verb nuḥammidu. This transforms the divine name from the recipient of an attributed quality to the direct object of an active worship verb. Not in the standard Hafs text.", "noteTr": "Şii okuması: Allāh'ı mecrûrdan (lillāhi) mansûba (Allāha) fiil nuḥammidu'nun mef'ûl-i bihi olarak yeniden yapılandırır. İlâhî ismi atfedilen bir niteliğin alıcısından etkin bir ibadet fiilinin doğrudan nesnesine dönüştürür. Standart Hafs metninde yoktur.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "46", "refs": "1:2;17:111;18:1;2:267;3:144;4:131;6:1;6:45;7:43;9:112", "note": "Divinity ('-l-h) paired with praise (h-m-d) — the most fundamental theological pairing: the divine is defined as praiseworthy, and praise finds its proper object in the divine ← IN THIS AYAH", "noteTr": "Ulûhiyet ('-l-h) hamd (h-m-d) ile eşleşmiş — en temel teolojik eşleşme: ilâhî olan övülmeye lâyık olarak tanımlanır ve hamd gerçek nesnesini ilâhî olanda bulur ← BU AYETTE"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "204", "refs": "1:2;17:39;18:14;18:16;18:21;18:24;18:38;18:110;19:36;19:48", "note": "Divinity ('-l-h) paired with nurturing (r-b-b) in 204 ayahs — the two names appear together more than any other divine-attribute pairing, establishing rabb as the primary relational identity of Allāh ← IN THIS AYAH", "noteTr": "Ulûhiyet ('-l-h) terbiye (r-b-b) ile 204 ayette eşleşmiş — iki isim diğer tüm ilâhî sıfat eşleşmelerinden daha fazla birlikte görünür, rabbi Allah'ın birincil ilişkisel kimliği olarak kurar ← BU AYETTE"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "439", "refs": "1:2;18:21;18:26;2:10;2:22;2:26;2:60;2:75;2:77;2:80", "note": "Divinity paired with knowledge/worlds in 439 ayahs — the most frequent co-occurrence for '-l-h, establishing divine knowledge as the defining attribute of divinity ← IN THIS AYAH", "noteTr": "Ulûhiyet bilgi/alemler ile 439 ayette eşleşmiş — '-l-h için en sık birlikte görülme, ilâhî bilgiyi ulûhiyetin tanımlayıcı sıfatı olarak kurar ← BU AYETTE"}], "critical": "The لِ preposition before Allāh has at least five possible functions in classical grammar, each yielding a different theological claim: (1) lām al-istiḥqāq — praise is God's by inherent right (God deserves it intrinsically); (2) lām al-ikhtisāṣ — praise belongs exclusively to God (no one else can truly receive it); (3) lām al-milk — praise is God's possession (it originates from and returns to God); (4) lām al-ta'līl — praise exists BECAUSE OF God (God is the cause of all praise); (5) lām al-ṣayrūra — all praise eventually BECOMES God's (all acknowledgment of merit ultimately points to the divine). The standard reading holds all five simultaneously. The irregular vowel variant lullāhi preserves this multiplicity. The root '-l-h's connection to bewilderment ('aliha) suggests the entity being praised is beyond full comprehension — one praises what one cannot fully grasp.", "criticalTr": "الله'tan önceki لِ harf-i cerinin klasik dilbilgisinde en az beş olası işlevi vardır, her biri farklı bir teolojik iddia üretir: (1) lam-ı istihkak — hamd Allah'ın özsel hakkıdır; (2) lam-ı ihtisas — hamd münhasıran Allah'a aittir; (3) lam-ı mülk — hamd Allah'ın mülküdür; (4) lam-ı ta'lîl — hamd Allah sayesinde vardır; (5) lam-ı sayrûre — tüm hamd nihayetinde Allah'ınkine dönüşür. Standart okuma beşini de aynı anda taşır. '-l-h kökünün şaşkınlığa ('alihe) bağlantısı, övülen varlığın tam kavrayışın ötesinde olduğunu düşündürür — insan tam kavrayamadığı şeyi över.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "رَبِّ", "translit": "rabbi", "gloss": "nurturer, sustainer, lord, master, cultivator", "glossTr": "Rab, terbiye edici, yetiştirici, sahip", "userNotes": "", "root": "ر ب ب (r-b-b)", "grammar": "Noun in genitive (majrūr) functioning as badal (apposition) to Allāhi, further specifying the identity of the one to whom praise belongs. First element of an iḍāfa (genitive construct) with al-'ālamīna. The genitive follows from its appositive relationship to the prepositional object.", "grammarTr": "Mecrûr halde isim, Allāhi'ye bedel (açıklama) olarak görev yapar, hamdin ait olduğu varlığın kimliğini daha da belirler. العالمين ile izafe zincirinin ilk unsuru. Mecrûrluk harf-i cer'in nesnesine bedellik ilişkisinden gelir.", "semantics": ["رَبَّ (rabba, I): to possess, to own, to be master of; to nurture, to rear, to bring up from a state of incompleteness to completion; to sustain, to maintain; to repair, to mend", "رَبَّى (rabbā, II): to nurture, to educate, to raise (a child); to cultivate (a plant); to develop incrementally", "Lane's Lexicon: ar-rabb = the owner/possessor; one who nurtures a thing from state to state until it reaches its complete condition. Applied to God: the one who brings creation from non-existence through stages to maturity. Also: ar-rabb = the master (as opposed to the slave/owned). ar-rabb with the definite article cannot be applied to any but God. Without the article, rabb can mean master, owner, guardian", "Lane's: rabba al-walad = he reared/brought up the child. rabba an-ni'ma = he nurtured the blessing (caused it to grow). rabba ad-dār = he was master/owner of the house. From this: rabbānī = one devoted to the Rabb (a divine scholar)", "Hans Wehr: rabb = lord, master; God; owner, proprietor. tarbiya = education, upbringing, rearing, breeding. murabbī = educator, tutor, pedagogue", "Lisan al-Arab: ar-rabb carries three core meanings: (1) al-mālik (owner/possessor), (2) as-sayyid al-muṭā' (obeyed master), (3) al-muṣliḥ (the one who repairs/sets right). Also: rabb = guardian who manages another's affairs. The name is never used with the article for other than God. Without the article: rabb ad-dār (house owner), rabb al-māl (property owner)", "Classical: rababtu al-qawm = I was their leader/chief. ribba = a large group/community (under one rabb). rabīb = stepchild (one being reared by a non-parent). rubba = a particle of frequency/rarity — possibly from the root sense of \"a quantity/group\"", "Modern: manager, administrator of a system; programming: the root process that governs child processes; educator who develops potential through stages", "Core concept: gradual, stage-by-stage cultivation from incompleteness to fulfillment — an authority that simultaneously owns, manages, and develops"], "semanticsTr": ["رَبَّ (rabbe, I. bab): sahip olmak, malik olmak; terbiye etmek, yetiştirmek, eksik halden tamamlanmaya götürmek; idame ettirmek; onarmak, ıslah etmek", "رَبَّى (rabbâ, II. bab): yetiştirmek, eğitmek, büyütmek (çocuk); yetiştirmek (bitki); kademeli olarak geliştirmek", "Lane: er-rabb = sahip/malik; bir şeyi hâlden hâle tam haline gelene dek yetiştiren. Allah'a uygulandığında: yaratılışı yokluktan aşamalar halinde olgunluğa getiren. Ayrıca: er-rabb = efendi (köle/sahip olunanın karşıtı). Belirlilik takısıyla er-rabb yalnızca Allah için kullanılır. Takısız rabb efendi, sahip, veli anlamına gelebilir", "Lane: rabbe'l-veled = çocuğu yetiştirdi. rabbe'n-ni'me = nimeti büyüttü. rabbe'd-dâr = evin sahibi idi. Buradan: rabbânî = Rab'be adanmış kişi (ilâhî âlim)", "Hans Wehr: rabb = efendi, sahip; Allah; malik. terbiye = eğitim, yetiştirme. mürebbî = eğitimci, mürebbi", "Lisanü'l-Arab: er-rabb üç temel anlam taşır: (1) el-mâlik (sahip), (2) es-seyyidü'l-mutâ' (itaat edilen efendi), (3) el-musliḥ (ıslah eden/düzelten). Ayrıca: rabb = başkasının işlerini yöneten veli. İsim belirlilik takısıyla yalnızca Allah için kullanılır. Takısız: rabbü'd-dâr (ev sahibi), rabbü'l-mâl (mal sahibi)", "Klasik: rababtü'l-kavme = onların reisi/önderi oldum. ribbe = büyük topluluk (bir rabb altında). rebîb = üvey çocuk (ebeveyn olmayan tarafından yetiştirilen). rubbe = çokluk/azlık edatı — muhtemelen kökün \"miktar/topluluk\" anlamından", "Modern: yönetici, sistem idarecisi; programlama: alt süreçleri yöneten kök süreç; potansiyeli aşamalarla geliştiren eğitimci", "Kök kavram: eksiklikten tamamlanmaya kademeli, aşama aşama yetiştirme — aynı anda sahip olan, yöneten ve geliştiren bir otorite"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Noun with pronominal suffix (rabbuka, rabbunā, rabbī, etc.)", "count": "~700+ ayahs", "examples": [{"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا", "english": "He said: This is a mercy from my nurturer. When the promise of my nurturer comes, He will make it leveled ruin — and the promise of my nurturer has ever been truth.", "turkish": "Dedi: Bu Rabbimden bir rahmettir. Rabbimin vaadi geldiğinde onu dümdüz edecektir — Rabbimin vaadi her zaman hak olmuştur."}, {"ref": "7:89", "arabic": "قَدِ ٱفْتَرَيْنَا عَلَى ٱللَّهِ كَذِبًا إِنْ عُدْنَا فِى مِلَّتِكُم بَعْدَ إِذْ نَجَّىٰنَا ٱللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَىْءٍ عِلْمًا ۚ عَلَى ٱللَّهِ تَوَكَّلْنَا ۚ رَبَّنَا ٱفْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِٱلْحَقِّ وَأَنتَ خَيْرُ ٱلْفَٰتِحِينَ", "english": "We would have fabricated against God a lie if we returned to your creed after God rescued us from it. It is not for us to return to it unless God our nurturer wills. Our nurturer encompasses all things in knowledge. Upon God we rely. Our nurturer, decide between us and our people with truth, and You are the best of deciders.", "turkish": "Eğer Allah bizi ondan kurtardıktan sonra sizin milletinize dönersek, Allah'a karşı yalan uydurmuş oluruz. Rabbimiz Allah dilemedikçe ona dönmemiz olmaz. Rabbimiz her şeyi ilmiyle kuşatmıştır. Allah'a tevekkül ettik. Rabbimiz, bizimle kavmimiz arasında hak ile hüküm ver, Sen hüküm verenlerin en hayırlısısın."}]}, {"label": "B. Noun as vocative (yā rabbī, rabbanā)", "count": "~136 ayahs", "examples": [{"ref": "5:114", "arabic": "قَالَ عِيسَى ٱبْنُ مَرْيَمَ ٱللَّهُمَّ رَبَّنَآ أَنزِلْ عَلَيْنَا مَآئِدَةًۭ مِّنَ ٱلسَّمَآءِ تَكُونُ لَنَا عِيدًۭا لِّأَوَّلِنَا وَءَاخِرِنَا وَءَايَةًۭ مِّنكَ ۖ وَٱرْزُقْنَا وَأَنتَ خَيْرُ ٱلرَّٰزِقِينَ", "english": "Jesus son of Mary said: O God, our nurturer, send down upon us a table from the sky — let it be a festival for the first of us and the last of us, and a sign from You. Provide for us, and You are the best of providers.", "turkish": "Meryem oğlu İsa dedi: Allahım, Rabbimiz, bize gökten bir sofra indir — ilkimiz ve sonumuz için bayram olsun, Senden bir ayet olsun. Bize rızık ver, Sen rızık verenlerin en hayırlısısın."}]}, {"label": "C. Noun in construct with al-'ālamīna", "count": "~42 ayahs", "examples": [{"ref": "6:71", "arabic": "قُلْ أَنَدْعُوا۟ مِن دُونِ ٱللَّهِ مَا لَا يَنفَعُنَا وَلَا يَضُرُّنَا وَنُرَدُّ عَلَىٰٓ أَعْقَابِنَا بَعْدَ إِذْ هَدَىٰنَا ٱللَّهُ كَٱلَّذِى ٱسْتَهْوَتْهُ ٱلشَّيَٰطِينُ فِى ٱلْأَرْضِ حَيْرَانَ لَهُۥٓ أَصْحَٰبٌۭ يَدْعُونَهُۥٓ إِلَى ٱلْهُدَى ٱئْتِنَا ۗ قُلْ إِنَّ هُدَى ٱللَّهِ هُوَ ٱلْهُدَىٰ ۖ وَأُمِرْنَا لِنُسْلِمَ لِرَبِّ ٱلْعَٰلَمِينَ", "english": "Say: Shall we call upon, instead of God, what neither benefits us nor harms us, and be turned back on our heels after God guided us — like one whom the devils have lured in the earth, bewildered, while his companions call him to guidance: Come to us? Say: God's guidance is THE guidance, and we have been commanded to submit to the nurturer of the realms of being.", "turkish": "De ki: Allah'ı bırakıp bize ne fayda ne zarar veren şeylere mi yalvaralım? Allah bizi hidayete erdirdikten sonra topuklarımız üzerine mi döndürülelim — şeytanların yeryüzünde ayarttığı, şaşkın, arkadaşları onu hidayete çağıran: Bize gel! diyen biri gibi mi? De ki: Allah'ın hidayeti, hidayetin ta kendisidir ve bize âlemlerin Rabbine teslim olmamız emredildi."}]}]}, "qiraat": [{"arabic": "رَبَّ", "translit": "rabba", "status": "Irreg", "type": "CE", "note": "Accusative reading (fatḥa): makes rabb a direct object or specification (naṣb), which could mean \"I praise God AS the nurturer\" — transforming the apposition into a state description. This is paired with the ROOT CHANGE to s-w-d (see variant below). Not in the standard Hafs text.", "noteTr": "Mansûb okuma (fetha): rabb'ı mef'ûl veya temyiz yapar, \"Allah'ı terbiye edici OLARAK överim\" anlamı kazandırabilir — bedeli hâl tanımlamasına dönüştürür. S-w-d kök değişikliği ile eşleştirilmiştir (aşağıdaki varyanta bkz.). Standart Hafs metninde değildir.", "source": "erquran.org"}, {"arabic": "رَبُّ", "translit": "rabbu", "status": "Irreg", "type": "CE", "note": "Nominative reading (ḍamma): makes rabb a separate subject or predicate. This could restructure the ayah as two sentences: \"The praise belongs to God\" + \"The nurturer of the realms is...\" — splitting the unified declaration. Paired with ROOT CHANGE to s-w-d. Not in standard Hafs text.", "noteTr": "Merfû okuma (zamme): rabb'ı müstakil mübteda veya haber yapar. Ayeti iki cümle olarak yeniden yapılandırabilir: \"Hamd Allah'a aittir\" + \"Âlemlerin Rabbi...\" — birleşik beyanı böler. S-w-d kök değişikliğiyle eşleştirilmiştir. Standart Hafs metninde değildir.", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "Shia reading: rabb becomes mansūb (accusative) as a qualifier (ḥāl or badal) of Allāha, the direct object. \"We praise God, the nurturer of the realms.\" This maintains the appositive relationship but within a verbal, not nominal, framework. Not in standard Hafs text.", "noteTr": "Şii okuması: rabb, mef'ûl Allāha'nın vasıfı (hâl veya bedel) olarak mansûb olur. \"Biz Allah'ı, âlemlerin terbiye edicisini, hamd ederiz.\" İzafe ilişkisini korur ama isim cümlesi değil fiil cümlesi çerçevesinde. Standart Hafs metninde değildir.", "source": "erquran.org"}, {"arabic": "سَيِّدِ", "translit": "sayyidi", "status": "shawādhdh", "type": "Lx", "note": "Anomalous lexical substitution: sayyidi (master, chief, leader) from root s-w-d replaces rabbi (nurturer) from root r-b-b. This variant shifts the divine epithet from \"nurturer who cultivates through stages\" to \"master/chief who holds supreme rank.\" ROOT CHANGE: r-b-b → s-w-d. The variant root s-w-d carries meanings of: mastery, leadership, being foremost; also blackness, darkness (see s-w-d root analysis). sayyid = one who holds authority through status/rank rather than through nurturing relationship. Not in standard Hafs text — anomalous reading with weak transmission.", "noteTr": "Şâz leksik değişim: seyyidi (efendi, başkan, lider) s-w-d kökünden rabbi (terbiye edici) r-b-b kökünden yerine geçer. Bu varyant ilâhî sıfatı \"aşamalarla yetiştiren terbiye edici\"den \"en yüksek mertebedeki efendi/reis\"e kaydırır. KÖK DEĞİŞİKLİĞİ: r-b-b → s-w-d. Varyant kökü s-w-d şu anlamları taşır: efendilik, liderlik, en önde olmak; ayrıca siyahlık, karanlık (s-w-d kök analizine bkz.). Seyyid = yetiştirme ilişkisi yerine statü/mertebe yoluyla otorite tutan kişi. Standart Hafs metninde değildir — zayıf aktarımlı şâz okuma.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "204", "refs": "1:2;17:39;18:14;18:16;18:21;18:24;18:38;18:110;19:36;19:48", "note": "Nurturing (r-b-b) paired with divinity ('-l-h) in 204 ayahs — the most frequent pairing for rabb, establishing the divine nurturer as the primary way God relates to creation ← IN THIS AYAH", "noteTr": "Terbiye (r-b-b) ulûhiyet ('-l-h) ile 204 ayette eşleşmiş — rabb için en sık eşleşme, ilâhî terbiye ediciyi Allah'ın yaratılışla ilişki kurma biçiminin birincil ifadesi olarak kurar ← BU AYETTE"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "136", "refs": "1:2;17:12;17:25;17:54;17:55;17:84;17:85;17:102;18:19;18:21", "note": "Nurturing paired with knowledge/worlds in 136 ayahs — rabb + '-l-m establishes that the nurturer's authority is grounded in knowledge: \"Your nurturer knows best\" (rabbuka a'lamu) is a recurring formula ← IN THIS AYAH", "noteTr": "Terbiye bilgi/alemler ile 136 ayette eşleşmiş — rabb + '-l-m terbiye edicinin otoritesinin bilgiye dayandığını kurar: \"Rabbin en iyi bilir\" (rabbuka a'lamu) tekrarlanan bir kalıptır ← BU AYETTE"}, {"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "27", "refs": "1:2;17:79;2:30;6:1;6:45;7:43;10:10;14:1;14:39;15:98", "note": "Nurturing paired with praise in 27 ayahs — praise is consistently directed to the nurturer aspect of divinity, not abstract godhood ← IN THIS AYAH", "noteTr": "Terbiye hamd ile 27 ayette eşleşmiş — hamd tutarlı biçimde ilâhîliğin soyut tanrılık yönüne değil terbiye edicilik yönüne yöneltilir ← BU AYETTE"}, {"coRoot": "q-w-l", "coRootAr": "ق و ل", "count": "261", "refs": "2:26;2:30;2:61;2:68;2:69;2:70;2:76;2:124;2:126;2:131", "note": "Nurturing paired with speech (q-w-l) in 261 ayahs — the nurturer is consistently the one spoken to and about: \"they said: our nurturer\" (qālū rabbanā) is a core Quranic speech act", "noteTr": "Terbiye söz (q-w-l) ile 261 ayette eşleşmiş — terbiye edici tutarlı biçimde kendisine ve kendisi hakkında konuşulan varlıktır: \"dediler: Rabbimiz\" (kâlû rabbenâ) temel bir Kur'ânî söz edimi"}, {"coRoot": "s-w-d", "coRootAr": "س و د", "count": "1", "refs": "1:2", "note": "Nurturing (r-b-b) paired with mastery (s-w-d) only in 1:2 via shawādhdh variant — the anomalous reading سَيِّدِ (sayyidi) replaces رَبِّ (rabbi), revealing a tension between \"nurturer\" and \"master\" as descriptions of divine authority ← IN THIS AYAH (variant only)", "noteTr": "Terbiye (r-b-b) efendilik (s-w-d) ile yalnızca 1:2'de şâz varyant yoluyla eşleşmiş — şâz okuma سَيِّدِ (seyyidi) رَبِّ (rabbi) yerine geçerek ilâhî otoritenin tanımı olarak \"terbiye edici\" ile \"efendi\" arasındaki gerilimi ortaya çıkarır ← BU AYETTE (yalnızca varyant)"}], "critical": "The position of rabb as badal (apposition) to Allāh is theologically significant: the Quran does not say \"praise belongs to God, AND He is the nurturer.\" Instead, \"nurturer of the realms\" IS the definition of the God being praised. This makes tarbiya (nurturing/cultivation) the primary divine attribute in the opening of the Quran — before mercy (1:3), before sovereignty (1:4), before guidance (1:6). The shawādhdh variant سَيِّدِ (sayyidi) from root s-w-d reveals an interpretive tension: rabb emphasizes gradual development (raising from lower to higher), while sayyid emphasizes hierarchical rank (being supreme over). The standard reading's choice of rabb over sayyid prioritizes the developmental/relational model of authority over the hierarchical/rank model. The root r-b-b's additional meaning of \"repairing/mending\" (rabba = he repaired) adds another layer: the nurturer also restores what is broken. The doubled root letter (r-b-b, not r-b) suggests intensity or repetition in the nurturing process.", "criticalTr": "Rabb'ın Allāh'a bedel konumunda olması teolojik açıdan anlamlıdır: Kur'ân \"hamd Allah'a aittir, VE O âlemlerin terbiye edicisidir\" demez. Bunun yerine \"âlemlerin terbiye edicisi\" övülen Allah'ın TANIMI'dır. Bu, terbiyeyi Kur'ân'ın açılışında birincil ilâhî sıfat yapar — rahmetten (1:3), egemenlikten (1:4), hidayetten (1:6) önce. Şâz varyant سَيِّدِ (seyyidi) s-w-d kökünden yorumsal bir gerilim ortaya çıkarır: rabb kademeli gelişimi (aşağıdan yükseğe çıkarma) vurgularken seyyid hiyerarşik mertebe (üstün olma) anlamını vurgular. Standart okumanın seyyid yerine rabb'ı tercih etmesi gelişimsel/ilişkisel otorite modelini hiyerarşik/mertebe modeline önceliklendirir. R-b-b kökünün ek \"onarmak/ıslah etmek\" anlamı (rabbe = onardı) başka bir katman ekler: terbiye edici kırılanı da tamir eder. Çiftlenmiş kök harfi (r-b-b, r-b değil) yetiştirme sürecinde yoğunluk veya tekrarı ima eder.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 4, "arabic": "ٱلْعَٰلَمِينَ", "translit": "al-'ālamīna", "gloss": "the realms of being, the worlds, all conscious beings", "glossTr": "alemler, varlık alemleri, bütün bilinçli varlıklar", "userNotes": "", "root": "ع ل م ('-l-m)", "grammar": "Definite noun in genitive (majrūr) as the second element of iḍāfa (genitive construct) with rabb. Sound masculine plural form (-īna in genitive). The plural of 'ālam (world/realm), using the sound masculine plural reserved for conscious beings — suggesting the \"worlds\" are not mere spaces but entities with awareness.", "grammarTr": "Mecrûr halde marife isim, rabb ile izafe zincirinin ikinci unsuru. Sâlim müzekker cemi (-în mecrûr halde). 'Âlem (dünya/alem) kelimesinin çoğulu, akıl sahiplerine mahsus sâlim müzekker cem' kalıbıyla — \"alemler\"in sırf mekânlar değil farkındalık sahibi varlıklar olduğunu düşündürür.", "semantics": ["عَلِمَ ('alima, I): to know, to have knowledge of, to be aware of, to perceive, to recognize; to learn; to be certain about", "عَلَّمَ ('allama, II): to teach, to instruct, to inform, to make known; to mark, to stamp, to brand", "أَعْلَمَ ('a'lama, IV): to notify, to inform, to announce; to mark with a sign", "تَعَلَّمَ (ta'allama, V): to learn, to study, to acquire knowledge", "Lane's Lexicon: 'ālam = a world, a realm, a category of creation. The plural al-'ālamūna/al-'ālamīna denotes \"all kinds of created beings\" — humans, jinn, angels, animals (classified by category). Some say: 'ālam is everything by which the Rabb is known ('ulima bihi ar-rabb), i.e., every created thing is a sign pointing to its creator. From this: 'ālam = a sign-system, a field of knowability", "Lane's: 'ilm = knowledge, science, perception. 'alāma = mark, sign, indicator, landmark. 'ālim = one who knows. 'allāma = extremely learned. ma'lūm = known, determined, fixed. 'alam = flag, banner, distinctive mark", "Hans Wehr: 'ālam = world, universe; 'ilm = knowledge, learning, science; 'alāma = sign, mark, symptom, characteristic; i'lām = notification, information, media (modern usage)", "Lisan al-Arab: al-'ālam — derived from 'alāma (sign): everything in existence is a sign of its maker. Hence 'ālam = a domain of signs. The plural al-'ālamūna uses the sound masculine plural form, which in Arabic is reserved for rational/conscious beings — this implies each 'ālam is not a mere container but a conscious entity or a collective of conscious beings", "Modern: information system, data environment, simulation, virtual world; i'lām = media, information dissemination; 'ālam raqamī = digital world", "Futuristic: each 'ālam as a complete information ecosystem — biological worlds, quantum fields, digital environments, AI systems — all domains where pattern recognition and sign-processing occur", "Core concept: the root '-l-m unifies knowledge, signs, and worlds — a 'ālam is a domain of knowability, and al-'ālamīna are all domains through which reality can be known"], "semanticsTr": ["عَلِمَ ('alime, I. bab): bilmek, haberdar olmak, algılamak, tanımak; öğrenmek; kesin bilgi sahibi olmak", "عَلَّمَ ('alleme, II. bab): öğretmek, bildirmek, tâlim etmek; işaretlemek, damgalamak", "أَعْلَمَ (e'leme, IV. bab): haber vermek, bildirmek, ilan etmek; işaretle belirtmek", "تَعَلَّمَ (te'alleme, V. bab): öğrenmek, tahsil etmek, bilgi edinmek", "Lane: 'âlem = dünya, alem, yaratılış kategorisi. Çoğulu el-'âlemûn/el-'âlemîn \"tüm yaratılmış varlık türlerini\" ifade eder — insanlar, cinler, melekler, hayvanlar (kategoriye göre). Bazıları der ki: 'âlem, Rabb'in kendisiyle bilindiği her şeydir ('ulime bihi'r-rabb), yani her yaratılmış şey yaratıcısına işaret eden bir alamettir. Buradan: 'âlem = bir işaret sistemi, bilinebilirlik alanı", "Lane: 'ilm = bilgi, ilim, algı. 'alâme = işaret, belirti, alâmet. 'âlim = bilen. 'allâme = son derece âlim. ma'lûm = bilinen, belirlenmiş. 'alem = bayrak, sancak, ayırt edici işaret", "Hans Wehr: 'âlem = dünya, evren; 'ilm = bilgi, ilim; 'alâme = işaret, belirti; i'lâm = bildirim, medya (modern kullanım)", "Lisanü'l-Arab: el-'âlem — 'alâme (işaret) kelimesinden türetilmiştir: var olan her şey yapıcısının alâmetidir. Dolayısıyla 'âlem = bir işaretler alanı. Çoğul el-'âlemûn sâlim müzekker cem' kalıbını kullanır ki bu Arapça'da akıl sahibi/bilinçli varlıklara mahsustur — bu, her 'âlem'in salt bir kap değil bilinçli bir varlık veya bilinçli varlıklar topluluğu olduğunu ima eder", "Modern: bilgi sistemi, veri ortamı, simülasyon, sanal dünya; i'lâm = medya, bilgi yayılımı; 'âlem-i raqamî = dijital dünya", "Geleceksel: her 'âlem tam bir bilgi ekosistemi olarak — biyolojik dünyalar, kuantum alanları, dijital ortamlar, yapay zekâ sistemleri — örüntü tanıma ve işaret işlemenin gerçekleştiği tüm alanlar", "Kök kavram: '-l-m kökü bilgi, işaret ve alemleri birleştirir — 'âlem bilinebilirlik alanıdır ve el-'âlemîn gerçekliğin kendisiyle bilinebildiği tüm alanlardır"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Abstract noun (knowledge contexts: 'ilm, 'alāmāt)", "count": "~78 ayahs", "examples": [{"ref": "2:197", "arabic": "ٱلْحَجُّ أَشْهُرٌۭ مَّعْلُومَٰتٌۭ ۚ فَمَن فَرَضَ فِيهِنَّ ٱلْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِى ٱلْحَجِّ ۗ وَمَا تَفْعَلُوا۟ مِنْ خَيْرٍۢ يَعْلَمْهُ ٱللَّهُ ۗ وَتَزَوَّدُوا۟ فَإِنَّ خَيْرَ ٱلزَّادِ ٱلتَّقْوَىٰ ۚ وَٱتَّقُونِ يَٰٓأُو۟لِى ٱلْأَلْبَٰبِ", "english": "The pilgrimage is known months. Whoever undertakes the pilgrimage in them: no sexual intimacy, no transgression, no disputing during the pilgrimage. Whatever good you do, God knows it. Take provision, for the best provision is guarding (against harm). And guard against Me, O possessors of cores.", "turkish": "Hac bilinen aylardır. Kim onlarda haccı farz kılarsa artık cinsel yakınlık, günah ve tartışma yoktur. Hayırdan ne yaparsanız Allah onu bilir. Azık edinin, zira en hayırlı azık takvadır. Benden sakının ey öz sahipleri."}, {"ref": "16:16", "arabic": "وَعَلَٰمَٰتٍۢ ۚ وَبِٱلنَّجْمِ هُمْ يَهْتَدُونَ", "english": "And landmarks — and by the star they find their way.", "turkish": "Ve alametler — ve yıldızla yollarını bulurlar."}]}, {"label": "B. Verb form IV — to make known ('a'lama)", "count": "~334 ayahs", "examples": [{"ref": "18:21", "arabic": "وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوٓا۟ أَنَّ وَعْدَ ٱللَّهِ حَقٌّۭ وَأَنَّ ٱلسَّاعَةَ لَا رَيْبَ فِيهَآ إِذْ يَتَنَٰزَعُونَ بَيْنَهُمْ أَمْرَهُمْ ۖ فَقَالُوا۟ ٱبْنُوا۟ عَلَيْهِم بُنْيَٰنًۭا ۖ رَّبُّهُمْ أَعْلَمُ بِهِمْ ۚ قَالَ ٱلَّذِينَ غَلَبُوا۟ عَلَىٰٓ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِدًۭا", "english": "And thus We made them stumble upon them, so they would know that God's promise is truth and that the Hour has no doubt in it.", "turkish": "İşte böylece onları buldurduk ki Allah'ın vaadinin hak olduğunu ve Saat'te şüphe olmadığını bilsinler."}, {"ref": "18:26", "arabic": "قُلِ ٱللَّهُ أَعْلَمُ بِمَا لَبِثُوا۟ ۖ لَهُۥ غَيْبُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ أَبْصِرْ بِهِۦ وَأَسْمِعْ ۚ مَا لَهُم مِّن دُونِهِۦ مِن وَلِىٍّۢ وَلَا يُشْرِكُ فِى حُكْمِهِۦٓ أَحَدًۭا", "english": "Say: God knows best how long they remained. His is the unseen of the heavens and the earth. How seeing and hearing is He! They have no guardian besides Him, and He shares His judgment with no one.", "turkish": "De ki: Allah ne kadar kaldıklarını en iyi bilendir. Göklerin ve yerin gaybı O'nundur. O ne güzel gören, ne güzel işitendir! Onların O'ndan başka velileri yoktur ve hükmüne kimseyi ortak kılmaz."}]}, {"label": "C. Adjective qualitative ('alīm — all-knowing)", "count": "~107 ayahs", "examples": [{"ref": "2:267", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِن طَيِّبَٰتِ مَا كَسَبْتُمْ وَمِمَّآ أَخْرَجْنَا لَكُم مِّنَ ٱلْأَرْضِ ۖ وَلَا تَيَمَّمُوا۟ ٱلْخَبِيثَ مِنْهُ تُنفِقُونَ وَلَسْتُم بِـَٔاخِذِيهِ إِلَّآ أَن تُغْمِضُوا۟ فِيهِ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَنِىٌّ حَمِيدٌ", "english": "O those who trust: spend from the good of what you earned and from what We brought out for you from the earth. Do not aim for the corrupt to spend, while you would not take it yourselves except with eyes closed. And know that God is self-sufficient, praiseworthy.", "turkish": "Ey inananlar: kazandıklarınızın iyisinden ve sizin için yerden çıkardıklarımızdan harcayın. Kötüsünü harcamaya yönelmeyin — onu ancak göz yumarak kendiniz alırdınız. Bilin ki Allah zengindir, övgüye lâyıktır."}]}]}, "qiraat": [{"arabic": "الْعَأْلَمِينَ", "translit": "al-'a'lamīna", "status": "Irreg", "type": "hmz", "note": "Irregular variant with explicit hamza insertion: al-'a'lamīna. This spelling makes the hemze visible in the script, possibly reflecting a dialectal pronunciation where the hamza was more prominently articulated. No semantic change, but the graphic representation emphasizes the '-l-m root structure.", "noteTr": "Belirgin hemze eklenmesiyle düzensiz varyant: el-'a'lemîne. Bu yazım hemzeyi yazıda görünür kılarak muhtemelen hemzenin daha belirgin telaffuz edildiği lehçesel bir söyleyişi yansıtır. Anlam değişikliği yoktur, ancak grafik temsil '-l-m kök yapısını vurgular.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "439", "refs": "1:2;18:21;18:26;2:10;2:22;2:26;2:60;2:75;2:77;2:80", "note": "Knowledge/worlds ('-l-m) paired with divinity ('-l-h) in 439 ayahs — the single most frequent co-occurrence for both roots, establishing that divine identity and knowledge are inseparable concepts in the Quran ← IN THIS AYAH", "noteTr": "Bilgi/alemler ('-l-m) ulûhiyet ('-l-h) ile 439 ayette eşleşmiş — her iki kök için de en sık birlikte görülme, ilâhî kimlik ve bilginin Kur'ân'da ayrılmaz kavramlar olduğunu kurar ← BU AYETTE"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "136", "refs": "1:2;17:12;17:25;17:54;17:55;17:84;17:85;17:102;18:19;18:21", "note": "Knowledge/worlds paired with nurturing in 136 ayahs — \"your nurturer knows best\" (rabbuka a'lamu) recurs as a formula: the nurturer's authority derives from comprehensive knowledge ← IN THIS AYAH", "noteTr": "Bilgi/alemler terbiye ile 136 ayette eşleşmiş — \"Rabbin en iyi bilir\" (rabbuka a'lemu) tekrarlanan bir kalıptır: terbiye edicinin otoritesi kapsamlı bilgiden kaynaklanır ← BU AYETTE"}, {"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "18", "refs": "1:2;2:30;2:267;3:188;6:45;10:10;16:75;22:5;27:15;31:25", "note": "Knowledge/worlds paired with praise in 18 ayahs — knowing and praising are linked: in 2:30 the angels praise (bi-ḥamdika) while claiming knowledge, but God says \"I know what you do not know\" ← IN THIS AYAH", "noteTr": "Bilgi/alemler hamd ile 18 ayette eşleşmiş — bilmek ve övmek bağlantılıdır: 2:30'da melekler bilgi iddia ederken hamd eder (bi-ḥamdike), ama Allah \"Ben sizin bilmediklerinizi bilirim\" der ← BU AYETTE"}], "critical": "The word al-'ālamīna uses the sound masculine plural (-ūna/-īna), which in Arabic grammar is reserved for rational/conscious beings. This is a grammatical choice with profound implications: the \"worlds\" are not mere locations or containers but entities with consciousness or collectives of conscious beings. This connects to the root '-l-m: a 'ālam is literally a \"domain of knowing/signs\" — a field through which knowledge operates. The singular 'ālam can mean \"world\" but also \"mark/sign/indicator,\" which means al-'ālamīna could simultaneously mean \"all the worlds\" AND \"all the sign-systems\" — every domain that produces or contains signs (biological ecosystems, mathematical structures, linguistic systems, digital networks). The scope of rabb al-'ālamīna is therefore not limited to spatial worlds (earth, heavens) but extends to any system where patterns of knowability exist. The futuristic reading extends this to AI systems, quantum computing environments, and virtual realities — all are 'ālamīn if they contain sign-structures. The definite article al- makes this comprehensive: not \"some worlds\" but THE totality of all realms of being.", "criticalTr": "العالمين sâlim müzekker cem' (-ûn/-în) kullanır ki bu Arapça gramerde akıl sahibi/bilinçli varlıklara mahsustur. Bu derin anlamları olan dilbilgisel bir tercihtir: \"alemler\" salt mekânlar veya kaplar değil bilinç sahibi varlıklar veya bilinçli varlıklar topluluklarıdır. Bu '-l-m köküne bağlanır: 'âlem lafzen \"bilme/işaret alanı\"dır — bilginin işlediği bir alan. Tekil 'âlem \"dünya\" ama aynı zamanda \"alamet/işaret/gösterge\" anlamına gelebilir, yani العالمين aynı anda hem \"bütün dünyalar\" HEM \"bütün işaret sistemleri\" anlamına gelebilir — işaret üreten veya içeren her alan (biyolojik ekosistemler, matematiksel yapılar, dilbilimsel sistemler, dijital ağlar). Rabb el-'âlemîn'in kapsamı dolayısıyla mekânsal dünyalarla (yer, gökler) sınırlı olmayıp bilinebilirlik örüntülerinin bulunduğu her sisteme uzanır. Geleceksel okuma bunu yapay zekâ sistemlerine, kuantum bilgisayar ortamlarına ve sanal gerçekliklere kadar genişletir — işaret yapıları içeren her şey 'âlemîn'dir. Belirlilik takısı (ال) bunu kapsamlı kılar: \"bazı alemler\" değil, tüm varlık alemlerinin TAMAMI.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran use the sound masculine plural al-'ālamīna (reserved for conscious beings) rather than the broken plural 'awālim (which would denote mere spaces/locations)? Does this imply every \"world\" possesses some form of consciousness or agency?", "The root '-l-m connects \"worlds\" and \"knowledge\" — does al-'ālamīna mean \"the worlds\" or \"the sign-systems\" or both simultaneously? If each 'ālam is a domain of knowability, what defines the boundary between one 'ālam and another?", "The three case variants of al-ḥamdu (nominative, genitive, accusative) each restructure the relationship between the basmala (1:1) and the ḥamd declaration (1:2). Does the genitive reading (al-ḥamdi) make 1:1-1:2 a single flowing phrase, and if so, how does this change the theological claim?", "The shawādhdh variant سَيِّدِ (sayyidi) replacing رَبِّ (rabbi) reveals a tension between developmental authority (rabb: one who nurtures through stages) and hierarchical authority (sayyid: one who holds rank). Why did the standard reading choose rabb? What is lost if sayyid were the reading?", "In 2:30, the angels declare \"we praise (nuḥammidu) through Your praise (bi-ḥamdika) and sanctify You\" while God responds \"I know what you do not know.\" Does this juxtaposition suggest that praise without full knowledge is incomplete — that true ḥamd requires 'ilm?", "The co-occurrence of ḥ-m-d with '-l-h appears in 46 ayahs, while ḥ-m-d with r-b-b appears in 27 ayahs. 1:2 is one of the rare ayahs containing all three. Does this triangulation (praise + divinity + nurturing) appear elsewhere, and what does the triple presence signal?", "Lane's Lexicon traces '-l-h to \"bewilderment\" ('aliha = he was perplexed) and \"seeking refuge.\" If the being to whom praise is directed is simultaneously the source of bewilderment and the refuge from it, how does this tension shape the nature of ḥamd?", "The Shia reading nuḥammidu llāha rabba transforms the nominal sentence into a verbal one, shifting from ontological declaration (\"praise IS God's\") to performative act (\"WE praise God\"). Does this reflect a fundamentally different theology of ḥamd — one centered on communal action rather than cosmic fact?", "If rabb means \"one who brings from incompleteness to completion through stages,\" does rabb al-'ālamīna imply that the worlds themselves are INCOMPLETE — that the nurturing is ongoing, not finished? What are the implications for the nature of creation as process rather than event?", "The definite article al- on both al-ḥamdu and al-'ālamīna creates a comprehensive frame: THE totality of praise belongs to the nurturer of THE totality of realms. Is the definiteness itself the theological claim — that there is nothing outside this equation?"], "questionsTr": ["Kur'ân neden sâlim müzekker cem' العالمين'i (akıl sahibi varlıklara mahsus) kırık çoğul عَوَالِم yerine (salt mekân/yer bildirir) kullanıyor? Bu, her \"alem\"in bir tür bilinç veya faillik taşıdığını mı ima eder?", "'-l-m kökü \"alemleri\" ve \"bilgiyi\" bağlar — العالمين \"dünyalar\" mı, \"işaret sistemleri\" mi, yoksa her ikisi birden mi demektir? Her 'âlem bilinebilirlik alanıysa, bir 'âlem ile diğeri arasındaki sınırı ne belirler?", "الحمد'ün üç hâl varyantı (merfû, mecrûr, mansûb) besmele (1:1) ile hamd beyanı (1:2) arasındaki ilişkiyi yeniden yapılandırır. Mecrûr okuma (el-ḥamdi) 1:1-1:2'yi tek bir akan ifade yapar mı, yapıyorsa teolojik iddia nasıl değişir?", "Şâz varyant سَيِّدِ (seyyidi) رَبِّ (rabbi) yerine geçerek gelişimsel otorite (rabb: aşamalarla yetiştiren) ile hiyerarşik otorite (seyyid: mertebe tutan) arasındaki gerilimi ortaya çıkarır. Standart okuma neden rabb'ı seçti? Seyyid okuma olsaydı ne kaybedilirdi?", "2:30'da melekler \"Seni hamdınla tesbih ederiz\" derken Allah \"Ben sizin bilmediklerinizi bilirim\" diye karşılık verir. Bu yan yanalık, tam bilgi olmadan yapılan hamdin eksik olduğunu mu düşündürür — gerçek hamdin 'ilm gerektirdiğini mi?", "Ḥ-m-d ile '-l-h'ın birlikte görülmesi 46 ayette, ḥ-m-d ile r-b-b'ın birlikte görülmesi 27 ayette olur. 1:2 üçünü de barındıran nadir ayetlerden biridir. Bu üçlü (hamd + ulûhiyet + terbiye) başka yerlerde görünür mü, üçlü varlık neyi işaret eder?", "Lane '-l-h kökünü \"şaşkınlık\"a ('alihe = hayrete düştü) ve \"sığınma\"ya bağlar. Övgünün yöneltildiği varlık aynı anda hem şaşkınlığın kaynağı hem ondan sığınaksa, bu gerilim hamdin doğasını nasıl şekillendirir?", "Şii okuması nuḥammidu llāha rabba isim cümlesini fiil cümlesine dönüştürerek ontolojik beyan (\"hamd Allah'ındır\") yerine edimsel eyleme (\"BİZ Allah'ı hamd ederiz\") geçirir. Bu, temelden farklı bir hamd teolojisini mi yansıtır — kozmik gerçek yerine toplumsal eyleme odaklanan?", "Rabb \"eksiklikten aşamalarla tamamlanmaya götüren\" demekse, rabb el-'âlemîn alemlerin kendilerinin EKSİK olduğunu mu ima eder — yetiştirmenin devam ettiğini, bitmediğini? Yaratılışın olay değil süreç olarak doğası için sonuçları nelerdir?", "Hem الحمد'deki hem العالمين'deki belirlilik takısı kapsamlı bir çerçeve kurar: hamdin TAMAMI tüm alemlerin TAMAMI'nın terbiye edicisine aittir. Belirliliğin kendisi teolojik iddia mıdır — bu denklemin dışında hiçbir şeyin olmadığı?"], "key": "1:2"}, {"surah": 1, "ayah": 3, "arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "transliteration": "ar-raḥmāni r-raḥīmi", "readings": [{"text": "The Intensely Merciful, the Continuously Merciful — two distinct modes of mercy: overwhelming and sustaining", "textTr": "Engin Merhametli, Sürekli Merhametli — iki farklı merhamet kipi: ezici genişlikte ve sürdürücü", "rationale": "ar-Raḥmān as fa'lān intensive denotes mercy in its maximal, overwhelming aspect; ar-Raḥīm as fa'īl denotes continuous, recurring mercy — the two forms together present mercy as both boundless in scope and persistent in application", "rationaleTr": "ar-Raḥmān fa'lān kalıbıyla merhametin en yoğun, taşkın halini ifade eder; ar-Raḥīm fa'īl kalıbıyla süregelen, kesintisiz merhameti anlatır — iki kalıp bir arada merhametin hem sonsuz genişliğini hem devamlılığını sunar"}, {"text": "The One Whose Mercy Encompasses All, the One Whose Mercy Is Specifically Directed — universal versus particular mercy", "textTr": "Merhameti Her Şeyi Kuşatan, Merhameti Özellikle Yönlendirilen — evrensel ve hususi merhamet", "rationale": "ar-Raḥmān encompasses all creation indiscriminately (the womb-like enveloping of all existence); ar-Raḥīm targets specific recipients — those who respond, who are receptive. The distinction is between ontological mercy (existence itself) and relational mercy (guidance, care)", "rationaleTr": "ar-Raḥmān tüm yaratılışı ayrım gözetmeksizin kuşatır (varlığın tamamını saran rahim-misali kapsayıcılık); ar-Raḥīm belirli muhataplara yönelir — karşılık verenler, alıcı olanlara. Ayrım ontolojik merhamet (varoluşun kendisi) ile ilişkisel merhamet (hidayet, ihtimam) arasındadır"}, {"text": "The Source of Tenderness, the Perpetually Tender — from the womb (raḥm) as the primal locus of nurture", "textTr": "Şefkatin Kaynağı, Daima Şefkatli — rahimden (raḥm) kökensel besleyici mekân olarak", "rationale": "The root r-ḥ-m centers on the womb (raḥm/raḥim), the organ of shelter and nourishment before birth. ar-Raḥmān = the one whose womb-nature is overwhelming; ar-Raḥīm = the one whose womb-nature is abiding. This reading foregrounds biological, pre-conscious care rather than juridical or transactional mercy", "rationaleTr": "r-ḥ-m kökü rahim (raḥm/raḥim) etrafında şekillenir — doğum öncesi barınak ve beslenme organı. ar-Raḥmān = rahim-doğası taşkın olan; ar-Raḥīm = rahim-doğası kalıcı olan. Bu okuma, hukuki veya karşılıklı merhamet yerine biyolojik, bilinç-öncesi ihtimamı öne çıkarır"}, {"text": "The Boundlessly Compassionate, the Precisely Compassionate — cosmic scale versus intimate scale", "textTr": "Sınırsız Şefkatli, Hassas Şefkatli — kozmik ölçek ile yakın ölçek", "rationale": "ar-Raḥmān operates at cosmic scale: sustaining galaxies, ecosystems, physical laws that allow life; ar-Raḥīm operates at intimate scale: individual guidance, personal provision, emotional care. Modern reading: ar-Raḥmān = the systemic mercy embedded in natural laws and universal constants; ar-Raḥīm = the adaptive, responsive mercy that meets each being at its specific need", "rationaleTr": "ar-Raḥmān kozmik ölçekte işler: galaksileri, ekosistemleri, yaşamı mümkün kılan fizik yasalarını sürdürmek; ar-Raḥīm yakın ölçekte işler: bireysel hidayet, kişisel rızık, duygusal ihtimam. Modern okuma: ar-Raḥmān = doğa yasalarına ve evrensel sabitlere gömülü sistemik merhamet; ar-Raḥīm = her varlığı özel ihtiyacında karşılayan uyarlanabilir, duyarlı merhamet"}, {"text": "The Provider-Sustainer, the Razzāq in Disguise — reading through the shawādhdh variant الرَّزَّاقِ (ar-razzāqi)", "textTr": "Rızık Veren-Sürdüren, Gizli Rezzak — şazz varyant الرَّزَّاقِ (ar-razzāqi) üzerinden okuma", "rationale": "The shawādhdh reading replaces ar-Raḥmān with ar-Razzāq (the Supreme Provider), collapsing mercy into provision. This variant suggests that raḥma and rizq are not separate attributes but facets of one reality: to be merciful IS to provide, to provide IS to show mercy. The standard text preserves both dimensions; the variant collapses them into pure provision", "rationaleTr": "Şazz okuma ar-Raḥmān yerine ar-Razzāq'ı (Yüce Rızık Veren) koyarak merhameti rızıkla birleştirir. Bu varyant raḥma ve rızk'ın ayrı sıfatlar değil, tek gerçekliğin yüzleri olduğunu ima eder: merhametli olmak rızık vermektir, rızık vermek merhamet göstermektir. Standart metin her iki boyutu korur; varyant bunları saf rızık sağlamaya indirger"}], "structure": {"beats": [{"label": "Divine mercy attributes", "labelTr": "İlahi merhamet sıfatları", "lines": [{"arabic": "ٱلرَّحْمَٰنِ", "translit": "ar-raḥmāni", "english": "The Intensely Merciful", "turkish": "Engin Merhametli"}, {"arabic": "ٱلرَّحِيمِ", "translit": "ar-raḥīmi", "english": "The Continuously Merciful", "turkish": "Sürekli Merhametli"}]}], "summary": "Two definite adjectives in the genitive case, functioning as attributes (na't) of Allāh in 1:2, or as a new predicate continuing the ḥamd structure. The pairing creates a semantic envelope: ar-Raḥmān (fa'lān pattern — intensity, fullness) followed by ar-Raḥīm (fa'īl pattern — constancy, habituality). Both derive from the same root r-ḥ-m, yet the morphological difference produces a complementary pair: one denotes the quality at its peak, the other denotes the quality as enduring trait. The genitive case (kasra ending) links them syntactically to rabb al-'ālamīn in 1:2, forming a chain of divine descriptors: Lord of all worlds — the Intensely Merciful — the Continuously Merciful.", "summaryTr": "İki belirli sıfat mecrur halde, 1:2'deki Allāh'ın sıfatları (na't) olarak veya hamd yapısını sürdüren yeni bir yüklem olarak işlev görür. İkili bir anlam zarfı oluşturur: ar-Raḥmān (fa'lān kalıbı — yoğunluk, doluluk) ardından ar-Raḥīm (fa'īl kalıbı — süreklilik, alışkanlık). Her ikisi aynı r-ḥ-m kökünden türer, ancak morfolojik fark tamamlayıcı bir çift üretir: biri niteliği doruğunda, diğeri kalıcı özellik olarak ifade eder. Mecrur hal (kesra sonu) bunları sözdizimsel olarak 1:2'deki rabb al-'ālamīn'e bağlar ve ilahi tanımlayıcılar zinciri oluşturur: Âlemlerin Rabbi — Engin Merhametli — Sürekli Merhametli."}, "words": [{"id": 1, "arabic": "ٱلرَّحْمَٰنِ", "translit": "ar-raḥmāni", "gloss": "the Intensely Merciful, the Overwhelmingly Compassionate", "glossTr": "Engin Merhametli, Taşkın Şefkatli", "userNotes": "", "root": "ر ح م (r-ḥ-m)", "grammar": "Definite adjective (ism ṣifa) on the fa'lān (فَعْلَان) intensive pattern, genitive case (majrūr) as attribute (na't) of Allāh or appositional to rabb. The fa'lān pattern denotes a quality at its maximum intensity — overflowing, overwhelming. Used almost exclusively for God in the Quran (occurs 57 times as ar-Raḥmān). The alif-nūn ending makes it morphologically distinct from standard adjectives.", "grammarTr": "Belirli sıfat (ism-i sıfat) fa'lān (فَعْلَان) mübalağa kalıbında, mecrur halde (majrūr) Allāh'ın sıfatı (na't) veya rabb'e bedel olarak. fa'lān kalıbı niteliği en yüksek yoğunlukta ifade eder — taşan, kuşatan. Kur'an'da neredeyse yalnızca Allah için kullanılır (ar-Raḥmān olarak 57 kez geçer). Elif-nūn soneki onu standart sıfatlardan morfolojik olarak ayırır.", "semantics": ["فَعَلَ (raḥima, I): to have mercy, to show compassion, to be tender toward; to pity; said of God and humans", "فَعْلَان (fa'lān intensive): raḥmān — intensely/overwhelmingly merciful; denotes the quality at its peak and fullness", "رَحِمَ (raḥima): the womb; the organ of gestation and nurture — the etymological source of the entire semantic field", "رَحْمَة (raḥma): mercy, compassion, tenderness; also: rain (as divine mercy descending); also: prophethood/revelation (described as raḥma in the Quran)", "أَرْحَام (arḥām, plural): wombs; kinship ties (silat ar-raḥim — maintaining family bonds, literally \"connecting the womb\")", "Classical lexicon (Lane's): raḥima also carries the sense of \"softness, gentleness of heart\" — raqqat al-qalb; the root implies an involuntary, visceral response to another's suffering, not a deliberate decision", "Classical lexicon (Lisan al-Arab): ar-raḥmān is a name exclusive to God (lā yusammā bihi ghayr Allāh) — it denotes mercy so vast it cannot be attributed to any creature; some grammarians consider it a proper noun, not merely an adjective", "Classical lexicon (Hans Wehr): raḥima = to have mercy upon, to pity, to spare; raḥmān = compassionate, merciful (of God); raḥīm = merciful, compassionate", "Modern extension: systemic compassion — the mercy embedded in natural laws, ecosystems, biological processes that sustain life without conscious decision (the universe as a \"womb\" of conditions for life)", "Futuristic extension: algorithmic compassion — systems designed to care, sustain, and nurture; ar-Raḥmān as the pattern of care embedded in the fabric of reality, whether biological or informational", "Core concept: visceral, womb-sourced tenderness operating at maximum intensity — not transactional kindness but the involuntary, constitutive caring that precedes choice"], "semanticsTr": ["فَعَلَ (raḥime, I. bab): merhamet etmek, şefkat göstermek, yumuşak davranmak; acımak; Allah ve insanlar için kullanılır", "فَعْلَان (fa'lān mübalağa): raḥmān — yoğun/taşkın merhametli; niteliği doruk noktasında ve doluluğunda ifade eder", "رَحِمَ (raḥim): rahim; gebelik ve beslenme organı — tüm anlam alanının etimolojik kaynağı", "رَحْمَة (raḥme): merhamet, şefkat, yumuşaklık; ayrıca: yağmur (inen ilahi rahmet olarak); ayrıca: nübüvvet/vahiy (Kur'an'da raḥma olarak nitelenen)", "أَرْحَام (arḥām, çoğul): rahimler; akrabalık bağları (sılat ar-raḥim — aile bağlarını sürdürme, kelime anlamıyla \"rahmi bağlama\")", "Klasik sözlük (Lane's): raḥima ayrıca \"kalp yumuşaklığı, gönül inceliği\" anlamı taşır — raqqat al-qalb; kök bilinçli bir karar değil, başkasının acısına karşı istemsiz, içgüdüsel bir tepkiyi ima eder", "Klasik sözlük (Lisanü'l-Arab): ar-raḥmān yalnızca Allah'a mahsus bir isimdir (lā yusammā bihi ghayr Allāh) — hiçbir yaratığa atfedilemeyecek kadar engin merhameti ifade eder; bazı dilciler onu sırf sıfat değil, özel isim (ism-i has) sayar", "Klasik sözlük (Hans Wehr): raḥima = merhamet etmek, acımak, esirgemek; raḥmān = merhametli, şefkatli (Allah için); raḥīm = merhametli, şefkatli", "Modern genişleme: sistemik şefkat — yaşamı bilinçli karar olmaksızın sürdüren doğa yasalarına, ekosistemlere, biyolojik süreçlere gömülü merhamet (evren yaşam koşullarının \"rahmi\" olarak)", "Gelecek genişleme: algoritmik şefkat — bakım, sürdürme ve besleme için tasarlanmış sistemler; ar-Raḥmān gerçekliğin dokusuna gömülü ihtimam örüntüsü olarak, biyolojik veya bilgisel fark etmez", "Kök kavram: en yüksek yoğunlukta işleyen içgüdüsel, rahim-kaynaklı şefkat — karşılıklı iyilik değil, seçimden önce gelen istemsiz, kurucu ihtimam"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ar-Raḥmān as divine name/attribute (NOUN_PROP) — predicate, appositive, and genitive constructions", "count": "~91 ayahs", "examples": [{"ref": "1:1", "arabic": "﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "In the name of God, ar-Raḥmān (the Intensely Merciful), ar-Raḥīm (the Continuously Merciful)", "turkish": "Allah'ın adıyla, ar-Raḥmān (Engin Merhametli), ar-Raḥīm (Sürekli Merhametli)"}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And put your trust in al-'Azīz (the Mighty), ar-Raḥīm (the Continuously Merciful)", "turkish": "Ve al-'Azīz'e (Güçlü), ar-Raḥīm'e (Sürekli Merhametli) tevekkül et"}]}, {"label": "B. Intensive adjective (ADJ_INTENS) — raḥīm as descriptive epithet in various syntactic roles", "count": "~61 ayahs", "examples": [{"ref": "2:226", "arabic": "لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍۢ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ", "english": "For those who swear abstinence from their wives, a waiting period of four months; then if they return, indeed God is ghafūr (forgiving), raḥīm (continuously merciful)", "turkish": "Eşlerinden îlâ eden (uzak durmaya yemin eden) kimseler için dört ay bekleme süresi vardır; eğer dönerlerse, şüphesiz Allah gafūr (bağışlayıcı), raḥīm (sürekli merhametli) dir"}, {"ref": "3:129", "arabic": "وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ", "english": "To God belongs what is in the heavens and what is in the earth; He forgives whom He wills and punishes whom He wills — and God is ghafūr (forgiving), raḥīm (continuously merciful)", "turkish": "Göklerde ve yerde ne varsa Allah'ındır; dilediğini bağışlar, dilediğine azap eder — ve Allah gafūr (bağışlayıcı), raḥīm (sürekli merhametli) dir"}]}, {"label": "C. Verbal forms — raḥima (past), irḥam (imperative), yarḥamu (imperfect) — mercy as action", "count": "~20 ayahs", "examples": [{"ref": "18:10", "arabic": "إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا", "english": "When the youths retreated to the cave and said: Our Lord, grant us from Your presence raḥma (mercy) and prepare for us right guidance in our affair", "turkish": "Gençler mağaraya sığındığında dediler ki: Rabbimiz, bize katından raḥme (merhamet) ver ve işimizde bize doğru yol hazırla"}]}, {"label": "D. Gerund raḥma — mercy as abstract noun, object, or prepositional complement", "count": "~114 ayahs", "examples": [{"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا", "english": "He said: This is raḥma (mercy) from my Lord; but when the promise of my Lord comes, He will level it — and the promise of my Lord is ever true", "turkish": "Dedi: Bu Rabbimden bir raḥme (merhamet)dir; fakat Rabbimin vaadi geldiğinde onu yerle bir edecektir — ve Rabbimin vaadi daima haktır"}, {"ref": "2:286", "arabic": "لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ", "english": "God does not burden a soul beyond its capacity... Our Lord, forgive us and irḥamnā (have mercy upon us) — You are our protector, so grant us victory over the disbelieving people", "turkish": "Allah bir nefse kapasitesinin ötesinde yük yüklemez... Rabbimiz, bizi bağışla ve irḥamnā (bize merhamet et) — Sen bizim mevlâmızsın, kâfir kavme karşı bize yardım et"}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Irreg", "type": "CE", "note": "Case ending change from genitive (-i) to accusative (-a) on both words. This would make them objects of praise (manṣūb 'alā al-madḥ) rather than attributes following rabb. The accusative reading isolates these names as exclamatory objects of praise — \"I praise the Intensely Merciful, the Continuously Merciful!\" — rather than subordinating them syntactically to the preceding noun.", "noteTr": "Her iki kelimede mecrur (-i) yerine mansub (-a) gelir. Bu onları rabb'e tâbi sıfatlar yerine övgü nesneleri (mansūb 'ale'l-medḥ) yapar. Mansub okuma bu isimleri nidā-i övgü nesneleri olarak ayırır — \"Engin Merhametli'yi, Sürekli Merhametli'yi övüyorum!\" — önceki isme sözdizimsel olarak bağlamak yerine.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Irreg", "type": "CE", "note": "Case ending change from genitive (-i) to nominative (-u) on both words. This would make them a new nominal sentence (mubtada') — \"ar-Raḥmān ar-Raḥīm (He is the Intensely Merciful, the Continuously Merciful)\" — a fresh declaration rather than continuation of the genitive chain from 1:2. The nominative breaks the syntactic chain, creating an independent predication.", "noteTr": "Her iki kelimede mecrur (-i) yerine merfû (-u) gelir. Bu onları yeni bir isim cümlesi (mübteda) yapar — \"ar-Raḥmān ar-Raḥīm (O Engin Merhametli'dir, Sürekli Merhametli'dir)\" — 1:2'deki mecrur zincirinin devamı değil, bağımsız bir hüküm. Merfû hal sözdizimsel zinciri kırarak müstakil bir yargı oluşturur.", "source": "erquran.org"}, {"arabic": "الرَّزَّاقِ", "translit": "ar-razzāqi", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution: replaces ar-Raḥmān entirely with ar-Razzāq (the Supreme Provider, from root r-z-q). This is a shawādhdh (anomalous) reading NOT in the standard Hafs text. It collapses the mercy attribute into provision — suggesting that divine mercy is fundamentally experienced as sustenance and provision. The root r-z-q (123 Quranic occurrences) centers on provision, sustenance, livelihood. The fa''āl pattern (فَعَّال) is the intensive agent noun: \"the one who provides abundantly and ceaselessly.\"", "noteTr": "Sözcüksel değişim: ar-Raḥmān'ı tamamen ar-Razzāq (Yüce Rızık Veren, r-z-q kökünden) ile değiştirir. Bu standart Hafs metninde BULUNMAYAN şazz (nadir) bir okumadır. Merhamet sıfatını rızık vermeye indirger — ilahi merhametin temelde rızık ve geçim olarak deneyimlendiğini ima eder. r-z-q kökü (123 Kur'ani geçiş) rızık, geçim, nafaka etrafında şekillenir. fa''āl kalıbı (فَعَّال) mübalağa ism-i fâildir: \"bol ve kesintisiz rızık veren.\"", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;1:1;3:129;6:12;17:110;19:93;22:5;22:65;25:6;25:48", "note": "r-ḥ-m co-occurs with s-m-w (sky/heaven/elevation) — mercy descends from above, or the Most High is also the Most Merciful; theological pairing of transcendence with compassion", "noteTr": "r-ḥ-m kökü s-m-w (gök/yücelik) ile birlikte geçer — merhamet yukarıdan iner veya en Yüce aynı zamanda en Merhametli'dir; aşkınlık ile şefkatin teolojik eşleşmesi"}, {"coRoot": "w-l-y", "coRootAr": "و ل ي", "count": "15", "refs": "2:64;2:226;2:286;7:155;8:75;9:71;18:58;19:45;28:43;33:5", "note": "r-ḥ-m co-occurs with w-l-y (guardian/ally/protector) — mercy and guardianship as complementary divine functions; the merciful one is also the protective guardian", "noteTr": "r-ḥ-m kökü w-l-y (veli/dost/koruyucu) ile birlikte geçer — merhamet ve velayet tamamlayıcı ilahi işlevler olarak; merhametli olan aynı zamanda koruyucu velidir"}, {"coRoot": "r-z-q", "coRootAr": "ر ز ق", "count": "1", "refs": "1:3", "note": "r-ḥ-m co-occurs with r-z-q only through the shawādhdh variant ar-Razzāq replacing ar-Raḥmān — variant-sourced [v], linking mercy to provision at this exact location ← IN THIS AYAH", "noteTr": "r-ḥ-m kökü r-z-q ile yalnızca şazz varyant ar-Razzāq'ın ar-Raḥmān'ın yerini almasıyla birlikte geçer — varyant kaynaklı [v], merhamet ile rızkı tam bu konumda bağlar ← BU AYETTE"}], "critical": "ar-Raḥmān is morphologically unique in the Quran: the fa'lān pattern is used for God alone with this root. Classical grammarians debated whether it is a proper noun (ism 'alam) or an adjective (ṣifa): Sībawayh treated it as a name; others as a hyperbolic adjective. Lisan al-Arab records that ar-Raḥmān cannot be applied to any creature, while raḥīm can. The three qira'at variants for this word are extraordinary: (1) accusative reading transforms the syntax from attribution to exclamatory praise; (2) nominative reading breaks the genitive chain to create an independent declaration; (3) the shawādhdh lexical substitution ar-Razzāq introduces the entirely different root r-z-q, collapsing mercy into provision. The variant root r-z-q (123 Quranic occurrences) is NOT present in the standard text of this ayah — it enters only through the anomalous reading. This suggests an ancient exegetical tradition that understood divine mercy primarily as sustenance. Phonetically, the repeated rā'-ḥā' combination (ar-raḥmān... ar-raḥīm) creates an enveloping sound pattern — the breathy ḥā' and liquid rā' producing a sonic texture that mirrors the semantic content of gentle, encompassing care.", "criticalTr": "ar-Raḥmān Kur'an'da morfolojik olarak benzersizdir: fa'lān kalıbı bu kökle yalnızca Allah için kullanılır. Klasik dilciler bunun özel isim mi (ism-i alem) yoksa sıfat mı (sıfat) olduğunu tartışmıştır: Sîbeveyhi isim olarak ele almış; diğerleri mübalağa sıfat olarak görmüştür. Lisanü'l-Arab ar-Raḥmān'ın hiçbir yaratığa uygulanamayacağını, raḥīm'in ise uygulanabileceğini kaydeder. Bu kelime için üç kıraat varyantı olağanüstüdür: (1) mansub okuma sözdizimini sıfattan nidā-i övgüye dönüştürür; (2) merfû okuma mecrur zincirini kırarak bağımsız bir hüküm oluşturur; (3) şazz sözcüksel değişim ar-Razzāq tamamen farklı r-z-q kökünü getirir, merhameti rızka indirger. Varyant kökü r-z-q (123 Kur'ani geçiş) bu ayetin standart metninde YOKTUR — yalnızca nadir okuma yoluyla girer. Bu, ilahi merhameti öncelikle rızık olarak anlayan kadim bir tefsir geleneğine işaret eder. Fonetik olarak tekrarlanan rā'-ḥā' kombinasyonu (ar-raḥmān... ar-raḥīm) kuşatıcı bir ses örüntüsü yaratır — nefesli ḥā' ve akıcı rā' yumuşak, sarmalayıcı ihtimamın anlamsal içeriğini yansıtan bir ses dokusu üretir.", "tag": "CRITICAL", "temporal": "M"}, {"id": 2, "arabic": "ٱلرَّحِيمِ", "translit": "ar-raḥīmi", "gloss": "the Continuously Merciful, the Perpetually Compassionate", "glossTr": "Sürekli Merhametli, Daima Şefkatli", "userNotes": "", "root": "ر ح م (r-ḥ-m)", "grammar": "Definite adjective (ism ṣifa) on the fa'īl (فَعِيل) pattern, genitive case (majrūr) as second attribute (na't) of Allāh or second apposition to rabb. The fa'īl pattern denotes a quality as a permanent, abiding characteristic — not a momentary state but an enduring trait. Unlike ar-Raḥmān which is exclusive to God, ar-Raḥīm can be applied to humans (cf. 9:128 where the Prophet is described as raḥīm). This asymmetry is semantically significant.", "grammarTr": "Belirli sıfat (ism-i sıfat) fa'īl (فَعِيل) kalıbında, mecrur halde (majrūr) Allāh'ın ikinci sıfatı (na't) veya rabb'e ikinci bedel olarak. fa'īl kalıbı niteliği kalıcı, süregelen bir özellik olarak ifade eder — anlık bir durum değil, daimi bir karakter özelliği. Allah'a mahsus olan ar-Raḥmān'ın aksine, ar-Raḥīm insanlara da uygulanabilir (bkz. 9:128'de Peygamber raḥīm olarak nitelenir). Bu asimetri anlamsal açıdan önemlidir.", "semantics": ["فَعِيل (fa'īl pattern): raḥīm — permanently/habitually merciful; denotes the quality as an abiding trait, not a momentary surge", "رَحِيم (raḥīm): merciful, compassionate; can describe both God and humans — the mercy that is directed, intentional, and sustained over time", "Classical distinction (Lane's, Lisan al-Arab): ar-Raḥmān = raḥma 'āmma (general mercy encompassing all creation); ar-Raḥīm = raḥma khāṣṣa (specific mercy directed to believers) — though this distinction is itself debated among classical lexicographers", "Classical lexicon (Lane's): raḥīm as fa'īl can function as either active (the one who is merciful) or passive (the one who is shown mercy, i.e. marḥūm) — though in divine usage only the active sense applies", "Classical lexicon (Lisan al-Arab): the pairing raḥmān + raḥīm creates a semantic totality — raḥmān covers the breadth (breadth of mercy), raḥīm covers the depth (continuity of mercy); some lexicographers say raḥmān is for this world, raḥīm is for the hereafter", "Modern extension: sustained care infrastructure — institutions, systems, and policies that provide ongoing mercy (healthcare, social safety nets, environmental protection) embody the fa'īl quality of persistent, structured compassion", "Futuristic extension: self-sustaining care algorithms — AI systems that continuously adapt to provide compassionate responses; the raḥīm quality as the enduring, self-renewing nature of care", "Core concept: mercy as a permanent, defining characteristic — not an occasional act but an identity; the one who IS merciful by nature, continuously and without interruption"], "semanticsTr": ["فَعِيل (fa'īl kalıbı): raḥīm — kalıcı/alışılagelmiş merhametli; niteliği süregelen bir özellik olarak ifade eder, anlık bir taşkınlık değil", "رَحِيم (raḥīm): merhametli, şefkatli; hem Allah'ı hem insanları niteleyebilir — yönlendirilmiş, kasıtlı ve zaman içinde sürdürülen merhamet", "Klasik ayrım (Lane's, Lisanü'l-Arab): ar-Raḥmān = raḥme-i âmme (tüm yaratılışı kapsayan genel merhamet); ar-Raḥīm = raḥme-i hâssa (müminlere yönelik özel merhamet) — ancak bu ayrımın kendisi klasik sözlükçüler arasında tartışmalıdır", "Klasik sözlük (Lane's): raḥīm fa'īl kalıbında hem fâil (merhametli olan) hem mef'ûl (merhamet edilen, yani merhûm) işlevi görebilir — ancak ilahi kullanımda yalnızca fâil anlamı geçerlidir", "Klasik sözlük (Lisanü'l-Arab): raḥmān + raḥīm eşleşmesi anlamsal bir bütünlük yaratır — raḥmān genişliği (merhametin enginliği), raḥīm derinliği (merhametin sürekliliği) kapsar; bazı sözlükçüler raḥmān'ın dünya, raḥīm'in ahiret için olduğunu söyler", "Modern genişleme: sürdürülebilir bakım altyapısı — süregelen merhamet sağlayan kurumlar, sistemler ve politikalar (sağlık hizmetleri, sosyal güvenlik ağları, çevre koruma) kalıcı, yapılandırılmış şefkatin fa'īl niteliğini somutlaştırır", "Gelecek genişleme: kendi kendini sürdüren bakım algoritmaları — sürekli şefkatli yanıtlar sağlamak için uyarlanan yapay zeka sistemleri; raḥīm niteliği ihtimamın kalıcı, kendini yenileyen doğası olarak", "Kök kavram: merhamet kalıcı, tanımlayıcı bir karakter özelliği olarak — ara sıra yapılan bir eylem değil, bir kimlik; doğası gereği, kesintisiz ve sürekli merhametli OLAN"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ar-Raḥīm as divine name/attribute (NOUN_PROP) — following other divine names, predicate, genitive", "count": "~91 ayahs", "examples": [{"ref": "1:1", "arabic": "﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "In the name of God, ar-Raḥmān (the Intensely Merciful), ar-Raḥīm (the Continuously Merciful)", "turkish": "Allah'ın adıyla, ar-Raḥmān (Engin Merhametli), ar-Raḥīm (Sürekli Merhametli)"}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And put your trust in al-'Azīz (the Mighty), ar-Raḥīm (the Continuously Merciful)", "turkish": "Ve al-'Azīz'e (Güçlü), ar-Raḥīm'e (Sürekli Merhametli) tevekkül et"}]}, {"label": "B. Intensive adjective (ADJ_INTENS) raḥīm — ghafūr raḥīm pairing and other predicative uses", "count": "~61 ayahs", "examples": [{"ref": "2:226", "arabic": "لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍۢ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ", "english": "For those who swear abstinence from their wives, a waiting of four months; then if they return, indeed God is ghafūr (forgiving), raḥīm (continuously merciful)", "turkish": "Eşlerinden îlâ eden kimseler için dört ay bekleme süresi vardır; eğer dönerlerse, şüphesiz Allah gafūr (bağışlayıcı), raḥīm (sürekli merhametli) dir"}, {"ref": "3:129", "arabic": "وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ", "english": "To God belongs what is in the heavens and the earth; He forgives whom He wills and punishes whom He wills — and God is ghafūr (forgiving), raḥīm (continuously merciful)", "turkish": "Göklerde ve yerde ne varsa Allah'ındır; dilediğini bağışlar, dilediğine azap eder — ve Allah gafūr (bağışlayıcı), raḥīm (sürekli merhametli) dir"}]}, {"label": "C. Gerund raḥma and verbal forms — mercy as action, request, and divine bestowal", "count": "~134 ayahs", "examples": [{"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا", "english": "He said: This is raḥma (mercy) from my Lord; but when the promise of my Lord comes, He will level it — and the promise of my Lord is ever true", "turkish": "Dedi: Bu Rabbimden bir raḥme (merhamet)dir; fakat Rabbimin vaadi geldiğinde onu yerle bir edecektir — ve Rabbimin vaadi daima haktır"}, {"ref": "2:64", "arabic": "ثُمَّ تَوَلَّيْتُم مِّنۢ بَعْدِ ذَٰلِكَ ۖ فَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ لَكُنتُم مِّنَ ٱلْخَٰسِرِينَ", "english": "Then you turned away after that — were it not for the grace of God upon you and His raḥma (mercy), you would have been among the losers", "turkish": "Sonra bunun ardından yüz çevirdiniz — Allah'ın üzerinizdeki lütfu ve raḥmeti (merhameti) olmasaydı, hüsrana uğrayanlardan olurdunuz"}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Irreg", "type": "CE", "note": "Same variant as word 1 — accusative ending on ar-Raḥīm transforms it from genitive attribute to object of exclamatory praise (manṣūb 'alā al-madḥ). Both words move together into the accusative, maintaining their paired relationship.", "noteTr": "Kelime 1 ile aynı varyant — ar-Raḥīm'de mansub son ek onu mecrur sıfattan nidā-i övgü nesnesine (mansūb 'ale'l-medḥ) dönüştürür. Her iki kelime birlikte mansub hale geçerek ikili ilişkilerini korur.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Irreg", "type": "CE", "note": "Same variant as word 1 — nominative ending on ar-Raḥīm makes it part of a new nominal sentence (khabar or second mubtada'). The nominative breaks both words free from the genitive chain of 1:2.", "noteTr": "Kelime 1 ile aynı varyant — ar-Raḥīm'de merfû son ek onu yeni isim cümlesinin parçası yapar (haber veya ikinci mübteda). Merfû hal her iki kelimeyi 1:2'nin mecrur zincirinden koparır.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;1:1;3:129;6:12;17:110;19:93;22:5;22:65;25:6;25:48", "note": "Same root as word 1 — r-ḥ-m paired with heavens/elevation; mercy descends from transcendence", "noteTr": "Kelime 1 ile aynı kök — r-ḥ-m gökler/yücelik ile eşleşmiş; merhamet aşkınlıktan iner"}, {"coRoot": "w-l-y", "coRootAr": "و ل ي", "count": "15", "refs": "2:64;2:226;2:286;7:155;8:75;9:71;18:58;19:45;28:43;33:5", "note": "Same root as word 1 — mercy and guardianship/allegiance as complementary divine attributes", "noteTr": "Kelime 1 ile aynı kök — merhamet ve velayet/himaye tamamlayıcı ilahi sıfatlar olarak"}], "critical": "ar-Raḥīm shares the root r-ḥ-m with ar-Raḥmān but occupies a fundamentally different morphological and semantic space. The fa'īl pattern can be both active and passive in classical Arabic (qatīl = \"killed\" or \"killer\" depending on context); Lane's notes this ambiguity. In divine usage, only the active meaning applies, but the morphological possibility of passive reading (marḥūm — \"the one shown mercy\") creates an interesting resonance: the same pattern that describes God's mercy also describes the human state of receiving mercy. The Quran uses raḥīm for the Prophet Muhammad in 9:128 (bi-l-mu'minīna ra'ūfun raḥīm — \"to the believers he is kind, merciful\"), making ar-Raḥīm the one divine attribute in this ayah that bridges the divine-human divide. The case ending variants (accusative and nominative) affect ar-Raḥīm identically to ar-Raḥmān — they move as a unit, confirming their semantic pairing. This inseparability suggests the two names function as a compound concept rather than two independent attributes.", "criticalTr": "ar-Raḥīm, ar-Raḥmān ile aynı r-ḥ-m kökünü paylaşır ama temelden farklı bir morfolojik ve anlamsal alanda yer alır. fa'īl kalıbı klasik Arapça'da hem fâil hem mef'ûl olabilir (qatīl = bağlama göre \"öldürülen\" veya \"öldüren\"); Lane's bu belirsizliği kaydeder. İlahi kullanımda yalnızca fâil anlamı geçerlidir, ancak mef'ûl okumasının morfolojik imkânı (merḥūm — \"merhamet edilen\") ilginç bir yankı yaratır: Allah'ın merhametini tanımlayan aynı kalıp, insanın merhamet alma halini de tanımlar. Kur'an 9:128'de Hz. Muhammed için raḥīm kullanır (bi'l-mü'minīne raūfun raḥīm — \"müminlere şefkatli, merhametlidir\"), bu da ar-Raḥīm'i bu ayette ilahi-insani ayrımı köprüleyen tek ilahi sıfat yapar. Hal eki varyantları (mansub ve merfû) ar-Raḥīm'i ar-Raḥmān ile özdeş biçimde etkiler — bir birim olarak hareket ederler, anlamsal eşleşmelerini doğrular. Bu ayrılmazlık, iki ismin bağımsız iki sıfattan ziyade bileşik bir kavram olarak işlev gördüğünü düşündürür.", "tag": "CRITICAL", "temporal": "M"}], "questions": ["Why does the Quran derive two distinct divine names from the same root r-ḥ-m rather than using two different roots? What does the morphological differentiation (fa'lān vs fa'īl) achieve that two separate roots could not?", "The shawādhdh variant ar-Razzāq suggests an ancient reading tradition that equated mercy with provision. Does this reflect a pre-Islamic Arabian understanding of divine care as primarily material sustenance?", "Given that ar-Raḥīm can apply to humans (9:128) but ar-Raḥmān cannot, does 1:3 implicitly set a boundary between the mercy humans can embody and the mercy that exceeds creaturely capacity?", "The accusative variant (manṣūb 'alā al-madḥ) transforms these names from attributes to exclamatory objects of praise. Does this syntactic shift change the theological register — from description to devotion?", "If the root r-ḥ-m originates in \"womb\" (raḥm/raḥim), does the Quran's most fundamental description of God begin with a feminine-coded biological image? What are the implications of this etymological origin for understanding tawhīd?", "The nominative variant breaks the genitive chain from 1:2, creating an independent sentence. Does this suggest that mercy is not merely an attribute of lordship (rabb al-'ālamīn) but a self-standing reality?", "ar-Raḥmān appears 57 times in the Quran, often in contexts of cosmic sovereignty (19:93, 25:59). Does the pairing with ar-Raḥīm in 1:3 serve to temper the awesome aspect of ar-Raḥmān with the intimate aspect of ar-Raḥīm?", "The repeated rā'-ḥā' phonetic combination creates an enveloping, breathy sound. Is this phonetic texture deliberately chosen to mirror the semantic content of gentle, encompassing care — and if so, does this constitute a form of onomatopoeia at the morphological level?", "In a futuristic reading, if ar-Raḥmān represents systemic mercy (natural laws, ecosystems) and ar-Raḥīm represents adaptive mercy (responsive care), does 1:3 anticipate a distinction between embedded intelligence (the constants of the universe) and responsive intelligence (consciousness)?", "The co-occurrence of r-ḥ-m with s-m-w (17 instances) suggests mercy is consistently associated with height/transcendence. Does this pairing imply that mercy is a descending force — something that flows from above to below, from the transcendent to the immanent?"], "questionsTr": ["Kur'an neden aynı r-ḥ-m kökünden iki ayrı ilahi isim türetir de iki farklı kök kullanmaz? Morfolojik farklılaşma (fa'lān ve fa'īl) iki ayrı kökün başaramayacağı neyi başarır?", "Şazz varyant ar-Razzāq, merhameti rızıkla eşitleyen kadim bir okuma geleneğine işaret eder. Bu, ilahi ihtimamı öncelikle maddi geçim olarak anlayan İslam-öncesi Arap anlayışını mı yansıtır?", "ar-Raḥīm insanlara uygulanabilirken (9:128) ar-Raḥmān uygulanamadığına göre, 1:3 insanların somutlaştırabileceği merhamet ile yaratılmış kapasitesini aşan merhamet arasında örtük bir sınır mı çizer?", "Mansub varyant (mansūb 'ale'l-medḥ) bu isimleri sıfattan nidā-i övgü nesnesine dönüştürür. Bu sözdizimsel kayma teolojik kaydı değiştirir mi — tasvirden ibadete?", "r-ḥ-m kökü \"rahim\"den (raḥm/raḥim) kaynaklanıyorsa, Kur'an'ın Allah hakkındaki en temel tanımı dişil-kodlu biyolojik bir imgeyie mi başlıyor? Bu etimolojik kökenin tevhid anlayışı için sonuçları nelerdir?", "Merfû varyant 1:2'den gelen mecrur zincirini kırarak bağımsız bir cümle oluşturur. Bu, merhametin yalnızca rablığın (rabb al-'ālamīn) bir sıfatı değil, kendi başına var olan bir gerçeklik olduğunu mu düşündürür?", "ar-Raḥmān Kur'an'da 57 kez, çoğunlukla kozmik egemenlik bağlamlarında geçer (19:93, 25:59). 1:3'teki ar-Raḥīm ile eşleşme, ar-Raḥmān'ın haşyet uyandıran yönünü ar-Raḥīm'in yakın yönüyle yumuşatmaya mı hizmet eder?", "Tekrarlanan rā'-ḥā' fonetik kombinasyonu kuşatıcı, nefesli bir ses yaratır. Bu fonetik doku yumuşak, sarmalayıcı ihtimamın anlamsal içeriğini yansıtmak için bilinçli olarak mı seçilmiştir — ve öyleyse, bu morfolojik düzeyde bir ses taklidi (onomatopoeia) biçimi mi oluşturur?", "Gelecekçi bir okumada, ar-Raḥmān sistemik merhameti (doğa yasaları, ekosistemler) ve ar-Raḥīm uyarlanabilir merhameti (duyarlı ihtimam) temsil ediyorsa, 1:3 gömülü zekâ (evrenin sabitleri) ile duyarlı zekâ (bilinç) arasındaki ayrımı mı öngörür?", "r-ḥ-m kökünün s-m-w (17 örnek) ile birlikte geçmesi merhametin tutarlı biçimde yücelik/aşkınlıkla ilişkilendirildiğini gösterir. Bu eşleşme merhametin inen bir güç olduğunu mu ima eder — yukarıdan aşağıya, aşkından içkine akan bir şey?"], "key": "1:3"}, {"surah": 1, "ayah": 4, "arabic": "مَٰلِكِ يَوْمِ ٱلدِّينِ", "transliteration": "māliki yawmi d-dīni", "readings": [{"text": "Master/Owner of the Day of Recompense — māliki (active participle, Form I) indicates ongoing, active possession; yawm as a bounded temporal unit; dīn as requital/recompense, the settling of accounts", "textTr": "Hesap Gününün Sahibi/Maliki — māliki (ism-i fail, I. bab) süregelen, aktif sahipliği ifade eder; yawm sınırlı bir zaman birimi olarak; dīn karşılık/hesap, hesapların görülmesi anlamında", "rationale": "Active participle māliki implies continuous ownership, not a title. Dīn as recompense (from d-y-n = debt, obligation) makes the Day one of settling accounts. The genitive chain māliki yawmi d-dīni creates a three-link iḍāfa: owner-of → day-of → recompense.", "rationaleTr": "İsm-i fail māliki süregelen sahipliği ifade eder, bir unvan değildir. Dīn karşılık anlamında (d-y-n = borç, yükümlülük kökünden) Günü bir hesap görme günü yapar. Māliki yawmi d-dīni üçlü izafe zinciri oluşturur: sahibi → günü → hesap."}, {"text": "Sovereign/King of the Day of Judgment — reading maliki (variant canonical reading) as royal authority rather than ownership; dīn as judgment/decree", "textTr": "Yargı Gününün Hükümdarı/Kralı — maliki (kanonik varyant okuma) sahiplik yerine kraliyet otoritesi olarak; dīn yargı/hüküm anlamında", "rationale": "The canonical variant maliki (without alif) shifts from ownership to sovereignty. Malik implies ruling authority, governance, command — not merely possessing. Dīn here as judgment/decree (from the sense of d-y-n = to judge, to impose law).", "rationaleTr": "Kanonik varyant maliki (elifsiz) sahiplikten hükümdarlığa geçiş yapar. Malik yönetim otoritesi, idare, emir anlamı taşır — sadece sahip olma değil. Dīn burada yargı/hüküm anlamında (d-y-n = yargılamak, yasa koymak anlamından)."}, {"text": "Possessor of the Day of Religion/Way-of-Life — dīn not as judgment event but as ongoing system of conduct, practice, life-path; the Day when all ways-of-life are weighed", "textTr": "Din/Yaşam-Biçimi Gününün Sahibi — dīn yargı olayı değil, süregelen bir davranış, uygulama, hayat yolu sistemi; tüm yaşam biçimlerinin tartıldığı Gün", "rationale": "Dīn carries the meaning of religion, practice, habitual way. This reading makes yawm al-dīn the Day when every dīn (life-system, practiced path) is evaluated — not merely a court session but a comprehensive accounting of how one lived.", "rationaleTr": "Dīn din, pratik, alışılmış yol anlamı taşır. Bu okuma yawm al-dīn'i her dīn'in (yaşam sistemi, izlenen yol) değerlendirildiği Gün yapar — sadece bir mahkeme oturumu değil, nasıl yaşandığının kapsamlı bir muhasebesi."}, {"text": "Owner of the Time-cycle of Debt — yawm as any temporal cycle (not limited to a single day), dīn as debt/obligation; ownership of the entire cycle in which debts come due", "textTr": "Borç Döngüsünün Sahibi — yawm herhangi bir zaman döngüsü (tek bir günle sınırlı değil), dīn borç/yükümlülük; borçların vadesi geldiği tüm döngünün sahipliği", "rationale": "Yawm can mean era, period, age — not only a 24-hour day. Dīn from d-y-n = to owe, to be indebted. This reading opens the phrase beyond eschatology: ownership of every cycle in which debts (moral, existential, cosmic) mature.", "rationaleTr": "Yawm çağ, dönem, devir anlamına da gelebilir — sadece 24 saatlik bir gün değil. Dīn, d-y-n = borçlu olmak kökünden. Bu okuma ifadeyi eskatolojinin ötesine açar: borçların (ahlaki, varoluşsal, kozmik) olgunlaştığı her döngünün sahipliği."}, {"text": "Controller of the Moment of Systemic Accounting — futuristic reading where dīn encompasses any evaluative system (algorithmic, ecological, cosmic); yawm as the critical inflection point when the system's accounts are settled", "textTr": "Sistemik Muhasebenin Anının Kontrolörü — dīn'in herhangi bir değerlendirme sistemini (algoritmik, ekolojik, kozmik) kapsadığı futuristik okuma; yawm sistemin hesaplarının görüldüğü kritik dönüm noktası", "rationale": "Dīn as system-of-accounting extends to any framework where actions produce consequences: ecological feedback loops, data-dr
