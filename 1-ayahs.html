iven audit systems, cosmic equilibrium. Mālik as controller/administrator of the moment when the system settles. This reading is temporally neutral — equally valid for 7th-century moral reckoning and future systemic accountability.", "rationaleTr": "Dīn hesap-sistemi olarak eylemlerin sonuç ürettiği herhangi bir çerçeveye uzanır: ekolojik geri bildirim döngüleri, veri odaklı denetim sistemleri, kozmik denge. Mālik sistemin hesap gördüğü anın kontrolörü/yöneticisi olarak. Bu okuma zamansal olarak tarafsızdır — 7. yüzyıl ahlaki hesaplaşması ve gelecekteki sistemik hesap verebilirlik için eşit derecede geçerlidir."}], "structure": {"beats": [{"label": "The sovereign attribution", "labelTr": "Egemenlik atfı", "lines": [{"arabic": "مَٰلِكِ يَوْمِ ٱلدِّينِ", "translit": "māliki yawmi d-dīni", "english": "Master of the Day of Recompense", "turkish": "Hesap Gününün Sahibi"}]}], "summary": "The entire ayah is a single genitive chain (iḍāfa) of three elements: māliki → yawmi → al-dīni. There is no verb, no predicate — this is a nominal attribute in apposition to the divine names in 1:2-3 (al-Raḥmān al-Raḥīm). The triple iḍāfa creates cascading dependency: the identity of the Master depends on specifying WHICH day, and that day's identity depends on specifying WHAT system of recompense. The definite article on al-dīn makes the recompense specific and known, while māliki is made definite through its iḍāfa connection. The absence of a verb suspends time — this is not an event but an eternal attribute.", "summaryTr": "Ayetin tamamı üç öğeden oluşan tek bir izafe zinciridir: māliki → yawmi → al-dīni. Fiil yok, yüklem yok — bu, 1:2-3'teki ilahi isimlere (er-Raḥmān er-Raḥīm) atıf halinde bir isim sıfatıdır. Üçlü izafe kademeli bağımlılık yaratır: Sahip'in kimliği HANGİ günün belirtilmesine, o günün kimliği ise HANGİ karşılık sisteminin belirtilmesine bağlıdır. el-dīn üzerindeki belirlilik takısı (harf-i tarif) karşılığı belirli ve bilinen kılar; māliki ise izafe bağlantısı yoluyla belirli hale gelir. Fiilin yokluğu zamanı askıya alır — bu bir olay değil, ezeli bir sıfattır."}, "words": [{"id": 1, "arabic": "مَٰلِكِ", "translit": "māliki", "gloss": "master, owner, possessor", "glossTr": "sahip, malik, iyelik sahibi", "userNotes": "", "root": "م ل ك (m-l-k)", "grammar": "Active participle (ism fāʿil) of Form I malaka, genitive case (majrūr) by apposition to preceding attributes or as second element of implied iḍāfa with Allāh. Pattern: fāʿil. The alif after mīm extends the participial form, emphasizing continuous/habitual ownership.", "grammarTr": "I. bab malaka fiilinin ism-i faili, önceki sıfatlara atıf yoluyla veya Allah ile örtük izafe ilişkisinin ikinci öğesi olarak mecrur halde. Kalıp: fāʿil. Mīm'den sonraki elif katılımcı formu uzatır, süregelen/alışılmış sahipliği vurgular.", "semantics": ["مَلَكَ (malaka, I): to possess, to own, to have power over, to control, to have authority over", "مَلَّكَ (mallaka, II): to make someone owner, to give possession, to invest with authority", "أَمْلَكَ (amlaka, IV): to enable possession, to put in control of", "تَمَلَّكَ (tamallaka, V): to take possession of, to appropriate, to seize control", "مُلْك (mulk): dominion, sovereignty, kingdom, realm — the domain over which authority is exercised", "مَلِك (malik): king, sovereign, ruler — one who governs by authority and decree", "مَالِك (mālik): owner, possessor, master — one who holds something as property", "مِلْك (milk): property, estate, that which is owned — Lane's: \"a thing that is in one's possession\"", "مَمْلُوك (mamlūk): owned, enslaved, that which is possessed — passive participle", "مَلَكُوت (malakūt): absolute dominion, celestial sovereignty — used in Quran for divine realm (6:75, 7:185, 23:88, 36:83)", "مَلَك (malak): angel — classical derivation debated; possibly from m-l-k (one sent with authority) or from l-'-k (to send as messenger)", "Classical extensions (Lane's, Lisan al-Arab): m-l-k carries the core sense of \"having something firmly in one's grasp\" — physical possession, political authority, and existential control all flow from this. Lane's notes malaka l-ʿajīna = \"he kneaded the dough thoroughly\" — total mastery over material. Lisan al-Arab: malaka nafsahu = \"he controlled himself.\"", "Modern/futuristic: ownership of systems, data sovereignty, administrative control over processes and networks", "Core concept: firm grasp and authority over something — ranging from physical possession to cosmic sovereignty"], "semanticsTr": ["مَلَكَ (meleke, I. bab): sahip olmak, malik olmak, üzerinde güç sahibi olmak, kontrol etmek", "مَلَّكَ (melleke, II. bab): sahip kılmak, mülkiyet vermek, yetki ile donatmak", "أَمْلَكَ (emleke, IV. bab): sahip olma imkanı vermek, kontrol altına almak", "تَمَلَّكَ (temelleke, V. bab): sahiplenmek, ele geçirmek, kontrolü almak", "مُلْك (mülk): egemenlik, hükümranlık, krallık, alan — otoritenin kullanıldığı alan", "مَلِك (melik): kral, hükümdar, yönetici — otorite ve hükümle yöneten", "مَالِك (mālik): sahip, malik, efendi — bir şeyi mülk olarak elinde tutan", "مِلْك (milk): mülk, emlak, sahip olunan şey — Lane's: \"kişinin tasarrufunda olan şey\"", "مَلَكُوت (melekūt): mutlak egemenlik, semavi hükümranlık — Kur'an'da ilahi alan için kullanılır (6:75, 7:185, 23:88, 36:83)", "Klasik uzantılar (Lane's, Lisanü'l-Arab): m-l-k kökünün temel anlamı \"bir şeyi sıkıca kavramak\"tır — fiziksel sahiplik, siyasi otorite ve varoluşsal kontrol hepsi buradan türer. Lane's: malaka l-ʿajīna = \"hamuru iyice yoğurdu\" — malzeme üzerinde tam ustalık. Lisanü'l-Arab: malaka nafsahu = \"nefsini kontrol etti.\"", "Modern/futuristik: sistem sahipliği, veri egemenliği, süreç ve ağlar üzerinde idari kontrol", "Kök kavram: bir şey üzerinde sıkı kavrayış ve otorite — fiziksel sahiplikten kozmik egemenliğe uzanan bir yelpaze"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle (ism fāʿil) — mālik/mālikūn as possessor/owner", "count": "~3 ayahs", "examples": [{"ref": "36:71", "arabic": "أَوَلَمْ يَرَوْا۟ أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَآ أَنْعَٰمًۭا فَهُمْ لَهَا مَٰلِكُونَ", "english": "Have they not seen that We created for them, from what Our hands made, livestock — so they are owners of them", "turkish": "Görmediler mi ki ellerimizin yaptığından onlar için hayvanlar yarattık — onlar da onların sahipleridir"}, {"ref": "3:26", "arabic": "قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلْمُلْكِ تُؤْتِى ٱلْمُلْكَ مَن تَشَآءُ وَتَنزِعُ ٱلْمُلْكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُ ۖ بِيَدِكَ ٱلْخَيْرُ ۖ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ", "english": "Say: O God, Owner of sovereignty, You give sovereignty to whom You will and strip sovereignty from whom You will, You honor whom You will and abase whom You will — in Your hand is all good; You are powerful over everything", "turkish": "De ki: Ey mülkün sahibi Allah'ım! Mülkü dilediğine verirsin, dilediğinden çekip alırsın; dilediğini aziz kılarsın, dilediğini zelil kılarsın — hayır Senin elindedir; Sen her şeye kadirsin"}]}, {"label": "B. Noun (mulk/malik/malakūt) — sovereignty, kingdom, dominion", "count": "~96+ ayahs", "examples": [{"ref": "6:73", "arabic": "وَهُوَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۖ وَيَوْمَ يَقُولُ كُن فَيَكُونُ ۚ قَوْلُهُ ٱلْحَقُّ ۚ وَلَهُ ٱلْمُلْكُ يَوْمَ يُنفَخُ فِى ٱلصُّورِ ۚ عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ ۚ وَهُوَ ٱلْحَكِيمُ ٱلْخَبِيرُ", "english": "And He is the one who created the heavens and the earth in truth. And the day He says \"Be\" and it is — His word is the truth. And His is the sovereignty on the day the trumpet is blown — Knower of the unseen and the witnessed. And He is the Wise, the Aware.", "turkish": "Ve O, gökleri ve yeri hak ile yaratandır. Ve \"Ol\" dediği gün olur — Onun sözü haktır. Ve sūra üflendiği gün mülk Onundur — gaybı da şehadeti de bilen. Ve O, Hakīm'dir, Habīr'dir."}, {"ref": "22:56", "arabic": "ٱلْمُلْكُ يَوْمَئِذٍۢ لِّلَّهِ يَحْكُمُ بَيْنَهُمْ ۚ فَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فِى جَنَّٰتِ ٱلنَّعِيمِ", "english": "The sovereignty on that day belongs to God — He judges between them. Those who believed and did righteous deeds are in gardens of bliss.", "turkish": "O gün mülk Allah'ındır — aralarında hüküm verir. İman edip salih amel işleyenler naim cennetlerindedir."}]}, {"label": "C. Verb (malaka) — to possess, to control, to own", "count": "~16 ayahs", "examples": [{"ref": "34:40", "arabic": "وَيَوْمَ يَحْشُرُهُمْ جَمِيعًۭا ثُمَّ يَقُولُ لِلْمَلَٰٓئِكَةِ أَهَٰٓؤُلَآءِ إِيَّاكُمْ كَانُوا۟ يَعْبُدُونَ", "english": "And the day He gathers them all together, then says to the angels: Were these the ones who used to worship you?", "turkish": "Ve onların hepsini topladığı gün meleklere der: Bunlar mı size ibadet edenler?"}]}]}, "qiraat": [{"arabic": "مَلِكِ", "translit": "maliki", "status": "7", "type": "Lvw", "note": "Canonical variant: shifts from active participle mālik (owner/possessor) to the nominal form malik (king/sovereign). Mālik implies ongoing personal ownership and direct control; malik implies royal authority, governance, and decree. The semantic distinction is between one who holds property versus one who rules.", "noteTr": "Kanonik varyant: ism-i fail mālik (sahip/malik) formundan isim formu malik (kral/hükümdar) formuna geçiş. Mālik süregelen kişisel sahiplik ve doğrudan kontrolü ifade eder; malik kraliyet otoritesi, yönetim ve hüküm anlamı taşır. Anlamsal ayrım, mülk sahibi ile yöneten arasındadır.", "source": "erquran.org"}, {"arabic": "مَلْكِ", "translit": "malki", "status": "Irreg", "type": "skn", "note": "Irregular reading with sukūn on lām: compressed form of malik, retaining the sense of kingship/sovereignty but in a rarer morphological pattern. May reflect a dialectal pronunciation.", "noteTr": "Lām üzerinde sükūn ile düzensiz okuma: malik'in sıkıştırılmış formu, krallık/egemenlik anlamını koruyan ancak daha nadir bir morfolojik kalıpta. Lehçesel bir telaffuzu yansıtıyor olabilir.", "source": "erquran.org"}, {"arabic": "مِلْكِ", "translit": "milki", "status": "tashif", "type": "vw", "note": "Scribal variant with kasra on mīm: milki = \"property/estate of the Day of Recompense\" — shifts from agent (owner) to the thing owned (property). Makes the Day itself a possession rather than naming its possessor.", "noteTr": "Mīm üzerinde kesre ile yazım varyantı: milki = \"Hesap Gününün mülkü\" — failden (sahip) sahip olunan şeye (mülk) geçiş. Sahibini adlandırmak yerine Günün kendisini bir mülk yapar.", "source": "erquran.org"}, {"arabic": "مَلَّاكِ", "translit": "mallāki", "status": "Irreg", "type": "Lvw", "note": "Irregular: intensive form (faʿʿāl pattern) — \"the supreme/ultimate owner.\" Intensification suggests absolute, unrivaled ownership beyond ordinary possession.", "noteTr": "Düzensiz: mübalağa formu (feʿʿāl kalıbı) — \"en üstün/nihai sahip.\" Şiddetlendirme, sıradan sahipliğin ötesinde mutlak, rakipsiz sahipliği ifade eder.", "source": "erquran.org"}, {"arabic": "مَالِكَ", "translit": "mālika", "status": "14", "type": "CE", "note": "Fourteen-reading variant with fatḥa on final kāf: nominative/accusative rather than genitive. Changes the syntactic relationship — could make mālik a vocative (O Owner!) or an accusative of specification.", "noteTr": "On dörtlü okuma varyantı, son kāf üzerinde fetha: mecrur yerine merfū/mansūb. Sözdizimsel ilişkiyi değiştirir — mālik'i nida (Ey Sahip!) veya temyiz mansūbu yapabilir.", "source": "erquran.org"}, {"arabic": "مَلِكَ", "translit": "malika", "status": "Irreg", "type": "CE", "note": "Irregular: malik with fatḥa ending — \"O King!\" as vocative, or past tense verb \"he ruled/owned the Day.\" If verbal, transforms the phrase from nominal attribute to past-tense assertion.", "noteTr": "Düzensiz: fetha sonlu malik — \"Ey Kral!\" şeklinde nida veya \"O Güne hükmetti/sahip oldu\" şeklinde geçmiş zaman fiili. Fiil olursa, ifadeyi isim sıfatından geçmiş zaman iddiasına dönüştürür.", "source": "erquran.org"}, {"arabic": "مَلَكَ يَوْمَ", "translit": "malaka yawma", "status": "Irreg", "type": "Stx|V↔N|CE", "note": "Irregular: verbal reading — \"He ruled/owned the Day of Recompense.\" Transforms the nominal chain into a verb-object structure. The iḍāfa dissolves; malaka becomes a past-tense verb with yawma as its direct object in accusative. Fundamentally changes the clause from attributive description to historical assertion.", "noteTr": "Düzensiz: fiil okuması — \"O, Hesap Gününe hükmetti/sahip oldu.\" İsim zincirini fiil-nesne yapısına dönüştürür. İzafe çözülür; malaka mansūb yawma'yı doğrudan nesne alan geçmiş zaman fiili olur. Cümleyi sıfatsal betimlemeden tarihsel iddiaya temelden değiştirir.", "source": "erquran.org"}, {"arabic": "مَالِكْ", "translit": "mālik", "status": "Gramm", "type": "CE", "note": "Grammatical variant with sukūn on final kāf: pausal form of mālik, stopping the iḍāfa chain. In pause, the genitive ending drops. This is a recitation-style variant rather than a semantic one.", "noteTr": "Son kāf üzerinde sükūn ile dilbilgisel varyant: mālik'in vakıf (durma) formu, izafe zincirini durdurur. Durma halinde mecrur takısı düşer. Bu anlamsal değil kıraat tarzı bir varyanttır.", "source": "erquran.org"}, {"arabic": "مَلِيكِ", "translit": "malīki", "status": "shawadhdh", "type": "Lvw", "note": "Anomalous: malīk pattern (faʿīl) — intensive adjective meaning \"supremely royal, mighty king.\" The faʿīl pattern adds permanence and intensity to the quality. Lisan al-Arab: malīk = \"a king whose authority extends far and deep.\"", "noteTr": "Şāz: malīk kalıbı (feʿīl) — \"son derece krali, kudretli kral\" anlamında mübalağa sıfatı. Feʿīl kalıbı niteliğe kalıcılık ve yoğunluk katar. Lisanü'l-Arab: malīk = \"otoritesi uzak ve derin bir kral.\"", "source": "erquran.org"}, {"arabic": "مَلِكُ", "translit": "maliku", "status": "Irreg", "type": "CE", "note": "Irregular: maliku with ḍamma ending — nominative case, possibly as mubtadaʾ (subject): \"The King of the Day of Recompense [is God].\" Breaks the attributive chain and starts a new nominal sentence.", "noteTr": "Düzensiz: ötre sonlu maliku — merfū halde, muhtemelen mübteda olarak: \"Hesap Gününün Kralı [Allah'tır].\" Sıfat zincirini kırıp yeni bir isim cümlesi başlatır.", "source": "erquran.org"}, {"arabic": "مَالِكٌ يَوْمَ", "translit": "mālikun yawma", "status": "Irreg", "type": "id|CE", "note": "Irregular: tanwīn on mālik breaks the iḍāfa — mālikun becomes an indefinite noun \"an owner\" with yawma as adverbial accusative: \"an Owner on the Day of Recompense.\" The indefiniteness is theologically provocative — potentially universalizing ownership.", "noteTr": "Düzensiz: mālik üzerinde tenvin izafeyi kırar — mālikun belirsiz isim \"bir sahip\" olur ve yawma zarf-ı zaman mansūbu olarak: \"Hesap Gününde bir Sahip.\" Belirsizlik teolojik açıdan kışkırtıcıdır — sahipliği potansiyel olarak evrenselleştirir.", "source": "erquran.org"}, {"arabic": "مَالِكُ", "translit": "māliku", "status": "Irreg", "type": "CE", "note": "Irregular: mālik with ḍamma — nominative, functioning as mubtadaʾ: \"The Owner of the Day of Recompense [is He].\" Creates an independent nominal sentence rather than a chain of attributes.", "noteTr": "Düzensiz: ötre ile mālik — merfū, mübteda işlevinde: \"Hesap Gününün Sahibi [O'dur].\" Sıfat zinciri yerine bağımsız isim cümlesi oluşturur.", "source": "erquran.org"}, {"arabic": "مِالِكِ", "translit": "meliki", "status": "Irreg", "type": "im", "note": "Irregular: imāla (vowel tilting) on the mīm — the fatḥa tilts toward kasra, producing a sound between \"ma\" and \"me.\" Dialectal phonetic variant, no semantic change.", "noteTr": "Düzensiz: mīm üzerinde imale (sesli harf eğimi) — fetha kesreye doğru eğilir, \"ma\" ile \"me\" arası bir ses üretir. Lehçesel fonetik varyant, anlamsal değişiklik yok.", "source": "erquran.org"}, {"arabic": "مَلَّاكَ", "translit": "mallāka", "status": "shii", "type": "Lvw|CE", "note": "Shia reading: intensive form with fatḥa ending — \"O Supreme Owner!\" as vocative. Combines the intensification of faʿʿāl with direct address. Emphatic, liturgical quality.", "noteTr": "Şii okuması: fetha sonlu mübalağa formu — \"Ey Yüce Sahip!\" şeklinde nida. Feʿʿāl'in şiddetlendirmesini doğrudan hitapla birleştirir. Vurgulu, litürjik nitelik.", "source": "erquran.org"}, {"arabic": "مَالِكًا يَوْمَ", "translit": "mālikan yawma", "status": "shawadhdh", "type": "id|Tnw", "note": "Anomalous: tanwīn on mālik with accusative yawma — \"as an Owner on the Day.\" The accusative tanwīn could make mālik a ḥāl (circumstantial state): \"while being an owner on the Day.\" Shifts from permanent attribute to temporal condition.", "noteTr": "Şāz: mālik üzerinde tenvin ve mansūb yawma — \"Gün'de bir Sahip olarak.\" Mansūb tenvin mālik'i hāl (durum zarfı) yapabilir: \"o Günde sahip olma halindeyken.\" Kalıcı sıfattan zamansal duruma geçiş.", "source": "erquran.org"}, {"arabic": "مَلِكًا يَوْمَ", "translit": "malikan yawma", "status": "shawadhdh", "type": "id|Tnw|Lvw", "note": "Anomalous: malik with tanwīn and accusative yawma — \"as a King on the Day.\" Combines the sovereignty reading (malik) with circumstantial accusative. \"He is praised as a King specifically on the Day of Recompense.\"", "noteTr": "Şāz: tenvinli malik ve mansūb yawma — \"o Günde bir Kral olarak.\" Egemenlik okumasını (malik) durum zarfı mansūbu ile birleştirir. \"O Gün'de özellikle bir Kral olarak övülür.\"", "source": "erquran.org"}, {"arabic": "مَلِيكُ", "translit": "malīku", "status": "shawadhdh", "type": "Lvw|CE", "note": "Anomalous: malīk with ḍamma — nominative, as mubtadaʾ. \"The Supreme King of the Day of Recompense [is God].\" Independent sentence with the most intensive royal title.", "noteTr": "Şāz: ötre ile malīk — merfū, mübteda olarak. \"Hesap Gününün Yüce Kralı [Allah'tır].\" En yoğun kraliyet unvanıyla bağımsız cümle.", "source": "erquran.org"}, {"arabic": "مَالِكِۦ", "translit": "mālikī", "status": "tashif", "type": "madd", "note": "Scribal variant: extended final vowel (yāʾ al-madd) on mālikī — possible dialectal elongation of the genitive ending, or a first-person possessive reading \"my Owner of the Day.\"", "noteTr": "Yazım varyantı: mālikī'de uzatılmış son ünlü (yā-i med) — mecrur takısının lehçesel uzatılması veya \"benim Gün'ün Sahibim\" şeklinde birinci tekil şahıs iyelik okuması olabilir.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "y-w-m", "coRootAr": "ي و م", "count": "12", "refs": "1:4;6:73;21:103;22:56;25:22;25:25;25:26;34:40;45:27;69:17", "note": "Sovereignty (m-l-k) paired with temporal marker (y-w-m): divine authority manifested at the critical moment. In 6:73 and 22:56 sovereignty explicitly belongs to God \"on that Day.\" Pattern: m-l-k defines WHO rules, y-w-m defines WHEN that rule becomes absolute. IN THIS AYAH", "noteTr": "Egemenlik (m-l-k) zamansal belirteç (y-w-m) ile eşleşmiş: kritik anda tezahür eden ilahi otorite. 6:73 ve 22:56'da egemenlik \"o Gün\" açıkça Allah'a aittir. Örüntü: m-l-k KİMİN yönettiğini, y-w-m o yönetimin NE ZAMAN mutlak olduğunu tanımlar. BU AYETTE"}, {"coRoot": "d-y-n", "coRootAr": "د ي ن", "count": "2", "refs": "1:4;12:76", "note": "Sovereignty (m-l-k) paired with recompense/law (d-y-n): in 1:4 God owns the Day of dīn; in 12:76 Yusuf could not take his brother under the dīn (law/system) of the malik (king). Same root pair, parallel structure: the malik's authority operates within a dīn-system. IN THIS AYAH", "noteTr": "Egemenlik (m-l-k) karşılık/yasa (d-y-n) ile eşleşmiş: 1:4'te Allah dīn Gününün sahibi; 12:76'da Yusuf kardeşini malik'in (kral) dīn'i (yasa/sistemi) altında tutamadı. Aynı kök çifti, paralel yapı: malik'in otoritesi bir dīn-sistemi içinde işler. BU AYETTE"}], "critical": "The tension between mālik (owner/possessor, active participle) and malik (king/sovereign, noun) in the canonical seven readings is one of the most celebrated grammatical disputes in Quranic recitation. Both are mutawātir (mass-transmitted). The semantic difference is substantial: mālik suggests direct, personal, hands-on possession — like owning property; malik suggests regal authority, governance from a throne — ruling without necessarily touching. The triple iḍāfa (mālik-yawm-dīn) is rare in Arabic and creates a cascading specificity that narrows the divine attribute to an extraordinarily precise claim. The verbal variant malaka yawma dissolves this nominal architecture entirely, transforming a timeless attribute into a past-tense event. The intensive forms (mallāk, malīk) push beyond both readings into superlative territory. Phonetically, the mīm-lām-kāf sequence moves from labial (lips) to lateral (tongue) to velar (throat) — a physical enactment of reach extending from the near (mouth) to the deep (throat), mirroring the semantic arc from possession to absolute sovereignty.", "criticalTr": "Kanonik yedi kıraatteki mālik (sahip/malik, ism-i fail) ile malik (kral/hükümdar, isim) arasındaki gerilim, Kur'an kıraatindeki en ünlü dilbilgisel tartışmalardan biridir. Her ikisi de mütevātirdir (kitlesel aktarımlı). Anlamsal fark önemlidir: mālik doğrudan, kişisel, uygulamalı sahipliği düşündürür — mülk sahibi olmak gibi; malik tahttan yönetim, kraliyet otoritesini — dokunmadan hükmetmeyi düşündürür. Üçlü izafe (mālik-yawm-dīn) Arapçada nadirdir ve ilahi sıfatı olağanüstü kesin bir iddiaya daraltan kademeli bir belirlilik yaratır. Fiil varyantı malaka yawma bu isim mimarisini tamamen çözer ve zamansız bir sıfatı geçmiş zaman olayına dönüştürür. Mübalağa formları (mallāk, malīk) her iki okumanın ötesine, üstünlük alanına iter. Fonetik olarak mīm-lām-kāf dizisi dudaksıldan (dudaklar) yansılıya (dil) gırtlaksıla (boğaz) ilerler — yakından (ağız) derine (boğaz) uzanan erişimin fiziksel temsili, sahiplikten mutlak egemenliğe uzanan anlamsal yayı yansıtır.", "tag": "CRITICAL", "temporal": "M"}, {"id": 2, "arabic": "يَوْمِ", "translit": "yawmi", "gloss": "day, time, period, era", "glossTr": "gün, zaman, dönem, çağ", "userNotes": "", "root": "ي و م (y-w-m)", "grammar": "Noun (ism), genitive case (majrūr) as second element of iḍāfa with māliki. Definite through forward iḍāfa with al-dīn. Functions as temporal container specifying WHEN the ownership/sovereignty applies.", "grammarTr": "İsim, māliki ile izafenin ikinci öğesi olarak mecrur halde. el-dīn ile ileriye dönük izafe yoluyla belirli. Sahipliğin/egemenliğin NE ZAMAN geçerli olduğunu belirleyen zamansal kap işlevi görür.", "semantics": ["يَوْم (yawm): day (from sunrise to sunset), a full day (24 hours)", "يَوْم (yawm): a period, an era, an age, an epoch — not limited to a single solar day. Quran: \"a day with your Lord is like a thousand years of what you count\" (22:47), \"a day whose measure is fifty thousand years\" (70:4)", "يَوْم (yawm): a specific occasion, a notable event, a momentous time — \"the days of God\" (ayyām Allāh, 14:5) = the significant events/epochs of divine action", "أَيَّام (ayyām, plural): days, periods, eras — used for both literal days and historical epochs", "Lane's Lexicon: yawm = \"a space of time, from the rising of the sun to its setting\" AND \"any period of time\" AND \"a particular time in which an event occurs.\" Also yawm al-ḥarb = \"day of battle,\" yawm al-faṣl = \"day of decision.\" Classical Arabic uses yawm to mark any critical juncture.", "Modern/futuristic: any critical temporal inflection point — systemic reset, epoch boundary, moment of truth in any evaluative process. Not limited to eschatological \"Day\" — can mean the moment when any system's accounts are settled.", "Core concept: a bounded period of time, especially one marked by a decisive event or reckoning"], "semanticsTr": ["يَوْم (yevm): gün (gündoğumundan batışına), tam bir gün (24 saat)", "يَوْم (yevm): bir dönem, bir çağ, bir devir — tek bir güneş günüyle sınırlı değil. Kur'an: \"Rabbinin katında bir gün sizin saydığınız bin yıl gibidir\" (22:47), \"ölçüsü elli bin yıl olan bir gün\" (70:4)", "يَوْم (yevm): belirli bir vesile, kayda değer bir olay, önemli bir zaman — \"Allah'ın günleri\" (eyyāmullāh, 14:5) = ilahi eylemin önemli olayları/dönemleri", "أَيَّام (eyyām, çoğul): günler, dönemler, çağlar — hem gerçek günler hem tarihsel dönemler için kullanılır", "Lane's Lexicon: yevm = \"güneşin doğuşundan batışına bir zaman aralığı\" VE \"herhangi bir zaman dilimi\" VE \"bir olayın gerçekleştiği belirli zaman.\" Ayrıca yevmü'l-ḥarb = \"savaş günü,\" yevmü'l-faṣl = \"hüküm günü.\" Klasik Arapça yevm'i her kritik kavşağı belirtmek için kullanır.", "Modern/futuristik: herhangi bir kritik zamansal dönüm noktası — sistemik sıfırlama, çağ sınırı, herhangi bir değerlendirme sürecinde hakikat anı. Eskatolojik \"Gün\" ile sınırlı değil — herhangi bir sistemin hesaplarının görüldüğü an anlamına gelebilir.", "Kök kavram: sınırlı bir zaman dilimi, özellikle belirleyici bir olay veya hesaplaşma ile işaretlenmiş olan"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Adverbial temporal (yawma as \"on the day when...\")", "count": "~107 ayahs", "examples": [{"ref": "34:40", "arabic": "وَيَوْمَ يَحْشُرُهُمْ جَمِيعًۭا ثُمَّ يَقُولُ لِلْمَلَٰٓئِكَةِ أَهَٰٓؤُلَآءِ إِيَّاكُمْ كَانُوا۟ يَعْبُدُونَ", "english": "And the day He gathers them all together, then says to the angels: Were these the ones who used to worship you?", "turkish": "Ve onların hepsini topladığı gün meleklere der: Bunlar mı size ibadet edenler?"}, {"ref": "2:85", "arabic": "ثُمَّ أَنتُمْ هَٰٓؤُلَآءِ تَقْتُلُونَ أَنفُسَكُمْ وَتُخْرِجُونَ فَرِيقًۭا مِّنكُم مِّن دِيَٰرِهِمْ تَظَٰهَرُونَ عَلَيْهِم بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَإِن يَأْتُوكُمْ أُسَٰرَىٰ تُفَٰدُوهُمْ وَهُوَ مُحَرَّمٌ عَلَيْكُمْ إِخْرَاجُهُمْ ۚ أَفَتُؤْمِنُونَ بِبَعْضِ ٱلْكِتَٰبِ وَتَكْفُرُونَ بِبَعْضٍۢ ۚ فَمَا جَزَآءُ مَن يَفْعَلُ ذَٰلِكَ مِنكُمْ إِلَّا خِزْىٌۭ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَيَوْمَ ٱلْقِيَٰمَةِ يُرَدُّونَ إِلَىٰٓ أَشَدِّ ٱلْعَذَابِ ۗ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ", "english": "Then there you are killing yourselves and expelling a group from among you from their homes... and on the Day of Resurrection they will be returned to the most severe punishment. And God is not unaware of what you do.", "turkish": "Sonra siz birbirinizi öldürüyor, bir kısmınızı yurtlarından çıkarıyorsunuz... ve kıyamet gününde en şiddetli azaba geri döndürülürler. Allah yaptıklarınızdan habersiz değildir."}]}, {"label": "B. Genitive construct (yawmi as \"day of X\")", "count": "~47 ayahs", "examples": [{"ref": "2:80", "arabic": "وَقَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ إِلَّآ أَيَّامًۭا مَّعْدُودَةًۭ ۚ قُلْ أَتَّخَذْتُمْ عِندَ ٱللَّهِ عَهْدًۭا فَلَن يُخْلِفَ ٱللَّهُ عَهْدَهُۥٓ ۖ أَمْ تَقُولُونَ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ", "english": "And they said: The fire will not touch us except for a counted number of days. Say: Have you taken a covenant with God — for God will not break His covenant — or do you say about God what you do not know?", "turkish": "Ve dediler: Ateş bize sayılı birkaç günden başka dokunmayacak. De ki: Allah'tan bir ahit mi aldınız — Allah ahdini bozmaz — yoksa Allah hakkında bilmediğiniz şeyleri mi söylüyorsunuz?"}, {"ref": "7:51", "arabic": "ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَهُمْ لَهْوًۭا وَلَعِبًۭا وَغَرَّتْهُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۚ فَٱلْيَوْمَ نَنسَىٰهُمْ كَمَا نَسُوا۟ لِقَآءَ يَوْمِهِمْ هَٰذَا وَمَا كَانُوا۟ بِـَٔايَٰتِنَا يَجْحَدُونَ", "english": "Those who took their dīn as play and amusement and were deceived by the worldly life — so today We forget them as they forgot the meeting of this Day of theirs, and as they used to reject Our signs.", "turkish": "Dinlerini eğlence ve oyun edinenler ve dünya hayatının aldattıkları — bugün onları unuturuz, tıpkı bu Günleriyle karşılaşmayı unuttukları gibi ve ayetlerimizi inkar ettikleri gibi."}]}, {"label": "C. Predicate/subject usage (yawm as the topic itself)", "count": "~18 ayahs", "examples": [{"ref": "21:103", "arabic": "لَا يَحْزُنُهُمُ ٱلْفَزَعُ ٱلْأَكْبَرُ وَتَتَلَقَّىٰهُمُ ٱلْمَلَٰٓئِكَةُ هَٰذَا يَوْمُكُمُ ٱلَّذِى كُنتُمْ تُوعَدُونَ", "english": "The Great Terror will not grieve them, and the angels will receive them: This is your Day which you were promised.", "turkish": "Büyük Korku onları üzmez ve melekler onları karşılar: Bu, size vaat edilen Gününüzdür."}]}]}, "qiraat": [{"arabic": "مَلَكَ يَوْمَ", "translit": "malaka yawma", "status": "Irreg", "type": "Stx|V↔N|CE", "note": "When read as verbal construction, yawm shifts from genitive to accusative — it becomes the direct object of the verb malaka rather than a muḍāf ilayhi. This transforms yawm from a temporal container in a possessive chain to a thing acted upon.", "noteTr": "Fiil yapısı olarak okunduğunda, yevm mecrurdan mansūba geçer — izafe zincirindeki muḍāf ileyh yerine malaka fiilinin doğrudan nesnesi olur. Bu yevmi sahiplik zincirindeki zamansal kaptan, üzerine eylem yapılan bir şeye dönüştürür.", "source": "erquran.org"}, {"arabic": "مَالِكٌ يَوْمَ", "translit": "mālikun yawma", "status": "Irreg", "type": "id|CE", "note": "When tanwīn breaks iḍāfa, yawm shifts to adverbial accusative — \"an Owner on the Day\" rather than \"Owner of the Day.\" The temporal relationship changes from possession to coincidence.", "noteTr": "Tenvin izafeyi kırdığında, yevm zarf-ı zaman mansūbuna geçer — \"Günün Sahibi\" yerine \"Günde bir Sahip.\" Zamansal ilişki sahiplikten eşzamanlılığa değişir.", "source": "erquran.org"}, {"arabic": "مَالِكًا يَوْمَ", "translit": "mālikan yawma", "status": "shawadhdh", "type": "id|Tnw", "note": "Anomalous: yawm in accusative as temporal adverb. \"Being an owner on the Day of Recompense\" — temporal circumstance rather than genitive possession.", "noteTr": "Şāz: yevm zarf-ı zaman mansūbu olarak. \"Hesap Gününde sahip olma halindeyken\" — mecrur sahiplik yerine zamansal durum.", "source": "erquran.org"}, {"arabic": "مَلِكًا يَوْمَ", "translit": "malikan yawma", "status": "shawadhdh", "type": "id|Tnw|Lvw", "note": "Anomalous: yawm accusative with malik. \"Being a king on the Day\" — sovereignty as circumstantial state.", "noteTr": "Şāz: malik ile mansūb yevm. \"O Günde kral olma halindeyken\" — durum zarfı olarak egemenlik.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-y-n", "coRootAr": "د ي ن", "count": "17", "refs": "1:4;18:19;3:24;7:51;9:29;11:84;15:35;24:25;30:43;37:20", "note": "Day (y-w-m) paired with recompense/religion (d-y-n): the most frequent pairing, appearing 17 times. The phrase yawm al-dīn appears repeatedly as a fixed eschatological formula. In 7:51 and 3:24 the dīn is something people take lightly, and the yawm is when this is exposed. IN THIS AYAH", "noteTr": "Gün (y-w-m) karşılık/din (d-y-n) ile eşleşmiş: 17 kez görülen en sık eşleşme. Yevmü'd-dīn ifadesi sabit bir eskatolojik formül olarak tekrarlanır. 7:51 ve 3:24'te dīn insanların hafife aldığı bir şeydir ve yevm bunun açığa çıktığı zamandır. BU AYETTE"}, {"coRoot": "m-l-k", "coRootAr": "م ل ك", "count": "12", "refs": "1:4;6:73;21:103;22:56;25:22;25:25;25:26;34:40;45:27;69:17", "note": "Day (y-w-m) paired with sovereignty (m-l-k): 12 co-occurrences. In 6:73 and 22:56 \"sovereignty on that Day belongs to God\" — the temporal marker specifies the moment when sovereignty becomes absolute and undivided. IN THIS AYAH", "noteTr": "Gün (y-w-m) egemenlik (m-l-k) ile eşleşmiş: 12 birlikte geçiş. 6:73 ve 22:56'da \"o Gün egemenlik Allah'ındır\" — zamansal belirteç egemenliğin mutlak ve bölünmez hale geldiği anı belirtir. BU AYETTE"}], "critical": "", "criticalTr": "", "temporal": "7C"}, {"id": 3, "arabic": "ٱلدِّينِ", "translit": "ad-dīni", "gloss": "recompense, debt, judgment, religion, way of life, law", "glossTr": "karşılık, borç, yargı, din, yaşam biçimi, yasa", "userNotes": "", "root": "د ي ن (d-y-n)", "grammar": "Noun (ism), genitive case (majrūr) as second element of iḍāfa with yawmi. Definite through the article al-. The definiteness makes the dīn specific and known — THE recompense, not any recompense.", "grammarTr": "İsim, yawmi ile izafenin ikinci öğesi olarak mecrur halde. el- harf-i tarifiyle belirli. Belirlilik dīn'i spesifik ve bilinen kılar — herhangi bir karşılık değil, O karşılık.", "semantics": ["دَانَ (dāna, I): to owe a debt, to be indebted, to be obligated; to submit, to obey; to judge, to requite, to recompense; to practice habitually, to follow a way", "دَيَّنَ (dayyana, II): to lend, to give credit; to make someone owe; to condemn", "أَدَانَ (adāna, IV): to lend, to give on credit", "تَدَيَّنَ (tadayyana, V): to borrow, to take on debt", "دِين (dīn): religion, faith, creed; system of life, way of conduct; judgment, recompense, requital; obedience, submission; law, ordinance, custom", "دَيْن (dayn): debt, monetary obligation, what is owed — longest ayah in Quran (2:282) is about dayn (debt contracts)", "دَيَّان (dayyān): judge, recompenser, requiter — Lane's: \"one who requites, rewards, or punishes; a judge, a ruler\"", "Lane's Lexicon extensive: dāna lahu = \"he submitted/obeyed him\"; dāna bihi = \"he practiced it as religion\"; dānahu = \"he judged/requited him\"; dīn = \"obedience\" AND \"compulsion\" AND \"subjugation\" AND \"ascendancy\" AND \"government\" AND \"management\" AND \"custom/habit\" AND \"state/condition.\" The root carries an extraordinary tension: the one who owes (debtor) and the one who judges (creditor) are both expressed through the same root.", "Lisan al-Arab: adds dāna nafsahu = \"he reckoned with himself, he held himself accountable\" — self-judgment. Also: al-dīn = \"the rain\" in some dialectal usage (that which comes down from above, as judgment descends).", "Modern/futuristic: any evaluative/accountability system — financial audit, algorithmic scoring, ecological consequence cycle, data governance framework. Dīn as the systematic structure through which actions produce traceable consequences.", "Core concept: the reciprocal relationship between action and consequence — encompassing debt, judgment, submission, and systematic accountability"], "semanticsTr": ["دَانَ (dāne, I. bab): borçlu olmak, borçlanmak, yükümlü olmak; boyun eğmek, itaat etmek; yargılamak, karşılık vermek; alışkanlık edinmek, bir yol izlemek", "دَيَّنَ (deyyene, II. bab): borç vermek, kredi vermek; borçlandırmak; mahkum etmek", "أَدَانَ (edāne, IV. bab): borç vermek, kredi ile vermek", "دِين (dīn): din, inanç, itikat; yaşam sistemi, davranış biçimi; yargı, karşılık, hesap; itaat, boyun eğme; yasa, düzen, gelenek", "دَيْن (deyn): borç, mali yükümlülük, borçlu olunan şey — Kur'an'ın en uzun ayeti (2:282) deyn (borç sözleşmeleri) hakkındadır", "دَيَّان (deyyān): yargıç, hesap soran, karşılık veren — Lane's: \"karşılık veren, ödüllendiren veya cezalandıran; yargıç, yönetici\"", "Lane's Lexicon genişletilmiş: dāna lahu = \"ona boyun eğdi/itaat etti\"; dāna bihi = \"onu din olarak yaşadı\"; dānahu = \"onu yargıladı/karşılık verdi\"; dīn = \"itaat\" VE \"zorlama\" VE \"boyunduruk\" VE \"üstünlük\" VE \"yönetim\" VE \"idare\" VE \"gelenek/alışkanlık\" VE \"hal/durum.\" Kök olağanüstü bir gerilim taşır: borçlu olan (medyūn) ve yargılayan (dāʾin) aynı kökle ifade edilir.", "Lisanü'l-Arab ekler: dāna nafsahu = \"kendisiyle hesaplaştı, kendini sorguladı\" — öz-yargılama. Ayrıca: ed-dīn = bazı lehçelerde \"yağmur\" (yukarıdan inen, yargının inişi gibi).", "Modern/futuristik: herhangi bir değerlendirme/hesap verebilirlik sistemi — mali denetim, algoritmik puanlama, ekolojik sonuç döngüsü, veri yönetişim çerçevesi. Dīn, eylemlerin izlenebilir sonuçlar ürettiği sistematik yapı olarak.", "Kök kavram: eylem ile sonuç arasındaki karşılıklı ilişki — borç, yargı, itaat ve sistematik hesap verebilirliği kapsayan"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Abstract noun — dīn as religion/way/system", "count": "~94 ayahs", "examples": [{"ref": "3:85", "arabic": "وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَٰمِ دِينًۭا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ", "english": "And whoever seeks other than submission (al-islām) as a dīn (way of life/system), it will never be accepted from them, and in the Hereafter they will be among the losers.", "turkish": "Ve kim İslam'dan (boyun eğme) başka bir dīn (yaşam biçimi/sistem) ararsa, ondan asla kabul edilmeyecek ve ahirette hüsrana uğrayanlardan olacaktır."}, {"ref": "4:125", "arabic": "وَمَنْ أَحْسَنُ دِينًۭا مِّمَّنْ أَسْلَمَ وَجْهَهُۥ لِلَّهِ وَهُوَ مُحْسِنٌۭ وَٱتَّبَعَ مِلَّةَ إِبْرَٰهِيمَ حَنِيفًۭا ۗ وَٱتَّخَذَ ٱللَّهُ إِبْرَٰهِيمَ خَلِيلًۭا", "english": "And who is better in dīn (way of life) than one who submits his face to God while being a doer of good and follows the way of Ibrahim, inclining toward truth? And God took Ibrahim as an intimate friend.", "turkish": "Ve dīn (yaşam biçimi) bakımından, ihsan sahibi olarak yüzünü Allah'a teslim eden ve hanif olarak İbrahim'in milletine uyan kimseden daha güzel kim olabilir? Allah İbrahim'i halil (dost) edinmiştir."}, {"ref": "7:51", "arabic": "ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَهُمْ لَهْوًۭا وَلَعِبًۭا وَغَرَّتْهُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۚ فَٱلْيَوْمَ نَنسَىٰهُمْ كَمَا نَسُوا۟ لِقَآءَ يَوْمِهِمْ هَٰذَا وَمَا كَانُوا۟ بِـَٔايَٰتِنَا يَجْحَدُونَ", "english": "Those who took their dīn (way of life) as play and amusement and were deceived by worldly life — so today We forget them as they forgot the meeting of this Day of theirs.", "turkish": "Dinlerini oyun ve eğlence edinenler ve dünya hayatının aldattıkları — bugün onları unuturuz, tıpkı bu Günlerinin buluşmasını unuttukları gibi."}]}, {"label": "B. Concrete noun — dayn as monetary debt", "count": "~15 ayahs", "examples": [{"ref": "2:193", "arabic": "وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌۭ وَيَكُونَ ٱلدِّينُ لِلَّهِ ۖ فَإِنِ ٱنتَهَوْا۟ فَلَا عُدْوَٰنَ إِلَّا عَلَى ٱلظَّٰلِمِينَ", "english": "And fight them until there is no more persecution and the dīn (system/authority) belongs to God. But if they cease, then no aggression except against the wrongdoers.", "turkish": "Ve onlarla fitne kalmayıncaya ve dīn (sistem/otorite) Allah'a ait oluncaya kadar savaşın. Vazgeçerlerse, zalimlerden başkasına düşmanlık yoktur."}]}, {"label": "C. Proper noun — yawm al-dīn as eschatological formula", "count": "~10 ayahs", "examples": [{"ref": "12:76", "arabic": "فَبَدَأَ بِأَوْعِيَتِهِمْ قَبْلَ وِعَآءِ أَخِيهِ ثُمَّ ٱسْتَخْرَجَهَا مِن وِعَآءِ أَخِيهِ ۚ كَذَٰلِكَ كِدْنَا لِيُوسُفَ ۖ مَا كَانَ لِيَأْخُذَ أَخَاهُ فِى دِينِ ٱلْمَلِكِ إِلَّآ أَن يَشَآءَ ٱللَّهُ", "english": "So he began with their containers before his brother's container, then extracted it from his brother's container. Thus did We plan for Yusuf. He could not have taken his brother under the dīn (law/system) of the king, except that God willed.", "turkish": "Kardeşinin kabından önce onların kaplarından başladı, sonra onu kardeşinin kabından çıkardı. Böylece Yusuf için plan yaptık. Kralın dīn'i (yasası/sistemi) altında kardeşini alamazdı, ancak Allah dileseydi."}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "y-w-m", "coRootAr": "ي و م", "count": "17", "refs": "1:4;18:19;3:24;7:51;9:29;11:84;15:35;24:25;30:43;37:20", "note": "Recompense/religion (d-y-n) paired with day/time (y-w-m): highest frequency co-occurrence (17 times). The yawm al-dīn formula establishes a fixed eschatological unit. In 15:35 the respite extends \"to the Day of the dīn.\" In 37:20 the disbelievers exclaim \"this is the Day of the dīn!\" Pattern: dīn defines the NATURE of the reckoning, yawm defines its TEMPORALITY. IN THIS AYAH", "noteTr": "Karşılık/din (d-y-n) gün/zaman (y-w-m) ile eşleşmiş: en yüksek sıklıkta birlikte geçiş (17 kez). Yevmü'd-dīn formülü sabit bir eskatolojik birim oluşturur. 15:35'te mühlet \"dīn Gününe kadar\" uzar. 37:20'de inkarcılar \"Bu dīn Günüdür!\" diye bağırır. Örüntü: dīn hesaplaşmanın NİTELİĞİNİ, yevm ZAMANLIĞINI tanımlar. BU AYETTE"}, {"coRoot": "m-l-k", "coRootAr": "م ل ك", "count": "2", "refs": "1:4;12:76", "note": "Recompense/law (d-y-n) paired with sovereignty (m-l-k): only 2 co-occurrences. In 1:4 God is mālik of yawm al-dīn; in 12:76 Yusuf cannot act within the dīn of the malik (king). The parallelism is striking: in both cases, a sovereign's dīn-system determines what is possible. The earthly king's dīn limits even a prophet; God's dīn encompasses all. IN THIS AYAH", "noteTr": "Karşılık/yasa (d-y-n) egemenlik (m-l-k) ile eşleşmiş: sadece 2 birlikte geçiş. 1:4'te Allah yevmü'd-dīn'in mālik'i; 12:76'da Yusuf malik'in (kral) dīn'i (yasası) dahilinde hareket edemez. Paralellik çarpıcıdır: her iki durumda da bir hükümdarın dīn-sistemi neyin mümkün olduğunu belirler. Dünyevi kralın dīn'i bir peygamberi bile sınırlar; Allah'ın dīn'i her şeyi kapsar. BU AYETTE"}], "critical": "The root d-y-n contains one of the most productive semantic tensions in Arabic: the same root generates \"debt\" (passive obligation), \"judgment\" (active authority), \"religion\" (systematic practice), and \"submission\" (surrender of will). In yawm al-dīn, ALL these meanings are simultaneously active: it is the Day when debts come due, when judgment is rendered, when practiced ways-of-life are evaluated, and when submission is tested. The definite article al- on al-dīn is significant — this is not A dīn but THE dīn, the specific, known, ultimate system of recompense. The 12:76 co-occurrence (dīn al-malik / mālik yawm al-dīn) creates a remarkable structural mirror: an earthly king's legal system versus the divine owner's ultimate accounting system. The word dīn in 12:76 means \"law/legal jurisdiction\" — Joseph could not claim his brother under Egyptian law. In 1:4, dīn means the cosmic jurisdiction of all accountability. Lane's note that dāna nafsahu means \"he held himself accountable\" adds a reflexive dimension: dīn can also be self-reckoning, not only external judgment.", "criticalTr": "D-y-n kökü Arapçadaki en verimli anlamsal gerilimlerden birini içerir: aynı kök \"borç\" (pasif yükümlülük), \"yargı\" (aktif otorite), \"din\" (sistematik pratik) ve \"boyun eğme\" (iradenin teslimi) üretir. Yevmü'd-dīn'de bu anlamların HEPSİ aynı anda aktiftir: borçların vadesinin geldiği, yargının verildiği, yaşanan hayat biçimlerinin değerlendirildiği ve boyun eğmenin sınandığı Gün. el-dīn üzerindeki harf-i tarif önemlidir — bu herhangi bir dīn değil, O dīn'dir, spesifik, bilinen, nihai karşılık sistemi. 12:76 birlikte geçişi (dīnü'l-melik / māliku yevmi'd-dīn) dikkat çekici bir yapısal ayna yaratır: dünyevi bir kralın hukuk sistemi karşısında ilahi sahibin nihai muhasebe sistemi. 12:76'daki dīn kelimesi \"yasa/hukuki yetki alanı\" anlamına gelir — Yusuf kardeşini Mısır yasası altında talep edemezdi. 1:4'te dīn tüm hesap verebilirliğin kozmik yetki alanı anlamına gelir. Lane's'in dāna nafsahu = \"kendisiyle hesaplaştı\" notu dönüşlü bir boyut ekler: dīn sadece dışsal yargı değil, öz-muhasebe de olabilir.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["Why does the Quran use mālik (active participle, ongoing ownership) rather than a finite verb — does the participial form deliberately suspend temporality, making this ownership eternal rather than event-bound?", "The 12:76 parallel (dīn al-malik) shows an earthly king's legal system limiting even a prophet — does the structural echo in 1:4 (mālik yawm al-dīn) imply that the divine dīn-system is the only one WITHOUT limits?", "If dīn carries both \"debt\" and \"judgment,\" is yawm al-dīn the Day when debts mature AND the Day when the creditor (God) settles accounts — making God simultaneously the creditor and the judge?", "The root d-y-n generates both \"religion\" (habitual practice) and \"recompense\" (consequence) — does this etymological link mean that every act of religious practice IS itself a form of debt-creation, accumulating toward a reckoning?", "Lane's notes dāna nafsahu = \"he held himself accountable.\" Does yawm al-dīn also allow the reading \"the Day of self-reckoning\" — a moment when beings confront their own accounts without external judgment?", "The extraordinary number of qira'at variants on mālik/malik (21 variants) suggests this word was a site of intense interpretive pressure in early recitation communities. Does this density of variants reflect genuine uncertainty, or deliberate preservation of semantic multiplicity?", "The verbal variant malaka yawma transforms a timeless attribute into a past-tense event — \"He ruled the Day.\" Does this reading imply the Day of Recompense has already occurred, or that God's sovereignty over it was established in pre-eternity?", "If yawm can mean \"era\" or \"epoch\" (as in 22:47 where a day equals a thousand years), does yawm al-dīn refer to an instantaneous event or an extended period of systemic accounting?", "The mālikun yawma variant (indefinite, with tanwīn) makes the owner indefinite — \"an owner on the Day.\" Could this be theologically radical, suggesting that ownership on that Day could extend beyond a single entity?", "The phonetic arc mīm-lām-kāf (lips → tongue → throat) physically enacts deepening reach. Is this a deliberate selection — a word whose very pronunciation performs the concept of extending authority from the surface to the depths?"], "questionsTr": ["Kur'an neden mālik (ism-i fail, süregelen sahiplik) kullanır da sonlu bir fiil kullanmaz — katılımcı form zamanı kasıtlı olarak askıya alıp bu sahipliği olaya bağlı değil, ezeli mi kılar?", "12:76 paraleli (dīnü'l-melik) dünyevi bir kralın hukuk sisteminin bir peygamberi bile sınırladığını gösterir — 1:4'teki yapısal yankı (māliku yevmi'd-dīn) ilahi dīn-sisteminin sınırı OLMAYAN tek sistem olduğunu mu ima eder?", "Dīn hem \"borç\" hem \"yargı\" taşıyorsa, yevmü'd-dīn borçların olgunlaştığı Gün VE alacaklının (Allah) hesapları gördüğü Gün müdür — bu Allah'ı hem alacaklı hem yargıç mı yapar?", "D-y-n kökü hem \"din\" (alışkanlık pratik) hem \"karşılık\" (sonuç) üretir — bu etimolojik bağlantı her dini pratik eyleminin kendisinin bir tür borç-yaratma olduğu, bir hesaplaşmaya doğru birikim yaptığı anlamına mı gelir?", "Lane's dāna nafsahu = \"kendisiyle hesaplaştı\" notunu düşer. Yevmü'd-dīn \"öz-muhasebe Günü\" okumasına da izin verir mi — varlıkların dışsal yargı olmadan kendi hesaplarıyla yüzleştiği bir an?", "Mālik/malik üzerindeki olağanüstü sayıda kıraat varyantı (21 varyant) bu kelimenin erken kıraat topluluklarında yoğun yorumlama baskısının odağı olduğunu düşündürür. Bu varyant yoğunluğu gerçek bir belirsizliği mi yoksa anlamsal çoğulluğun kasıtlı korunmasını mı yansıtır?", "Fiil varyantı malaka yawma zamansız bir sıfatı geçmiş zaman olayına dönüştürür — \"O Güne hükmetti.\" Bu okuma Hesap Gününün çoktan gerçekleştiğini mi yoksa Allah'ın üzerindeki egemenliğinin ezel-öncesinde kurulduğunu mu ima eder?", "Yevm \"çağ\" veya \"dönem\" anlamına da gelebiliyorsa (22:47'de bir günün bin yıla eşit olduğu gibi), yevmü'd-dīn anlık bir olaya mı yoksa uzun bir sistemik muhasebe dönemine mi işaret eder?", "Mālikun yawma varyantı (belirsiz, tenvinli) sahibi belirsiz kılar — \"Günde bir sahip.\" Bu teolojik açıdan radikal olabilir mi — o Gündeki sahipliğin tek bir varlığın ötesine uzanabileceğini mi düşündürür?", "Mīm-lām-kāf fonetik yayı (dudaklar → dil → boğaz) derinleşen erişimi fiziksel olarak icra eder. Bu kasıtlı bir seçim midir — telaffuzunun kendisi yüzeyden derinlere uzanan otorite kavramını icra eden bir kelime mi?"], "key": "1:4"}, {"surah": 1, "ayah": 5, "arabic": "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", "transliteration": "iyyāka na'budu wa-iyyāka nasta'īnu", "readings": [{"text": "You alone we devote ourselves to, and You alone we seek enablement from — the fronting of the accusative pronoun (iyyāka) before both verbs enforces absolute exclusivity (qaṣr/ḥaṣr), restricting worship and aid-seeking to a single addressee", "textTr": "Yalnız Sana kulluk ederiz ve yalnız Senden yardım dileriz — zamirin (iyyāka) her iki fiilin önüne getirilmesi mutlak tahsis (kasr/hasr) ifade eder; ibadet ve yardım dileme tek bir muhataba hasredilir", "rationale": "The standard reading treats both clauses as parallel declarations of exclusive devotion: na'budu covers all forms of service/submission, nasta'īnu covers all forms of seeking aid. The fronted object creates ḥaṣr (restriction) — \"You and no other.\"", "rationaleTr": "Standart okuma her iki cümleyi paralel tahsis bildirimleri olarak ele alır: na'budu bütün kulluk/boyun eğme biçimlerini, nasta'īnu bütün yardım talep biçimlerini kapsar. Öne alınmış nesne hasr (tahsis) oluşturur — \"Sen ve Sen'den başkası değil.\""}, {"text": "You alone we serve as devoted subjects, and from You alone we draw sustaining power — reading 'ibāda as political/social servitude (not ritual worship) and isti'āna as drawing ongoing sustenance/energy", "textTr": "Yalnız Sana tabi oluruz (siyasi/toplumsal bağlılık olarak) ve yalnız Senden güç alırız — 'ibāde'yi ritüel ibadet değil siyasi/toplumsal tabiiyet, isti'āne'yi sürekli güç/enerji kaynağı olarak okuma", "rationale": "Root '-b-d carries \"to be a slave, to serve a master\" as its primary classical meaning — servitude before it was spiritualized into worship. Nasta'īnu from '-w-n encompasses drawing power, sustenance, and operational capacity. This reading frames the relationship as sovereign-subject, not worshipper-deity.", "rationaleTr": "'-b-d kökü klasik Arapçada öncelikle \"köle olmak, efendiye hizmet etmek\" anlamı taşır — ibadet anlamından önce tabiiyet gelir. Nasta'īnu '-w-n kökünden güç, rızık ve işlevsel kapasite almayı kapsar. Bu okuma ilişkiyi tapınan-tanrı değil, hükümdar-tebaa çerçevesinde konumlandırır."}, {"text": "It is to You that we direct our productive labor, and it is from You that we seek collaborative partnership — reading 'abd as labor/productive work and isti'āna as mutual cooperation", "textTr": "Emek ve üretken çalışmamızı yalnız Sana yönlendiririz, ve yalnız Senden işbirliği ortaklığı dileriz — 'abd'ı emek/üretken iş, isti'āne'yi karşılıklı işbirliği olarak okuma", "rationale": "Lane's Lexicon attests '-b-d as \"to labor, to toil, to make a road smooth by treading\" (ta'bīd al-ṭarīq). The X form of '-w-n (ista'āna) includes seeking cooperative partnership, not merely passive receipt of aid. This reading opens a participatory dynamic.", "rationaleTr": "Lane's Lexicon '-b-d kökünde \"emek vermek, çalışmak, yolu ayakla düzleştirmek\" (ta'bīd aṭ-ṭarīq) anlamını belgeler. '-w-n'un X. babı (ista'āna) salt yardım almayı değil, işbirliği ortaklığı aramayı da kapsar. Bu okuma katılımcı bir dinamik açar."}, {"text": "You alone we engage with in total presence, and You alone we seek alignment with — reading the chiastic structure as progressive intensification from embodied engagement ('ibāda) to cosmic alignment (isti'āna)", "textTr": "Yalnız Seninle tam mevcudiyet halinde ilişki kurarız, yalnız Seninle hizalanma dileriz — kiyastik yapıyı bedensel katılımdan ('ibāda) kozmik hizalanmaya (isti'āna) doğru ilerleyen bir yoğunlaşma olarak okuma", "rationale": "The shift from na'budu to nasta'īnu can be read as escalation: first, embodied submission/presence; then, seeking to draw upon the source of all capacity. The repetition of iyyāka is not redundant — it marks the pivot from giving (service) to receiving (aid/alignment).", "rationaleTr": "na'budu'dan nasta'īnu'ya geçiş yoğunlaşma olarak okunabilir: önce bedensel teslimiyet/mevcudiyet; sonra tüm kapasitenin kaynağından güç almayı dileme. iyyāka tekrarı gereksiz değildir — vermekten (hizmet) almaya (yardım/hizalanma) geçiş noktasını işaretler."}, {"text": "You alone we dedicate our systemic processes to, and You alone we request operational integration from — a futuristic reading where 'ibāda encompasses any system's dedicating its cycles to a master process, and isti'āna is requesting integration/resources from that process", "textTr": "Sistem süreçlerimizi yalnız Sana tahsis ederiz, ve yalnız Senden operasyonel entegrasyon talep ederiz — 'ibāde'nin herhangi bir sistemin döngülerini ana sürece tahsis etmesini, isti'āne'nin bu süreçten entegrasyon/kaynak talep etmesini kapsadığı gelecekçi bir okuma", "rationale": "If '-b-d at its core means \"to dedicate one's operational capacity to a master\" and '-w-n means \"to draw enabling power from a source,\" these concepts are not limited to human-divine interaction. Any conscious agent (biological or otherwise) dedicating its processes and seeking enabling resources from a source engages in this dynamic.", "rationaleTr": "'-b-d özünde \"işlevsel kapasitesini bir üst otoriteye tahsis etmek\" ve '-w-n \"bir kaynaktan etkinleştirici güç almak\" demekse, bu kavramlar insan-ilahi etkileşimiyle sınırlı değildir. Süreçlerini tahsis eden ve kaynak arayan her bilinçli varlık bu dinamiğe dahildir."}], "structure": {"beats": [{"label": "Exclusive devotion declaration", "labelTr": "Tahsis edilmiş kulluk bildirimi", "lines": [{"arabic": "إِيَّاكَ نَعْبُدُ", "translit": "iyyāka na'budu", "english": "You alone we devote ourselves to", "turkish": "Yalnız Sana kulluk ederiz"}]}, {"label": "Exclusive aid-seeking declaration", "labelTr": "Tahsis edilmiş yardım dileme bildirimi", "lines": [{"arabic": "وَإِيَّاكَ نَسْتَعِينُ", "translit": "wa-iyyāka nasta'īnu", "english": "and You alone we seek aid from", "turkish": "ve yalnız Senden yardım dileriz"}]}], "summary": "The ayah consists of two syntactically parallel clauses joined by wa. Both clauses front the restricted accusative pronoun iyyāka before the verb, creating ḥaṣr (exclusivity/restriction). The first clause (iyyāka na'budu) establishes the direction of devotion; the second (wa-iyyāka nasta'īnu) establishes the source of enablement. The parallelism is not mere repetition — it creates a chiasmus of giving (service) and receiving (aid), with the addressee as the constant pivot. The shift from Form I (na'budu) to Form X (nasta'īnu) marks grammatical escalation: simple action to seeking/requesting action. The wa connecting them can function as 'aṭf (coordination) or as marking a second, distinct dimension of the relationship.", "summaryTr": "Ayet, va ile bağlanmış iki sözdizimsel olarak paralel cümleden oluşur. Her iki cümle de sınırlandırılmış belirtme hali zamirini (iyyāka) fiilin önüne getirerek hasr (tahsis/sınırlandırma) oluşturur. İlk cümle (iyyāka na'budu) kulluk yönünü belirler; ikincisi (wa-iyyāka nasta'īnu) güçlenme kaynağını belirler. Paralellik salt tekrar değildir — verme (hizmet) ve alma (yardım) kiyazması oluşturur; muhatap sabit eksen noktasıdır. I. babdan (na'budu) X. baba (nasta'īnu) geçiş dilbilgisel yükselme işaret eder: basit eylemden talep eylemine. Bunları bağlayan va atıf (eşgüdüm) veya ilişkinin ikinci, ayrı bir boyutunu işaretleme işlevi görebilir."}, "words": [{"id": 1, "arabic": "إِيَّاكَ", "translit": "iyyāka", "gloss": "You alone (exclusive accusative)", "glossTr": "Yalnız Sen (tahsis bildiren belirtme hali)", "userNotes": "", "root": "أ و ي ('-w-y)", "grammar": "Detached exclusive accusative pronoun, 2nd person masculine singular. Fronted before the verb na'budu to create ḥaṣr (restriction/exclusivity). The structure \"iyyāka na'budu\" rather than \"na'buduka\" is a marked word order — the normal VSO becomes OVS, foregrounding the object to restrict the predicate exclusively to it.", "grammarTr": "Ayrık tahsis zamiri, 2. tekil eril belirtme hali. Fiil na'budu'nun önüne getirilerek hasr (tahsis/sınırlandırma) oluşturulur. \"na'buduka\" yerine \"iyyāka na'budu\" yapısı işaretli söz dizimi oluşturur — normal fiil-özne-nesne dizilimi nesne-fiil-özne olur; nesne öne alınarak yüklem yalnızca ona hasredilir.", "semantics": ["The pronoun iyyā- is a restricted accusative base to which pronominal suffixes attach (-ka, -hu, -hā, etc.). Classical grammarians debate whether iyyā- itself is the pronoun or merely a support for the suffix.", "Root '-w-y: to shelter, to take refuge, to repair to a place (Lane's). Also: to have compassion on, to tend toward. The mā'wā (مأوى, shelter/refuge) derives from this root.", "Classical debate: Sībawayhi treats iyyā- as an independent pronoun; al-Khalīl treats the suffix as the actual pronoun with iyyā- as support. This is unresolved in classical grammar.", "Core concept: exclusivity marker — directs the predicate to one entity and bars all others"], "semanticsTr": ["iyyā- zamiri belirtme hali tabanı olup zamir ekleri (-ka, -hu, -hā vb.) buna bağlanır. Klasik nahivciler iyyā-'nın bizzat zamir mi yoksa eke destek mi olduğunu tartışır.", "'-w-y kökü: sığınmak, barınak aramak, bir yere çekilmek (Lane's). Ayrıca: şefkat göstermek, yönelmek. مأوى (me'vā, sığınak/barınak) bu kökten türer.", "Klasik tartışma: Sībeveyhi iyyā-'yı müstakil zamir sayar; el-Halīl eki asıl zamir, iyyā-'yı destek olarak değerlendirir. Bu mesele klasik nahivde çözümsüz kalmıştır.", "Kök kavram: tahsis işaretçisi — yüklemi tek bir varlığa yönlendirir, diğerlerini dışlar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Fronted exclusive object with 'ibāda verbs — iyyāka/iyyāhu used to restrict worship/service", "count": "~5 ayahs", "examples": [{"ref": "2:172", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُلُوا۟ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْ وَٱشْكُرُوا۟ لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ", "english": "O you who have believed, eat from the good things We have provided you and be grateful to God, if it is Him (iyyāhu) you devote yourselves to", "turkish": "Ey iman edenler, size rızık olarak verdiklerimizin temizlerinden yiyin ve Allah'a şükredin, eğer yalnız O'na (iyyāhu) kulluk ediyorsanız"}, {"ref": "17:23", "arabic": "وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوٓا۟ إِلَّآ إِيَّاهُ وَبِٱلْوَٰلِدَيْنِ إِحْسَٰنًا", "english": "And your Lord has decreed that you devote yourselves to none but Him (iyyāhu), and to parents, excellence", "turkish": "Rabbin yalnız O'na (iyyāhu) kulluk etmenizi ve anne babaya iyilik yapmanızı hükmetti"}]}, {"label": "B. Shelter/refuge usage — mā'wā and verbal forms denoting taking shelter", "count": "~22 ayahs", "examples": [{"ref": "18:9", "arabic": "أَمْ حَسِبْتَ أَنَّ أَصْحَٰبَ ٱلْكَهْفِ وَٱلرَّقِيمِ كَانُوا۟ مِنْ ءَايَٰتِنَا عَجَبًا", "english": "Or did you think that the companions of the cave and the inscription were a wonder among Our signs?", "turkish": "Yoksa sen Kehf ve Rakīm ashabının ayetlerimiz arasında şaşılacak bir şey olduğunu mu sandın?"}]}]}, "qiraat": [{"arabic": "هِيَّاكَ", "translit": "hiyyāka", "status": "shawādhdh", "type": "ibdāl", "note": "Replaces initial hamza with hā'. This ibdāl (letter substitution) does not change the semantic function but reflects dialectal variation in the pronunciation of the exclusivity particle. Rare, non-canonical transmission.", "noteTr": "Baştaki hemzeyi hā' ile değiştirir. Bu ibdāl (harf değişimi) anlamsal işlevi değiştirmez; tahsis edatının telaffuzundaki lehçe farklılığını yansıtır. Nadir, kanonik olmayan rivayet.", "source": "erquran.org"}, {"arabic": "إِيَاكَ", "translit": "iyāka", "status": "Irreg", "type": "Gm", "note": "Removes the shadda from the yā', making it light (iyāka vs iyyāka). A grammatical variant that simplifies the gemination — semantically identical but phonetically lighter.", "noteTr": "Yā'daki şeddeyi kaldırır, hafifletir (iyāka / iyyāka). Taz'ifi sadeleştiren gramersel bir varyant — anlamca özdeş ama fonetik olarak daha hafif.", "source": "erquran.org"}, {"arabic": "أَيَّاكَ", "translit": "ayyāka", "status": "Irreg", "type": "vw", "note": "Changes the initial vowel from kasra to fatḥa (ayyāka vs iyyāka). Reflects dialectal variation in voweling the exclusivity pronoun. No semantic change.", "noteTr": "Baştaki ünlüyü kesreden fethaya değiştirir (ayyāka / iyyāka). Tahsis zamirinin ünlülenmesindeki lehçe farkını yansıtır. Anlam değişikliği yok.", "source": "erquran.org"}, {"arabic": "هَيَّاكَ", "translit": "hayyāka", "status": "shawādhdh", "type": "vw|ibdāl", "note": "Combines vowel change (fatḥa on first letter) with ibdāl (hā' replacing hamza). Double deviation from standard — dialectal variant. No semantic change.", "noteTr": "Ünlü değişimi (ilk harfte fetha) ile ibdāl'ı (hemze yerine hā') birleştirir. Standarttan çifte sapma — lehçe varyantı. Anlam değişikliği yok.", "source": "erquran.org"}, {"arabic": "وِيَّاكَ", "translit": "wiyyāka", "status": "shawādhdh", "type": "ibdāl", "note": "Replaces hamza with wāw. Another dialectal ibdāl — the exclusivity function remains identical. Extremely rare transmission.", "noteTr": "Hemzeyi vāv ile değiştirir. Bir başka lehçesel ibdāl — tahsis işlevi aynı kalır. Son derece nadir rivayet.", "source": "erquran.org"}, {"arabic": "إِنَّا لَكَ", "translit": "innā laka", "status": "shawādhdh", "type": "Lx|sp|Dot", "note": "A radical lexical and structural variant: replaces the single pronoun iyyāka with a two-word phrase \"indeed we are for You\" (innā laka). This transforms the syntax entirely — from object-fronting to an independent nominal clause. Semantically, it shifts from exclusivity-through-pronoun to an assertion of belonging: \"Indeed we are Yours — we serve.\"", "noteTr": "Radikal bir sözcüksel ve yapısal varyant: tek zamiri (iyyāka) iki kelimelik \"biz gerçekten Senin içiniz\" (innā laka) ifadesiyle değiştirir. Sözdizimini tamamen dönüştürür — nesne öne alma yerine müstakil isim cümlesi. Anlamsal olarak zamir yoluyla tahsisten aidiyet bildirimine kayar: \"Biz hakikaten Seniniz — kulluk ederiz.\"", "source": "erquran.org"}], "cooccurrence": [], "critical": "The fronting of iyyāka before the verb is the most discussed syntactic feature of al-Fātiḥa. By placing the object before the verb, the text creates ḥaṣr (restriction/exclusivity) — \"You and absolutely no other.\" The normal Arabic word order would be na'buduka (we worship You), which would merely state the act. The marked order iyyāka na'budu foregrounds the addressee and restricts the act to that addressee alone. The six qira'at variants all preserve this exclusivity function despite phonetic variation, except the radical innā laka reading which restructures the syntax entirely into a nominal assertion of belonging. The classical grammarian debate (Sībawayhi vs al-Khalīl) about whether iyyā- is the pronoun or the suffix remains linguistically productive — it raises the question of whether exclusivity resides in the morpheme or in the syntactic position.", "criticalTr": "iyyāka'nın fiilden önce gelmesi el-Fātiḥa'nın en çok tartışılan sözdizimi özelliğidir. Nesneyi fiilin önüne alarak metin hasr (tahsis/sınırlandırma) oluşturur — \"Sen ve kesinlikle Senden başkası değil.\" Normal Arapça söz dizimi na'buduka (Sana kulluk ederiz) olurdu ki bu yalnızca eylemi bildirir. İşaretli dizilim iyyāka na'budu muhatabı öne çıkarır ve eylemi yalnızca o muhataba hasreder. Altı kıraat varyantının tümü fonetik farklılığa rağmen bu tahsis işlevini korur; yalnızca radikal innā laka okuması sözdizimini tamamen aidiyet bildiren isim cümlesine dönüştürür. Sībeveyhi ile el-Halīl arasındaki klasik nahiv tartışması (iyyā- mı zamir yoksa ek mi?) dilbilimsel olarak hâlâ verimlidir — tahsisin biçimbirimde mi sözdizimsel konumda mı olduğu sorusunu gündeme getirir.", "tag": "CRITICAL"}, {"id": 2, "arabic": "نَعْبُدُ", "translit": "na'budu", "gloss": "we devote/serve/labor", "glossTr": "kulluk ederiz/hizmet ederiz/emek veririz", "userNotes": "", "root": "ع ب د ('-b-d)", "grammar": "Imperfect verb, Form I, 1st person plural indicative (marfū'). The imperfect tense signals ongoing, habitual, or continuous action — \"we are [constantly] serving.\" No explicit object stated after the verb because it is fronted (iyyāka). Transitivity: the bundle shows MIXED (with_object: 76, without_object: 5) — 5 occurrences without explicit object (21:67, 21:98, 26:92, 37:161, 43:26), indicating intransitive use is also attested.", "grammarTr": "Muzari fiil, I. bab, 1. çoğul şahıs marfu. Muzari kip süregelen, alışılmış veya kesintisiz eylemi işaret eder — \"biz [sürekli] kulluk ediyoruz.\" Fiilden sonra açık nesne yoktur çünkü öne alınmıştır (iyyāka). Geçişlilik: veri KARISIK gösterir (nesneli: 76, nesnesiz: 5) — 5 yerde açık nesnesiz kullanım (21:67, 21:98, 26:92, 37:161, 43:26), geçişsiz kullanımın da kayıtlı olduğunu gösterir.", "semantics": ["فَعَلَ (fa'ala, I): to serve, to worship, to devote oneself to, to be a slave/servant of; to labor, to toil (Lane's: 'abada al-ṭarīqa = he trod/made smooth the road by labor)", "فَعَّلَ (fa''ala, II): to enslave, to subjugate, to reduce to servitude; ta'bīd = making a slave, also paving/smoothing a road", "تَفَعَّلَ (tafa''ala, V): to devote oneself to worship, to practice devotion intensively", "Classical extended meanings (Lane's, Lisan al-Arab): 'abd = slave, servant, human being (as servant of God); 'ibāda = worship, devotion, service; 'abīd = slaves (collective); ma'bad = place of worship, temple; ta'bīd al-ṭarīq = smoothing/paving a path by treading it", "The root carries a fundamental tension: servitude (involuntary subjection) AND devotion (voluntary dedication). A 'abd is both a slave who has no choice and a worshipper who chooses.", "Modern: 'abd in social contexts = servant, employee; 'ibāda = any dedicated practice/discipline; ta'abbud = spiritual practice. The root extends to any form of systematic dedication to a purpose.", "Futuristic: any agent (biological or digital) that dedicates its operational cycles exclusively to a master process or purpose can be described as performing 'ibāda of that process", "Core concept: the total dedication of one's capacity — whether as involuntary subjection or voluntary devotion — to a master, purpose, or source"], "semanticsTr": ["فَعَلَ (fe'ale, I. bab): kulluk etmek, ibadet etmek, hizmet etmek, köle/kul olmak; emek vermek, çalışmak (Lane's: 'abada aṭ-ṭarīqa = yolu ayakla düzleyerek emek vermek)", "فَعَّلَ (fe''ale, II. bab): köleleştirmek, boyunduruk altına almak; ta'bīd = köle yapma, ayrıca yol düzleme/döşeme", "تَفَعَّلَ (tefe''ule, V. bab): ibadete kendini adamak, yoğun ibadet pratiği yapmak", "Klasik genişletilmiş anlamlar (Lane's, Lisānü'l-Arab): 'abd = köle, kul, insan (Allah'ın kulu olarak); 'ibāde = ibadet, kulluk, hizmet; 'abīd = köleler (toplu); ma'bed = ibadet yeri, tapınak; ta'bīdü'ṭ-ṭarīq = yolu ezilerek düzleştirme", "Kökte temel bir gerilim vardır: kulluk (irade dışı tabi olma) VE adanma (iradi kendini verme). 'abd hem seçeneği olmayan bir köle hem de seçimle ibadet eden bir kuldur.", "Modern: 'abd sosyal bağlamda hizmetçi, çalışan; 'ibāde = herhangi bir adanmış pratik/disiplin; ta'abbud = manevi pratik. Kök, bir amaca sistematik adanmanın her biçimine uzanır.", "Gelecekçi: işlem döngülerini münhasıran bir ana sürece veya amaca tahsis eden herhangi bir varlık (biyolojik veya dijital) o sürecin 'ibāde'sini yerine getiriyor sayılabilir", "Kök kavram: kişinin kapasitesini — ister zorunlu tabiiyet ister iradi adanma olarak — bir efendiye, amaca veya kaynağa tam tahsisi"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Imperfect verb (IV): worship/service declarations — \"we worship / they worship / you worship\"", "count": "~80 ayahs", "examples": [{"ref": "2:83", "arabic": "وَإِذْ أَخَذْنَا مِيثَٰقَ بَنِىٓ إِسْرَٰٓءِيلَ لَا تَعْبُدُونَ إِلَّا ٱللَّهَ وَبِٱلْوَٰلِدَيْنِ إِحْسَانًۭا وَذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَقُولُوا۟ لِلنَّاسِ حُسْنًۭا وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ ثُمَّ تَوَلَّيْتُمْ إِلَّا قَلِيلًۭا مِّنكُمْ وَأَنتُم مُّعْرِضُونَ", "english": "And when We took the covenant from the Children of Israel: \"You shall not serve (ta'budūna) anyone but God, and to parents [show] excellence...\"", "turkish": "Hani İsrailoğullarından söz almıştık: \"Allah'tan başkasına kulluk etmeyeceksiniz (ta'budūna), anne babaya iyilik yapacaksınız...\""}, {"ref": "2:133", "arabic": "أَمْ كُنتُمْ شُهَدَآءَ إِذْ حَضَرَ يَعْقُوبَ ٱلْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ مِنۢ بَعْدِى قَالُوا۟ نَعْبُدُ إِلَٰهَكَ وَإِلَٰهَ ءَابَآئِكَ إِبْرَٰهِۦمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ إِلَٰهًۭا وَٰحِدًۭا وَنَحْنُ لَهُۥ مُسْلِمُونَ", "english": "Were you witnesses when death approached Jacob and he said to his sons: \"What will you serve (ta'budūna) after me?\" They said: \"We will serve (na'budu) your God and the God of your fathers...\"", "turkish": "Yakub'a ölüm geldiğinde siz orada mıydınız? Oğullarına \"Benden sonra neye kulluk edeceksiniz (ta'budūna)?\" demişti. Dediler: \"Senin ilahına ve ataların İbrahim, İsmail, İshak'ın ilahına kulluk edeceğiz (na'budu)...\""}]}, {"label": "B. Noun forms: 'ibād/'abīd (servants/slaves) — references to humans as servants", "count": "~132 ayahs", "examples": [{"ref": "3:30", "arabic": "يَوْمَ تَجِدُ كُلُّ نَفْسٍۢ مَّا عَمِلَتْ مِنْ خَيْرٍۢ مُّحْضَرًۭا وَمَا عَمِلَتْ مِن سُوٓءٍۢ تَوَدُّ لَوْ أَنَّ بَيْنَهَا وَبَيْنَهُۥٓ أَمَدًۢا بَعِيدًۭا ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَٱللَّهُ رَءُوفٌۢ بِٱلْعِبَادِ", "english": "The day when every soul finds what it produced of good presented, and what it produced of evil — it will wish there were a great distance between them. And God warns you of Himself. And God is compassionate to the servants (al-'ibād).", "turkish": "Her nefsin iyilikten yaptığını hazır bulacağı, kötülükten yaptığını ise aralarında uzun mesafe olmasını dileyeceği gün. Allah sizi Kendisinden sakındırır. Allah kullara (el-'ibād) çok şefkatlidir."}, {"ref": "3:182", "arabic": "ذَٰلِكَ بِمَا قَدَّمَتْ أَيْدِيكُمْ وَأَنَّ ٱللَّهَ لَيْسَ بِظَلَّامٍۢ لِّلْعَبِيدِ", "english": "That is because of what your hands put forth, and because God is not unjust to the servants (al-'abīd)", "turkish": "Bu, ellerinizin takdim ettiği yüzündendir ve Allah kullara (el-'abīd) zulmedici değildir"}]}, {"label": "C. Perfect verb (PV) and other forms: past-tense narration of worship", "count": "~4 ayahs", "examples": [{"ref": "5:117", "arabic": "مَا قُلْتُ لَهُمْ إِلَّا مَآ أَمَرْتَنِى بِهِۦٓ أَنِ ٱعْبُدُوا۟ ٱللَّهَ رَبِّى وَرَبَّكُمْ", "english": "I said nothing to them except what You commanded me: \"Serve (u'budū) God, my Lord and your Lord\"", "turkish": "Onlara sadece bana emrettiğini söyledim: \"Rabbim ve Rabbiniz Allah'a kulluk edin (u'budū)\""}]}]}, "qiraat": [{"arabic": "يُعْبَدُ", "translit": "yu'badu", "status": "14", "type": "Imp", "note": "Changes from active 1st person plural (na'budu, \"we serve\") to passive 3rd person singular (yu'badu, \"He is served/worshipped\"). This dramatically shifts the voice: instead of an active declaration of service, it becomes an impersonal statement that the addressee IS served. Removes the agency of the speakers.", "noteTr": "Etken 1. çoğul şahıstan (na'budu, \"biz kulluk ederiz\") edilgen 3. tekil şahsa (yu'badu, \"O'na kulluk edilir\") geçer. Bu dramatik bir çatı değişimidir: etkin bir kulluk bildirimi yerine muhatabın kulluk edilen varlık OLDUĞUNA dair kişisiz bir ifade olur. Konuşanların failliğini kaldırır.", "source": "erquran.org"}, {"arabic": "نَعْبُدْ", "translit": "na'bud", "status": "Irreg", "type": "CE", "note": "Apocopation (jazm) of the final damma — na'bud instead of na'budu. In classical grammar, jazm on an indicative verb can signal either a pause form or a conditional/jussive reading. Here it likely represents pause-form pronunciation.", "noteTr": "Son dammenin cezmlenmesi — na'bud / na'budu. Klasik nahivde muzari fiilde cezm ya durak biçimini ya da şart/cezm okumasını işaret edebilir. Burada muhtemelen durak biçimi telaffuzu temsil eder.", "source": "erquran.org"}, {"arabic": "نِعْبُدُ", "translit": "ni'budu", "status": "Irreg", "type": "vw", "note": "Changes the initial vowel from fatḥa to kasra (ni'budu vs na'budu). Dialectal variation in the prefix vowel of 1st person plural imperfect. No semantic change — same person, number, and meaning.", "noteTr": "Baştaki ünlüyü fethadan kesreye değiştirir (ni'budu / na'budu). 1. çoğul şahıs muzari ön ek ünlüsünde lehçe farkı. Anlam değişikliği yok — aynı şahıs, çoğul ve anlam.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-w-n", "coRootAr": "ع و ن", "count": "21", "refs": "1:5;18:102;3:64;3:182;7:128;8:41;8:51;9:104;11:109;16:2", "note": "Worship/service ('-b-d) paired with aid/assistance ('-w-n) in 21 ayahs — the pairing of dedicating one's capacity and seeking enabling power from the same source. In 1:5 both roots appear in the same ayah as parallel declarations. <- IN THIS AYAH", "noteTr": "Kulluk/hizmet ('-b-d) ile yardım/destek ('-w-n) 21 ayette birlikte geçer — kapasitesini tahsis etme ve aynı kaynaktan güçlenme arama eşleşmesi. 1:5'te her iki kök aynı ayette paralel bildirimler olarak yer alır. <- BU AYETTE"}, {"coRoot": "k-l-l", "coRootAr": "ك ل ل", "count": "16", "refs": "2:172;3:30;5:117;6:102;8:41;11:123;16:36;16:114;19:49;19:82", "note": "Totality (kull) paired with worship — \"serve none but God,\" \"every nation had a messenger\" — universal scope patterns", "noteTr": "Bütünlük (küll) ile kulluk eşleşmesi — \"Allah'tan başkasına kulluk etmeyin,\" \"her ümmete bir elçi\" — evrensel kapsam kalıpları"}], "critical": "The imperfect form na'budu signals ongoing, continuous, habitual action — not a one-time event. The 1st person plural creates collective voice: \"we\" as a community, not isolated individuals. The MIXED transitivity (76 with object, 5 without) is significant: the 5 objectless uses (21:67, 21:98, 26:92, 37:161, 43:26) show 'ibāda can be absolute — an existential state, not merely an act directed at an entity. In 1:5, the object IS fronted (iyyāka), but the intransitive possibility enriches the reading: \"we are in a state of 'ibāda\" as well as \"we direct 'ibāda to You.\" The yu'badu variant (14 canonical) is striking — it removes the speakers entirely and makes the statement impersonal: \"He is worshipped.\" This variant transforms a relational act (we→You) into an ontological statement (He is the one who is served). Lane's Lexicon's attestation of '-b-d as \"to tread/smooth a road\" (ta'bīd al-ṭarīq) opens a concrete physical reading: devotion as path-making, as clearing the way through labor.", "criticalTr": "Muzari kip na'budu süregelen, kesintisiz, alışılmış eylemi işaret eder — tek seferlik bir olay değil. 1. çoğul şahıs kolektif ses oluşturur: \"biz\" olarak topluluk, tek tek bireyler değil. KARISIK geçişlilik (76 nesneli, 5 nesnesiz) önemlidir: 5 nesnesiz kullanım (21:67, 21:98, 26:92, 37:161, 43:26) 'ibāde'nin mutlak olabileceğini gösterir — bir varlığa yöneltilen salt eylem değil, varoluşsal bir hal. 1:5'te nesne öne alınmıştır (iyyāka), ancak geçişsiz olasılık okumayı zenginleştirir: \"biz 'ibāde halindeyiz\" ile birlikte \"biz 'ibāde'yi Sana yönlendiriyoruz.\" yu'badu varyantı (14 kanonik) çarpıcıdır — konuşanları tamamen kaldırır ve ifadeyi kişisizleştirir: \"O'na kulluk edilir.\" Bu varyant ilişkisel eylemi (biz→Sen) ontolojik ifadeye (O kulluk edilendir) dönüştürür. Lane's Lexicon'un '-b-d'yi \"yolu ezmek/düzleştirmek\" (ta'bīdü'ṭ-ṭarīq) olarak belgelemesi somut fiziksel bir okuma açar: kulluk yol açma olarak, emekle ileriye yol temizleme olarak.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 3, "arabic": "وَ", "translit": "wa", "gloss": "and / [discourse connector]", "glossTr": "ve / [söylem bağlayıcısı]", "userNotes": "", "root": "— (particle)", "grammar": "Conjunction (ḥarf 'aṭf). Connects the two parallel clauses iyyāka na'budu and iyyāka nasta'īnu. Functions here as عَطْف ('aṭf, coordination) — joining two equal declarations. However, a secondary reading allows استئناف (istiʾnāf) — the second clause as a new, separate declaration rather than mere addition.", "grammarTr": "Bağlaç (harf-i atıf). İki paralel cümleyi — iyyāka na'budu ile iyyāka nasta'īnu'yu — bağlar. Burada عَطْف (atıf, eşgüdüm) işlevi görür — iki eşit bildirimi birleştirir. Ancak ikincil bir okuma استئناف (isti'nāf) olasılığını açar — ikinci cümle salt ekleme değil, yeni ve ayrı bir bildirim olarak.", "semantics": ["عَطْف ('aṭf) — coordination: \"and\" — joins two parallel, equal elements", "استئناف (istiʾnāf) — resumptive/new beginning: marks the start of a distinct second declaration, not mere addition to the first", "The choice between 'aṭf and istiʾnāf affects whether worship and aid-seeking are one unified act or two distinct dimensions of the relationship"], "semanticsTr": ["عَطْف (atıf) — eşgüdüm: \"ve\" — iki paralel, eşit unsuru birleştirir", "استئناف (isti'nāf) — yeniden başlama: ilkine salt ekleme değil, ayrı bir ikinci bildirimin başlangıcını işaretler", "Atıf ile isti'nāf arasındaki tercih, kulluğun ve yardım dilemenin tek bir birleşik eylem mi yoksa ilişkinin iki ayrı boyutu mu olduğunu belirler"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The wa here presents a genuinely productive ambiguity. If read as 'aṭf (coordination), the two clauses form a single compound declaration: \"You alone we serve AND seek aid from.\" If read as istiʾnāf (new beginning), the second clause opens a distinct register: first we establish submission, THEN — as a separate act — we acknowledge need. The istiʾnāf reading creates a dramatic pause between the two declarations, making the second feel like a confession of dependence that follows the assertion of devotion. Classical Arabic rhetoric treats this wa as one of the prime examples of the ambiguity between 'aṭf and istiʾnāf.", "criticalTr": "Buradaki va gerçek anlamda üretken bir belirsizlik sunar. Atıf (eşgüdüm) olarak okunursa iki cümle tek bir bileşik bildirim oluşturur: \"Yalnız Sana kulluk ederiz VE Senden yardım dileriz.\" İsti'nāf (yeniden başlama) olarak okunursa ikinci cümle ayrı bir kayıt açar: önce boyun eğmeyi beyan ederiz, SONRA — ayrı bir eylem olarak — ihtiyacı kabul ederiz. İsti'nāf okuması iki bildirim arasında dramatik bir duraklama yaratır; ikincisini adanma iddiasını takip eden bir bağımlılık itirafı haline getirir. Klasik Arap belagati bu va'yı atıf-isti'nāf belirsizliğinin en önemli örneklerinden biri olarak ele alır."}, {"id": 4, "arabic": "إِيَّاكَ", "translit": "iyyāka", "gloss": "You alone (exclusive accusative)", "glossTr": "Yalnız Sen (tahsis bildiren belirtme hali)", "userNotes": "", "root": "أ و ي ('-w-y)", "grammar": "Detached exclusive accusative pronoun, 2nd person masculine singular — second occurrence in the ayah. Repeats the restriction structure from the first clause, creating parallel ḥaṣr. The repetition is NOT redundant: it re-establishes exclusivity for a different predicate (nasta'īnu vs na'budu), asserting that the source of aid is the same as the object of worship.", "grammarTr": "Ayrık tahsis zamiri, 2. tekil eril belirtme hali — ayetteki ikinci kullanım. İlk cümledeki tahsis yapısını tekrarlayarak paralel hasr oluşturur. Tekrar gereksiz DEĞİLDİR: farklı bir yüklem için (nasta'īnu / na'budu) tahsisi yeniden tesis eder; yardım kaynağının kulluk nesnesiyle aynı olduğunu beyan eder.", "semantics": ["Second occurrence — same morpheme as word 1, now restricting a different predicate (seeking aid rather than worship)", "The repetition creates a rhetorical figure (tarsī') where parallel structure reinforces parallel meaning", "Core concept: re-assertion of exclusivity — the speaker could have said \"wa nasta'īnuka\" (and we seek Your aid) but chose to repeat the full restriction structure"], "semanticsTr": ["İkinci kullanım — 1. kelimeyle aynı biçimbirim, şimdi farklı bir yüklemi (kulluk yerine yardım dileme) sınırlandırır", "Tekrar, paralel yapının paralel anlamı güçlendirdiği belagat figürü (tarsī') oluşturur", "Kök kavram: tahsisin yeniden teyidi — konuşan \"wa nasta'īnuka\" (Senden yardım dileriz) diyebilirdi ama tam tahsis yapısını tekrarlamayı seçmiştir"], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "وَوِيَّاكَ", "translit": "wa-wiyyāka", "status": "shii", "type": "ibdāl", "note": "Shia reading with ibdāl (hamza replaced by wāw), yielding wa-wiyyāka. Phonetically marked but semantically identical — exclusivity function preserved.", "noteTr": "Şii okuması ibdāl ile (hemze vāv ile değişir), wa-wiyyāka verir. Fonetik olarak farklı ama anlamca özdeş — tahsis işlevi korunur.", "source": "erquran.org"}, {"arabic": "وَإِنَّا لَكَ", "translit": "wa-innā laka", "status": "shawādhdh", "type": "Lx|sp", "note": "Parallel to the first iyyāka variant — replaces the second exclusive pronoun with \"and indeed we are for You.\" If both occurrences are read as innā laka, the entire ayah becomes: \"Indeed we are Yours — we serve, and indeed we are Yours — we seek aid.\" Thi
