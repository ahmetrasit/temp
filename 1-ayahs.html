l/tarik)", "source": "erquran.org"}, {"arabic": "صِؗرَاطَ", "translit": "ṣᶻirāṭa", "status": "7", "type": "ibdal", "note": "Canonical variant with ishmam (blending sad and zay sounds) -- a phonetic midpoint between the two canonical readings", "noteTr": "Ismam ile kanonik varyant (sad ve zay seslerinin karisimi) -- iki kanonik okuma arasinda sessel bir orta nokta", "source": "erquran.org"}, {"arabic": "سَبِيلَ", "translit": "sabīla", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing sirat entirely with sabil (s-b-l) -- a complete lexical substitution that shifts the root from s-r-t (defined corridor) to s-b-l (traversable way). This is NOT in the standard Hafs reading.", "noteTr": "Sirat'i tamamen sabil (s-b-l) ile degistiren anormal varyant -- koku s-r-t'den (tanimli koridor) s-b-l'ye (yurunebilir yol) kaydiran tam bir sozcuksel degisim. Bu standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "3", "refs": "1:7;16:121;48:2", "note": "Path (sirat) and bestowal of favor (niʿma) co-occur -- the path is inherently linked to divine grace in these contexts <- IN THIS AYAH", "noteTr": "Yol (sirat) ve nimet bahsetme (niʿma) birlikte gecer -- yol bu baglamlarda ilahi lutufla dogasi geregi baglantilidir <- BU AYETTE"}, {"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "2", "refs": "1:7;6:39", "note": "Path and straying -- the sirat is defined against going astray <- IN THIS AYAH", "noteTr": "Yol ve sapma -- sirat sapmaya karsi tanimlanir <- BU AYETTE"}, {"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "1", "refs": "1:7", "note": "Path and otherness -- the only co-occurrence, in this very ayah, defining the path by exclusion <- IN THIS AYAH", "noteTr": "Yol ve baskalik -- tek birlikte gecis bu ayette, yolu dislanma yoluyla tanimlar <- BU AYETTE"}], "critical": "The word sirat carries the semantic echo of \"swallowing\" (sarata = to swallow) -- the path consumes those who walk it, an image of total immersion. The canonical variants with sin (sirat) and ishmam (between sad and sin) show the word existed at the boundary of two phonetic traditions, suggesting pre-Islamic dialectal variation absorbed into the Quranic reading tradition. The shawadhdh variant sabila (s-b-l) is a complete root substitution -- s-b-l has 176 Quranic occurrences vs s-r-t's 45, making sabil the far more common word for \"way/path.\" The choice of sirat over sabil in the standard text may be deliberate: sirat implies a narrower, more defined path (a corridor, a bridge) while sabil is any traversable road. The eschatological association of sirat with the bridge over the Fire reinforces this narrowness.", "criticalTr": "Sirat sozcugu \"yutmak\" (sarata = yutmak) anlamsal yankisini tasir -- yol uzerinde yuruyenleri yutar, tam bir dalma imgesi. Sin ile (sirat) ve ismam ile (sad ve sin arasi) kanonik varyantlar, sozcugun iki fonetik gelenek sinirinda var oldugunu gosterir ve Islam oncesi lehce farkliliginin Kur'an okuma gelenegi icerisine emildigi dusunulebilir. Sawazz varyanti sabila (s-b-l) tam bir kok degisimi olarak gelir -- s-b-l'nin 176 Kur'an kullanimi varken s-r-t'nin 45 vardir, bu da sabil'i \"yol\" icin cok daha yaygin sozcuk kilar. Standart metinde sabil yerine sirat'in secimi kasitli olabilir: sirat daha dar, daha tanimli bir yol (bir koridor, bir kopru) ima ederken sabil herhangi bir yurunebilir yoldur. Sirat'in Cehennem uzerindeki kopru ile eskatolojik iliskisi bu darligi pekistirir.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 2, "arabic": "ٱلَّذِينَ", "translit": "alladhīna", "gloss": "those who, the ones who", "glossTr": "-enler, o kimseler ki", "userNotes": "", "root": "—", "grammar": "Masculine plural relative pronoun (ism mawsul) introducing a relative clause (sila). Accusative as part of the idafa-like construction with sirata.", "grammarTr": "Cogul eril ism-i mevsul, sila cumlesini baslatir. Sirata ile izafe benzeri yapinin parcasi olarak mansub konumdadir.", "semantics": [], "semanticsTr": [], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "لَذِينَ", "translit": "ladhīna", "status": "Irreg", "type": "Gm", "note": "Irregular variant dropping the initial alif-lam -- changes the relative pronoun from definite (those who) to a bare form. This grammatical variant is NOT in the standard Hafs reading.", "noteTr": "Bas alif-lam'i dusuren duzensiz varyant -- ism-i mevsulu belirli formdan (o kimseler ki) yalina cevirmektedir. Bu dilbilgisel varyant standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}, {"arabic": "مَنْ", "translit": "man", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing alladhina (plural relative) with man (general relative) -- shifts from \"those who\" (specific group) to \"whoever\" (open, universal). ROOT CHANGE: from relative pronoun (no root) to m-n-n. This is NOT in the standard Hafs reading.", "noteTr": "Alladhina'yi (cogul ism-i mevsul) man (genel ism-i mevsul) ile degistiren anormal varyant -- \"o kimseler ki\" (belirli grup) yerine \"her kim\" (acik, evrensel) anlami gelir. KOK DEGISIMI: ism-i mevsulden (koku yok) m-n-n'ye. Standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}], "cooccurrence": [], "critical": "The choice of alladhina (plural, definite relative pronoun) establishes a specific, identifiable group -- not an abstract category but a concrete collectivity of \"those\" who received favor. The shawadhdh variant man (whoever) would universalize this: \"the path of whoever You have favored\" -- making the category open-ended rather than historical. This tension between specificity and universality is central to the ayah's function as a prayer: does the supplicant ask to join a known group, or to walk any path of divine favor? The variant root m-n-n (to bestow, to grant favor) for man is semantically resonant with the immediately following anʿamta (You bestowed favor), creating a potential paronomasia: \"the path of the favor-granting of those You favored.\"", "criticalTr": "Alladhina (cogul, belirli ism-i mevsul) secimi belirli, tanimlanabilir bir grup olusturur -- soyut bir kategori degil, nimet alanlarin somut bir birligi. Sawazz varyanti man (her kim) bunu evrensellestirir: \"nimet verdigin her kimin yolu\" -- kategoriyi tarihsel olmak yerine acik uclu kilar. Bu ozgulluk ve evrensellik arasindaki gerilim, ayetin dua islevi icin merkezidir: dua eden bilinen bir gruba katilmayi mi ister, yoksa herhangi bir ilahi nimet yolunda yurumek mi? man icin varyant kok m-n-n (bahsetmek, lutfetmek) hemen ardindan gelen anʿamta (Sen nimet verdin) ile anlamsal rezonans icerisindedir; potansiyel bir cinas olusturur: \"nimet verdigin kimselerin nimet verme yolu.\""}, {"id": 3, "arabic": "أَنْعَمْتَ", "translit": "anʿamta", "gloss": "You bestowed favor, You graced, You gave well-being", "glossTr": "nimet verdin, lutfettin, esenlik bahsettin", "userNotes": "", "root": "ن ع م (n-'-m)", "grammar": "Perfect verb (past tense), Form IV (afʿala), 2nd person masculine singular. The Form IV causative: \"You caused niʿma (well-being, favor, ease) to be upon [them].\" Appears without explicit direct object in this ayah (intransitive usage).", "grammarTr": "Mazi fiil, IV. bab (if'al), tekil eril 2. sahis. IV. bab ettirgenlik ifade eder: \"Sen niʿma'yi (esenlik, nimet, kolaylik) [onlarin] uzerine kildin.\" Bu ayette acik nesne olmadan gelir (gecissiz kullanim).", "semantics": ["فَعَلَ (faʿala, I): to be soft, tender, smooth; to live in ease and comfort; to be fresh and flourishing (of plants); Lane's Lexicon: naʿima = he lived a life of ease, softness, luxury", "أَفْعَلَ (afʿala, IV): to bestow favor/grace upon; to cause someone to live in well-being; to endow with blessings; to grant ease", "Noun forms: niʿma = favor, blessing, grace; naʿim = bliss, delight, paradise-like comfort; naʿam/anʿam = livestock, cattle (the primary wealth and marker of well-being in pastoral culture)", "Classical (Lane's, Lisan al-Arab): the root encompasses both material and immaterial well-being -- from the softness of leather and freshness of plants to the comfort of a blessed life. Also: naʿama = an ostrich (associated with softness of feathers). The concrete-to-abstract arc: physical softness -> material ease -> spiritual blessing", "Modern: to grant, to provide resources, welfare, social benefits -- systemic well-being, institutional support", "Futuristic: to optimize conditions for, to provide enabling infrastructure -- any act of creating conditions for flourishing, including data access, algorithmic fairness, resource distribution", "Core concept: the creation or bestowal of conditions in which life is soft, easy, flourishing -- from physical comfort to spiritual grace"], "semanticsTr": ["فَعَلَ (fe'ale, I. bab): yumusak, nazik, latif olmak; rahat ve refah icinde yasamak; taze ve coskun olmak (bitkiler icin); Lane's: naʿima = rahatlik, yumusaklik, bolluk icinde yasadi", "أَفْعَلَ (if'al, IV. bab): birine nimet/lutuf bahsetmek; esenlik icinde yasatmak; bereketlerle donatmak; kolaylik saglamak", "Isim bicimleri: niʿma = nimet, bereket, lutuf; naʿim = mutluluk, haz, cennet benzeri konfor; naʿam/anʿam = hayvanlar, buyukbas (pastoral kulturde birincil zenginlik ve refah gostergesi)", "Klasik (Lane's, Lisan al-Arab): kok hem maddi hem manevi esenlik kapsar -- derinin yumusakligindan ve bitkilerin tazeligininden bereketli bir yasamin konforuna. Ayrica: naʿama = devekusu (tuylerinin yumusakligi ile iliskilendirilir). Somuttan soyuta yay: fiziksel yumusaklik -> maddi kolaylik -> manevi bereket", "Modern: bahsetmek, kaynak saglamak, refah, sosyal yardimlar -- sistemik esenlik, kurumsal destek", "Geleceksel: kosullari optimize etmek, olanaklastirici altyapi sunmak -- gelisme icin kosullar yaratmanin herhangi bir bicimi (veri erisimi, algoritmik adalet, kaynak dagitimi dahil)", "Kok kavram: yasamin yumusak, kolay, bereketli oldugu kosullarin yaratilmasi veya bahsedilmesi -- fiziksel konfordan manevi lutfa kadar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. God bestows favor upon specific groups (IV form, transitive with ʿala)", "count": "~15 ayahs", "examples": [{"ref": "2:40", "arabic": "يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُوا۟ بِعَهْدِىٓ أُوفِ بِعَهْدِكُمْ وَإِيَّٰىَ فَٱرْهَبُونِ", "english": "O Children of Israel, remember My favor which I bestowed upon you, and fulfill My covenant so I fulfill your covenant, and fear Me alone", "turkish": "Ey Israilogullari, uzerinize bahsettigim nimetimi anin, ahdimi yerine getirin ki ahdinizi yerine getireyim, ve yalnizca Benden korkunuz"}, {"ref": "2:47", "arabic": "يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَنِّى فَضَّلْتُكُمْ عَلَى ٱلْعَٰلَمِينَ", "english": "O Children of Israel, remember My favor which I bestowed upon you and that I preferred you over the worlds", "turkish": "Ey Israilogullari, uzerinize bahsettigim nimetimi ve sizi alemlere ustun kildigimi anin"}]}, {"label": "B. Favor as noun (niʿma, naʿim) -- the content of the bestowal", "count": "~54 ayahs", "examples": [{"ref": "16:121", "arabic": "شَاكِرًۭا لِّأَنْعُمِهِ ۚ ٱجْتَبَىٰهُ وَهَدَىٰهُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "Grateful for His favors -- He chose him and guided him to a straight path", "turkish": "O'nun nimetlerine sukredici -- onu secti ve onu dosdogru bir yola iletti"}, {"ref": "48:2", "arabic": "لِّيَغْفِرَ لَكَ ٱللَّهُ مَا تَقَدَّمَ مِن ذَنۢبِكَ وَمَا تَأَخَّرَ وَيُتِمَّ نِعْمَتَهُۥ عَلَيْكَ وَيَهْدِيَكَ صِرَٰطًۭا مُّسْتَقِيمًۭا", "english": "That God may forgive for you what preceded of your sin and what followed, and complete His favor upon you and guide you to a straight path", "turkish": "Allah'in senin gecmis ve gelecek gunahini bagislamasi, uzerindeki nimetini tamamlamasi ve seni dosdogru bir yola iletmesi icin"}]}, {"label": "C. Intransitive usage -- favor bestowed without named object", "count": "~3 ayahs", "examples": [{"ref": "19:58", "arabic": "فَلَمَّا رَءَا ٱلْقَمَرَ بَازِغًۭا قَالَ هَٰذَا رَبِّى ۖ فَلَمَّآ أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِى رَبِّى لَأَكُونَنَّ مِنَ ٱلْقَوْمِ ٱلضَّآلِّينَ", "english": "Among those We have favored from the prophets -- from the offspring of Adam, and from those We carried with Noah", "turkish": "Allah'in nimetlendirdigi peygamberlerden -- Adem'in soyundan ve Nuh ile birlikte tasidiklarimizdan"}]}]}, "qiraat": [{"arabic": "أَنْعَمْتُ", "translit": "anʿamtu", "status": "None", "type": "Pf", "note": "Variant reading \"I bestowed favor\" (1st person) instead of \"You bestowed favor\" (2nd person) -- shifts the speaker from the supplicant addressing God to God speaking about His own act. Status unclassified.", "noteTr": "\"Sen nimet verdin\" (2. sahis) yerine \"Ben nimet verdim\" (1. sahis) varyant okumasi -- konusucu dua edenden Allah'a hitap etmek yerine Allah'in kendi eyleminden bahsetmesine kayar. Durum siniflandirilmamis.", "source": "erquran.org"}, {"arabic": "نَعَّمْتَ", "translit": "naʿʿamta", "status": "shii", "type": "Vr", "note": "Shia reading with Form II (intensive) instead of Form IV -- naʿʿamta means \"You richly/intensely bestowed ease\" rather than the causative \"You caused favor.\" The doubling in Form II intensifies the act of bestowal. This is NOT in the standard Hafs reading.", "noteTr": "IV. bab yerine II. bab (yogunlastirici) ile Sii okumasi -- naʿʿamta \"Sen yoğun/zengin esenlik bahsettin\" anlamina gelir, ettirgen \"Sen nimet kildin\" yerine. II. babtaki tef'il bahsetme eylemini yogunlastirir. Standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}, {"arabic": "مَنَنْتَ", "translit": "mananta", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing anʿamta entirely with mananta (You bestowed/granted, from m-n-n). ROOT CHANGE: n-'-m to m-n-n. Both roots share the semantic field of \"bestowing favor\" but m-n-n carries an additional nuance of \"reminding of the favor\" or \"reproaching for ingratitude.\" This is NOT in the standard Hafs reading.", "noteTr": "anʿamta'yi tamamen mananta (Sen bahsettin/lutfettin, m-n-n kokunden) ile degistiren anormal varyant. KOK DEGISIMI: n-'-m'dan m-n-n'ye. Her iki kok \"nimet bahsetme\" anlam alanini paylasmakla birlikte m-n-n, \"nimeti hatirlatma\" veya \"nankorkukle serzenis\" ek nüansini tasir. Standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "8", "refs": "1:7;1:7;4:119;5:1;5:3;8:53;31:20;35:3", "note": "Favor and otherness/exclusion -- divine favor is frequently defined against what is \"other than\" or \"without\" <- IN THIS AYAH", "noteTr": "Nimet ve baskalik/dislanma -- ilahi nimet siklikla \"disinda olan\" veya \"-siz\" karsi tanimlanir <- BU AYETTE"}, {"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "5", "refs": "1:7;4:119;7:179;25:44;39:8", "note": "Favor and straying -- those who receive divine favor vs those who stray; in 4:119 Satan promises to lead astray and alter creation <- IN THIS AYAH", "noteTr": "Nimet ve sapma -- ilahi nimeti alanlar ile sapanlar; 4:119'da Seytan saptiracagini ve yaratilisi degistirecegini vaat eder <- BU AYETTE"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "3", "refs": "1:7;16:121;48:2", "note": "Favor and path -- in all three co-occurrences, the path (sirat) is directly linked to divine favor, either as destination of favor or its context <- IN THIS AYAH", "noteTr": "Nimet ve yol -- uc birlikte geciste de yol (sirat) ilahi nimetle dogrudan baglantilidir, nimetin varacagi yer veya baglami olarak <- BU AYETTE"}], "critical": "The verb anʿamta appears here in its intransitive usage (no explicit direct object), which is attested in only 3 of its 18 occurrences as a perfect verb (1:7, 19:58, 28:17). This deliberate elision of the object maximizes the semantic scope of the favor -- it is not favor \"of X\" but favor in its totality. The Shia variant naʿʿamta (Form II) intensifies the bestowal rather than causativizing it, suggesting a theology where God's favor is an intensive outpouring rather than a causative enabling. The shawadhdh variant mananta (m-n-n) introduces a root that carries a tension: m-n-n means both \"to bestow generously\" AND \"to reproach for one's generosity\" -- if mananta were the reading, the ayah would carry an undertone of divine reminder alongside the bestowal. The 2nd-person address (anta = You) is striking: this is direct speech to God, making the ayah intensely personal -- \"You, specifically, bestowed.\"", "criticalTr": "anʿamta fiili burada gecissiz kullanimda gorulur (acik nesne yok), bu da mazi fiil olarak 18 kullanimdan yalnizca 3'unde kanitlanir (1:7, 19:58, 28:17). Nesnenin kasitli olarak hazfi nimetin anlam kapsamini azami kilar -- \"X nimeti\" degil, butunlugu icinde nimettir. Sii varyanti naʿʿamta (II. bab) bahsetmeyi ettirgen kilmak yerine yogunlastirir, Allah'in nimetinin ettirgen bir olanaklastirma degil yogun bir dokulme oldugu bir ilahiyat onerisi tasir. Sawazz varyanti mananta (m-n-n) bir gerilim tasiyan kok getirir: m-n-n hem \"comertce bahsetmek\" HEM DE \"comerligiyle serzenis etmek\" anlamina gelir -- mananta okumasi gecseydi, ayet nimetin yaninda ilahi bir hatirlatma alt tonu tasiyacakti. 2. sahis hitabi (anta = Sen) dikkat cekicidir: bu Allah'a dogrudan konusmadir ve ayeti yogun bir sekilde kisisel kilar -- \"Sen, ozellikle Sen, nimet verdin.\"", "tag": "CRITICAL", "temporal": "7C"}, {"id": 4, "arabic": "عَلَيْهِمْ", "translit": "ʿalayhim", "gloss": "upon them, on them", "glossTr": "onlarin uzerine, onlara", "userNotes": "", "root": "ع ل و ('-l-w)", "grammar": "Prepositional phrase: preposition ʿala + 3rd person masculine plural pronoun -him. Governs the genitive. Functions as the complement of anʿamta, marking the recipients of divine favor.", "grammarTr": "Edatli tamlama: ala edati + 3. sahis cogul eril zamir -him. Mecrur yonetir. anʿamta'nin tumleyicisi olarak islev gorur, ilahi nimetin alicilarini isaretler.", "semantics": ["Spatial: upon, on, over -- physical position above or upon a surface", "Directional/disadvantage: against, upon (burden) -- marks the recipient of a negative action (obligation, wrath, punishment)", "Benefactive: upon (favor bestowed upon) -- here marks the recipient of niʿma", "Core concept: superposition -- something placed above or directed toward a recipient, whether favor or burden"], "semanticsTr": ["Mekansal: uzerinde, uzerine -- bir yuzey uzerinde fiziksel konum", "Yonsel/dezavantaj: -e karsi, uzerine (yuk) -- olumsuz bir eylemin alicisini isaretler (yukumluluk, gazap, ceza)", "Yararlanma: uzerine (nimet bahsedilen) -- burada niʿma'nin alicisini isaretler", "Kok kavram: ust konumlama -- bir aliciya yonlendirilmis veya uzerine konmus bir sey, ister nimet ister yuk olsun"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": "The preposition ʿala (upon) appears twice in this ayah with contrasting semantic functions: first with anʿamta (bestowing favor UPON them) and second with al-maghdubi (wrath settling UPON them). The identical preposition carrying opposite valences (blessing vs wrath) creates a structural mirror -- the same grammatical relationship (superposition) governs both the positive and negative states. This dual function of ʿala enacts the ayah's core architecture: the path is defined by what is placed upon its travelers, whether grace or anger.", "criticalTr": "ala (uzerine) edati bu ayette zit anlamsal islevlerle iki kez kullanilir: birincisi anʿamta ile (nimet UZERLERINE bahsetmek), ikincisi al-maghdubu ile (gazap UZERLERINE yerlesme). Ayni edatin zit degerlikleri (bereket-gazap) tasimasi yapisal bir ayna olusturur -- ayni dilbilgisel iliski (ust konumlama) hem olumlu hem olumsuz halleri yonetir. ala'nin bu cift islevi ayetin cekirdek mimarisini canlandirir: yol, yolcularina neyin konulduguna gore tanimlanir -- ister lutuf ister ofke.", "temporal": "7C"}, {"id": 5, "arabic": "غَيْرِ", "translit": "ghayri", "gloss": "other than, not, excluding, different from", "glossTr": "disinda, degil, haric, -den farkli", "userNotes": "", "root": "غ ي ر (gh-y-r)", "grammar": "Genitive noun functioning as adjective (badal or na't) to alladhina, or as independent exclusion particle. The genitive case (kasra) matches the implied case of those being described. Classical grammarians debate: is ghayri a badal (substitutive apposition) from alladhina, or a sifa (adjective) of the implied antecedent?", "grammarTr": "Mecrur isim, alladhina'ya sifat (bedel veya na't) olarak islev gorur, veya bagimsiz istisnai edat olarak. Mecrur hali (kesra) tanimlanan kisilerin zimni i'rabina uyar. Klasik dilciler tartisir: ghayri, alladhina'dan bedel mi (badal), yoksa zimni merci'nin sifati mi?", "semantics": ["فَعَلَ (faʿala, I): to change, alter, transform; to be jealous, zealous; ghayra = he changed (something)", "أَفْعَلَ (afʿala, II): ghayyara = to change, to alter, to transform; to make different", "Noun: ghayr = other than, different from, not; carries the sense of absolute otherness, exclusion, alterity", "Classical (Lane's, Lisan al-Arab): ghayra also means \"jealousy, protective zeal\" (ghayra/ghira); one who is ghayur is jealous, zealously protective. The root connects alterity (being other) with emotional response to alterity (jealousy at what is other/foreign entering one's domain)", "Mughayara = difference, contrast, opposition; mughayir = different, contrary", "Modern: alternative, non-, other than -- used in legal, technical, and classificatory contexts for exclusion and distinction", "Core concept: the state of being other, different, or excluded -- encompassing change (becoming other), alterity (being other), and the emotional response to alterity (jealousy, protective zeal)"], "semanticsTr": ["فَعَلَ (fe'ale, I. bab): degismek, degistirmek, donustumek; kiskanc olmak, gayretli olmak; ghayra = degistirdi", "أَفْعَلَ (if'al, II. bab): ghayyara = degistirmek, farkli kilmak, donusturmek", "Isim: ghayr = -den baska, farkli, degil; mutlak baskalik, dislanma, otekilik anlami tasir", "Klasik (Lane's, Lisan al-Arab): ghayra ayrica \"kiskanclik, koruyucu gayret\" (ghayra/ghira) anlamina gelir; ghayur olan kiskanc, gayretli koruyan kisiye denir. Kok, otekilik (baska olmak) ile otekilige duygusal tepkiyi (kisinin alanina giren yabanciya kiskanclik) birlestirir", "Mughayara = fark, karsilasma, zitlik; mughayir = farkli, aksi", "Modern: alternatif, -siz, -den baska -- hukuki, teknik ve siniflandirma baglamlarinda dislanma ve ayrim icin kullanilir", "Kok kavram: baska, farkli veya dislanmis olma hali -- degisim (baska olma), otekilik (baska olan) ve otekilige duygusal tepki (kiskanclik, koruyucu gayret) kapsar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Exclusion/exception in theological context -- \"other than God\" or \"without right\"", "count": "~50 ayahs", "examples": [{"ref": "2:61", "arabic": "وَإِذْ قُلْتُمْ يَٰمُوسَىٰ لَن نَّصْبِرَ عَلَىٰ طَعَامٍۢ وَٰحِدٍۢ فَٱدْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ مِنۢ بَقْلِهَا وَقِثَّآئِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا ۖ قَالَ أَتَسْتَبْدِلُونَ ٱلَّذِى هُوَ أَدْنَىٰ بِٱلَّذِى هُوَ خَيْرٌ ۚ ٱهْبِطُوا۟ مِصْرًۭا فَإِنَّ لَكُم مَّا سَأَلْتُمْ ۗ وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ ۗ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلنَّبِيِّۦنَ بِغَيْرِ ٱلْحَقِّ ۗ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ", "english": "And when you said: O Musa, we cannot endure one kind of food, so call upon your Lord for us to bring forth for us from what the earth grows... They killed the prophets without right", "turkish": "Hani siz: Ey Musa, tek bir yiyecege dayanamayiz, Rabbine bizim icin dua et de yerden biten seylerden cikarsin... dediniz. Peygamberleri haksizyere olduruyorlardi"}, {"ref": "4:56", "arabic": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا سَوْفَ نُصْلِيهِمْ نَارًۭا كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَٰهُمْ جُلُودًا غَيْرَهَا لِيَذُوقُوا۟ ٱلْعَذَابَ ۗ إِنَّ ٱللَّهَ كَانَ عَزِيزًا حَكِيمًۭا", "english": "Those who disbelieve in Our signs -- We will burn them in fire; whenever their skins are exhausted, We will replace them with other skins so they may taste the punishment", "turkish": "Ayetlerimizi inkar edenler -- onlari ateste yakacagiz; derileri her pisirildiginde baska derilerle degistiririz ki azabi tatsinlar"}]}, {"label": "B. Adjectival exclusion -- \"other than X\" qualifying a noun", "count": "~34 ayahs", "examples": [{"ref": "2:230", "arabic": "فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥ", "english": "If he divorces her, she is not lawful to him thereafter until she marries a husband other than him", "turkish": "Eger onu bosarsa, ondan sonra baska bir koca ile evleninceye kadar ona helal olmaz"}, {"ref": "4:140", "arabic": "وَقَدْ نَزَّلَ عَلَيْكُمْ فِى ٱلْكِتَٰبِ أَنْ إِذَا سَمِعْتُمْ ءَايَٰتِ ٱللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا۟ مَعَهُمْ حَتَّىٰ يَخُوضُوا۟ فِى حَدِيثٍ غَيْرِهِۦ", "english": "He has sent down upon you in the Book that when you hear the signs of God being rejected and mocked, do not sit with them until they engage in a topic other than it", "turkish": "Kitap'ta size indirdi ki, Allah'in ayetlerinin inkar edilip alay edildigini duydugunuzda, baska bir konuya dalincaya kadar onlarla oturmayin"}]}, {"label": "C. Verbal form -- to change, alter (II form: ghayyara)", "count": "~5 ayahs", "examples": [{"ref": "4:119", "arabic": "وَلَأُضِلَّنَّهُمْ وَلَأُمَنِّيَنَّهُمْ وَلَءَامُرَنَّهُمْ فَلَيُبَتِّكُنَّ ءَاذَانَ ٱلْأَنْعَٰمِ وَلَءَامُرَنَّهُمْ فَلَيُغَيِّرُنَّ خَلْقَ ٱللَّهِ", "english": "And I will surely lead them astray, and arouse desires in them, and command them so they will cut the ears of cattle, and command them so they will change the creation of God", "turkish": "Onlari mutlaka saptiacagim, onlarda arzular uyandiacagim, onlara emredecegim de hayvanlarin kulaklarini kesecekler, onlara emredecegim de Allah'in yaratisini degistirecekler"}]}]}, "qiraat": [{"arabic": "غَيْرَ", "translit": "ghayra", "status": "14", "type": "CE", "note": "Reading with fatha (accusative) instead of kasra (genitive) -- this changes ghayri from an adjective of alladhina to a circumstantial accusative (hal), meaning \"while being other than those under wrath.\" The grammatical shift changes the relationship: genitive = apposition (defining who they are), accusative = circumstantial (describing their state). Root change annotation: gh-y-r to s-w-y.", "noteTr": "Kesra (mecrur) yerine fetha (mansub) ile okuma -- bu ghayri'yi alladhina'nin sifatindan hal-i mansub'a donusturur, yani \"gazaba ugrayanlardan baskasi olarak\" anlamina gelir. Dilbilgisel kayma iliskiyi degistirir: mecrur = bedel (kim olduklarini tanimlar), mansub = hal (durumlarini tasvir eder). Kok degisimi notu: gh-y-r'den s-w-y'ye.", "source": "erquran.org"}, {"arabic": "سِوَى", "translit": "siwā", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing ghayri with siwa (other than, from s-w-y). ROOT CHANGE: gh-y-r to s-w-y. Both mean \"other than\" but siwa carries the additional sense of \"equal, level, balanced\" from its root s-w-y. This is NOT in the standard Hafs reading.", "noteTr": "ghayri'yi siwa (disinda, s-w-y kokunden) ile degistiren anormal varyant. KOK DEGISIMI: gh-y-r'den s-w-y'ye. Her ikisi de \"disinda\" anlamina gelir ama siwa, s-w-y kokunden \"esit, duzgun, dengeli\" ek anlamini tasir. Standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "12", "refs": "1:7;1:7;4:119;5:77;6:119;6:140;6:144;7:53;16:25;28:50", "note": "Otherness and straying are deeply linked -- \"leading astray without knowledge\" (bighayri ʿilm) is a recurring phrase; in this ayah, ghayri separates the favored from both the wrathful and the straying <- IN THIS AYAH", "noteTr": "Otekilik ve sapma derinden baglidir -- \"bighayri ilm\" (bilgisizce saptirmak) tekrarlayan bir ifadedir; bu ayette ghayri, nimet verilenleri hem gazaplananlardan hem sapkinlardan ayirir <- BU AYETTE"}, {"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "8", "refs": "1:7;1:7;4:119;5:1;5:3;8:53;31:20;35:3", "note": "Otherness and favor -- ghayri frequently appears in contexts where divine favor is at stake: conditions \"other than\" what is forbidden, states \"other than\" ingratitude <- IN THIS AYAH", "noteTr": "Otekilik ve nimet -- ghayri siklikla ilahi nimetin soz konusu oldugu baglamlarda gorulur: yasaklanan seyin \"disinda\" olan kosullar, nankorlugun \"disinda\" olan haller <- BU AYETTE"}, {"coRoot": "gh-d-b", "coRootAr": "غ ض ب", "count": "4", "refs": "1:7;1:7;2:61;3:112", "note": "Otherness and wrath -- ghayri excludes the wrathful from the favored; in 2:61 and 3:112 \"bighayri l-haqq\" (without right) accompanies divine wrath <- IN THIS AYAH", "noteTr": "Otekilik ve gazap -- ghayri gazaplilari nimet verilenlerden dislar; 2:61 ve 3:112'de \"bighayri l-haqq\" (haksizyere) ilahi gazaba eslik eder <- BU AYETTE"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "1", "refs": "1:7", "note": "Path and otherness -- the sole co-occurrence defines the path by exclusion <- IN THIS AYAH", "noteTr": "Yol ve otekilik -- tek birlikte gecis yolu dislanma yoluyla tanimlar <- BU AYETTE"}], "critical": "ghayri is one of the most grammatically debated words in the Fatiha. Three classical positions: (1) badal (substitutive apposition) from alladhina -- \"the path of those You favored, [that is to say] other than those under wrath\"; (2) sifa (adjective) of alladhina -- \"those You favored who are other than those under wrath\"; (3) hal (circumstantial accusative, per the 14-reading variant ghayra) -- \"the path of those You favored, being other than those under wrath.\" Each parsing yields subtly different theology: badal implies the favored ARE defined by not being wrathful; sifa adds otherness as a secondary quality; hal frames it as a condition. The root gh-y-r itself carries the semantic tension between \"otherness\" and \"jealousy/zeal\" (ghayra) -- the exclusion of the wrathful may carry an undertone of protective zeal for the path's purity.", "criticalTr": "ghayri, Fatiha'daki dilbilgisel olarak en cok tartisilan sozcuklerden biridir. Uc klasik konum: (1) alladhina'dan bedel -- \"nimet verdiklerinin yolu, [yani] gazaba ugrayanlardan baskasi\"; (2) alladhina'nin sifati -- \"nimet verdigin, gazaba ugrayanlardan baska olanlar\"; (3) hal (mansub, 14-okumali ghayra varyantina gore) -- \"nimet verdiklerinin yolu, gazaba ugrayanlardan baskasi olarak.\" Her ayristirma incelikle farkli bir ilahiyat uretir: bedel, nimet verilenlerin gazaplanmamis olmaklarina GORE tanimlandigini ima eder; sifat, otekiligi ikincil bir nitelik olarak ekler; hal ise bunu bir kosul olarak cerceveler. gh-y-r kokinin kendisi \"otekilik\" ile \"kiskanclik/gayret\" (ghayra) arasinda anlamsal gerilim tasir -- gazaplananlardan dislanma, yolun safligini korumaya yonelik koruyucu bir gayret alt tonu tasiyabilir.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 6, "arabic": "ٱلْمَغْضُوبِ", "translit": "al-maghḍūbi", "gloss": "those upon whom wrath has settled, the objects of anger", "glossTr": "gazaba ugrayanlar, ofke nesneleri", "userNotes": "", "root": "غ ض ب (gh-d-b)", "grammar": "Passive participle (ism al-mafʿul) from Form I, with definite article al-. Genitive (majrur), governed by the idafa with ghayri. The passive voice conceals the agent of wrath -- it does not say \"whom God angered\" or \"whom people angered.\"", "grammarTr": "I. babdan ism-i meful, harf-i ta'rif el- ile. Mecrur, ghayri ile izafe altinda. Mechul yapi gazabin failini gizler -- \"Allah'in gazaplandirdiklarini\" veya \"insanlarin ofkelendirdigini\" demez.", "semantics": ["فَعَلَ (faʿala, I): to be angry, to be wrathful, to be furious; ghadiba ʿalayhi = he was angry with him", "Noun: ghadab = anger, wrath, fury, indignation; ghadba = a state of rage; ghadbān = angry (adjective)", "Classical (Lane's, Lisan al-Arab): ghadab is specifically a vehement, intense anger -- stronger than sukht (displeasure) and approaching ightiyaz (fury). The root carries connotations of reddening of the face, swelling with anger. Lane's also notes: ghadab can refer to the effect of anger (punishment) as much as the emotion itself. In the Quran, divine ghadab is an attribute-of-action, not an emotion.", "Passive participle: maghḍub = one upon whom wrath has descended/settled -- the state of being an object of anger, with the agent deliberately unspecified", "Classical additional (Lisan al-Arab): ghadab can also refer to a hard, red stone -- a concrete, physical manifestation of the root's sense of intense, heated solidity. This physical meaning enriches the metaphor: the wrathful state is hard, rigid, heated.", "Core concept: intense, vehement displeasure that settles upon its object -- from the emotional state to its consequences (punishment, exclusion, hardening)"], "semanticsTr": ["فَعَلَ (fe'ale, I. bab): kizygin olmak, gazaplanmak, ofkelenmek; ghadiba ʿalayhi = ona kizdi", "Isim: ghadab = ofke, gazap, siddetli kizginlik; ghadba = ofke hali; ghadban = kizygin (sifat)", "Klasik (Lane's, Lisan al-Arab): ghadab ozellikle siddetli, yogun bir ofke -- sukht'ten (hosnutsuzluk) guclu ve ightiyaz'a (hiddet) yaklasan. Kok yuzun kizarmasi, ofkeyle sismesi cagrisimlari tasir. Lane's ayrica belirtir: ghadab, duygunun kendisi kadar ofkenin etkisine (ceza) de atifta bulunabilir. Kur'an'da ilahi ghadab bir fiil sifatidir, bir duygu degil.", "Ism-i meful: maghḍub = uzerine gazap inmis/yerlesmis olan -- ofkenin nesnesi olma hali, fail kasitli olarak belirtilmemis", "Klasik ek (Lisan al-Arab): ghadab ayrica sert, kirmizi bir tasa da atifta bulunabilir -- kokun yogun, isitilmis katililik duygusunun somut, fiziksel bir tezahuru. Bu fiziksel anlam metaforu zenginlestirir: gazap hali sert, katı, isitilmistir.", "Kok kavram: nesnesine yerlesen yogun, siddetli hosnutsuzluk -- duygusal halden sonuclarina (ceza, dislanma, katilasma) kadar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Divine wrath as action/state (ghadab as gerund)", "count": "~16 ayahs", "examples": [{"ref": "2:61", "arabic": "وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ", "english": "And humiliation and poverty were stamped upon them, and they returned with wrath from God", "turkish": "Uzerlerine zillet ve meskenet vuruldu ve Allah'tan bir gazapla donduler"}, {"ref": "3:112", "arabic": "ضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ أَيْنَ مَا ثُقِفُوٓا۟ إِلَّا بِحَبْلٍۢ مِّنَ ٱللَّهِ وَحَبْلٍۢ مِّنَ ٱلنَّاسِ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ", "english": "Humiliation was stamped upon them wherever they were found, except by a rope from God and a rope from people, and they returned with wrath from God", "turkish": "Nerede bulunurlarsa bulunsunlar uzerlerine zillet vuruldu, ancak Allah'tan bir ip ve insanlardan bir ip ile, ve Allah'tan bir gazapla donduler"}]}, {"label": "B. al-maghḍub as passive participle (this ayah's unique form)", "count": "1 ayah", "examples": []}, {"label": "C. ghaḍiba as verb (God angered, became angry)", "count": "~4 ayahs", "examples": [{"ref": "5:60", "arabic": "مَن لَّعَنَهُ ٱللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ ٱلْقِرَدَةَ وَٱلْخَنَازِيرَ وَعَبَدَ ٱلطَّٰغُوتَ", "english": "Those whom God has cursed and with whom He has been angry and made among them apes and pigs and servants of idols", "turkish": "Allah'in lanetledigi ve gazap ettigi ve aralarindan maymunlar, domuzlar ve tagut kullari kildigi kimseler"}]}]}, "qiraat": [{"arabic": "الْمَغْطُوبِ", "translit": "al-maghṭūbi", "status": "None", "type": "ibdal", "note": "Variant with tha replacing dad -- a phonetic shift (ibdal) that produces a non-standard form. Status unclassified. This does not meaningfully change the semantic content.", "noteTr": "Dad yerine ta ile varyant -- standart olmayan bir form ureten sessel kayma (ibdal). Durum siniflandirilmamis. Anlamsal icerigi anlamli olarak degistirmez.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "2", "refs": "1:7;5:60", "note": "Wrath and straying paired -- in 1:7 as two distinct categories of deviation from the path; in 5:60 as consequence (God angered AND they strayed further) <- IN THIS AYAH", "noteTr": "Gazap ve sapma eslesmis -- 1:7'de yoldan sapmanin iki ayri kategorisi olarak; 5:60'da sonuc olarak (Allah gazap etti VE daha da saptilar) <- BU AYETTE"}, {"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "4", "refs": "1:7;1:7;2:61;3:112", "note": "Wrath and otherness -- in 1:7 ghayri excludes the wrathful; in 2:61 and 3:112 \"bighayri l-haqq\" (without right/justification) accompanies wrath <- IN THIS AYAH", "noteTr": "Gazap ve otekilik -- 1:7'de ghayri gazaplilari dislar; 2:61 ve 3:112'de \"bighayri l-haqq\" (haksizyere) gazaba eslik eder <- BU AYETTE"}], "critical": "al-maghḍūbi is a hapax form in the Quran -- this is the ONLY occurrence of the passive participle of gh-d-b. Elsewhere, wrath appears as a gerund (ghaḍab, 16 times) or a verb (ghaḍiba, 4 times). The choice of passive participle (one upon whom wrath has settled) rather than active (one who angers) or gerund (anger itself) is deliberate: it presents wrath as a STATE that has descended upon its objects, not as an event or emotion. The agent of wrath is concealed by the passive voice -- this is grammatically unprecedented for this root in the Quran. Who is wrathful? God? Others? The text refuses to specify, leaving the wrath as an ambient, settled condition. The physical meaning of ghadab in classical lexicons (hard, red stone) resonates with this settled, hardened state -- those under wrath are in a condition of spiritual petrification. The co-occurrence with d-l-l (straying) in 5:60 shows the two categories of 1:7 appearing together as consequences of the same story.", "criticalTr": "al-maghḍūbi Kur'an'da hapax bir formdir -- gh-d-b'nin ism-i meful biciminin TEK kullanimi budur. Baska yerlerde gazap gerund olarak (ghadab, 16 kez) veya fiil olarak (ghadiba, 4 kez) gorulur. Ism-i meful secimi (uzerine gazap yerlesmis olan), fail (ofkelenen) veya gerund (ofkenin kendisi) yerine kasitlidir: gazabi bir OLAY veya duygu degil, nesnelerine inmis bir HAL olarak sunar. Gazabin faili mechul yapi ile gizlenmistir -- bu kok icin Kur'an'da dilbilgisel bir emsal yoktur. Kim gazaplandir? Allah mi? Baskalar mi? Metin belirtmeyi reddeder, gazabi cevre kosullarinda yerlesmis bir durum olarak birakir. Klasik sozluklerde ghadab'in fiziksel anlami (sert, kirmizi tas) bu yerlesmis, katilasmis hallere rezonans yapar -- gazap altindakiler manevi bir taslasma durumundadir. d-l-l (sapma) ile 5:60'daki birlikte gecis, 1:7'nin iki kategorisinin ayni hikayenin sonuclari olarak birlikte gorunduğunu gosterir.", "tag": "CRITICAL", "temporal": "7C"}, {"id": 7, "arabic": "عَلَيْهِمْ", "translit": "ʿalayhim", "gloss": "upon them", "glossTr": "onlarin uzerine", "userNotes": "", "root": "ع ل و ('-l-w)", "grammar": "Prepositional phrase: preposition ʿala + 3rd person masculine plural pronoun -him. Second occurrence in the ayah, now marking the objects of wrath (vs first occurrence marking recipients of favor).", "grammarTr": "Edatli tamlama: ala edati + 3. sahis cogul eril zamir -him. Ayette ikinci gecisi, simdi gazabin nesnelerini isaretler (ilk geciste nimet alicilari isaretlenmisti).", "semantics": ["Same preposition as word 4, here marking the target of wrath rather than the recipient of favor -- the identical grammatical structure carrying opposite semantic valence", "Core concept: superposition of wrath upon its objects"], "semanticsTr": ["4. sozcukle ayni edat, burada nimet alicisi yerine gazabin hedefini isaretler -- ayni dilbilgisel yapi zit anlamsal deger tasir", "Kok kavram: gazabin nesnelerine ust konumlamasi"], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "عَلَيْهُمْ", "translit": "ʿalayhum", "status": "7", "type": "vhr", "note": "Canonical variant with damma on ha instead of kasra -- a dialectal phonetic difference with no semantic impact", "noteTr": "Ha uzerinde kesra yerine damme ile kanonik varyant -- anlamsal etkisi olmayan lehcesel sessel fark", "source": "erquran.org"}, {"arabic": "عَلَيْهُمُۥ", "translit": "ʿalayhumū", "status": "Irreg", "type": "vhr|madd", "note": "Irregular variant with damma and madd extension -- phonetic variation without semantic change", "noteTr": "Damme ve madd uzatmasi ile duzensiz varyant -- anlamsal degisiklik olmayan sessel farklilik", "source": "erquran.org"}, {"arabic": "عَلَيْهِمِۦ", "translit": "ʿalayhimī", "status": "14", "type": "vhr|madd", "note": "14-reading variant with kasra and madd extension", "noteTr": "Kesra ve madd uzatmasi ile 14 okumalardaki varyant", "source": "erquran.org"}], "cooccurrence": [], "critical": "The repetition of ʿalayhim in the same ayah with opposing valences (favor upon them / wrath upon them) creates a deliberate structural mirror. The preposition ala forces the same spatial metaphor for both states: something descends and settles UPON the person. The numerous phonetic variants (7 canonical, Irreg, 14-reading) for both occurrences show this word existed at a nexus of dialectal pronunciation -- the semantic content is stable across all variants, but the phonetic diversity witnesses the Quran's preservation of multiple Arabic dialects.", "criticalTr": "ʿalayhim'in ayni ayette zit degerliklerde (nimet uzerlerine / gazap uzerlerine) tekrari kasitli bir yapisal ayna olusturur. ala edati her iki durum icin ayni mekansal metaforu zorlar: bir sey insan UZERINE iner ve yerlesir. Her iki gecis icin cok sayida sessel varyant (7 kanonik, Irreg, 14-okuma) bu sozcugun lehcesel telaffuz kavsakinda var oldugunu gosterir -- anlamsal icerik tum varyantlarda sabit kalir, ancak sessel cesitlilik Kur'an'in birden fazla Arap lehcesini muhafaza ettigine taniklik eder.", "temporal": "7C"}, {"id": 8, "arabic": "وَلَا", "translit": "wa-lā", "gloss": "and not, nor", "glossTr": "ve degil, ne de", "userNotes": "", "root": "—", "grammar": "Conjunction wa + negation particle la. The wa here is ʿatf (coordination), coordinating the second exclusion (al-dallin) with the first (al-maghdubi ʿalayhim). la is a particle of absolute negation (la l-nafiya li-l-jins or la l-ʿatifa depending on parsing).", "grammarTr": "Baglac wa + olumsuzluk edati la. Buradaki wa atf (baglama) islevindedir, ikinci dislanmayi (al-dallin) birincisiyle (al-maghdubu alayhim) baglar. la mutlak olumsuzluk edati (la li-nafyi'l-jins veya la l-atifa, ayristirmaya gore).", "semantics": [], "semanticsTr": [], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "وَغَيْرَ", "translit": "wa-ghayra", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing wa-la with wa-ghayra (and other than). ROOT CHANGE: from conjunction/negation to gh-y-r. This would read: \"other than those under wrath upon them, AND other than those who stray\" -- repeating the exclusion structure rather than coordinating with a negation. NOT in the standard Hafs reading.", "noteTr": "wa-la'yi wa-ghayra (ve disinda) ile degistiren anormal varyant. KOK DEGISIMI: baglac/olumsuzluktan gh-y-r'ye. Bu okuma: \"gazap altindakilerin disinda VE sapkinlarin disinda\" olur -- olumsuzlukla baglamak yerine dislanma yapisini tekrarlar. Standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}, {"arabic": "وَغَيْرِ", "translit": "wa-ghayri", "status": "shawadhdh", "type": "Lx|CE", "note": "Anomalous variant wa-ghayri (genitive) -- same as above but with kasra matching the genitive case of the preceding ghayri. ROOT CHANGE: to gh-y-r. NOT in the standard Hafs reading.", "noteTr": "wa-ghayri (mecrur) anormal varyanti -- yukardakiyle ayni ama onceki ghayri'nin mecrur haline uyan kesra ile. KOK DEGISIMI: gh-y-r'ye. Standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}], "cooccurrence": [], "critical": "The wa in wa-la is classically analyzed as waw al-ʿatf (coordinating conjunction), linking the second negated category (al-dallin) to the first (al-maghdubi ʿalayhim). The la functions not as independent negation but as part of the coordinated exclusion: \"not X and not Y.\" The shawadhdh variants wa-ghayra/wa-ghayri replace this coordination-with-negation pattern with a repeated exclusion (ghayri... wa-ghayri), which would make the structure perfectly parallel: \"other than the wrathful... and other than the straying.\" The standard reading's use of wa-la rather than wa-ghayri introduces asymmetry: the first exclusion uses an exclusion noun (ghayri), the second uses a coordination + negation (wa-la). This asymmetry may be deliberate: the two excluded groups are structurally differentiated even in how they are excluded.", "criticalTr": "wa-la'daki wa klasik olarak waw-i atf (baglama baglacidir) olarak analiz edilir, ikinci olumsuzlanmis kategoriyi (al-dallin) birincisine (al-maghdubu alayhim) baglar. la bagimsiz olumsuzluk degil, koordineli dislanmanin bir parcasi olarak islev gorur: \"X degil ve Y de degil.\" Sawazz varyantlari wa-ghayra/wa-ghayri, bu koordinasyon-ile-olumsuzluk kalibini tekrarlanan bir dislanmayla (ghayri... wa-ghayri) degistirir, bu da yapiyi tam olarak paralel kilar: \"gazaplilarin disinda... ve sapkinlarin disinda.\" Standart okumanin wa-ghayri yerine wa-la kullanmasi asimetri getirir: ilk dislanma bir istisnai isim (ghayri) kullanir, ikincisi koordinasyon + olumsuzluk (wa-la) kullanir. Bu asimetri kasitli olabilir: iki dislanan grup, nasil dislandiklarinda bile yapisal olarak farklilastirilir."}, {"id": 9, "arabic": "ٱلضَّآلِّينَ", "translit": "aḍ-ḍāllīna", "gloss": "those who go astray, those who are lost, the wanderers", "glossTr": "sapkinlar, yolunu kaybedenler, avare gezenler", "userNotes": "", "root": "ض ل ل (d-l-l)", "grammar": "Active participle (ism al-faʿil), masculine plural, with definite article al-. Genitive (majrur) coordinated with al-maghḍūbi. The active voice contrasts with al-maghḍūbi (passive): those who stray do so actively, while those under wrath receive it passively.", "grammarTr": "Ism-i fail, cogul eril, harf-i ta'rif el- ile. Mecrur, al-maghdubu ile bagli. Etken yapi al-maghdubu (edilgen) ile karsilasir: sapanlar bunu aktif olarak yapar, gazap altindakiler ise pasif olarak alir.", "semantics": ["فَعَلَ (faʿala, I): to stray, to wander, to lose one's way, to err, to go astray; dalla ʿani l-tariq = he strayed from the path; dalla l-shay' = the thing was lost, perished", "أَفْعَلَ (afʿala, IV): adalla = to cause to stray, to lead astray, to mislead, to cause to err", "Noun: dalal/dalala = straying, error, misguidance, wandering; dalil = one who is lost; adall = more astray (comparative)", "Classical (Lane's, Lisan al-Arab): dalla also means \"to perish, to be destroyed, to be lost (as water absorbed into earth)\"; dalla l-labn fi l-ma' = the milk was lost in the water (dissolved, vanished). Also: dalla ʿanhu = he forgot it, it was lost from his memory. The root encompasses physical losing-of-way AND cognitive losing-of-knowledge AND material dissolution/perishing.", "Classical additional: dall can also mean \"gentle, soft, supple (of a branch)\" -- a meaning far from \"straying\" but attested in pre-Islamic poetry. This preserves a semantic tension: the same root that means \"to wander off-path\" also describes the gentle swaying of a branch -- movement without fixed direction can be pathological (straying) or natural (swaying).", "Modern: misinformation, systematic error, data corruption -- any deviation from a correct/intended trajectory in information systems", "Futuristic: algorithmic drift, model degradation, value misalignment -- any system that progressively deviates from its intended function or goal", "Core concept: deviation from a defined path or state -- encompassing physical wandering, cognitive error, spiritual misguidance, and material dissolution"], "semanticsTr": ["فَعَلَ (fe'ale, I. bab): sapmak, dolasmak, yolunu kaybetmek, yanilmak; dalla ʿani l-tariq = yoldan sapti; dalla l-shay' = sey kayboldu, helak oldu", "أَفْعَلَ (if'al, IV. bab): adalla = saptirmak, yoldan cikarmak, yaniltmak", "Isim: dalal/dalala = sapma, hata, sapkinlik, dolanma; dalil = kaybolmus kisi; adall = daha sapkin (mukayese)", "Klasik (Lane's, Lisan al-Arab): dalla ayrica \"helak olmak, yok olmak, kaybolmak (topraga emilen su gibi)\" anlamina gelir; dalla l-labn fi l-ma' = sut suda kayboldu (cozuldu, yok oldu). Ayrica: dalla ʿanhu = onu unuttu, hafizasindan kayboldu. Kok fiziksel yol-kaybetme VE bilissel bilgi-kaybetme VE maddi cozulme/helak icermektedir.", "Klasik ek: dall ayrica \"nazik, yumusak, esnek (dal icin)\" anlamina gelebilir -- \"sapmak\"tan uzak ama Islam oncesi siirde kanitlanmis bir anlam. Bu anlamsal bir gerilimi korur: \"yoldan sapmak\" anlamina gelen ayni kok, bir dalin nazik sallanmasini da tasvir eder -- sabit yonsuz hareket patolojik (sapma) veya dogal (sallanma) olabilir.", "Modern: dezenformasyon, sistematik hata, veri bozulmasi -- bilgi sistemlerinde dogru/hedeflenen guzergahtan herhangi bir sapma", "Geleceksel: algoritmik kayma, model bozulmasi, deger uyumsuzlugu -- hedeflenen islevinden veya amacinden giderek sapan herhangi bir sistem", "Kok kavram: tanimli bir yoldan veya halden sapma -- fiziksel dolanma, bilissel hata, manevi sapkinlik ve maddi cozulmeyi kapsar"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle (dallin/dall) -- those in the state of straying", "count": "~17 ayahs", "examples": [{"ref": "6:77", "arabic": "فَلَمَّا رَءَا ٱلْقَمَرَ بَازِغًۭا قَالَ هَٰذَا رَبِّى ۖ فَلَمَّآ أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِى رَبِّى لَأَكُونَنَّ مِنَ ٱلْقَوْمِ ٱلضَّآلِّينَ", "english": "When he saw the moon rising he said: this is my lord. But when it set he said: unless my Lord guides me, I will surely be among the people who stray", "turkish": "Ay'i dogarken goruce: Bu benim Rabbim, dedi. Battigi zaman ise: Rabbim bana hidayet etmezse mutlaka sapiklardan olurum, dedi"}, {"ref": "23:106", "arabic": "قَالُوا۟ رَبَّنَا غَلَبَتْ عَلَيْنَا شِقْوَتُنَا وَكُنَّا قَوْمًۭا ضَآلِّينَ", "english": "They will say: our Lord, our wretchedness overcame us and we were a people astray", "turkish": "Derler: Rabbimiz, bedbahtiligimiz bize galip geldi ve sapkin bir topluluk olduk"}]}, {"label": "B. Verb (dalla/yudillu) -- to stray or to cause to stray", "count": "~112 ayahs", "examples": [{"ref": "6:39", "arabic": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا صُمٌّۭ وَبُكْمٌۭ فِى ٱلظُّلُمَٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "Those who deny Our signs are deaf and mute, in darknesses. Whomever God wills He leads astray, and whomever He wills He places upon a straight path", "turkish": "Ayetlerimizi yalanlayanlar karanliklar icinde sagir ve dilsizdir. Allah kimi dilerse onu saptirir, kimi dilerse onu dosdogru bir yola koyar"}, {"ref": "28:15", "arabic": "فَوَكَزَهُۥ مُوسَىٰ فَقَضَىٰ عَلَيْهِ ۖ قَالَ هَٰذَا مِنْ عَمَلِ ٱلشَّيْطَٰنِ ۖ إِنَّهُۥ عَدُوٌّۭ مُّضِلٌّۭ مُّبِينٌۭ", "english": "Musa struck him and killed him. He said: this is from the work of Satan -- he is a clearly misleading enemy", "turkish": "Musa ona vurup oldurdu. Bu Seytanin isidir, o apaçik saptirici bir dusmandir, dedi"}]}, {"label": "C. Comparative (adall) -- more astray than", "count": "~14 ayahs", "examples": [{"ref": "7:179", "arabic": "وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًۭا مِّنَ ٱلْجِنِّ وَٱلْإِنسِ ۖ لَهُمْ قُلُوبٌۭ لَّا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌۭ لَّا يُبْصِرُونَ بِهَا وَلَهُمْ ءَاذَانٌۭ لَّا يَسْمَعُونَ بِهَآ ۚ أُو۟لَٰٓئِكَ كَٱلْأَنْعَٰمِ بَلْ هُمْ أَضَلُّ", "english": "We have created for Hell many of the jinn and humanity -- they have hearts they do not understand with, eyes they do not see with, ears they do not hear with. Those are like cattle, rather they are more astray", "turkish": "Cehenneme andolsun cin ve insten coklarini yaratmisizdir -- kalpleri var anlamaz, gozleri var gormez, kulaklari var isitmezler. Bunlar hayvanlar gibidir, hatta daha da sapiktirlar"}]}]}, "qiraat": [{"arabic": "الضَّأَلِّينَ", "translit": "aḍ-ḍaʾallīna", "status": "Irreg", "type": "hmz", "note": "Irregular variant inserting hamza -- a phonetic variation that does not change meaning. NOT in the standard Hafs reading.", "noteTr": "Hemze ekleyen duzensiz varyant -- anlami degistirmeyen sessel bir farklilik. Standart Hafs okumasinda YOKTUR.", "source": "erquran.org"}, {"arabic": "الضَّالُّونَ", "translit": "aḍ-ḍāllūna", "status": "None", "type": "CE", "note": "Variant with nominative case ending (waw-nun) instead of genitive/accusative (ya-nun) -- this would break the grammatical agreement with the genitive context. Status unclassified.", "noteTr": "Mecrur/mansub (ya-nun) yerine merfu (waw-nun) ile varyant -- bu mecrur baglam ile dilbilgisel uyumu bozar. Durum siniflandirilmamis.", "source": "erquran.org"}, {"arabic": "الضَّالِّينَ آمِينَ", "translit": "aḍ-ḍāllīna āmīna", "status": "None", "type": "+-", "note": "Variant adding amin after the final word -- incorporating the supplicatory response into the recitation itself. Status unclassified.", "noteTr": "Son sozcukten sonra amin ekleyen varyant -- duasal karsiligi tilavet icerisine dahil eder. Durum siniflandirilmamis.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "12", "refs": "1:7;1:7;4:119;5:77;6:119;6:140;6:144;7:53;16:25;28:50", "note": "Straying and otherness deeply paired -- \"leading astray without knowledge\" (bighayri ʿilm) is a major Quranic theme; straying involves entering what is \"other than\" the correct path <- IN THIS AYAH", "noteTr": "Sapma ve otekilik derinden eslesmis -- \"bighayri ilm\" (bilgisizce saptirmak) onemli bir Kur'an temasidir; sapma \"dogru yolun disina\" girmeyi icerir <- BU AYETTE"}, {"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "5", "refs": "1:7;4:119;7:179;25:44;39:8", "note": "Favor and straying as antitheses -- those who receive favor vs those who stray; in 4:119 Satan leads astray AND alters creation (double deviation from niʿma) <- IN THIS AYAH", "noteTr": "Nimet ve sapma antitez olarak -- nimet alanlar ile sapanlar; 4:119'da Seytan saptirir VE yaratilisi degistirir (niʿma'dan cift sapma) <- BU AYETTE"}, {"coRoot": "gh-d-b", "coRootAr": "غ ض ب", "count": "2", "refs": "1:7;5:60", "note": "Straying and wrath -- the two negative categories of 1:7 co-occur in 5:60 where God curses, becomes angry, AND makes them apes/pigs (wrath leads to further degradation) <- IN THIS AYAH", "noteTr": "Sapma ve gazap -- 1:7'nin iki olumsuz kategorisi 5:60'da birlikte gecer, Allah lanetler, ofkelenir VE onlari maymunlar/domuzlar kilar (gazap daha fazla bozulmaya yol acar) <- BU AYETTE"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "2", "refs": "1:7;6:39", "note": "Straying and path -- in 6:39 \"whom God wills He leads astray, whom He wills He places upon a straight path\" directly links straying with the sirat <- IN THIS AYAH", "noteTr": "Sapma ve yol -- 6:39'da \"Allah kimi dilerse saptirir, kimi dilerse dosdogru yola koyar\" sapmayi sirat ile dogrudan baglar <- BU AYETTE"}, {"coRoot": "s-b-l", "coRootAr": "س ب ل", "count": "35", "refs": "1:7;2:108;4:44;4:88;4:143;4:167;5:12;5:60;5:77;6:116", "note": "Straying and path (sabil) -- the most frequent co-occurrence for d-l-l (35 ayahs), showing straying is fundamentally defined against the path-concept. \"Dalla sawa'a l-sabil\" (strayed from the middle of the road) appears in 2:108, 5:12.", "noteTr": "Sapma ve yol (sabil) -- d-l-l icin en sik birlikte gecis (35 ayet), sapmanin temelden yol kavramina karsi tanimlandigini gosterir. \"Dalla sawa'a l-sabil\" (yolun ortasindan sapti) 2:108, 5:12'de gecmektedir."}], "critical": "al-ḍāllīna as active participle contrasts structurally with al-maghḍūbi as passive participle -- this is the ayah's central grammatical opposition. Those under wrath RECEIVE it (passive: something was done TO them), while those who stray DO it themselves (active: they perform the straying). This active-passive distinction maps to two models of failure: (1) transgression that provokes external consequence (wrath descends), and (2) internal deviation that leads to self-generated loss (straying continues on its own). The doubled lam in d-l-l (with shadda) phonetically mirrors the recursive nature of straying -- the sound redoubles on itself, enacting the compounding loss. Classical lexicons attest dalla = \"to dissolve, perish\" (milk in water) -- straying is not just wrong direction but dissolution of identity into undifferentiated space. The massive co-occurrence with s-b-l (35 ayahs) confirms that the Quran consistently defines straying against the concept of \"path\" -- without a path-concept, straying has no meaning. The variant adding amin to the end is remarkable: it incorporates the congregational response into the text itself, blurring the boundary between recitation and prayer.", "criticalTr": "al-ḍāllīna ism-i fail olarak al-maghḍūbi'nin ism-i meful olusuyla yapisal olarak karsilasir -- bu ayetin merkezi dilbilgisel zitligidir. Gazap altindakiler onu ALIR (edilgen: onlara bir sey yapildi), sapanlar ise bunu KENDILERI YAPAR (etken: sapmayi kendileri gerceklestirir). Bu etken-edilgen ayirimi iki basarisizlik modeline karsilik gelir: (1) dis sonuc provoke eden ihlal (gazap iner), ve (2) kendi kendine uretilen kayba yol acan ic sapma (sapma kendi kendine devam eder). d-l-l'deki seddeli lam sapmanin tekrarlayici dogasini sessel olarak yansitir -- ses kendi uzerine katlanir, biriken kaybi canlandirir. Klasik sozlukler dalla = \"cozulmek, helak olmak\" (sudaki sut) anlamini kanitlar -- sapma yalnizca yanlis yon degil, kimligin ayrismamis mekana cozulmesidir. s-b-l ile devasa birlikte gecis (35 ayet) Kur'an'in sapmayi tutarli olarak \"yol\" kavramina karsi tanimladigini dogrular -- bir yol kavrami olmadan sapmanin anlami yoktur. Sona amin ekleyen varyant dikkat cekicidir: cemaat karsiligini metnin icerisine dahil eder, tilavetle dua arasindaki siniri bulaniklastirir.", "tag": "CRITICAL", "temporal": "7C"}], "questions": ["The passive participle al-maghḍūbi deliberately conceals the agent of wrath -- is this concealment a universal principle (wrath has no single source) or a rhetorical device to avoid naming God as the agent of anger in a prayer addressed to God?", "Why does the Quran use sirat (45 occurrences) rather than sabil (176 occurrences) in al-Fatiha -- is the narrower, more defined connotation of sirat (bridge, corridor) essential to the prayer's function?", "The two excluded groups (al-maghḍūbi and al-ḍāllīna) are distinguished by active vs passive voice -- can a person be in both categories simultaneously, or are they mutually exclusive modes of failure?", "ghayri's root gh-y-r carries \"jealousy/protective zeal\" alongside \"otherness\" -- does the exclusion of the wrathful carry an undertone of protective zeal for the purity of the path?", "The shawadhdh variant adding amin at the end blurs the boundary between text and response -- does this suggest amin was once considered part of the text rather than a congregational addition?", "anʿamta appears without explicit object (intransitive) -- is this elision deliberate to maximize the scope of divine favor, or does the object (\"upon them\") effectively function as the object through the preposition ʿala?", "The doubled lam in d-l-l phonetically enacts compounding loss -- does the Quran's frequent use of doubled-root words (z-l-z-l, w-s-w-s, d-l-l) consistently mirror semantic content through sound?", "If the shawadhdh variant mananta (m-n-n) were accepted, the prayer would carry an undertone of divine reproach alongside bestowal -- does this tension between generosity and reminder exist in the standard reading through other means?", "The co-occurrence of gh-d-b and d-l-l in 5:60 shows both categories appearing as consequences in a single narrative -- does this undermine the neat binary of 1:7, or does it rtlik ile hatirlatma arasindaki bu gerilim standart okumada baska yollarla var midir?", "gh-d-b ve d-l-l'nin 5:60'daki birlikte gecisi her iki kategorinin tek bir anlatida sonuc olarak gorundugunudu gosterir -- bu 1:7'nin duzgun ikililigini baltalamakta midir, yoksa bunlarin turler degil asamalar oldugunu mu gostermektedir?", "Etken-edilgen zitligi (sapma = etken, gazap = edilgen) zamansal veya nedensel bir dizilime karsilik gelebilir mi: once aktif sapma, sonra sonucunun pasif olarak alinmasi (gazap)?", "Modern sistemler baglaminda al-maghḍūbi (yerlesmis sistemik hosnutsuzluk altindakiler) yapisal baskiyi, al-ḍāllīna (aktif olarak sapanlar) ise yerlesik protokollerden kasitli sapmayi temsil edebilir mi?"], "key": "1:7"}];

    /*───────────────────────────────────────────────────────────
      UTILITIES — root matching & text highlighting
    ───────────────────────────────────────────────────────────*/
    const TRANSLIT_RE = /[āīūḥṭṣğʿḍẓšṯḫḏĀĪŪḤṬṢĞḌẒŠṮḪḎ]/;

    function extractRootLetters(rootStr) {
      if (!rootStr || rootStr === "—") return [];
      return rootStr.split("(")[0].trim().split(/\s+/).filter(Boolean);
    }

    function stripDiacritics(text) {
      return text.replace(/[\u064B-\u0652\u0670]/g, "");
    }

    function normChar(ch) {
      if ("أإآٱء".includes(ch)) return "ا";
      if ("ى".includes(ch)) return "ي";
      if ("ؤ".includes(ch)) return "و";
      if ("ة".includes(ch)) return "ه";
      return ch;
    }

    function charsMatch(wc, rc) {
      const nw = normChar(wc);
      const nr = normChar(rc);
      if (nw === nr) return true;
      if (nr === "ي" && nw === "ا") return true;
      if (nr === "و" && nw === "ا") return true;
      return false;
    }

    function wordMatchesRoot(arabicWord, rootLetters) {
      if (!rootLetters.length) return false;
      const clean = stripDiacritics(arabicWord);
      let ri = 0;
      for (let i = 0; i < clean.length && ri < rootLetters.length; i++) {
        if (charsMatch(clean[i], rootLetters[ri])) ri++;
      }
      return ri === rootLetters.length;
    }

    function renderArabicHL(text, rootStr, color) {
      if (!text || text.includes("this verse")) return text;
      const rootLetters = extractRootLetters(rootStr);
      if (!rootLetters.length) return text;
      return text.split(/(\s+)/).map((token, i) => {
        if (/^\s+$/.test(token)) return token;
        if (wordMatchesRoot(token, rootLetters)) {
          return <span key={i} style={{ color, fontWeight: 700 }}>{token}</span>;
        }
        return token;
      });
    }

    function renderEnglishHL(text, color) {
      if (!text) return text;
      const parts = [];
      const re = /(\S+)\s*\(([^)]+)\)/g;
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (TRANSLIT_RE.test(m[1])) {
          if (m.index > last) parts.push(text.slice(last, m.index));
          parts.push(<strong key={m.index} style={{ color }}>{m[0]}</strong>);
          last = m.index + m[0].length;
        }
      }
      if (last < text.length) parts.push(text.slice(last));
      return parts.length ? parts : text;
    }

    /*───────────────────────────────────────────────────────────
      FILE PROCESSING — reads JSON files via File API
    ───────────────────────────────────────────────────────────*/
    function processFiles(fileList) {
      const jsonFiles = Array.from(fileList).filter(f => f.name.endsWith(".json") && !f.name.includes("-boundaries"));
      return Promise.all(jsonFiles.map(f => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              const threeMatch = f.name.match(/^(\d+)-(\d+)-(\d+)\.json$/);
              const twoMatch = f.name.match(/^(\d+)-(\d+)\.json$/);
              const oneMatch = f.name.match(/^(\d+)\.json$/);
              if (threeMatch) {
                // New format with version: surah-ayah-version
                data.key = `${data.surah}:${threeMatch[2]}-${threeMatch[3]}`;
              } else if (twoMatch) {
                // Could be new (surah-ayah) or old (ayah-version)
                if (String(data.surah) === twoMatch[1]) {
                  data.key = `${data.surah}:${twoMatch[2]}`;
                } else {
                  data.key = `${data.surah}:${twoMatch[1]}-${twoMatch[2]}`;
                }
              } else if (oneMatch) {
                // Old format: ayah only
                data.key = `${data.surah}:${oneMatch[1]}`;
              } else {
                data.key = `${data.surah}:${data.ayah}`;
              }
              resolve(data);
            } catch (err) {
              console.error(`Error parsing ${f.name}:`, err);
              resolve(null);
            }
          };
          reader.onerror = () => resolve(null);
          reader.readAsText(f);
        });
      })).then(results => {
        return results.filter(Boolean).sort((a, b) => {
          if (a.surah !== b.surah) return a.surah - b.surah;
          if (a.ayah !== b.ayah) return a.ayah - b.ayah;
          return (a.key || "").localeCompare(b.key || "");
        });
      });
    }

    function processBoundaryFiles(fileList) {
      const boundaryFiles = Array.from(fileList).filter(f => f.name.includes("-boundaries.json"));
      return Promise.all(boundaryFiles.map(f => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              resolve(data);
            } catch (err) {
              console.error(`Error parsing boundary file ${f.name}:`, err);
              resolve(null);
            }
          };
          reader.onerror = () => resolve(null);
          reader.readAsText(f);
        });
      })).then(results => results.filter(Boolean));
    }

            <button
