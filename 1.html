elevated identity of\" — the highest designation. This reading emphasizes that the divine name is not merely a label but an elevated, transcendent marker. In the modern era, ism as \"identifier\" can extend to any system of designation — including digital identity, metadata, or authentication protocols."}, {"text": "By the designation of God — the One whose raḥma is explosive in scope, the One whose raḥma is enduring in depth", "rationale": "This reading focuses on the morphological contrast between Raḥmān (fa'lān pattern — denotes temporary but overwhelming states, like 'aṭshān/thirsty, ghaḍbān/angry) and Raḥīm (fa'īl pattern — denotes permanent, inherent qualities). The tension: Raḥmān suggests mercy that surges and overflows NOW (an active state), while Raḥīm suggests mercy that is an enduring attribute. Together they create a paradox: mercy that is both a present surge and an eternal quality."}], "structure": {"beats": [{"label": "Invocation formula", "lines": [{"arabic": "بِسْمِ ٱللَّهِ", "translit": "bismi llāhi", "english": "In/By the name of God"}]}, {"label": "Divine attribute pair", "lines": [{"arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "translit": "ar-raḥmāni r-raḥīmi", "english": "the Encompassingly Merciful, the Intimately Merciful"}]}], "summary": "The Basmala is a single nominal sentence with no verb. The prepositional phrase bi-smi is a predicate or adverbial modifier whose subject is elided — the implied subject can be \"I begin,\" \"I read,\" \"all action proceeds,\" or the entire Quran itself. The construct chain bismi llāhi binds \"name\" to \"God\" in an iḍāfa (genitive construct), and the two attributes ar-Raḥmān ar-Raḥīm follow as adjectives (ṣifa) in the genitive, agreeing with Allāh. The architecture is: [Prep + Noun-iḍāfa + Adj₁ + Adj₂], where the two adjectives create an internal semantic escalation from comprehensive to intimate mercy."}, "words": [{"id": 1, "arabic": "بِسْمِ", "translit": "bismi", "gloss": "in/by the name of; by the mark/sign of; through the elevated identity of", "root": "س م و (s-m-w)", "grammar": "Prepositional phrase: bi- (preposition of instrumentality/accompaniment) + ism (noun, masculine singular, genitive due to bi-). The initial alif of ism is elided (hamzat al-waṣl drops in construct). ism is a maṣdar or noun from s-m-w meaning \"elevation, mark, name.\" The genitive construct bismi llāhi makes ism the muḍāf and Allāh the muḍāf ilayh.", "semantics": ["Root s-m-w (س م و): to be high, to rise, to be elevated, to be lofty", "[7C] فَعَا (samā, I): to be high, to rise, to tower; to aspire to; of reputation: to be exalted", "[7C] II (sammā): to name, to call by name, to designate", "[7C] V (tasammā): to be named, to bear a name, to call oneself", "[7C] Noun ism: name, designation, appellation; mark, sign (classical: related to wasm/sima — the distinguishing mark)", "[7C] Noun samā': sky, heaven, ceiling, canopy; any elevated expanse", "[7C] Lane's Lexicon: ism derives from either s-m-w (elevation — a name elevates/distinguishes its bearer) or w-s-m (mark — a name marks/identifies). Both etymologies are attested in classical grammar.", "[M] Hans Wehr: ism = name, noun (grammatical term); samā' = sky, heaven; samiy = high, exalted, sublime", "[M] Modern extension: ism as \"identifier\" — username, authentication token, digital signature; any system that distinguishes entities", "[F] Futuristic: naming as metadata — the act of classification and indexing that makes information retrievable across systems", "Core concept: elevation and distinction — a name lifts something out of anonymity and marks it as identifiable"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ism as abstract noun — name, designation, invocation", "count": "~39 ayahs", "examples": [{"ref": "49:11", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا يَسْخَرْ قَوْمٌۭ مِّن قَوْمٍ عَسَىٰٓ أَن يَكُونُوا۟ خَيْرًۭا مِّنْهُمْ وَلَا نِسَآءٌۭ مِّن نِّسَآءٍ عَسَىٰٓ أَن يَكُنَّ خَيْرًۭا مِّنْهُنَّ ۖ وَلَا تَلْمِزُوٓا۟ أَنفُسَكُمْ وَلَا تَنَابَزُوا۟ بِٱلْأَلْقَٰبِ ۖ بِئْسَ ٱلِٱسْمُ ٱلْفُسُوقُ بَعْدَ ٱلْإِيمَٰنِ ۚ وَمَن لَّمْ يَتُبْ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ", "english": "O you who believe, let not a people ridicule another people — they may be better than them. And do not insult one another, and do not call each other by offensive nicknames. Wretched is the ism (name) of disobedience after faith. And whoever does not repent — those are the wrongdoers."}, {"ref": "55:78", "arabic": "تَبَٰرَكَ ٱسْمُ رَبِّكَ ذِى ٱلْجَلَٰلِ وَٱلْإِكْرَامِ", "english": "Blessed is the ism (name) of your Lord, possessor of majesty and honor."}, {"ref": "2:31", "arabic": "وَعَلَّمَ ءَادَمَ ٱلْأَسْمَآءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى ٱلْمَلَٰٓئِكَةِ فَقَالَ أَنۢبِـُٔونِى بِأَسْمَآءِ هَٰٓؤُلَآءِ إِن كُنتُمْ صَٰدِقِينَ", "english": "And He taught Adam the asmā' (names) — all of them. Then He presented them to the angels and said: inform Me of the asmā' (names) of these, if you are truthful."}]}, {"label": "B. samā' as sky/heaven — elevated expanse", "count": "~310 ayahs", "examples": [{"ref": "17:92", "arabic": "أَوْ تُسْقِطَ ٱلسَّمَآءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفًا أَوْ تَأْتِىَ بِٱللَّهِ وَٱلْمَلَٰٓئِكَةِ قَبِيلًا", "english": "Or you cause the samā' (sky) to fall upon us in fragments, as you have claimed, or you bring God and the angels face to face."}, {"ref": "17:99", "arabic": "۞ أَوَلَمْ يَرَوْا۟ أَنَّ ٱللَّهَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ قَادِرٌ عَلَىٰٓ أَن يَخْلُقَ مِثْلَهُمْ وَجَعَلَ لَهُمْ أَجَلًۭا لَّا رَيْبَ فِيهِ فَأَبَى ٱلظَّٰلِمُونَ إِلَّا كُفُورًۭا", "english": "Have they not seen that God, who created the samāwāt (heavens) and the earth, is able to create the like of them? And He appointed for them a term about which there is no doubt. But the wrongdoers refuse all but ingratitude."}]}]}, "qiraat": [{"arabic": "بِسُمَى", "translit": "bi-sumā", "status": "shawādhdh", "type": "Lvw", "note": "Anomalous reading bi-sumā makes the root s-m-w morphologically transparent (the final wāw appears as alif maqṣūra). This form suggests \"by the elevation/loftiness of\" rather than \"by the name of\" — foregrounding the root's primary sense of height and exaltation. Not in standard Hafs reading.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "183", "refs": "1:1;17:92;17:99;17:110;18:14;18:26;18:45;2:19;2:22", "note": "Name/identity paired with divine being — the name invokes and identifies the divine ← IN THIS AYAH"}, {"coRoot": "r-h-m", "coRootAr": "ر ح م", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Name/elevation co-occurs with mercy — the divine name is characterized by mercy ← IN THIS AYAH"}], "critical": [{"cat": "GRAM", "pattern": "alif elision bi-smi not bi-ismi", "kernel": "Basmala-specific phonological rule"}, {"cat": "SEM", "pattern": "ism etymology s-m-w vs w-s-m", "kernel": "Name as elevation AND marking — dual active"}, {"cat": "FORM", "pattern": "shawadhdh bi-suma shows final waw", "kernel": "Variant makes s-m-w derivation explicit"}, {"cat": "GRAM", "pattern": "implied verb elided before bismi", "kernel": "abda'u/aqra'u/asta'inu all permitted"}, {"cat": "GRAM", "pattern": "verb absence = universal applicability", "kernel": "Formula applies to any action simultaneously"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "ٱللَّهِ", "translit": "allāhi", "gloss": "God; the Divine; the deity", "root": "أ ل ه ('-l-h)", "grammar": "Proper noun (ism 'alam), masculine, genitive (majrūr) as muḍāf ilayh in the construct bismi llāhi. The word Allāh is typically analyzed as al- (definite article) + ilāh (deity), with the hamza of ilāh elided and the lām assimilated, yielding Allāh. Others treat it as a primary proper noun not derived from ilāh.", "semantics": ["Root '-l-h (أ ل ه): to worship, to adore; to be bewildered, perplexed; to seek refuge", "[7C] فَعَلَ (aliha, I): to be bewildered, perplexed, confused; to be anxious; to seek refuge or protection (Lane's: aliha ilayhi = he betook himself to him for refuge)", "[7C] فَعَلَ (alaha, I): to worship, to serve with devotion", "[7C] تَفَعَّلَ (taʾallaha, V): to deify, to assume divine attributes, to make oneself god", "[7C] Noun ilāh: deity, god, object of worship; anything to which one turns for refuge or direction", "[7C] Lane's Lexicon: the root conveys both \"worship/devotion\" and \"bewilderment/perplexity\" — the one worshipped is the one before whom one is bewildered, lost, overwhelmed. Also: alihat al-farṣa = the foal was yearning for its mother (= deep attachment, dependent longing)", "[7C] Lisan al-Arab: ilāh is that to which hearts turn in worship, longing, or fear. The root connects worship (ʿibāda), refuge (iltijāʾ), and bewilderment (ḥayra) — all three converge in the concept of deity", "[M] Hans Wehr: Allāh = God (in Islam); ilāh = god, deity, divine being", "[F] Modern/futuristic: the concept of ilāh as \"that which commands ultimate attention and devotion\" — can extend to any ultimate concern or system of absolute authority", "Core concept: the convergence of worship, bewilderment, and refuge — the divine is simultaneously that before which one is overwhelmed, to which one turns for shelter, and which one serves with devotion"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Allāh as proper noun — agent/subject of divine action", "count": "~2704 ayahs", "examples": [{"ref": "2:159", "arabic": "إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ ٱلْبَيِّنَٰتِ وَٱلْهُدَىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِى ٱلْكِتَٰبِ ۙ أُو۟لَٰٓئِكَ يَلْعَنُهُمُ ٱللَّهُ وَيَلْعَنُهُمُ ٱللَّٰعِنُونَ", "english": "Indeed, those who conceal what We sent down of clear proofs and guidance after We made it clear for people in the Scripture — those are cursed by Allāh and cursed by the cursers."}, {"ref": "8:7", "arabic": "وَإِذْ يَعِدُكُمُ ٱللَّهُ إِحْدَى ٱلطَّآئِفَتَيْنِ أَنَّهَا لَكُمْ وَتَوَدُّونَ أَنَّ غَيْرَ ذَاتِ ٱلشَّوْكَةِ تَكُونُ لَكُمْ وَيُرِيدُ ٱللَّهُ أَن يُحِقَّ ٱلْحَقَّ بِكَلِمَٰتِهِۦ وَيَقْطَعَ دَابِرَ ٱلْكَٰفِرِينَ", "english": "And when Allāh was promising you one of the two groups — that it would be yours — and you wished that the unarmed one would be yours. But Allāh intended to establish the truth by His words and cut off the root of the disbelievers."}, {"ref": "11:6", "arabic": "۞ وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّۭ فِى كِتَٰبٍۢ مُّبِينٍۢ", "english": "And there is no creature on earth but that upon Allāh is its provision, and He knows its place of settlement and its place of storage. All is in a clear record."}]}, {"label": "B. ilāh as common noun — deity, object of worship", "count": "~147 ayahs", "examples": [{"ref": "17:110", "arabic": "قُلِ ٱدْعُوا۟ ٱللَّهَ أَوِ ٱدْعُوا۟ ٱلرَّحْمَٰنَ ۖ أَيًّۭا مَّا تَدْعُوا۟ فَلَهُ ٱلْأَسْمَآءُ ٱلْحُسْنَىٰ ۚ وَلَا تَجْهَرْ بِصَلَاتِكَ وَلَا تُخَافِتْ بِهَا وَٱبْتَغِ بَيْنَ ذَٰلِكَ سَبِيلًۭا", "english": "Say: call upon Allāh or call upon ar-Raḥmān — whichever you call, to Him belong the most beautiful asmā' (names). And do not be loud in your prayer nor silent, but seek between that a way."}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "s-m-w", "coRootAr": "س م و", "count": "183", "refs": "1:1;17:92;17:99;17:110;18:14;18:26;18:45;2:19;2:22", "note": "Divine being paired with name/elevation — God is the named, the elevated ← IN THIS AYAH"}, {"coRoot": "r-h-m", "coRootAr": "ر ح م", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Divine being paired with mercy — God's identity is inseparable from raḥma ← IN THIS AYAH"}, {"coRoot": "s-w-d", "coRootAr": "س و د", "count": "5", "refs": "1:2;2:187;3:39;35:27;39:60", "note": "Divine being co-occurs with root s-w-d (blackness/mastery/leadership) — theological tension between lordship and darkness imagery"}], "critical": [{"cat": "SEM", "pattern": "'-l-h triple core: worship bewilderment refuge", "kernel": "Deity = overwhelmed before + sheltered by + devoted to"}, {"cat": "GRAM", "pattern": "Allah from al-ilah or primary noun", "kernel": "Both etymologies valid — uniqueness vs predating category"}, {"cat": "GRAM", "pattern": "genitive as idafa second term", "kernel": "God possesses the name OR name attributes God"}, {"cat": "SEM", "pattern": "2853 occurrences — most frequent Quranic word", "kernel": "Sonic gravity of emphatic lam + deep a anchors Basmala"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "ٱلرَّحْمَٰنِ", "translit": "ar-raḥmāni", "gloss": "the Encompassingly Merciful; the Mercy-Saturated; the Overwhelmingly Compassionate", "root": "ر ح م (r-h-m)", "grammar": "Proper noun or adjective (ism ṣifa), masculine singular, genitive (majrūr) as attributive adjective (naʿt/ṣifa) following Allāh. Pattern fa'lān (فَعْلَان) — an intensive/hyperbolic form (ṣīghat al-mubālagha) denoting one who is overwhelmed by or saturated with the quality. The fa'lān pattern typically indicates temporary but intense states (cf. 'aṭshān/thirsty, ghaḍbān/angry, sakrān/drunk). Applied to God, this creates a theological paradox: a \"temporary\" pattern denoting an eternal attribute.", "semantics": ["Root r-h-m (ر ح م): mercy, compassion, womb, kinship", "[7C] فَعِلَ (raḥima, I): to have mercy on, to be compassionate toward, to show tenderness", "[7C] II (raḥḥama): to ask for mercy, to say \"God have mercy on him\"", "[7C] V (taraḥḥama): to show mercy, to be merciful (reflexive/intensive)", "[7C] Noun raḥma: mercy, compassion, tenderness, kindness; rain (as mercy from sky)", "[7C] Noun raḥim/riḥm: womb, uterus; kinship, blood ties (the bond of the womb)", "[7C] Lane's Lexicon: ar-raḥmān is a name exclusively applied to God, denoting the abundance and comprehensiveness of His mercy extending to all creatures. Distinguished from ar-raḥīm which denotes mercy specifically to believers (though this is debated).", "[7C] Lane's Lexicon (additional): raḥima also means \"he pitied, had pity on\"; raḥm = the place where the young is formed (womb) — mercy and creation are etymologically linked", "[7C] Lisan al-Arab: ar-raḥmān denotes the one whose mercy encompasses everything — al-raḥma al-ʿāmma. It cannot be applied to any being other than God. The pattern fa'lān expresses fullness and saturation with the quality.", "[M] Hans Wehr: raḥma = mercy, compassion, pity; raḥīm = merciful, compassionate; raḥmān = most gracious, most merciful (divine epithet)", "[M] Modern extension: raḥma as systemic care — institutional mercy, social safety nets, universal basic provisions; any system designed to prevent suffering", "[F] The womb (raḥim) connection: mercy is not abstract kindness but the nurturing, protective enclosure that enables growth — like a womb sustaining life", "Core concept: mercy as generative nurturing — the root links compassion to the womb, making mercy not an emotion but a creative, sustaining force"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ar-Raḥmān as divine proper name/attribute", "count": "~91 ayahs", "examples": [{"ref": "1:3", "arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "ar-Raḥmān (the Encompassingly Merciful), ar-Raḥīm (the Intimately Merciful) — repeated from the Basmala as a separate ayah, emphasizing these attributes as the first content of the surah after the opening formula."}, {"ref": "19:58", "arabic": "أُو۟لَٰٓئِكَ ٱلَّذِينَ أَنْعَمَ ٱللَّهُ عَلَيْهِم مِّنَ ٱلنَّبِيِّۦنَ مِن ذُرِّيَّةِ ءَادَمَ وَمِمَّنْ حَمَلْنَا مَعَ نُوحٍۢ وَمِن ذُرِّيَّةِ إِبْرَٰهِيمَ وَإِسْرَٰٓءِيلَ وَمِمَّنْ هَدَيْنَا وَٱجْتَبَيْنَآ ۚ إِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَٰتُ ٱلرَّحْمَٰنِ خَرُّوا۟ سُجَّدًۭا وَبُكِيًّۭا ۩", "english": "Those are the ones upon whom God bestowed favor — among the prophets from the descendants of Adam, and of those We carried with Noah, and of the descendants of Ibrahim and Isra'il, and of those We guided and chose. When the āyāt (signs) of ar-Raḥmān were recited to them, they fell in prostration and weeping."}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And rely upon the Almighty, ar-Raḥīm (the Intimately Merciful)."}]}, {"label": "B. raḥma as verbal noun/gerund — mercy as action", "count": "~114 ayahs", "examples": [{"ref": "18:16", "arabic": "وَإِذِ ٱعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا ٱللَّهَ فَأْوُۥٓا۟ إِلَى ٱلْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِۦ وَيُهَيِّئْ لَكُم مِّنْ أَمْرِكُم مِّرْفَقًۭا", "english": "And when you have withdrawn from them and what they worship other than God, then retreat to the cave. Your Lord will spread for you of His raḥma (mercy) and will facilitate for you from your affair comfort."}, {"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا", "english": "He said: this is a raḥma (mercy) from my Lord. But when the promise of my Lord comes, He will make it level — and the promise of my Lord is ever true."}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Gramm", "type": "CE", "note": "Accusative case ending (fatḥa) instead of genitive (kasra). This grammatical variant re-parses ar-Raḥmān ar-Raḥīm as accusative, possibly as ḥāl (circumstantial — \"while being the Merciful\") or as a separate exclamatory accusative (naṣb 'alā l-madḥ — \"I praise the Merciful\"), breaking it from the genitive chain of bismi llāhi. This changes the syntactic relationship: instead of attributes OF God, they become independent praise-acts.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Gramm", "type": "CE", "note": "Nominative case ending (ḍamma). This variant makes ar-Raḥmān ar-Raḥīm the subject of a nominal sentence (mubtadaʾ) with an elided predicate, or an appositional nominative (badal marfūʿ). It detaches the mercy-attributes from the genitive chain and grants them independent syntactic status — \"the Merciful, the Compassionate [is the one invoked].\"", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Mercy-root paired with divine being — God's identity defined through mercy ← IN THIS AYAH"}, {"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Mercy paired with name/elevation — mercy is the content of the divine name ← IN THIS AYAH"}, {"coRoot": "w-l-y", "coRootAr": "و ل ي", "count": "15", "refs": "2:64;2:226;2:286;7:155;8:75;9:71;18:58;19:45;28:43;33:5", "note": "Mercy co-occurs with walāya (closeness/authority/guardianship) — mercy as an expression of divine proximity and care"}], "critical": [{"cat": "FORM", "pattern": "fa'lan pattern for ar-Rahman", "kernel": "Temporary-intensity pattern for eternal attribute — paradox"}, {"cat": "SEM", "pattern": "fa'lan = transient surge applied to God", "kernel": "Mercy experienced as overwhelming active state"}, {"cat": "GRAM", "pattern": "ar-Rahman as ism 'alam not sifa", "kernel": "Cannot apply to any being other than God"}, {"cat": "SEM", "pattern": "qira'at accusative = exclamatory praise", "kernel": "Syntactic independence from genitive chain possible"}, {"cat": "SEM", "pattern": "qira'at nominative = separate declaration", "kernel": "Mercy-attributes break free as autonomous statement"}], "tag": "CRITICAL"}, {"id": 4, "arabic": "ٱلرَّحِيمِ", "translit": "ar-raḥīmi", "gloss": "the Intimately Merciful; the Mercy-Sustaining; the Enduringly Compassionate", "root": "ر ح م (r-h-m)", "grammar": "Proper noun or adjective (ism ṣifa), masculine singular, genitive (majrūr) as second attributive adjective (naʿt thānī) following Allāh and ar-Raḥmān. Pattern fa'īl (فَعِيل) — denotes a permanent, inherent quality (ṣifa dāʾima). Unlike the fa'lān of Raḥmān (which suggests intensity of state), fa'īl suggests that mercy is a constitutional, enduring attribute — something God simply IS, not something God is currently in a state of. This pattern can be applied to humans (a person can be raḥīm), unlike Raḥmān.", "semantics": ["Root r-h-m (ر ح م): [same root as word 3 — see above for full semantic range]", "[7C] fa'īl (raḥīm): one who possesses mercy as a permanent, inherent quality; enduringly compassionate", "[7C] Lane's Lexicon: ar-raḥīm denotes the one who exercises raḥma specifically, relationally, towards particular beings. Distinguished from ar-raḥmān's universal scope by its personal, directed quality.", "[7C] The fa'īl pattern (like ʿalīm/knowing, ḥakīm/wise, karīm/generous) denotes stable, constitutional attributes — things that define an entity's essential nature", "[M] Modern extension: raḥīm as \"the one who sustains care\" — ongoing support, not just an initial act of mercy but continued provision", "Core concept: mercy as permanent constitution — not a surge but an abiding quality that defines the essential nature of its bearer"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ar-Raḥīm as divine attribute", "count": "~91 ayahs", "examples": [{"ref": "2:226", "arabic": "لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍۢ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ", "english": "For those who swear to abstain from their wives, a waiting of four months. If they return — then indeed God is forgiving, raḥīm (enduringly merciful)."}, {"ref": "3:129", "arabic": "وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ", "english": "To God belongs what is in the heavens and what is on the earth. He forgives whom He wills and punishes whom He wills. And God is forgiving, raḥīm (enduringly merciful)."}]}, {"label": "B. raḥīm as human quality — compassionate person", "count": "~21 ayahs", "examples": [{"ref": "19:58", "arabic": "أُو۟لَٰٓئِكَ ٱلَّذِينَ أَنْعَمَ ٱللَّهُ عَلَيْهِم مِّنَ ٱلنَّبِيِّۦنَ مِن ذُرِّيَّةِ ءَادَمَ وَمِمَّنْ حَمَلْنَا مَعَ نُوحٍۢ وَمِن ذُرِّيَّةِ إِبْرَٰهِيمَ وَإِسْرَٰٓءِيلَ وَمِمَّنْ هَدَيْنَا وَٱجْتَبَيْنَآ ۚ إِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَٰتُ ٱلرَّحْمَٰنِ خَرُّوا۟ سُجَّدًۭا وَبُكِيًّۭا ۩", "english": "Those upon whom God bestowed favor among the prophets — from Adam's descendants, from those carried with Noah, from Ibrahim's and Isra'il's descendants, from those We guided and chose. When ar-Raḥmān's signs were recited to them, they fell in prostration and weeping."}]}]}, "qiraat": [{"arabic": "الرَّحِيمَ", "translit": "ar-raḥīma", "status": "Gramm", "type": "CE", "note": "Accusative case ending — same structural implications as the ar-Raḥmān accusative variant. Detaches ar-Raḥīm from the genitive chain, potentially as naṣb ʿalā l-madḥ (accusative of praise).", "source": "erquran.org"}, {"arabic": "الرَّحِيمْ｡ أَلْحَمْدُ", "translit": "ar-raḥīm. al-ḥamdu", "status": "Irreg", "type": "waqf", "note": "This variant pauses (waqf) on ar-raḥīm with sukūn and begins a new sentence with al-ḥamdu. This splits the Basmala from al-Fātiḥa, making them two independent textual units rather than continuous. The semantic impact: the Basmala becomes a self-contained invocation, and \"al-ḥamdu li-llāhi\" begins as a fresh declaration.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Gramm", "type": "CE", "note": "[Same as word 3 variant — accusative pair. Both attributes shift to accusative together.]", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Gramm", "type": "CE", "note": "[Same as word 3 variant — nominative pair. Both attributes shift to nominative together.]", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Enduring mercy paired with divine being ← IN THIS AYAH"}, {"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Enduring mercy paired with name/elevation ← IN THIS AYAH"}], "critical": [{"cat": "FORM", "pattern": "fa'il pattern for ar-Rahim", "kernel": "Permanent constitutional quality — mercy as essence"}, {"cat": "SEM", "pattern": "Rahman surge vs Rahim endurance", "kernel": "Active overwhelming experience AND abiding attribute"}, {"cat": "STRUCT", "pattern": "Rahman->Rahim = universal to personal", "kernel": "Narrowing arc from all-creation to specific beings"}, {"cat": "SEM", "pattern": "Rahim applies to humans unlike Rahman", "kernel": "Human mercy = character trait never total saturation"}, {"cat": "GRAM", "pattern": "qira'at variants show syntactic independence", "kernel": "Accusative nominative waqf all permit autonomous parsing"}, {"cat": "STRUCT", "pattern": "fa'lan->fa'il mirrors temporary->permanent", "kernel": "Quranic pattern: transient states yield permanent truths"}], "tag": "CRITICAL"}], "questions": ["Why does the Basmala elide the verb? What is gained by leaving the implied action unspecified — does this make the formula applicable to all possible actions simultaneously?", "The etymological dispute over ism (from s-m-w \"elevation\" vs w-s-m \"marking\") — if both are correct, does the Basmala simultaneously invoke elevation AND identification? Is a name both a mark and a lifting-up?", "The fa'lān → fa'īl progression (Raḥmān → Raḥīm): does this mirror a movement from the experiential to the ontological? Is the text saying \"you experience God's mercy as an overwhelming surge, but it IS God's permanent nature\"?", "The shawādhdh variant bi-sumā explicitly shows the s-m-w root — could the standard form bismi be deliberately ambiguous between \"name\" and \"elevation,\" while the variant resolves this ambiguity by foregrounding elevation?", "Why are the mercy-attributes placed after the divine name rather than before it? Does the sequence ism → Allāh → Raḥmān → Raḥīm create a progressive revelation: first the act of naming, then the named one, then the nature of the named one?", "The qira'at variants showing accusative (naṣb) and nominative (rafʿ) case endings for ar-Raḥmān ar-Raḥīm — do these suggest the text structurally permits the mercy-attributes to break free from the genitive construct and stand as independent declarations?", "The root r-h-m links mercy to the womb (raḥim). Does this imply that divine mercy is not abstract kindness but a generative, nurturing force — the force that creates and sustains life from within?", "Can bismi be read as a modern identifier — an authentication protocol, a digital signature, a metadata tag that marks all subsequent data as authorized by the divine system?", "The Basmala appears 114 times in the Quran (at the head of 113 surahs plus 27:30) — is its function primarily liturgical (marking the start of recitation), structural (dividing surahs), or semantic (framing all content within divine mercy)?"], "key": "1:1"}, "1:2": {"surah": 1, "ayah": 2, "arabic": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ", "transliteration": "al-ḥamdu lillāhi rabbi l-'ālamīna", "readings": [{"text": "The praise belongs to God, the nurturer of all realms of being", "rationale": "The definite article on al-ḥamdu signals comprehensiveness — not \"a praise\" but THE praise, the totality of praise as a category. lillāhi with lām of possession (isti-ḥqāq) claims all praise as God's inherent right. rabb as \"nurturer/sustainer\" (not just \"lord\") connects to the root's sense of gradual cultivation. al-'ālamīna as \"realms of being\" captures the plural of 'ālam, meaning every category of existence."}, {"text": "The gratitude is for God, master of all worlds", "rationale": "Reading ḥamd as \"gratitude\" (acknowledging received good) rather than \"praise\" (declaring excellence). lillāhi with lām of ikhtisāṣ (exclusivity) — gratitude is exclusively for God. rabb as \"master/owner\" from r-b-b's sense of possession and authority. al-'ālamīna as \"worlds\" — multiple distinct realms (physical, spiritual, unseen)."}, {"text": "The defining acknowledgement is God's — the one who raises all conscious beings", "rationale": "ḥamd as \"defining acknowledgement\" — a declaration that establishes identity through recognizing the attributes of the acknowledged. lillāhi as lām al-jins + Allāh — praise as a category belongs to the divine. rabb from r-b-b in its sense of \"raising from lower to higher state\" (Lane's: rabbā = he reared/raised). al-'ālamīna specifically as \"conscious beings\" — those capable of knowing ('ilm), since 'ālam derives from '-l-m (knowledge/perception)."}, {"text": "All systematic evaluation belongs to God, the programmer of all information systems", "rationale": "Futuristic/modern reading: ḥamd as systematic evaluation and benchmarking (modern Arabic: taḥmīd = evaluation protocol). lillāhi as attribution to the source code of existence. rabb as \"the one who programs growth\" — designing systems that develop incrementally (software versioning, biological evolution). al-'ālamīna as \"information systems\" — each 'ālam is a complete system of data and rules, from quantum fields to neural networks to digital ecosystems."}, {"text": "The praise — it is for the divine, the cultivator of all perceiving entities", "rationale": "This reading foregrounds the nominal sentence structure: al-ḥamdu is the mubtada' (subject) and lillāhi is the khabar (predicate). The dash marks the pause inherent in equational sentences — the sentence EQUATES praise with God, not just directs it. rabbi as badal (apposition) specifying which aspect of divinity receives this equation. al-'ālamīna from '-l-m with emphasis on 'alāma (sign/mark) — perceiving entities are those who recognize signs."}], "structure": {"beats": [{"label": "Declaration of praise", "lines": [{"arabic": "ٱلْحَمْدُ", "translit": "al-ḥamdu", "english": "The praise"}]}, {"label": "Attribution to divinity", "lines": [{"arabic": "لِلَّهِ", "translit": "lillāhi", "english": "belongs to God"}]}, {"label": "Appositive specification", "lines": [{"arabic": "رَبِّ ٱلْعَٰلَمِينَ", "translit": "rabbi l-'ālamīna", "english": "nurturer of the realms of being"}]}], "summary": "The ayah is a complete nominal sentence (jumla ismiyya): al-ḥamdu (definite gerund, mubtada'/subject) + lillāhi (prepositional phrase, khabar/predicate) + rabbi l-'ālamīna (appositive genitive chain, badal specifying Allāh). The definiteness of al-ḥamdu creates a universal claim — not one act of praise but the entire category. The lām preposition establishes ownership/rightful belonging. The apposition rabbi l-'ālamīna then DEFINES the God being praised: not through names or attributes abstractly, but through a RELATIONSHIP (rabb = one who nurtures) with a SCOPE (al-'ālamīna = all realms). The structure moves from abstract concept (praise) → specific recipient (God) → relational definition (nurturer of everything). Each beat narrows the claim while expanding its scope."}, "words": [{"id": 1, "arabic": "ٱلْحَمْدُ", "translit": "al-ḥamdu", "gloss": "praise, gratitude, commendation", "root": "ح م د (h-m-d)", "grammar": "Definite masdar (verbal noun) in the nominative (marfu') as mubtada' (subject of a nominal sentence). The definite article al- is for al-istighrāq (comprehensiveness) — encompassing ALL praise, not a specific instance. Form I masdar from ḥamida.", "semantics": ["[7C] فَعِلَ (ḥamida, I): to praise, to commend, to speak well of; to be pleased with; to thank, to express gratitude for received good", "فَعَّلَ (ḥammada, II): to praise repeatedly or intensely; to laud, to eulogize", "أَفْعَلَ ('aḥmada, IV): to do what is praiseworthy; to find praiseworthy; to arrive at a state deserving praise", "Lane's Lexicon: al-ḥamdu is the opposite of al-dhammu (blame). It denotes praising/commending for a quality whether that quality is acquired by choice or not (unlike shukr which is specifically for received benefit). ḥamd = acknowledging excellence that exists in the object itself, regardless of whether the praiser benefits from it", "Hans Wehr: praise, commendation, laudation; also: satisfaction, contentment (ḥamida 'an = to be satisfied with)", "Lisan al-Arab: al-ḥamdu naqīḍu al-dhamm — praise is the opposite of blame. Distinguished from madḥ: ḥamd requires genuine merit in the praised, while madḥ can be flattery. Distinguished from shukr: ḥamd can be for inherent qualities, shukr only for benefits received", "[M] Modern: evaluation, assessment, benchmarking — taḥmīd as systematic positive evaluation", "Core concept: recognizing and declaring the intrinsic excellence of something — a cognitive-verbal act that identifies merit independent of personal benefit"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Gerund as subject (ḥamd as sentence opener)", "count": "~23 ayahs", "examples": [{"ref": "6:1", "arabic": "ٱلْحَمْدُ لِلَّهِ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَجَعَلَ ٱلظُّلُمَٰتِ وَٱلنُّورَ ۖ ثُمَّ ٱلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ يَعْدِلُونَ", "english": "The praise belongs to God, who created the heavens and the earth and made the darknesses and the light — yet those who deny equate (others) with their nurturer"}, {"ref": "18:1", "arabic": "ٱلْحَمْدُ لِلَّهِ ٱلَّذِىٓ أَنزَلَ عَلَىٰ عَبْدِهِ ٱلْكِتَٰبَ وَلَمْ يَجْعَل لَّهُۥ عِوَجَا ۜ", "english": "The praise belongs to God, who sent down the scripture upon His servant and made no crookedness in it"}]}, {"label": "B. Gerund with preposition (bi-ḥamdihi — \"with/through His praise\")", "count": "~15 ayahs", "examples": [{"ref": "2:30", "arabic": "وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّى جَاعِلٌۭ فِى ٱلْأَرْضِ خَلِيفَةًۭ ۖ قَالُوٓا۟ أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ ٱلدِّمَآءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّىٓ أَعْلَمُ مَا لَا تَعْلَمُونَ", "english": "And when your nurturer said to the angels: I am placing a successor in the earth. They said: Will you place therein one who corrupts and sheds blood, while we declare glory through Your praise and sanctify You? He said: I know what you do not know."}, {"ref": "13:13", "arabic": "وَيُسَبِّحُ ٱلرَّعْدُ بِحَمْدِهِۦ وَٱلْمَلَٰٓئِكَةُ مِنْ خِيفَتِهِۦ وَيُرْسِلُ ٱلصَّوَٰعِقَ فَيُصِيبُ بِهَا مَن يَشَآءُ وَهُمْ يُجَٰدِلُونَ فِى ٱللَّهِ وَهُوَ شَدِيدُ ٱلْمِحَالِ", "english": "And the thunder declares glory through His praise, and the angels out of awe of Him; and He sends the thunderbolts striking with them whom He wills — yet they dispute about God, while He is severe in confrontation"}]}, {"label": "C. Gerund elided subject (qāla l-ḥamdu lillāhi)", "count": "~5 ayahs", "examples": [{"ref": "15:98", "arabic": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُن مِّنَ ٱلسَّٰجِدِينَ", "english": "So declare glory through the praise of your nurturer, and be among those who prostrate"}]}, {"label": "D. Proper noun (Muḥammad, Aḥmad)", "count": "~15 ayahs", "examples": [{"ref": "17:79", "arabic": "وَمِنَ ٱلَّيْلِ فَتَهَجَّدْ بِهِۦ نَافِلَةًۭ لَّكَ عَسَىٰٓ أَن يَبْعَثَكَ رَبُّكَ مَقَامًۭا مَّحْمُودًۭا", "english": "And during the night, rise with it as a voluntary (act) for you — perhaps your nurturer will raise you to a praised station"}]}]}, "qiraat": [{"arabic": "الْـحَمْدِ", "translit": "al-ḥamdi", "status": "14", "type": "CE|vhr", "note": "Genitive case (kasra) reading: al-ḥamdi. If read as genitive, the word becomes dependent on a preceding element (e.g., connected to bismillāh as genitive chain). This disrupts the standard nominative/subject reading and reframes the sentence structure entirely.", "source": "erquran.org"}, {"arabic": "الْـحَمْدَ", "translit": "al-ḥamda", "status": "Irreg", "type": "CE", "note": "Accusative case (fatḥa) reading: al-ḥamda. This would make it a direct object (mef'ūl bih), implying an elided verb (e.g., \"I establish/perform the praise for God\"). Shifts from declarative equation to active verbal performance.", "source": "erquran.org"}, {"arabic": "الرَّحِيمْ｡ أَلْحَمْدُ", "translit": "ar-raḥīm. al-ḥamdu", "status": "Irreg", "type": "waqf", "note": "Waqf variant: pausing after ar-raḥīm (end of 1:1) with hamzat al-waṣl becoming hamzat al-qaṭ' on al-ḥamdu. This makes the basmala and the ḥamd declaration two fully independent sentences, emphasizing the fresh start of 1:2 as a new declarative act.", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "Shia reading: complete syntactic restructuring from nominal to verbal sentence — \"we praise God, nurturer of...\" with first person plural verb (Form II intensive). This transforms the universal declaration into an active communal worship act. Not in the standard Hafs text.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "46", "refs": "1:2;17:111;18:1;2:267;3:144;4:131;6:1;6:45;7:43;9:112", "note": "Praise (ḥ-m-d) paired with divinity ('-l-h) — the praise-divinity nexus appears in 46 ayahs, establishing ḥamd as a defining relational act toward the divine ← IN THIS AYAH"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "27", "refs": "1:2;17:79;2:30;6:1;6:45;7:43;10:10;14:1;14:39;15:98", "note": "Praise paired with nurturing/lordship — in 27 ayahs, ḥamd connects to rabb, making the nurturer-relationship the primary context for praise ← IN THIS AYAH"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "18", "refs": "1:2;2:30;2:267;3:188;6:45;10:10;16:75;22:5;27:15;31:25", "note": "Praise paired with knowledge/worlds — the semantic connection between ḥamd and '-l-m reflects both \"worlds\" (ālamīn) and \"knowledge\" (ilm), suggesting praise is a knowing act ← IN THIS AYAH"}, {"coRoot": "s-w-d", "coRootAr": "س و د", "count": "1", "refs": "1:2", "note": "Praise paired with mastery/blackness (s-w-d) — variant-sourced: the shawādhdh reading سَيِّدِ (sayyidi) replaces رَبِّ (rabbi), linking ḥamd to s-w-d \"master/leader\" rather than r-b-b \"nurturer\" ← IN THIS AYAH (variant only)"}], "critical": [{"cat": "GRAM", "pattern": "nominative al-hamdu = ontological equation", "kernel": "Praise IS God's — not request but declaration"}, {"cat": "GRAM", "pattern": "three case variants restructure sentence", "kernel": "Nominative genitive accusative each yield different theology"}, {"cat": "SEM", "pattern": "genitive al-hamdi links to preceding basmala", "kernel": "Creates single flowing declaration from 1:1 into 1:2"}, {"cat": "SEM", "pattern": "hamd distinct from madh and shukr", "kernel": "Recognizes intrinsic merit regardless of personal gain"}, {"cat": "SEM", "pattern": "Shia nuḥammidu = verbal restructuring", "kernel": "Transforms cosmic fact into communal worship act"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "لِلَّهِ", "translit": "lillāhi", "gloss": "for/to God, belonging to God", "root": "أ ل ه ('-l-h)", "grammar": "Preposition لِ (li, for/to) + proper noun ٱللَّهِ (Allāhi) in genitive. The لِ here functions as lām al-istiḥqāq (lām of deserved right) or lām al-ikhtisāṣ (lām of exclusive belonging). The compound lillāhi serves as the khabar (predicate) of the nominal sentence.", "semantics": ["[7C] أ ل ه ('-l-h): the root denotes divinity, godhood, worship. Lane's Lexicon: 'alaha = he worshipped; 'ilāh = a deity, an object of worship; Allāh = the one true God (al + 'ilāh with assimilation). The root carries: (1) the act of seeking refuge or being bewildered/perplexed ('aliha = he was perplexed, confused, as one bewildered seeking refuge), (2) devotion and worship ('alaha = he served/worshipped), (3) elevation and hiddenness (lāha = he was high, he was hidden)", "Lane's: 'aliha ilayhi = he was frightened and fled to him for refuge. 'aliha = he became confounded/perplexed. The semantic origin may connect bewilderment → seeking refuge → worship: the one to whom all turn in bewilderment", "Hans Wehr: 'ilāh = god, deity; Allāh = God; ta'allaha = to deify, to worship; 'ulūhiyya = divinity, godhead", "Lisan al-Arab: Allāh — the name that encompasses all divine attributes. Some derive it from w-l-h (passionate love/devotion: waliha = he was passionately devoted). Others from '-l-h (refuge/worship). The name is unique — it has no plural, no gender variation, and cannot be applied to any other being", "The لِ preposition: classical functions include — (1) al-milk (possession: \"the house is li-Zayd\"), (2) al-istiḥqāq (deserved right: \"praise is li-llāh\"), (3) al-ikhtisāṣ (exclusivity), (4) al-ta'līl (causation: \"for the sake of\"), (5) al-ṣayrūra (becoming/eventual result)", "Core concept: the root '-l-h points toward an entity that is simultaneously the source of bewilderment and the refuge from it — the object of ultimate turning-to in all states of need, confusion, and devotion"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Proper noun as subject/agent (Allāhu)", "count": "~317 ayahs", "examples": [{"ref": "2:159", "arabic": "إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ ٱلْبَيِّنَٰتِ وَٱلْهُدَىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِى ٱلْكِتَٰبِ ۙ أُو۟لَٰٓئِكَ يَلْعَنُهُمُ ٱللَّهُ وَيَلْعَنُهُمُ ٱللَّٰعِنُونَ", "english": "Those who conceal what We sent down of clarifications and guidance after We made it clear to people in the scripture — those, God curses them, and the cursers curse them"}, {"ref": "8:7", "arabic": "وَإِذْ يَعِدُكُمُ ٱللَّهُ إِحْدَى ٱلطَّآئِفَتَيْنِ أَنَّهَا لَكُمْ وَتَوَدُّونَ أَنَّ غَيْرَ ذَاتِ ٱلشَّوْكَةِ تَكُونُ لَكُمْ وَيُرِيدُ ٱللَّهُ أَن يُحِقَّ ٱلْحَقَّ بِكَلِمَٰتِهِۦ وَيَقْطَعَ دَابِرَ ٱلْكَٰفِرِينَ", "english": "And when God promised you one of the two groups — that it would be yours — and you wished that the one without thorns would be yours, but God intended to establish the truth through His words and cut the root of the deniers"}]}, {"label": "B. Proper noun as prepositional object (lillāhi, billāhi, etc.)", "count": "~515 ayahs", "examples": [{"ref": "11:6", "arabic": "وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّۭ فِى كِتَٰبٍۢ مُّبِينٍۢ", "english": "There is no moving creature on earth but its sustenance is upon God, and He knows its settling place and its repository — all is in a clear record"}]}, {"label": "C. Genitive construct (modifier of another noun)", "count": "~596 ayahs", "examples": [{"ref": "18:21", "arabic": "وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوٓا۟ أَنَّ وَعْدَ ٱللَّهِ حَقٌّۭ وَأَنَّ ٱلسَّاعَةَ لَا رَيْبَ فِيهَآ إِذْ يَتَنَٰزَعُونَ بَيْنَهُمْ أَمْرَهُمْ ۖ فَقَالُوا۟ ٱبْنُوا۟ عَلَيْهِم بُنْيَٰنًۭا ۖ رَّبُّهُمْ أَعْلَمُ بِهِمْ ۚ قَالَ ٱلَّذِينَ غَلَبُوا۟ عَلَىٰٓ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِدًۭا", "english": "And thus We made (people) stumble upon them, so they would know that God's promise is truth and that the Hour has no doubt in it — when they disputed among themselves about their affair. They said: Build over them a structure. Their nurturer knows best about them. Those who prevailed over their affair said: We shall surely build over them a place of prostration."}]}]}, "qiraat": [{"arabic": "لُـلَّـٰهِ", "translit": "lullāhi", "status": "Irreg", "type": "vhr", "note": "Irregular vowel change: ḍamma on the lām preposition instead of kasra. This is a dialectal pronunciation variant that does not change meaning significantly but reflects phonological diversity in early Arabic recitation traditions.", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "Shia reading: restructures Allāh from genitive (lillāhi) to accusative (Allāha) as direct object of the verb nuḥammidu. This transforms the divine name from the recipient of an attributed quality to the direct object of an active worship verb. Not in the standard Hafs text.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "46", "refs": "1:2;17:111;18:1;2:267;3:144;4:131;6:1;6:45;7:43;9:112", "note": "Divinity ('-l-h) paired with praise (h-m-d) — the most fundamental theological pairing: the divine is defined as praiseworthy, and praise finds its proper object in the divine ← IN THIS AYAH"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "204", "refs": "1:2;17:39;18:14;18:16;18:21;18:24;18:38;18:110;19:36;19:48", "note": "Divinity ('-l-h) paired with nurturing (r-b-b) in 204 ayahs — the two names appear together more than any other divine-attribute pairing, establishing rabb as the primary relational identity of Allāh ← IN THIS AYAH"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "439", "refs": "1:2;18:21;18:26;2:10;2:22;2:26;2:60;2:75;2:77;2:80", "note": "Divinity paired with knowledge/worlds in 439 ayahs — the most frequent co-occurrence for '-l-h, establishing divine knowledge as the defining attribute of divinity ← IN THIS AYAH"}], "critical": [{"cat": "GRAM", "pattern": "li- has five classical functions", "kernel": "istihqaq ikhtisas milk ta'lil sayrura all active"}, {"cat": "SEM", "pattern": "lam al-istihqaq = inherent right", "kernel": "God deserves praise intrinsically"}, {"cat": "SEM", "pattern": "lam al-ikhtisas = exclusive belonging", "kernel": "No other can truly receive ultimate praise"}, {"cat": "SEM", "pattern": "lam al-sayrura = all praise becomes God's", "kernel": "Every merit-acknowledgment ultimately points divine"}, {"cat": "SEM", "pattern": "'-l-h root = bewilderment + praise", "kernel": "One praises what one cannot fully grasp"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "رَبِّ", "translit": "rabbi", "gloss": "nurturer, sustainer, lord, master, cultivator", "root": "ر ب ب (r-b-b)", "grammar": "Noun in genitive (majrūr) functioning as badal (apposition) to Allāhi, further specifying the identity of the one to whom praise belongs. First element of an iḍāfa (genitive construct) with al-'ālamīna. The genitive follows from its appositive relationship to the prepositional object.", "semantics": ["[7C] رَبَّ (rabba, I): to possess, to own, to be master of; to nurture, to rear, to bring up from a state of incompleteness to completion; to sustain, to maintain; to repair, to mend", "رَبَّى (rabbā, II): to nurture, to educate, to raise (a child); to cultivate (a plant); to develop incrementally", "Lane's Lexicon: ar-rabb = the owner/possessor; one who nurtures a thing from state to state until it reaches its complete condition. Applied to God: the one who brings creation from non-existence through stages to maturity. Also: ar-rabb = the master (as opposed to the slave/owned). ar-rabb with the definite article cannot be applied to any but God. Without the article, rabb can mean master, owner, guardian", "Lane's: rabba al-walad = he reared/brought up the child. rabba an-ni'ma = he nurtured the blessing (caused it to grow). rabba ad-dār = he was master/owner of the house. From this: rabbānī = one devoted to the Rabb (a divine scholar)", "Hans Wehr: rabb = lord, master; God; owner, proprietor. tarbiya = education, upbringing, rearing, breeding. murabbī = educator, tutor, pedagogue", "Lisan al-Arab: ar-rabb carries three core meanings: (1) al-mālik (owner/possessor), (2) as-sayyid al-muṭā' (obeyed master), (3) al-muṣliḥ (the one who repairs/sets right). Also: rabb = guardian who manages another's affairs. The name is never used with the article for other than God. Without the article: rabb ad-dār (house owner), rabb al-māl (property owner)", "Classical: rababtu al-qawm = I was their leader/chief. ribba = a large group/community (under one rabb). rabīb = stepchild (one being reared by a non-parent). rubba = a particle of frequency/rarity — possibly from the root sense of \"a quantity/group\"", "[M] Modern: manager, administrator of a system; programming: the root process that governs child processes; educator who develops potential through stages", "Core concept: gradual, stage-by-stage cultivation from incompleteness to fulfillment — an authority that simultaneously owns, manages, and develops"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Noun with pronominal suffix (rabbuka, rabbunā, rabbī, etc.)", "count": "~700+ ayahs", "examples": [{"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا", "english": "He said: This is a mercy from my nurturer. When the promise of my nurturer comes, He will make it leveled ruin — and the promise of my nurturer has ever been truth."}, {"ref": "7:89", "arabic": "قَدِ ٱفْتَرَيْنَا عَلَى ٱللَّهِ كَذِبًا إِنْ عُدْنَا فِى مِلَّتِكُم بَعْدَ إِذْ نَجَّىٰنَا ٱللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَىْءٍ عِلْمًا ۚ عَلَى ٱللَّهِ تَوَكَّلْنَا ۚ رَبَّنَا ٱفْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِٱلْحَقِّ وَأَنتَ خَيْرُ ٱلْفَٰتِحِينَ", "english": "We would have fabricated against God a lie if we returned to your creed after God rescued us from it. It is not for us to return to it unless God our nurturer wills. Our nurturer encompasses all things in knowledge. Upon God we rely. Our nurturer, decide between us and our people with truth, and You are the best of deciders."}]}, {"label": "B. Noun as vocative (yā rabbī, rabbanā)", "count": "~136 ayahs", "examples": [{"ref": "5:114", "arabic": "قَالَ عِيسَى ٱبْنُ مَرْيَمَ ٱللَّهُمَّ رَبَّنَآ أَنزِلْ عَلَيْنَا مَآئِدَةًۭ مِّنَ ٱلسَّمَآءِ تَكُونُ لَنَا عِيدًۭا لِّأَوَّلِنَا وَءَاخِرِنَا وَءَايَةًۭ مِّنكَ ۖ وَٱرْزُقْنَا وَأَنتَ خَيْرُ ٱلرَّٰزِقِينَ", "english": "Jesus son of Mary said: O God, our nurturer, send down upon us a table from the sky — let it be a festival for the first of us and the last of us, and a sign from You. Provide for us, and You are the best of providers."}]}, {"label": "C. Noun in construct with al-'ālamīna", "count": "~42 ayahs", "examples": [{"ref": "6:71", "arabic": "قُلْ أَنَدْعُوا۟ مِن دُونِ ٱللَّهِ مَا لَا يَنفَعُنَا وَلَا يَضُرُّنَا وَنُرَدُّ عَلَىٰٓ أَعْقَابِنَا بَعْدَ إِذْ هَدَىٰنَا ٱللَّهُ كَٱلَّذِى ٱسْتَهْوَتْهُ ٱلشَّيَٰطِينُ فِى ٱلْأَرْضِ حَيْرَانَ لَهُۥٓ أَصْحَٰبٌۭ يَدْعُونَهُۥٓ إِلَى ٱلْهُدَى ٱئْتِنَا ۗ قُلْ إِنَّ هُدَى ٱللَّهِ هُوَ ٱلْهُدَىٰ ۖ وَأُمِرْنَا لِنُسْلِمَ لِرَبِّ ٱلْعَٰلَمِينَ", "english": "Say: Shall we call upon, instead of God, what neither benefits us nor harms us, and be turned back on our heels after God guided us — like one whom the devils have lured in the earth, bewildered, while his companions call him to guidance: Come to us? Say: God's guidance is THE guidance, and we have been commanded to submit to the nurturer of the realms of being."}]}]}, "qiraat": [{"arabic": "رَبَّ", "translit": "rabba", "status": "Irreg", "type": "CE", "note": "Accusative reading (fatḥa): makes rabb a direct object or specification (naṣb), which could mean \"I praise God AS the nurturer\" — transforming the apposition into a state description. This is paired with the ROOT CHANGE to s-w-d (see variant below). Not in the standard Hafs text.", "source": "erquran.org"}, {"arabic": "رَبُّ", "translit": "rabbu", "status": "Irreg", "type": "CE", "note": "Nominative reading (ḍamma): makes rabb a separate subject or predicate. This could restructure the ayah as two sentences: \"The praise belongs to God\" + \"The nurturer of the realms is...\" — splitting the unified declaration. Paired with ROOT CHANGE to s-w-d. Not in standard Hafs text.", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "Shia reading: rabb becomes mansūb (accusative) as a qualifier (ḥāl or badal) of Allāha, the direct object. \"We praise God, the nurturer of the realms.\" This maintains the appositive relationship but within a verbal, not nominal, framework. Not in standard Hafs text.", "source": "erquran.org"}, {"arabic": "سَيِّدِ", "translit": "sayyidi", "status": "shawādhdh", "type": "Lx", "note": "Anomalous lexical substitution: sayyidi (master, chief, leader) from root s-w-d replaces rabbi (nurturer) from root r-b-b. This variant shifts the divine epithet from \"nurturer who cultivates through stages\" to \"master/chief who holds supreme rank.\" ROOT CHANGE: r-b-b → s-w-d. The variant root s-w-d carries meanings of: mastery, leadership, being foremost; also blackness, darkness (see s-w-d root analysis). sayyid = one who holds authority through status/rank rather than through nurturing relationship. Not in standard Hafs text — anomalous reading with weak transmission.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "204", "refs": "1:2;17:39;18:14;18:16;18:21;18:24;18:38;18:110;19:36;19:48", "note": "Nurturing (r-b-b) paired with divinity ('-l-h) in 204 ayahs — the most frequent pairing for rabb, establishing the divine nurturer as the primary way God relates to creation ← IN THIS AYAH"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "136", "refs": "1:2;17:12;17:25;17:54;17:55;17:84;17:85;17:102;18:19;18:21", "note": "Nurturing paired with knowledge/worlds in 136 ayahs — rabb + '-l-m establishes that the nurturer's authority is grounded in knowledge: \"Your nurturer knows best\" (rabbuka a'lamu) is a recurring formula ← IN THIS AYAH"}, {"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "27", "refs": "1:2;17:79;2:30;6:1;6:45;7:43;10:10;14:1;14:39;15:98", "note": "Nurturing paired with praise in 27 ayahs — praise is consistently directed to the nurturer aspect of divinity, not abstract godhood ← IN THIS AYAH"}, {"coRoot": "q-w-l", "coRootAr": "ق و ل", "count": "261", "refs": "2:26;2:30;2:61;2:68;2:69;2:70;2:76;2:124;2:126;2:131", "note": "Nurturing paired with speech (q-w-l) in 261 ayahs — the nurturer is consistently the one spoken to and about: \"they said: our nurturer\" (qālū rabbanā) is a core Quranic speech act"}, {"coRoot": "s-w-d", "coRootAr": "س و د", "count": "1", "refs": "1:2", "note": "Nurturing (r-b-b) paired with mastery (s-w-d) only in 1:2 via shawādhdh variant — the anomalous reading سَيِّدِ (sayyidi) replaces رَبِّ (rabbi), revealing a tension between \"nurturer\" and \"master\" as descriptions of divine authority ← IN THIS AYAH (variant only)"}], "critical": [{"cat": "GRAM", "pattern": "rabb as badal to Allah not conjunction", "kernel": "Nurturer IS the definition not secondary attribute"}, {"cat": "SEM", "pattern": "tarbiya = primary divine attribute in opening", "kernel": "Before mercy sovereignty guidance — nurturing first"}, {"cat": "SEM", "pattern": "shawadhdh sayyidi (s-w-d) vs rabbi", "kernel": "Rank-authority vs developmental-authority — text chose rabb"}, {"cat": "SEM", "pattern": "r-b-b includes repairing/mending", "kernel": "Nurturer also restores what is broken"}, {"cat": "GRAM", "pattern": "doubled root r-b-b suggests intensity", "kernel": "Repetition in nurturing process — sustained cultivation"}], "tag": "CRITICAL"}, {"id": 4, "arabic": "ٱلْعَٰلَمِينَ", "translit": "al-'ālamīna", "gloss": "the realms of being, the worlds, all conscious beings", "root": "ع ل م ('-l-m)", "grammar": "Definite noun in genitive (majrūr) as the second element of iḍāfa (genitive construct) with rabb. Sound masculine plural form (-īna in genitive). The plural of 'ālam (world/realm), using the sound masculine plural reserved for conscious beings — suggesting the \"worlds\" are not mere spaces but entities with awareness.", "semantics": ["[7C] عَلِمَ ('alima, I): to know, to have knowledge of, to be aware of, to perceive, to recognize; to learn; to be certain about", "عَلَّمَ ('allama, II): to teach, to instruct, to inform, to make known; to mark, to stamp, to brand", "أَعْلَمَ ('a'lama, IV): to notify, to inform, to announce; to mark with a sign", "تَعَلَّمَ (ta'allama, V): to learn, to study, to acquire knowledge", "Lane's Lexicon: 'ālam = a world, a realm, a category of creation. The plural al-'ālamūna/al-'ālamīna denotes \"all kinds of created beings\" — humans, jinn, angels, animals (classified by category). Some say: 'ālam is everything by which the Rabb is known ('ulima bihi ar-rabb), i.e., every created thing is a sign pointing to its creator. From this: 'ālam = a sign-system, a field of knowability", "Lane's: 'ilm = knowledge, science, perception. 'alāma = mark, sign, indicator, landmark. 'ālim = one who knows. 'allāma = extremely learned. ma'lūm = known, determined, fixed. 'alam = flag, banner, distinctive mark", "Hans Wehr: 'ālam = world, universe; 'ilm = knowledge, learning, science; 'alāma = sign, mark, symptom, characteristic; i'lām = notification, information, media (modern usage)", "Lisan al-Arab: al-'ālam — derived from 'alāma (sign): everything in existence is a sign of its maker. Hence 'ālam = a domain of signs. The plural al-'ālamūna uses the sound masculine plural form, which in Arabic is reserved for rational/conscious beings — this implies each 'ālam is not a mere container but a conscious entity or a collective of conscious beings", "[M] Modern: information system, data environment, simulation, virtual world; i'lām = media, information dissemination; 'ālam raqamī = digital world", "[F] Futuristic: each 'ālam as a complete information ecosystem — biological worlds, quantum fields, digital environments, AI systems — all domains where pattern recognition and sign-processing occur", "Core concept: the root '-l-m unifies knowledge, signs, and worlds — a 'ālam is a domain of knowability, and al-'ālamīna are all domains through which reality can be known"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Abstract noun (knowledge contexts: 'ilm, 'alāmāt)", "count": "~78 ayahs", "examples": [{"ref": "2:197", "arabic": "ٱلْحَجُّ أَشْهُرٌۭ مَّعْلُومَٰتٌۭ ۚ فَمَن فَرَضَ فِيهِنَّ ٱلْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِى ٱلْحَجِّ ۗ وَمَا تَفْعَلُوا۟ مِنْ خَيْرٍۢ يَعْلَمْهُ ٱللَّهُ ۗ وَتَزَوَّدُوا۟ فَإِنَّ خَيْرَ ٱلزَّادِ ٱلتَّقْوَىٰ ۚ وَٱتَّقُونِ يَٰٓأُو۟لِى ٱلْأَلْبَٰبِ", "english": "The pilgrimage is known months. Whoever undertakes the pilgrimage in them: no sexual intimacy, no transgression, no disputing during the pilgrimage. Whatever good you do, God knows it. Take provision, for the best provision is guarding (against harm). And guard against Me, O possessors of cores."}, {"ref": "16:16", "arabic": "وَعَلَٰمَٰتٍۢ ۚ وَبِٱلنَّجْمِ هُمْ يَهْتَدُونَ", "english": "And landmarks — and by the star they find their way."}]}, {"label": "B. Verb form IV — to make known ('a'lama)", "count": "~334 ayahs", "examples": [{"ref": "18:21", "arabic": "وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوٓا۟ أَنَّ وَعْدَ ٱللَّهِ حَقٌّۭ وَأَنَّ ٱلسَّاعَةَ لَا رَيْبَ فِيهَآ إِذْ يَتَنَٰزَعُونَ بَيْنَهُمْ أَمْرَهُمْ ۖ فَقَالُوا۟ ٱبْنُوا۟ عَلَيْهِم بُنْيَٰنًۭا ۖ رَّبُّهُمْ أَعْلَمُ بِهِمْ ۚ قَالَ ٱلَّذِينَ غَلَبُوا۟ عَلَىٰٓ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِدًۭا", "english": "And thus We made them stumble upon them, so they would know that God's promise is truth and that the Hour has no doubt in it."}, {"ref": "18:26", "arabic": "قُلِ ٱللَّهُ أَعْلَمُ بِمَا لَبِثُوا۟ ۖ لَهُۥ غَيْبُ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ ۖ أَبْصِرْ بِهِۦ وَأَسْمِعْ ۚ مَا لَهُم مِّن دُونِهِۦ مِن وَلِىٍّۢ وَلَا يُشْرِكُ فِى حُكْمِهِۦٓ أَحَدًۭا", "english": "Say: God knows best how long they remained. His is the unseen of the heavens and the earth. How seeing and hearing is He! They have no guardian besides Him, and He shares His judgment with no one."}]}, {"label": "C. Adjective qualitative ('alīm — all-knowing)", "count": "~107 ayahs", "examples": [{"ref": "2:267", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوٓا۟ أَنفِقُوا۟ مِن طَيِّبَٰتِ مَا كَسَبْتُمْ وَمِمَّآ أَخْرَجْنَا لَكُم مِّنَ ٱلْأَرْضِ ۖ وَلَا تَيَمَّمُوا۟ ٱلْخَبِيثَ مِنْهُ تُنفِقُونَ وَلَسْتُم بِـَٔاخِذِيهِ إِلَّآ أَن تُغْمِضُوا۟ فِيهِ ۚ وَٱعْلَمُوٓا۟ أَنَّ ٱللَّهَ غَنِىٌّ حَمِيدٌ", "english": "O those who trust: spend from the good of what you earned and from what We brought out for you from the earth. Do not aim for the corrupt to spend, while you would not take it yourselves except with eyes closed. And know that God is self-sufficient, praiseworthy."}]}]}, "qiraat": [{"arabic": "الْعَأْلَمِينَ", "translit": "al-'a'lamīna", "status": "Irreg", "type": "hmz", "note": "Irregular variant with explicit hamza insertion: al-'a'lamīna. This spelling makes the hemze visible in the script, possibly reflecting a dialectal pronunciation where the hamza was more prominently articulated. No semantic change, but the graphic representation emphasizes the '-l-m root structure.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "439", "refs": "1:2;18:21;18:26;2:10;2:22;2:26;2:60;2:75;2:77;2:80", "note": "Knowledge/worlds ('-l-m) paired with divinity ('-l-h) in 439 ayahs — the single most frequent co-occurrence for both roots, establishing that divine identity and knowledge are inseparable concepts in the Quran ← IN THIS AYAH"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "136", "refs": "1:2;17:12;17:25;17:54;17:55;17:84;17:85;17:102;18:19;18:21", "note": "Knowledge/worlds paired with nurturing in 136 ayahs — \"your nurturer knows best\" (rabbuka a'lamu) recurs as a formula: the nurturer's authority derives from comprehensive knowledge ← IN THIS AYAH"}, {"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "18", "refs": "1:2;2:30;2:267;3:188;6:45;10:10;16:75;22:5;27:15;31:25", "note": "Knowledge/worlds paired with praise in 18 ayahs — knowing and praising are linked: in 2:30 the angels praise (bi-ḥamdika) while claiming knowledge, but God says \"I know what you do not know\" ← IN THIS AYAH"}], "critical": [{"cat": "GRAM", "pattern": "sound masculine plural for 'alamin", "kernel": "Form reserved for conscious beings — worlds have awareness"}, {"cat": "SEM", "pattern": "'alam = domain of knowability/signs", "kernel": "Each world is a sign-system not mere container"}, {"cat": "SEM", "pattern": "'alamin = all worlds AND all sign-systems", "kernel": "Biological mathematical linguistic digital — all domains"}, {"cat": "GRAM", "pattern": "definite al- = comprehensive totality", "kernel": "Not some worlds but THE totality of realms"}, {"cat": "INTER", "pattern": "Lane: 'alam from 'alama = sign", "kernel": "Everything in existence is a sign of its maker"}], "tag": "CRITICAL"}], "questions": ["Why does the Quran use the sound masculine plural al-'ālamīna (reserved for conscious beings) rather than the broken plural 'awālim (which would denote mere spaces/locations)? Does this imply every \"world\" possesses some form of consciousness or agency?", "The root '-l-m connects \"worlds\" and \"knowledge\" — does al-'ālamīna mean \"the worlds\" or \"the sign-systems\" or both simultaneously? If each 'ālam is a domain of knowability, what defines the boundary between one 'ālam and another?", "The three case variants of al-ḥamdu (nominative, genitive, accusative) each restructure the relationship between the basmala (1:1) and the ḥamd declaration (1:2). Does the genitive reading (al-ḥamdi) make 1:1-1:2 a single flowing phrase, and if so, how does this change the theological claim?", "The shawādhdh variant سَيِّدِ (sayyidi) replacing رَبِّ (rabbi) reveals a tension between developmental authority (rabb: one who nurtures through stages) and hierarchical authority (sayyid: one who holds rank). Why did the standard reading choose rabb? What is lost if sayyid were the reading?", "In 2:30, the angels declare \"we praise (nuḥammidu) through Your praise (bi-ḥamdika) and sanctify You\" while God responds \"I know what you do not know.\" Does this juxtaposition suggest that praise without full knowledge is incomplete — that true ḥamd requires 'ilm?", "The co-occurrence of ḥ-m-d with '-l-h appears in 46 ayahs, while ḥ-m-d with r-b-b appears in 27 ayahs. 1:2 is one of the rare ayahs containing all three. Does this triangulation (praise + divinity + nurturing) appear elsewhere, and what does the triple presence signal?", "Lane's Lexicon traces '-l-h to \"bewilderment\" ('aliha = he was perplexed) and \"seeking refuge.\" If the being to whom praise is directed is simultaneously the source of bewilderment and the refuge from it, how does this tension shape the nature of ḥamd?", "The Shia reading nuḥammidu llāha rabba transforms the nominal sentence into a verbal one, shifting from ontological declaration (\"praise IS God's\") to performative act (\"WE praise God\"). Does this reflect a fundamentally different theology of ḥamd — one centered on communal action rather than cosmic fact?", "If rabb means \"one who brings from incompleteness to completion through stages,\" does rabb al-'ālamīna imply that the worlds themselves are INCOMPLETE — that the nurturing is ongoing, not finished? What are the implications for the nature of creation as process rather than event?", "The definite article al- on both al-ḥamdu and al-'ālamīna creates a comprehensive frame: THE totality of praise belongs to the nurturer of THE totality of realms. Is the definiteness itself the theological claim — that there is nothing outside this equation?"], "key": "1:2"}, "1:3": {"surah": 1, "ayah": 3, "arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "transliteration": "ar-raḥmāni r-raḥīmi", "readings": [{"text": "The Intensely Merciful, the Continuously Merciful — two distinct modes of mercy: overwhelming and sustaining", "rationale": "ar-Raḥmān as fa'lān intensive denotes mercy in its maximal, overwhelming aspect; ar-Raḥīm as fa'īl denotes continuous, recurring mercy — the two forms together present mercy as both boundless in scope and persistent in application"}, {"text": "The One Whose Mercy Encompasses All, the One Whose Mercy Is Specifically Directed — universal versus particular mercy", "rationale": "ar-Raḥmān encompasses all creation indiscriminately (the womb-like enveloping of all existence); ar-Raḥīm targets specific recipients — those who respond, who are receptive. The distinction is between ontological mercy (existence itself) and relational mercy (guidance, care)"}, {"text": "The Source of Tenderness, the Perpetually Tender — from the womb (raḥm) as the primal locus of nurture", "rationale": "The root r-ḥ-m centers on the womb (raḥm/raḥim), the organ of shelter and nourishment before birth. ar-Raḥmān = the one whose womb-nature is overwhelming; ar-Raḥīm = the one whose womb-nature is abiding. This reading foregrounds biological, pre-conscious care rather than juridical or transactional mercy"}, {"text": "The Boundlessly Compassionate, the Precisely Compassionate — cosmic scale versus intimate scale", "rationale": "ar-Raḥmān operates at cosmic scale: sustaining galaxies, ecosystems, physical laws that allow life; ar-Raḥīm operates at intimate scale: individual guidance, personal provision, emotional care. Modern reading: ar-Raḥmān = the systemic mercy embedded in natural laws and universal constants; ar-Raḥīm = the adaptive, responsive mercy that meets each being at its specific need"}, {"text": "The Provider-Sustainer, the Razzāq in Disguise — reading through the shawādhdh variant الرَّزَّاقِ (ar-razzāqi)", "rationale": "The shawādhdh reading replaces ar-Raḥmān with ar-Razzāq (the Supreme Provider), collapsing mercy into provision. This variant suggests that raḥma and rizq are not separate attributes but facets of one reality: to be merciful IS to provide, to provide IS to show mercy. The standard text preserves both dimensions; the variant collapses them into pure provision"}], "structure": {"beats": [{"label": "Divine mercy attributes", "lines": [{"arabic": "ٱلرَّحْمَٰنِ", "translit": "ar-raḥmāni", "english": "The Intensely Merciful"}, {"arabic": "ٱلرَّحِيمِ", "translit": "ar-raḥīmi", "english": "The Continuously Merciful"}]}], "summary": "Two definite adjectives in the genitive case, functioning as attributes (na't) of Allāh in 1:2, or as a new predicate continuing the ḥamd structure. The pairing creates a semantic envelope: ar-Raḥmān (fa'lān pattern — intensity, fullness) followed by ar-Raḥīm (fa'īl pattern — constancy, habituality). Both derive from the same root r-ḥ-m, yet the morphological difference produces a complementary pair: one denotes the quality at its peak, the other denotes the quality as enduring trait. The genitive case (kasra ending) links them syntactically to rabb al-'ālamīn in 1:2, forming a chain of divine descriptors: Lord of all worlds — the Intensely Merciful — the Continuously Merciful."}, "words": [{"id": 1, "arabic": "ٱلرَّحْمَٰنِ", "translit": "ar-raḥmāni", "gloss": "the Intensely Merciful, the Overwhelmingly Compassionate", "root": "ر ح م (r-ḥ-m)", "grammar": "Definite adjective (ism ṣifa) on the fa'lān (فَعْلَان) intensive pattern, genitive case (majrūr) as attribute (na't) of Allāh or appositional to rabb. The fa'lān pattern denotes a quality at its maximum intensity — overflowing, overwhelming. Used almost exclusively for God in the Quran (occurs 57 times as ar-Raḥmān). The alif-nūn ending makes it morphologically distinct from standard adjectives.", "semantics": ["فَعَلَ (raḥima, I): to have mercy, to show compassion, to be tender toward; to pity; said of God and humans", "فَعْلَان (fa'lān intensive): raḥmān — intensely/overwhelmingly merciful; denotes the quality at its peak and fullness", "رَحِمَ (raḥima): the womb; the organ of gestation and nurture — the etymological source of the entire semantic field", "رَحْمَة (raḥma): mercy, compassion, tenderness; also: rain (as divine mercy descending); also: prophethood/revelation (described as raḥma in the Quran)", "أَرْحَام (arḥām, plural): wombs; kinship ties (silat ar-raḥim — maintaining family bonds, literally \"connecting the womb\")", "Classical lexicon (Lane's): raḥima also carries the sense of \"softness, gentleness of heart\" — raqqat al-qalb; the root implies an involuntary, visceral response to another's suffering, not a deliberate decision", "Classical lexicon (Lisan al-Arab): ar-raḥmān is a name exclusive to God (lā yusammā bihi ghayr Allāh) — it denotes mercy so vast it cannot be attributed to any creature; some grammarians consider it a proper noun, not merely an adjective", "Classical lexicon (Hans Wehr): raḥima = to have mercy upon, to pity, to spare; raḥmān = compassionate, merciful (of God); raḥīm = merciful, compassionate", "[M] Modern extension: systemic compassion — the mercy embedded in natural laws, ecosystems, biological processes that sustain life without conscious decision (the universe as a \"womb\" of conditions for life)", "[F] Futuristic extension: algorithmic compassion — systems designed to care, sustain, and nurture; ar-Raḥmān as the pattern of care embedded in the fabric of reality, whether biological or informational", "Core concept: visceral, womb-sourced tenderness operating at maximum intensity — not transactional kindness but the involuntary, constitutive caring that precedes choice"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ar-Raḥmān as divine name/attribute (NOUN_PROP) — predicate, appositive, and genitive constructions", "count": "~91 ayahs", "examples": [{"ref": "1:1", "arabic": "﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "In the name of God, ar-Raḥmān (the Intensely Merciful), ar-Raḥīm (the Continuously Merciful)"}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And put your trust in al-'Azīz (the Mighty), ar-Raḥīm (the Continuously Merciful)"}]}, {"label": "B. Intensive adjective (ADJ_INTENS) — raḥīm as descriptive epithet in various syntactic roles", "count": "~61 ayahs", "examples": [{"ref": "2:226", "arabic": "لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍۢ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ", "english": "For those who swear abstinence from their wives, a waiting period of four months; then if they return, indeed God is ghafūr (forgiving), raḥīm (continuously merciful)"}, {"ref": "3:129", "arabic": "وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ", "english": "To God belongs what is in the heavens and what is in the earth; He forgives whom He wills and punishes whom He wills — and God is ghafūr (forgiving), raḥīm (continuously merciful)"}]}, {"label": "C. Verbal forms — raḥima (past), irḥam (imperative), yarḥamu (imperfect) — mercy as action", "count": "~20 ayahs", "examples": [{"ref": "18:10", "arabic": "إِذْ أَوَى ٱلْفِتْيَةُ إِلَى ٱلْكَهْفِ فَقَالُوا۟ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةًۭ وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًۭا", "english": "When the youths retreated to the cave and said: Our Lord, grant us from Your presence raḥma (mercy) and prepare for us right guidance in our affair"}]}, {"label": "D. Gerund raḥma — mercy as abstract noun, object, or prepositional complement", "count": "~114 ayahs", "examples": [{"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا", "english": "He said: This is raḥma (mercy) from my Lord; but when the promise of my Lord comes, He will level it — and the promise of my Lord is ever true"}, {"ref": "2:286", "arabic": "لَا يُكَلِّفُ ٱللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا ٱكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَآ إِن نَّسِينَآ أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْرًۭا كَمَا حَمَلْتَهُۥ عَلَى ٱلَّذِينَ مِن قَبْلِنَا ۚ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦ ۖ وَٱعْفُ عَنَّا وَٱغْفِرْ لَنَا وَٱرْحَمْنَآ ۚ أَنتَ مَوْلَىٰنَا فَٱنصُرْنَا عَلَى ٱلْقَوْمِ ٱلْكَٰفِرِينَ", "english": "God does not burden a soul beyond its capacity... Our Lord, forgive us and irḥamnā (have mercy upon us) — You are our protector, so grant us victory over the disbelieving people"}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Irreg", "type": "CE", "note": "Case ending change from genitive (-i) to accusative (-a) on both words. This would make them objects of praise (manṣūb 'alā al-madḥ) rather than attributes following rabb. The accusative reading isolates these names as exclamatory objects of praise — \"I praise the Intensely Merciful, the Continuously Merciful!\" — rather than subordinating them syntactically to the preceding noun.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Irreg", "type": "CE", "note": "Case ending change from genitive (-i) to nominative (-u) on both words. This would make them a new nominal sentence (mubtada') — \"ar-Raḥmān ar-Raḥīm (He is the Intensely Merciful, the Continuously Merciful)\" — a fresh declaration rather than continuation of the genitive chain from 1:2. The nominative breaks the syntactic chain, creating an independent predication.", "source": "erquran.org"}, {"arabic": "الرَّزَّاقِ", "translit": "ar-razzāqi", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution: replaces ar-Raḥmān entirely with ar-Razzāq (the Supreme Provider, from root r-z-q). This is a shawādhdh (anomalous) reading NOT in the standard Hafs text. It collapses the mercy attribute into provision — suggesting that divine mercy is fundamentally experienced as sustenance and provision. The root r-z-q (123 Quranic occurrences) centers on provision, sustenance, livelihood. The fa''āl pattern (فَعَّال) is the intensive agent noun: \"the one who provides abundantly and ceaselessly.\"", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;1:1;3:129;6:12;17:110;19:93;22:5;22:65;25:6;25:48", "note": "r-ḥ-m co-occurs with s-m-w (sky/heaven/elevation) — mercy descends from above, or the Most High is also the Most Merciful; theological pairing of transcendence with compassion"}, {"coRoot": "w-l-y", "coRootAr": "و ل ي", "count": "15", "refs": "2:64;2:226;2:286;7:155;8:75;9:71;18:58;19:45;28:43;33:5", "note": "r-ḥ-m co-occurs with w-l-y (guardian/ally/protector) — mercy and guardianship as complementary divine functions; the merciful one is also the protective guardian"}, {"coRoot": "r-z-q", "coRootAr": "ر ز ق", "count": "1", "refs": "1:3", "note": "r-ḥ-m co-occurs with r-z-q only through the shawādhdh variant ar-Razzāq replacing ar-Raḥmān — variant-sourced [v], linking mercy to provision at this exact location ← IN THIS AYAH"}], "critical": [{"cat": "GRAM", "pattern": "ar-Rahman: ism 'alam vs sifa debate", "kernel": "Sibawayh = name; others = hyperbolic adjective"}, {"cat": "SEM", "pattern": "ar-Rahman exclusive to God per Lisan al-Arab", "kernel": "Cannot apply to any creature unlike rahim"}, {"cat": "GRAM", "pattern": "three qira'at variants for word 1", "kernel": "Accusative nominative and lexical substitution ar-Razzaq"}, {"cat": "SEM", "pattern": "shawadhdh ar-Razzaq replaces ar-Rahman", "kernel": "Ancient tradition equating mercy with provision"}, {"cat": "ECHO", "pattern": "repeated ra'-ha' creates enveloping sound", "kernel": "Breathy ha' and liquid ra' mirror gentle encompassing care"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "ٱلرَّحِيمِ", "translit": "ar-raḥīmi", "gloss": "the Continuously Merciful, the Perpetually Compassionate", "root": "ر ح م (r-ḥ-m)", "grammar": "Definite adjective (ism ṣifa) on the fa'īl (فَعِيل) pattern, genitive case (majrūr) as second attribute (na't) of Allāh or second apposition to rabb. The fa'īl pattern denotes a quality as a permanent, abiding characteristic — not a momentary state but an enduring trait. Unlike ar-Raḥmān which is exclusive to God, ar-Raḥīm can be applied to humans (cf. 9:128 where the Prophet is described as raḥīm). This asymmetry is semantically significant.", "semantics": ["فَعِيل (fa'īl pattern): raḥīm — permanently/habitually merciful; denotes the quality as an abiding trait, not a momentary surge", "رَحِيم (raḥīm): merciful, compassionate; can describe both God and humans — the mercy that is directed, intentional, and sustained over time", "Classical distinction (Lane's, Lisan al-Arab): ar-Raḥmān = raḥma 'āmma (general mercy encompassing all creation); ar-Raḥīm = raḥma khāṣṣa (specific mercy directed to believers) — though this distinction is itself debated among classical lexicographers", "Classical lexicon (Lane's): raḥīm as fa'īl can function as either active (the one who is merciful) or passive (the one who is shown mercy, i.e. marḥūm) — though in divine usage only the active sense applies", "Classical lexicon (Lisan al-Arab): the pairing raḥmān + raḥīm creates a semantic totality — raḥmān covers the breadth (breadth of mercy), raḥīm covers the depth (continuity of mercy); some lexicographers say raḥmān is for this world, raḥīm is for the hereafter", "[M] Modern extension: sustained care infrastructure — institutions, systems, and policies that provide ongoing mercy (healthcare, social safety nets, environmental protection) embody the fa'īl quality of persistent, structured compassion", "[F] Futuristic extension: self-sustaining care algorithms — AI systems that continuously adapt to provide compassionate responses; the raḥīm quality as the enduring, self-renewing nature of care", "Core concept: mercy as a permanent, defining characteristic — not an occasional act but an identity; the one who IS merciful by nature, continuously and without interruption"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ar-Raḥīm as divine name/attribute (NOUN_PROP) — following other divine names, predicate, genitive", "count": "~91 ayahs", "examples": [{"ref": "1:1", "arabic": "﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "In the name of God, ar-Raḥmān (the Intensely Merciful), ar-Raḥīm (the Continuously Merciful)"}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And put your trust in al-'Azīz (the Mighty), ar-Raḥīm (the Continuously Merciful)"}]}, {"label": "B. Intensive adjective (ADJ_INTENS) raḥīm — ghafūr raḥīm pairing and other predicative uses", "count": "~61 ayahs", "examples": [{"ref": "2:226", "arabic": "لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍۢ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُو
