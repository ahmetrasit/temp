hain performs a theological argument: the one capable of future guidance (ihdi) is identified as the one who has already demonstrated past favor (an'amta, perfect tense). The shift from imperative (1:6) to perfect indicative (1:7) within the same second-person address creates a temporal arc — from present request to past evidence — that depends entirely on crossing the boundary."}, {"labels": ["semantic_bridge"], "text": "The root h-d-y (ه د ي) in ihdina (1:6) and the root d-l-l (ض ل ل) in al-dallin (1:7) form a precise antonym pair visible only across the boundary. Lane's Lexicon defines hada as \"to lead aright, to show the way, to precede as a guide\" and dalla as \"to stray, to lose one's way, to be lost.\" The prayer for guidance (h-d-y) in 1:6 receives its negative definition in 1:7: guidance is explicitly not-straying. But the cross-boundary placement makes this more than simple opposition — the request for hidaya is completed by the exclusion of dalal, as if the very act of asking to be guided requires specifying what non-guidance looks like."}, {"labels": ["register_shift"], "text": "In 1:6 the speech act is pure petition — a bare imperative (ihdi) with no descriptive content, only a request and its object. At the boundary, 1:7 shifts to descriptive-classificatory mode: it taxonomizes humanity into three groups (favored, wrathful, straying) using relative clauses, passive participles, and active participles. The grammatical texture changes from verbal-imperative to nominal-participial. This shift from requesting to defining is the structural hinge of the entire surah: the worshiper's petition (1:6) can only be understood through the map of human possibilities (1:7)."}, {"labels": ["semantic_bridge"], "text": "The preposition 'ala (ع ل و) appears once in 1:6 implicitly through the double-accusative construction of ihdi (guidance directed upon the guided), then twice explicitly in 1:7: 'alayhim (favor upon them) and 'alayhim (wrath upon them). The same spatial metaphor — something descending upon a recipient — carries both ni'ma (softness, ease, flourishing from n-'-m) and ghadab (intense heated anger from gh-d-b). This superposition structure is invisible within either ayah alone: only by reading across the boundary does one see that the path of 1:6 is defined in 1:7 by what falls upon its travelers — blessing or wrath — using identical prepositional architecture for opposite outcomes."}, {"labels": ["scene_shift"], "text": "Ayah 1:6 presents a scene of singular focus: one community (na, \"us\"), one path (al-sirat), one quality (al-mustaqim). The acoustic and conceptual space is unified. At the boundary, 1:7 fractures this unity into a tripartite scene: those favored, those under wrath, those astray. The singular corridor of 1:6 opens into a landscape with three distinct populations. Furthermore, the voice/agency grammar shifts: in 1:6 the worshiper actively requests (ihdi); in 1:7 the favored passively receive (an'amta 'alayhim), the wrathful passively bear (al-maghdubi, passive participle), and only the straying act (al-dallin, active participle). The boundary marks the transition from unified agency to differentiated destinies."}]}};
    
    const { useState, useRef, useEffect, useCallback, useMemo } = React;

    };

    // Parse semantic string for temporal badge: [7C], [M], [F] prefix
    function parseSemanticBadge(str) {
      const match = str.match(/^\[(\w+)\]\s*/);
      if (match) {
        const code = match[1].toUpperCase();
        const info = temporalLegend[code] || temporalLegend[code === "E" ? "F" : null];
        if (info) return { badge: info, text: str.slice(match[0].length) };
      }
      return { badge: null, text: str };
    }

    // Resolve bilingual field: accepts {en,tr} object or plain string
    const t = (v) => {
      if (v && typeof v === "object" && "en" in v) return v.en;
      return v; // plain string fallback
    };

    /*───────────────────────────────────────────────────────────
      PROCESS AYAH FILES (from index.html)
    ───────────────────────────────────────────────────────────*/
    function processAyahFiles(fileList) {
      const jsonFiles = Array.from(fileList).filter(f => f.name.endsWith(".json"));
      return Promise.all(jsonFiles.map(f => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              const m = f.name.match(/^(\d+)-(\d+)\.json$/);
              if (m && String(data.surah) === m[1]) {
                data.key = `${data.surah}:${m[2]}`;
              } else {
                data.key = `${data.surah}:${data.ayah}`;
              }
              resolve(data);
            } catch { resolve(null); }
          };
          reader.onerror = () => resolve(null);
          reader.readAsText(f);
        });
      })).then(r => r.filter(Boolean).sort((a, b) => a.surah !== b.surah ? a.surah - b.surah : a.ayah - b.ayah));
    }

    /*───────────────────────────────────────────────────────────
      PROCESS BOUNDARY FILES
    ───────────────────────────────────────────────────────────*/
    function processBoundaryFiles(fileList) {
      const boundaryFiles = Array.from(fileList).filter(f => f.name.includes("-boundaries.json"));
      return Promise.all(boundaryFiles.map(f => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(reader.result);
              resolve(data);
            } catch { resolve(null); }
          };
          reader.onerror = () => resolve(null);
          reader.readAsText(f);
        });
      })).then(results => results.filter(Boolean));
    }

    /*───────────────────────────────────────────────────────────
      ARC DIAGRAM
    ───────────────────────────────────────────────────────────*/
    const arcTypeKeys = [
      { key: "root", color: c.arcRoot, label: "Root" },
      { key: "semantic", color: c.arcSemantic, label: "Semantic" },
      { key: "structural", color: c.arcStructural, label: "Structural" },
      { key: "qiraat", color: c.arcQiraat, label: "Qira'at" },
    ];

    function ArcDiagram({ arcs, ayahRefs, highlightAyah, onAyahClick, activeFilter, onFilterToggle }) {
      if (!arcs || !arcs.length || !ayahRefs.length) return null;
      const width = Math.max(600, ayahRefs.length * 60);
      const nodeY = 100;
      const nodeSpacing = width / (ayahRefs.length + 1);
      const pos = {};
      ayahRefs.forEach((ref, i) => { pos[ref] = (i + 1) * nodeSpacing; });

      // Compute which nodes are connected by active arcs
      const connectedNodes = useMemo(() => {
        if (!activeFilter) return null;
        const nodes = new Set();
        arcs.forEach(arc => { if (arc.arcType === activeFilter) { nodes.add(arc.from); nodes.add(arc.to); } });
        return nodes;
      }, [arcs, activeFilter]);

      return (
        <svg width="100%" viewBox={`0 0 ${width} ${nodeY + 30}`} style={{ display: "block", margin: "0 auto 4px" }}>
          {/* Arcs */}
          {arcs.map((arc, i) => {
            const x1 = pos[arc.from], x2 = pos[arc.to];
            if (!x1 || !x2) return null;
            const midX = (x1 + x2) / 2;
            const arcH = Math.min(80, 20 + Math.abs(x2 - x1) * 0.15);
            const color = arcColors[arc.arcType] || c.inkFaint;
            const isActive = !activeFilter || arc.arcType === activeFilter;
            const hl = highlightAyah && (arc.from === highlightAyah || arc.to === highlightAyah);
            return (
              <g key={i} style={{ transition: "opacity 0.2s" }}>
                <path d={`M ${x1} ${nodeY} Q ${midX} ${nodeY - arcH} ${x2} ${nodeY}`}
                  fill="none" stroke={color} strokeWidth={isActive && hl ? 2.5 : isActive ? 2 : 1}
                  strokeDasharray={isActive ? "none" : "4,3"} opacity={isActive ? (hl ? 1 : 0.8) : 0.1} />
                {isActive && <title>{t(arc.label)} ({arc.arcType})</title>}
              </g>
            );
          })}
          {/* Nodes */}
          {ayahRefs.map((ref, i) => {
            const x = (i + 1) * nodeSpacing;
            const isHL = highlightAyah === ref;
            const isConnected = !activeFilter || (connectedNodes && connectedNodes.has(ref));
            return (
              <g key={ref} style={{ cursor: "pointer", transition: "opacity 0.2s" }} onClick={() => onAyahClick && onAyahClick(ref)} opacity={isConnected ? 1 : 0.25}>
                <circle cx={x} cy={nodeY} r={isHL ? 10 : isConnected && activeFilter ? 9 : 7}
                  fill={isHL ? c.teal : isConnected && activeFilter ? arcColors[activeFilter] + "20" : c.white}
                  stroke={isConnected && activeFilter ? arcColors[activeFilter] : c.teal} strokeWidth={1.5} />
                <text x={x} y={nodeY + 22} textAnchor="middle" fontSize="10" fontFamily={font.sans}
                  fill={isConnected ? c.inkLight : c.inkFaint} fontWeight={isConnected && activeFilter ? 700 : 400}>
                  {ref.split(":")[1]}
                </text>
              </g>
            );
          })}
          {/* Clickable filter legend */}
          {arcTypeKeys.map((item, i) => {
            const active = activeFilter === item.key;
            const count = arcs.filter(a => a.arcType === item.key).length;
            if (count === 0) return null;
            return (
              <g key={item.key} transform={`translate(${10 + i * 110}, 12)`}
                style={{ cursor: "pointer" }} onClick={(e) => { e.stopPropagation(); onFilterToggle(item.key); }}>
                <rect x="-4" y="-8" width="100" height="18" rx="3" fill={active ? item.color + "15" : "transparent"}
                  stroke={active ? item.color : "transparent"} strokeWidth="1" />
                <line x1="0" y1="0" x2="16" y2="0" stroke={item.color} strokeWidth={active ? 3 : 2}
                  opacity={!activeFilter || active ? 1 : 0.3} />
                <text x="20" y="4" fontSize="9" fontFamily={font.sans}
                  fill={!activeFilter || active ? c.ink : c.inkFaint} fontWeight={active ? 700 : 400}>
                  {item.label} ({count})
                </text>
              </g>
            );
          })}
        </svg>
      );
    }

    /*───────────────────────────────────────────────────────────
      STICKY ARC PANEL — collapsible, sticks to top of scroll
    ───────────────────────────────────────────────────────────*/
    function StickyArcPanel({ arcs, ayahRefs, highlightAyah, onAyahClick }) {
      const [open, setOpen] = useState(true);
      const [activeFilter, setActiveFilter] = useState(null);

      const handleFilterToggle = useCallback((key) => {

      return (
        <div style={{ position: "sticky", top: 0, zIndex: 10, background: c.paper, borderBottom: `1px solid ${c.border}` }}>
          <div style={{ maxWidth: "800px", margin: "0 auto", padding: "0 28px" }}>
            <div style={{ background: c.white, border: `1px solid ${c.border}`, borderRadius: open ? "0 0 8px 8px" : "0 0 4px 4px", overflow: "hidden" }}>
              <div onClick={() => setOpen(!open)} style={{ padding: "8px 16px", cursor: "pointer", display: "flex", alignItems: "center", gap: "8px", userSelect: "none", borderBottom: open ? `1px solid ${c.border}` : "none" }}>
                <span style={{ fontSize: "10px", color: c.inkFaint }}>{open ? "\u25BC" : "\u25B6"}</span>
                <span style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", letterSpacing: "0.08em" }}>Connection Graph</span>
                {!open && <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.inkFaint }}>({arcs.length} arcs, {ayahRefs.length} ayahs)</span>}
                {!open && filterLabel && (

                )}
              </div>
              {open && (
                <div style={{ padding: "12px 16px 8px" }}>
                  <ArcDiagram arcs={arcs} ayahRefs={ayahRefs} highlightAyah={highlightAyah} onAyahClick={onAyahClick}
                    activeFilter={activeFilter} onFilterToggle={handleFilterToggle}  />
                  {activeFilter && (
                    <div style={{ textAlign: "center", paddingBottom: "4px" }}>
                      <button onClick={(e) => { e.stopPropagation(); setActiveFilter(null); }} style={{
                        fontFamily: font.sans, fontSize: "10px", color: c.inkFaint, background: "none",
                        border: `1px solid ${c.border}`, borderRadius: "3px", padding: "2px 10px", cursor: "pointer",
                      }}>Clear filter</button>
                    </div>
                  )}
                  <ArcLabelList arcs={arcs} activeFilter={activeFilter}  />
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      ARC LABEL LIST — collapsible text list, collapsed by default
    ───────────────────────────────────────────────────────────*/
    function ArcLabelList({ arcs, activeFilter }) {
      const [open, setOpen] = useState(false);
      const filtered = activeFilter ? arcs.filter(a => a.arcType === activeFilter) : arcs;

      return (
        <div style={{ borderTop: `1px solid ${c.border}`, marginTop: "4px" }}>

            <span style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", letterSpacing: "0.08em" }}>Arc Details</span>
            <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.inkFaint }}>({filtered.length})</span>
          </div>
          {open && (
            <div style={{ paddingBottom: "8px", maxHeight: "300px", overflowY: "auto" }}>
              {filtered.map((arc, i) => {
                const color = arcColors[arc.arcType] || c.inkFaint;
                return (
                  <div key={i} style={{ display: "flex", alignItems: "baseline", gap: "8px", padding: "3px 0", fontSize: "11px", fontFamily: font.sans, lineHeight: "1.4" }}>
                    <span style={{ flexShrink: 0, fontSize: "10px", fontWeight: 700, color, minWidth: "70px" }}>{arc.from} → {arc.to}</span>
                    <span style={{ flexShrink: 0, fontSize: "9px", fontWeight: 600, color, textTransform: "uppercase", minWidth: "60px" }}>{arc.arcType}</span>
                    <span style={{ color: c.ink }}>{t(arc.label)}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      BADGE / THREAD PILL / FINDING CARD / TECHNICAL
    ───────────────────────────────────────────────────────────*/
    function Badge({ type }) {
      const s = badgeColors[type];
      if (!s) return null;
      return <span style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", padding: "3px 8px", borderRadius: "3px", background: s.bg, color: s.text, border: `1px solid ${s.border}30` }}>{s.label}</span>;
    }

    function ThreadPill({ threadId, stage, ayahRef, onClick }) {
      const icons = { planted: "\u25CC", developed: "\u25D0", harvested: "\u25CF" };
      const colors = { planted: c.inkFaint, developed: c.teal, harvested: c.oxford };
      const interactive = !!ayahRef && !!onClick;
      return (
        <span
          title={ayahRef ? ayahRef : undefined}
          onClick={interactive ? () => onClick(ayahRef) : undefined}
          style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 600, padding: "2px 8px", borderRadius: "10px", background: c.wheat, color: colors[stage] || c.inkFaint, display: "inline-flex", alignItems: "center", gap: "4px", marginRight: "6px", cursor: interactive ? "pointer" : "default" }}>
          <span>{icons[stage] || "\u25CB"}</span>
          {threadId ? threadId.replace(/-/g, " ") : ""}
          {ayahRef && <span style={{ fontSize: "9px", color: c.inkFaint, marginLeft: "2px" }}>{ayahRef}</span>}
        </span>
      );
    }

    /* Surah badge + clickable ayah circles */
    function SurahBadge({ surahNum }) {
      const name = surahNames[surahNum];
      const label = name ? t(name) : surahNum;
      return (
        <span title={name ? `${t(name)} (${surahNum})` : surahNum}
          style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.white, background: c.oxford,
            height: "22px", minWidth: "22px", padding: "0 7px", borderRadius: "3px", letterSpacing: "0.04em",
            display: "inline-flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          {surahNum}
        </span>
      );
    }

    function AyahCircle({ ayahRef, onClick, hasData }) {
      const ayahNum = ayahRef.split(":")[1];
      return (
        <span onClick={(e) => { e.stopPropagation(); onClick && onClick(ayahRef); }}
          style={{
            fontFamily: font.sans, fontSize: "10px", fontWeight: 700,
            width: "22px", height: "22px", borderRadius: "50%", display: "inline-flex",
            alignItems: "center", justifyContent: "center",
            background: hasData ? c.teal : c.wheat, color: hasData ? c.white : c.ink,
            cursor: hasData ? "pointer" : "default",
            border: `1px solid ${hasData ? c.teal : c.border}`,
            flexShrink: 0,
          }}
          title={ayahRef}>
          {ayahNum}
        </span>
      );
    }

    /* Extract all surah:ayah refs from finding (primary + inline) grouped by surah */
    function extractRefs(finding) {
      const refSet = new Set();
      refSet.add(finding.ref);
      const texts = typeof finding.text === "object" ? [finding.text.en].filter(Boolean) : [finding.text];
      // Match both single refs (100:3) and ranges (100:1-5)
      // Negative lookahead (?!:) prevents "100:5-100:6" from being parsed as range 5-100
      const pattern = /\b(\d+):(\d+)(?:-(\d+)(?!:))?\b/g;
      let m;
      for (const txt of texts) {
        pattern.lastIndex = 0;
        while ((m = pattern.exec(txt)) !== null) {
          const surah = m[1], start = parseInt(m[2]), end = m[3] ? parseInt(m[3]) : start;
          for (let a = start; a <= end; a++) refSet.add(`${surah}:${a}`);
        }
      }
      // Group by surah
      const groups = {};
      for (const ref of refSet) {
        const [s] = ref.split(":");
        if (!groups[s]) groups[s] = [];
        groups[s].push(ref);
      }
      // Sort ayahs within each surah
      for (const s of Object.keys(groups)) {
        groups[s].sort((a, b) => parseInt(a.split(":")[1]) - parseInt(b.split(":")[1]));
        // deduplicate
        groups[s] = [...new Set(groups[s])];
      }
      return groups;
    }

    /* Render text with inline ayah ref badges */
    function AnnotatedText({ text, onAyahClick, ayahDataKeys }) {
      const parts = [];
      const pattern = /\b(\d+:\d+)\b/g;
      let last = 0, m;
      while ((m = pattern.exec(text)) !== null) {
        if (m.index > last) parts.push(text.slice(last, m.index));
        const ref = m[1];
        const hasData = ayahDataKeys.includes(ref);
        parts.push(
          <span key={m.index} onClick={(e) => { e.stopPropagation(); onAyahClick && onAyahClick(ref); }}
            style={{
              fontFamily: font.sans, fontSize: "11px", fontWeight: 700,
              color: hasData ? c.teal : c.oxford, background: hasData ? c.tealLight : c.wheat,
              padding: "1px 5px", borderRadius: "3px", cursor: hasData ? "pointer" : "default",
              border: `1px solid ${hasData ? c.teal + "40" : c.border}`,
              whiteSpace: "nowrap",
            }}
            title={ref}>
            {ref}
          </span>
        );
        last = m.index + m[0].length;
      }
      if (last < text.length) parts.push(text.slice(last));
      return <>{parts}</>;
    }

    function FindingCard({ finding, onAyahClick, ayahDataKeys }) {
      const [open, setOpen] = useState(false);
      const s = badgeColors[finding.type] || badgeColors.DISCOVERY;
      const refGroups = useMemo(() => extractRefs(finding), [finding]);
      const surahKeys = Object.keys(refGroups).sort((a, b) => parseInt(a) - parseInt(b));

      return (
        <div style={{ borderLeft: `3px solid ${s.border}`, background: s.bg, borderRadius: "0 6px 6px 0", marginBottom: "12px" }}>
          {/* Header row: badge + pattern type + thread + title */}
          <div onClick={() => setOpen(!open)} style={{ padding: "14px 18px 6px", cursor: "pointer", display: "flex", alignItems: "center", gap: "8px", flexWrap: "wrap", userSelect: "none" }}>
            <span style={{ fontSize: "10px", color: s.text, flexShrink: 0 }}>{open ? "\u25BC" : "\u25B6"}</span>
            <Badge type={finding.type} />
            <PatternTypeBadge title={t(finding.title)} />
            {finding.threadId && <ThreadPill threadId={finding.threadId} stage="" />}
            <span style={{ fontFamily: font.sans, fontSize: "13px", fontWeight: 700, color: c.ink }}>
              {t(finding.title).replace(/^\[[^\]]+\]\s*/, "")}
            </span>
          </div>
          {/* Ref row: surah badges + ayah circles */}
          <div style={{ padding: "4px 18px 10px 36px", display: "flex", alignItems: "center", gap: "6px", flexWrap: "wrap" }}>
            {surahKeys.map(sk => (
              <React.Fragment key={sk}>
                <SurahBadge surahNum={sk}  />
                {refGroups[sk].map(r => (
                  <AyahCircle key={r} ayahRef={r}
                    onClick={() => onAyahClick && onAyahClick(r)}
                    hasData={ayahDataKeys.includes(r)} />
                ))}
                {/* small gap between surah groups */}
                <span style={{ width: "4px" }} />
              </React.Fragment>
            ))}
          </div>
          {/* Body text with inline ref badges */}
          {open && (
            <div style={{ padding: "0 18px 14px 36px", fontFamily: font.serif, fontSize: "14px", color: c.ink, lineHeight: "1.7" }}>
              <AnnotatedText text={t(finding.text)} onAyahClick={onAyahClick} ayahDataKeys={ayahDataKeys} />
            </div>
          )}
        </div>
      );
    }

    function TechnicalDetail({ technical }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ border: `1px solid ${c.border}`, borderRadius: "4px", marginBottom: "8px", background: c.white }}>
          <div onClick={() => setOpen(!open)} style={{ padding: "10px 14px", cursor: "pointer", display: "flex", alignItems: "center", gap: "8px", userSelect: "none" }}>
            <span style={{ fontSize: "10px", color: c.inkFaint }}>{open ? "\u25BC" : "\u25B6"}</span>
            <span style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.teal, textTransform: "uppercase", letterSpacing: "0.06em" }}>Technical</span>
            <span style={{ fontFamily: font.sans, fontSize: "12px", color: c.inkLight }}>{t(technical.title)}</span>
          </div>
          {open && <div style={{ padding: "0 14px 14px 32px", fontFamily: font.serif, fontSize: "13px", color: c.inkLight, lineHeight: "1.7" }}>{t(technical.text)}</div>}
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      LEGEND — collapsible key for all icons
    ───────────────────────────────────────────────────────────*/
    function Legend() {
      const [open, setOpen] = useState(false);
      const row = { display: "flex", alignItems: "center", gap: "8px", marginBottom: "6px" };
      const label = { fontFamily: font.sans, fontSize: "11px", color: c.ink };
      const icon = { fontFamily: font.sans, fontSize: "12px", flexShrink: 0, width: "18px", textAlign: "center" };
      return (
        <div style={{ background: c.white, border: `1px solid ${c.border}`, borderRadius: "6px", marginBottom: "16px" }}>
          <div onClick={() => setOpen(!open)} style={{ padding: "10px 16px", cursor: "pointer", display: "flex", alignItems: "center", gap: "8px", userSelect: "none" }}>
            <span style={{ fontSize: "10px", color: c.inkFaint }}>{open ? "\u25BC" : "\u25B6"}</span>
            <span style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", letterSpacing: "0.08em" }}>Legend</span>
          </div>
          {open && (
            <div style={{ padding: "0 16px 14px", display: "flex", gap: "32px", flexWrap: "wrap" }}>
              {/* Badges */}
              <div>
                <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: "8px" }}>Findings</div>
                <div style={row}><Badge type="CONFIRMED" /><span style={label}>Classical reading confirmed by data</span></div>
                <div style={row}><Badge type="DISCOVERY" /><span style={label}>New insight only data reveals</span></div>
                <div style={row}><Badge type="TENSION" /><span style={label}>Data complicates classical reading</span></div>
              </div>
              {/* Arc types */}
              <div>
                <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: "8px" }}>Connection types</div>
                {[
                  { color: c.arcRoot, label: "Root pattern link" },
                  { color: c.arcSemantic, label: "Semantic field link" },
                  { color: c.arcStructural, label: "Structural / particle link" },
                  { color: c.arcQiraat, label: "Qira'at variant link" },
                ].map(item => (
                  <div key={item.label} style={row}>
                    <svg width="20" height="10"><line x1="0" y1="5" x2="20" y2="5" stroke={item.color} strokeWidth="2" /></svg>
                    <span style={label}>{item.label}</span>
                  </div>
                ))}
              </div>
              {/* Thread stages */}
              <div>
                <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: "8px" }}>Thread stages</div>
                {[
                  { icon: "\u25CC", color: c.inkFaint, label: "Planted \u2014 pattern first appears" },
                  { icon: "\u25D0", color: c.teal, label: "Developed \u2014 pattern strengthens" },
                  { icon: "\u25CF", color: c.oxford, label: "Harvested \u2014 pattern fully realized" },
                ].map(item => (
                  <div key={item.label} style={row}>
                    <span style={{ ...icon, color: item.color }}>{item.icon}</span>
                    <span style={label}>{item.label}</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      THREAD TIMELINE
    ───────────────────────────────────────────────────────────*/
    function ThreadTimeline({ threads, onAyahClick }) {
      const ids = Object.keys(threads);
      if (!ids.length) return null;
      const order = { planted: 0, developed: 1, harvested: 2 };
      return (
        <div style={{ background: c.white, border: `1px solid ${c.border}`, borderRadius: "6px", padding: "16px 20px", marginBottom: "24px" }}>
          <div style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.claret, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: "12px" }}>Threads</div>
          {ids.map(id => {
            const entries = [...threads[id]].sort((a, b) => (order[a.stage] || 0) - (order[b.stage] || 0));
            return (
              <div key={id} style={{ marginBottom: "10px", display: "flex", alignItems: "flex-start", gap: "8px" }}>
                <span style={{ fontFamily: font.sans, fontSize: "11px", fontWeight: 600, color: c.ink, minWidth: "140px", flexShrink: 0 }}>{id.replace(/-/g, " ")}</span>
                <div style={{ display: "flex", gap: "4px", flexWrap: "wrap" }}>{entries.map((e, i) => <ThreadPill key={i} threadId="" stage={e.stage} ayahRef={e.ref} onClick={onAyahClick} />)}</div>
              </div>
            );
          })}
          <div style={{ display: "flex", gap: "16px", marginTop: "8px", paddingTop: "8px", borderTop: `1px solid ${c.border}` }}>
            {[{ icon: "\u25CC", label: "Planted" }, { icon: "\u25D0", label: "Developed" }, { icon: "\u25CF", label: "Harvested" }].map(s =>
              <span key={s.label} style={{ fontFamily: font.sans, fontSize: "10px", color: c.inkFaint }}>{s.icon} {s.label}</span>
            )}
          </div>
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      SECTION — renders one structural section of the surah
    ───────────────────────────────────────────────────────────*/
    const patternTypeColors = {
      "Ring": "#1565C0", "Halka": "#1565C0",
      "Chiastic": "#7B1FA2", "Kiyastik": "#7B1FA2",
      "Mirror": "#2E7D32", "Ayna": "#2E7D32",
      "Parallel": "#0D7680", "Paralel": "#0D7680",
      "Envelope": "#E65100", "Zarf": "#E65100",
      "Concentric": "#AD1457", "Konsantrik": "#AD1457",
      "Contrapuntal": "#4E342E", "Kontrpuantal": "#4E342E",
      "Escalation": "#B8860B", "Tırmanlama": "#B8860B",
      "Bookend": "#37474F", "Kitap Sonu": "#37474F",
    };

    function PatternTypeBadge({ title }) {
      const m = title.match(/^\[([^\]]+)\]/);
      if (!m) return null;
      const type = m[1];
      const color = patternTypeColors[type] || c.inkFaint;
      return (
        <span style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", padding: "3px 8px", borderRadius: "3px", background: color + "15", color, border: `1px solid ${color}30`, marginRight: "4px" }}>
          {type}
        </span>
      );
    }

    function Section({ section, onAyahHover, onAyahClick, ayahDataKeys }) {
      const [expanded, setExpanded] = useState(true);
      const titleStr = t(section.title);
      const titleEn = typeof section.title === "object" ? section.title.en : section.title;
      const isCrossSection = titleEn === "Cross-Section Patterns";
      const headerColor = isCrossSection ? c.claret : c.teal;
      return (
        <div style={{ marginBottom: "48px" }}>
          <div
            onClick={() => setExpanded(!expanded)}
            style={{
              borderBottom: `2px solid ${headerColor}`,
              paddingBottom: "8px",
              marginBottom: expanded ? "24px" : "0",
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              gap: "10px",
              userSelect: "none"
            }}
          >
            <span style={{ fontSize: "14px", color: headerColor }}>{expanded ? "▼" : "▶"}</span>
            <span style={{ fontFamily: font.sans, fontSize: "18px", fontWeight: 700, color: c.oxford }}>{titleStr}</span>
            {!isCrossSection && (
              <span style={{ fontFamily: font.sans, fontSize: "13px", color: c.inkFaint }}>
                Ayahs {section.ayahStart}–{section.ayahEnd}
              </span>
            )}
            {isCrossSection && (
              <span style={{ fontFamily: font.sans, fontSize: "12px", color: c.inkFaint, fontStyle: "italic" }}>
                Inter-section and inter-ayah structures
              </span>
            )}
            {!expanded && (
              <span style={{ fontFamily: font.sans, fontSize: "11px", color: c.inkFaint, marginLeft: "auto" }}>
                {section.findings.length} findings
              </span>
            )}
          </div>

          {expanded && (
            <>
              {/* Ayah text block */}
              <div style={{ background: c.linen, borderRadius: "6px", padding: "20px 24px", marginBottom: "20px" }}>
                {section.ayahs.map(ayah => {
                  const hasDetail = ayahDataKeys.includes(ayah.ref);
                  return (
                    <div key={ayah.ref}
                      onMouseEnter={() => onAyahHover(ayah.ref)}
                      onMouseLeave={() => onAyahHover(null)}
                      onClick={(e) => { e.stopPropagation(); hasDetail && onAyahClick(ayah.ref); }}
                      style={{ marginBottom: "12px", cursor: hasDetail ? "pointer" : "default" }}
                    >
                      <div style={{ display: "flex", gap: "12px", alignItems: "baseline" }}>
                        <span style={{ fontFamily: font.sans, fontSize: "11px", fontWeight: 700, color: c.teal, flexShrink: 0, minWidth: "36px" }}>
                          {ayah.ref.split(":")[1]}
                          {hasDetail && <span style={{ fontSize: "8px", marginLeft: "2px", verticalAlign: "super" }}>+</span>}
                        </span>
                        <div style={{ flex: 1 }}>
                          <div style={{ fontFamily: font.arabic, fontSize: "22px", color: c.oxford, lineHeight: "2", direction: "rtl", textAlign: "right" }}>{ayah.arabic}</div>
                          <div style={{ fontFamily: font.serif, fontSize: "13px", color: c.inkLight, fontStyle: "italic", lineHeight: "1.6" }}>{t(ayah.translation)}</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Classical readings */}
              {section.classical && section.classical.length > 0 && (
                <div style={{ background: c.white, border: `1px solid ${c.border}`, borderRadius: "6px", padding: "16px 20px", marginBottom: "20px" }}>
                  <div style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: "8px" }}>Classical Reading</div>
                  {section.classical.map((cl, i) => (
                    <div key={i} style={{ fontFamily: font.serif, fontSize: "14px", color: c.ink, lineHeight: "1.7", fontStyle: "italic", marginBottom: "8px" }}>
                      <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.teal, fontWeight: 700, fontStyle: "normal", marginRight: "6px" }}>{cl.ref}</span>
                      <AnnotatedText text={t(cl.text)} onAyahClick={onAyahClick} ayahDataKeys={ayahDataKeys} />
                    </div>
                  ))}
                </div>
              )}

              {/* Findings */}
              {section.findings.map((f, i) => <FindingCard key={i} finding={f} onAyahClick={onAyahClick} ayahDataKeys={ayahDataKeys}  />)}

              {/* Technical details */}
              {section.technicals.map((tech, i) => <TechnicalDetail key={i} technical={tech}  />)}
            </>
          )}
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      WORD DETAILS — occurrences, qiraat, co-occurrence
    ───────────────────────────────────────────────────────────*/
    function WordDetails({ word }) {
      const [open, setOpen] = useState(false);
      const w = word;
      const hasOcc = w.occurrences && w.occurrences.type !== "none";
      const hasQir = w.qiraat && w.qiraat.length > 0;
      const hasCooc = w.cooccurrence && w.cooccurrence.length > 0;
      if (!hasOcc && !hasQir && !hasCooc) return null;

      const counts = [];
      if (hasOcc) counts.push(w.occurrences.type === "all" ? "occ" : "occ");
      if (hasQir) counts.push(`${w.qiraat.length} qir`);
      if (hasCooc) counts.push(`${w.cooccurrence.length} co-occ`);

      return (
        <div style={{ marginTop: "8px" }}>
          <div onClick={() => setOpen(!open)} style={{
            fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.teal,
            textTransform: "uppercase", letterSpacing: "0.06em", cursor: "pointer",
            display: "flex", alignItems: "center", gap: "6px", userSelect: "none",
            padding: "6px 0",
          }}>
            <span style={{ fontSize: "8px" }}>{open ? "\u25BC" : "\u25B6"}</span>
            Details
            <span style={{ fontWeight: 400, color: c.inkFaint, textTransform: "none" }}>({counts.join(", ")})</span>
          </div>
          {open && (
            <div style={{ paddingLeft: "8px", borderLeft: `2px solid ${c.tealLight}` }}>
              {/* Occurrences */}
              {hasOcc && (
                <div style={{ marginBottom: "10px" }}>
                  <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.oxford, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: "4px" }}>
                    Occurrences
                    {w.occurrences.total && <span style={{ fontWeight: 400, color: c.inkFaint, textTransform: "none" }}> ({w.occurrences.total} total)</span>}
                  </div>
                  {w.occurrences.groups && w.occurrences.groups.map((g, gi) => (
                    <div key={gi} style={{ marginBottom: "6px" }}>
                      <div style={{ fontFamily: font.sans, fontSize: "11px", color: c.ink, fontWeight: 600, marginBottom: "2px" }}>
                        {g.label} <span style={{ fontWeight: 400, color: c.inkFaint }}>({g.count})</span>
                      </div>
                      {g.examples && g.examples.map((ex, ei) => (
                        <div key={ei} style={{ fontFamily: font.serif, fontSize: "11px", color: c.inkLight, lineHeight: "1.5", paddingLeft: "8px" }}>
                          <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.teal, fontWeight: 700, marginRight: "4px" }}>{ex.ref}</span>
                          <span style={{ fontFamily: font.arabic, fontSize: "14px", color: c.oxford }}>{ex.arabic}</span>
                          {ex.gloss && <span style={{ fontStyle: "italic", marginLeft: "4px" }}>— {ex.gloss}</span>}
                        </div>
                      ))}
                    </div>
                  ))}
                  {w.occurrences.type === "all" && w.occurrences.refs && (
                    <div style={{ fontFamily: font.sans, fontSize: "11px", color: c.inkLight }}>
                      {w.occurrences.refs.map((r, ri) => (
                        <span key={ri} style={{ marginRight: "6px", fontFamily: font.sans, fontSize: "10px", color: c.teal, fontWeight: 600 }}>{r.ref || r}</span>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* Qira'at variants */}
              {hasQir && (
                <div style={{ marginBottom: "10px" }}>
                  <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.oxford, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: "4px" }}>
                    Qira'at Variants ({w.qiraat.length})
                  </div>
                  {w.qiraat.map((q, qi) => (
                    <div key={qi} style={{ marginBottom: "6px", padding: "6px 8px", background: c.linen, borderRadius: "4px" }}>
                      <div style={{ display: "flex", alignItems: "baseline", gap: "6px", flexWrap: "wrap", marginBottom: "2px" }}>
                        <span style={{ fontFamily: font.arabic, fontSize: "16px", color: c.oxford }}>{q.arabic}</span>
                        <span style={{ fontFamily: font.serif, fontSize: "12px", color: c.teal, fontStyle: "italic" }}>{q.translit}</span>
                        {q.type && <span style={{ fontFamily: font.sans, fontSize: "9px", color: c.white, background: c.arcQiraat, padding: "1px 5px", borderRadius: "2px", fontWeight: 700 }}>{q.type}</span>}
                      </div>
                      {q.note && <div style={{ fontFamily: font.serif, fontSize: "11px", color: c.inkLight, lineHeight: "1.5" }}>
                        {q.note}
                      </div>}
                    </div>
                  ))}
                </div>
              )}

              {/* Co-occurrences */}
              {hasCooc && (
                <div style={{ marginBottom: "10px" }}>
                  <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.oxford, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: "4px" }}>
                    Co-occurrences ({w.cooccurrence.length})
                  </div>
                  {w.cooccurrence.map((co, ci) => (
                    <div key={ci} style={{ marginBottom: "6px", padding: "6px 8px", background: c.linen, borderRadius: "4px" }}>
                      <div style={{ display: "flex", alignItems: "baseline", gap: "6px", marginBottom: "2px" }}>
                        <span style={{ fontFamily: font.sans, fontSize: "11px", fontWeight: 700, color: c.ink }}>{co.coRoot}</span>
                        <span style={{ fontFamily: font.arabic, fontSize: "14px", color: c.oxford }}>{co.coRootAr}</span>
                        <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.inkFaint }}>({co.count}x)</span>
                      </div>
                      {co.note && <div style={{ fontFamily: font.serif, fontSize: "11px", color: c.inkLight, lineHeight: "1.5" }}>
                        {co.note}
                      </div>}
                      {co.refs && <div style={{ fontFamily: font.sans, fontSize: "10px", color: c.teal, marginTop: "3px", lineHeight: "1.6" }}>
                        {co.refs.split(";").map((r, ri) => (
                          <span key={ri} style={{ fontWeight: 600, marginRight: "6px" }}>{r.trim()}</span>
                        ))}
                      </div>}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      AYAH DETAIL SIDEBAR — word-by-word analysis
    ───────────────────────────────────────────────────────────*/
    function AyahSidebar({ ayahData, onClose }) {
      if (!ayahData) return null;
      const sNum = String(ayahData.surah);
      const sName = surahNames[sNum] ? `${surahNames[sNum]} (${sNum})` : sNum;
      return (
        <div style={{
          width: "380px", minWidth: "380px", background: c.white, borderLeft: `1px solid ${c.border}`,
          display: "flex", flexDirection: "column", height: "100%",
        }}>
          {/* Header */}
          <div style={{ padding: "14px 18px", borderBottom: `1px solid ${c.border}`, display: "flex", alignItems: "center", gap: "12px", flexShrink: 0 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: font.sans, fontSize: "14px", fontWeight: 700, color: c.oxford }}>{sName} : {ayahData.key.split(":")[1]}</div>
              <div style={{ fontFamily: font.arabic, fontSize: "18px", color: c.oxford, direction: "rtl", lineHeight: "1.8" }}>
                {ayahData.words.map(w => w.arabic).join(" ")}
              </div>
            </div>
            <button onClick={onClose} style={{
              fontFamily: font.sans, fontSize: "18px", color: c.inkFaint, background: "none", border: "none",
              cursor: "pointer", padding: "4px 8px",
            }}>&times;</button>
          </div>

          {/* Readings — first always visible, alternatives collapsible */}
          {ayahData.readings && ayahData.readings.length > 0 && (
            <ReadingsPanel readings={ayahData.readings}  />
          )}

          {/* Badge Legend — collapsible, sticky */}
          <BadgeLegend />

          {/* Word list */}
          <div style={{ flex: 1, overflowY: "auto", padding: "0 18px 24px" }}>
            {ayahData.words.map(w => (
              <div key={w.id} style={{ padding: "16px 0", borderBottom: `1px solid ${c.border}` }}>
                {/* Word header */}
                <div style={{ display: "flex", alignItems: "baseline", gap: "8px", flexWrap: "wrap", marginBottom: "4px" }}>
                  <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.inkFaint, fontWeight: 700 }}>#{w.id}</span>
                  <span style={{ fontFamily: font.arabic, fontSize: "24px", color: c.oxford, lineHeight: "1.8" }}>{w.arabic}</span>
                  <span style={{ fontFamily: font.serif, fontSize: "14px", color: c.teal, fontStyle: "italic" }}>({w.translit})</span>
                  {w.tag && <span style={{ fontFamily: font.sans, fontSize: "9px", color: c.white, background: c.claret, padding: "2px 6px", borderRadius: "2px", textTransform: "uppercase", fontWeight: 700 }}>{w.tag}</span>}
                </div>
                <div style={{ fontFamily: font.serif, fontSize: "13px", color: c.inkLight, fontStyle: "italic", marginBottom: "10px" }}>
{w.gloss}
                </div>

                {/* Root & Grammar */}
                {w.root !== "\u2014" && (
                  <div style={{ marginBottom: "6px" }}>
                    <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.claret, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em" }}>Root </span>
                    <span style={{ fontFamily: font.serif, fontSize: "13px", color: c.ink }}>{w.root}</span>
                  </div>
                )}
                <div style={{ marginBottom: "10px" }}>
                  <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.claret, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em" }}>Grammar </span>
                  <span style={{ fontFamily: font.serif, fontSize: "13px", color: c.ink, lineHeight: "1.6" }}>{w.grammar}</span>
                </div>

                {/* Semantic range (compact) with temporal badges */}
                {(w.semantics || []).map((s, si) => {
                  const { badge, text } = parseSemanticBadge(s);
                  return (
                    <div key={si} style={{ fontFamily: font.serif, fontSize: "12px", color: c.inkLight, lineHeight: "1.6", paddingLeft: "10px", display: "flex", alignItems: "flex-start", gap: "6px" }}>
                      <span style={{ color: c.claret, fontWeight: "bold", flexShrink: 0 }}>{"\u00B7"}</span>
                      {badge && (
                        <span style={{ fontSize: "9px", fontWeight: 700, padding: "1px 5px", borderRadius: "3px", background: badge.bg, color: "white", flexShrink: 0 }}>{badge.display}</span>
                      )}
                      <span>{text.replace(/;\s*/g, " \u00B7 ")}</span>
                    </div>
                  );
                })}

                {/* Temporal / futuristic reads */}
                {w.temporal && (
                  <div style={{ marginTop: "6px", marginBottom: "4px" }}>
                    <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.claret, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em" }}>Temporal </span>
                    <span style={{ fontFamily: font.serif, fontSize: "13px", color: c.ink }}>{w.temporal}</span>
                  </div>
                )}

                {/* Critical notes (collapsed) */}
                {w.critical && w.critical.length > 0 && (
                  <CollapsibleNote label={`Critical (${w.critical.length})`} color={c.claret} bg={c.claretBg}>
                    {(w.critical || []).map((item, idx) => (
                      <div key={idx} style={{ marginBottom: idx < w.critical.length - 1 ? "10px" : 0 }}>
                        <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.teal, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: "2px" }}>
                          {item.cat}
                        </div>
                        <div style={{ fontFamily: font.serif, fontSize: "12px", color: c.ink, marginBottom: "2px" }}>
                          {item.pattern}
                        </div>
                        <div style={{ fontFamily: font.serif, fontSize: "12px", color: c.inkLight, fontStyle: "italic" }}>
                          → {item.kernel}
                        </div>
                      </div>
                    ))}
                  </CollapsibleNote>
                )}

                {/* Details: occurrences, qiraat, co-occurrence */}
                <WordDetails word={w} />
              </div>
            ))}

            {/* Structure section — collapsible */}
            {ayahData.structure && (
              <StructurePanel structure={ayahData.structure} />
            )}

            {/* Questions section — collapsible */}
            {ayahData.questions && ayahData.questions.length > 0 && (
              <QuestionsPanel questions={ayahData.questions} />
            )}
          </div>
        </div>
      );
    }

    /* Badge Legend — collapsible, sticky below readings */
    function BadgeLegend() {
      const [expanded, setExpanded] = useState(false);
      return (
        <div style={{ padding: "6px 18px", borderBottom: `1px solid ${c.border}`, background: c.wheat, position: "sticky", top: 0, zIndex: 10 }}>
          <button onClick={() => setExpanded(!expanded)} style={{
            fontFamily: font.sans, fontSize: "10px", fontWeight: 600, color: c.inkLight,
            background: "transparent", border: "none", cursor: "pointer", padding: "2px 0",
            display: "flex", alignItems: "center", gap: "4px", width: "100%"
          }}>
            <span style={{ fontSize: "10px" }}>{expanded ? "\u25BC" : "\u25B6"}</span>
            Badge Legend
          </button>
          {expanded && (
            <div style={{ marginTop: "8px", display: "flex", flexWrap: "wrap", gap: "16px" }}>
              <div>
                <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", marginBottom: "4px" }}>Critical</div>
                {Object.entries(criticalLegend).map(([k, v]) => (
                  <div key={k} style={{ fontFamily: font.sans, fontSize: "11px", color: c.ink, marginBottom: "2px" }}>
                    <span style={{ fontWeight: 700, color: c.teal, marginRight: "6px" }}>{k}</span>{v}
                  </div>
                ))}
              </div>
              <div>
                <div style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.inkFaint, textTransform: "uppercase", marginBottom: "4px" }}>Temporal</div>
                {Object.entries(temporalLegend).map(([k, info]) => (
                  <div key={k} style={{ fontFamily: font.sans, fontSize: "11px", color: c.ink, marginBottom: "2px", display: "flex", alignItems: "center", gap: "6px" }}>
                    <span style={{ fontSize: "9px", fontWeight: 700, padding: "1px 5px", borderRadius: "3px", background: info.bg, color: "white" }}>{info.display}</span>
                    {info.desc}
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* Readings panel — first visible, alternatives collapsible */
    function ReadingsPanel({ readings }) {
      const [expanded, setExpanded] = useState(false);
      const first = readings[0];
      const hasMore = readings.length > 1;
      return (
        <div style={{ padding: "10px 18px", borderBottom: `1px solid ${c.border}`, background: c.linen }}>
          <div style={{ fontFamily: font.serif, fontSize: "13px", color: c.ink, lineHeight: "1.6", fontStyle: "italic" }}>
            {first.text}
          </div>
          {hasMore && (
            <button onClick={() => setExpanded(!expanded)} style={{
              marginTop: "6px", fontFamily: font.sans, fontSize: "10px", fontWeight: 600,
              color: c.teal, background: "transparent", border: "none", cursor: "pointer",
              padding: "2px 0", display: "flex", alignItems: "center", gap: "4px",
            }}>
              <span style={{ fontSize: "12px" }}>{expanded ? "\u25BC" : "\u25B6"}</span>
              {expanded
                ? "Hide alternatives"
                : `+${readings.length - 1} alternative reading${readings.length - 1 > 1 ? "s" : ""}`
              }
            </button>
          )}
          {expanded && readings.slice(1).map((reading, idx) => (
            <div key={idx} style={{ marginTop: "8px", paddingTop: "8px", borderTop: `1px solid ${c.border}`, fontFamily: font.serif, fontSize: "13px", color: c.inkLight, lineHeight: "1.6", fontStyle: "italic" }}>
              <span style={{ fontFamily: font.sans, fontSize: "9px", fontWeight: 700, color: c.teal, textTransform: "uppercase", letterSpacing: "0.05em", fontStyle: "normal", marginRight: "8px" }}>
                Reading {idx + 2}
              </span>
              {reading.text}
            </div>
          ))}
        </div>
      );
    }

    /* Structure panel — collapsible at end of word list */
    function StructurePanel({ structure }) {
      const [open, setOpen] = useState(false);
      const summary = structure.summary;
      const beats = structure.beats || [];
      return (
        <div style={{ borderTop: `2px solid ${c.teal}`, marginTop: "20px", paddingTop: "12px" }}>
          <div onClick={() => setOpen(!open)} style={{
            fontFamily: font.sans, fontSize: "11px", fontWeight: 700, color: c.teal,
            textTransform: "uppercase", letterSpacing: "0.06em", cursor: "pointer",
            display: "flex", alignItems: "center", gap: "6px", userSelect: "none",
            marginBottom: "8px",
          }}>
            <span style={{ fontSize: "10px" }}>{open ? "\u25BC" : "\u25B6"}</span>
            Structure Analysis
          </div>
          {open && (
            <div>
              {beats.length > 0 && beats.map((beat, bi) => (
                <div key={bi} style={{ marginBottom: "10px", padding: "8px 10px", background: c.linen, borderRadius: "4px" }}>
                  <div style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.oxford, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: "4px" }}>
                    {beat.label}
                  </div>
                  {beat.lines && beat.lines.map((line, li) => (
                    <div key={li} style={{ display: "flex", alignItems: "baseline", gap: "8px", marginBottom: "2px" }}>
                      <span style={{ fontFamily: font.arabic, fontSize: "16px", color: c.oxford }}>{line.arabic}</span>
                      <span style={{ fontFamily: font.serif, fontSize: "12px", color: c.teal, fontStyle: "italic" }}>{line.translit}</span>
                      <span style={{ fontFamily: font.serif, fontSize: "12px", color: c.inkLight }}>— {line.english}</span>
                    </div>
                  ))}
                </div>
              ))}
              {summary && (
                <div style={{ fontFamily: font.serif, fontSize: "12px", color: c.ink, lineHeight: "1.6", padding: "8px 0" }}>
                  {summary}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* Questions panel — collapsible at end of word list */
    function QuestionsPanel({ questions }) {
      const [open, setOpen] = useState(false);
      const items = questions || [];
      return (
        <div style={{ borderTop: `2px solid ${c.gold}`, marginTop: "16px", paddingTop: "12px" }}>
          <div onClick={() => setOpen(!open)} style={{
            fontFamily: font.sans, fontSize: "11px", fontWeight: 700, color: c.gold,
            textTransform: "uppercase", letterSpacing: "0.06em", cursor: "pointer",
            display: "flex", alignItems: "center", gap: "6px", userSelect: "none",
            marginBottom: "8px",
          }}>
            <span style={{ fontSize: "10px" }}>{open ? "\u25BC" : "\u25B6"}</span>
            Questions ({items.length})
          </div>
          {open && (
            <div>
              {items.map((q, qi) => (
                <div key={qi} style={{ marginBottom: "8px", padding: "8px 10px", background: "#FFF8E1", borderRadius: "4px", borderLeft: `3px solid ${c.gold}` }}>
                  <div style={{ fontFamily: font.serif, fontSize: "12px", color: c.ink, lineHeight: "1.6" }}>{q}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function CollapsibleNote({ label, color, bg, children }) {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ borderLeft: `3px solid ${color}`, background: bg, padding: "8px 12px", borderRadius: "0 3px 3px 0", marginTop: "8px" }}>
          <div onClick={() => setOpen(!open)} style={{ fontFamily: font.sans, fontSize: "10px", color, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", cursor: "pointer", display: "flex", alignItems: "center", gap: "4px", userSelect: "none" }}>
            <span style={{ fontSize: "8px" }}>{open ? "\u25BC" : "\u25B6"}</span>
            {label}
          </div>
          {open && <div style={{ fontFamily: font.serif, fontSize: "13px", color: c.ink, lineHeight: "1.6", marginTop: "4px", whiteSpace: "pre-line" }}>{children}</div>}
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      FILE LOADER — landing screen
    ───────────────────────────────────────────────────────────*/
    function FileLoader({ onFileLoaded }) {
      const [dragging, setDragging] = useState(false);
      const [status, setStatus] = useState("");
      const fileRef = useRef(null);

      const handleFile = useCallback(async (file) => {
        if (!file.name.endsWith(".json")) {
          setStatus("Please select a guided discovery .json file.");
          return;
        }
        setStatus("Reading...");
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (data.sections && data.arcs) {
            onFileLoaded(data);
          } else {
            setStatus("This doesn't look like a guided discovery JSON file.");
          }
        } catch {
          setStatus("Could not parse the JSON file.");
        }
      }, [onFileLoaded]);

      const handleDrop = useCallback((e) => {
        e.preventDefault(); setDragging(false);
        const files = Array.from(e.dataTransfer.files);
        const json = files.find(f => f.name.endsWith(".json"));
        if (json) handleFile(json);
        else setStatus("No .json file found.");
      }, [handleFile]);

      return (
        <div onDragOver={(e) => { e.preventDefault(); setDragging(true); }} onDragLeave={() => setDragging(false)} onDrop={handleDrop}
          style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100vh", background: c.paper, fontFamily: font.serif, color: c.ink }}>
          <div style={{ border: `2px dashed ${dragging ? c.teal : c.border}`, borderRadius: "8px", padding: "60px 48px", textAlign: "center", maxWidth: "520px", width: "90%", background: dragging ? c.tealLight : c.white, transition: "all 0.2s ease" }}>
            <div style={{ fontFamily: font.arabic, fontSize: "28px", color: c.oxford, marginBottom: "8px", lineHeight: "1.8" }}>
              بِسْمِ اللَّهِ
            </div>
            <div style={{ fontSize: "20px", color: c.ink, marginBottom: "6px", fontWeight: 600 }}>Guided Discovery Reader</div>
            <div style={{ fontSize: "14px", color: c.inkLight, marginBottom: "32px" }}>Load a guided discovery JSON file to begin</div>
            <input ref={fileRef} type="file" accept=".json" style={{ display: "none" }} onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])} />
            <button onClick={() => fileRef.current.click()} style={{ fontFamily: font.sans, fontSize: "14px", fontWeight: 700, background: c.teal, color: c.white, border: "none", padding: "12px 28px", borderRadius: "4px", cursor: "pointer", display: "block", width: "100%" }}>
              Select guided-discovery .json file
            </button>
            <div style={{ fontFamily: font.sans, fontSize: "12px", color: c.inkFaint, marginTop: "20px" }}>You can also drag and drop the file here</div>
            {status && <div style={{ fontFamily: font.sans, fontSize: "13px", color: c.claret, marginTop: "16px", padding: "8px 12px", background: c.claretBg, borderRadius: "3px" }}>{status}</div>}
          </div>
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      BOUNDARY SIDEBAR COMPONENTS
    ───────────────────────────────────────────────────────────*/
    const labelColors = {
      root_handoff: { bg: "#0D7680", label: "Root" },
      semantic_bridge: { bg: "#2E7D32", label: "Semantic" },
      particle_bridge: { bg: "#F57C00", label: "Particle" },
      pronoun_chain: { bg: "#7B1FA2", label: "Pronoun" },
      scene_shift: { bg: "#C62828", label: "Scene" },
      register_shift: { bg: "#1565C0", label: "Register" },
    };

    function BoundaryFinding({ finding }) {
      const [textExpanded, setTextExpanded] = useState(false);
      const needsTruncation = finding.text.length > 300;

      return (
        <div style={{ marginBottom: "12px", padding: "8px", background: c.white, borderRadius: "4px", border: `1px solid ${c.border}` }}>
          <div style={{ display: "flex", flexWrap: "wrap", gap: "4px", marginBottom: "6px" }}>
            {finding.labels.map((label, li) => {
              const lc = labelColors[label] || { bg: "#666", label: label };
              return (
                <span key={li} style={{
                  fontSize: "9px",
                  fontWeight: 700,
                  padding: "2px 6px",
                  borderRadius: "3px",
                  background: lc.bg,
                  color: "white",
                  fontFamily: font.sans,
                  textTransform: "uppercase"
                }}>
                  {lc.label}
                </span>
              );
            })}
          </div>
          <div style={{ fontFamily: font.serif, fontSize: "12px", color: c.ink, lineHeight: "1.6" }}>
            {needsTruncation && !textExpanded ? finding.text.slice(0, 300) + "..." : finding.text}
          </div>
          {needsTruncation && (
            <button
              onClick={() => setTextExpanded(!textExpanded)}
              style={{
                marginTop: "6px",
                fontFamily: font.sans,
                fontSize: "10px",
                fontWeight: 600,
                color: c.teal,
                background: "transparent",
                border: "none",
                cursor: "pointer",
                padding: "2px 0"
              }}
            >
              [{textExpanded ? "less" : "more"}]
            </button>
          )}
        </div>
      );
    }

    function BoundarySection({ title, findings, direction, expanded, onToggle }) {
      if (!findings || findings.length === 0) return null;

      return (
        <div style={{ borderBottom: `1px solid ${c.border}` }}>
          <div
            onClick={onToggle}
            style={{
              padding: "10px 12px",
              background: c.linen,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              gap: "8px",
              userSelect: "none"
            }}
          >
            <span style={{ fontSize: "12px", color: c.teal }}>{expanded ? "▼" : "▶"}</span>
            <span style={{ fontFamily: font.sans, fontSize: "11px", fontWeight: 700, color: c.ink }}>
              {direction === "before" ? "←" : ""} {title} {direction === "after" ? "→" : ""}
            </span>
            <span style={{ fontFamily: font.sans, fontSize: "10px", color: c.inkFaint, marginLeft: "auto" }}>
              {findings.length} finding{findings.length !== 1 ? "s" : ""}
            </span>
          </div>
          {expanded && (
            <div style={{ padding: "8px", maxHeight: "40vh", overflowY: "auto" }}>
              {findings.map((f, i) => (
                <BoundaryFinding key={i} finding={f} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function BoundarySidebar({ surah, ayah, boundaries }) {
      const [beforeExpanded, setBeforeExpanded] = useState(true);
      const [afterExpanded, setAfterExpanded] = useState(true);
      const [collapsed, setCollapsed] = useState(false);

      const surahBoundaries = boundaries[surah];
      if (!surahBoundaries) return null;

      const beforeKey = `${ayah - 1}-${ayah}`;
      const afterKey = `${ayah}-${ayah + 1}`;

      const beforeFindings = surahBoundaries[beforeKey] || [];
      const afterFindings = surahBoundaries[afterKey] || [];

      if (beforeFindings.length === 0 && afterFindings.length === 0) return null;

      // Collapsed state: narrow strip with expand button
      if (collapsed) {
        return (
          <div style={{
            width: "32px",
            minWidth: "32px",
            background: c.paper,
            borderLeft: `1px solid ${c.border}`,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            paddingTop: "10px"
          }}>
            <button
              onClick={() => setCollapsed(false)}
              style={{
                background: c.claret,
                color: c.white,
                border: "none",
                borderRadius: "3px",
                padding: "6px 4px",
                cursor: "pointer",
                fontFamily: font.sans,
                fontSize: "10px",
                fontWeight: 700,
                writingMode: "vertical-rl",
                textOrientation: "mixed"
              }}
              title="Show boundary analysis"
            >
              ◀ Boundary
            </button>
          </div>
        );
      }

      return (
        <div style={{
          width: "300px",
          minWidth: "300px",
          background: c.white,
          borderLeft: `1px solid ${c.border}`,
          display: "flex",
          flexDirection: "column",
          overflow: "hidden"
        }}>
          <div style={{
            padding: "10px 12px",
            borderBottom: `1px solid ${c.border}`,
            background: c.paper,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between"
          }}>
            <span style={{
              fontFamily: font.sans,
              fontSize: "11px",
              fontWeight: 700,
              color: c.claret,
              textTransform: "uppercase",
              letterSpacing: "0.05em"
            }}>
              Boundary Analysis
            </span>
            <button
              onClick={() => setCollapsed(true)}
              style={{
                background: "transparent",
                color: c.inkFaint,
                border: `1px solid ${c.border}`,
                borderRadius: "3px",
                padding: "2px 6px",
                cursor: "pointer",
                fontFamily: font.sans,
                fontSize: "11px",
                fontWeight: 700
              }}
              title="Hide boundary analysis"
            >
              ▶▶
            </button>
          </div>
          <div style={{ flex: 1, overflowY: "auto" }}>
            <BoundarySection
              title={`${surah}:${ayah - 1} → ${surah}:${ayah}`}
              findings={beforeFindings}
              direction="before"
              expanded={beforeExpanded}
              onToggle={() => setBeforeExpanded(!beforeExpanded)}
            />
            <BoundarySection
              title={`${surah}:${ayah} → ${surah}:${ayah + 1}`}
              findings={afterFindings}
              direction="after"
              expanded={afterExpanded}
              onToggle={() => setAfterExpanded(!afterExpanded)}
            />
          </div>
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      MAIN READER
    ───────────────────────────────────────────────────────────*/
    function GuidedDiscoveryReader({ data, boundaries: initialBoundaries }) {
      const [highlightAyah, setHighlightAyah] = useState(null);
      const [selectedAyah, setSelectedAyah] = useState(null);
      const [boundaries, setBoundaries] = useState(initialBoundaries || {});
      const [ayahDataMap, setAyahDataMap] = useState(__EMBEDDED_AYAH_DATA__);
      const contentRef = useRef(null);
      const ayahFilesRef = useRef(null);
      const boundaryFilesRef = useRef(null);

      const { sections, arcs, threads, openQuestions, handoff, surah } = data;

      const allAyahRefs = useMemo(() => {
        const refs = [];
        for (const s of sections) for (const a of s.ayahs) if (!refs.includes(a.ref)) refs.push(a.ref);
        return refs;
      }, [sections]);

      const ayahDataKeys = useMemo(() => Object.keys(ayahDataMap), [ayahDataMap]);

      const stats = useMemo(() => {
        let confirmed = 0, discovery = 0, tension = 0;
        for (const s of sections) for (const f of s.findings) {
          if (f.type === "CONFIRMED") confirmed++;
          if (f.type === "DISCOVERY") discovery++;
          if (f.type === "TENSION") tension++;
        }
        return { confirmed, discovery, tension, threads: Object.keys(threads).length, arcs: arcs.length };
      }, [sections, threads, arcs]);

      const handleLoadAyahFiles = useCallback(async (e) => {
        const files = e.target.files;
        if (!files.length) return;
        const ayahs = await processAyahFiles(files);
        const map = {};
        ayahs.forEach(a => { map[a.key] = a; });
        setAyahDataMap(prev => ({ ...prev, ...map }));
        // Also check for boundary files in the same selection
        const boundaryData = await processBoundaryFiles(files);
        if (boundaryData.length > 0) {
          const boundaryMap = {};
          boundaryData.forEach(b => {
            boundaryMap[String(b.surah)] = b.pairs;
          });
          setBoundaries(prev => ({ ...prev, ...boundaryMap }));
        }
        e.target.value = "";
      }, []);

      const handleLoadBoundaryFiles = useCallback(async (e) => {
        const files = e.target.files;
        if (!files.length) return;
        const boundaryData = await processBoundaryFiles(files);
        const boundaryMap = {};
        boundaryData.forEach(b => {
          boundaryMap[String(b.surah)] = b.pairs;
        });
        setBoundaries(prev => ({ ...prev, ...boundaryMap }));
        e.target.value = "";
      }, []);

      const handleAyahClick = useCallback((ref) => {
        if (ayahDataMap[ref]) setSelectedAyah(ref);
      }, [ayahDataMap]);

      return (
        <div style={{ display: "flex", flexDirection: "column", height: "100vh", background: c.paper, fontFamily: font.serif, color: c.ink }}>
          {/* TOP BAR */}
          <div style={{ background: c.white, borderBottom: `1px solid ${c.border}`, padding: "12px 28px", display: "flex", alignItems: "center", gap: "16px", flexShrink: 0 }}>
            <div style={{ fontFamily: font.sans, fontSize: "16px", fontWeight: 700, color: c.oxford }}>
              {surahNames[surah] || surah} ({surah}) — Guided Discovery
            </div>
            <div style={{ flex: 1 }} />

            {/* Stats */}
            <div style={{ display: "flex", gap: "12px", fontFamily: font.sans, fontSize: "11px" }}>
              <span style={{ color: c.green }}>{"\u25CF"} {stats.confirmed}</span>
              <span style={{ color: c.gold }}>{"\u25CF"} {stats.discovery}</span>
              <span style={{ color: c.red }}>{"\u25CF"} {stats.tension}</span>
              <span style={{ color: c.inkFaint }}>| {stats.threads} threads</span>
            </div>

            {/* Load ayah data button */}
            <input ref={ayahFilesRef} type="file" webkitdirectory="" directory="" multiple style={{ display: "none" }} onChange={handleLoadAyahFiles} />
            <button onClick={() => ayahFilesRef.current.click()} style={{
              fontFamily: font.sans, fontSize: "11px", fontWeight: 600, background: "transparent",
              color: c.teal, border: `1px solid ${c.teal}`, padding: "5px 12px", borderRadius: "3px",
              cursor: "pointer", display: "flex", alignItems: "center", gap: "4px",
            }}>
              <span style={{ fontSize: "14px", lineHeight: "1" }}>+</span>
              {ayahDataKeys.length > 0 ? `${ayahDataKeys.length} ayahs loaded` : "Load ayah data"}
            </button>

            {/* Load boundary data button */}
            <input ref={boundaryFilesRef} type="file" multiple accept=".json" style={{ display: "none" }} onChange={handleLoadBoundaryFiles} />
            <button onClick={() => boundaryFilesRef.current.click()} style={{
              fontFamily: font.sans, fontSize: "11px", fontWeight: 600, background: "transparent",
              color: Object.keys(boundaries).length > 0 ? c.green : c.claret,
              border: `1px solid ${Object.keys(boundaries).length > 0 ? c.green : c.claret}`,
              padding: "5px 12px", borderRadius: "3px",
              cursor: "pointer", display: "flex", alignItems: "center", gap: "4px",
            }}>
              <span style={{ fontSize: "14px", lineHeight: "1" }}>+</span>
              {Object.keys(boundaries).length > 0 ? `Boundaries loaded` : "Load boundaries"}
            </button>
          </div>

          {/* BODY: MAIN + OPTIONAL SIDEBAR */}
          <div style={{ display: "flex", flex: 1, overflow: "hidden" }}>

            {/* Main content */}
            <div ref={contentRef} style={{ flex: 1, overflowY: "auto" }}>

              {/* Sticky arc diagram */}
              <StickyArcPanel arcs={arcs} ayahRefs={allAyahRefs} highlightAyah={highlightAyah} onAyahClick={handleAyahClick}  />

              <div style={{ maxWidth: "800px", margin: "0 auto", padding: "16px 28px 60px" }}>

                {/* Legend */}
                <Legend />

                {/* Thread timeline */}
                <ThreadTimeline threads={threads} onAyahClick={handleAyahClick} />

                {/* Sections */}
                {sections.map((s, i) => (
                  <Section key={i} section={s} onAyahHover={setHighlightAyah} onAyahClick={handleAyahClick} ayahDataKeys={ayahDataKeys}  />
                ))}

                {/* Open Questions */}
                {openQuestions && openQuestions.length > 0 && (
                  <div style={{ marginBottom: "48px" }}>
                    <div style={{ borderBottom: `2px solid ${c.claret}`, paddingBottom: "8px", marginBottom: "20px" }}>
                      <span style={{ fontFamily: font.sans, fontSize: "18px", fontWeight: 700, color: c.claret }}>Open Questions</span>
                    </div>
                    {openQuestions.map((q, i) => (
                      <div key={i} style={{ padding: "14px 18px", marginBottom: "10px", borderLeft: `3px solid ${c.teal}`, background: c.white, borderRadius: "0 6px 6px 0" }}>
                        <span style={{ fontFamily: font.sans, fontSize: "11px", color: c.teal, fontWeight: 700, marginRight: "8px" }}>{q.ref}</span>
                        <span style={{ fontFamily: font.serif, fontSize: "14px", color: c.ink, lineHeight: "1.7" }}>{t(q.text)}</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Handoff */}
                {handoff && handoff.length > 0 && (
                  <div style={{ background: c.white, border: `1px solid ${c.border}`, borderRadius: "6px", padding: "20px 24px", marginBottom: "48px" }}>
                    <div style={{ fontFamily: font.sans, fontSize: "10px", fontWeight: 700, color: c.claret, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: "12px" }}>Phase 5 Handoff</div>
                    {handoff.map((h, i) => <div key={i} style={{ fontFamily: font.serif, fontSize: "14px", color: c.inkLight, lineHeight: "1.7" }}>{t(h)}</div>)}
                  </div>
                )}
              </div>
            </div>

            {/* Ayah detail sidebar */}
            {selectedAyah && ayahDataMap[selectedAyah] && (
              <AyahSidebar
                ayahData={ayahDataMap[selectedAyah]}
                onClose={() => setSelectedAyah(null)}
                             />
            )}

            {/* Boundary sidebar */}
            {selectedAyah && Object.keys(boundaries).length > 0 && (() => {
              const [s, a] = selectedAyah.split(':');
              return (
                <BoundarySidebar
                  surah={s}
                  ayah={parseInt(a, 10)}
                  boundaries={boundaries}
                />
              );
            })()}
          </div>
        </div>
      );
    }

    /*───────────────────────────────────────────────────────────
      APP
    ───────────────────────────────────────────────────────────*/
    function App() {
      return <GuidedDiscoveryReader data={__EMBEDDED_GD_DATA__} boundaries={__EMBEDDED_BOUNDARY_DATA__} />;
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
