رٌۭ رَّحِيمٌۭ", "english": "For those who swear abstinence from their wives, a waiting of four months; then if they return, indeed God is ghafūr (forgiving), raḥīm (continuously merciful)"}, {"ref": "3:129", "arabic": "وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ", "english": "To God belongs what is in the heavens and the earth; He forgives whom He wills and punishes whom He wills — and God is ghafūr (forgiving), raḥīm (continuously merciful)"}]}, {"label": "C. Gerund raḥma and verbal forms — mercy as action, request, and divine bestowal", "count": "~134 ayahs", "examples": [{"ref": "18:98", "arabic": "قَالَ هَٰذَا رَحْمَةٌۭ مِّن رَّبِّى ۖ فَإِذَا جَآءَ وَعْدُ رَبِّى جَعَلَهُۥ دَكَّآءَ ۖ وَكَانَ وَعْدُ رَبِّى حَقًّۭا", "english": "He said: This is raḥma (mercy) from my Lord; but when the promise of my Lord comes, He will level it — and the promise of my Lord is ever true"}, {"ref": "2:64", "arabic": "ثُمَّ تَوَلَّيْتُم مِّنۢ بَعْدِ ذَٰلِكَ ۖ فَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ لَكُنتُم مِّنَ ٱلْخَٰسِرِينَ", "english": "Then you turned away after that — were it not for the grace of God upon you and His raḥma (mercy), you would have been among the losers"}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Irreg", "type": "CE", "note": "Same variant as word 1 — accusative ending on ar-Raḥīm transforms it from genitive attribute to object of exclamatory praise (manṣūb 'alā al-madḥ). Both words move together into the accusative, maintaining their paired relationship.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Irreg", "type": "CE", "note": "Same variant as word 1 — nominative ending on ar-Raḥīm makes it part of a new nominal sentence (khabar or second mubtada'). The nominative breaks both words free from the genitive chain of 1:2.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;1:1;3:129;6:12;17:110;19:93;22:5;22:65;25:6;25:48", "note": "Same root as word 1 — r-ḥ-m paired with heavens/elevation; mercy descends from transcendence"}, {"coRoot": "w-l-y", "coRootAr": "و ل ي", "count": "15", "refs": "2:64;2:226;2:286;7:155;8:75;9:71;18:58;19:45;28:43;33:5", "note": "Same root as word 1 — mercy and guardianship/allegiance as complementary divine attributes"}], "critical": [{"cat": "FORM", "pattern": "fa'il can be active or passive", "kernel": "Lane's: qatil = killed or killer by context"}, {"cat": "SEM", "pattern": "passive possibility marhum creates resonance", "kernel": "Same pattern describes God's mercy AND human receiving"}, {"cat": "INTER", "pattern": "9:128 raḥīm applied to Prophet", "kernel": "Only divine attribute in 1:3 that bridges divine-human"}, {"cat": "STRUCT", "pattern": "case variants move Rahman-Rahim as unit", "kernel": "Inseparability = compound concept not two attributes"}], "tag": "CRITICAL"}], "questions": ["Why does the Quran derive two distinct divine names from the same root r-ḥ-m rather than using two different roots? What does the morphological differentiation (fa'lān vs fa'īl) achieve that two separate roots could not?", "The shawādhdh variant ar-Razzāq suggests an ancient reading tradition that equated mercy with provision. Does this reflect a pre-Islamic Arabian understanding of divine care as primarily material sustenance?", "Given that ar-Raḥīm can apply to humans (9:128) but ar-Raḥmān cannot, does 1:3 implicitly set a boundary between the mercy humans can embody and the mercy that exceeds creaturely capacity?", "The accusative variant (manṣūb 'alā al-madḥ) transforms these names from attributes to exclamatory objects of praise. Does this syntactic shift change the theological register — from description to devotion?", "If the root r-ḥ-m originates in \"womb\" (raḥm/raḥim), does the Quran's most fundamental description of God begin with a feminine-coded biological image? What are the implications of this etymological origin for understanding tawhīd?", "The nominative variant breaks the genitive chain from 1:2, creating an independent sentence. Does this suggest that mercy is not merely an attribute of lordship (rabb al-'ālamīn) but a self-standing reality?", "ar-Raḥmān appears 57 times in the Quran, often in contexts of cosmic sovereignty (19:93, 25:59). Does the pairing with ar-Raḥīm in 1:3 serve to temper the awesome aspect of ar-Raḥmān with the intimate aspect of ar-Raḥīm?", "The repeated rā'-ḥā' phonetic combination creates an enveloping, breathy sound. Is this phonetic texture deliberately chosen to mirror the semantic content of gentle, encompassing care — and if so, does this constitute a form of onomatopoeia at the morphological level?", "In a futuristic reading, if ar-Raḥmān represents systemic mercy (natural laws, ecosystems) and ar-Raḥīm represents adaptive mercy (responsive care), does 1:3 anticipate a distinction between embedded intelligence (the constants of the universe) and responsive intelligence (consciousness)?", "The co-occurrence of r-ḥ-m with s-m-w (17 instances) suggests mercy is consistently associated with height/transcendence. Does this pairing imply that mercy is a descending force — something that flows from above to below, from the transcendent to the immanent?"], "key": "1:3"}, "1:4": {"surah": 1, "ayah": 4, "arabic": "مَٰلِكِ يَوْمِ ٱلدِّينِ", "transliteration": "māliki yawmi d-dīni", "readings": [{"text": "Master/Owner of the Day of Recompense — māliki (active participle, Form I) indicates ongoing, active possession; yawm as a bounded temporal unit; dīn as requital/recompense, the settling of accounts", "rationale": "Active participle māliki implies continuous ownership, not a title. Dīn as recompense (from d-y-n = debt, obligation) makes the Day one of settling accounts. The genitive chain māliki yawmi d-dīni creates a three-link iḍāfa: owner-of → day-of → recompense."}, {"text": "Sovereign/King of the Day of Judgment — reading maliki (variant canonical reading) as royal authority rather than ownership; dīn as judgment/decree", "rationale": "The canonical variant maliki (without alif) shifts from ownership to sovereignty. Malik implies ruling authority, governance, command — not merely possessing. Dīn here as judgment/decree (from the sense of d-y-n = to judge, to impose law)."}, {"text": "Possessor of the Day of Religion/Way-of-Life — dīn not as judgment event but as ongoing system of conduct, practice, life-path; the Day when all ways-of-life are weighed", "rationale": "Dīn carries the meaning of religion, practice, habitual way. This reading makes yawm al-dīn the Day when every dīn (life-system, practiced path) is evaluated — not merely a court session but a comprehensive accounting of how one lived."}, {"text": "Owner of the Time-cycle of Debt — yawm as any temporal cycle (not limited to a single day), dīn as debt/obligation; ownership of the entire cycle in which debts come due", "rationale": "Yawm can mean era, period, age — not only a 24-hour day. Dīn from d-y-n = to owe, to be indebted. This reading opens the phrase beyond eschatology: ownership of every cycle in which debts (moral, existential, cosmic) mature."}, {"text": "Controller of the Moment of Systemic Accounting — futuristic reading where dīn encompasses any evaluative system (algorithmic, ecological, cosmic); yawm as the critical inflection point when the system's accounts are settled", "rationale": "Dīn as system-of-accounting extends to any framework where actions produce consequences: ecological feedback loops, data-driven audit systems, cosmic equilibrium. Mālik as controller/administrator of the moment when the system settles. This reading is temporally neutral — equally valid for 7th-century moral reckoning and future systemic accountability."}], "structure": {"beats": [{"label": "The sovereign attribution", "lines": [{"arabic": "مَٰلِكِ يَوْمِ ٱلدِّينِ", "translit": "māliki yawmi d-dīni", "english": "Master of the Day of Recompense"}]}], "summary": "The entire ayah is a single genitive chain (iḍāfa) of three elements: māliki → yawmi → al-dīni. There is no verb, no predicate — this is a nominal attribute in apposition to the divine names in 1:2-3 (al-Raḥmān al-Raḥīm). The triple iḍāfa creates cascading dependency: the identity of the Master depends on specifying WHICH day, and that day's identity depends on specifying WHAT system of recompense. The definite article on al-dīn makes the recompense specific and known, while māliki is made definite through its iḍāfa connection. The absence of a verb suspends time — this is not an event but an eternal attribute."}, "words": [{"id": 1, "arabic": "مَٰلِكِ", "translit": "māliki", "gloss": "master, owner, possessor", "root": "م ل ك (m-l-k)", "grammar": "Active participle (ism fāʿil) of Form I malaka, genitive case (majrūr) by apposition to preceding attributes or as second element of implied iḍāfa with Allāh. Pattern: fāʿil. The alif after mīm extends the participial form, emphasizing continuous/habitual ownership.", "semantics": ["مَلَكَ (malaka, I): to possess, to own, to have power over, to control, to have authority over", "مَلَّكَ (mallaka, II): to make someone owner, to give possession, to invest with authority", "أَمْلَكَ (amlaka, IV): to enable possession, to put in control of", "تَمَلَّكَ (tamallaka, V): to take possession of, to appropriate, to seize control", "مُلْك (mulk): dominion, sovereignty, kingdom, realm — the domain over which authority is exercised", "مَلِك (malik): king, sovereign, ruler — one who governs by authority and decree", "مَالِك (mālik): owner, possessor, master — one who holds something as property", "مِلْك (milk): property, estate, that which is owned — Lane's: \"a thing that is in one's possession\"", "مَمْلُوك (mamlūk): owned, enslaved, that which is possessed — passive participle", "مَلَكُوت (malakūt): absolute dominion, celestial sovereignty — used in Quran for divine realm (6:75, 7:185, 23:88, 36:83)", "مَلَك (malak): angel — classical derivation debated; possibly from m-l-k (one sent with authority) or from l-'-k (to send as messenger)", "Classical extensions (Lane's, Lisan al-Arab): m-l-k carries the core sense of \"having something firmly in one's grasp\" — physical possession, political authority, and existential control all flow from this. Lane's notes malaka l-ʿajīna = \"he kneaded the dough thoroughly\" — total mastery over material. Lisan al-Arab: malaka nafsahu = \"he controlled himself.\"", "[M] Modern/futuristic: ownership of systems, data sovereignty, administrative control over processes and networks", "Core concept: firm grasp and authority over something — ranging from physical possession to cosmic sovereignty"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle (ism fāʿil) — mālik/mālikūn as possessor/owner", "count": "~3 ayahs", "examples": [{"ref": "36:71", "arabic": "أَوَلَمْ يَرَوْا۟ أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَآ أَنْعَٰمًۭا فَهُمْ لَهَا مَٰلِكُونَ", "english": "Have they not seen that We created for them, from what Our hands made, livestock — so they are owners of them"}, {"ref": "3:26", "arabic": "قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلْمُلْكِ تُؤْتِى ٱلْمُلْكَ مَن تَشَآءُ وَتَنزِعُ ٱلْمُلْكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُ ۖ بِيَدِكَ ٱلْخَيْرُ ۖ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ", "english": "Say: O God, Owner of sovereignty, You give sovereignty to whom You will and strip sovereignty from whom You will, You honor whom You will and abase whom You will — in Your hand is all good; You are powerful over everything"}]}, {"label": "B. Noun (mulk/malik/malakūt) — sovereignty, kingdom, dominion", "count": "~96+ ayahs", "examples": [{"ref": "6:73", "arabic": "وَهُوَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۖ وَيَوْمَ يَقُولُ كُن فَيَكُونُ ۚ قَوْلُهُ ٱلْحَقُّ ۚ وَلَهُ ٱلْمُلْكُ يَوْمَ يُنفَخُ فِى ٱلصُّورِ ۚ عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ ۚ وَهُوَ ٱلْحَكِيمُ ٱلْخَبِيرُ", "english": "And He is the one who created the heavens and the earth in truth. And the day He says \"Be\" and it is — His word is the truth. And His is the sovereignty on the day the trumpet is blown — Knower of the unseen and the witnessed. And He is the Wise, the Aware."}, {"ref": "22:56", "arabic": "ٱلْمُلْكُ يَوْمَئِذٍۢ لِّلَّهِ يَحْكُمُ بَيْنَهُمْ ۚ فَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فِى جَنَّٰتِ ٱلنَّعِيمِ", "english": "The sovereignty on that day belongs to God — He judges between them. Those who believed and did righteous deeds are in gardens of bliss."}]}, {"label": "C. Verb (malaka) — to possess, to control, to own", "count": "~16 ayahs", "examples": [{"ref": "34:40", "arabic": "وَيَوْمَ يَحْشُرُهُمْ جَمِيعًۭا ثُمَّ يَقُولُ لِلْمَلَٰٓئِكَةِ أَهَٰٓؤُلَآءِ إِيَّاكُمْ كَانُوا۟ يَعْبُدُونَ", "english": "And the day He gathers them all together, then says to the angels: Were these the ones who used to worship you?"}]}]}, "qiraat": [{"arabic": "مَلِكِ", "translit": "maliki", "status": "7", "type": "Lvw", "note": "Canonical variant: shifts from active participle mālik (owner/possessor) to the nominal form malik (king/sovereign). Mālik implies ongoing personal ownership and direct control; malik implies royal authority, governance, and decree. The semantic distinction is between one who holds property versus one who rules.", "source": "erquran.org"}, {"arabic": "مَلْكِ", "translit": "malki", "status": "Irreg", "type": "skn", "note": "Irregular reading with sukūn on lām: compressed form of malik, retaining the sense of kingship/sovereignty but in a rarer morphological pattern. May reflect a dialectal pronunciation.", "source": "erquran.org"}, {"arabic": "مِلْكِ", "translit": "milki", "status": "tashif", "type": "vw", "note": "Scribal variant with kasra on mīm: milki = \"property/estate of the Day of Recompense\" — shifts from agent (owner) to the thing owned (property). Makes the Day itself a possession rather than naming its possessor.", "source": "erquran.org"}, {"arabic": "مَلَّاكِ", "translit": "mallāki", "status": "Irreg", "type": "Lvw", "note": "Irregular: intensive form (faʿʿāl pattern) — \"the supreme/ultimate owner.\" Intensification suggests absolute, unrivaled ownership beyond ordinary possession.", "source": "erquran.org"}, {"arabic": "مَالِكَ", "translit": "mālika", "status": "14", "type": "CE", "note": "Fourteen-reading variant with fatḥa on final kāf: nominative/accusative rather than genitive. Changes the syntactic relationship — could make mālik a vocative (O Owner!) or an accusative of specification.", "source": "erquran.org"}, {"arabic": "مَلِكَ", "translit": "malika", "status": "Irreg", "type": "CE", "note": "Irregular: malik with fatḥa ending — \"O King!\" as vocative, or past tense verb \"he ruled/owned the Day.\" If verbal, transforms the phrase from nominal attribute to past-tense assertion.", "source": "erquran.org"}, {"arabic": "مَلَكَ يَوْمَ", "translit": "malaka yawma", "status": "Irreg", "type": "Stx|V↔N|CE", "note": "Irregular: verbal reading — \"He ruled/owned the Day of Recompense.\" Transforms the nominal chain into a verb-object structure. The iḍāfa dissolves; malaka becomes a past-tense verb with yawma as its direct object in accusative. Fundamentally changes the clause from attributive description to historical assertion.", "source": "erquran.org"}, {"arabic": "مَالِكْ", "translit": "mālik", "status": "Gramm", "type": "CE", "note": "Grammatical variant with sukūn on final kāf: pausal form of mālik, stopping the iḍāfa chain. In pause, the genitive ending drops. This is a recitation-style variant rather than a semantic one.", "source": "erquran.org"}, {"arabic": "مَلِيكِ", "translit": "malīki", "status": "shawadhdh", "type": "Lvw", "note": "Anomalous: malīk pattern (faʿīl) — intensive adjective meaning \"supremely royal, mighty king.\" The faʿīl pattern adds permanence and intensity to the quality. Lisan al-Arab: malīk = \"a king whose authority extends far and deep.\"", "source": "erquran.org"}, {"arabic": "مَلِكُ", "translit": "maliku", "status": "Irreg", "type": "CE", "note": "Irregular: maliku with ḍamma ending — nominative case, possibly as mubtadaʾ (subject): \"The King of the Day of Recompense [is God].\" Breaks the attributive chain and starts a new nominal sentence.", "source": "erquran.org"}, {"arabic": "مَالِكٌ يَوْمَ", "translit": "mālikun yawma", "status": "Irreg", "type": "id|CE", "note": "Irregular: tanwīn on mālik breaks the iḍāfa — mālikun becomes an indefinite noun \"an owner\" with yawma as adverbial accusative: \"an Owner on the Day of Recompense.\" The indefiniteness is theologically provocative — potentially universalizing ownership.", "source": "erquran.org"}, {"arabic": "مَالِكُ", "translit": "māliku", "status": "Irreg", "type": "CE", "note": "Irregular: mālik with ḍamma — nominative, functioning as mubtadaʾ: \"The Owner of the Day of Recompense [is He].\" Creates an independent nominal sentence rather than a chain of attributes.", "source": "erquran.org"}, {"arabic": "مِالِكِ", "translit": "meliki", "status": "Irreg", "type": "im", "note": "Irregular: imāla (vowel tilting) on the mīm — the fatḥa tilts toward kasra, producing a sound between \"ma\" and \"me.\" Dialectal phonetic variant, no semantic change.", "source": "erquran.org"}, {"arabic": "مَلَّاكَ", "translit": "mallāka", "status": "shii", "type": "Lvw|CE", "note": "Shia reading: intensive form with fatḥa ending — \"O Supreme Owner!\" as vocative. Combines the intensification of faʿʿāl with direct address. Emphatic, liturgical quality.", "source": "erquran.org"}, {"arabic": "مَالِكًا يَوْمَ", "translit": "mālikan yawma", "status": "shawadhdh", "type": "id|Tnw", "note": "Anomalous: tanwīn on mālik with accusative yawma — \"as an Owner on the Day.\" The accusative tanwīn could make mālik a ḥāl (circumstantial state): \"while being an owner on the Day.\" Shifts from permanent attribute to temporal condition.", "source": "erquran.org"}, {"arabic": "مَلِكًا يَوْمَ", "translit": "malikan yawma", "status": "shawadhdh", "type": "id|Tnw|Lvw", "note": "Anomalous: malik with tanwīn and accusative yawma — \"as a King on the Day.\" Combines the sovereignty reading (malik) with circumstantial accusative. \"He is praised as a King specifically on the Day of Recompense.\"", "source": "erquran.org"}, {"arabic": "مَلِيكُ", "translit": "malīku", "status": "shawadhdh", "type": "Lvw|CE", "note": "Anomalous: malīk with ḍamma — nominative, as mubtadaʾ. \"The Supreme King of the Day of Recompense [is God].\" Independent sentence with the most intensive royal title.", "source": "erquran.org"}, {"arabic": "مَالِكِۦ", "translit": "mālikī", "status": "tashif", "type": "madd", "note": "Scribal variant: extended final vowel (yāʾ al-madd) on mālikī — possible dialectal elongation of the genitive ending, or a first-person possessive reading \"my Owner of the Day.\"", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "y-w-m", "coRootAr": "ي و م", "count": "12", "refs": "1:4;6:73;21:103;22:56;25:22;25:25;25:26;34:40;45:27;69:17", "note": "Sovereignty (m-l-k) paired with temporal marker (y-w-m): divine authority manifested at the critical moment. In 6:73 and 22:56 sovereignty explicitly belongs to God \"on that Day.\" Pattern: m-l-k defines WHO rules, y-w-m defines WHEN that rule becomes absolute. IN THIS AYAH"}, {"coRoot": "d-y-n", "coRootAr": "د ي ن", "count": "2", "refs": "1:4;12:76", "note": "Sovereignty (m-l-k) paired with recompense/law (d-y-n): in 1:4 God owns the Day of dīn; in 12:76 Yusuf could not take his brother under the dīn (law/system) of the malik (king). Same root pair, parallel structure: the malik's authority operates within a dīn-system. IN THIS AYAH"}], "critical": [{"cat": "GRAM", "pattern": "malik vs malik in canonical readings", "kernel": "Owner-possessor vs king-sovereign — both mutawatir"}, {"cat": "SEM", "pattern": "malik = hands-on possession", "kernel": "Direct personal ownership like holding property"}, {"cat": "SEM", "pattern": "malik = regal authority from throne", "kernel": "Governing without touching — sovereign distance"}, {"cat": "GRAM", "pattern": "triple idafa malik-yawm-din is rare", "kernel": "Cascading specificity narrows to precise claim"}, {"cat": "SEM", "pattern": "verbal variant malaka = past-tense event", "kernel": "Dissolves timeless attribute into completed action"}, {"cat": "FORM", "pattern": "intensive mallak malik push to superlative", "kernel": "Beyond both standard readings into ultimate sovereignty"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "يَوْمِ", "translit": "yawmi", "gloss": "day, time, period, era", "root": "gün, zaman, dönem, çağ", "grammar": "ي و م (y-w-m)", "semantics": ["[7C] يَوْم (yawm): day (from sunrise to sunset), a full day (24 hours)", "[7C] يَوْم (yawm): a period, an era, an age, an epoch — not limited to a single solar day. Quran: \"a day with your Lord is like a thousand years of what you count\" (22:47), \"a day whose measure is fifty thousand years\" (70:4)", "[7C] يَوْم (yawm): a specific occasion, a notable event, a momentous time — \"the days of God\" (ayyām Allāh, 14:5) = the significant events/epochs of divine action", "[7C] أَيَّام (ayyām, plural): days, periods, eras — used for both literal days and historical epochs", "Lane's Lexicon: yawm = \"a space of time, from the rising of the sun to its setting\" AND \"any period of time\" AND \"a particular time in which an event occurs.\" Also yawm al-ḥarb = \"day of battle,\" yawm al-faṣl = \"day of decision.\" Classical Arabic uses yawm to mark any critical juncture.", "[F] Modern/futuristic: any critical temporal inflection point — systemic reset, epoch boundary, moment of truth in any evaluative process. Not limited to eschatological \"Day\" — can mean the moment when any system's accounts are settled.", "Core concept: a bounded period of time, especially one marked by a decisive event or reckoning"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Adverbial temporal (yawma as \"on the day when...\")", "count": "~107 ayahs", "examples": [{"ref": "34:40", "arabic": "وَيَوْمَ يَحْشُرُهُمْ جَمِيعًۭا ثُمَّ يَقُولُ لِلْمَلَٰٓئِكَةِ أَهَٰٓؤُلَآءِ إِيَّاكُمْ كَانُوا۟ يَعْبُدُونَ", "english": "And the day He gathers them all together, then says to the angels: Were these the ones who used to worship you?"}, {"ref": "2:85", "arabic": "ثُمَّ أَنتُمْ هَٰٓؤُلَآءِ تَقْتُلُونَ أَنفُسَكُمْ وَتُخْرِجُونَ فَرِيقًۭا مِّنكُم مِّن دِيَٰرِهِمْ تَظَٰهَرُونَ عَلَيْهِم بِٱلْإِثْمِ وَٱلْعُدْوَٰنِ وَإِن يَأْتُوكُمْ أُسَٰرَىٰ تُفَٰدُوهُمْ وَهُوَ مُحَرَّمٌ عَلَيْكُمْ إِخْرَاجُهُمْ ۚ أَفَتُؤْمِنُونَ بِبَعْضِ ٱلْكِتَٰبِ وَتَكْفُرُونَ بِبَعْضٍۢ ۚ فَمَا جَزَآءُ مَن يَفْعَلُ ذَٰلِكَ مِنكُمْ إِلَّا خِزْىٌۭ فِى ٱلْحَيَوٰةِ ٱلدُّنْيَا ۖ وَيَوْمَ ٱلْقِيَٰمَةِ يُرَدُّونَ إِلَىٰٓ أَشَدِّ ٱلْعَذَابِ ۗ وَمَا ٱللَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَ", "english": "Then there you are killing yourselves and expelling a group from among you from their homes... and on the Day of Resurrection they will be returned to the most severe punishment. And God is not unaware of what you do."}]}, {"label": "B. Genitive construct (yawmi as \"day of X\")", "count": "~47 ayahs", "examples": [{"ref": "2:80", "arabic": "وَقَالُوا۟ لَن تَمَسَّنَا ٱلنَّارُ إِلَّآ أَيَّامًۭا مَّعْدُودَةًۭ ۚ قُلْ أَتَّخَذْتُمْ عِندَ ٱللَّهِ عَهْدًۭا فَلَن يُخْلِفَ ٱللَّهُ عَهْدَهُۥٓ ۖ أَمْ تَقُولُونَ عَلَى ٱللَّهِ مَا لَا تَعْلَمُونَ", "english": "And they said: The fire will not touch us except for a counted number of days. Say: Have you taken a covenant with God — for God will not break His covenant — or do you say about God what you do not know?"}, {"ref": "7:51", "arabic": "ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَهُمْ لَهْوًۭا وَلَعِبًۭا وَغَرَّتْهُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۚ فَٱلْيَوْمَ نَنسَىٰهُمْ كَمَا نَسُوا۟ لِقَآءَ يَوْمِهِمْ هَٰذَا وَمَا كَانُوا۟ بِـَٔايَٰتِنَا يَجْحَدُونَ", "english": "Those who took their dīn as play and amusement and were deceived by the worldly life — so today We forget them as they forgot the meeting of this Day of theirs, and as they used to reject Our signs."}]}, {"label": "C. Predicate/subject usage (yawm as the topic itself)", "count": "~18 ayahs", "examples": [{"ref": "21:103", "arabic": "لَا يَحْزُنُهُمُ ٱلْفَزَعُ ٱلْأَكْبَرُ وَتَتَلَقَّىٰهُمُ ٱلْمَلَٰٓئِكَةُ هَٰذَا يَوْمُكُمُ ٱلَّذِى كُنتُمْ تُوعَدُونَ", "english": "The Great Terror will not grieve them, and the angels will receive them: This is your Day which you were promised."}]}]}, "qiraat": [{"arabic": "مَلَكَ يَوْمَ", "translit": "malaka yawma", "status": "Irreg", "type": "Stx|V↔N|CE", "note": "When read as verbal construction, yawm shifts from genitive to accusative — it becomes the direct object of the verb malaka rather than a muḍāf ilayhi. This transforms yawm from a temporal container in a possessive chain to a thing acted upon.", "source": "erquran.org"}, {"arabic": "مَالِكٌ يَوْمَ", "translit": "mālikun yawma", "status": "Irreg", "type": "id|CE", "note": "When tanwīn breaks iḍāfa, yawm shifts to adverbial accusative — \"an Owner on the Day\" rather than \"Owner of the Day.\" The temporal relationship changes from possession to coincidence.", "source": "erquran.org"}, {"arabic": "مَالِكًا يَوْمَ", "translit": "mālikan yawma", "status": "shawadhdh", "type": "id|Tnw", "note": "Anomalous: yawm in accusative as temporal adverb. \"Being an owner on the Day of Recompense\" — temporal circumstance rather than genitive possession.", "source": "erquran.org"}, {"arabic": "مَلِكًا يَوْمَ", "translit": "malikan yawma", "status": "shawadhdh", "type": "id|Tnw|Lvw", "note": "Anomalous: yawm accusative with malik. \"Being a king on the Day\" — sovereignty as circumstantial state.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-y-n", "coRootAr": "د ي ن", "count": "17", "refs": "1:4;18:19;3:24;7:51;9:29;11:84;15:35;24:25;30:43;37:20", "note": "Day (y-w-m) paired with recompense/religion (d-y-n): the most frequent pairing, appearing 17 times. The phrase yawm al-dīn appears repeatedly as a fixed eschatological formula. In 7:51 and 3:24 the dīn is something people take lightly, and the yawm is when this is exposed. IN THIS AYAH"}, {"coRoot": "m-l-k", "coRootAr": "م ل ك", "count": "12", "refs": "1:4;6:73;21:103;22:56;25:22;25:25;25:26;34:40;45:27;69:17", "note": "Day (y-w-m) paired with sovereignty (m-l-k): 12 co-occurrences. In 6:73 and 22:56 \"sovereignty on that Day belongs to God\" — the temporal marker specifies the moment when sovereignty becomes absolute and undivided. IN THIS AYAH"}], "critical": [], "tag": "Noun (ism), genitive case (majrūr) as second element of iḍāfa with māliki. Definite through forward iḍāfa with al-dīn. Functions as temporal container specifying WHEN the ownership/sovereignty applies."}, {"id": 3, "arabic": "ٱلدِّينِ", "translit": "ad-dīni", "gloss": "recompense, debt, judgment, religion, way of life, law", "root": "د ي ن (d-y-n)", "grammar": "Noun (ism), genitive case (majrūr) as second element of iḍāfa with yawmi. Definite through the article al-. The definiteness makes the dīn specific and known — THE recompense, not any recompense.", "semantics": ["[7C] دَانَ (dāna, I): to owe a debt, to be indebted, to be obligated; to submit, to obey; to judge, to requite, to recompense; to practice habitually, to follow a way", "[7C] دَيَّنَ (dayyana, II): to lend, to give credit; to make someone owe; to condemn", "[7C] أَدَانَ (adāna, IV): to lend, to give on credit", "[7C] تَدَيَّنَ (tadayyana, V): to borrow, to take on debt", "[7C] دِين (dīn): religion, faith, creed; system of life, way of conduct; judgment, recompense, requital; obedience, submission; law, ordinance, custom", "[7C] دَيْن (dayn): debt, monetary obligation, what is owed — longest ayah in Quran (2:282) is about dayn (debt contracts)", "[7C] دَيَّان (dayyān): judge, recompenser, requiter — Lane's: \"one who requites, rewards, or punishes; a judge, a ruler\"", "Lane's Lexicon extensive: dāna lahu = \"he submitted/obeyed him\"; dāna bihi = \"he practiced it as religion\"; dānahu = \"he judged/requited him\"; dīn = \"obedience\" AND \"compulsion\" AND \"subjugation\" AND \"ascendancy\" AND \"government\" AND \"management\" AND \"custom/habit\" AND \"state/condition.\" The root carries an extraordinary tension: the one who owes (debtor) and the one who judges (creditor) are both expressed through the same root.", "Lisan al-Arab: adds dāna nafsahu = \"he reckoned with himself, he held himself accountable\" — self-judgment. Also: al-dīn = \"the rain\" in some dialectal usage (that which comes down from above, as judgment descends).", "[F] Modern/futuristic: any evaluative/accountability system — financial audit, algorithmic scoring, ecological consequence cycle, data governance framework. Dīn as the systematic structure through which actions produce traceable consequences.", "Core concept: the reciprocal relationship between action and consequence — encompassing debt, judgment, submission, and systematic accountability"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Abstract noun — dīn as religion/way/system", "count": "~94 ayahs", "examples": [{"ref": "3:85", "arabic": "وَمَن يَبْتَغِ غَيْرَ ٱلْإِسْلَٰمِ دِينًۭا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِى ٱلْءَاخِرَةِ مِنَ ٱلْخَٰسِرِينَ", "english": "And whoever seeks other than submission (al-islām) as a dīn (way of life/system), it will never be accepted from them, and in the Hereafter they will be among the losers."}, {"ref": "4:125", "arabic": "وَمَنْ أَحْسَنُ دِينًۭا مِّمَّنْ أَسْلَمَ وَجْهَهُۥ لِلَّهِ وَهُوَ مُحْسِنٌۭ وَٱتَّبَعَ مِلَّةَ إِبْرَٰهِيمَ حَنِيفًۭا ۗ وَٱتَّخَذَ ٱللَّهُ إِبْرَٰهِيمَ خَلِيلًۭا", "english": "And who is better in dīn (way of life) than one who submits his face to God while being a doer of good and follows the way of Ibrahim, inclining toward truth? And God took Ibrahim as an intimate friend."}, {"ref": "7:51", "arabic": "ٱلَّذِينَ ٱتَّخَذُوا۟ دِينَهُمْ لَهْوًۭا وَلَعِبًۭا وَغَرَّتْهُمُ ٱلْحَيَوٰةُ ٱلدُّنْيَا ۚ فَٱلْيَوْمَ نَنسَىٰهُمْ كَمَا نَسُوا۟ لِقَآءَ يَوْمِهِمْ هَٰذَا وَمَا كَانُوا۟ بِـَٔايَٰتِنَا يَجْحَدُونَ", "english": "Those who took their dīn (way of life) as play and amusement and were deceived by worldly life — so today We forget them as they forgot the meeting of this Day of theirs."}]}, {"label": "B. Concrete noun — dayn as monetary debt", "count": "~15 ayahs", "examples": [{"ref": "2:193", "arabic": "وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٌۭ وَيَكُونَ ٱلدِّينُ لِلَّهِ ۖ فَإِنِ ٱنتَهَوْا۟ فَلَا عُدْوَٰنَ إِلَّا عَلَى ٱلظَّٰلِمِينَ", "english": "And fight them until there is no more persecution and the dīn (system/authority) belongs to God. But if they cease, then no aggression except against the wrongdoers."}]}, {"label": "C. Proper noun — yawm al-dīn as eschatological formula", "count": "~10 ayahs", "examples": [{"ref": "12:76", "arabic": "فَبَدَأَ بِأَوْعِيَتِهِمْ قَبْلَ وِعَآءِ أَخِيهِ ثُمَّ ٱسْتَخْرَجَهَا مِن وِعَآءِ أَخِيهِ ۚ كَذَٰلِكَ كِدْنَا لِيُوسُفَ ۖ مَا كَانَ لِيَأْخُذَ أَخَاهُ فِى دِينِ ٱلْمَلِكِ إِلَّآ أَن يَشَآءَ ٱللَّهُ", "english": "So he began with their containers before his brother's container, then extracted it from his brother's container. Thus did We plan for Yusuf. He could not have taken his brother under the dīn (law/system) of the king, except that God willed."}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "y-w-m", "coRootAr": "ي و م", "count": "17", "refs": "1:4;18:19;3:24;7:51;9:29;11:84;15:35;24:25;30:43;37:20", "note": "Recompense/religion (d-y-n) paired with day/time (y-w-m): highest frequency co-occurrence (17 times). The yawm al-dīn formula establishes a fixed eschatological unit. In 15:35 the respite extends \"to the Day of the dīn.\" In 37:20 the disbelievers exclaim \"this is the Day of the dīn!\" Pattern: dīn defines the NATURE of the reckoning, yawm defines its TEMPORALITY. IN THIS AYAH"}, {"coRoot": "m-l-k", "coRootAr": "م ل ك", "count": "2", "refs": "1:4;12:76", "note": "Recompense/law (d-y-n) paired with sovereignty (m-l-k): only 2 co-occurrences. In 1:4 God is mālik of yawm al-dīn; in 12:76 Yusuf cannot act within the dīn of the malik (king). The parallelism is striking: in both cases, a sovereign's dīn-system determines what is possible. The earthly king's dīn limits even a prophet; God's dīn encompasses all. IN THIS AYAH"}], "critical": [{"cat": "SEM", "pattern": "d-y-n = debt judgment religion submission", "kernel": "All four meanings simultaneously active in yawm al-din"}, {"cat": "GRAM", "pattern": "definite al-din = THE specific known system", "kernel": "Not a din but THE ultimate system of recompense"}, {"cat": "INTER", "pattern": "12:76 din al-malik mirrors 1:4", "kernel": "Earthly legal system vs divine accounting — structural echo"}, {"cat": "SEM", "pattern": "dana nafsahu = held himself accountable", "kernel": "Din can be self-reckoning not only external judgment"}, {"cat": "SEM", "pattern": "din as law/jurisdiction in 12:76", "kernel": "Same root-pair m-l-k + d-y-n in both verses"}], "tag": "CRITICAL"}], "questions": ["Why does the Quran use mālik (active participle, ongoing ownership) rather than a finite verb — does the participial form deliberately suspend temporality, making this ownership eternal rather than event-bound?", "The 12:76 parallel (dīn al-malik) shows an earthly king's legal system limiting even a prophet — does the structural echo in 1:4 (mālik yawm al-dīn) imply that the divine dīn-system is the only one WITHOUT limits?", "If dīn carries both \"debt\" and \"judgment,\" is yawm al-dīn the Day when debts mature AND the Day when the creditor (God) settles accounts — making God simultaneously the creditor and the judge?", "The root d-y-n generates both \"religion\" (habitual practice) and \"recompense\" (consequence) — does this etymological link mean that every act of religious practice IS itself a form of debt-creation, accumulating toward a reckoning?", "Lane's notes dāna nafsahu = \"he held himself accountable.\" Does yawm al-dīn also allow the reading \"the Day of self-reckoning\" — a moment when beings confront their own accounts without external judgment?", "The extraordinary number of qira'at variants on mālik/malik (21 variants) suggests this word was a site of intense interpretive pressure in early recitation communities. Does this density of variants reflect genuine uncertainty, or deliberate preservation of semantic multiplicity?", "The verbal variant malaka yawma transforms a timeless attribute into a past-tense event — \"He ruled the Day.\" Does this reading imply the Day of Recompense has already occurred, or that God's sovereignty over it was established in pre-eternity?", "If yawm can mean \"era\" or \"epoch\" (as in 22:47 where a day equals a thousand years), does yawm al-dīn refer to an instantaneous event or an extended period of systemic accounting?", "The mālikun yawma variant (indefinite, with tanwīn) makes the owner indefinite — \"an owner on the Day.\" Could this be theologically radical, suggesting that ownership on that Day could extend beyond a single entity?", "The phonetic arc mīm-lām-kāf (lips → tongue → throat) physically enacts deepening reach. Is this a deliberate selection — a word whose very pronunciation performs the concept of extending authority from the surface to the depths?"], "key": "1:4"}, "1:5": {"surah": 1, "ayah": 5, "arabic": "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", "transliteration": "iyyāka na'budu wa-iyyāka nasta'īnu", "readings": [{"text": "You alone we devote ourselves to, and You alone we seek enablement from — the fronting of the accusative pronoun (iyyāka) before both verbs enforces absolute exclusivity (qaṣr/ḥaṣr), restricting worship and aid-seeking to a single addressee", "rationale": "The standard reading treats both clauses as parallel declarations of exclusive devotion: na'budu covers all forms of service/submission, nasta'īnu covers all forms of seeking aid. The fronted object creates ḥaṣr (restriction) — \"You and no other.\""}, {"text": "You alone we serve as devoted subjects, and from You alone we draw sustaining power — reading 'ibāda as political/social servitude (not ritual worship) and isti'āna as drawing ongoing sustenance/energy", "rationale": "Root '-b-d carries \"to be a slave, to serve a master\" as its primary classical meaning — servitude before it was spiritualized into worship. Nasta'īnu from '-w-n encompasses drawing power, sustenance, and operational capacity. This reading frames the relationship as sovereign-subject, not worshipper-deity."}, {"text": "It is to You that we direct our productive labor, and it is from You that we seek collaborative partnership — reading 'abd as labor/productive work and isti'āna as mutual cooperation", "rationale": "Lane's Lexicon attests '-b-d as \"to labor, to toil, to make a road smooth by treading\" (ta'bīd al-ṭarīq). The X form of '-w-n (ista'āna) includes seeking cooperative partnership, not merely passive receipt of aid. This reading opens a participatory dynamic."}, {"text": "You alone we engage with in total presence, and You alone we seek alignment with — reading the chiastic structure as progressive intensification from embodied engagement ('ibāda) to cosmic alignment (isti'āna)", "rationale": "The shift from na'budu to nasta'īnu can be read as escalation: first, embodied submission/presence; then, seeking to draw upon the source of all capacity. The repetition of iyyāka is not redundant — it marks the pivot from giving (service) to receiving (aid/alignment)."}, {"text": "You alone we dedicate our systemic processes to, and You alone we request operational integration from — a futuristic reading where 'ibāda encompasses any system's dedicating its cycles to a master process, and isti'āna is requesting integration/resources from that process", "rationale": "If '-b-d at its core means \"to dedicate one's operational capacity to a master\" and '-w-n means \"to draw enabling power from a source,\" these concepts are not limited to human-divine interaction. Any conscious agent (biological or otherwise) dedicating its processes and seeking enabling resources from a source engages in this dynamic."}], "structure": {"beats": [{"label": "Exclusive devotion declaration", "lines": [{"arabic": "إِيَّاكَ نَعْبُدُ", "translit": "iyyāka na'budu", "english": "You alone we devote ourselves to"}]}, {"label": "Exclusive aid-seeking declaration", "lines": [{"arabic": "وَإِيَّاكَ نَسْتَعِينُ", "translit": "wa-iyyāka nasta'īnu", "english": "and You alone we seek aid from"}]}], "summary": "The ayah consists of two syntactically parallel clauses joined by wa. Both clauses front the restricted accusative pronoun iyyāka before the verb, creating ḥaṣr (exclusivity/restriction). The first clause (iyyāka na'budu) establishes the direction of devotion; the second (wa-iyyāka nasta'īnu) establishes the source of enablement. The parallelism is not mere repetition — it creates a chiasmus of giving (service) and receiving (aid), with the addressee as the constant pivot. The shift from Form I (na'budu) to Form X (nasta'īnu) marks grammatical escalation: simple action to seeking/requesting action. The wa connecting them can function as 'aṭf (coordination) or as marking a second, distinct dimension of the relationship."}, "words": [{"id": 1, "arabic": "إِيَّاكَ", "translit": "iyyāka", "gloss": "You alone (exclusive accusative)", "root": "أ و ي ('-w-y)", "grammar": "Detached exclusive accusative pronoun, 2nd person masculine singular. Fronted before the verb na'budu to create ḥaṣr (restriction/exclusivity). The structure \"iyyāka na'budu\" rather than \"na'buduka\" is a marked word order — the normal VSO becomes OVS, foregrounding the object to restrict the predicate exclusively to it.", "semantics": ["The pronoun iyyā- is a restricted accusative base to which pronominal suffixes attach (-ka, -hu, -hā, etc.). Classical grammarians debate whether iyyā- itself is the pronoun or merely a support for the suffix.", "Root '-w-y: to shelter, to take refuge, to repair to a place (Lane's). Also: to have compassion on, to tend toward. The mā'wā (مأوى, shelter/refuge) derives from this root.", "Classical debate: Sībawayhi treats iyyā- as an independent pronoun; al-Khalīl treats the suffix as the actual pronoun with iyyā- as support. This is unresolved in classical grammar.", "Core concept: exclusivity marker — directs the predicate to one entity and bars all others"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Fronted exclusive object with 'ibāda verbs — iyyāka/iyyāhu used to restrict worship/service", "count": "~5 ayahs", "examples": [{"ref": "2:172", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ كُلُوا۟ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْ وَٱشْكُرُوا۟ لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ", "english": "O you who have believed, eat from the good things We have provided you and be grateful to God, if it is Him (iyyāhu) you devote yourselves to"}, {"ref": "17:23", "arabic": "وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوٓا۟ إِلَّآ إِيَّاهُ وَبِٱلْوَٰلِدَيْنِ إِحْسَٰنًا", "english": "And your Lord has decreed that you devote yourselves to none but Him (iyyāhu), and to parents, excellence"}]}, {"label": "B. Shelter/refuge usage — mā'wā and verbal forms denoting taking shelter", "count": "~22 ayahs", "examples": [{"ref": "18:9", "arabic": "أَمْ حَسِبْتَ أَنَّ أَصْحَٰبَ ٱلْكَهْفِ وَٱلرَّقِيمِ كَانُوا۟ مِنْ ءَايَٰتِنَا عَجَبًا", "english": "Or did you think that the companions of the cave and the inscription were a wonder among Our signs?"}]}]}, "qiraat": [{"arabic": "هِيَّاكَ", "translit": "hiyyāka", "status": "shawādhdh", "type": "ibdāl", "note": "Replaces initial hamza with hā'. This ibdāl (letter substitution) does not change the semantic function but reflects dialectal variation in the pronunciation of the exclusivity particle. Rare, non-canonical transmission.", "source": "erquran.org"}, {"arabic": "إِيَاكَ", "translit": "iyāka", "status": "Irreg", "type": "Gm", "note": "Removes the shadda from the yā', making it light (iyāka vs iyyāka). A grammatical variant that simplifies the gemination — semantically identical but phonetically lighter.", "source": "erquran.org"}, {"arabic": "أَيَّاكَ", "translit": "ayyāka", "status": "Irreg", "type": "vw", "note": "Changes the initial vowel from kasra to fatḥa (ayyāka vs iyyāka). Reflects dialectal variation in voweling the exclusivity pronoun. No semantic change.", "source": "erquran.org"}, {"arabic": "هَيَّاكَ", "translit": "hayyāka", "status": "shawādhdh", "type": "vw|ibdāl", "note": "Combines vowel change (fatḥa on first letter) with ibdāl (hā' replacing hamza). Double deviation from standard — dialectal variant. No semantic change.", "source": "erquran.org"}, {"arabic": "وِيَّاكَ", "translit": "wiyyāka", "status": "shawādhdh", "type": "ibdāl", "note": "Replaces hamza with wāw. Another dialectal ibdāl — the exclusivity function remains identical. Extremely rare transmission.", "source": "erquran.org"}, {"arabic": "إِنَّا لَكَ", "translit": "innā laka", "status": "shawādhdh", "type": "Lx|sp|Dot", "note": "A radical lexical and structural variant: replaces the single pronoun iyyāka with a two-word phrase \"indeed we are for You\" (innā laka). This transforms the syntax entirely — from object-fronting to an independent nominal clause. Semantically, it shifts from exclusivity-through-pronoun to an assertion of belonging: \"Indeed we are Yours — we serve.\"", "source": "erquran.org"}], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "iyyaka fronting creates hasr/exclusivity", "kernel": "Object before verb = You and absolutely no other"}, {"cat": "SEM", "pattern": "marked order vs normal na'buduka", "kernel": "Normal states act; marked order restricts addressee"}, {"cat": "GRAM", "pattern": "six qira'at preserve exclusivity function", "kernel": "Phonetic variation without semantic loss"}, {"cat": "SEM", "pattern": "radical inna laka = belonging assertion", "kernel": "Restructures syntax from restriction to confession"}, {"cat": "GRAM", "pattern": "Sibawayh vs al-Khalil on iyya-", "kernel": "Pronoun or suffix — exclusivity in morpheme or position"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "نَعْبُدُ", "translit": "na'budu", "gloss": "we devote/serve/labor", "root": "ع ب د ('-b-d)", "grammar": "Imperfect verb, Form I, 1st person plural indicative (marfū'). The imperfect tense signals ongoing, habitual, or continuous action — \"we are [constantly] serving.\" No explicit object stated after the verb because it is fronted (iyyāka). Transitivity: the bundle shows MIXED (with_object: 76, without_object: 5) — 5 occurrences without explicit object (21:67, 21:98, 26:92, 37:161, 43:26), indicating intransitive use is also attested.", "semantics": ["[7C] فَعَلَ (fa'ala, I): to serve, to worship, to devote oneself to, to be a slave/servant of; to labor, to toil (Lane's: 'abada al-ṭarīqa = he trod/made smooth the road by labor)", "[7C] فَعَّلَ (fa''ala, II): to enslave, to subjugate, to reduce to servitude; ta'bīd = making a slave, also paving/smoothing a road", "[7C] تَفَعَّلَ (tafa''ala, V): to devote oneself to worship, to practice devotion intensively", "[7C] Classical extended meanings (Lane's, Lisan al-Arab): 'abd = slave, servant, human being (as servant of God); 'ibāda = worship, devotion, service; 'abīd = slaves (collective); ma'bad = place of worship, temple; ta'bīd al-ṭarīq = smoothing/paving a path by treading it", "The root carries a fundamental tension: servitude (involuntary subjection) AND devotion (voluntary dedication). A 'abd is both a slave who has no choice and a worshipper who chooses.", "[M] Modern: 'abd in social contexts = servant, employee; 'ibāda = any dedicated practice/discipline; ta'abbud = spiritual practice. The root extends to any form of systematic dedication to a purpose.", "[F] Futuristic: any agent (biological or digital) that dedicates its operational cycles exclusively to a master process or purpose can be described as performing 'ibāda of that process", "Core concept: the total dedication of one's capacity — whether as involuntary subjection or voluntary devotion — to a master, purpose, or source"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Imperfect verb (IV): worship/service declarations — \"we worship / they worship / you worship\"", "count": "~80 ayahs", "examples": [{"ref": "2:83", "arabic": "وَإِذْ أَخَذْنَا مِيثَٰقَ بَنِىٓ إِسْرَٰٓءِيلَ لَا تَعْبُدُونَ إِلَّا ٱللَّهَ وَبِٱلْوَٰلِدَيْنِ إِحْسَانًۭا وَذِى ٱلْقُرْبَىٰ وَٱلْيَتَٰمَىٰ وَٱلْمَسَٰكِينِ وَقُولُوا۟ لِلنَّاسِ حُسْنًۭا وَأَقِيمُوا۟ ٱلصَّلَوٰةَ وَءَاتُوا۟ ٱلزَّكَوٰةَ ثُمَّ تَوَلَّيْتُمْ إِلَّا قَلِيلًۭا مِّنكُمْ وَأَنتُم مُّعْرِضُونَ", "english": "And when We took the covenant from the Children of Israel: \"You shall not serve (ta'budūna) anyone but God, and to parents [show] excellence...\""}, {"ref": "2:133", "arabic": "أَمْ كُنتُمْ شُهَدَآءَ إِذْ حَضَرَ يَعْقُوبَ ٱلْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ مِنۢ بَعْدِى قَالُوا۟ نَعْبُدُ إِلَٰهَكَ وَإِلَٰهَ ءَابَآئِكَ إِبْرَٰهِۦمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ إِلَٰهًۭا وَٰحِدًۭا وَنَحْنُ لَهُۥ مُسْلِمُونَ", "english": "Were you witnesses when death approached Jacob and he said to his sons: \"What will you serve (ta'budūna) after me?\" They said: \"We will serve (na'budu) your God and the God of your fathers...\""}]}, {"label": "B. Noun forms: 'ibād/'abīd (servants/slaves) — references to humans as servants", "count": "~132 ayahs", "examples": [{"ref": "3:30", "arabic": "يَوْمَ تَجِدُ كُلُّ نَفْسٍۢ مَّا عَمِلَتْ مِنْ خَيْرٍۢ مُّحْضَرًۭا وَمَا عَمِلَتْ مِن سُوٓءٍۢ تَوَدُّ لَوْ أَنَّ بَيْنَهَا وَبَيْنَهُۥٓ أَمَدًۢا بَعِيدًۭا ۗ وَيُحَذِّرُكُمُ ٱللَّهُ نَفْسَهُۥ ۗ وَٱللَّهُ رَءُوفٌۢ بِٱلْعِبَادِ", "english": "The day when every soul finds what it produced of good presented, and what it produced of evil — it will wish there were a great distance between them. And God warns you of Himself. And God is compassionate to the servants (al-'ibād)."}, {"ref": "3:182", "arabic": "ذَٰلِكَ بِمَا قَدَّمَتْ أَيْدِيكُمْ وَأَنَّ ٱللَّهَ لَيْسَ بِظَلَّامٍۢ لِّلْعَبِيدِ", "english": "That is because of what your hands put forth, and because God is not unjust to the servants (al-'abīd)"}]}, {"label": "C. Perfect verb (PV) and other forms: past-tense narration of worship", "count": "~4 ayahs", "examples": [{"ref": "5:117", "arabic": "مَا قُلْتُ لَهُمْ إِلَّا مَآ أَمَرْتَنِى بِهِۦٓ أَنِ ٱعْبُدُوا۟ ٱللَّهَ رَبِّى وَرَبَّكُمْ", "english": "I said nothing to them except what You commanded me: \"Serve (u'budū) God, my Lord and your Lord\""}]}]}, "qiraat": [{"arabic": "يُعْبَدُ", "translit": "yu'badu", "status": "14", "type": "Imp", "note": "Changes from active 1st person plural (na'budu, \"we serve\") to passive 3rd person singular (yu'badu, \"He is served/worshipped\"). This dramatically shifts the voice: instead of an active declaration of service, it becomes an impersonal statement that the addressee IS served. Removes the agency of the speakers.", "source": "erquran.org"}, {"arabic": "نَعْبُدْ", "translit": "na'bud", "status": "Irreg", "type": "CE", "note": "Apocopation (jazm) of the final damma — na'bud instead of na'budu. In classical grammar, jazm on an indicative verb can signal either a pause form or a conditional/jussive reading. Here it likely represents pause-form pronunciation.", "source": "erquran.org"}, {"arabic": "نِعْبُدُ", "translit": "ni'budu", "status": "Irreg", "type": "vw", "note": "Changes the initial vowel from fatḥa to kasra (ni'budu vs na'budu). Dialectal variation in the prefix vowel of 1st person plural imperfect. No semantic change — same person, number, and meaning.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-w-n", "coRootAr": "ع و ن", "count": "21", "refs": "1:5;18:102;3:64;3:182;7:128;8:41;8:51;9:104;11:109;16:2", "note": "Worship/service ('-b-d) paired with aid/assistance ('-w-n) in 21 ayahs — the pairing of dedicating one's capacity and seeking enabling power from the same source. In 1:5 both roots appear in the same ayah as parallel declarations. <- IN THIS AYAH"}, {"coRoot": "k-l-l", "coRootAr": "ك ل ل", "count": "16", "refs": "2:172;3:30;5:117;6:102;8:41;11:123;16:36;16:114;19:49;19:82", "note": "Totality (kull) paired with worship — \"serve none but God,\" \"every nation had a messenger\" — universal scope patterns"}], "critical": [{"cat": "GRAM", "pattern": "imperfect na'budu = ongoing continuous", "kernel": "Not one-time event but habitual state"}, {"cat": "STRUCT", "pattern": "1st person plural = collective voice", "kernel": "Community not isolated individuals"}, {"cat": "SEM", "pattern": "5 objectless uses show absolute 'ibada", "kernel": "21:67 21:98 26:92 37:161 43:26 — existential state"}, {"cat": "SEM", "pattern": "Lane's '-b-d = to tread/smooth a road", "kernel": "Devotion as path-clearing through labor"}, {"cat": "SEM", "pattern": "yu'badu variant removes speakers entirely", "kernel": "Relational we->You becomes ontological He is served"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "وَ", "translit": "wa", "gloss": "and / [discourse connector]", "root": "ve / [söylem bağlayıcısı]", "grammar": "— (particle)", "semantics": ["عَطْف ('aṭf) — coordination: \"and\" — joins two parallel, equal elements", "استئناف (istiʾnāf) — resumptive/new beginning: marks the start of a distinct second declaration, not mere addition to the first", "The choice between 'aṭf and istiʾnāf affects whether worship and aid-seeking are one unified act or two distinct dimensions of the relationship"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "wa as 'atf vs isti'naf", "kernel": "Coordination vs new beginning — productive ambiguity"}, {"cat": "SEM", "pattern": "isti'naf = dramatic pause between halves", "kernel": "Devotion first then separate confession of dependence"}, {"cat": "SEM", "pattern": "classical rhetoric: prime ambiguity example", "kernel": "wa between the two clauses widely discussed"}], "tag": "Conjunction (ḥarf 'aṭf). Connects the two parallel clauses iyyāka na'budu and iyyāka nasta'īnu. Functions here as عَطْف ('aṭf, coordination) — joining two equal declarations. However, a secondary reading allows استئناف (istiʾnāf) — the second clause as a new, separate declaration rather than mere addition."}, {"id": 4, "arabic": "إِيَّاكَ", "translit": "iyyāka", "gloss": "You alone (exclusive accusative)", "root": "Yalnız Sen (tahsis bildiren belirtme hali)", "grammar": "أ و ي ('-w-y)", "semantics": ["Second occurrence — same morpheme as word 1, now restricting a different predicate (seeking aid rather than worship)", "The repetition creates a rhetorical figure (tarsī') where parallel structure reinforces parallel meaning", "Core concept: re-assertion of exclusivity — the speaker could have said \"wa nasta'īnuka\" (and we seek Your aid) but chose to repeat the full restriction structure"], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "وَوِيَّاكَ", "translit": "wa-wiyyāka", "status": "shii", "type": "ibdāl", "note": "Shia reading with ibdāl (hamza replaced by wāw), yielding wa-wiyyāka. Phonetically marked but semantically identical — exclusivity function preserved.", "source": "erquran.org"}, {"arabic": "وَإِنَّا لَكَ", "translit": "wa-innā laka", "status": "shawādhdh", "type": "Lx|sp", "note": "Parallel to the first iyyāka variant — replaces the second exclusive pronoun with \"and indeed we are for You.\" If both occurrences are read as innā laka, the entire ayah becomes: \"Indeed we are Yours — we serve, and indeed we are Yours — we seek aid.\" This eliminates the pronoun-fronting syntax and replaces it with repeated nominal assertions of belonging.", "source": "erquran.org"}, {"arabic": "وَأَيَّاكَ", "translit": "wa-ayyāka", "status": "Irreg", "type": "vw", "note": "Vowel change (fatḥa on hamza) — dialectal variant, no semantic change.", "source": "erquran.org"}, {"arabic": "وَإِيَاكَ", "translit": "wa-iyāka", "status": "Irreg", "type": "Gm", "note": "Removal of shadda from yā' — lighter pronunciation, same meaning.", "source": "erquran.org"}], "cooccurrence": [], "critical": [{"cat": "STRUCT", "pattern": "iyyaka repeated not suffixed", "kernel": "Each act gets its OWN exclusivity declaration"}, {"cat": "STRUCT", "pattern": "parallel tarsi' — form mirrors content", "kernel": "Two-part relationship enacted by two-part sentence"}, {"cat": "SEM", "pattern": "wa-inna laka variant = belonging confession", "kernel": "Radically different speech act from syntactic restriction"}], "tag": "Detached exclusive accusative pronoun, 2nd person masculine singular — second occurrence in the ayah. Repeats the restriction structure from the first clause, creating parallel ḥaṣr. The repetition is NOT redundant: it re-establishes exclusivity for a different predicate (nasta'īnu vs na'budu), asserting that the source of aid is the same as the object of worship."}, {"id": 5, "arabic": "نَسْتَعِينُ", "translit": "nasta'īnu", "gloss": "we seek aid/enablement/support", "root": "ع و ن ('-w-n)", "grammar": "Imperfect verb, Form X (istaf'ala), 1st person plural indicative (marfū'). Form X adds the semantics of \"seeking/requesting\" to the base root — ista'āna = to seek 'awn (aid). The imperfect signals ongoing, habitual seeking. Transitivity: bundle shows TRANSITIVE (with_object: 1) — only occurrence in Quran is this ayah, where the object is fronted (iyyāka). The verb's sole Quranic occurrence makes it a hapax in terms of form+person combination.", "semantics": ["[7C] فَعَلَ (fa'ala, I): 'āna = to help, to aid, to assist, to succor. 'awn = help, assistance, aid (Lane's)", "[7C] فَاعَلَ (fā'ala, III): 'āwana = to cooperate with, to assist mutually, to collaborate — reciprocal aid", "[7C] تَفَاعَلَ (tafā'ala, VI): ta'āwana = to cooperate with one another, mutual aid, collective support — cooperative dynamic between multiple parties", "[7C] اِسْتَفْعَلَ (istaf'ala, X): ista'āna = to seek help, to request aid, to ask for assistance, to seek enablement from someone. The X form adds the dimension of seeking/requesting to the base meaning.", "[7C] Classical extended meanings (Lane's, Lisan al-Arab): 'awn = helper, assistant; 'awān = mature (of a cow — one that has calved once, i.e., experienced/seasoned); mu'āwana = cooperation, mutual assistance; isti'āna = seeking aid; ma'ūna = aid given, subsidy; 'awāniyya = vessels, utensils (that assist/serve in tasks)", "[7C] The root carries the concept of strengthening through external support — the one seeking 'awn acknowledges insufficient capacity on their own", "[M] Modern: isti'āna extends to any form of seeking technical support, requesting resources, calling for backup — systemic aid-seeking in organizational or technological contexts", "[F] Futuristic: any system that requests external resources, processing power, or authorization from a central authority to complete its tasks performs isti'āna — the concept maps onto client-server architectures, resource allocation requests, API calls", "Core concept: seeking enabling power from an external source, acknowledging that one's own capacity is insufficient for the task"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Form X imperfect (nasta'īnu) — seeking aid", "count": "~1 ayah", "examples": [{"ref": "1:5", "arabic": "— this verse —", "english": "The sole occurrence of Form X imperfect 1st person plural in the entire Quran — a hapax that makes this the defining instance of communal isti'āna"}]}, {"label": "B. Form I imperfect (verb): to help, to aid — active provision of aid", "count": "~5 ayahs", "examples": []}, {"label": "C. Noun forms: 'awn (helper), mu'āwana (assistance), ma'ūna (material aid)", "count": "~5 ayahs", "examples": []}]}, "qiraat": [{"arabic": "نِسْتَعِينُ", "translit": "nistaʿīnu", "status": "14", "type": "vw", "note": "Changes the prefix vowel from fatḥa to kasra (nistaʿīnu vs nastaʿīnu). This is a canonical variant within the fourteen readings. Dialectal variation in 1st person plural prefix — no semantic change, same verb form and meaning.", "source": "erquran.org"}, {"arabic": "نَسْتَعِينُۥ", "translit": "nastaʿīnū", "status": "Irreg", "type": "madd", "note": "Adds prolongation (madd) to the final vowel — nastaʿīnū with extended ū. A phonetic variant affecting recitation rhythm but not semantic content.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-b-d", "coRootAr": "ع ب د", "count": "21", "refs": "1:5;18:102;3:64;3:182;7:128;8:41;8:51;9:104;11:109;16:2", "note": "Aid-seeking ('-w-n) paired with worship/service ('-b-d) in 21 ayahs — the structural pairing that defines the two poles of the divine-human relationship: giving service and receiving enablement. Both roots in this ayah create the foundational articulation of this dynamic. <- IN THIS AYAH"}, {"coRoot": "r-q-d", "coRootAr": "ر ق د", "count": "1", "refs": "18:9", "note": "Sleep/rest (r-q-d) paired with aid ('-w-n) — singular co-occurrence in the Cave narrative context. Variant-sourced connection."}], "critical": [{"cat": "HAPAX", "pattern": "nasta'inu = sole Form X occurrence", "kernel": "Only use of this verb form in entire Quran"}, {"cat": "FORM", "pattern": "Form X = seeking not receiving", "kernel": "Foregrounds ACT OF SEEKING over getting aid"}, {"cat": "SEM", "pattern": "asymmetry preserved: source vs seekers", "kernel": "Not You help us nor we cooperate — we SEEK from You"}, {"cat": "SEM", "pattern": "'-w-n 11 vs '-b-d 275 occurrences", "kernel": "Aid-language concentrated here; worship pervades Quran"}, {"cat": "GRAM", "pattern": "imperfect = continuous seeking process", "kernel": "Not one-time request but ongoing dependence"}], "tag": "CRITICAL"}], "questions": ["Why does the text repeat the full iyyāka structure rather than attaching the second predicate with a simple suffix (wa nasta'īnuka)? Does the repetition create two separate speech acts, or one compound act with rhetorical emphasis?", "The Form X hapax nasta'īnu: why is the seeking form chosen over the receiving form? Does this signal that the relationship is defined by the act of asking rather than the act of receiving?", "The quantitative asymmetry between '-b-d (275 occurrences) and '-w-n (11 occurrences) — does the rarity of '-w-n concentrate its theological weight in al-Fātiḥa, making this ayah the locus of aid-seeking theology?", "If the wa between the two clauses is read as istiʾnāf rather than 'aṭf, does this create a temporal or logical sequence: first devotion, THEN (as a consequence or separate act) seeking aid?", "The yu'badu variant (14 canonical) removes the speakers entirely — from \"we worship You\" to \"He is worshipped.\" Does this variant preserve or dissolve the relational intimacy of the standard reading?", "The innā laka variant replaces exclusivity-through-syntax with confession-of-belonging. How does this shift the speech act from restriction (ḥaṣr) to assertion (iqrār)?", "Lane's Lexicon attests '-b-d as \"to tread/smooth a road\" (ta'bīd). Does this physical meaning survive in the spiritual concept of 'ibāda — devotion as path-clearing, as making the way navigable through labor?", "The '-b-d / '-w-n co-occurrence appears in 21 ayahs. What patterns emerge when worship-language and aid-language appear together — is aid always contingent on worship, or do they function independently?", "Could the entire ayah be read as a systems-level declaration: \"We dedicate our operational cycles exclusively to You, and we request enabling resources exclusively from You\" — mapping onto any agent-source relationship, not just human-divine?", "The 5 objectless uses of '-b-d (21:67, 21:98, 26:92, 37:161, 43:26): in those contexts, 'ibāda appears as an absolute state. Does 1:5 combine the directed (iyyāka) and absolute (na'budu) dimensions simultaneously?"], "key": "1:5"}, "1:6": {"surah": 1, "ayah": 6, "arabic": "ٱهْدِنَا ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "transliteration": "ihdinā ṣ-ṣirāṭa l-mustaqīma", "readings": [{"text": "Guide us to the straight path — a plea for active orientation toward a course that is itself upright and self-maintaining", "rationale": "The verb ihdī (اهْدِ) from h-d-y in its base form (CV imperative) takes a double accusative: the person guided (nā) and the destination (aṣ-ṣirāṭ). The definite article on ṣirāṭ implies a specific, known path. Mustaqīm (X active participle of q-w-m) describes the path as self-standing, intrinsically upright."}, {"text": "Show us the path that maintains itself upright — hidāya as revelation of what already exists, not creation of something new", "rationale": "Here ihdī can mean \"show, reveal, make visible\" rather than \"lead by the hand.\" The path (ṣirāṭ) pre-exists; the request is for perception, not construction. Mustaqīm reinforces this: the path is already upright; the supplicant needs eyes to see it."}, {"text": "Grant us the capacity to walk the self-correcting course — hidāya as internal capacity, not external direction", "rationale": "The imperative ihdī can denote \"grant the ability/capacity to find\" rather than \"point toward.\" In this reading, the supplicant already knows the path but lacks the internal compass (hidāya) to stay on it. Mustaqīm as Form X active participle suggests the path actively straightens — it self-corrects."}, {"text": "Navigate us along the elevated highway — ṣirāṭ as a raised, engineered thoroughfare requiring a navigator", "rationale": "If ṣirāṭ retains its etymological connection to Latin strāta (paved road) or its classical Arabic sense of a wide, swallowing road (from s-r-ṭ, to swallow), the path is not a gentle trail but an engineered corridor — wide enough to swallow travelers. Hidāya then becomes navigation through this overwhelming passage. Mustaqīm marks it as vertically upright — a bridge or elevated causeway."}, {"text": "Align us with the data-stream that self-calibrates — a futuristic reading where hidāya is signal-alignment and ṣirāṭ is an information channel", "rationale": "In a framework where guidance (hidāya) means alignment with a signal or frequency, and path (ṣirāṭ) means a channel or conduit, the verse becomes a request for tuning. Mustaqīm (self-standing, self-maintaining) describes a channel with error-correction — it maintains integrity autonomously. The prayer asks for alignment with a self-correcting information stream."}], "structure": {"beats": [{"label": "Supplication: the plea", "lines": [{"arabic": "ٱهْدِنَا", "translit": "ihdinā", "english": "Guide us"}]}, {"label": "Object: the destination", "lines": [{"arabic": "ٱلصِّرَٰطَ ٱلْمُسْتَقِيمَ", "translit": "aṣ-ṣirāṭa l-mustaqīma", "english": "the straight path"}]}], "summary": "The ayah is a single imperative clause with no subordination. The verb ihdinā takes a double accusative construction: first accusative is the enclitic pronoun -nā (us), second accusative is aṣ-ṣirāṭa (the path), modified by the adjective al-mustaqīma. The entire clause is a request directed upward (from created to Creator), structurally the simplest possible sentence — imperative verb + two objects. This minimal structure carries maximum theological weight: the most essential human request distilled to three words. The definite article on ṣirāṭ and mustaqīm particularizes the path — it is THE path, not A path."}, "words": [{"id": 1, "arabic": "ٱهْدِنَا", "translit": "ihdinā", "gloss": "guide us, show us the way, grant us orientation", "root": "ه د ي (h-d-y)", "grammar": "Imperative (CV) verb, 2nd person masculine singular, addressing God; with 1st person plural enclitic pronoun -nā (us) as first object; double accusative construction taking aṣ-ṣirāṭa as second object", "semantics": ["هَدَى (hadā, I): to guide, to lead aright, to show the way, to conduct along a path; also: to give a gift/present (hadiyya), to offer (a sacrificial animal); to be rightly directed", "اِهْتَدَى (ihtadā, VIII): to find the right way, to be guided, to follow guidance", "هُدًى (hudan, verbal noun): guidance, right direction, the Quran itself (2:2 — hudan li-l-muttaqīn)", "هَدْي (hady): sacrificial offering, gift brought to the sanctuary — the concrete, material sense of h-d-y: something led/driven to its destination", "[M] Modern extension: guidance as navigation, GPS-like orientation, algorithmic pathfinding — the root allows \"align us with the correct signal\"", "[F] Futuristic: hidāya as calibration — aligning a receiver with a source frequency; the prayer as a request for signal-lock with truth", "Core concept: movement toward a correct destination — whether physical travel, moral orientation, gift-giving (conveying something to its rightful recipient), or perceptual alignment"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Imperative guidance — direct request for guidance (CV form)", "count": "~1 ayah", "examples": []}, {"label": "B. God guides (IV form, yuhdī/yahdī) — divine subject, active guidance", "count": "~109 ayahs", "examples": [{"ref": "2:142", "arabic": "۞ سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا ۚ قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ ۚ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "The foolish among the people will say: What turned them away from their qiblah which they used to face? Say: To God belongs the east and the west; He guides (yahdī) whom He wills to a straight path"}, {"ref": "2:213", "arabic": "كَانَ ٱلنَّاسُ أُمَّةًۭ وَٰحِدَةًۭ فَبَعَثَ ٱللَّهُ ٱلنَّبِيِّۦنَ مُبَشِّرِينَ وَمُنذِرِينَ وَأَنزَلَ مَعَهُمُ ٱلْكِتَٰبَ بِٱلْحَقِّ لِيَحْكُمَ بَيْنَ ٱلنَّاسِ فِيمَا ٱخْتَلَفُوا۟ فِيهِ ۚ وَمَا ٱخْتَلَفَ فِيهِ إِلَّا ٱلَّذِينَ أُوتُوهُ مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَٰتُ بَغْيًۢا بَيْنَهُمْ ۖ فَهَدَى ٱللَّهُ ٱلَّذِينَ ءَامَنُوا۟ لِمَا ٱخْتَلَفُوا۟ فِيهِ مِنَ ٱلْحَقِّ بِإِذْنِهِۦ ۗ وَٱللَّهُ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍ", "english": "Mankind was one community, then God sent prophets as bringers of good tidings and warners, and sent down with them the Book in truth to judge between people in what they differed. Then God guided (hadā) those who believed to the truth of what they differed in, by His permission. God guides (yahdī) whom He wills to a straight path"}, {"ref": "3:101", "arabic": "وَكَيْفَ تَكْفُرُونَ وَأَنتُمْ تُتْلَىٰ عَلَيْكُمْ ءَايَٰتُ ٱللَّهِ وَفِيكُمْ رَسُولُهُۥ ۗ وَمَن يَعْتَصِم بِٱللَّهِ فَقَدْ هُدِىَ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "How can you deny while God's signs are recited to you and His messenger is among you? Whoever holds fast to God has been guided (hudiya, passive) to a straight path"}]}, {"label": "C. Guidance as verbal noun (hudan) — abstract concept", "count": "~92 ayahs", "examples": [{"ref": "17:9", "arabic": "إِنَّ هَٰذَا ٱلْقُرْءَانَ يَهْدِى لِلَّتِى هِىَ أَقْوَمُ وَيُبَشِّرُ ٱلْمُؤْمِنِينَ ٱلَّذِينَ يَعْمَلُونَ ٱلصَّٰلِحَٰتِ أَنَّ لَهُمْ أَجْرًۭا كَبِيرًۭا", "english": "This Quran guides (yahdī) to that which is most upright (aqwam) and gives good tidings to the believers who do righteous deeds that they will have a great reward"}]}, {"label": "D. Guided ones / those who found the path (active participle, muhtadī)", "count": "~30 ayahs", "examples": [{"ref": "17:97", "arabic": "وَمَن يَهْدِ ٱللَّهُ فَهُوَ ٱلْمُهْتَدِ ۖ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُمْ أَوْلِيَآءَ مِن دُونِهِۦ", "english": "Whoever God guides — he is the rightly-guided (al-muhtadī). And whoever He sends astray — you will never find for them protectors besides Him"}]}]}, "qiraat": [{"arabic": "أَرْشِدْنَا", "translit": "arshidnā", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution: arshidnā (from r-sh-d) replaces ihdinā (from h-d-y). R-sh-d emphasizes rational discernment and maturity (rushd = right judgment), whereas h-d-y emphasizes directional guidance. The variant narrows the semantic field from broad guidance to intellectual/moral rectitude.", "source": "erquran.org"}, {"arabic": "بَصِّرْنَا", "translit": "baṣṣirnā", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution: baṣṣirnā (from b-ṣ-r, Form II intensive — \"make us see clearly\") replaces ihdinā. This shifts guidance from directional orientation to visual perception — the request becomes \"grant us insight/vision\" rather than \"lead us.\" Emphasizes inner sight (baṣīra) over external direction.", "source": "erquran.org"}, {"arabic": "تُرْشِدُ سَبِيلَ الْمُسْتَقيمِ", "translit": "turshidu sabīla l-mustaqīmi", "status": "shii", "type": "Stx|Lx", "note": "Complete syntactic restructuring: imperative ihdinā becomes indicative turshidu (you guide/direct), ṣirāṭ becomes sabīl (a different word for path), and the speaker-addressee relationship reverses — instead of \"guide us\" (plea), it becomes \"you direct the straight path\" (declarative statement about the addressee's role). The shift from ṣirāṭ to sabīl is significant: sabīl (from s-b-l) implies a traveled, worn path, while ṣirāṭ implies a wide, engineered road.", "source": "erquran.org"}, {"arabic": "أَرْشِدْنَا سَبِيلَ الْمُسْتَقيمِ", "translit": "arshidnā sabīla l-mustaqīmi", "status": "shawādhdh", "type": "Lx|Stx", "note": "Double substitution: verb changes from h-d-y to r-sh-d (rational guidance) AND noun changes from ṣirāṭ to sabīl (worn path). Combines the semantic shifts of both previous variants: rational discernment along a traveled road rather than divine guidance along an engineered highway.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "q-w-m", "coRootAr": "ق و م", "count": "65", "refs": "1:6;17:9;17:97;2:142;2:213;2:258;2:264;3:86;3:101;4:46", "note": "The root of guidance (h-d-y) and the root of standing/uprightness (q-w-m) co-occur 65 times — the most frequent pairing for h-d-y. Guidance consistently leads TO uprightness. In 17:9 the Quran \"guides to that which is aqwam (most upright)\" — the superlative of q-w-m. IN THIS AYAH: ihdinā (guide us) targets al-mustaqīm (the upright one, from q-w-m)."}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "20", "refs": "1:6;2:142;2:213;3:101;4:68;4:175;5:16;6:87;6:161;10:25", "note": "Guidance (h-d-y) and path (s-r-t) co-occur 20 times, forming a fixed Quranic phrase pattern: \"guide to/along the ṣirāṭ.\" The pairing is nearly formulaic, suggesting ṣirāṭ is the privileged object of hidāya. IN THIS AYAH: ihdinā aṣ-ṣirāṭa — the foundational instance of this pairing."}], "critical": [{"cat": "HAPAX", "pattern": "ihdina = only CV imperative of h-d-y", "kernel": "Raw unaugmented form — most intimate guidance plea"}, {"cat": "FORM", "pattern": "Form I vs IV/VIII for guidance", "kernel": "Not cause-us-to-be-guided but simply guide-us"}, {"cat": "SEM", "pattern": "h-d-y between r-sh-d and b-s-r", "kernel": "Encompasses rational discernment AND perceptual insight"}, {"cat": "SEM", "pattern": "Shia turshidu reverses speech act", "kernel": "Supplication becomes declaration about addressee's role"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "ٱلصِّرَٰطَ", "translit": "aṣ-ṣirāṭa", "gloss": "the path, the road, the way", "root": "ص ر ط (s-r-t)", "grammar": "Accusative definite noun (second object of ihdinā); the definite article al- indicates a specific, known path — not any path but THE path", "semantics": ["[7C] صَرَطَ (saraṭa, I): to swallow, to gulp down — the primary classical meaning (Lane's Lexicon, Lisan al-Arab); a road \"swallows\" the traveler", "[7C] صِرَاط (ṣirāṭ): road, path, way — the wide road that accommodates travelers; possibly cognate with Latin strāta (paved road) via Aramaic/Syriac", "[7C] Classical lexicons distinguish ṣirāṭ from sabīl: ṣirāṭ implies a clear, wide, engineered road; sabīl implies a worn path made by travelers. The Quran uses both but reserves ṣirāṭ for THE definitive path, while sabīl appears for various paths (subul, plural)", "[7C] The swallowing metaphor: a ṣirāṭ does not merely carry the traveler — it engulfs them. Once on it, one is inside it, consumed by the journey", "[M] Modern: highway, expressway, arterial route — engineered infrastructure for mass transit; also: data pipeline, information channel", "[F] Futuristic: any structured conduit for transmission — fiber optic cable, neural pathway, quantum channel; the ṣirāṭ as bandwidth", "Core concept: a wide, clear, engulfing passage — something that swallows the one who enters it, carrying them to their destination"], "occurrences": {"type": "grouped", "groups": [{"label": "A. The definite straight path (aṣ-ṣirāṭ al-mustaqīm) — the most common collocation", "count": "~22 ayahs", "examples": [{"ref": "2:142", "arabic": "۞ سَيَقُولُ ٱلسُّفَهَآءُ مِنَ ٱلنَّاسِ مَا وَلَّىٰهُمْ عَن قِبْلَتِهِمُ ٱلَّتِى كَانُوا۟ عَلَيْهَا ۚ قُل لِّلَّهِ ٱلْمَشْرِقُ وَٱلْمَغْرِبُ ۚ يَهْدِى مَن يَشَآءُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "The foolish will say: What turned them from their qiblah? Say: To God belong east and west; He guides whom He wills to a straight path (ṣirāṭin mustaqīmin)"}, {"ref": "6:153", "arabic": "وَأَنَّ هَٰذَا صِرَٰطِى مُسْتَقِيمًۭا فَٱتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا۟ ٱلسُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِۦ", "english": "And this is My path (ṣirāṭī), straight — so follow it, and do not follow the [other] ways (as-subul), for they will separate you from His way (sabīlihī)"}, {"ref": "19:36", "arabic": "وَإِنَّ ٱللَّهَ رَبِّى وَرَبُّكُمْ فَٱعْبُدُوهُ ۚ هَٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ", "english": "God is my Lord and your Lord, so worship Him — this is a straight path (ṣirāṭun mustaqīmun)"}]}, {"label": "B. Path attributed to God (ṣirāṭ Allāh) — possessive construction", "count": "~3 ayahs", "examples": [{"ref": "42:53", "arabic": "صِرَٰطِ ٱللَّهِ ٱلَّذِى لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ أَلَآ إِلَى ٱللَّهِ تَصِيرُ ٱلْأُمُورُ", "english": "The path of God (ṣirāṭ Allāh), to whom belongs what is in the heavens and what is in the earth. Unquestionably, to God all matters return"}]}, {"label": "C. Path as physical road (sitting on the ṣirāṭ, blocking it)", "count": "~2 ayahs", "examples": [{"ref": "7:86", "arabic": "وَلَا تَقْعُدُوا۟ بِكُلِّ صِرَٰطٍۢ تُوعِدُونَ وَتَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ بِهِۦ وَتَبْغُونَهَا عِوَجًۭا", "english": "And do not sit on every path (ṣirāṭ), threatening and blocking from the way of God (sabīl Allāh) those who believe in Him, seeking to make it crooked"}]}]}, "qiraat": [{"arabic": "السِّرَاطَ", "translit": "as-sirāṭa", "status": "7", "type": "ibdāl", "note": "Canonical variant: the ص (ṣ) is replaced by س (s) — pure sibilant without emphasis. This is a dialectal phonetic variant (ibdāl) among the seven readings. The meaning is identical but the phonetic texture shifts: ṣirāṭ carries emphatic weight (the tongue presses the palate), while sirāṭ is lighter. Some scholars see the emphatic ṣād as reinforcing the gravitas of THE path.", "source": "erquran.org"}, {"arabic": "الصؗرَاطَ", "translit": "aṣᶻ-ṣᶻirāṭa", "status": "7", "type": "ibdāl", "note": "Canonical variant: the ṣ is pronounced with an ishāmm (slight blending) of z-sound — between ṣād and zāy. A third phonetic realization of the same word, attested in the seven readings. Demonstrates the phonetic plasticity of ṣirāṭ across canonical transmission.", "source": "erquran.org"}, {"arabic": "صِرَاطًا مُسْتَقِيمًا", "translit": "ṣirāṭan mustaqīman", "status": "14", "type": "al|Tnw", "note": "Removes the definite article and changes case to indefinite accusative (tanwīn). THE straight path becomes A straight path — shifting from a unique, specific path to one among possible straight paths. This is theologically significant: the definite version implies one exclusive path; the indefinite allows multiple valid paths, all of which are straight.", "source": "erquran.org"}, {"arabic": "الزِّرَاطَ", "translit": "az-zirāṭa", "status": "Irreg", "type": "ibdāl", "note": "Irregular phonetic variant: ṣ becomes z — full voicing of the sibilant. Not canonical but historically attested. Completes the phonetic spectrum: ṣ (emphatic voiceless) → ṣᶻ (emphatic with z-coloring) → s (plain voiceless) → z (plain voiced).", "source": "erquran.org"}, {"arabic": "صِرَاطَ", "translit": "ṣirāṭa", "status": "shawādhdh", "type": "al", "note": "Drops the definite article entirely, keeping definite accusative without al-. This is rare and anomalous — it would make ṣirāṭ syntactically indefinite yet contextually definite (known from context). A more intimate, stripped-down reference to the path.", "source": "erquran.org"}, {"arabic": "الصِّرَاطَ صِرَاطَكَ", "translit": "aṣ-ṣirāṭa ṣirāṭaka", "status": "shii", "type": "±", "note": "Shia addition: \"the path, YOUR path\" — adds a possessive suffix -ka (your) creating an appositive. This makes the identity of the path explicit: it is God's own path. The standard text leaves this implicit (al-ṣirāṭ — which path? answered in 1:7). The Shia variant answers immediately: it is YOUR path. This collapses the suspense between 1:6 and 1:7.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "q-w-m", "coRootAr": "ق و م", "count": "33", "refs": "1:6;19:36;2:142;2:213;3:51;3:101;4:68;4:175;5:16;6:39", "note": "Path (s-r-t) and uprightness (q-w-m) co-occur 33 times — the phrase \"ṣirāṭ mustaqīm\" is the Quran's most characteristic collocation for moral-spiritual direction. The path and its quality are inseparable. IN THIS AYAH: aṣ-ṣirāṭa al-mustaqīma."}, {"coRoot": "h-d-y", "coRootAr": "ه د ي", "count": "20", "refs": "1:6;2:142;2:213;3:101;4:68;4:175;5:16;6:87;6:161;10:25", "note": "Path (s-r-t) and guidance (h-d-y) — the ṣirāṭ is consistently the TARGET of hidāya, not its source. One is guided TO the path, not BY the path. IN THIS AYAH: ihdinā aṣ-ṣirāṭa."}, {"coRoot": "s-w-y", "coRootAr": "س و ي", "count": "5", "refs": "1:7;16:76;19:43;38:22;67:22", "note": "Path (s-r-t) and equality/evenness (s-w-y) — in 19:43, Ibrahim says ahdika ṣirāṭan sawiyyan (\"I will guide you to a level path\"), using s-w-y as an alternative descriptor to mustaqīm. Sawiyy emphasizes horizontal levelness while mustaqīm emphasizes vertical uprightness."}], "critical": [{"cat": "SEM", "pattern": "sirat from s-r-t = to swallow", "kernel": "Road engulfs tr
