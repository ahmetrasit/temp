aveler — total immersion metaphor"}, {"cat": "GRAM", "pattern": "four phonetic realizations in seven readings", "kernel": "s sin ishmam z — phonetically most variable word"}, {"cat": "GRAM", "pattern": "definite article = one unique known path", "kernel": "14-reading variant removes it — opens multiple paths"}, {"cat": "SEM", "pattern": "sirat vs sabil: engineered vs worn path", "kernel": "Narrower defined corridor chosen over common road"}, {"cat": "SEM", "pattern": "Shia sirataka collapses 1:6-1:7 suspense", "kernel": "Identifies path as God's own immediately"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "ٱلْمُسْتَقِيمَ", "translit": "al-mustaqīma", "gloss": "the straight, the upright, the self-maintaining, the one that stands on its own", "root": "ق و م (q-w-m)", "grammar": "Form X (istaf'ala) active participle, accusative definite, functioning as adjective modifying aṣ-ṣirāṭa; Form X adds the meaning of \"seeking to be\" or \"finding oneself to be\" — so mustaqīm means not just \"straight\" but \"seeking/maintaining its own straightness\"", "semantics": ["[7C] قَامَ (qāma, I): to stand, to rise, to stand up; to be erect, upright; to endure, to last; to manage, to undertake; to perform (prayer — aqāma ṣ-ṣalāt); to have value (qīma)", "[7C] أَقَامَ (aqāma, IV): to erect, to establish, to set up; to perform, to observe (rituals); to maintain; to appoint; to reside", "[7C] قَوْم (qawm): a people, a community, a nation — those who stand together; men of a tribe (originally: those who stand/rise for battle)", "[7C] قِيَامَة (qiyāma): resurrection — the standing up, the great rising; yawm al-qiyāma = the Day of Standing", "[7C] مَقَام (maqām): station, place of standing; rank, position; shrine; a melodic mode in music (maqām system)", "[7C] اِسْتَقَامَ (istaqāma, X): to be or become straight, upright; to be correct, right, proper; to stand firm; to persevere on a course — the reflexive-estimative X form means \"to find straightness in oneself\" or \"to seek to stand\"", "[7C] قِوَام / قَوَام (qiwām): sustenance, livelihood, means of support; the backbone of something; that which enables something to stand", "[7C] Classical (Lane's): qāma also means \"to have a certain price\" (how much does it stand at?); qīma = value, worth; qayyim = self-subsisting, maintaining others; qayyūm = the eternally self-standing (divine attribute)", "[M] Modern: to uphold (rights), to establish (institutions), to run (a program), to stand for (an idea); istiqāma = integrity, rectitude; also: self-correcting system, homeostasis", "[F] Futuristic: self-maintaining code, self-correcting algorithm, autonomous system that preserves its own integrity; mustaqīm as a path with built-in error correction", "Core concept: vertical stability and self-maintenance — standing upright against gravity, and by extension: being correct, enduring, having value, forming a community (those who stand together)"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle (mustaqīm) as adjective describing path/religion", "count": "~63 ayahs", "examples": [{"ref": "6:39", "arabic": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا صُمٌّۭ وَبُكْمٌۭ فِى ٱلظُّلُمَٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "Those who deny Our signs are deaf and mute, in darknesses. Whomever God wills He sends astray, and whomever He wills He places upon a straight path (ṣirāṭin mustaqīmin)"}, {"ref": "16:76", "arabic": "وَضَرَبَ ٱللَّهُ مَثَلًۭا رَّجُلَيْنِ أَحَدُهُمَآ أَبْكَمُ لَا يَقْدِرُ عَلَىٰ شَىْءٍۢ وَهُوَ كَلٌّ عَلَىٰ مَوْلَىٰهُ أَيْنَمَا يُوَجِّههُّ لَا يَأْتِ بِخَيْرٍ ۖ هَلْ يَسْتَوِى هُوَ وَمَن يَأْمُرُ بِٱلْعَدْلِ ۙ وَهُوَ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "God sets forth a parable: two men — one mute, powerless, a burden on his master, wherever he directs him he brings no good. Is he equal to one who commands justice and is upon a straight path (ṣirāṭin mustaqīmin)?"}, {"ref": "19:36", "arabic": "وَإِنَّ ٱللَّهَ رَبِّى وَرَبُّكُمْ فَٱعْبُدُوهُ ۚ هَٰذَا صِرَٰطٌۭ مُّسْتَقِيمٌۭ", "english": "God is my Lord and your Lord, so worship Him — this is a straight path (ṣirāṭun mustaqīmun)"}]}, {"label": "B. Community/people (qawm) — those who stand together", "count": "~383 ayahs", "examples": [{"ref": "18:86", "arabic": "حَتَّىٰٓ إِذَا بَلَغَ مَغْرِبَ ٱلشَّمْسِ وَجَدَهَا تَغْرُبُ فِى عَيْنٍ حَمِئَةٍۢ وَوَجَدَ عِندَهَا قَوْمًۭا", "english": "Until, when he reached the setting of the sun, he found it setting in a murky spring, and he found near it a people (qawman)"}]}, {"label": "C. Superlative (aqwam) — most upright", "count": "~4 ayahs", "examples": [{"ref": "17:9", "arabic": "إِنَّ هَٰذَا ٱلْقُرْءَانَ يَهْدِى لِلَّتِى هِىَ أَقْوَمُ", "english": "This Quran guides to that which is most upright (aqwam)"}]}]}, "qiraat": [{"arabic": "صِرَاطًا مُسْتَقِيمًا", "translit": "ṣirāṭan mustaqīman", "status": "14", "type": "al|Tnw", "note": "This variant affects mustaqīm by removing its definite article and making it indefinite with tanwīn. Instead of THE upright (specific, unique), it becomes AN upright one — one instance of the quality rather than the absolute. This shifts the theological weight: al-mustaqīm implies the path has a fixed, knowable identity; mustaqīman suggests the quality of uprightness is what matters, not the path's unique identity.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "h-d-y", "coRootAr": "ه د ي", "count": "65", "refs": "1:6;17:9;17:97;2:142;2:213;2:258;2:264;3:86;3:101;4:46", "note": "Uprightness (q-w-m) and guidance (h-d-y) — the most frequent pairing for q-w-m. The pattern: guidance LEADS TO uprightness, or uprightness RESULTS FROM guidance. In 17:9 the superlative aqwam is the destination of Quranic guidance. IN THIS AYAH: ihdinā (h-d-y) targets al-mustaqīma (q-w-m)."}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "33", "refs": "1:6;19:36;2:142;2:213;3:51;3:101;4:68;4:175;5:16;6:39", "note": "Uprightness (q-w-m) and path (s-r-t) — the ṣirāṭ mustaqīm collocation appears in virtually every occurrence. The quality of mustaqīm appears inseparable from the noun ṣirāṭ in Quranic usage — they form a fixed phrase. IN THIS AYAH: aṣ-ṣirāṭa al-mustaqīma."}, {"coRoot": "w-z-n", "coRootAr": "و ز ن", "count": "10", "refs": "7:85;11:84;11:85;17:35;18:105;18:105;21:47;26:182;55:9;57:25", "note": "Uprightness (q-w-m) and weighing/balance (w-z-n) — the co-occurrence connects standing upright with just measurement. In 55:9 wa-aqīmū l-wazna bi-l-qisṭ (\"establish the weighing with justice\"), uprightness IS the act of fair measurement. In 7:85 and 11:84-85 (Shu'ayb narrative), the command to establish just weights connects community integrity (qawm) with correct measurement. The semantic bridge: uprightness as calibration."}], "critical": [{"cat": "FORM", "pattern": "Form X mustaqim = self-maintaining straight", "kernel": "Not passively straight but actively seeks own uprightness"}, {"cat": "SEM", "pattern": "istaqama = reflexive active self-correction", "kernel": "Path does not merely happen to be straight"}, {"cat": "SEM", "pattern": "q-w-m + w-z-n cooccurrence = calibration", "kernel": "Uprightness as self-calibrating balance in 10 ayahs"}, {"cat": "GRAM", "pattern": "X form vs simpler qa'im or qawim", "kernel": "Neither carries self-seeking self-maintaining force"}], "tag": "CRITICAL"}], "questions": ["Why does the Quran use the CV (base) imperative ihdinā for this single occurrence, when all other guidance verbs use Form IV or VIII? Does the stripped-down form carry theological intimacy — the most direct, unmediated plea?", "The definite article on aṣ-ṣirāṭ implies a unique, known path. But the Fourteen Readings variant removes it (ṣirāṭan mustaqīman — \"a straight path\"). Does this open the possibility of multiple valid straight paths, or is the indefinite merely stylistic?", "The root s-r-ṭ means \"to swallow\" — the Quran never uses this verb, only the noun ṣirāṭ. Is the swallowing metaphor dormant or active? Does a ṣirāṭ engulf the traveler, or has the metaphor fully lexicalized into just \"road\"?", "Form X mustaqīm implies self-maintaining straightness — the path corrects itself. How does this differ from a path that is simply straight (qawīm)? Does the X form suggest the path is a dynamic process, not a static line?", "The Shia variant adds ṣirāṭaka (\"your path\"), collapsing the suspense between 1:6 and 1:7. The standard text delays identification until 1:7 (path of those whom You have blessed). Does this delay serve a rhetorical purpose — making the supplicant ask and then receive the specification?", "The four phonetic realizations of ṣirāṭ (ṣ, s, ṣᶻ, z) span the full emphatic-to-plain spectrum. Is this phonetic variability meaningful, or merely dialectal? Could the emphatic ṣād be iconically representing the gravitas of the path?", "The co-occurrence of q-w-m with w-z-n (weighing/balance) across 10 ayahs suggests uprightness-as-calibration. Does mustaqīm describe a path that is self-calibrating — maintaining accuracy through continuous adjustment rather than through fixed positioning?", "If ihdinā is read as \"grant us the capacity to perceive\" (paralleling the baṣṣirnā variant), then the path already exists and the problem is human blindness. If read as \"lead us by the hand,\" the path requires active divine intervention. Which reading does the double accusative construction favor?", "The word hidāya encompasses gift-giving (hadiyya), sacrificial offering (hady), and moral guidance. When the supplicant says ihdinā, are all three senses active — \"give us the gift of the path, offer us to the path, guide us along the path\"?", "In a futuristic reading where ṣirāṭ is an information channel and mustaqīm is error-correction, the verse becomes a prayer for signal-alignment. Does the Quran's insistence on this phrase (45 occurrences of ṣirāṭ) suggest it encodes a concept broader than \"road\" — a conduit, a frequency, a channel?"], "key": "1:6"}, "1:7": {"surah": 1, "ayah": 7, "arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ وَلَا ٱلضَّآلِّينَ", "transliteration": "ṣirāṭa lladhīna anʿamta ʿalayhim ghayri l-maghḍūbi ʿalayhim wa-lā ḍ-ḍāllīna", "readings": [{"text": "The path of those You have bestowed favor upon, not those who have incurred wrath upon themselves, nor those who have lost their way -- where ghayri functions as an adjective (badal) qualifying alladhīna, and al-maghḍūbi is a passive participle with an unspecified agent of wrath.", "rationale": "ghayri as badal (substitutive apposition) from alladhina: the path is defined by exclusion -- first positively (those favored) then negatively (not those under wrath, not those astray). The passive al-maghdubi leaves the agent of wrath deliberately unspecified."}, {"text": "The path of those upon whom You have bestowed grace -- other than [the path of] those upon whom anger has settled, and not [the path of] those who wander aimlessly -- reading ghayri as a genitive adjective modifying alladhina, with wrath as an enduring state (ism al-mafʿul indicating permanence).", "rationale": "al-maghdubi as an established state (not a one-time event) -- the passive participle indicates an ongoing condition of being subject to wrath. The lost (al-dallin) are not merely mistaken but persistently off-course. Two distinct categories of deviation: passive reception of wrath vs active wandering."}, {"text": "The path of those whom You have endowed with well-being -- excluding those burdened with displeasure upon them, and not those who have gone astray -- reading anʿamta as intransitive (bestowed well-being without explicit object), and ghayri as genitive of exclusion.", "rationale": "The verb anʿama appears without explicit object in this ayah (transitivity: MIXED, without_object_ayahs include 1:7). This allows reading: \"You bestowed [favor/well-being]\" where the nature of the favor is deliberately unspecified -- maximizing what the divine bestowal encompasses."}, {"text": "The road of those You have given ease to -- apart from those upon whom fury has descended, nor those who drift -- reading sirat as sabila (path/road, from the canonical variant s-r-t to s-b-l), emphasizing the traversable, physical dimension of the path, and al-dallin as those who drift without direction.", "rationale": "The canonical qira'at variant sirata/sabiila (reading with sin instead of sad, or the shawadhdh full lexical replacement) shifts the root from s-r-t (narrow defined road) to s-b-l (traversable way, course of travel). This widens the semantic field from a specific corridor to a general journey or life-course."}, {"text": "The trajectory of those You have graced -- distinct from those under systemic displeasure upon themselves, nor those in recursive deviation -- reading the entire ayah as a structural taxonomy of three human conditions: guided (anʿamta ʿalayhim), systemically opposed (al-maghdubi ʿalayhim), and recursively lost (al-dallin, with the doubled lam of d-l-l signifying iterative, compounding loss).", "rationale": "The ayah establishes a tripartite taxonomy: (1) those actively receiving divine favor, (2) those in a state of having wrath settled upon them (passive, externally imposed), (3) those in a state of going astray (active, self-generated). The doubled root d-l-l (with shadda on lam) phonetically enacts the recursiveness of straying -- the sound loops back on itself. This taxonomy can apply across all eras: from spiritual states to epistemic conditions (knowledge vs ignorance vs misinformation)."}], "structure": {"beats": [{"label": "Positive definition of the path", "lines": [{"arabic": "صِرَٰطَ ٱلَّذِينَ أَنْعَمْتَ عَلَيْهِمْ", "translit": "ṣirāṭa lladhīna anʿamta ʿalayhim", "english": "The path of those You have bestowed favor upon"}]}, {"label": "Negative exclusion: wrath", "lines": [{"arabic": "غَيْرِ ٱلْمَغْضُوبِ عَلَيْهِمْ", "translit": "ghayri l-maghḍūbi ʿalayhim", "english": "Not those upon whom wrath has settled"}]}, {"label": "Negative exclusion: straying", "lines": [{"arabic": "وَلَا ٱلضَّآلِّينَ", "translit": "wa-lā ḍ-ḍāllīna", "english": "Nor those who go astray"}]}], "summary": "The ayah is a single extended noun phrase in apposition to sirata l-mustaqima (1:6), structured as: positive identification + double negative exclusion. The path is first defined by WHO walks it (those favored), then delimited by WHO does not walk it (those under wrath + those astray). The double negation (ghayri... wa-la) creates a semantic corridor: the correct path is bounded on both sides by two distinct modes of failure. Syntactically, ghayri is in the genitive (matching alladhina's implied case), while wa-la coordinates the second exclusion. The passive voice in al-maghdubi (agent unspecified) contrasts sharply with the active participle al-dallin -- wrath is received, straying is enacted."}, "words": [{"id": 1, "arabic": "صِرَٰطَ", "translit": "ṣirāṭa", "gloss": "path, road, way, trajectory", "root": "ص ر ط (s-r-t)", "grammar": "Accusative noun in apposition (badal) to sirata l-mustaqima in 1:6. Definite by the following relative clause (idafa-like construction with alladhina).", "semantics": ["[7C] Concrete: a road, path, way -- originally from the root meaning \"to swallow\" (as a road swallows travelers); Lane's Lexicon: a road that swallows those who travel upon it", "[7C] Extended: a course of conduct, a way of life, a trajectory of action -- any defined direction or methodology", "[M] Modern: a system, a protocol, a structured approach -- any directed framework (technological, epistemic, procedural)", "[F] Futuristic: an algorithm, a computational path, a decision tree -- any traversable sequence from input to outcome", "Classical lexicons (Lane's, Lisan al-Arab): s-r-t is cognate with s-r-d (to pierce through), emphasizing a path that cuts clearly through terrain; also attested as \"the bridge over Hell\" in eschatological usage; related to sarata meaning \"to swallow\" -- the path consumes the walker", "Core concept: a defined, traversable way that leads from origin to destination -- encompassing physical roads, moral trajectories, and any structured course of progression"], "occurrences": {"type": "grouped", "groups": [{"label": "A. As object of hidaya (guidance toward the path) -- \"guide us to the sirat\"", "count": "~8 ayahs", "examples": [{"ref": "42:53", "arabic": "صِرَٰطِ ٱللَّهِ ٱلَّذِى لَهُۥ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۗ أَلَآ إِلَى ٱللَّهِ تَصِيرُ ٱلْأُمُورُ", "english": "The path of God, to whom belongs what is in the heavens and what is on earth -- indeed to God all matters return"}, {"ref": "7:86", "arabic": "وَلَا تَقْعُدُوا۟ بِكُلِّ صِرَٰطٍۢ تُوعِدُونَ وَتَصُدُّونَ عَن سَبِيلِ ٱللَّهِ مَنْ ءَامَنَ بِهِۦ وَتَبْغُونَهَا عِوَجًۭا", "english": "And do not sit on every path, threatening and turning away from the path of God those who believe in Him, seeking crookedness in it"}]}, {"label": "B. Described as mustaqim (straight) or sawiyy (level) -- the sirat qualified", "count": "~22 ayahs", "examples": [{"ref": "5:16", "arabic": "يَهْدِى بِهِ ٱللَّهُ مَنِ ٱتَّبَعَ رِضْوَٰنَهُۥ سُبُلَ ٱلسَّلَٰمِ وَيُخْرِجُهُم مِّنَ ٱلظُّلُمَٰتِ إِلَى ٱلنُّورِ بِإِذْنِهِۦ وَيَهْدِيهِمْ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "God guides by it those who follow His good pleasure to the ways of peace, and brings them out from darknesses into light by His permission, and guides them to a straight path"}, {"ref": "20:135", "arabic": "قُلْ كُلٌّۭ مُّتَرَبِّصٌۭ فَتَرَبَّصُوا۟ ۖ فَسَتَعْلَمُونَ مَنْ أَصْحَٰبُ ٱلصِّرَٰطِ ٱلسَّوِىِّ وَمَنِ ٱهْتَدَىٰ", "english": "Say: each is waiting, so wait -- you will know who are the companions of the level path and who is guided"}]}, {"label": "C. In apposition (this ayah's usage) -- the sirat defined by who walks it", "count": "~2 ayahs", "examples": [{"ref": "6:153", "arabic": "وَأَنَّ هَٰذَا صِرَٰطِى مُسْتَقِيمًۭا فَٱتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا۟ ٱلسُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِۦ", "english": "And this is My path, straight -- so follow it, and do not follow [other] ways lest they scatter you from His way"}]}]}, "qiraat": [{"arabic": "سِرَاطَ", "translit": "sirāṭa", "status": "7", "type": "ibdal", "note": "Canonical variant with sin replacing sad -- shifts phonetically but preserves meaning; some grammarians see s-r-t and s-b-l as related semantic fields (road/path)", "source": "erquran.org"}, {"arabic": "صِؗرَاطَ", "translit": "ṣᶻirāṭa", "status": "7", "type": "ibdal", "note": "Canonical variant with ishmam (blending sad and zay sounds) -- a phonetic midpoint between the two canonical readings", "source": "erquran.org"}, {"arabic": "سَبِيلَ", "translit": "sabīla", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing sirat entirely with sabil (s-b-l) -- a complete lexical substitution that shifts the root from s-r-t (defined corridor) to s-b-l (traversable way). This is NOT in the standard Hafs reading.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "3", "refs": "1:7;16:121;48:2", "note": "Path (sirat) and bestowal of favor (niʿma) co-occur -- the path is inherently linked to divine grace in these contexts <- IN THIS AYAH"}, {"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "2", "refs": "1:7;6:39", "note": "Path and straying -- the sirat is defined against going astray <- IN THIS AYAH"}, {"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "1", "refs": "1:7", "note": "Path and otherness -- the only co-occurrence, in this very ayah, defining the path by exclusion <- IN THIS AYAH"}], "critical": [{"cat": "SEM", "pattern": "sirat echoes sarata = to swallow", "kernel": "Path consumes those who walk it — total immersion"}, {"cat": "SEM", "pattern": "sirat vs sabil: 45 vs 176 occurrences", "kernel": "Rarer narrower word deliberately chosen"}, {"cat": "SEM", "pattern": "eschatological bridge association reinforces", "kernel": "Narrowness of sirat connects to bridge over Fire"}, {"cat": "GRAM", "pattern": "canonical sin + ishmam variants", "kernel": "Pre-Islamic dialectal variation absorbed into tradition"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "ٱلَّذِينَ", "translit": "alladhīna", "gloss": "those who, the ones who", "root": "-enler, o kimseler ki", "grammar": "—", "semantics": [], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "لَذِينَ", "translit": "ladhīna", "status": "Irreg", "type": "Gm", "note": "Irregular variant dropping the initial alif-lam -- changes the relative pronoun from definite (those who) to a bare form. This grammatical variant is NOT in the standard Hafs reading.", "source": "erquran.org"}, {"arabic": "مَنْ", "translit": "man", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing alladhina (plural relative) with man (general relative) -- shifts from \"those who\" (specific group) to \"whoever\" (open, universal). ROOT CHANGE: from relative pronoun (no root) to m-n-n. This is NOT in the standard Hafs reading.", "source": "erquran.org"}], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "alladhina = specific identifiable group", "kernel": "Definite plural — concrete collectivity not abstract"}, {"cat": "SEM", "pattern": "shawadhdh man = universalizes category", "kernel": "Whoever You favored — open-ended not historical"}, {"cat": "SEM", "pattern": "man root m-n-n resonates with an'amta", "kernel": "Potential paronomasia: favor-granting of the favored"}], "tag": "Masculine plural relative pronoun (ism mawsul) introducing a relative clause (sila). Accusative as part of the idafa-like construction with sirata."}, {"id": 3, "arabic": "أَنْعَمْتَ", "translit": "anʿamta", "gloss": "You bestowed favor, You graced, You gave well-being", "root": "ن ع م (n-'-m)", "grammar": "Perfect verb (past tense), Form IV (afʿala), 2nd person masculine singular. The Form IV causative: \"You caused niʿma (well-being, favor, ease) to be upon [them].\" Appears without explicit direct object in this ayah (intransitive usage).", "semantics": ["[7C] فَعَلَ (faʿala, I): to be soft, tender, smooth; to live in ease and comfort; to be fresh and flourishing (of plants); Lane's Lexicon: naʿima = he lived a life of ease, softness, luxury", "[7C] أَفْعَلَ (afʿala, IV): to bestow favor/grace upon; to cause someone to live in well-being; to endow with blessings; to grant ease", "[7C] Noun forms: niʿma = favor, blessing, grace; naʿim = bliss, delight, paradise-like comfort; naʿam/anʿam = livestock, cattle (the primary wealth and marker of well-being in pastoral culture)", "[7C] Classical (Lane's, Lisan al-Arab): the root encompasses both material and immaterial well-being -- from the softness of leather and freshness of plants to the comfort of a blessed life. Also: naʿama = an ostrich (associated with softness of feathers). The concrete-to-abstract arc: physical softness -> material ease -> spiritual blessing", "[M] Modern: to grant, to provide resources, welfare, social benefits -- systemic well-being, institutional support", "[F] Futuristic: to optimize conditions for, to provide enabling infrastructure -- any act of creating conditions for flourishing, including data access, algorithmic fairness, resource distribution", "Core concept: the creation or bestowal of conditions in which life is soft, easy, flourishing -- from physical comfort to spiritual grace"], "occurrences": {"type": "grouped", "groups": [{"label": "A. God bestows favor upon specific groups (IV form, transitive with ʿala)", "count": "~15 ayahs", "examples": [{"ref": "2:40", "arabic": "يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُوا۟ بِعَهْدِىٓ أُوفِ بِعَهْدِكُمْ وَإِيَّٰىَ فَٱرْهَبُونِ", "english": "O Children of Israel, remember My favor which I bestowed upon you, and fulfill My covenant so I fulfill your covenant, and fear Me alone"}, {"ref": "2:47", "arabic": "يَٰبَنِىٓ إِسْرَٰٓءِيلَ ٱذْكُرُوا۟ نِعْمَتِىَ ٱلَّتِىٓ أَنْعَمْتُ عَلَيْكُمْ وَأَنِّى فَضَّلْتُكُمْ عَلَى ٱلْعَٰلَمِينَ", "english": "O Children of Israel, remember My favor which I bestowed upon you and that I preferred you over the worlds"}]}, {"label": "B. Favor as noun (niʿma, naʿim) -- the content of the bestowal", "count": "~54 ayahs", "examples": [{"ref": "16:121", "arabic": "شَاكِرًۭا لِّأَنْعُمِهِ ۚ ٱجْتَبَىٰهُ وَهَدَىٰهُ إِلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "Grateful for His favors -- He chose him and guided him to a straight path"}, {"ref": "48:2", "arabic": "لِّيَغْفِرَ لَكَ ٱللَّهُ مَا تَقَدَّمَ مِن ذَنۢبِكَ وَمَا تَأَخَّرَ وَيُتِمَّ نِعْمَتَهُۥ عَلَيْكَ وَيَهْدِيَكَ صِرَٰطًۭا مُّسْتَقِيمًۭا", "english": "That God may forgive for you what preceded of your sin and what followed, and complete His favor upon you and guide you to a straight path"}]}, {"label": "C. Intransitive usage -- favor bestowed without named object", "count": "~3 ayahs", "examples": [{"ref": "19:58", "arabic": "فَلَمَّا رَءَا ٱلْقَمَرَ بَازِغًۭا قَالَ هَٰذَا رَبِّى ۖ فَلَمَّآ أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِى رَبِّى لَأَكُونَنَّ مِنَ ٱلْقَوْمِ ٱلضَّآلِّينَ", "english": "Among those We have favored from the prophets -- from the offspring of Adam, and from those We carried with Noah"}]}]}, "qiraat": [{"arabic": "أَنْعَمْتُ", "translit": "anʿamtu", "status": "None", "type": "Pf", "note": "Variant reading \"I bestowed favor\" (1st person) instead of \"You bestowed favor\" (2nd person) -- shifts the speaker from the supplicant addressing God to God speaking about His own act. Status unclassified.", "source": "erquran.org"}, {"arabic": "نَعَّمْتَ", "translit": "naʿʿamta", "status": "shii", "type": "Vr", "note": "Shia reading with Form II (intensive) instead of Form IV -- naʿʿamta means \"You richly/intensely bestowed ease\" rather than the causative \"You caused favor.\" The doubling in Form II intensifies the act of bestowal. This is NOT in the standard Hafs reading.", "source": "erquran.org"}, {"arabic": "مَنَنْتَ", "translit": "mananta", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing anʿamta entirely with mananta (You bestowed/granted, from m-n-n). ROOT CHANGE: n-'-m to m-n-n. Both roots share the semantic field of \"bestowing favor\" but m-n-n carries an additional nuance of \"reminding of the favor\" or \"reproaching for ingratitude.\" This is NOT in the standard Hafs reading.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "8", "refs": "1:7;1:7;4:119;5:1;5:3;8:53;31:20;35:3", "note": "Favor and otherness/exclusion -- divine favor is frequently defined against what is \"other than\" or \"without\" <- IN THIS AYAH"}, {"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "5", "refs": "1:7;4:119;7:179;25:44;39:8", "note": "Favor and straying -- those who receive divine favor vs those who stray; in 4:119 Satan promises to lead astray and alter creation <- IN THIS AYAH"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "3", "refs": "1:7;16:121;48:2", "note": "Favor and path -- in all three co-occurrences, the path (sirat) is directly linked to divine favor, either as destination of favor or its context <- IN THIS AYAH"}], "critical": [{"cat": "GRAM", "pattern": "an'amta intransitive — no explicit object", "kernel": "Elision maximizes scope: total favor not favor-of-X"}, {"cat": "FORM", "pattern": "Form IV causative: caused ni'ma upon them", "kernel": "God as agent of well-being — active bestowal"}, {"cat": "SEM", "pattern": "Shia na''amta II = intensive outpouring", "kernel": "Theology of pouring vs enabling"}, {"cat": "SEM", "pattern": "shawadhdh mananta carries reproach undertone", "kernel": "m-n-n = bestow generously AND remind of generosity"}, {"cat": "GRAM", "pattern": "2nd person anta = direct intimate address", "kernel": "You specifically bestowed — intensely personal"}], "tag": "CRITICAL"}, {"id": 4, "arabic": "عَلَيْهِمْ", "translit": "ʿalayhim", "gloss": "upon them, on them", "root": "onlarin uzerine, onlara", "grammar": "ع ل و ('-l-w)", "semantics": ["[7C] Spatial: upon, on, over -- physical position above or upon a surface", "[7C] Directional/disadvantage: against, upon (burden) -- marks the recipient of a negative action (obligation, wrath, punishment)", "[7C] Benefactive: upon (favor bestowed upon) -- here marks the recipient of niʿma", "Core concept: superposition -- something placed above or directed toward a recipient, whether favor or burden"], "occurrences": {"type": "none"}, "qiraat": [], "cooccurrence": [], "critical": [{"cat": "STRUCT", "pattern": "'ala twice with opposite valence", "kernel": "Same preposition: favor-upon AND wrath-upon"}, {"cat": "SEM", "pattern": "superposition governs both states", "kernel": "Identical grammar for blessing and anger"}], "tag": "Prepositional phrase: preposition ʿala + 3rd person masculine plural pronoun -him. Governs the genitive. Functions as the complement of anʿamta, marking the recipients of divine favor."}, {"id": 5, "arabic": "غَيْرِ", "translit": "ghayri", "gloss": "other than, not, excluding, different from", "root": "غ ي ر (gh-y-r)", "grammar": "Genitive noun functioning as adjective (badal or na't) to alladhina, or as independent exclusion particle. The genitive case (kasra) matches the implied case of those being described. Classical grammarians debate: is ghayri a badal (substitutive apposition) from alladhina, or a sifa (adjective) of the implied antecedent?", "semantics": ["[7C] فَعَلَ (faʿala, I): to change, alter, transform; to be jealous, zealous; ghayra = he changed (something)", "[7C] أَفْعَلَ (afʿala, II): ghayyara = to change, to alter, to transform; to make different", "[7C] Noun: ghayr = other than, different from, not; carries the sense of absolute otherness, exclusion, alterity", "[7C] Classical (Lane's, Lisan al-Arab): ghayra also means \"jealousy, protective zeal\" (ghayra/ghira); one who is ghayur is jealous, zealously protective. The root connects alterity (being other) with emotional response to alterity (jealousy at what is other/foreign entering one's domain)", "[7C] Mughayara = difference, contrast, opposition; mughayir = different, contrary", "[M] Modern: alternative, non-, other than -- used in legal, technical, and classificatory contexts for exclusion and distinction", "Core concept: the state of being other, different, or excluded -- encompassing change (becoming other), alterity (being other), and the emotional response to alterity (jealousy, protective zeal)"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Exclusion/exception in theological context -- \"other than God\" or \"without right\"", "count": "~50 ayahs", "examples": [{"ref": "2:61", "arabic": "وَإِذْ قُلْتُمْ يَٰمُوسَىٰ لَن نَّصْبِرَ عَلَىٰ طَعَامٍۢ وَٰحِدٍۢ فَٱدْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنۢبِتُ ٱلْأَرْضُ مِنۢ بَقْلِهَا وَقِثَّآئِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَا ۖ قَالَ أَتَسْتَبْدِلُونَ ٱلَّذِى هُوَ أَدْنَىٰ بِٱلَّذِى هُوَ خَيْرٌ ۚ ٱهْبِطُوا۟ مِصْرًۭا فَإِنَّ لَكُم مَّا سَأَلْتُمْ ۗ وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ ۗ ذَٰلِكَ بِأَنَّهُمْ كَانُوا۟ يَكْفُرُونَ بِـَٔايَٰتِ ٱللَّهِ وَيَقْتُلُونَ ٱلنَّبِيِّۦنَ بِغَيْرِ ٱلْحَقِّ ۗ ذَٰلِكَ بِمَا عَصَوا۟ وَّكَانُوا۟ يَعْتَدُونَ", "english": "And when you said: O Musa, we cannot endure one kind of food, so call upon your Lord for us to bring forth for us from what the earth grows... They killed the prophets without right"}, {"ref": "4:56", "arabic": "إِنَّ ٱلَّذِينَ كَفَرُوا۟ بِـَٔايَٰتِنَا سَوْفَ نُصْلِيهِمْ نَارًۭا كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَٰهُمْ جُلُودًا غَيْرَهَا لِيَذُوقُوا۟ ٱلْعَذَابَ ۗ إِنَّ ٱللَّهَ كَانَ عَزِيزًا حَكِيمًۭا", "english": "Those who disbelieve in Our signs -- We will burn them in fire; whenever their skins are exhausted, We will replace them with other skins so they may taste the punishment"}]}, {"label": "B. Adjectival exclusion -- \"other than X\" qualifying a noun", "count": "~34 ayahs", "examples": [{"ref": "2:230", "arabic": "فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجًا غَيْرَهُۥ", "english": "If he divorces her, she is not lawful to him thereafter until she marries a husband other than him"}, {"ref": "4:140", "arabic": "وَقَدْ نَزَّلَ عَلَيْكُمْ فِى ٱلْكِتَٰبِ أَنْ إِذَا سَمِعْتُمْ ءَايَٰتِ ٱللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا۟ مَعَهُمْ حَتَّىٰ يَخُوضُوا۟ فِى حَدِيثٍ غَيْرِهِۦ", "english": "He has sent down upon you in the Book that when you hear the signs of God being rejected and mocked, do not sit with them until they engage in a topic other than it"}]}, {"label": "C. Verbal form -- to change, alter (II form: ghayyara)", "count": "~5 ayahs", "examples": [{"ref": "4:119", "arabic": "وَلَأُضِلَّنَّهُمْ وَلَأُمَنِّيَنَّهُمْ وَلَءَامُرَنَّهُمْ فَلَيُبَتِّكُنَّ ءَاذَانَ ٱلْأَنْعَٰمِ وَلَءَامُرَنَّهُمْ فَلَيُغَيِّرُنَّ خَلْقَ ٱللَّهِ", "english": "And I will surely lead them astray, and arouse desires in them, and command them so they will cut the ears of cattle, and command them so they will change the creation of God"}]}]}, "qiraat": [{"arabic": "غَيْرَ", "translit": "ghayra", "status": "14", "type": "CE", "note": "Reading with fatha (accusative) instead of kasra (genitive) -- this changes ghayri from an adjective of alladhina to a circumstantial accusative (hal), meaning \"while being other than those under wrath.\" The grammatical shift changes the relationship: genitive = apposition (defining who they are), accusative = circumstantial (describing their state). Root change annotation: gh-y-r to s-w-y.", "source": "erquran.org"}, {"arabic": "سِوَى", "translit": "siwā", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing ghayri with siwa (other than, from s-w-y). ROOT CHANGE: gh-y-r to s-w-y. Both mean \"other than\" but siwa carries the additional sense of \"equal, level, balanced\" from its root s-w-y. This is NOT in the standard Hafs reading.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "12", "refs": "1:7;1:7;4:119;5:77;6:119;6:140;6:144;7:53;16:25;28:50", "note": "Otherness and straying are deeply linked -- \"leading astray without knowledge\" (bighayri ʿilm) is a recurring phrase; in this ayah, ghayri separates the favored from both the wrathful and the straying <- IN THIS AYAH"}, {"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "8", "refs": "1:7;1:7;4:119;5:1;5:3;8:53;31:20;35:3", "note": "Otherness and favor -- ghayri frequently appears in contexts where divine favor is at stake: conditions \"other than\" what is forbidden, states \"other than\" ingratitude <- IN THIS AYAH"}, {"coRoot": "gh-d-b", "coRootAr": "غ ض ب", "count": "4", "refs": "1:7;1:7;2:61;3:112", "note": "Otherness and wrath -- ghayri excludes the wrathful from the favored; in 2:61 and 3:112 \"bighayri l-haqq\" (without right) accompanies divine wrath <- IN THIS AYAH"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "1", "refs": "1:7", "note": "Path and otherness -- the sole co-occurrence defines the path by exclusion <- IN THIS AYAH"}], "critical": [{"cat": "GRAM", "pattern": "ghayri parsing: badal vs sifa vs hal", "kernel": "Three classical positions — each yields different theology"}, {"cat": "SEM", "pattern": "badal = favored defined by not-wrathful", "kernel": "Identity through exclusion"}, {"cat": "SEM", "pattern": "gh-y-r root = otherness AND jealousy/zeal", "kernel": "Exclusion carries protective-zeal undertone"}], "tag": "CRITICAL"}, {"id": 6, "arabic": "ٱلْمَغْضُوبِ", "translit": "al-maghḍūbi", "gloss": "those upon whom wrath has settled, the objects of anger", "root": "غ ض ب (gh-d-b)", "grammar": "Passive participle (ism al-mafʿul) from Form I, with definite article al-. Genitive (majrur), governed by the idafa with ghayri. The passive voice conceals the agent of wrath -- it does not say \"whom God angered\" or \"whom people angered.\"", "semantics": ["[7C] فَعَلَ (faʿala, I): to be angry, to be wrathful, to be furious; ghadiba ʿalayhi = he was angry with him", "[7C] Noun: ghadab = anger, wrath, fury, indignation; ghadba = a state of rage; ghadbān = angry (adjective)", "[7C] Classical (Lane's, Lisan al-Arab): ghadab is specifically a vehement, intense anger -- stronger than sukht (displeasure) and approaching ightiyaz (fury). The root carries connotations of reddening of the face, swelling with anger. Lane's also notes: ghadab can refer to the effect of anger (punishment) as much as the emotion itself. In the Quran, divine ghadab is an attribute-of-action, not an emotion.", "[7C] Passive participle: maghḍub = one upon whom wrath has descended/settled -- the state of being an object of anger, with the agent deliberately unspecified", "[7C] Classical additional (Lisan al-Arab): ghadab can also refer to a hard, red stone -- a concrete, physical manifestation of the root's sense of intense, heated solidity. This physical meaning enriches the metaphor: the wrathful state is hard, rigid, heated.", "Core concept: intense, vehement displeasure that settles upon its object -- from the emotional state to its consequences (punishment, exclusion, hardening)"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Divine wrath as action/state (ghadab as gerund)", "count": "~16 ayahs", "examples": [{"ref": "2:61", "arabic": "وَضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ وَٱلْمَسْكَنَةُ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ", "english": "And humiliation and poverty were stamped upon them, and they returned with wrath from God"}, {"ref": "3:112", "arabic": "ضُرِبَتْ عَلَيْهِمُ ٱلذِّلَّةُ أَيْنَ مَا ثُقِفُوٓا۟ إِلَّا بِحَبْلٍۢ مِّنَ ٱللَّهِ وَحَبْلٍۢ مِّنَ ٱلنَّاسِ وَبَآءُو بِغَضَبٍۢ مِّنَ ٱللَّهِ", "english": "Humiliation was stamped upon them wherever they were found, except by a rope from God and a rope from people, and they returned with wrath from God"}]}, {"label": "B. al-maghḍub as passive participle (this ayah's unique form)", "count": "1 ayah", "examples": []}, {"label": "C. ghaḍiba as verb (God angered, became angry)", "count": "~4 ayahs", "examples": [{"ref": "5:60", "arabic": "مَن لَّعَنَهُ ٱللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ ٱلْقِرَدَةَ وَٱلْخَنَازِيرَ وَعَبَدَ ٱلطَّٰغُوتَ", "english": "Those whom God has cursed and with whom He has been angry and made among them apes and pigs and servants of idols"}]}]}, "qiraat": [{"arabic": "الْمَغْطُوبِ", "translit": "al-maghṭūbi", "status": "None", "type": "ibdal", "note": "Variant with tha replacing dad -- a phonetic shift (ibdal) that produces a non-standard form. Status unclassified. This does not meaningfully change the semantic content.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-l-l", "coRootAr": "ض ل ل", "count": "2", "refs": "1:7;5:60", "note": "Wrath and straying paired -- in 1:7 as two distinct categories of deviation from the path; in 5:60 as consequence (God angered AND they strayed further) <- IN THIS AYAH"}, {"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "4", "refs": "1:7;1:7;2:61;3:112", "note": "Wrath and otherness -- in 1:7 ghayri excludes the wrathful; in 2:61 and 3:112 \"bighayri l-haqq\" (without right/justification) accompanies wrath <- IN THIS AYAH"}], "critical": [{"cat": "HAPAX", "pattern": "al-maghdubi = only passive participle of gh-d-b", "kernel": "Unique form in Quran — unprecedented for this root"}, {"cat": "GRAM", "pattern": "passive voice conceals agent of wrath", "kernel": "Text refuses to specify who is wrathful"}, {"cat": "SEM", "pattern": "wrath as settled STATE not event", "kernel": "Passive participle = condition that descended upon objects"}, {"cat": "SEM", "pattern": "ghadab = hard red stone in Lane's", "kernel": "Physical meaning resonates with spiritual petrification"}], "tag": "CRITICAL"}, {"id": 7, "arabic": "عَلَيْهِمْ", "translit": "ʿalayhim", "gloss": "upon them", "root": "onlarin uzerine", "grammar": "ع ل و ('-l-w)", "semantics": ["[7C] Same preposition as word 4, here marking the target of wrath rather than the recipient of favor -- the identical grammatical structure carrying opposite semantic valence", "Core concept: superposition of wrath upon its objects"], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "عَلَيْهُمْ", "translit": "ʿalayhum", "status": "7", "type": "vhr", "note": "Canonical variant with damma on ha instead of kasra -- a dialectal phonetic difference with no semantic impact", "source": "erquran.org"}, {"arabic": "عَلَيْهُمُۥ", "translit": "ʿalayhumū", "status": "Irreg", "type": "vhr|madd", "note": "Irregular variant with damma and madd extension -- phonetic variation without semantic change", "source": "erquran.org"}, {"arabic": "عَلَيْهِمِۦ", "translit": "ʿalayhimī", "status": "14", "type": "vhr|madd", "note": "14-reading variant with kasra and madd extension", "source": "erquran.org"}], "cooccurrence": [], "critical": [{"cat": "STRUCT", "pattern": "'alayhim repeated opposing valences", "kernel": "Favor-upon-them / wrath-upon-them — structural mirror"}, {"cat": "SEM", "pattern": "'ala forces same spatial metaphor both", "kernel": "Something descends and settles UPON — whether grace or anger"}], "tag": "Prepositional phrase: preposition ʿala + 3rd person masculine plural pronoun -him. Second occurrence in the ayah, now marking the objects of wrath (vs first occurrence marking recipients of favor)."}, {"id": 8, "arabic": "وَلَا", "translit": "wa-lā", "gloss": "and not, nor", "root": "ve degil, ne de", "grammar": "—", "semantics": [], "occurrences": {"type": "none"}, "qiraat": [{"arabic": "وَغَيْرَ", "translit": "wa-ghayra", "status": "shawadhdh", "type": "Lx", "note": "Anomalous variant replacing wa-la with wa-ghayra (and other than). ROOT CHANGE: from conjunction/negation to gh-y-r. This would read: \"other than those under wrath upon them, AND other than those who stray\" -- repeating the exclusion structure rather than coordinating with a negation. NOT in the standard Hafs reading.", "source": "erquran.org"}, {"arabic": "وَغَيْرِ", "translit": "wa-ghayri", "status": "shawadhdh", "type": "Lx|CE", "note": "Anomalous variant wa-ghayri (genitive) -- same as above but with kasra matching the genitive case of the preceding ghayri. ROOT CHANGE: to gh-y-r. NOT in the standard Hafs reading.", "source": "erquran.org"}], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "wa-la = coordination + negation", "kernel": "Not independent negation but coordinated exclusion"}, {"cat": "STRUCT", "pattern": "ghayri then wa-la = deliberate asymmetry", "kernel": "First exclusion by noun second by negation — groups differ"}, {"cat": "SEM", "pattern": "shawadhdh wa-ghayri = perfect parallelism", "kernel": "Standard text breaks parallelism intentionally"}], "tag": "Conjunction wa + negation particle la. The wa here is ʿatf (coordination), coordinating the second exclusion (al-dallin) with the first (al-maghdubi ʿalayhim). la is a particle of absolute negation (la l-nafiya li-l-jins or la l-ʿatifa depending on parsing)."}, {"id": 9, "arabic": "ٱلضَّآلِّينَ", "translit": "aḍ-ḍāllīna", "gloss": "those who go astray, those who are lost, the wanderers", "root": "ض ل ل (d-l-l)", "grammar": "Active participle (ism al-faʿil), masculine plural, with definite article al-. Genitive (majrur) coordinated with al-maghḍūbi. The active voice contrasts with al-maghḍūbi (passive): those who stray do so actively, while those under wrath receive it passively.", "semantics": ["[7C] فَعَلَ (faʿala, I): to stray, to wander, to lose one's way, to err, to go astray; dalla ʿani l-tariq = he strayed from the path; dalla l-shay' = the thing was lost, perished", "[7C] أَفْعَلَ (afʿala, IV): adalla = to cause to stray, to lead astray, to mislead, to cause to err", "[7C] Noun: dalal/dalala = straying, error, misguidance, wandering; dalil = one who is lost; adall = more astray (comparative)", "[7C] Classical (Lane's, Lisan al-Arab): dalla also means \"to perish, to be destroyed, to be lost (as water absorbed into earth)\"; dalla l-labn fi l-ma' = the milk was lost in the water (dissolved, vanished). Also: dalla ʿanhu = he forgot it, it was lost from his memory. The root encompasses physical losing-of-way AND cognitive losing-of-knowledge AND material dissolution/perishing.", "[7C] Classical additional: dall can also mean \"gentle, soft, supple (of a branch)\" -- a meaning far from \"straying\" but attested in pre-Islamic poetry. This preserves a semantic tension: the same root that means \"to wander off-path\" also describes the gentle swaying of a branch -- movement without fixed direction can be pathological (straying) or natural (swaying).", "[M] Modern: misinformation, systematic error, data corruption -- any deviation from a correct/intended trajectory in information systems", "[F] Futuristic: algorithmic drift, model degradation, value misalignment -- any system that progressively deviates from its intended function or goal", "Core concept: deviation from a defined path or state -- encompassing physical wandering, cognitive error, spiritual misguidance, and material dissolution"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle (dallin/dall) -- those in the state of straying", "count": "~17 ayahs", "examples": [{"ref": "6:77", "arabic": "فَلَمَّا رَءَا ٱلْقَمَرَ بَازِغًۭا قَالَ هَٰذَا رَبِّى ۖ فَلَمَّآ أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِى رَبِّى لَأَكُونَنَّ مِنَ ٱلْقَوْمِ ٱلضَّآلِّينَ", "english": "When he saw the moon rising he said: this is my lord. But when it set he said: unless my Lord guides me, I will surely be among the people who stray"}, {"ref": "23:106", "arabic": "قَالُوا۟ رَبَّنَا غَلَبَتْ عَلَيْنَا شِقْوَتُنَا وَكُنَّا قَوْمًۭا ضَآلِّينَ", "english": "They will say: our Lord, our wretchedness overcame us and we were a people astray"}]}, {"label": "B. Verb (dalla/yudillu) -- to stray or to cause to stray", "count": "~112 ayahs", "examples": [{"ref": "6:39", "arabic": "وَٱلَّذِينَ كَذَّبُوا۟ بِـَٔايَٰتِنَا صُمٌّۭ وَبُكْمٌۭ فِى ٱلظُّلُمَٰتِ ۗ مَن يَشَإِ ٱللَّهُ يُضْلِلْهُ وَمَن يَشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٍۢ مُّسْتَقِيمٍۢ", "english": "Those who deny Our signs are deaf and mute, in darknesses. Whomever God wills He leads astray, and whomever He wills He places upon a straight path"}, {"ref": "28:15", "arabic": "فَوَكَزَهُۥ مُوسَىٰ فَقَضَىٰ عَلَيْهِ ۖ قَالَ هَٰذَا مِنْ عَمَلِ ٱلشَّيْطَٰنِ ۖ إِنَّهُۥ عَدُوٌّۭ مُّضِلٌّۭ مُّبِينٌۭ", "english": "Musa struck him and killed him. He said: this is from the work of Satan -- he is a clearly misleading enemy"}]}, {"label": "C. Comparative (adall) -- more astray than", "count": "~14 ayahs", "examples": [{"ref": "7:179", "arabic": "وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًۭا مِّنَ ٱلْجِنِّ وَٱلْإِنسِ ۖ لَهُمْ قُلُوبٌۭ لَّا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌۭ لَّا يُبْصِرُونَ بِهَا وَلَهُمْ ءَاذَانٌۭ لَّا يَسْمَعُونَ بِهَآ ۚ أُو۟لَٰٓئِكَ كَٱلْأَنْعَٰمِ بَلْ هُمْ أَضَلُّ", "english": "We have created for Hell many of the jinn and humanity -- they have hearts they do not understand with, eyes they do not see with, ears they do not hear with. Those are like cattle, rather they are more astray"}]}]}, "qiraat": [{"arabic": "الضَّأَلِّينَ", "translit": "aḍ-ḍaʾallīna", "status": "Irreg", "type": "hmz", "note": "Irregular variant inserting hamza -- a phonetic variation that does not change meaning. NOT in the standard Hafs reading.", "source": "erquran.org"}, {"arabic": "الضَّالُّونَ", "translit": "aḍ-ḍāllūna", "status": "None", "type": "CE", "note": "Variant with nominative case ending (waw-nun) instead of genitive/accusative (ya-nun) -- this would break the grammatical agreement with the genitive context. Status unclassified.", "source": "erquran.org"}, {"arabic": "الضَّالِّينَ آمِينَ", "translit": "aḍ-ḍāllīna āmīna", "status": "None", "type": "+-", "note": "Variant adding amin after the final word -- incorporating the supplicatory response into the recitation itself. Status unclassified.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "gh-y-r", "coRootAr": "غ ي ر", "count": "12", "refs": "1:7;1:7;4:119;5:77;6:119;6:140;6:144;7:53;16:25;28:50", "note": "Straying and otherness deeply paired -- \"leading astray without knowledge\" (bighayri ʿilm) is a major Quranic theme; straying involves entering what is \"other than\" the correct path <- IN THIS AYAH"}, {"coRoot": "n-'-m", "coRootAr": "ن ع م", "count": "5", "refs": "1:7;4:119;7:179;25:44;39:8", "note": "Favor and straying as antitheses -- those who receive favor vs those who stray; in 4:119 Satan leads astray AND alters creation (double deviation from niʿma) <- IN THIS AYAH"}, {"coRoot": "gh-d-b", "coRootAr": "غ ض ب", "count": "2", "refs": "1:7;5:60", "note": "Straying and wrath -- the two negative categories of 1:7 co-occur in 5:60 where God curses, becomes angry, AND makes them apes/pigs (wrath leads to further degradation) <- IN THIS AYAH"}, {"coRoot": "s-r-t", "coRootAr": "ص ر ط", "count": "2", "refs": "1:7;6:39", "note": "Straying and path -- in 6:39 \"whom God wills He leads astray, whom He wills He places upon a straight path\" directly links straying with the sirat <- IN THIS AYAH"}, {"coRoot": "s-b-l", "coRootAr": "س ب ل", "count": "35", "refs": "1:7;2:108;4:44;4:88;4:143;4:167;5:12;5:60;5:77;6:116", "note": "Straying and path (sabil) -- the most frequent co-occurrence for d-l-l (35 ayahs), showing straying is fundamentally defined against the path-concept. \"Dalla sawa'a l-sabil\" (strayed from the middle of the road) appears in 2:108, 5:12."}], "critical": [{"cat": "GRAM", "pattern": "active participle vs passive in al-maghdubi", "kernel": "Strayers act; wrath-recipients receive — central opposition"}, {"cat": "SEM", "pattern": "two failure models: transgression vs deviation", "kernel": "External consequence (wrath) vs self-generated loss (stray)"}, {"cat": "SEM", "pattern": "dalla = dissolve perish (milk in water)", "kernel": "Straying is dissolution of identity not just wrong direction"}, {"cat": "ECHO", "pattern": "doubled lam in d-l-l enacts recursion", "kernel": "Sound redoubles mirroring compounding loss"}, {"cat": "INTER", "pattern": "d-l-l + s-b-l cooccur 35 ayahs", "kernel": "Straying defined against path — no path no straying"}], "tag": "CRITICAL"}], "questions": ["The passive participle al-maghḍūbi deliberately conceals the agent of wrath -- is this concealment a universal principle (wrath has no single source) or a rhetorical device to avoid naming God as the agent of anger in a prayer addressed to God?", "Why does the Quran use sirat (45 occurrences) rather than sabil (176 occurrences) in al-Fatiha -- is the narrower, more defined connotation of sirat (bridge, corridor) essential to the prayer's function?", "The two excluded groups (al-maghḍūbi and al-ḍāllīna) are distinguished by active vs passive voice -- can a person be in both categories simultaneously, or are they mutually exclusive modes of failure?", "ghayri's root gh-y-r carries \"jealousy/protective zeal\" alongside \"otherness\" -- does the exclusion of the wrathful carry an undertone of protective zeal for the purity of the path?", "The shawadhdh variant adding amin at the end blurs the boundary between text and response -- does this suggest amin was once considered part of the text rather than a congregational addition?", "anʿamta appears without explicit object (intransitive) -- is this elision deliberate to maximize the scope of divine favor, or does the object (\"upon them\") effectively function as the object through the preposition ʿala?", "The doubled lam in d-l-l phonetically enacts compounding loss -- does the Quran's frequent use of doubled-root words (z-l-z-l, w-s-w-s, d-l-l) consistently mirror semantic content through sound?", "If the shawadhdh variant mananta (m-n-n) were accepted, the prayer would carry an undertone of divine reproach alongside bestowal -- does this tension between generosity and reminder exist in the standard reading through other means?", "The co-occurrence of gh-d-b and d-l-l in 5:60 shows both categories appearing as consequences in a single narrative -- does this undermine the neat binary of 1:7, or does it show they are stages rather than types?", "Could the active-passive opposition (straying = active, wrath = passive) map to a temporal or causal sequence: first active straying, then passive reception of its consequence (wrath)?", "In the context of modern systems, could al-maghḍūbi (those under settled systemic displeasure) represent structural oppression, while al-ḍāllīna (those who actively stray) represent willful deviation from established protocols?"], "key": "1:7"}};
    const __EMBEDDED_BOUNDARY_DATA__ = {"1": {"1-2": [{"labels": ["particle_bridge"], "text": "The Basmala (1:1) is a verbless prepositional fragment — bi-smi requires an elided verb (abda'u, aqra'u, asta'inu) whose content remains permanently unspecified. Al-ḥamdu lillāhi (1:2) supplies the first actual predication in the Quran: a complete nominal sentence with subject and predicate. The grammatical incompleteness of 1:1 creates a syntactic vacuum that 1:2 fills — the elided verb of the Basmala finds its first concrete realization in the act of ḥamd. Reading across the boundary, \"in the name of God\" becomes \"in the name of God — [all] praise belongs to God,\" where the open-ended preposition retroactively acquires ḥamd as its governing action."}, {"labels": ["root_handoff"], "text": "The root '-l-h appears in Allāhi (1:1) and is immediately reprised in lillāhi (1:2), but with a critical grammatical shift: in 1:1, Allāh is the muḍāf ilayh (possessor of the name), reached through the genitive construct bismi llāhi; in 1:2, Allāh is the object of the lām preposition (recipient/owner of praise). The same divine referent pivots from being \"named\" to being \"praised\" — from identity-declaration to merit-recognition. Lane's notes that '-l-h carries both \"bewilderment/refuge\" and \"worship\"; the boundary enacts this progression: the naming in 1:1 (identifying the one to whom one turns) yields to the praise in 1:2 (the first act of worship directed at that identified entity)."}, {"labels": ["semantic_bridge"], "text": "The root s-m-w (ism, \"name/elevation/mark\") in 1:1 and the root ḥ-m-d (ḥamd, \"praise/recognition of intrinsic merit\") in 1:2 form a conceptual pair that neither ayah activates alone. Lane's defines ism as \"that which elevates/distinguishes its bearer\" and ḥamd as \"acknowledging excellence that exists in the object itself, regardless of personal benefit.\" Across the boundary, naming (identifying what something IS) leads directly to praising (declaring that what it IS is excellent). The Basmala's act of invoking the divine name is not neutral labeling — it is already an implicit acknowledgment of the merit that 1:2 makes explicit. Conversely, the praise in 1:2 is grounded because the name has already been spoken; ḥamd without prior ism would be praise of an unnamed entity."}, {"labels": ["semantic_bridge"], "text": "The paired attributes ar-Raḥmān ar-Raḥīm (1:1, root r-ḥ-m) describe HOW God relates to creation through mercy, while rabb al-'ālamīn (1:2, root r-b-b + '-l-m) describes WHAT God does with creation through nurturing cultivation. Lane's defines raḥma as \"the womb — the protective enclosure that enables growth\" and rabb as \"one who brings a thing from incompleteness to completion stage by stage.\" The boundary reveals that mercy (r-ḥ-m) is the mode and nurturing (r-b-b) is the method: the womb-like encompassing of Raḥmān/Raḥīm in 1:1 becomes the stage-by-stage developmental cultivation of Rabb in 1:2. Neither ayah alone shows this mercy-to-pedagogy arc."}, {"labels": ["register_shift"], "text": "1:1 is a formulaic invocation with no grammatical person — no speaker, no addressee, no verb. The Basmala floats as a preposition attached to an absent action, maximally impersonal. 1:2 introduces the first declarative proposition in the Quran: al-ḥamdu lillāhi is a complete predication that, while still third-person in surface grammar, implies a speaking subject who declares praise. The shift from verbless formula to assertive declaration marks the Quran's transition from invocation to speech — from ritual threshold to theological statement."}, {"labels": ["scene_shift"], "text": "The Basmala operates as a threshold marker — a liminal formula that precedes action (like \"once upon a time\" or \"in the name of the court\"). It names but does not yet describe. At the boundary, 1:2 opens the actual content of the Fātiḥa with a cosmological claim: God is rabb al-'ālamīn, nurturer of all realms of existence. The scope expands from a single naming act (one name, one God, two attributes) to a universal ontological statement (all worlds, all categories of being). The '-l-m root in al-'ālamīna — carrying \"knowledge, signs, worlds\" (Lane's: every created thing is a sign by which the Rabb is known) — transforms the intimate naming register of 1:1 into a panoramic survey of all knowable reality."}, {"labels": ["pronoun_chain"], "text": "There is no explicit pronoun crossing this boundary, but the implicit referent chain is significant: the elided subject of the Basmala (the unnamed \"I\" who begins in God's name) becomes the implied declarer of al-ḥamdu lillāhi in 1:2. The identity of the speaker is never stated in either ayah — yet the grammatical dependency between a preposition needing a verb (1:1) and a declaration needing a declarer (1:2) creates a phantom first-person that threads across the boundary. This unnamed subject is simultaneously the reciter, the Prophet, and any conscious being who enters the text."}], "2-3": [{"labels": ["particle_bridge"], "text": "The genitive case (kasra) on ar-raḥmāni and ar-raḥīmi in 1:3 is syntactically incomplete without 1:2 — these forms function as na't (attributive adjectives) of Allāhi or as further badal (apposition) to rabbi, both of which reside in the preceding ayah. The grammatical construction begun by lillāhi rabbi l-'ālamīna in 1:2 REQUIRES 1:3 to complete the chain of divine descriptors. Without 1:2, the genitive case of ar-raḥmāni r-raḥīmi has no governing element; without 1:3, the identity of the rabb remains defined only by scope (al-'ālamīna) but not by relational quality. The lām of istiḥqāq in lillāhi projects its governance across the boundary into the attributive chain."}, {"labels": ["root_handoff"], "text": "Root r-b-b (rabb, \"nurturer who brings from incompleteness to completion through stages\" — Lane's) in 1:2 hands off to root r-ḥ-m (raḥmān/raḥīm, \"visceral womb-sourced tenderness\" — Lane's: raqqat al-qalb) in 1:3. This is not mere repetition of \"God is good\" — r-b-b denotes authority-driven cultivation (Lane's: \"one who nurtures a thing from state to state until it reaches its complete condition\"), while r-ḥ-m denotes involuntary, constitutive caring sourced from the womb (raḥim). The boundary is the precise point where divine authority transforms into divine intimacy: the rabb who owns and manages all worlds is immediately revealed to operate through womb-like mercy, not coercion. Classical lexicographers (Lisan al-Arab) note raḥim as the physical womb — making the cultivator-to-womb transition across this boundary a deliberate semantic arc."}, {"labels": ["semantic_bridge"], "text": "The word al-'ālamīna (root '-l-m, \"worlds as sign-systems, domains of knowability\" — Lane's: \"everything by which the Rabb is known\") in 1:2 activates a specific reading of ar-raḥmān in 1:3: if each 'ālam is a domain through which the Rabb is recognized, then ar-raḥmān names the MODE of that recognition — mercy as the primary sign. Lane's notes al-'ālam derives from 'alāma (sign, indicator); the sign that all worlds emit, once 1:3 arrives, is identified as raḥma. The bridge also operates through the classical distinction (Lisan al-Arab) that ar-Raḥmān denotes raḥma 'āmma (general mercy encompassing all creation) — precisely matching the universal scope of al-'ālamīna. The totality of worlds in 1:2 finds its governing principle in the totality of mercy in 1:3."}, {"labels": ["pronoun_chain"], "text": "No overt pronoun appears at this boundary, yet the implicit referent performs a four-stage chain across 1:2–1:3: Allāh (named, lillāhi) → rabb (appositive, redefining God as nurturer) → ar-Raḥmān (attribute, redefining the nurturer as intensely merciful) → ar-Raḥīm (attribute, specifying that mercy as permanent trait). Each term across the boundary narrows the referent's identity without introducing a new subject. The absence of any conjunction (wa, fa, thumma) between 1:2 and 1:3 reinforces that these are not separate claims but a single cascading identification — the grammatical subject never shifts, it only deepens."}, {"labels": ["register_shift"], "text": "Ayah 1:2 is a complete jumla ismiyya (nominal sentence) — a self-standing declaration with mubtada' (al-ḥamdu) and khabar (lillāhi) plus appositional elaboration. It makes a CLAIM. Ayah 1:3, by contrast, contains no sentence structure at all — it is pure adjectival attribution, two ṣifas (qualities) hanging in genitive dependency on the preceding ayah. The register shifts from assertive declaration (\"all praise belongs to God, nurturer of all realms\") to intimate characterization (\"the overwhelmingly merciful, the perpetually merciful\"). This is a shift from WHAT IS TRUE about the universe (praise belongs to God) to WHO GOD IS in relation to that universe (mercy-defined). The hearer moves from cosmic theology to personal encounter."}, {"labels": ["scene_shift"], "text": "The scope narrows dramatically at this boundary. Ayah 1:2 establishes the widest possible frame: al-ḥamdu (the entire category of praise) + lillāhi (the singular God) + rabbi l-'ālamīna (the nurturer of every realm of existence). This is maximally expansive — all praise, all worlds. Then 1:3 zooms into the interior quality of that vast Lord: not what He governs but HOW He governs. The fa'lān pattern of raḥmān (overflowing intensity) paired with the fa'īl pattern of raḥīm (enduring constancy) creates a dual-lens focus on divine interiority. The scene shifts from the external panorama of cosmic lordship to the internal texture of divine character — from telescope to microscope."}], "3-4": [{"labels": ["semantic_bridge"], "text": "The root r-ḥ-m (mercy, womb-sourced tenderness) in 1:3 meets d-y-n (debt, judgment, recompense) in 1:4, creating a retroactive reframing: the classical sense of dāna = \"to owe a debt, to be judged\" (Lane's: dayyān = \"one who requites, rewards, or punishes\") recasts ar-Raḥmān ar-Raḥīm from a nurturing quality into the character of the judge. The merciful one is not separate from the judge — the judge's defining trait IS mercy. This semantic collision is invisible when either ayah is read alone: r-ḥ-m without d-y-n is pure tenderness; d-y-n without r-ḥ-m is pure accountability. The boundary fuses them into a single identity."}, {"labels": ["register_shift"], "text": "1:3 presents two attributes of pure character — ar-Raḥmān ar-Raḥīm are timeless qualities with no temporal anchor, no domain specified, no action implied. At the boundary, 1:4 introduces temporal specificity (yawm = a bounded period, an epoch, a decisive juncture — Lane's: \"a particular time in which an event occurs\") and institutional authority (mālik = one who has something firmly in his grasp — Lane's: malaka l-'ajīna = \"he kneaded the dough thoroughly,\" i.e., total mastery). The shift moves from WHO God is (character) to WHAT God governs (a specific domain of consequence), from being to jurisdiction."}, {"labels": ["particle_bridge"], "text": "Both 1:3 and 1:4 are verbless genitive constructions in apposition to rabb al-'ālamīn in 1:2 — ar-Raḥmāni ar-Raḥīmi and māliki yawmi d-dīni share the same kasra (genitive) ending and the same syntactic dependency. There is no conjunction (wa), no verb, no predicate break: the grammar treats the mercy-pair and the sovereignty-claim as a single continuous predication. Removing the boundary marker, the chain reads rabb-al-'ālamīn-ar-Raḥmān-ar-Raḥīm-mālik-yawm-al-dīn — one unbroken genitive descent from lordship through mercy to judgment."}, {"labels": ["root_handoff"], "text": "The root m-l-k in mālik activates a semantic field (mulk = dominion, malakūt = celestial sovereignty, malik = king, mamlūk = that which is owned) that answers a question left open by r-ḥ-m: mercy toward whom, and with what authority? The fa'lān/fa'īl patterns of ar-Raḥmān ar-Raḥīm established intensity and permanence of character; the fā'il pattern of mālik now establishes the scope of that character's authority. The handoff is from quality (r-ḥ-m) to jurisdiction (m-l-k), and the qirā'āt variant mālik (owner/possessor) vs malik (king/sovereign) intensifies the handoff — owner implies intimate possession (aligned with the womb-intimacy of r-ḥ-m), king implies public authority (aligned with the institutional weight of d-y-n)."}, {"labels": ["scene_shift"], "text": "1:3 operates in a realm of pure attribute — no place, no time, no event, just two adjectives describing an essence. At 1:4, a scene crystallizes: there is now a specific day (yawm), a specific system (al-dīn, THE recompense — definite, known, particular), and a specific role (mālik, the one in control). The shift is from abstract theology to concrete eschatology, from timeless description to a moment that will arrive. The triple iḍāfa (mālik-yawm-al-dīn) creates cascading specificity that contrasts sharply with the open, unbounded mercy of 1:3."}, {"labels": ["pronoun_chain"], "text": "No explicit pronoun appears in either ayah, yet the referent (God, introduced as rabb al-'ālamīn in 1:2) carries across the boundary entirely through genitive apposition — the grammatical case itself functions as the pronoun chain. The absence of any re-introduction or anaphoric pronoun means the listener must hold the referent continuously from 1:2 through 1:3 into 1:4. This implicit chain binds mercy and sovereignty to a single, unbroken subject without ever naming it again."}, {"labels": ["semantic_bridge"], "text": "The classical lexicographic note that ar-Raḥīm denotes raḥma khāṣṣa (specific, directed mercy — Lisan al-Arab) while ar-Raḥmān denotes raḥma 'āmma (general, universal mercy) creates a narrowing trajectory that continues into 1:4: from universal mercy (Raḥmān) to directed mercy (Raḥīm) to a specific day of a specific system (yawm al-dīn). The boundary between 1:3 and 1:4 is the pivot where this narrowing accelerates — from the most intimate divine quality (Raḥīm, the permanently merciful) directly into the most consequential divine function (Mālik yawm al-dīn, master of the reckoning)."}], "4-5": [{"labels": ["register_shift"], "text": "The most dramatic shift in the entire Quran occurs at this boundary: 1:4 is third-person description of God (māliki yawmi d-dīn — \"Master of the Day of Recompense\"), while 1:5 pivots to second-person direct address (iyyāka na'budu — \"You alone we serve\"). The speaker moves from talking ABOUT God to talking TO God. This is known in classical rhetoric as iltifāt (shift of grammatical person), and classical commentators mark it as the hinge of al-Fātiḥa — the moment where theology becomes encounter, where the catalogue of divine attributes (1:2-4) finds its purpose as the ground for direct speech."}, {"labels": ["pronoun_chain"], "text": "The referent accumulated across 1:2-4 — Rabb al-'ālamīn, al-Raḥmān al-Raḥīm, Mālik yawm al-dīn — is the unnamed \"He\" to whom all these attributes belong. At 1:5, this accumulated referent is captured by the second-person pronoun -ka in iyyāka. The chain is not explicit (no huwa appears in 1:2-4), but the attributes build a composite identity that the pronoun then addresses. The shift from implicit third-person referent to explicit second-person addressee means every attribute in 1:2-4 now saturates the \"You\" of 1:5; the listener understands exactly WHO is being addressed because of the preceding chain."}, {"labels": ["semantic_bridge"], "text": "The root m-l-k in mālik (1:4) establishes absolute ownership and sovereignty — Lane's core sense of \"having something firmly in one's grasp.\" This activates the meaning of 'ibāda in na'budu (1:5, root '-b-d) not merely as ritual worship but as the response of the owned to the Owner: 'abd means both slave and worshipper, and it is specifically the mālik/malik framing that selects the servitude-and-devotion polysemy of '-b-d. Without mālik preceding it, na'budu could lean toward mere ritual; with mālik, the full semantic range of '-b-d (slave, servant, one whose capacity is entirely at the disposal of the master) is engaged."}, {"labels": ["semantic_bridge"], "text": "The root d-y-n in al-dīn (1:4) carries the extraordinary double meaning of debt/recompense AND submission/obedience (Lane's: dāna lahu = \"he submitted to him\"). This meaning of submission crosses directly into na'budu (1:5), where the speakers enact that very submission. But d-y-n also means \"systematic accountability\" — and this crosses into nasta'īnu (1:5, root '-w-n, Form X = seeking aid), because the one who recognizes they stand within a system of recompense (dīn) is precisely the one who acknowledges insufficient capacity and seeks enabling power (isti'āna). The debt-consciousness of d-y-n motivates the aid-seeking of '-w-n."}, {"labels": ["particle_bridge"], "text": "The triple iḍāfa construction in 1:4 (māliki yawmi d-dīn) is a verbless nominal phrase functioning as an attribute in apposition. It has no predicate, no verb, no addressee — it is grammatically suspended. The verb and addressee arrive only in 1:5 (iyyāka na'budu), where the first-person plural verb and the second-person pronoun complete what 1:4 left open. In syntactic terms, 1:4 builds the ground (who God is) and 1:5 supplies the response (what follows from that identity). The absence of a finite verb in 1:4 creates a grammatical tension that 1:5 resolves with two verbs (na'budu, nasta'īnu)."}, {"labels": ["scene_shift"], "text": "The temporal frame shifts at this boundary. 1:4 is oriented toward yawm al-dīn — a future (or eternal) temporal marker, the Day of Recompense. 1:5 snaps into the present tense: na'budu and nasta'īnu are imperfect indicative verbs expressing continuous present action. The scene moves from contemplating a cosmic future event to enacting a present-tense relationship. The effect is that the eschatological horizon of 1:4 does not remain abstract — it is answered by immediate, ongoing practice in 1:5. The future accountability (yawm al-dīn) generates present devotion (na'budu) and present dependence (nasta'īnu)."}, {"labels": ["root_handoff"], "text": "The concept of mulk/mālik (root m-l-k, sovereignty and ownership) in 1:4 is answered by isti'āna (root '-w-n, seeking aid) in 1:5. Lane's records that '-w-n carries the core sense of \"strengthening through external support\" and that the one seeking 'awn \"acknowledges insufficient capacity on their own.\" This is the logical complement to mālik: the one who possesses absolute sovereignty (m-l-k) is the one from whom aid must be sought ('-w-n). The root handoff is not mere repetition but causal — sovereignty in 1:4 is the premise; seeking aid in 1:5 is the entailment."}], "5-6": [{"labels": ["register_shift"], "text": "Ayah 1:5 uses first-person plural declarative statements (na'budu, nasta'inu — \"we worship, we seek aid\"), asserting what the speakers do. Ayah 1:6 shifts to imperative mood (ihdina — \"guide us\"), converting the speakers from declarers into petitioners. The grammatical person of the addressee remains second-person singular throughout (iyyaka / implicit \"You\" in the imperative), but the speech act transforms from declaration of allegiance to active supplication. This is the surah's pivot: the community first establishes its credentials (exclusive worship + exclusive reliance) and only then is authorized to make a request."}, {"labels": ["particle_bridge"], "text": "The conjunction wa in 1:5 links worship (na'budu) to seeking aid (nasta'inu), and the Form X ista'ana (seeking enablement from an external source, root '-w-n) semantically requires that the aid sought be specified. Ayah 1:6 supplies precisely that specification: the aid requested is hidaya (guidance, root h-d-y) toward a particular path. The isti'ana of 1:5 is grammatically complete but semantically incomplete — it begs the question \"aid for what?\" — and 1:6 answers it. The boundary functions as an implicit li- (for/toward): \"we seek Your aid [for this]: guide us to the straight path.\""}, {"labels": ["semantic_bridge"], "text": "The root '-b-d in na'budu carries the classical meaning of smoothing/paving a road by treading it (Lane's: 'abada al-tariqa = he trod and made smooth the road). The root s-r-t in sirat means a wide, clear, engineered road that \"swallows\" its traveler. The act of 'ibada in 1:5 — understood through its concrete etymological sense of path-making through labor — prepares the ground for the sirat of 1:6. The worshipper who treads and smooths ('abada) is then asked to be placed on the already-smooth, already-wide road (sirat). The lexical archaeology reveals that the boundary joins two road metaphors: making a path (through devoted labor) and being placed on THE path (through divine guidance)."}, {"labels": ["semantic_bridge"], "text": "Form X nasta'inu in 1:5 (seeking external enablement, acknowledging insufficient personal capacity) activates a specific semantic field: the speakers cannot reach their destination alone. In 1:6, ihdi-na (guide us) from root h-d-y carries the classical sense of \"to precede, to go before\" — the guide walks ahead of the one being guided (Lane's). The bridge is precise: those who confess they cannot enable themselves (isti'ana) are answered by a mode of aid where the source literally leads from the front (hidaya). The Form X \"seeking\" in 1:5 finds its object in the imperative \"lead us\" of 1:6."}, {"labels": ["pronoun_chain"], "text": "The first-person plural subject -na runs unbroken across the boundary: na'budu (we worship), nasta'inu (we seek aid), ihdi-na (guide us). The second-person singular addressee likewise persists: iyyaka (You alone) in 1:5 becomes the implicit subject of the imperative ihdi (You guide) in 1:6. Both the \"we\" and the \"You\" carry across without restatement, but the relationship between them transforms — from parallel declarations of exclusivity (iyyaka...iyyaka) to a direct imperative request. The pronoun chain is the thread; the boundary is where the thread changes texture from statement to plea."}, {"labels": ["root_handoff"], "text": "Root '-w-n (aid, enablement) in nasta'inu and root q-w-m (standing, uprightness, self-maintenance) in al-mustaqim perform a handoff across the boundary. The speakers seek 'awn (strengthening through external support) in 1:5; in 1:6 they specify the destination of that support — a path that is mustaqim, from Form X istaqama (self-standing, self-correcting, maintaining its own straightness). The handoff is structurally exact: the seekers of external standing-power ('-w-n) ask to be placed on the path that possesses internal standing-power (q-w-m). What they lack, the path has. The aid sought is alignment with something already upright."}, {"labels": ["scene_shift"], "text": "Ayah 1:5 is abstract and relational — two verbs of inner disposition (worship, seek aid) with no spatial or sensory content. Ayah 1:6 introduces concrete spatial imagery: a road (sirat) with a physical quality (mustaqim — straight, upright). The scene shifts from the interior (the stance of the soul toward God) to the exterior (a path stretching ahead with directional properties). The boundary is the threshold between declaring one's orientation and seeing where that orientation leads — from posture to landscape."}], "6-7": [{"labels": ["particle_bridge"], "text": "The noun sirata in 1:7 stands in apposition (badal) to al-sirata l-mustaqima in 1:6, making the entire ayah 1:7 grammatically dependent on the imperative clause of 1:6. Without ihdina al-sirata l-mustaqima, the phrase sirata lladhina has no syntactic anchor. The imperative verb ihdina in 1:6 governs the double accusative that only reaches its full specification in 1:7 — the request \"guide us to THE straight path\" remains abstract until 1:7 defines it as \"the path of those You favored.\" The grammatical construction is deliberately incomplete at the boundary: 1:6 provides the verb and the generic object, 1:7 provides the identifying apposition. This is not mere continuation but syntactic entailment — 1:7 cannot exist as an independent sentence."}, {"labels": ["root_handoff"], "text": "The root s-r-t (ص ر ط) appears as al-sirata (definite, with al-) in 1:6 and as sirata (definite by idafa with alladhina) in 1:7. The repetition performs a semantic narrowing: the first sirat is qualified by an adjective (mustaqim — self-maintaining straightness), while the second is qualified by its travelers (those whom God favored). The path shifts from being defined by its intrinsic geometric property (straightness) to being defined by the people who walk it. Lane's Lexicon preserves the root meaning \"to swallow\" — in 1:6 the swallowing road is characterized by its own uprightness, in 1:7 by the community it has consumed. The double articulation — attribute then population — constitutes a complete definition that neither ayah achieves alone."}, {"labels": ["semantic_bridge"], "text": "The word al-mustaqima (from q-w-m, Form X: self-seeking straightness, self-maintenance) in 1:6 is semantically answered by the triple population structure in 1:7. The \"self-correcting\" quality of the path (istaqama = to find straightness in oneself) is concretized through its human content: it self-corrects by excluding two deviations. The favored group (an'amta 'alayhim) embodies the path's straightness; the wrathful (al-maghdubi 'alayhim) and the straying (al-dallin) embody the two modes of departure from q-w-m's vertical stability. Classical Lane's defines qawm as \"those who stand together\" — 1:7 literally specifies who stands on this self-standing path and who does not."}, {"labels": ["pronoun_chain"], "text": "The second-person address initiated by ihdi-na in 1:6 (imperative directed at \"You,\" God) carries silently across the boundary until it surfaces as an'am-ta (\"You bestowed\") in 1:7. The \"You\" who is asked to guide in 1:6 is the same \"You\" who previously bestowed favor in 1:7. This pronoun c
