r key that initiates connection. Raḥmān as a universal field permeating all creation, Raḥīm as localized mercy instantiated per recipient. The bā is initiation: beginning by invoking the access key."}], "structure": {"beats": [{"label": "Invocation through naming", "lines": [{"arabic": "بِسْمِ ٱللَّهِ", "translit": "bismi llāhi", "english": "In/by the name of the divine"}]}, {"label": "Double attribution of mercy", "lines": [{"arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "translit": "ar-raḥmāni r-raḥīm", "english": "The encompassingly merciful, the specifically merciful"}]}], "summary": "The ayah is a prepositional phrase with no explicit verb — the syntactic gap invites the reader to supply the missing action (I begin, I read, I seek refuge, etc.). The structure bismi (\"in the name of\") creates a dependency: everything that follows is predicated on this naming act. The two divine attributes Raḥmān and Raḥīm, both from the same root r-ḥ-m, form a pair that moves from universal (faʿlān pattern = overflow, saturation) to particular (faʿīl pattern = constant, targeted application). The entire ayah is syntactically incomplete by design — it is a key that opens what follows."}, "words": [{"id": 1, "arabic": "بِسْمِ", "translit": "bismi", "gloss": "in/by the name of", "root": "س م و (s-m-w)", "grammar": "Prepositional phrase: bāʾ al-istiʿāna (bāʾ of assistance/instrument) + ism (noun) in genitive (majrūr). The alif of ism is elided due to frequent use (bismillāh vs. bi-ismi). Root s-m-w yields ism meaning \"name, mark, sign, elevation.\"", "semantics": ["[7C] Root s-m-w: to be high, to be elevated, to rise above", "[7C] ism: name, designation, mark — that which elevates and distinguishes a thing", "[7C] Lane's: ism derived from s-m-w (height) because it elevates the named; OR from w-s-m (mark/brand) because it marks identity", "[7C] Lisan al-Arab: al-ism mushtaqq min as-sumuww (name is derived from elevation) — naming raises the named into recognition", "[M] Hans Wehr: ism = name, appellation, designation, noun (grammatical term)", "[7C] Classical: ism also carries the sense of sign (sīmā), brand, reputation — the name IS the thing's public identity", "[M] Modern: identifier, label, variable name, access token — naming as classification and retrieval", "[F] Futuristic: protocol key, authentication credential — \"in the name of\" as initiating a secure connection", "[7C] bāʾ preposition: instrumentality (by means of), accompaniment (with), commencement (beginning with), causation (because of)", "Core concept: invocation through naming — to name is to call into presence, to elevate from anonymous to recognized"], "occurrences": {"type": "grouped", "groups": [{"label": "A. ism as abstract noun (name, designation)", "count": "~39 ayahs", "examples": [{"ref": "49:11", "arabic": "يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ لَا يَسْخَرْ قَوْمٌۭ مِّن قَوْمٍ عَسَىٰٓ أَن يَكُونُوا۟ خَيْرًۭا مِّنْهُمْ وَلَا نِسَآءٌۭ مِّن نِّسَآءٍ عَسَىٰٓ أَن يَكُنَّ خَيْرًۭا مِّنْهُنَّ ۖ وَلَا تَلْمِزُوٓا۟ أَنفُسَكُمْ وَلَا تَنَابَزُوا۟ بِٱلْأَلْقَٰبِ ۖ بِئْسَ ٱلِٱسْمُ ٱلْفُسُوقُ بَعْدَ ٱلْإِيمَٰنِ ۚ وَمَن لَّمْ يَتُبْ فَأُو۟لَٰٓئِكَ هُمُ ٱلظَّٰلِمُونَ", "english": "O you who trust: let not a people mock another people — they may be better than them; nor women mock other women — they may be better than them. Do not defame yourselves nor call each other by offensive names (al-alqāb). Wretched is the name (al-ism) of wickedness after trust. Whoever does not turn back — those are the wrongdoers"}, {"ref": "55:78", "arabic": "تَبَٰرَكَ ٱسْمُ رَبِّكَ ذِى ٱلْجَلَٰلِ وَٱلْإِكْرَامِ", "english": "Blessed is the name (ism) of your sustainer, possessor of majesty and generosity"}]}, {"label": "B. ism as object — \"mentioning/remembering the name\"", "count": "~14 ayahs", "examples": [{"ref": "2:31", "arabic": "وَعَلَّمَ ءَادَمَ ٱلْأَسْمَآءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى ٱلْمَلَٰٓئِكَةِ فَقَالَ أَنۢبِـُٔونِى بِأَسْمَآءِ هَٰٓؤُلَآءِ إِن كُنتُمْ صَٰدِقِينَ", "english": "And He taught Adam the names (al-asmāʾ) — all of them — then presented them to the angels and said: Inform me of the names of these if you are truthful"}, {"ref": "5:4", "arabic": "يَسْـَٔلُونَكَ مَاذَآ أُحِلَّ لَهُمْ ۖ قُلْ أُحِلَّ لَكُمُ ٱلطَّيِّبَٰتُ ۙ وَمَا عَلَّمْتُم مِّنَ ٱلْجَوَارِحِ مُكَلِّبِينَ تُعَلِّمُونَهُنَّ مِمَّا عَلَّمَكُمُ ٱللَّهُ ۖ فَكُلُوا۟ مِمَّآ أَمْسَكْنَ عَلَيْكُمْ وَٱذْكُرُوا۟ ٱسْمَ ٱللَّهِ عَلَيْهِ ۖ وَٱتَّقُوا۟ ٱللَّهَ ۚ إِنَّ ٱللَّهَ سَرِيعُ ٱلْحِسَابِ", "english": "They ask you what is permitted. Say: permitted for you are good things, and what you have trained hunting animals to catch, teaching them as Allāh taught you. Eat what they catch for you and mention the name (ism) of Allāh over it"}]}]}, "qiraat": [{"arabic": "بِسُمَى", "translit": "bi-sumā", "status": "shawādhdh", "type": "Lvw", "note": "Variant reads the word as sumā (from s-m-w directly as \"elevation/height\") rather than ism, making the phrase \"by the elevation of Allāh\" instead of \"in the name of Allāh.\" This is a rare reading not in the standard Hafs text.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "183", "refs": "1:1;17:92;17:99;17:110;18:14;18:26;18:45;2:19;2:22", "note": "Name/elevation (s-m-w) paired with divine reality ('-l-h) — naming as the primary mode of accessing the divine"}, {"coRoot": "r-h-m", "coRootAr": "ر ح م", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Name/elevation (s-m-w) paired with womb-mercy (r-ḥ-m) — naming occurs within the field of mercy"}], "critical": [{"cat": "GRAM", "pattern": "bāʾ al-jarr + elided alif in bismillāh", "kernel": "Alif-drop signals frequency of use: this phrase is so common the language itself compressed it"}, {"cat": "SEM", "pattern": "ism etymology: s-m-w (height) vs w-s-m (mark)", "kernel": "Dual etymology: naming as elevation AND branding — both active in \"bismi Allāh\" invocation"}, {"cat": "ECHO", "pattern": "ism→asmāʾ parallel with 2:31 (Adam taught names)", "kernel": "Divine names in 1:1 echo the primordial teaching of names — naming as foundational divine gift"}, {"cat": "STRUCT", "pattern": "Verbless clause — missing verb invites reader", "kernel": "No explicit verb = open syntactic slot: \"I begin / I read / I seek refuge\" — reader completes the action"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "ٱللَّهِ", "translit": "allāhi", "gloss": "of Allāh, of the divine reality", "root": "أ ل ه ('-l-h)", "grammar": "Proper noun in genitive (majrūr) governed by the construct state of ism. Functions as the second term of an iḍāfa (genitive construction): \"name OF Allāh.\" The root '-l-h encompasses worship, bewilderment, refuge-seeking.", "semantics": ["[7C] Root '-l-h: to worship, to adore, to be devoted to", "[7C] Lane's: ilāh = an object of worship; alaha = he worshipped; aliha = he was bewildered, perplexed", "[7C] Lisan al-Arab: Allāh from al-ilāh (the god) with contraction; or from waliha (to be lost in astonishment)", "[7C] Lisan al-Arab: also from alaha = to seek refuge, to take shelter — the divine as refuge", "[M] Hans Wehr: Allāh = God (proper name of the supreme deity in Islam)", "[7C] Classical: the root carries three simultaneous valences — worship, bewilderment, and refuge", "[M] Modern: ultimate authority, highest referent, source of all systems", "[F] Futuristic: the origin-node of all emergence — the system that generates all subsystems", "Core concept: the reality that overwhelms comprehension, compels devotion, and provides refuge"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Allāh as proper noun in genitive constructions", "count": "~596 ayahs", "examples": [{"ref": "2:159", "arabic": "إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ ٱلْبَيِّنَٰتِ وَٱلْهُدَىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِى ٱلْكِتَٰبِ ۙ أُو۟لَٰٓئِكَ يَلْعَنُهُمُ ٱللَّهُ وَيَلْعَنُهُمُ ٱللَّٰعِنُونَ", "english": "Those who conceal what We sent down of clear signs and guidance after We clarified it for people in the written record — those, Allāh distances them and the distancers distance them"}, {"ref": "8:7", "arabic": "وَإِذْ يَعِدُكُمُ ٱللَّهُ إِحْدَى ٱلطَّآئِفَتَيْنِ أَنَّهَا لَكُمْ وَتَوَدُّونَ أَنَّ غَيْرَ ذَاتِ ٱلشَّوْكَةِ تَكُونُ لَكُمْ وَيُرِيدُ ٱللَّهُ أَن يُحِقَّ ٱلْحَقَّ بِكَلِمَٰتِهِۦ وَيَقْطَعَ دَابِرَ ٱلْكَٰفِرِينَ", "english": "And when Allāh promised you one of the two groups would be yours, and you wished the unarmed one, but Allāh intended to establish truth by His words and cut off the rear of the coverers"}]}, {"label": "B. Allāh as prepositional object", "count": "~515 ayahs", "examples": [{"ref": "11:6", "arabic": "۞ وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّۭ فِى كِتَٰبٍۢ مُّبِينٍۢ", "english": "There is no creature on earth but upon Allāh is its provision, and He knows its resting place and repository — all in a clear record"}, {"ref": "2:22", "arabic": "ٱلَّذِى جَعَلَ لَكُمُ ٱلْأَرْضَ فِرَٰشًۭا وَٱلسَّمَآءَ بِنَآءًۭ وَأَنزَلَ مِنَ ٱلسَّمَآءِ مَآءًۭ فَأَخْرَجَ بِهِۦ مِنَ ٱلثَّمَرَٰتِ رِزْقًۭا لَّكُمْ ۖ فَلَا تَجْعَلُوا۟ لِلَّهِ أَندَادًۭا وَأَنتُمْ تَعْلَمُونَ", "english": "The One who made for you the earth a resting place and the sky a structure and sent down from the sky water producing fruits as provision — so do not assign to Allāh equals while you know"}]}]}, "qiraat": [], "cooccurrence": [{"coRoot": "s-m-w", "coRootAr": "س م و", "count": "183", "refs": "1:1;17:92;17:99;17:110;18:14;18:26;18:45;2:19;2:22", "note": "Divine reality ('-l-h) paired with name/elevation (s-m-w) — the divine as that which is named and elevated"}, {"coRoot": "r-h-m", "coRootAr": "ر ح م", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Divine reality paired with womb-mercy — mercy as an essential divine attribute, not incidental"}], "critical": [{"cat": "SEM", "pattern": "'-l-h triple etymology: worship + bewilderment + refuge", "kernel": "Three root meanings simultaneously active: Allāh is worshipped, bewilders comprehension, and shelters"}, {"cat": "GRAM", "pattern": "Genitive in iḍāfa with ism — name OF Allāh", "kernel": "Construct state makes Allāh the possessor of the name — the name belongs to, derives from, the divine"}, {"cat": "INTER", "pattern": "Allāh vs ilāh: 2704 NOUN_PROP vs 147 NOUN_CONCRETE", "kernel": "Proper noun usage dominates — Allāh is overwhelmingly a name, not a generic \"god\" description"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "ٱلرَّحْمَٰنِ", "translit": "ar-raḥmāni", "gloss": "the Most Merciful, the encompassingly compassionate", "root": "ر ح م (r-h-m)", "grammar": "Definite adjective in genitive, functioning as naʿt (descriptive adjective) for Allāh or as badal (substitutive apposition). Pattern faʿlān indicates saturation and overflow — one who is filled to overflowing with raḥma.", "semantics": ["[7C] Root r-ḥ-m: womb (raḥim), mercy (raḥma), kinship (raḥim/arḥām)", "[7C] Lane's: raḥima = he was merciful, compassionate, tender; raḥim = womb, uterus; raḥma = mercy, compassion, pity", "[7C] Lisan al-Arab: ar-Raḥmān = dhū ar-raḥma llatī lā ghāyata baʿdahā fī ar-raḥma (the possessor of mercy beyond which there is no further mercy)", "[7C] Lane's: faʿlān pattern = intensive/excessive: Raḥmān means saturated with mercy, overflowing", "[M] Hans Wehr: raḥmān = merciful, compassionate (intensive form); raḥim = womb, uterus", "[7C] Classical: raḥma etymologically linked to raḥim (womb) — mercy as the primordial nurturing enclosure", "[7C] Classical grammarians: Raḥmān applies to this-worldly AND next-worldly mercy, while Raḥīm is more specific", "[7C] Lane's: also raḥimtu (I pitied), tarāḥama (they showed mutual compassion), istarḥama (he sought mercy)", "[M] Modern: empathy, care infrastructure, social safety net — systemic compassion", "[F] Futuristic: a universal field of sustenance — mercy as the background condition enabling all existence", "Core concept: mercy originating from the womb-space — nurturing that precedes and enables life itself"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Raḥmān/Raḥīm as adjective modifying Allāh", "count": "~6 ayahs", "examples": [{"ref": "1:3", "arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "The encompassingly merciful (ar-Raḥmān), the specifically merciful (ar-Raḥīm)"}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And rely upon the Mighty, the specifically merciful (ar-Raḥīm)"}]}, {"label": "B. Raḥmān as independent divine name (agent/subject)", "count": "~12 ayahs", "examples": [{"ref": "19:58", "arabic": "أُو۟لَٰٓئِكَ ٱلَّذِينَ أَنْعَمَ ٱللَّهُ عَلَيْهِم مِّنَ ٱلنَّبِيِّۦنَ مِن ذُرِّيَّةِ ءَادَمَ وَمِمَّنْ حَمَلْنَا مَعَ نُوحٍۢ وَمِن ذُرِّيَّةِ إِبْرَٰهِيمَ وَإِسْرَٰٓءِيلَ وَمِمَّنْ هَدَيْنَا وَٱجْتَبَيْنَآ ۚ إِذَا تُتْلَىٰ عَلَيْهِمْ ءَايَٰتُ ٱلرَّحْمَٰنِ خَرُّوا۟ سُجَّدًۭا وَبُكِيًّۭا ۩", "english": "Those upon whom Allāh bestowed favor — from the prophets of Adam's progeny and those We carried with Nuh and from Ibrahim and Israil's progeny — when the signs of the Most Merciful (ar-Raḥmān) are recited to them, they fall in prostration and weeping"}, {"ref": "19:93", "arabic": "إِن كُلُّ مَن فِى ٱلسَّمَٰوَٰتِ وَٱلْأَرْضِ إِلَّآ ءَاتِى ٱلرَّحْمَٰنِ عَبْدًۭا", "english": "There is none in the heavens and the earth but comes to the Most Merciful (ar-Raḥmān) as a servant"}]}, {"label": "C. raḥma as gerund (mercy, compassion)", "count": "~114 ayahs", "examples": [{"ref": "18:16", "arabic": "وَإِذِ ٱعْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا ٱللَّهَ فَأْوُۥٓا۟ إِلَى ٱلْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِۦ وَيُهَيِّئْ لَكُم مِّنْ أَمْرِكُم مِّرْفَقًۭا", "english": "And when you have withdrawn from them and what they worship other than Allāh, take refuge in the cave. Your sustainer will spread for you of His mercy (raḥmatihi) and prepare for you ease in your affair"}, {"ref": "2:64", "arabic": "ثُمَّ تَوَلَّيْتُم مِّنۢ بَعْدِ ذَٰلِكَ ۖ فَلَوْلَا فَضْلُ ٱللَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ لَكُنتُم مِّنَ ٱلْخَٰسِرِينَ", "english": "Then you turned away after that. Were it not for the bounty of Allāh upon you and His mercy (raḥmatuhu), you would have been among the losers"}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Gramm", "type": "CE", "note": "Accusative ending (fatḥa) changes both from genitive adjectives to accusative — possibly as ḥāl (circumstantial) or exclamatory accusative. This reframes the attributes from static description to dynamic state.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Gramm", "type": "CE", "note": "Nominative ending (ḍamma) makes both independent subjects or predicates rather than adjectives — \"The Merciful, The Compassionate\" become standalone declarations rather than modifiers of Allāh.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Mercy (r-ḥ-m) paired with divine reality ('-l-h) — mercy as essential divine attribute, not incidental"}, {"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Mercy paired with naming/elevation — mercy is named and elevated, or the named one is merciful"}], "critical": [{"cat": "FORM", "pattern": "faʿlān pattern = saturation/overflow", "kernel": "Raḥmān is not merely merciful but filled-to-overflowing with mercy — the pattern itself is the theology"}, {"cat": "SEM", "pattern": "r-ḥ-m: womb etymology grounds mercy in biology", "kernel": "Mercy (raḥma) from womb (raḥim): compassion is not abstract virtue but the nurturing of nascent life"}, {"cat": "ECHO", "pattern": "Raḥmān + Raḥīm: same root doubled in one phrase", "kernel": "Root-doubling (r-ḥ-m twice) creates emphasis through repetition — mercy as the dominant attribute named"}], "tag": "CRITICAL"}, {"id": 4, "arabic": "ٱلرَّحِيمِ", "translit": "ar-raḥīmi", "gloss": "the Specifically Merciful, the perpetually compassionate", "root": "ر ح م (r-h-m)", "grammar": "Definite adjective in genitive, functioning as second naʿt for Allāh or as badal. Pattern faʿīl indicates a persistent, stable quality — one who continually exercises raḥma toward specific recipients.", "semantics": ["[7C] faʿīl pattern: denotes a stable, ongoing quality — Raḥīm is one who continuously enacts mercy", "[7C] Lane's: Raḥīm = one who has mercy upon others (faʿīl in the sense of fāʿil — active participle force)", "[7C] Lisan al-Arab: ar-Raḥīm specifically toward the believers (in contrast to ar-Raḥmān toward all creation)", "[M] Hans Wehr: raḥīm = merciful, compassionate (continuing quality)", "[7C] Classical grammarians: faʿīl can function as fāʿil (active — one who does) or mafʿūl (passive — one who receives); here active", "[7C] Classical: the pairing Raḥmān-Raḥīm covers both the essence of mercy (Raḥmān) and its application (Raḥīm)", "[M] Modern: targeted intervention, personalized care — mercy applied to specific cases", "[F] Futuristic: adaptive mercy — a system that responds to individual needs rather than broadcasting uniformly", "Core concept: mercy that is exercised, applied, and targeted — the active deployment of compassion to particular recipients"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Raḥīm as divine adjective", "count": "~6 ayahs", "examples": [{"ref": "1:3", "arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "The encompassingly merciful, the specifically merciful (ar-Raḥīm)"}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And rely upon the Mighty, the specifically merciful (ar-Raḥīm)"}]}, {"label": "B. Allāh described as Raḥīm in predicate/apposition", "count": "~18 ayahs", "examples": [{"ref": "2:226", "arabic": "لِّلَّذِينَ يُؤْلُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٍۢ ۖ فَإِن فَآءُو فَإِنَّ ٱللَّهَ غَفُورٌۭ رَّحِيمٌۭ", "english": "For those who swear off their wives is a waiting period of four months. If they return, then Allāh is forgiving, specifically merciful (raḥīm)"}, {"ref": "3:129", "arabic": "وَلِلَّهِ مَا فِى ٱلسَّمَٰوَٰتِ وَمَا فِى ٱلْأَرْضِ ۚ يَغْفِرُ لِمَن يَشَآءُ وَيُعَذِّبُ مَن يَشَآءُ ۚ وَٱللَّهُ غَفُورٌۭ رَّحِيمٌۭ", "english": "To Allāh belongs what is in the heavens and earth. He forgives whom He wills and punishes whom He wills. Allāh is forgiving, specifically merciful (raḥīm)"}]}, {"label": "C. raḥīm as general adjective for humans", "count": "~21 ayahs", "examples": [{"ref": "9:128", "arabic": "لَقَدْ جَآءَكُمْ رَسُولٌۭ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُم بِٱلْمُؤْمِنِينَ رَءُوفٌۭ رَّحِيمٌۭ", "english": "A messenger has come to you from yourselves — your suffering weighs on him, he is concerned for you, toward the trusting ones he is gentle, specifically merciful (raḥīm)"}]}]}, "qiraat": [{"arabic": "الرَّحِيمَ", "translit": "ar-raḥīma", "status": "Gramm", "type": "CE", "note": "Accusative case (fatḥa) changes Raḥīm from genitive adjective to accusative — circumstantial or exclamatory. Same reading as the Raḥmān variant, maintaining parallel case.", "source": "erquran.org"}, {"arabic": "الرَّحِيمْ۟ أَلْحَمْدُ", "translit": "ar-raḥīm. al-ḥamdu", "status": "Irreg", "type": "waqf", "note": "Irregular reading pauses on Raḥīm with sukūn and begins 1:2 with al-ḥamdu (without hamzat waṣl). This creates a sharper break between the basmala and the Fātiḥa proper, treating them as separate units. Not in the standard Hafs reading.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Gramm", "type": "CE", "note": "Both attributes in accusative, paired reading with word 3. Changes grammatical relationship from attributive to circumstantial or exclamatory.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Gramm", "type": "CE", "note": "Both attributes in nominative, paired reading with word 3. Makes both standalone subjects or predicates rather than modifiers.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "130", "refs": "1:1;17:110;18:16;19:58;2:64;2:105;2:143;2:163;2:173;2:182", "note": "Raḥīm paired with divine reality — mercy as defining attribute in divine self-description"}, {"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;17:110;19:93;3:129;6:12;22:5;22:65;25:6;25:48", "note": "Raḥīm paired with naming/elevation — the merciful one is also the elevated/named one"}], "critical": [{"cat": "FORM", "pattern": "faʿīl pattern = continuous stable quality vs faʿlān overflow", "kernel": "Raḥīm is sustained application; Raḥmān is saturated essence — form itself distinguishes the two"}, {"cat": "SEM", "pattern": "Raḥīm applied to humans (9:128) and to God", "kernel": "Uniquely among divine attributes, raḥīm also describes the Prophet — mercy bridges divine and human"}, {"cat": "GRAM", "pattern": "Case variants (gen/acc/nom) change grammatical role", "kernel": "Genitive = adjective of Allāh; accusative = circumstantial state; nominative = independent predication"}], "tag": "CRITICAL"}], "questions": ["Why is the basmala syntactically incomplete — what is the implied verb, and does the absence of a verb make the formula applicable to any subsequent action?", "Does the root s-m-w (elevation) in ism imply that naming is an act of elevating the named, and if so, does saying \"bismillāh\" elevate the speaker or the divine?", "The womb (raḥim) etymology of r-ḥ-m: does the Quran consistently ground mercy in biological nurturing, and does this have implications for the gendering of divine attributes?", "Why are Raḥmān and Raḥīm both needed — what would be lost if only one appeared? Does the doubling create a semantic field that neither alone covers?", "The shawādhdh variant \"bi-sumā\" (by the elevation) eliminates \"name\" entirely — what theological shift occurs if the phrase means \"by the elevation of Allāh\" rather than \"in the name of Allāh\"?", "If ism functions as an access protocol (futuristic reading), does the basmala function as an authentication handshake — and if so, what system is being accessed?", "The case-change variants (nominative Raḥmānu/Raḥīmu) make the attributes independent clauses rather than modifiers — does this transform the phrase from description to declaration?", "How does the phonetic progression from the labial b (bismi) through the lateral l (llāhi) to the guttural r-ḥ (Raḥmān, Raḥīm) create a sound arc, and does this mirror the semantic movement from invocation to identification to attribute?", "The co-occurrence of s-m-w and '-l-h (183 times) makes this the most frequent pairing — what does this reveal about the relationship between naming and the divine in Quranic ontology?", "Does the construct state (bismi Allāhi) imply that the name belongs to Allāh (subjective genitive), or that Allāh is the content of the name (objective genitive)?", "Lane's attests that ism can derive from either s-m-w (height) or w-s-m (brand/mark) — does the Quran ever use ism in a context that disambiguates this etymological dispute?", "The pairing ghafūr-raḥīm appears ~70 times in the Quran — does this stock pairing affect how raḥīm is read when it appears instead paired with Raḥmān?", "17:110 explicitly equates Allāh and ar-Raḥmān as interchangeable names (call upon Allāh OR call upon ar-Raḥmān) — does this make Raḥmān a proper name rather than an adjective in 1:1?"], "key": "1:1"}, "1:2": {"surah": 1, "ayah": 2, "arabic": "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ", "transliteration": "al-ḥamdu li-llāhi rabbi l-ʿālamīna", "readings": [{"text": "The praise belongs to God, nurturer of the realms of existence", "rationale": "ḥamd as inherent attribute of God — nominative ḥamdu establishes a declarative equative clause (mubtadaʾ + khabar); rabb as active nurturer (r-b-b: to nurture, to raise); ʿālamīn as all domains of conscious existence"}, {"text": "Praise is for the divine, master of all knowledge-systems", "rationale": "li-llāhi as lām al-ikhtisāṣ (exclusive possession); rabb as possessor-sovereign; ʿālamīn derived from ʿ-l-m (knowledge/marker) — all systems of signification and consciousness, not merely physical worlds"}, {"text": "All grateful acknowledgment directs itself toward the deity, sustainer of all perceiving beings", "rationale": "ḥamd as active recognition (not passive), self-directed (no agent needed); rabb as the one who brings entities from inception to completion; ʿālamīn as all beings capable of ʿilm (cognition)"}, {"text": "The defining attribute of the divine is praiseworthiness — provider-educator of every signaling domain", "rationale": "ḥamd as an ontological statement about the nature of the divine, not a command or request; rabb as both provider and educator (classical r-b-b encompasses both); ʿālamīn as sign-bearing domains including data, biological, and digital systems"}, {"text": "Acknowledgment-of-excellence is exclusively for the God-principle, the incremental-developer of all information-bearing realms", "rationale": "Futuristic: ḥamd as calibrated acknowledgment of excellence (quality metrics); rabb as iterative developer (r-b-b: gradual cultivation); ʿālamīn as information-bearing realms — biological ecosystems, data networks, simulated realities"}], "structure": {"beats": [{"label": "Declaration of praise", "lines": [{"arabic": "ٱلْحَمْدُ لِلَّهِ", "translit": "al-ḥamdu li-llāhi", "english": "The praise belongs to God"}]}, {"label": "Divine qualification", "lines": [{"arabic": "رَبِّ ٱلْعَٰلَمِينَ", "translit": "rabbi l-ʿālamīna", "english": "Nurturer of the realms of existence"}]}], "summary": "Two-beat equative clause: mubtadaʾ (al-ḥamdu) + khabar (li-llāhi), with rabb as a badal (substitutive apposition) or ʿaṭf bayān specifying the divine identity. The definite article al- on ḥamd signals comprehensiveness (istighrāq) — not \"a praise\" but \"all praise.\" The lām in li-llāhi governs the khabar and carries multiple possible functions: ikhtisāṣ (exclusivity), milk (possession), or istiḥqāq (deservedness). The genitive construction rabb al-ʿālamīn further qualifies Allāh, creating a three-tier semantic descent: abstract praise → divine name → relational attribute."}, "words": [{"id": 1, "arabic": "الْحَمْدُ", "translit": "al-ḥamdu", "gloss": "praise, grateful acknowledgment, commendation", "root": "ح م د (h-m-d)", "grammar": "Definite nominative gerund (maṣdar) functioning as mubtadaʾ (topic) of equative clause; the definite article al- carries istighrāq (comprehensiveness)", "semantics": ["[7C] فَعَلَ (ḥamida, I): to praise, to commend, to speak well of, to express satisfaction with", "[7C] فَعَّلَ (ḥammada, II): to praise repeatedly, to laud, to celebrate with thanks", "[7C] حَمْد (ḥamd, gerund): praise combined with love and reverence — distinct from madḥ (mere praise without love) and shukr (thanks for specific benefit)", "[7C] Lane's: ḥamd = praising for an inherent quality, whether or not a benefit is received — contrasted with shukr which requires prior benefit", "[7C] Hans Wehr: praise, commendation, laudation; also: to praise God, to thank", "[7C] Lisan al-Arab: ḥamd is antonym of dhamm (blame); it denotes recognition of excellence (ḥusn) in the praised entity", "[M] Modern: positive evaluation, endorsement, approval rating, quality acknowledgment", "[F] Futuristic: calibrated excellence-metric — recognition of optimal design, system performance feedback", "Core concept: recognition of inherent excellence that demands acknowledgment — not transactional gratitude but ontological response to quality"], "occurrences": {"type": "grouped", "groups": [{"label": "A. al-ḥamdu li-llāhi surah-opening declarations", "count": "~5 ayahs", "examples": [{"ref": "6:1", "arabic": "ٱلْحَمْدُ لِلَّهِ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ وَجَعَلَ ٱلظُّلُمَٰتِ وَٱلنُّورَ ۖ ثُمَّ ٱلَّذِينَ كَفَرُوا۟ بِرَبِّهِمْ يَعْدِلُونَ", "english": "al-ḥamdu (the praise) belongs to God who created the heavens and the earth and made the darknesses and the light — then those who disbelieve equate others with their rabb"}, {"ref": "18:1", "arabic": "ٱلْحَمْدُ لِلَّهِ ٱلَّذِىٓ أَنزَلَ عَلَىٰ عَبْدِهِ ٱلْكِتَٰبَ وَلَمْ يَجْعَل لَّهُۥ عِوَجَا ۜ", "english": "al-ḥamdu (the praise) belongs to God who sent down the Book upon His servant and did not make in it any crookedness"}]}, {"label": "B. bi-ḥamdihi constructions (praise conjoined with divine act)", "count": "~15 ayahs", "examples": [{"ref": "2:30", "arabic": "وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّى جَاعِلٌۭ فِى ٱلْأَرْضِ خَلِيفَةًۭ ۖ قَالُوٓا۟ أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ ٱلدِّمَآءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّىٓ أَعْلَمُ مَا لَا تَعْلَمُونَ", "english": "We glorify with Your ḥamd (praise) and sanctify for You — angels declare bi-ḥamdika, conjoining tasbīḥ (glorification) with ḥamd"}, {"ref": "13:13", "arabic": "وَيُسَبِّحُ ٱلرَّعْدُ بِحَمْدِهِۦ وَٱلْمَلَٰٓئِكَةُ مِنْ خِيفَتِهِۦ وَيُرْسِلُ ٱلصَّوَٰعِقَ فَيُصِيبُ بِهَا مَن يَشَآءُ وَهُمْ يُجَٰدِلُونَ فِى ٱللَّهِ وَهُوَ شَدِيدُ ٱلْمِحَالِ", "english": "The thunder glorifies with His ḥamd (praise) — natural phenomena perform bi-ḥamdihi, extending ḥamd beyond conscious agency"}]}, {"label": "C. maqām maḥmūd and passive participle forms", "count": "~3 ayahs", "examples": [{"ref": "15:98", "arabic": "فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُن مِّنَ ٱلسَّٰجِدِينَ", "english": "Glorify with the ḥamd (praise) of your rabb and be among those who prostrate — imperative pairing tasbīḥ with ḥamd"}, {"ref": "17:79", "arabic": "وَمِنَ ٱلَّيْلِ فَتَهَجَّدْ بِهِۦ نَافِلَةًۭ لَّكَ عَسَىٰٓ أَن يَبْعَثَكَ رَبُّكَ مَقَامًۭا مَّحْمُودًۭا", "english": "Perhaps your rabb will raise you to a maḥmūd (praised) station — passive participle from h-m-d, the station itself receives ḥamd"}]}]}, "qiraat": [{"arabic": "الْـحَمْدِ", "translit": "al-ḥamdi", "status": "14", "type": "CE|vhr", "note": "Genitive al-ḥamdi — shifts ḥamd from mubtadaʾ (topic) to object of an implied verb or prepositional extension, making praise dependent rather than declarative", "source": "erquran.org"}, {"arabic": "الْـحَمْدَ", "translit": "al-ḥamda", "status": "Irreg", "type": "CE", "note": "Accusative al-ḥamda — makes ḥamd a direct object of an implied verb (naḥmadu: we praise), converting a declarative into a performed act of praising", "source": "erquran.org"}, {"arabic": "الرَّحِيمْ｡ أَلْحَمْدُ", "translit": "ar-raḥīm. al-ḥamdu", "status": "Irreg", "type": "waqf", "note": "Pausal hamza-cut: al-ḥamdu begins with glottal stop after full pause on ar-raḥīm from 1:1, emphasizing ḥamd as fresh declaration", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "Complete syntactic restructuring: \"we praise God, lord of...\" — converts nominal (agentless) praise into first-person-plural verbal praise, introducing human actors", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "46", "refs": "1:2;17:111;18:1;2:267;3:144;4:131;6:1;6:45;7:43;9:112", "note": "h-m-d + '-l-h: praise consistently directed toward the divine name — 46 co-occurrences establish ḥamd as fundamental divine attribute"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "27", "refs": "1:2;17:79;2:30;6:1;6:45;7:43;10:10;14:1;14:39;15:98", "note": "h-m-d + r-b-b: praise conjoined with nurturing — in 2:30 angels praise the rabb, in 15:98 imperative to glorify bi-ḥamd of rabb"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "18", "refs": "1:2;2:30;2:267;3:188;6:45;10:10;16:75;22:5;27:15;31:25", "note": "h-m-d + '-l-m: praise linked with knowledge — in 2:30 angels praise while God knows what they do not"}], "critical": [{"cat": "GRAM", "pattern": "al-ḥamdu nominative (ḍamma)", "kernel": "Nominative establishes ḥamd as grammatical subject — praise is ontological fact, not performed action or request"}, {"cat": "SEM", "pattern": "ḥamd vs. shukr vs. madḥ triad", "kernel": "Lane's: ḥamd = praise for inherent quality; shukr = gratitude for benefit; madḥ = praise without love. Distinct registers"}, {"cat": "INTER", "pattern": "al-ḥamdu li-llāhi (1:2, 6:1, 18:1, 34:1, 35:1)", "kernel": "Five surahs open with identical phrase — each followed by different divine attribute, creating a ḥamd-framework"}, {"cat": "ECHO", "pattern": "h-m-d → maḥmūd (17:79) + Muḥammad", "kernel": "Root h-m-d generates maḥmūd (praised-station) and the prophetic name Muḥammad — praise-worthy ontology"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "لِلَّهِ", "translit": "li-llāhi", "gloss": "for God, belonging to God", "root": "أ ل ه ('-l-h)", "grammar": "Prepositional phrase: lām (preposition) + Allāh (proper noun, genitive). The lām functions as lām al-ikhtisāṣ (exclusivity) or lām al-milk (possession)", "semantics": ["[7C] '-l-h root: to worship, to be bewildered, to seek refuge, to be passionately devoted to", "[7C] Allāh: the proper name for the divine, encompassing all attributes; debated whether derived from '-l-h (deity) or a primordial name", "[7C] Lane's: ilāh = object of worship; ta'allaha = to worship, to become devoted; also: to become perplexed/bewildered (aliha)", "[7C] Lisan al-Arab: aliha = to become bewildered (taḥayyara); also: to seek shelter (iltaja'a) — the deity as refuge from bewilderment", "[7C] Hans Wehr: ilāh = god, deity; Allāh = God (the one God)", "[M] Modern: the divine principle, the absolute, the source code of reality", "[F] Futuristic: the ultimate ordering-intelligence behind all emergent complexity — the root cause of coherence", "Core concept: the singular object of ultimate devotion in whom bewilderment finds resolution and refuge"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Allāh as agent (subject) of action", "count": "~546 ayahs", "examples": [{"ref": "2:159", "arabic": "إِنَّ ٱلَّذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ ٱلْبَيِّنَٰتِ وَٱلْهُدَىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِى ٱلْكِتَٰبِ ۙ أُو۟لَٰٓئِكَ يَلْعَنُهُمُ ٱللَّهُ وَيَلْعَنُهُمُ ٱللَّٰعِنُونَ", "english": "Those who conceal what We sent down — Allāh curses them and the cursers curse them"}, {"ref": "8:7", "arabic": "وَإِذْ يَعِدُكُمُ ٱللَّهُ إِحْدَى ٱلطَّآئِفَتَيْنِ أَنَّهَا لَكُمْ وَتَوَدُّونَ أَنَّ غَيْرَ ذَاتِ ٱلشَّوْكَةِ تَكُونُ لَكُمْ وَيُرِيدُ ٱللَّهُ أَن يُحِقَّ ٱلْحَقَّ بِكَلِمَٰتِهِۦ وَيَقْطَعَ دَابِرَ ٱلْكَٰفِرِينَ", "english": "When Allāh was promising you one of the two groups — Allāh wills to establish truth"}]}, {"label": "B. li-llāhi / ʿalā llāhi prepositional constructions", "count": "~515 ayahs", "examples": [{"ref": "11:6", "arabic": "۞ وَمَا مِن دَآبَّةٍۢ فِى ٱلْأَرْضِ إِلَّا عَلَى ٱللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا ۚ كُلٌّۭ فِى كِتَٰبٍۢ مُّبِينٍۢ", "english": "No creature on earth but its provision is upon Allāh — He knows its settlement and repository"}]}]}, "qiraat": [{"arabic": "لُـلَّـٰهِ", "translit": "lu-llāhi", "status": "Irreg", "type": "vhr", "note": "Ḍamma on lām (lu-llāhi) — follows al-ḥamdu's ḍamma pattern, creating vowel harmony; phonetically links praise more tightly to the divine name", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "Allāh becomes direct object (accusative) rather than prepositional object — shifts syntactic role from destination-of-praise to receiver-of-active-praise", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "46", "refs": "1:2;17:111;18:1;2:267;3:144;4:131;6:1;6:45;7:43;9:112", "note": "'-l-h + h-m-d: divine name paired with praise across 46 ayahs — ḥamd as definitional attribute of Allāh"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "204", "refs": "1:2;17:39;18:14;18:16;18:21;18:24;18:38;18:110;19:36;19:48", "note": "'-l-h + r-b-b: Allāh and rabb co-occur 204 times — the most frequent divine-attribute pairing in the Quran"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "439", "refs": "1:2;18:21;18:26;2:10;2:22;2:26;2:60;2:75;2:77;2:80", "note": "'-l-h + '-l-m: divine name paired with knowledge root 439 times — the single most frequent semantic pairing"}], "critical": [{"cat": "GRAM", "pattern": "lām in li-llāhi: three functions", "kernel": "lām al-ikhtisāṣ (exclusivity), lām al-milk (ownership), or lām al-istiḥqāq (deservedness) — all three active here"}, {"cat": "SEM", "pattern": "'-l-h root polysemy: worship + bewilderment", "kernel": "Aliha = to be bewildered; ilāh = object of worship; ta'allaha = to devote oneself. Deity as resolution of bewilderment"}, {"cat": "INTER", "pattern": "li-llāhi across 5 ḥamd-openings", "kernel": "1:2, 6:1, 18:1, 34:1, 35:1 — each specifies a different facet: worlds, creation, book-sending, cosmic scope"}], "tag": "CRITICAL"}, {"id": 3, "arabic": "رَبِّ", "translit": "rabbi", "gloss": "lord, nurturer, sustainer, raiser, educator", "root": "ر ب ب (r-b-b)", "grammar": "Genitive noun functioning as badal (substitutive apposition) from Allāh or ʿaṭf bayān (explanatory apposition); carries possessive construct (iḍāfa) governing al-ʿālamīn", "semantics": ["[7C] رَبَّ (rabba, I): to own, to possess, to be lord/master of", "[7C] رَبَّى (rabbā, II): to nurture, to raise, to rear, to educate from inception to maturity", "[7C] Lane's: rabb = owner + nurturer; rabbā al-walad = he reared the child; also: rabb al-dār = owner of the house; the concept combines possession with developmental responsibility", "[7C] Lisan al-Arab: rabb = one who reforms, improves, completes — brings a thing from one state of development to the next until it reaches its kamāl (perfection/completion)", "[7C] Hans Wehr: rabb = lord, master, owner; rabbā = to bring up, rear, raise, educate, teach, instruct", "[7C] Classical: rabb al-niʿma = bestower of blessings; rabb al-ṣanīʿa = patron-craftsman; encompasses sovereignty, nurturing, and incremental development", "[M] Modern: administrator, regulator, governor, project manager — one who oversees systemic growth", "[F] Futuristic: iterative developer, system architect who maintains and incrementally upgrades — the one who brings systems from v1.0 to completion", "Core concept: sovereign ownership combined with active developmental nurturing — not static lordship but dynamic cultivation toward perfection"], "occurrences": {"type": "grouped", "groups": [{"label": "A. rabb in vocative (yā rabbi / rabbanā) — supplication", "count": "~136 ayahs", "examples": [{"ref": "7:89", "arabic": "قَدِ ٱفْتَرَيْنَا عَلَى ٱللَّهِ كَذِبًا إِنْ عُدْنَا فِى مِلَّتِكُم بَعْدَ إِذْ نَجَّىٰنَا ٱللَّهُ مِنْهَا ۚ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّنَا ۚ وَسِعَ رَبُّنَا كُلَّ شَىْءٍ عِلْمًا ۚ عَلَى ٱللَّهِ تَوَكَّلْنَا ۚ رَبَّنَا ٱفْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِٱلْحَقِّ وَأَنتَ خَيْرُ ٱلْفَٰتِحِينَ", "english": "Allāh our rabb (rabbunā) encompasses all things in knowledge — rabb in supplication with ʿilm"}, {"ref": "5:114", "arabic": "قَالَ عِيسَى ٱبْنُ مَرْيَمَ ٱللَّهُمَّ رَبَّنَآ أَنزِلْ عَلَيْنَا مَآئِدَةًۭ مِّنَ ٱلسَّمَآءِ تَكُونُ لَنَا عِيدًۭا لِّأَوَّلِنَا وَءَاخِرِنَا وَءَايَةًۭ مِّنكَ ۖ وَٱرْزُقْنَا وَأَنتَ خَيْرُ ٱلرَّٰزِقِينَ", "english": "Jesus son of Mary said: O Allāh our rabb (rabbanā), send down upon us a table from heaven"}]}, {"label": "B. rabbuka / rabbukum — possessive with rabb", "count": "~215 ayahs", "examples": [{"ref": "2:283", "arabic": "۞ وَإِن كُنتُمْ عَلَىٰ سَفَرٍۢ وَلَمْ تَجِدُوا۟ كَاتِبًۭا فَرِهَٰنٌۭ مَّقْبُوضَةٌۭ ۖ فَإِنْ أَمِنَ بَعْضُكُم بَعْضًۭا فَلْيُؤَدِّ ٱلَّذِى ٱؤْتُمِنَ أَمَٰنَتَهُۥ وَلْيَتَّقِ ٱللَّهَ رَبَّهُۥ ۗ وَلَا تَكْتُمُوا۟ ٱلشَّهَٰدَةَ ۚ وَمَن يَكْتُمْهَا فَإِنَّهُۥٓ ءَاثِمٌۭ قَلْبُهُۥ ۗ وَٱللَّهُ بِمَا تَعْمَلُونَ عَلِيمٌۭ", "english": "Let him be mindful of Allāh his rabb (rabbahu) — rabb as personal lord in ethical obligation"}]}]}, "qiraat": [{"arabic": "رَبَّ", "translit": "rabba", "status": "Irreg", "type": "CE", "note": "Accusative rabba — reads rabb as ḥāl (circumstantial) or direct object of implied verb, rather than genitive apposition. Also linked to sayyid variant (s-w-d root change: sovereign-chief replacing nurturer-lord)", "source": "erquran.org"}, {"arabic": "رَبُّ", "translit": "rabbu", "status": "Irreg", "type": "CE", "note": "Nominative rabbu — reads rabb as khabar (predicate) of a new clause: \"He is rabb of the worlds.\" Restructures syntax from apposition to independent predication. Also linked to sayyid variant", "source": "erquran.org"}, {"arabic": "نُحَمِّدُ اللهَ رَبَّ", "translit": "nuḥammidu llāha rabba", "status": "shii", "type": "Stx", "note": "\"We praise Allāh, rabb of...\" — rabba in accusative as badal from Allāh (accusative). Linked to s-w-d root change: sayyid replaces rabb", "source": "erquran.org"}, {"arabic": "سَيِّدِ", "translit": "sayyidi", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution: sayyidi (master/chief) from root s-w-d replaces rabbi from r-b-b. Shifts from nurturer-educator to authority-chief — sayyid emphasizes social sovereignty while rabb emphasizes developmental care", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "204", "refs": "1:2;17:39;18:14;18:16;18:21;18:24;18:38;18:110;19:36;19:48", "note": "r-b-b + '-l-h: rabb and Allāh co-occur 204 times — complementary naming: Allāh = essence, rabb = relational function"}, {"coRoot": "'-l-m", "coRootAr": "ع ل م", "count": "136", "refs": "1:2;17:12;17:25;17:54;17:55;17:84;17:85;17:102;18:19;18:21", "note": "r-b-b + '-l-m: lord-nurturer paired with knowledge 136 times — rabb as the one who knows (17:25: rabbukum aʿlamu)"}, {"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "27", "refs": "1:2;17:79;2:30;6:1;6:45;7:43;10:10;14:1;14:39;15:98", "note": "r-b-b + h-m-d: nurturer paired with praise — in 2:30 angels say nusabbiḥu bi-ḥamdika, addressing the rabb"}, {"coRoot": "s-w-d", "coRootAr": "س و د", "count": "1", "refs": "1:2", "note": "r-b-b + s-w-d: variant-only co-occurrence — sayyid (s-w-d) replaces rabb only in shawādhdh reading of 1:2"}], "critical": [{"cat": "SEM", "pattern": "rabb = own + nurture + develop triad", "kernel": "Lane's: rabb combines milk (possession), tarbiya (nurturing), and iṣlāḥ (reformation) — three-dimensional lordship"}, {"cat": "GRAM", "pattern": "rabbi genitive: badal or ʿaṭf bayān", "kernel": "Genitive rabbi apposes li-llāhi — badal (replacement) or ʿaṭf bayān (clarification) — each yields different emphasis"}, {"cat": "ECHO", "pattern": "r-b-b links to rabbā (to nurture a child)", "kernel": "Root r-b-b underlies both rabb (lord) and tarbiya (education) — divine lordship is pedagogical, not merely sovereign"}, {"cat": "INTER", "pattern": "rabb al-ʿālamīn (1:2, 6:71, 26:16, 26:23)", "kernel": "This exact phrase rabb al-ʿālamīn recurs — Pharaoh asks \"what is rabb al-ʿālamīn?\" in 26:23, inverting the opening"}], "tag": "CRITICAL"}, {"id": 4, "arabic": "الْعَالَمِينَ", "translit": "al-ʿālamīna", "gloss": "the worlds, the realms, the knowledge-systems, all beings", "root": "ع ل م ('-l-m)", "grammar": "Genitive masculine sound plural functioning as muḍāf ilayhi (second element of iḍāfa with rabb); definite through iḍāfa chain", "semantics": ["[7C] ʿālam (singular): world, realm, universe, domain of existence; plural ʿālamūn/ʿālamīn exclusively for conscious/rational beings in classical Arabic", "[7C] Lane's: ʿālam = that by which a thing is known (ʿalāma = sign/marker); the worlds are sign-bearing entities that point beyond themselves", "[7C] Lisan al-Arab: ʿālamūn = all of creation, or: jinn, humans, and angels specifically; derived from ʿilm (knowledge) — the worlds as domains where knowledge operates", "[7C] Hans Wehr: ʿālam = world, universe; al-ʿālam al-islāmī = the Islamic world; ʿilm = knowledge, science", "[7C] Classical: ʿālam as ism al-āla (instrument noun) — the tool or domain through which something is known; each ʿālam is a lens onto the divine", "[7C] The masculine sound plural (-īn) is reserved for rational/sentient beings — if ʿālamīn meant only physical worlds, broken plural (ʿawālim) would be expected", "[M] Modern: ecosystems, knowledge systems, disciplinary domains, data environments, virtual worlds", "[F] Futuristic: simulated realities, AI-inhabited domains, quantum observation-realms, information-bearing substrates", "Core concept: all domains of sentient experience and knowledge — each ʿālam is a system through which reality is known and signified"], "occurrences": {"type": "grouped", "groups": [{"label": "A. al-ʿālamīn in rabb al-ʿālamīn construct", "count": "~44 ayahs", "examples": [{"ref": "2:197", "arabic": "ٱلْحَجُّ أَشْهُرٌۭ مَّعْلُومَٰتٌۭ ۚ فَمَن فَرَضَ فِيهِنَّ ٱلْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِى ٱلْحَجِّ ۗ وَمَا تَفْعَلُوا۟ مِنْ خَيْرٍۢ يَعْلَمْهُ ٱللَّهُ ۗ وَتَزَوَّدُوا۟ فَإِنَّ خَيْرَ ٱلزَّادِ ٱلتَّقْوَىٰ ۚ وَٱتَّقُونِ يَٰٓأُو۟لِى ٱلْأَلْبَٰبِ", "english": "The pilgrimage is in known (maʿlūmāt) months — ʿ-l-m root in \"known\" (temporal markers)"}, {"ref": "16:16", "arabic": "وَعَلَٰمَٰتٍۢ ۚ وَبِٱلنَّجْمِ هُمْ يَهْتَدُونَ", "english": "And ʿalāmāt (landmarks/signs) — and by the star they find guidance. Root ʿ-l-m as navigational markers"}]}, {"label": "B. ʿilm / yaʿlamu — knowledge/knowing verb forms", "count": "~334 ayahs", "examples": [{"ref": "22:28", "arabic": "لِّيَشْهَدُوا۟ مَنَٰفِعَ لَهُمْ وَيَذْكُرُوا۟ ٱسْمَ ٱللَّهِ فِىٓ أَيَّامٍۢ مَّعْلُومَٰتٍ عَلَىٰ مَا رَزَقَهُم مِّنۢ بَهِيمَةِ ٱلْأَنْعَٰمِ ۖ فَكُلُوا۟ مِنْهَا وَأَطْعِمُوا۟ ٱلْبَآئِسَ ٱلْفَقِيرَ", "english": "That they remember the name of Allāh in known (maʿlūmāt) days — ʿ-l-m as temporal designation"}]}]}, "qiraat": [{"arabic": "الْعَأْلَمِينَ", "translit": "al-ʿaʾlamīna", "status": "Irreg", "type": "hmz", "note": "Hamza insertion (ʿaʾlamīn) — phonetic variant does not change meaning but alters recitation rhythm; creates a breath-pause inside the word", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "'-l-h", "coRootAr": "أ ل ه", "count": "439", "refs": "1:2;18:21;18:26;2:10;2:22;2:26;2:60;2:75;2:77;2:80", "note": "'-l-m + '-l-h: knowledge-root paired with divine name 439 times — God as ultimate source and object of knowledge"}, {"coRoot": "r-b-b", "coRootAr": "ر ب ب", "count": "136", "refs": "1:2;17:12;17:25;17:54;17:55;17:84;17:85;17:102;18:19;18:21", "note": "'-l-m + r-b-b: knowledge paired with lordship — 17:25 rabbukum aʿlamu (your lord knows better)"}, {"coRoot": "h-m-d", "coRootAr": "ح م د", "count": "18", "refs": "1:2;2:30;2:267;3:188;6:45;10:10;16:75;22:5;27:15;31:25", "note": "'-l-m + h-m-d: knowledge paired with praise — in 2:30 God says \"I know what you do not\" after angels praise"}], "critical": [{"cat": "SEM", "pattern": "ʿālamīn from ʿ-l-m: worlds = knowledge-systems", "kernel": "Derived from ʿilm (knowledge) or ʿalāma (sign) — worlds are not containers but sign-bearing epistemic domains"}, {"cat": "GRAM", "pattern": "masculine sound plural (-īn) for ʿālamīn", "kernel": "Sound plural reserved for rational beings — implies sentient realms, not inert physical worlds or spaces"}, {"cat": "INTER", "pattern": "Pharaoh asks mā rabb al-ʿālamīn (26:23)", "kernel": "Same phrase used by Pharaoh as challenge — 1:2 declares what 26:23 interrogates, creating an inter-surah echo"}, {"cat": "ECHO", "pattern": "ʿ-l-m generates ʿālam + ʿilm + ʿalāma", "kernel": "One root produces world (ʿālam), knowledge (ʿilm), and sign (ʿalāma) — the worlds are known through signs"}], "tag": "CRITICAL"}], "questions": ["Why does the Quran open with a nominal (agentless) clause rather than imperative \"praise God\" — does this frame ḥamd as cosmological constant rather than human act?", "If ʿālamīn derives from ʿilm (knowledge), are the \"worlds\" epistemic domains rather than physical locations — and does the masculine plural confirm sentient realms only?", "The sayyid variant (s-w-d root) replaces rabb: does the existence of this variant preserve a semantic field where sovereignty (sayyid) and nurturing (rabb) are alternative framings of the same relationship?", "Does the genitive case variant al-ḥamdi (14-reader canonical) change ḥamd from a statement-of-fact to something embedded within a larger grammatical construction — and what is that implied construction?", "Why does the accusative variant al-ḥamda (irregular) convert the clause from declaration to action — does this preserve an older liturgical form where praise was performed rather than declared?", "The co-occurrence of h-m-d + '-l-m across 18 ayahs suggests a praise-knowledge axis: does praise require knowledge (one must know to praise) or does knowledge generate praise (knowing leads to praising)?", "In 2:30, angels say nusabbiḥu bi-ḥamdika while God says aʿlamu mā lā taʿlamūn — does this mean the angels' ḥamd is limited by their knowledge, and God's response reveals a deeper ground for ḥamd?", "Does the root r-b-b (nurture toward completion) imply that rabb al-ʿālamīn is an ongoing process — the worlds are perpetually being raised toward their completion, never static?", "The Shii variant nuḥammidu introduces human agency into an agentless clause: does this reveal a theological tension between ḥamd as cosmic fact (Sunni reading) and ḥamd as communal act (Shii reading)?", "If each ʿālam is a sign-bearing epistemic domain, does \"rabb of the ʿālamīn\" mean the nurturer of all possible knowledge-systems — including systems not yet conceived by any current intelligence?", "Does the three-tier structure (ḥamd → Allāh → rabb al-ʿālamīn) mirror a descent from abstract to concrete — from pure praise, through the divine name, to the relational function of nurturing?", "What is the phonetic significance of the sequence ḥ-l-r-ʿ (ḥamdu, li-llāhi, rabbi, ʿālamīn) — does the progression from pharyngeal ḥ through lateral l to uvular r to pharyngeal ʿ create a phonetic envelope?", "The variant s-w-d root (sayyid) carries connotations of blackness/darkness alongside mastery (3:106: faces blacken) — does this latent meaning create a tension absent in rabb?", "Can rabb al-ʿālamīn be read as \"the one who nurtures all possible realities\" — including simulated, digital, or quantum realities not visible to 7th-century readers?", "Does the absence of any verb in this ayah make it the most foundational type of Arabic sentence (jumla ismiyya) — asserting permanence, while verbal praise (as in the nuḥammidu variant) would imply temporality?"], "key": "1:2"}, "1:3": {"surah": 1, "ayah": 3, "arabic": "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "transliteration": "ar-raḥmāni r-raḥīmi", "readings": [{"text": "The One whose mercy overflows immediately and universally (raḥmān) and whose mercy endures permanently and specifically (raḥīm)", "rationale": "fa'lān pattern (raḥmān) denotes overflow and plenitude — mercy as a state of being that cannot be contained. fa'īl pattern (raḥīm) denotes a permanent quality — mercy as an enduring attribute directed toward specific recipients. Two distinct morphological patterns from the same root create complementary rather than redundant meaning."}, {"text": "The Womb-Source of all existence, the Womb-Sustainer of all existence", "rationale": "Root r-h-m is etymologically linked to raḥim (womb). Reading both divine names through the womb metaphor: ar-Raḥmān as the one from whom all creation emerges (source-function) and ar-Raḥīm as the one who continuously nurtures what has emerged (sustaining-function). This is not metaphorical mercy but ontological generativity."}, {"text": "The Boundlessly Compassionate in this world, the Specifically Merciful in the hereafter", "rationale": "Grammatical distinction: fa'lān pattern is associated with temporary but intense states, while fa'īl is associated with permanent qualities. If ar-Raḥmān covers all creation indiscriminately (including disbelievers), ar-Raḥīm may denote a targeted, selective mercy reserved for specific recipients or conditions."}, {"text": "The one whose compassion encompasses all systems (biological, ecological, cosmic), the one whose care targets individual conscious beings", "rationale": "Modern/futuristic reading: raḥmān as systemic mercy — the sustaining conditions of the universe (gravity, photosynthesis, water cycles) that enable life without discrimination. raḥīm as personal mercy — care directed at sentient, conscious entities capable of receiving and recognizing it. The distinction maps onto impersonal universal design vs personal relationship."}, {"text": "The Mercifully Generative, the Mercifully Protective — mercy as creative force and mercy as preservative force", "rationale": "From Lane's Lexicon: raḥma encompasses tenderness, compassion, AND inclination to bestow favor. ar-Raḥmān as mercy that generates (brings into existence, creates conditions for life) vs ar-Raḥīm as mercy that protects (shields from harm, maintains what exists). Two vectors of the same force: outward expansion and inward preservation."}], "structure": {"beats": [{"label": "Double Divine Attribute", "lines": [{"arabic": "ٱلرَّحْمَٰنِ", "translit": "ar-raḥmāni", "english": "The Boundlessly Merciful"}, {"arabic": "ٱلرَّحِيمِ", "translit": "ar-raḥīmi", "english": "The Enduringly Merciful"}]}], "summary": "Two genitive-case adjectives in apposition, both attributive to an implied or preceding noun (Allāh from 1:2 or rabb from 1:2). The ayah is syntactically incomplete — it depends on the previous ayah for its referent. Both words share root r-h-m but differ in morphological pattern, creating a semantic progression within a single root: from unbounded intensity (fa'lān) to enduring permanence (fa'īl). The doubling is not redundancy but complementation — two vectors of the same root-concept."}, "words": [{"id": 1, "arabic": "الرَّحْمَنِ", "translit": "ar-raḥmāni", "gloss": "the Boundlessly Merciful / the Womb-Source", "root": "ر ح م (r-h-m)", "grammar": "Definite noun, fa'lān intensive pattern, genitive case (majrūr) — functioning as an adjective (ṣifa) in apposition to a preceding noun. The definite article al- + fa'lān pattern is unique in Arabic to this divine name; fa'lān adjectives are typically indefinite.", "semantics": ["[7C] fa'ala (I): to be merciful, to have compassion, to show tenderness, to pity", "[7C] fa'ila (I): to be related through the womb (raḥim), kinship bond", "[7C] fa''ala (II): to have mercy upon (tarhama = to ask for mercy for someone)", "[7C] tafa''ala (VI): to show mutual mercy, compassion toward one another (tarāḥum)", "[7C] Lane's Lexicon: raḥma = tenderness of heart, inclination to bestow favors and beneficence, compassion requiring the exercise of beneficence", "[7C] Lane's: raḥim/raḥm = womb, kinship, blood-relationship — the physical organ and its metaphorical extension to all bonds of kinship", "[7C] Lane's: fa'lān pattern (raḥmān) = intensive/overflowing form, implies plenitude that surpasses containment — mercy as a state that overflows from the subject", "[7C] Lisan al-Arab: ar-Raḥmān is a name exclusive to God, never applied to humans — unlike raḥīm which can describe human beings", "[7C] Hans Wehr: raḥma = mercy, compassion, pity; also raḥm = relationship, kinship", "[M] Systemic mercy: the sustaining conditions of the universe (physical constants, ecological balance, biological systems) that enable existence", "[F] Generative mercy: compassion as a creative force — the capacity to bring forth, sustain, and renew complex systems at any scale", "Core concept: r-h-m encompasses womb (source of life), mercy (tenderness/compassion), and kinship (relational bond) — the root ties generativity, care, and connection into a single semantic field. ar-Raḥmān is the intensive form: mercy that overflows without limit or condition."], "occurrences": {"type": "grouped", "groups": [{"label": "A. As divine name/attribute in nominative or genitive (NOUN_PROP)", "count": "~91 ayahs", "examples": [{"ref": "1:1", "arabic": "﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "In the name of God, the Boundlessly Merciful, the Enduringly Merciful — the opening formula (basmala) pairs both names as genitive attributes of Allāh."}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And rely upon the Mighty, the Enduringly Merciful — here ar-Raḥīm is paired with al-ʿAzīz (the Mighty), showing mercy and power as complementary, not opposing."}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Irreg", "type": "CE", "note": "Case change to accusative (naṣb) — would make both names objects of praise (madḥ) or exclamatory accusative (naṣb ʿalā al-madḥ), shifting from attributive description to emphatic laudation.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Irreg", "type": "CE", "note": "Case change to nominative (rafʿ) — would make both names independent subjects/predicates, syntactically detaching them from the preceding noun and creating a standalone proclamation: 'The Merciful, The Compassionate' as complete sentences.", "source": "erquran.org"}, {"arabic": "الرَّزَّاقِ", "translit": "ar-razzāqi", "status": "shawādhdh", "type": "Lx", "note": "Lexical substitution replacing ar-Raḥmān with ar-Razzāq (the Provider) from root r-z-q. This variant replaces the mercy-attribute with a provision-attribute, suggesting an early reading tradition that saw divine mercy and divine provision as interchangeable at this position. The variant root r-z-q is NOT in the standard text of this ayah.", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "s-m-w", "coRootAr": "س م و", "count": "17", "refs": "1:1;1:1;3:129;6:12;17:110;19:93;22:5;22:65;25:6;25:48", "note": "Root r-h-m co-occurs with s-m-w (sky/heaven/elevation) — mercy linked to what is above, the elevated realm, suggesting mercy descends or originates from a transcendent source."}, {"coRoot": "w-l-y", "coRootAr": "و ل ي", "count": "15", "refs": "2:64;2:226;2:286;7:155;8:75;9:71;18:58;19:45;28:43;33:5", "note": "Root r-h-m co-occurs with w-l-y (closeness/guardianship/alliance) — mercy and protective nearness appear together, linking compassion to the concept of walī (guardian/ally)."}, {"coRoot": "r-z-q", "coRootAr": "ر ز ق", "count": "1", "refs": "1:3", "note": "Variant-sourced [v] co-occurrence: the shawādhdh reading الرَّزَّاقِ (ar-razzāqi) at this ayah creates a variant bridge between mercy (r-h-m) and provision (r-z-q), suggesting early readers saw these divine attributes as semantically adjacent."}], "critical": [{"cat": "GRAM", "pattern": "Definite al- + fa'lān pattern", "kernel": "ar-Raḥmān is the ONLY definite fa'lān adjective in Arabic — fa'lān forms are normally indefinite"}, {"cat": "SEM", "pattern": "Exclusive divine name (Lisan al-Arab)", "kernel": "Unlike raḥīm which describes humans (9:128 raʾūfun raḥīm), ar-Raḥmān is reserved exclusively for God in Arabic usage"}, {"cat": "FORM", "pattern": "fa'lān vs fa'īl from same root", "kernel": "fa'lān = overflow intensity; fa'īl = permanent quality — same root yields two mercy-modes via pattern alone"}, {"cat": "ECHO", "pattern": "r-h-m doubled across 1:1 and 1:3", "kernel": "Basmala (1:1) and this ayah (1:3) bracket 1:2 with identical ar-Raḥmān ar-Raḥīm — mercy-envelope"}, {"cat": "INTER", "pattern": "raḥmān as divine throne name (20:5)", "kernel": "ar-Raḥmānu 'alā l-'arshi stawā — Raḥmān specifically mounts the throne, linking this name to cosmic rule"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "الرَّحِيمِ", "translit": "ar-raḥīmi", "gloss": "the Enduringly Merciful / the Womb-Sustainer", "root": "ر ح م (r-h-m)", "grammar": "Definite noun, fa'īl pattern (indicates permanent quality), genitive case (majrūr) — functioning as a second adjective (ṣifa) in apposition, parallel to ar-Raḥmān. The fa'īl pattern is a standard adjectival form in Arabic (like kabīr, 'aẓīm), unlike the exceptional fa'lān of ar-Raḥmān.", "semantics": ["[7C] fa'īl pattern: permanent, enduring quality — mercy as a settled, unchanging attribute rather than an overflowing state", "[7C] Lane's Lexicon: raḥīm = one who has raḥma as a permanent attribute; applied to God AND to humans (9:128 describes the Prophet as raḥīm)", "[7C] Lisan al-Arab: raḥīm denotes specificity and continuity — mercy directed toward particular recipients over time", "[7C] Hans Wehr: raḥīm = merciful, compassionate — standard adjective usable for any merciful being", "[7C] Classical: fa'īl can function as active (fā'il meaning) OR passive (maf'ūl meaning) — raḥīm as 'the one who shows mercy' AND 'the one who is shown mercy / surrounded by mercy'", "[M] Targeted mercy: compassion directed at individual conscious beings — personalized care, as opposed to systemic universal mercy", "[F] Algorithmic mercy: in computational terms, if raḥmān is the operating system (universal conditions), raḥīm is the user-facing interface — mercy that responds to individual input and need", "Core concept: raḥīm is the settled, permanent, directed form of r-h-m mercy — less intense than raḥmān but more enduring and personally targeted. The fa'īl form encodes mercy as identity rather than state."], "occurrences": {"type": "grouped", "groups": [{"label": "A. As divine name/attribute in nominative or genitive (NOUN_PROP)", "count": "~91 ayahs", "examples": [{"ref": "1:1", "arabic": "﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "english": "In the name of God, the Boundlessly Merciful, the Enduringly Merciful — paired with ar-Raḥmān as a pair of divine attributes."}, {"ref": "26:217", "arabic": "وَتَوَكَّلْ عَلَى ٱلْعَزِيزِ ٱلرَّحِيمِ", "english": "And rely upon the Mighty, the Enduringly Merciful — ar-Raḥīm paired with al-ʿAzīz, showing mercy complements power rather than opposing it."}]}]}, "qiraat": [{"arabic": "الرَّحْمَٰنَ الرَّحِيمَ", "translit": "ar-raḥmāna r-raḥīma", "status": "Irreg", "type": "CE", "note": "Case change to accusative (naṣb) — both names become objects of praise (naṣb ʿalā al-madḥ), shifting the syntactic relationship from attribution to exclamatory laudation.", "source": "erquran.org"}, {"arabic": "الرَّحْمَٰنُ الرَّحِيمُ", "translit": "ar-raḥmānu r-raḥīmu", "status": "Irreg", "type": "CE", "note": "Case change to nominative (rafʿ) — both names become independent predicates, syntactically severed from the preceding genitive chain and standing as autonomous declarations.", "source": "erquran.org"}], "cooccurrence": [], "critical": [{"cat": "GRAM", "pattern": "fa'īl pattern — dual active/passive", "kernel": "fa'īl can mean 'one who shows mercy' (active) OR 'one encompassed by mercy' (passive) — built-in ambiguity"}, {"cat": "SEM", "pattern": "raḥīm applies to humans (9:128)", "kernel": "Prophet described as ra'ūfun raḥīm — this form bridges divine and human mercy, unlike exclusive raḥmān"}, {"cat": "ECHO", "pattern": "raḥmān→raḥīm sequence arc", "kernel": "Sequence moves from unbounded fa'lān overflow to bounded fa'īl permanence — narrowing arc from cosmic to personal"}, {"cat": "INTER", "pattern": "raḥīm paired with ghafūr ~72 times", "kernel": "ar-Raḥīm co-occurs with al-Ghafūr (Forgiving) across the Quran, binding enduring mercy to forgiveness"}, {"cat": "STRUCT", "pattern": "1:3 mirrors 1:1 (basmala echo)", "kernel": "Verbatim repeat of basmala's ar-Raḥmān ar-Raḥīm creates an inclusio — 1:2 bracketed by mercy"}], "tag": "CRITICAL"}], "questions": ["Why does the Quran use TWO names from the same root (r-h-m) in sequence rather than pairing mercy with a contrasting attribute (e.g., mercy + justice)?", "If ar-Raḥmān is exclusive to God while ar-Raḥīm can describe humans, does this ayah mark a progression from the untransferable to the transferable — from a divine state humans cannot share to one they can?", "The fa'lān pattern typically denotes temporary states (ghaḍbān = currently angry, 'aṭshān = currently thirsty). Does ar-Raḥmān paradoxically apply a temporary-state pattern to an eternal being, suggesting mercy is always 'freshly overflowing' rather than a settled fact?", "The shawādhdh variant الرَّزَّاقِ (ar-razzāqi, the Provider) replaces ar-Raḥmān with a provision-attribute. Does this suggest an early interpretive tradition where divine mercy and divine provision were seen as functionally equivalent?", "The case-change variants (nominative and accusative) detach ar-Raḥmān ar-Raḥīm from the genitive chain. If read in nominative (rafʿ), the ayah becomes a standalone declaration rather than an attribute of rabb al-'ālamīn. How does this change the theological relationship between lordship and mercy?", "Root r-h-m connects to raḥim (womb). If the divine names are read through this etymological lens, does the ayah describe God as a womb — a generative space from which all existence emerges and within which all existence is sustained?", "The repetition of ar-Raḥmān ar-Raḥīm in both 1:1 (basmala) and 1:3 creates an envelope around 1:2 (al-ḥamdu lillāhi rabbi l-'ālamīn). Is this structure intentional — framing praise and lordship within a double mercy-declaration?", "Co-occurrence data shows r-h-m paired with s-m-w (sky/height) in 17 ayahs and w-l-y (closeness/guardianship) in 15 ayahs. Does this suggest mercy operates on two axes simultaneously — descent from above (transcendence) and proximity from within (immanence)?", "If fa'īl can function as passive (maf'ūl sense), could ar-Raḥīm mean 'the one encompassed by mercy' or 'the one to whom mercy is shown'? What theological implications arise from a passive reading of a divine attribute?", "Given that ar-Raḥmān appears as a cosmic throne-name (20:5, ar-Raḥmānu 'alā l-'arshi stawā), does the sequence raḥmān→raḥīm encode a movement from cosmic sovereignty to intimate personal care?", "The phonetic similarity between the two words (both begin with ar-raḥ- and end with -ī/-ān + genitive -i) creates an almost chant-like repetition. Is the sonic near-identity part of the meaning — mercy as an echo, a reverberation, a quality that repeats and amplifies?", "Modern reading: if raḥmān is systemic mercy (universal constants enabling life) and raḥīm is personal mercy (care for individuals), does this ayah describe two scales of compassion — the macro (physics, ecology, cosmology) and the micro (consciousness, relationship, individual fate)?"], "key": "1:3"}, "1:4": {"surah": 1, "ayah": 4, "arabic": "مَٰلِكِ يَوْمِ ٱلدِّينِ", "transliteration": "māliki yawmi d-dīni", "readings": [{"text": "Owner of the day of recompense — māliki as active participle (possessor) governing yawm in iḍāfa, dīn as requital/judgment", "rationale": "Hafs standard reading: مَالِكِ is Form I active participle from m-l-k meaning \"one who owns/possesses,\" making the addressee the possessor of the entire day of reckoning — ownership implies total control over time and outcome"}, {"text": "King of the day of religion/way-of-life — maliki as nominal adjective (sovereign), dīn as \"way of life\" rather than \"judgment\"", "rationale": "The canonical variant مَلِكِ (maliki) shifts from ownership to sovereignty; combined with dīn as \"way of life\" (Lane's primary sense), the phrase becomes \"sovereign of the epoch when all ways of life are evaluated\""}, {"text": "Possessor of the epoch of debt-settlement — yawm as era/age, dīn as debt (dayn)", "rationale": "Lane's attests d-y-n as \"to owe a debt, to be indebted\" — yawm can mean epoch/era (not just a single day); the phrase becomes \"possessor of the era when all debts are settled,\" a cosmic accounting metaphor"}, {"text": "He ruled/governed the day of judgment — malaka yawma as past-tense verb + accusative", "rationale": "The Irreg variant مَلَكَ يَوْمَ recasts the entire construction: mālik becomes the verb malaka (he ruled/possessed), yawm shifts to accusative direct object; this transforms the nominal phrase into a verbal sentence asserting completed divine sovereignty"}, {"text": "Sovereign of the time-cycle of recompense — yawm as recurring temporal unit, dīn as reciprocal requital", "rationale": "yawm can denote a recurring cycle (cf. ayyām Allāh, \"days/events of God\"); dīn from dāna/yudīnu carries reciprocity — the phrase can mean \"sovereign of the recurring cycle in which every act meets its equal return,\" implying ongoing process not a single eschatological event"}], "structure": {"beats": [{"label": "Sole nominal predicate", "lines": [{"arabic": "مَٰلِكِ يَوْمِ ٱلدِّينِ", "translit": "māliki yawmi d-dīni", "english": "Owner/King of the Day of Judgment"}]}], "summary": "A single-beat ayah consisting entirely of a genitive chain (iḍāfa): mālik → yawm → al-dīn. Three nouns in construct state, no verb, no particle. The absence of a verb makes this a timeless predicate — it does not say \"He owns\" (which would locate the action in time) but presents ownership as an attribute. The triple iḍāfa telescopes from person (mālik) to time (yawm) to principle (dīn), each level narrowing the scope: who → when → what. This is the only ayah in al-Fātiḥa without a verb or particle, making it a pure noun-phrase — a title or epithet rather than a statement."}, "words": [{"id": 1, "arabic": "مَالِكِ", "translit": "māliki", "gloss": "owner, master, possessor", "root": "م ل ك (m-l-k)", "grammar": "Active participle (ism fāʿil), Form I, genitive case, masculine singular; first element of triple iḍāfa chain governing yawmi", "semantics": ["[7C] مَلَكَ (malaka, I): to own, possess, have dominion over; to control, master, restrain", "[7C] مَلَّكَ (mallaka, II): to make someone owner, to hand over possession, to empower", "[7C] أَمْلَكَ (amlaka, IV): to give in marriage; to enable possession", "[7C] مُلْك (mulk): dominion, kingdom, sovereignty, realm of authority", "[7C] مِلْك (milk): property, possession, owned thing; right of disposal", "[7C] مَالِك (mālik): owner, proprietor, possessor — one who holds right of disposal over something", "[7C] مَلِك (malik): king, sovereign, ruler — one who governs others", "[7C] مَمْلُوك (mamlūk): owned, enslaved, property of another — passive participle", "[7C] Lane's: to knead (dough) — physical manipulation/shaping (archaic, rare sense)", "[7C] Lisan al-Arab: malaka al-ʿajīn = he kneaded the dough thoroughly; malaka nafsahu = he controlled himself", "[M] Modern: sovereign authority over systems, institutions, data; administrative ownership", "[F] Futuristic: ownership of temporal domains; jurisdiction over time-dimensions; systemic control over epochs", "Core concept: authority over a thing through possession or sovereignty — the tension between mālik (owner) and malik (king) is the central qira'at question of this ayah"], "occurrences": {"type": "grouped", "groups": [{"label": "A. Active participle — owner/possessor (mālikūn, mālik al-mulk)", "count": "~3 ayahs", "examples": [{"ref": "36:71", "arabic": "أَوَلَمْ يَرَوْا۟ أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَآ أَنْعَٰمًۭا فَهُمْ لَهَا مَٰلِكُونَ", "english": "Have they not seen that We created for them, from what Our hands have made, livestock — and they are owners (mālikūn) of them?"}, {"ref": "3:26", "arabic": "قُلِ ٱللَّهُمَّ مَٰلِكَ ٱلْمُلْكِ تُؤْتِى ٱلْمُلْكَ مَن تَشَآءُ وَتَنزِعُ ٱلْمُلْكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُ ۖ بِيَدِكَ ٱلْخَيْرُ ۖ إِنَّكَ عَلَىٰ كُلِّ شَىْءٍۢ قَدِيرٌۭ", "english": "Say: O God, Owner of sovereignty (mālika l-mulk), You give sovereignty to whom You will and take sovereignty from whom You will"}]}, {"label": "B. Abstract noun — kingdom, sovereignty (mulk)", "count": "~51 ayahs", "examples": [{"ref": "6:73", "arabic": "وَهُوَ ٱلَّذِى خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلْأَرْضَ بِٱلْحَقِّ ۖ وَيَوْمَ يَقُولُ كُن فَيَكُونُ ۚ قَوْلُهُ ٱلْحَقُّ ۚ وَلَهُ ٱلْمُلْكُ يَوْمَ يُنفَخُ فِى ٱلصُّورِ ۚ عَٰلِمُ ٱلْغَيْبِ وَٱلشَّهَٰدَةِ ۚ وَهُوَ ٱلْحَكِيمُ ٱلْخَبِيرُ", "english": "He is the One who created the heavens and the earth in truth; and the day He says \"Be\" and it is — His word is the truth; and to Him belongs sovereignty (al-mulk) on the day the trumpet is blown"}, {"ref": "22:56", "arabic": "ٱلْمُلْكُ يَوْمَئِذٍۢ لِّلَّهِ يَحْكُمُ بَيْنَهُمْ ۚ فَٱلَّذِينَ ءَامَنُوا۟ وَعَمِلُوا۟ ٱلصَّٰلِحَٰتِ فِى جَنَّٰتِ ٱلنَّعِيمِ", "english": "Sovereignty (al-mulk) on that day belongs to God — He judges between them; those who believed and did righteous deeds are in gardens of bliss"}]}, {"label": "C. Concrete noun — king, angel, owned beings (malik, malak, mamlūk)", "count": "~96 ayahs", "examples": [{"ref": "21:103", "arabic": "لَا يَحْزُنُهُمُ ٱلْفَزَعُ ٱلْأَكْبَرُ وَتَتَلَقَّىٰهُمُ ٱلْمَلَٰٓئِكَةُ هَٰذَا يَوْمُكُمُ ٱلَّذِى كُنتُمْ تُوعَدُونَ", "english": "The greatest terror will not grieve them, and the angels (malā'ika) will receive them: \"This is your day which you were promised\""}]}, {"label": "D. Perfect verb — to own, possess, rule (malaka)", "count": "~16 ayahs", "examples": [{"ref": "12:76", "arabic": "فَبَدَأَ بِأَوْعِيَتِهِمْ قَبْلَ وِعَآءِ أَخِيهِ ثُمَّ ٱسْتَخْرَجَهَا مِن وِعَآءِ أَخِيهِ ۚ كَذَٰلِكَ كِدْنَا لِيُوسُفَ ۖ مَا كَانَ لِيَأْخُذَ أَخَاهُ فِى دِينِ ٱلْمَلِكِ إِلَّآ أَن يَشَآءَ ٱللَّهُ", "english": "He began with their containers before his brother's container, then extracted it from his brother's container — thus We devised for Yusuf; he could not take his brother under the law (dīn) of the king (al-malik) except that God willed"}]}]}, "qiraat": [{"arabic": "مَلِكِ", "translit": "maliki", "status": "7", "type": "Lvw", "note": "Canonical variant: shifts from \"owner/possessor\" to \"king/sovereign\" — mālik implies personal ownership and right of disposal; malik implies rule and governance over subjects. Both are mutawātir.", "source": "erquran.org"}, {"arabic": "مَلْكِ", "translit": "malki", "status": "Irreg", "type": "skn", "note": "Sukūn on lām: rare form, possibly a contraction of malik or an archaic nominal pattern; attested in some dialects as an intensified sovereignty form", "source": "erquran.org"}, {"arabic": "مِلْكِ", "translit": "milki", "status": "taṣḥīf", "type": "vw", "note": "Vowel change to kasra on mīm shifts meaning to \"property/possession of\" — the day of judgment becomes itself a possessed thing, an owned temporal domain", "source": "erquran.org"}, {"arabic": "مَلَّاكِ", "translit": "mallāki", "status": "Irreg", "type": "Lvw", "note": "Intensive form (fa''āl): \"supreme owner/great possessor\" — amplifies the ownership semantics of mālik through morphological intensification", "source": "erquran.org"}, {"arabic": "مَالِكَ", "translit": "mālika", "status": "14", "type": "CE", "note": "Accusative/vocative case: shifts from genitive adjective to direct address — \"O Owner of the Day of Judgment!\" transforms description into invocation", "source": "erquran.org"}, {"arabic": "مَلِكَ", "translit": "malika", "status": "Irreg", "type": "CE", "note": "Accusative of malik: \"O King of the Day of Judgment!\" — combines the malik/mālik variant with vocative case shift", "source": "erquran.org"}, {"arabic": "مَلَكَ يَوْمَ", "translit": "malaka yawma", "status": "Irreg", "type": "Stx|V↔︎N|CE", "note": "Recasts entire construction: verb malaka (he ruled/possessed) + accusative yawm as object — transforms nominal epithet into verbal assertion of past sovereignty", "source": "erquran.org"}, {"arabic": "مَالِكْ", "translit": "mālik", "status": "Gramm", "type": "CE", "note": "Pausal form with sukūn on kāf — grammatical variant for recitation pause, no semantic change", "source": "erquran.org"}, {"arabic": "مَلِيكِ", "translit": "malīki", "status": "shawādhdh", "type": "Lvw", "note": "Intensive form (faʿīl): \"mighty sovereign/supreme ruler\" — rare but attested pattern expressing superlative kingship", "source": "erquran.org"}, {"arabic": "مَلِكُ", "translit": "maliku", "status": "Irreg", "type": "CE", "note": "Nominative case: makes malik a predicate (\"He is the king of...\") rather than an adjective in construct — restructures the syntax", "source": "erquran.org"}, {"arabic": "مَلِكِۦ", "translit": "malikī", "status": "Irreg", "type": "madd", "note": "Extended vowel on final syllable — prolongation variant affecting recitation melody", "source": "erquran.org"}, {"arabic": "مَالِكٌ يَوْمَ", "translit": "mālikun yawma", "status": "Irreg", "type": "iḍ|CE", "note": "Nominative indefinite + accusative: breaks the iḍāfa — mālik becomes a standalone predicate, yawm becomes an adverbial accusative; \"an owner, on the day of judgment\"", "source": "erquran.org"}, {"arabic": "مَالِكُ", "translit": "māliku", "status": "Irreg", "type": "CE", "note": "Nominative definite: shifts to predicate position — \"the Owner of the Day of Judgment [is He]\"", "source": "erquran.org"}, {"arabic": "مِالِكِ", "translit": "mēliki", "status": "Irreg", "type": "im", "note": "Imāla (vowel tilting) on first syllable — dialectal pronunciation variant", "source": "erquran.org"}, {"arabic": "مَلَّاكَ", "translit": "mallāka", "status": "shii", "type": "Lvw|CE", "note": "Intensive form in accusative/vocative: Shia reading tradition — \"O Supreme Owner!\" combining intensification with direct address", "source": "erquran.org"}, {"arabic": "مَالِكًا يَوْمَ", "translit": "mālikan yawma", "status": "shawādhdh", "type": "iḍ|Tnw", "note": "Indefinite accusative + accusative yawm: breaks iḍāfa and adds tanwīn — \"an owner of a day of judgment\" with indefinite nuance", "source": "erquran.org"}, {"arabic": "مَِالِكِ", "translit": "mǣliki", "status": "Irreg", "type": "im", "note": "Imāla variant with combined vowel articulation — dialectal phonetic feature", "source": "erquran.org"}, {"arabic": "مَلِكًا يَوْمَ", "translit": "malikan yawma", "status": "shawādhdh", "type": "iḍ|Tnw|Lvw", "note": "Indefinite accusative malik + accusative yawm: combines the malik/mālik distinction with iḍāfa-breaking and tanwīn", "source": "erquran.org"}, {"arabic": "مَلِيكُ", "translit": "malīku", "status": "shawādhdh", "type": "Lvw|CE", "note": "Nominative intensive: \"the Supreme Sovereign [is He] of the Day of Judgment\" — predicate position with intensified form", "source": "erquran.org"}, {"arabic": "مَالِكِۦ", "translit": "mālikī", "status": "taṣḥīf", "type": "madd", "note": "Extended final vowel on mālik — scribal/transmission variant, prolongation", "source": "erquran.org"}], "cooccurrence": [{"coRoot": "d-y-n", "coRootAr": "د ي ن", "count": "2", "refs": "1:4;12:76", "note": "m-l-k and d-y-n co-occur in only 2 ayahs: here and 12:76 where Yusuf cannot take his brother \"in the dīn of the malik\" — strikingly parallel construction"}, {"coRoot": "y-w-m", "coRootAr": "ي و م", "count": "12", "refs": "1:4;6:73;21:103;22:56;25:22;25:25;25:26;34:40;45:27;69:17", "note": "m-l-k and y-w-m co-occur 12 times, predominantly in eschatological contexts where sovereignty is declared for \"that day\""}], "critical": [{"cat": "SEM", "pattern": "mālik vs malik: owner vs king", "kernel": "Lane's mālik = \"one who possesses a thing as his property\" vs malik = \"one who rules subjects\" — both mutawātir"}, {"cat": "GRAM", "pattern": "Active participle in iḍāfa chain", "kernel": "Genitive masculine singular ism fāʿil heading triple construct — timeless attribute, not time-bound action"}, {"cat": "INTER", "pattern": "mālik al-mulk (3:26) parallel", "kernel": "Only other mālik+mulk collocation is 3:26 — both assert total sovereignty, but 1:4 specifies temporal domain (yawm)"}, {"cat": "FORM", "pattern": "21 qira'at variants on one word", "kernel": "Most-varied word in al-Fātiḥa: 21 recorded readings spanning noun/verb, active/intensive, genitive/nominative/accusative"}, {"cat": "ECHO", "pattern": "m-l-k echoes mulk/malik/malak", "kernel": "Root appears as kingdom (mulk), king (malik), angel (malak), owned (mamlūk) — this word activates entire semantic field"}], "tag": "CRITICAL"}, {"id": 2, "arabic": "يَوْمِ", "translit": "yawmi", "gloss": "day, time-period, epoch", "root": "ي و م (y-w-m)", "grammar": "Noun, genitive case (second element of iḍāfa chain), masculine singular; governed by māliki", "semantics": [
